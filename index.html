t, đánh giá, nghiệm thu hợp đồng.<span class=\"th\" data-t=\"แต่ละฝ่ายต้องแจ้งให้อีกฝ่ายทราบทันทีเมื่อมีความขัดแย้งทางผลประโยชน์ที่เกิดขึ้นจริงหรืออาจเกิดขึ้น เกี่ยวกับผู้ที่เข้าร่วมการลงนาม การประเมิน และการตรวจรับสัญญา\"></span></p><h3 class=\"art\" data-n=\"18\"><strong>ĐIỀU 18. BẢO HIỂM</strong><span class=\"th\" data-t=\"ข้อ 18. การประกันภัย\"></span></h3><p class=\"lv1\"><span class=\"lb\">18.1</span>Bên B duy trì bảo hiểm tai nạn lao động cho người lao động của mình và bảo hiểm trách nhiệm bên thứ ba / trách nhiệm nghề nghiệp với hạn mức tối thiểu <span class=\"fx\" data-k=\"SỐ TIỀN\"></span> VNĐ/sự kiện; cung cấp bản sao giấy chứng nhận khi Bên A yêu cầu. Bên A duy trì bảo hiểm tài sản, gián đoạn kinh doanh cho thiết bị và cơ sở của mình.<span class=\"th\" data-t=\"ฝ่าย B รักษากรมธรรม์ประกันอุบัติเหตุจากการทำงานสำหรับลูกจ้างของตน และประกันภัยความรับผิดต่อบุคคลที่สาม / ความรับผิดทางวิชาชีพ ด้วยวงเงินขั้นต่ำ 【SỐ TIỀN】 VNĐ/เหตุการณ์; จัดส่งสำเนาใบรับรองเมื่อฝ่าย A ร้องขอ ฝ่าย A รักษากรมธรรม์ประกันภัยทรัพย์สินและประกันภัยการหยุดชะงักของธุรกิจสำหรับอุปกรณ์และสถานประกอบการของตน\"></span></p><h3 class=\"art\" data-n=\"19\"><strong>ĐIỀU 19. LUẬT ÁP DỤNG VÀ GIẢI QUYẾT TRANH CHẤP</strong><span class=\"th\" data-t=\"ข้อ 19. กฎหมายที่ใช้บังคับและการระงับข้อพิพาท\"></span></h3><p class=\"lv1\"><span class=\"lb\">19.1</span>Hợp đồng chịu sự điều chỉnh của pháp luật Việt Nam.<span class=\"th\" data-t=\"สัญญานี้อยู่ภายใต้บังคับของกฎหมายเวียดนาม\"></span></p><p class=\"lv1\"><span class=\"lb\">19.2</span>Tranh chấp được giải quyết trước hết bằng thương lượng, hòa giải thiện chí trong <span class=\"fx\" data-k=\"30\"></span> ngày kể từ ngày một Bên gửi thông báo tranh chấp bằng văn bản nêu rõ nội dung, căn cứ và yêu cầu.<span class=\"th\" data-t=\"ข้อพิพาทให้ระงับเป็นลำดับแรกโดยการเจรจาและไกล่เกลี่ยด้วยความสุจริตภายใน 【30】 วัน นับจากวันที่ฝ่ายหนึ่งส่งหนังสือแจ้งข้อพิพาทเป็นลายลักษณ์อักษรระบุเนื้อหา ฐาน และข้อเรียกร้องอย่างชัดเจน\"></span></p><p class=\"lv1\"><span class=\"lb\">19.3</span>Nếu không giải quyết được, tranh chấp được đưa ra (chỉ chọn một): <span class=\"fx\" data-k=\"TÒA ÁN NHÂN DÂN CÓ THẨM QUYỀN TẠI (TỈNH/THÀNH PHỐ) / TRUNG TÂM TRỌNG TÀI QUỐC TẾ VIỆT NAM (VIAC), LUẬT TỐ TỤNG VIAC, 01 TRỌNG TÀI VIÊN, TRỤ SỞ TRỌNG TÀI TẠI (ĐỊA ĐIỂM), NGÔN NGỮ TIẾNG VIỆT\"></span>. Nếu chọn trọng tài, thỏa thuận này là thỏa thuận trọng tài độc lập, phán quyết là chung thẩm.<span class=\"th\" data-t=\"หากระงับไม่ได้ ให้นำข้อพิพาทเสนอต่อ (เลือกเพียงอย่างเดียว): 【TÒA ÁN NHÂN DÂN CÓ THẨM QUYỀN TẠI (TỈNH/THÀNH PHỐ) / TRUNG TÂM TRỌNG TÀI QUỐC TẾ VIỆT NAM (VIAC), LUẬT TỐ TỤNG VIAC, 01 TRỌNG TÀI VIÊN, TRỤ SỞ TRỌNG TÀI TẠI (ĐỊA ĐIỂM), NGÔN NGỮ TIẾNG VIỆT】 หากเลือกอนุญาโตตุลาการ ข้อตกลงนี้เป็นข้อตกลงอนุญาโตตุลาการที่เป็นอิสระ และคำชี้ขาดเป็นที่สุด\"></span></p><p class=\"lv1\"><span class=\"lb\">19.4</span>Trong thời gian giải quyết tranh chấp, Các Bên tiếp tục thực hiện các phần nghĩa vụ không bị tranh chấp.<span class=\"th\" data-t=\"ในระหว่างการระงับข้อพิพาท ทั้งสองฝ่ายต้องปฏิบัติตามภาระผูกพันในส่วนที่ไม่มีข้อพิพาทต่อไป\"></span></p><p class=\"lv1\"><span class=\"lb\">19.5</span>Hợp đồng lập bằng tiếng Việt. Bản dịch sang tiếng Anh hoặc tiếng Thái (nếu có) chỉ để tham khảo; khi có khác biệt, bản tiếng Việt có giá trị áp dụng.<span class=\"th\" data-t=\"สัญญาจัดทำเป็นภาษาเวียดนาม ฉบับแปลเป็นภาษาอังกฤษหรือภาษาไทย (หากมี) ใช้เพื่อการอ้างอิงเท่านั้น หากมีความแตกต่าง ให้ถือฉบับภาษาเวียดนามเป็นฉบับที่ใช้บังคับ\"></span></p><h3 class=\"art\" data-n=\"20\"><strong>ĐIỀU 20. ĐIỀU KHOẢN CHUNG VÀ HIỆU LỰC</strong><span class=\"th\" data-t=\"ข้อ 20. ข้อกำหนดทั่วไปและการมีผลใช้บังคับ\"></span></h3><p class=\"lv1\"><span class=\"lb\">20.1</span>Thông báo phải bằng văn bản, gửi tới địa chỉ, email của đại diện nhận thông báo nêu ở phần đầu Hợp đồng (hoặc địa chỉ được thông báo thay đổi bằng văn bản). Thông báo gửi bằng email có hiệu lực khi hệ thống không báo lỗi và đã gửi bản gốc trong <span class=\"fx\" data-k=\"05\"></span> ngày làm việc nếu Bên nhận yêu cầu.<span class=\"th\" data-t=\"การแจ้งต้องเป็นลายลักษณ์อักษร ส่งไปยังที่อยู่และอีเมลของผู้แทนผู้รับแจ้งที่ระบุไว้ในส่วนต้นของสัญญา (หรือที่อยู่ที่แจ้งเปลี่ยนแปลงเป็นลายลักษณ์อักษร) การแจ้งทางอีเมลมีผลเมื่อระบบไม่แจ้งข้อผิดพลาด และได้ส่งฉบับจริงภายใน 【05】 วันทำการ หากฝ่ายผู้รับร้องขอ\"></span></p><p class=\"lv1\"><span class=\"lb\">20.2</span>Không bên nào được chuyển nhượng quyền, nghĩa vụ theo hợp đồng cho bên thứ ba khi chưa có chấp thuận bằng văn bản của Bên kia, trừ quyền nhận tiền được chuyển nhượng theo quy định pháp luật và thông báo cho Bên có nghĩa vụ.<span class=\"th\" data-t=\"ห้ามฝ่ายใดโอนสิทธิและภาระผูกพันตามสัญญาให้บุคคลที่สามโดยยังไม่ได้รับความยินยอมเป็นลายลักษณ์อักษรจากอีกฝ่าย เว้นแต่สิทธิในการรับเงินที่โอนได้ตามกฎหมายและแจ้งให้ฝ่ายที่มีหน้าที่ทราบ\"></span></p><p class=\"lv1\"><span class=\"lb\">20.3</span>Mọi sửa đổi, bổ sung chỉ có hiệu lực khi lập thành văn bản có chữ ký của người có thẩm quyền của cả hai Bên. Phụ lục là một phần không tách rời; khi có mâu thuẫn, thứ tự ưu tiên: (i) Phụ lục điều kiện đặc biệt được hai Bên ký, (ii) nội dung Hợp đồng, (iii) các Phụ lục còn lại.<span class=\"th\" data-t=\"การแก้ไขเพิ่มเติมทั้งหมดมีผลต่อเมื่อจัดทำเป็นลายลักษณ์อักษรและมีลายมือชื่อของผู้มีอำนาจของทั้งสองฝ่าย ภาคผนวกเป็นส่วนหนึ่งของสัญญาที่แยกจากกันไม่ได้ เมื่อมีความขัดแย้งให้ใช้ลำดับความสำคัญดังนี้: (i) ภาคผนวกเงื่อนไขพิเศษที่ทั้งสองฝ่ายลงนาม (ii) เนื้อหาของสัญญา (iii) ภาคผนวกอื่น ๆ\"></span></p><p class=\"lv1\"><span class=\"lb\">20.4</span>Nếu một điều khoản bị tuyên vô hiệu hoặc không thể thi hành, các điều khoản còn lại vẫn có hiệu lực; Các Bên thương lượng điều khoản thay thế gần nhất với ý chí ban đầu.<span class=\"th\" data-t=\"หากข้อกำหนดใดถูกวินิจฉัยว่าเป็นโมฆะหรือไม่อาจบังคับใช้ได้ ข้อกำหนดที่เหลือยังคงมีผลบังคับ; ทั้งสองฝ่ายต้องเจรจาข้อกำหนดทดแทนที่ใกล้เคียงกับเจตนารมณ์เดิมมากที่สุด\"></span></p><p class=\"lv1\"><span class=\"lb\">20.5</span>Hợp đồng có hiệu lực từ ngày <span class=\"fx\" data-k=\"NGÀY KÝ / ĐIỀU KIỆN CÓ HIỆU LỰC\"></span>, lập thành <span class=\"fx\" data-k=\"04\"></span> bản có giá trị như nhau, mỗi Bên giữ <span class=\"fx\" data-k=\"02\"></span> bản.<span class=\"th\" data-t=\"สัญญามีผลตั้งแต่วันที่ 【NGÀY KÝ / ĐIỀU KIỆN CÓ HIỆU LỰC】 จัดทำเป็น 【04】 ฉบับ มีค่าเท่ากัน โดยแต่ละฝ่ายเก็บไว้ 【02】 ฉบับ\"></span></p><div class=\"tw2\"><table class=\"ct\"><tr><th>ĐẠI DIỆN BÊN A<span class=\"th\" data-t=\"ผู้แทนฝ่าย A\"></span></th><th>ĐẠI DIỆN BÊN B<span class=\"th\" data-t=\"ผู้แทนฝ่าย B\"></span></th></tr><tr><td>(Ký, ghi rõ họ tên, chức danh, đóng dấu nếu có) <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ / NGÀY\"></span><span class=\"th\" data-t=\"(ลงนาม ระบุชื่อ-นามสกุล ตำแหน่ง และประทับตราหากมี) 【HỌ TÊN / CHỨC VỤ / NGÀY】\"></span></td><td>(Ký, ghi rõ họ tên, chức danh, đóng dấu nếu có) <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ / NGÀY\"></span><span class=\"th\" data-t=\"(ลงนาม ระบุชื่อ-นามสกุล ตำแหน่ง และประทับตราหากมี) 【HỌ TÊN / CHỨC VỤ / NGÀY】\"></span></td></tr></table></div><h3 class=\"ann\" data-n=\"01\"><strong>PHỤ LỤC 01 – DANH MỤC THIẾT BỊ VÀ PHẠM VI DỊCH VỤ</strong><span class=\"th\" data-t=\"ภาคผนวก 01 – รายการอุปกรณ์และขอบเขตบริการ\"></span></h3><div class=\"tw2\"><table class=\"ct\"><tr><th>STT<span class=\"th\" data-t=\"ลำดับ\"></span></th><th>Thiết bị / hệ thống<span class=\"th\" data-t=\"อุปกรณ์ / ระบบ\"></span></th><th>Mã / Serial<span class=\"th\" data-t=\"รหัส / Serial\"></span></th><th>Vị trí<span class=\"th\" data-t=\"ตำแหน่ง\"></span></th><th>Hạng mục bảo trì<span class=\"th\" data-t=\"รายการบำรุงรักษา\"></span></th><th>Chu kỳ<span class=\"th\" data-t=\"รอบ\"></span></th></tr><tr><td>1</td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>2</td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr></table></div><h3 class=\"ann\" data-n=\"02\"><strong>PHỤ LỤC 02 – SLA VÀ BẢNG PHÍ</strong><span class=\"th\" data-t=\"ภาคผนวก 02 – SLA และตารางค่าบริการ\"></span></h3><div class=\"tw2\"><table class=\"ct\"><tr><th>Mức độ<span class=\"th\" data-t=\"ระดับ\"></span></th><th>Định nghĩa<span class=\"th\" data-t=\"คำนิยาม\"></span></th><th>Phản hồi<span class=\"th\" data-t=\"การตอบสนอง\"></span></th><th>Có mặt<span class=\"th\" data-t=\"การเข้าถึงสถานที่\"></span></th><th>Giảm phí nếu vi phạm<span class=\"th\" data-t=\"การลดค่าบริการหากละเมิด\"></span></th></tr><tr><td>Khẩn cấp<span class=\"th\" data-t=\"เร่งด่วน\"></span></td><td>Dừng sản xuất hoặc rủi ro an toàn<span class=\"th\" data-t=\"หยุดการผลิตหรือมีความเสี่ยงด้านความปลอดภัย\"></span></td><td><span class=\"fx\" data-k=\"\"></span> giờ<span class=\"th\" data-t=\"【】 ชั่วโมง\"></span></td><td><span class=\"fx\" data-k=\"\"></span> giờ<span class=\"th\" data-t=\"【】 ชั่วโมง\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Cao<span class=\"th\" data-t=\"สูง\"></span></td><td>Giảm công suất<span class=\"th\" data-t=\"กำลังการผลิตลดลง\"></span></td><td><span class=\"fx\" data-k=\"\"></span> giờ<span class=\"th\" data-t=\"【】 ชั่วโมง\"></span></td><td><span class=\"fx\" data-k=\"\"></span> giờ<span class=\"th\" data-t=\"【】 ชั่วโมง\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Thường<span class=\"th\" data-t=\"ปกติ\"></span></td><td>Không ảnh hưởng vận hành<span class=\"th\" data-t=\"ไม่กระทบต่อการดำเนินงาน\"></span></td><td><span class=\"fx\" data-k=\"\"></span> ngày<span class=\"th\" data-t=\"【】 วัน\"></span></td><td><span class=\"fx\" data-k=\"\"></span> ngày<span class=\"th\" data-t=\"【】 วัน\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr></table></div><p>Bảng phí giờ công / phụ tùng: <span class=\"fx\" data-k=\"ĐÍNH KÈM\"></span><span class=\"th\" data-t=\"ตารางค่าแรงรายชั่วโมง / อะไหล่: 【ĐÍNH KÈM】\"></span></p><h3 class=\"ann\" data-n=\"03\"><strong>PHỤ LỤC 03 – HSE VÀ QUY TRÌNH VÀO KHU VỰC</strong><span class=\"th\" data-t=\"ภาคผนวก 03 – HSE และขั้นตอนการเข้าพื้นที่\"></span></h3><p>Quy định an toàn, khử trùng/an toàn sinh học (trại, nhà máy thức ăn, thực phẩm), LOTO, giấy phép làm việc: <span class=\"fx\" data-k=\"TÀI LIỆU CỦA BÊN A\"></span><span class=\"th\" data-t=\"ข้อกำหนดด้านความปลอดภัย การฆ่าเชื้อ/ความปลอดภัยทางชีวภาพ (ฟาร์ม โรงงานอาหารสัตว์ อาหาร) LOTO ใบอนุญาตทำงาน: 【TÀI LIỆU CỦA BÊN A】\"></span></p><h3 class=\"ann\" data-n=\"04\"><strong>PHỤ LỤC 04 – MẪU BIÊN BẢN DỊCH VỤ</strong><span class=\"th\" data-t=\"ภาคผนวก 04 – แบบรายงานบริการ\"></span></h3><div class=\"tw2\"><table class=\"ct\"><tr><th>Ngày / giờ<span class=\"th\" data-t=\"วันที่ / เวลา\"></span></th><th>Thiết bị<span class=\"th\" data-t=\"อุปกรณ์\"></span></th><th>Mô tả sự cố / công việc<span class=\"th\" data-t=\"รายละเอียดเหตุขัดข้อง / งาน\"></span></th><th>Phụ tùng thay<span class=\"th\" data-t=\"อะไหล่ที่เปลี่ยน\"></span></th><th>Thời gian làm việc<span class=\"th\" data-t=\"เวลาทำงาน\"></span></th><th>Kết quả<span class=\"th\" data-t=\"ผลลัพธ์\"></span></th><th>Chữ ký Bên A<span class=\"th\" data-t=\"ลายมือชื่อฝ่าย A\"></span></th><th>Chữ ký Bên B<span class=\"th\" data-t=\"ลายมือชื่อฝ่าย B\"></span></th></tr><tr><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr></table></div><h3 class=\"ann\" data-n=\"05\"><strong>PHỤ LỤC 05 – ĐỐI CHIẾU NỘI BỘ BACK-TO-BACK VỚI NHÀ CUNG CẤP (KHÔNG GỬI KHÁCH HÀNG)</strong><span class=\"th\" data-t=\"ภาคผนวก 05 – ตารางเทียบภายในแบบ Back-to-Back กับผู้ขาย/ผู้จัดหา (ไม่ส่งให้ลูกค้า)\"></span></h3><p>Tài liệu nội bộ KSP – xóa phụ lục này trước khi gửi cho đối tác. Mục đích: bảo đảm hợp đồng mua (Supplier) khớp với hợp đồng bán (Owner) về giá, tiến độ, chất lượng, bảo hành, phạt và bảo lãnh.<span class=\"th\" data-t=\"เอกสารภายในของ KSP – ให้ลบภาคผนวกนี้ก่อนส่งให้คู่ค้า วัตถุประสงค์: เพื่อให้แน่ใจว่าสัญญาซื้อ (Supplier) สอดคล้องกับสัญญาขาย (Owner) ในเรื่องราคา กำหนดการ คุณภาพ การรับประกันผลงาน ค่าปรับ และหนังสือค้ำประกัน\"></span></p><div class=\"tw2\"><table class=\"ct\"><tr><th>Hạng mục<span class=\"th\" data-t=\"รายการ\"></span></th><th>Hợp đồng bán (Owner)<span class=\"th\" data-t=\"สัญญาขาย (Owner)\"></span></th><th>Hợp đồng mua (Supplier) số <span class=\"fx\" data-k=\"SỐ\"></span><span class=\"th\" data-t=\"สัญญาซื้อ (Supplier) เลขที่ 【SỐ】\"></span></th><th>Chênh lệch / rủi ro KSP<span class=\"th\" data-t=\"ความแตกต่าง / ความเสี่ยงของ KSP\"></span></th><th>Biện pháp / người duyệt<span class=\"th\" data-t=\"มาตรการ / ผู้อนุมัติ\"></span></th></tr><tr><td>Giá trị / giá<span class=\"th\" data-t=\"มูลค่า / ราคา\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Tiến độ / ngày hoàn thành<span class=\"th\" data-t=\"กำหนดการ / วันที่แล้วเสร็จ\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Thời hạn thanh toán<span class=\"th\" data-t=\"กำหนดเวลาชำระเงิน\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Tạm ứng / bảo lãnh<span class=\"th\" data-t=\"เงินล่วงหน้า / หนังสือค้ำประกัน\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Phạt chậm / mức trần<span class=\"th\" data-t=\"ค่าปรับกรณีล่าช้า / เพดานสูงสุด\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Bảo hành (thời hạn, ngày bắt đầu, giữ lại)<span class=\"th\" data-t=\"การรับประกันผลงาน (ระยะเวลา วันเริ่มต้น เงินประกันผลงานที่กักไว้)\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Giới hạn trách nhiệm<span class=\"th\" data-t=\"ขีดจำกัดความรับผิด\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Quyền chấm dứt<span class=\"th\" data-t=\"สิทธิในการเลิกสัญญา\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Nghiệm thu / hồ sơ chất lượng<span class=\"th\" data-t=\"การตรวจรับ / เอกสารด้านคุณภาพ\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>An toàn, bảo hiểm<span class=\"th\" data-t=\"ความปลอดภัย การประกันภัย\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr></table></div>", "o3": "<p class=\"ctr\">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM<span class=\"th\" data-t=\"สาธารณรัฐสังคมนิยมเวียดนาม\"></span></p><p class=\"ctr\">Độc lập - Tự do - Hạnh phúc<span class=\"th\" data-t=\"เอกราช - เสรีภาพ - ความสุข\"></span></p><p class=\"ctr\"><strong>HỢP ĐỒNG MUA BÁN HÀNG HÓA VÀ THIẾT BỊ TIÊU CHUẨN</strong><span class=\"th\" data-t=\"สัญญาซื้อขายสินค้าและอุปกรณ์มาตรฐาน\"></span></p><p class=\"ctr\">Số: <span class=\"fx\" data-k=\"SỐ HỢP ĐỒNG\"></span> | Dự án / PO: <span class=\"fx\" data-k=\"DỰ ÁN / MÃ PO / MÃ KHÁCH HÀNG\"></span><span class=\"th\" data-t=\"เลขที่: 【SỐ HỢP ĐỒNG】 | โครงการ / PO: 【DỰ ÁN / MÃ PO / MÃ KHÁCH HÀNG】\"></span></p><p>– Căn cứ Bộ luật Dân sự số 91/2015/QH13 và văn bản sửa đổi, bổ sung có hiệu lực tại thời điểm ký;<span class=\"th\" data-t=\"– โดยอาศัยประมวลกฎหมายแพ่ง ฉบับที่ 91/2015/QH13 และเอกสารแก้ไข เพิ่มเติมที่มีผลบังคับใช้ ณ เวลาลงนาม;\"></span></p><p>– Căn cứ Luật Thương mại số 36/2005/QH11 và văn bản hướng dẫn;<span class=\"th\" data-t=\"– อาศัยพระราชบัญญัติการพาณิชย์ ฉบับที่ 36/2005/QH11 และเอกสารที่ให้แนวทางปฏิบัติ;\"></span></p><p>– Căn cứ Luật Chất lượng sản phẩm, hàng hóa số 05/2007/QH12 (sửa đổi, bổ sung nếu có) và quy định về ghi nhãn, xuất xứ hàng hóa trong phạm vi áp dụng;<span class=\"th\" data-t=\"– อาศัยพระราชบัญญัติคุณภาพผลิตภัณฑ์และสินค้า ฉบับที่ 05/2007/QH12 (ที่แก้ไขเพิ่มเติม หากมี) และบทบัญญัติว่าด้วยการติดฉลากและแหล่งกำเนิดสินค้า ภายในขอบเขตที่ใช้บังคับ;\"></span></p><p>– Căn cứ báo giá, catalogue, thông số kỹ thuật tiêu chuẩn của KSP và nhu cầu của Bên mua.<span class=\"th\" data-t=\"– อาศัยใบเสนอราคา แคตตาล็อก ข้อกำหนดทางเทคนิคมาตรฐานของ KSP และความต้องการของผู้ซื้อ\"></span></p><p>Hôm nay, ngày <span class=\"fx\" data-k=\"NGÀY\"></span> tháng <span class=\"fx\" data-k=\"THÁNG\"></span> năm <span class=\"fx\" data-k=\"NĂM\"></span>, Các Bên gồm:<span class=\"th\" data-t=\"วันนี้ วันที่ 【NGÀY】 เดือน 【THÁNG】 พ.ศ./ค.ศ. 【NĂM】 คู่สัญญาประกอบด้วย:\"></span></p><p class=\"sub\"><strong>BÊN A – BÊN MUA (KHÁCH HÀNG): <span class=\"fx\" data-k=\"TÊN PHÁP LÝ KHÁCH HÀNG\"></span></strong><span class=\"th\" data-t=\"ฝ่าย A – ผู้ซื้อ (ลูกค้า): 【TÊN PHÁP LÝ KHÁCH HÀNG】\"></span></p><p>Đại diện: <span class=\"fx\" data-k=\"HỌ TÊN NGƯỜI KÝ\"></span> Chức vụ: <span class=\"fx\" data-k=\"CHỨC VỤ\"></span> Căn cứ thẩm quyền: <span class=\"fx\" data-k=\"ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY\"></span><span class=\"th\" data-t=\"ผู้แทน: 【HỌ TÊN NGƯỜI KÝ】 ตำแหน่ง: 【CHỨC VỤ】 ฐานอำนาจ: 【ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY】\"></span></p><p>Địa chỉ: <span class=\"fx\" data-k=\"ĐỊA CHỈ ĐĂNG KÝ\"></span> Mã số thuế / Mã số doanh nghiệp: <span class=\"fx\" data-k=\"MST / GCN ĐKDN\"></span><span class=\"th\" data-t=\"ที่อยู่: 【ĐỊA CHỈ ĐĂNG KÝ】 เลขประจำตัวผู้เสียภาษี / รหัสวิสาหกิจ: 【MST / GCN ĐKDN】\"></span></p><p>Tài khoản: <span class=\"fx\" data-k=\"CHỦ TÀI KHOẢN / SỐ TÀI KHOẢN / NGÂN HÀNG\"></span> Đại diện nhận thông báo: <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ\"></span> Email: <span class=\"fx\" data-k=\"EMAIL\"></span><span class=\"th\" data-t=\"บัญชี: 【CHỦ TÀI KHOẢN / SỐ TÀI KHOẢN / NGÂN HÀNG】 ผู้แทนรับหนังสือแจ้ง: 【HỌ TÊN / CHỨC VỤ】 อีเมล: 【EMAIL】\"></span></p><p class=\"sub\"><strong>BÊN B – BÊN BÁN: CÔNG TY TNHH KSP VIỆT NAM <span class=\"fx\" data-k=\"CHI NHÁNH / ĐƠN VỊ THỰC HIỆN, NẾU CÓ\"></span></strong><span class=\"th\" data-t=\"ฝ่าย B – ผู้ขาย: บริษัท KSP เวียดนาม จำกัด (CÔNG TY TNHH KSP VIỆT NAM) 【CHI NHÁNH / ĐƠN VỊ THỰC HIỆN, NẾU CÓ】\"></span></p><p>Đại diện: <span class=\"fx\" data-k=\"HỌ TÊN NGƯỜI KÝ\"></span> Chức vụ: <span class=\"fx\" data-k=\"CHỨC VỤ\"></span> Căn cứ thẩm quyền: <span class=\"fx\" data-k=\"ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY\"></span><span class=\"th\" data-t=\"ผู้แทน: 【HỌ TÊN NGƯỜI KÝ】 ตำแหน่ง: 【CHỨC VỤ】 ฐานอำนาจ: 【ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY】\"></span></p><p>Địa chỉ: <span class=\"fx\" data-k=\"ĐỊA CHỈ PHÁP LÝ KSP – KIỂM TRA ĐĂNG KÝ HIỆN HÀNH\"></span> Mã số thuế: <span class=\"fx\" data-k=\"MST KSP / CHI NHÁNH\"></span><span class=\"th\" data-t=\"ที่อยู่: 【ĐỊA CHỈ PHÁP LÝ KSP – KIỂM TRA ĐĂNG KÝ HIỆN HÀNH】 เลขประจำตัวผู้เสียภาษี: 【MST KSP / CHI NHÁNH】\"></span></p><p>Tài khoản: <span class=\"fx\" data-k=\"SỐ TÀI KHOẢN / NGÂN HÀNG KSP\"></span> Đại diện nhận thông báo: <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ\"></span> Email: <span class=\"fx\" data-k=\"EMAIL\"></span><span class=\"th\" data-t=\"บัญชี: 【SỐ TÀI KHOẢN / NGÂN HÀNG KSP】 ผู้แทนรับหนังสือแจ้ง: 【HỌ TÊN / CHỨC VỤ】 อีเมล: 【EMAIL】\"></span></p><p>Hai Bên thỏa thuận ký kết hợp đồng mua bán hàng hóa, thiết bị tiêu chuẩn của KSP (“Hợp đồng”) với các điều khoản sau:<span class=\"th\" data-t=\"คู่สัญญาทั้งสองฝ่ายตกลงทำสัญญาซื้อขายสินค้าและอุปกรณ์มาตรฐานของ KSP (“สัญญา”) โดยมีข้อกำหนดดังต่อไปนี้:\"></span></p><h3 class=\"art\" data-n=\"1\"><strong>ĐIỀU 1. HÀNG HÓA, QUY CÁCH VÀ HỒ SƠ HỢP ĐỒNG</strong><span class=\"th\" data-t=\"ข้อ 1. สินค้า ข้อกำหนดทางเทคนิค และเอกสารสัญญา\"></span></h3><p class=\"lv1\"><span class=\"lb\">1.1</span>Bên B bán và Bên A mua hàng hóa, thiết bị nêu tại Phụ lục 01 (tên, model, thông số, số lượng, đơn giá). Thông số kỹ thuật theo catalogue / tài liệu kỹ thuật tiêu chuẩn phiên bản <span class=\"fx\" data-k=\"PHIÊN BẢN / NGÀY\"></span>.<span class=\"th\" data-t=\"ฝ่าย B ขายและฝ่าย A ซื้อสินค้าและอุปกรณ์ตามที่ระบุในภาคผนวก 01 (ชื่อ รุ่น ข้อกำหนดทางเทคนิค จำนวน ราคาต่อหน่วย) ข้อกำหนดทางเทคนิคเป็นไปตามแคตตาล็อก / เอกสารทางเทคนิคมาตรฐาน เวอร์ชัน 【PHIÊN BẢN / NGÀY】\"></span></p><p class=\"lv1\"><span class=\"lb\">1.2</span>Hồ sơ hợp đồng gồm: Hợp đồng; Phụ lục 01 (hàng hóa và giá); Phụ lục 02 (giao hàng, thanh toán); Phụ lục 03 (bảo hành); Phụ lục 04 (mẫu biên bản giao nhận); Phụ lục 05 (nội bộ KSP). Báo giá, catalogue được tham chiếu chỉ là một phần khi được liệt kê tại Phụ lục 01.<span class=\"th\" data-t=\"เอกสารสัญญาประกอบด้วย: สัญญา; ภาคผนวก 01 (สินค้าและราคา); ภาคผนวก 02 (การส่งมอบสินค้า การชำระเงิน); ภาคผนวก 03 (การรับประกัน); ภาคผนวก 04 (แบบรายงานการส่งมอบ-รับมอบ); ภาคผนวก 05 (ภายในของ KSP) ใบเสนอราคาและแคตตาล็อกที่อ้างอิงจะเป็นส่วนหนึ่งของสัญญาก็ต่อเมื่อระบุไว้ในภาคผนวก 01\"></span></p><p class=\"lv1\"><span class=\"lb\">1.3</span>Bên B được cải tiến thiết kế, linh kiện không làm giảm thông số cam kết tại Phụ lục 01; thay đổi khác phải có chấp thuận bằng văn bản của Bên A.<span class=\"th\" data-t=\"ฝ่าย B มีสิทธิปรับปรุงการออกแบบและชิ้นส่วนโดยไม่ลดทอนข้อกำหนดทางเทคนิคที่รับรองไว้ในภาคผนวก 01; การเปลี่ยนแปลงอื่นต้องได้รับความเห็นชอบเป็นลายลักษณ์อักษรจากฝ่าย A\"></span></p><h3 class=\"art\" data-n=\"2\"><strong>ĐIỀU 2. GIÁ VÀ THUẾ</strong><span class=\"th\" data-t=\"ข้อ 2. ราคาและภาษี\"></span></h3><p class=\"lv1\"><span class=\"lb\">2.1</span>Tổng giá trước VAT: <span class=\"fx\" data-k=\"SỐ TIỀN\"></span> VNĐ; VAT <span class=\"fx\" data-k=\"8/10\"></span>%: <span class=\"fx\" data-k=\"SỐ TIỀN\"></span> VNĐ; tổng: <span class=\"fx\" data-k=\"SỐ TIỀN\"></span> VNĐ (bằng chữ: <span class=\"fx\" data-k=\"\"></span>). Giá giao tại <span class=\"fx\" data-k=\"KHO BÊN B / CÔNG TRÌNH / NHÀ MÁY BÊN A\"></span> theo điều kiện <span class=\"fx\" data-k=\"CHỌN: GIAO TẠI KHO / ĐÃ GỒM VẬN CHUYỂN / ĐÃ GỒM LẮP ĐẶT\"></span>.<span class=\"th\" data-t=\"ราคารวมก่อนภาษีมูลค่าเพิ่ม (VAT): 【SỐ TIỀN】 VNĐ; ภาษีมูลค่าเพิ่ม (VAT) 【8/10】 %: 【SỐ TIỀN】 VNĐ; รวมทั้งสิ้น: 【SỐ TIỀN】 VNĐ (ตัวอักษร: 【】) ราคาส่งมอบที่ 【KHO BÊN B / CÔNG TRÌNH / NHÀ MÁY BÊN A】 ตามเงื่อนไข 【CHỌN: GIAO TẠI KHO / ĐÃ GỒM VẬN CHUYỂN / ĐÃ GỒM LẮP ĐẶT】\"></span></p><p class=\"lv1\"><span class=\"lb\">2.2</span>Giá có hiệu lực <span class=\"fx\" data-k=\"SỐ\"></span> ngày kể từ ngày báo giá; sau đó hoặc khi có biến động lớn về giá nhập khẩu, tỷ giá, nguyên vật liệu, Bên B có quyền điều chỉnh bằng thông báo trước <span class=\"fx\" data-k=\"07\"></span> ngày đối với phần chưa giao, trừ phần đã nhận tạm ứng.<span class=\"th\" data-t=\"ราคามีผลใช้บังคับ 【SỐ】 วันนับจากวันที่เสนอราคา; หลังจากนั้น หรือเมื่อมีความผันผวนของราคานำเข้า อัตราแลกเปลี่ยน หรือวัตถุดิบอย่างมาก ฝ่าย B มีสิทธิปรับราคาโดยแจ้งล่วงหน้า 【07】 วันสำหรับส่วนที่ยังไม่ได้ส่งมอบ เว้นแต่ส่วนที่ได้รับเงินล่วงหน้าแล้ว\"></span></p><p class=\"lv1\"><span class=\"lb\">2.3</span>Thuế suất VAT theo quy định có hiệu lực tại thời điểm xuất hóa đơn.<span class=\"th\" data-t=\"อัตราภาษีมูลค่าเพิ่ม (VAT) เป็นไปตามบทบัญญัติที่มีผลใช้บังคับ ณ เวลาที่ออกใบแจ้งหนี้\"></span></p><h3 class=\"art\" data-n=\"3\"><strong>ĐIỀU 3. ĐẶT HÀNG VÀ XÁC NHẬN</strong><span class=\"th\" data-t=\"ข้อ 3. การสั่งซื้อและการยืนยัน\"></span></h3><p class=\"lv1\"><span class=\"lb\">3.1</span>Đơn đặt hàng của Bên A chỉ có hiệu lực khi Bên B xác nhận bằng văn bản (kể cả email) và Bên A hoàn thành điều kiện tạm ứng (nếu có).<span class=\"th\" data-t=\"ใบสั่งซื้อของฝ่าย A มีผลใช้บังคับก็ต่อเมื่อฝ่าย B ยืนยันเป็นลายลักษณ์อักษร (รวมถึงอีเมล) และฝ่าย A ปฏิบัติตามเงื่อนไขเงินล่วงหน้าครบถ้วน (หากมี)\"></span></p><p class=\"lv1\"><span class=\"lb\">3.2</span>Đơn hàng đã xác nhận chỉ được hủy hoặc thay đổi khi có chấp thuận của Bên B; hàng đặt riêng, đặt nhà sản xuất hoặc đã gia công không được hủy, Bên A thanh toán chi phí đã phát sinh và <span class=\"fx\" data-k=\"\"></span>% giá trị còn lại cho thiệt hại chứng minh được.<span class=\"th\" data-t=\"ใบสั่งซื้อที่ยืนยันแล้วจะยกเลิกหรือเปลี่ยนแปลงได้ก็ต่อเมื่อฝ่าย B ให้ความเห็นชอบ; สินค้าที่สั่งทำพิเศษ สั่งจากผู้ผลิต หรือผ่านการแปรรูปแล้วไม่สามารถยกเลิกได้ ฝ่าย A ชำระค่าใช้จ่ายที่เกิดขึ้นแล้วและ 【】 % ของมูลค่าที่เหลือสำหรับความเสียหายที่พิสูจน์ได้\"></span></p><h3 class=\"art\" data-n=\"4\"><strong>ĐIỀU 4. THANH TOÁN</strong><span class=\"th\" data-t=\"ข้อ 4. การชำระเงิน\"></span></h3><p class=\"lv1\"><span class=\"lb\">4.1</span>Phương thức: chuyển khoản VNĐ vào tài khoản của Bên B. Lịch thanh toán: tạm ứng <span class=\"fx\" data-k=\"TỶ LỆ\"></span>% trong <span class=\"fx\" data-k=\"05\"></span> ngày kể từ ngày ký / xác nhận đơn hàng; <span class=\"fx\" data-k=\"TỶ LỆ\"></span>% trước khi giao; <span class=\"fx\" data-k=\"TỶ LỆ\"></span>% trong <span class=\"fx\" data-k=\"\"></span> ngày kể từ ngày nhận hàng / nghiệm thu / chạy thử (Phụ lục 02).<span class=\"th\" data-t=\"วิธีการ: โอนเงินเป็น VNĐ เข้าบัญชีของฝ่าย B กำหนดการชำระเงิน: เงินล่วงหน้า 【TỶ LỆ】 % ภายใน 【05】 วันนับจากวันลงนาม / ยืนยันใบสั่งซื้อ; 【TỶ LỆ】 % ก่อนการส่งมอบ; 【TỶ LỆ】 % ภายใน 【】 วันนับจากวันรับสินค้า / ตรวจรับ / ทดสอบเดินเครื่อง (ภาคผนวก 02)\"></span></p><p class=\"lv1\"><span class=\"lb\">4.2</span>Bên B xuất hóa đơn điện tử hợp lệ theo Nghị định 123/2020/NĐ-CP; thanh toán không phụ thuộc việc Bên A nhận được tiền từ khách hàng của mình, và không được tự ý khấu trừ, bù trừ khi chưa có thỏa thuận bằng văn bản.<span class=\"th\" data-t=\"ฝ่าย B ออกใบแจ้งหนี้อิเล็กทรอนิกส์ที่ถูกต้องตามพระราชกฤษฎีกา 123/2020/NĐ-CP; การชำระเงินไม่ขึ้นอยู่กับการที่ฝ่าย A ได้รับเงินจากลูกค้าของตน และห้ามหักหรือหักกลบลบหนี้โดยพลการหากยังไม่มีข้อตกลงเป็นลายลักษณ์อักษร\"></span></p><p class=\"lv1\"><span class=\"lb\">4.3</span>Chậm thanh toán: lãi <span class=\"fx\" data-k=\"\"></span>%/năm trên số tiền chậm, không vượt mức pháp luật cho phép; chậm quá <span class=\"fx\" data-k=\"15\"></span> ngày sau thông báo, Bên B được tạm hoãn giao hàng, lắp đặt, bảo hành và gia hạn tiến độ tương ứng.<span class=\"th\" data-t=\"ชำระเงินล่าช้า: ดอกเบี้ย 【】 %/ปี ของจำนวนเงินที่ล่าช้า ทั้งนี้ไม่เกินอัตราที่กฎหมายอนุญาต; หากล่าช้าเกิน 【15】 วันหลังได้รับแจ้ง ฝ่าย B มีสิทธิเลื่อนการส่งมอบสินค้า การติดตั้ง การรับประกัน และขยายกำหนดการตามสัดส่วน\"></span></p><h3 class=\"art\" data-n=\"5\"><strong>ĐIỀU 5. GIAO HÀNG VÀ CHUYỂN RỦI RO</strong><span class=\"th\" data-t=\"ข้อ 5. การส่งมอบสินค้าและการโอนความเสี่ยง\"></span></h3><p class=\"lv1\"><span class=\"lb\">5.1</span>Thời hạn giao: <span class=\"fx\" data-k=\"SỐ\"></span> ngày kể từ ngày <span class=\"fx\" data-k=\"CUỐI CÙNG CỦA: HỢP ĐỒNG HIỆU LỰC, NHẬN TẠM ỨNG, XÁC NHẬN THÔNG SỐ, BÀN GIAO MẶT BẰNG LẮP ĐẶT\"></span>. Giao từng phần được phép.<span class=\"th\" data-t=\"กำหนดส่งมอบ: 【SỐ】 วันนับจากวัน 【CUỐI CÙNG CỦA: HỢP ĐỒNG HIỆU LỰC, NHẬN TẠM ỨNG, XÁC NHẬN THÔNG SỐ, BÀN GIAO MẶT BẰNG LẮP ĐẶT】 อนุญาตให้ส่งมอบเป็นงวด\"></span></p><p class=\"lv1\"><span class=\"lb\">5.2</span>Địa điểm giao hàng: <span class=\"fx\" data-k=\"ĐỊA ĐIỂM\"></span>. Bên A chuẩn bị đường vào, nơi dỡ hàng, thiết bị nâng, nhân sự nhận hàng; chậm nhận hàng quá <span class=\"fx\" data-k=\"03\"></span> ngày, Bên A chịu chi phí lưu kho, bảo quản và rủi ro kể từ ngày thông báo sẵn sàng giao.<span class=\"th\" data-t=\"สถานที่ส่งมอบสินค้า: 【ĐỊA ĐIỂM】 ฝ่าย A จัดเตรียมทางเข้า จุดขนถ่ายสินค้า อุปกรณ์ยก และบุคลากรรับสินค้า; หากรับสินค้าล่าช้าเกิน 【03】 วัน ฝ่าย A รับผิดชอบค่าจัดเก็บ ค่าดูแลรักษา และความเสี่ยงนับจากวันที่ได้รับแจ้งว่าพร้อมส่งมอบ\"></span></p><p class=\"lv1\"><span class=\"lb\">5.3</span>Rủi ro mất mát, hư hỏng chuyển cho Bên A khi hàng được giao tại địa điểm giao hàng (hoặc khi Bên B thông báo sẵn sàng giao nếu Bên A chậm nhận).<span class=\"th\" data-t=\"ความเสี่ยงต่อการสูญหายและเสียหายโอนให้ฝ่าย A เมื่อสินค้าถูกส่งมอบ ณ สถานที่ส่งมอบสินค้า (หรือเมื่อฝ่าย B แจ้งว่าพร้อมส่งมอบ หากฝ่าย A รับสินค้าล่าช้า)\"></span></p><p class=\"lv1\"><span class=\"lb\">5.4</span>Bên A ký biên bản giao nhận (Phụ lục 04) ngay khi nhận hàng; ghi rõ thiếu, hư hỏng nhìn thấy; không ký hoặc không ghi chú thì hàng được coi đã giao đúng số lượng, tình trạng bên ngoài.<span class=\"th\" data-t=\"ฝ่าย A ลงนามในรายงานการส่งมอบ-รับมอบ (ภาคผนวก 04) ทันทีที่รับสินค้า; ระบุอย่างชัดเจนถึงสินค้าขาดและความเสียหายที่มองเห็นได้; หากไม่ลงนามหรือไม่บันทึกข้อสังเกต ให้ถือว่าสินค้าได้ส่งมอบถูกต้องตามจำนวนและสภาพภายนอก\"></span></p><h3 class=\"art\" data-n=\"6\"><strong>ĐIỀU 6. KIỂM TRA VÀ KHIẾU NẠI</strong><span class=\"th\" data-t=\"ข้อ 6. การตรวจสอบและการเรียกร้อง\"></span></h3><p class=\"lv1\"><span class=\"lb\">6.1</span>Bên A kiểm tra số lượng, ngoại quan khi nhận hàng và thông báo khiếu nại bằng văn bản trong <span class=\"fx\" data-k=\"07\"></span> ngày kể từ ngày nhận hàng; khiếm khuyết ẩn: trong <span class=\"fx\" data-k=\"30\"></span> ngày kể từ khi phát hiện và trong thời hạn bảo hành.<span class=\"th\" data-t=\"ฝ่าย A ตรวจสอบจำนวนและลักษณะภายนอกเมื่อรับสินค้า และแจ้งการเรียกร้องเป็นลายลักษณ์อักษรภายใน 【07】 วันนับจากวันรับสินค้า; กรณีข้อบกพร่องแอบแฝง: ภายใน 【30】 วันนับจากวันที่พบ และภายในระยะเวลาการรับประกัน\"></span></p><p class=\"lv1\"><span class=\"lb\">6.2</span>Bên B xử lý khiếu nại hợp lệ trong <span class=\"fx\" data-k=\"15\"></span> ngày bằng cách giao bù, sửa chữa hoặc thay thế; khiếu nại quá hạn không được chấp nhận trừ quy định bắt buộc của pháp luật.<span class=\"th\" data-t=\"ฝ่าย B แก้ไขข้อเรียกร้องที่ชอบด้วยกฎหมายภายใน 【15】 วัน โดยส่งมอบชดเชย ซ่อมแซม หรือเปลี่ยนสินค้า; ข้อเรียกร้องที่พ้นกำหนดจะไม่ได้รับการยอมรับ เว้นแต่เป็นไปตามข้อบังคับของกฎหมาย\"></span></p><h3 class=\"art\" data-n=\"7\"><strong>ĐIỀU 7. QUYỀN SỞ HỮU</strong><span class=\"th\" data-t=\"ข้อ 7. กรรมสิทธิ์\"></span></h3><p class=\"lv1\"><span class=\"lb\">7.1</span>Quyền sở hữu hàng hóa chuyển cho Bên A khi Bên A thanh toán đủ toàn bộ giá trị hợp đồng (bảo lưu quyền sở hữu theo quy định BLDS 2015; hai Bên thực hiện thủ tục đăng ký bảo lưu nếu pháp luật yêu cầu để có hiệu lực đối kháng với người thứ ba).<span class=\"th\" data-t=\"กรรมสิทธิ์ในสินค้าโอนให้ฝ่าย A เมื่อฝ่าย A ชำระเงินครบถ้วนทั้งหมดตามมูลค่าสัญญา (การสงวนกรรมสิทธิ์ตามบทบัญญัติของประมวลกฎหมายแพ่ง 2015 (BLDS 2015); คู่สัญญาทั้งสองฝ่ายดำเนินการจดทะเบียนการสงวนกรรมสิทธิ์หากกฎหมายกำหนดเพื่อให้มีผลยันต่อบุคคลที่สาม)\"></span></p><p class=\"lv1\"><span class=\"lb\">7.2</span>Trong thời gian bảo lưu, Bên A bảo quản, mua bảo hiểm, không bán, cầm cố, thế chấp hàng hóa; Bên B có quyền thu hồi hàng khi Bên A vi phạm nghĩa vụ thanh toán nghiêm trọng sau thông báo <span class=\"fx\" data-k=\"15\"></span> ngày.<span class=\"th\" data-t=\"ในระหว่างการสงวนกรรมสิทธิ์ ฝ่าย A ดูแลรักษา ทำประกันภัย และไม่ขาย จำนำ หรือจำนองสินค้า; ฝ่าย B มีสิทธิเรียกคืนสินค้าเมื่อฝ่าย A ละเมิดหน้าที่ชำระเงินอย่างร้ายแรงหลังได้รับแจ้ง 【15】 วัน\"></span></p><h3 class=\"art\" data-n=\"8\"><strong>ĐIỀU 8. LẮP ĐẶT, CHẠY THỬ VÀ ĐÀO TẠO (NẾU CÓ)</strong><span class=\"th\" data-t=\"ข้อ 8 การติดตั้ง การทดลองเดินเครื่อง และการฝึกอบรม (ถ้ามี)\"></span></h3><p class=\"lv1\"><span class=\"lb\">8.1</span>Phạm vi lắp đặt và chạy thử: <span class=\"fx\" data-k=\"CÓ / KHÔNG; PHẠM VI\"></span>. Bên A bảo đảm mặt bằng, móng, điện, nước, khí, nguyên liệu và nhân sự phối hợp theo yêu cầu kỹ thuật của Bên B.<span class=\"th\" data-t=\"ขอบเขตการติดตั้งและการทดลองเดินเครื่อง: 【CÓ / KHÔNG; PHẠM VI】 ฝ่าย A รับรองการจัดเตรียมพื้นที่ ฐานราก ไฟฟ้า น้ำ ก๊าซ วัตถุดิบ และบุคลากรเพื่อประสานงานตามข้อกำหนดทางเทคนิคของฝ่าย B\"></span></p><p class=\"lv1\"><span class=\"lb\">8.2</span>Chạy thử đạt thông số tại Phụ lục 01 thì lập biên bản nghiệm thu; Bên A không ký biên bản nhưng đã đưa vào sử dụng thương mại thì được coi là nghiệm thu.<span class=\"th\" data-t=\"เมื่อการทดลองเดินเครื่องได้ค่าตามข้อกำหนดในภาคผนวก 01 ให้จัดทำรายงานการตรวจรับ ทั้งนี้ หากฝ่าย A ไม่ลงนามในรายงานแต่ได้นำไปใช้งานเชิงพาณิชย์แล้ว ให้ถือว่าได้ตรวจรับแล้ว\"></span></p><h3 class=\"art\" data-n=\"9\"><strong>ĐIỀU 9. BẢO HÀNH</strong><span class=\"th\" data-t=\"ข้อ 9 การรับประกันสินค้า\"></span></h3><p class=\"lv1\"><span class=\"lb\">9.1</span>Thời hạn bảo hành: <span class=\"fx\" data-k=\"12\"></span> tháng kể từ <span class=\"fx\" data-k=\"NGÀY GIAO HÀNG / NGÀY NGHIỆM THU\"></span>, nhưng không quá <span class=\"fx\" data-k=\"\"></span> tháng từ ngày giao hàng. Nội dung: sửa chữa hoặc thay thế linh kiện lỗi do vật liệu, chế tạo; chi phí vận chuyển, lưu trú kỹ thuật viên theo Phụ lục 03.<span class=\"th\" data-t=\"ระยะเวลารับประกัน: 【12】 เดือน นับจาก 【NGÀY GIAO HÀNG / NGÀY NGHIỆM THU】 แต่ไม่เกิน 【】 เดือนนับจากวันส่งมอบสินค้า เนื้อหา: ซ่อมแซมหรือเปลี่ยนชิ้นส่วนที่ชำรุดเนื่องจากวัสดุหรือการผลิต ค่าขนส่งและค่าที่พักของช่างเทคนิคเป็นไปตามภาคผนวก 03\"></span></p><p class=\"lv1\"><span class=\"lb\">9.2</span>Loại trừ: hao mòn thông thường; vật tư tiêu hao; hư hỏng do lắp đặt, vận hành, bảo trì sai hướng dẫn; sử dụng ngoài thông số; sửa chữa bởi bên không được Bên B ủy quyền; thiên tai, sự cố điện nước; không thanh toán đầy đủ.<span class=\"th\" data-t=\"ข้อยกเว้น: การสึกหรอตามปกติ วัสดุสิ้นเปลือง ความเสียหายจากการติดตั้ง การใช้งาน หรือการบำรุงรักษาที่ผิดไปจากคู่มือ การใช้งานเกินกว่าข้อกำหนด การซ่อมแซมโดยบุคคลที่ฝ่าย B มิได้มอบอำนาจ ภัยธรรมชาติ เหตุขัดข้องของไฟฟ้าหรือน้ำ และการไม่ชำระเงินครบถ้วน\"></span></p><p class=\"lv1\"><span class=\"lb\">9.3</span>Bên B phản hồi trong <span class=\"fx\" data-k=\"48\"></span> giờ và khắc phục trong <span class=\"fx\" data-k=\"SỐ\"></span> ngày làm việc kể từ thông báo hợp lệ. Bảo hành là biện pháp khắc phục chủ yếu đối với khiếm khuyết trong thời hạn bảo hành.<span class=\"th\" data-t=\"ฝ่าย B ตอบกลับภายใน 【48】 ชั่วโมง และแก้ไขภายใน 【SỐ】 วันทำการนับจากการแจ้งที่ชอบด้วยสัญญา การรับประกันเป็นมาตรการแก้ไขหลักสำหรับข้อบกพร่องที่เกิดขึ้นภายในระยะเวลารับประกัน\"></span></p><h3 class=\"art\" data-n=\"10\"><strong>ĐIỀU 10. PHẠT VI PHẠM VÀ GIỚI HẠN TRÁCH NHIỆM</strong><span class=\"th\" data-t=\"ข้อ 10 ค่าปรับตามสัญญาและการจำกัดความรับผิด\"></span></h3><p class=\"lv1\"><span class=\"lb\">10.1</span>Giao hàng chậm do lỗi Bên B: phạt <span class=\"fx\" data-k=\"0,05\"></span>%/ngày trên giá trị phần giao chậm, tối đa <span class=\"fx\" data-k=\"8\"></span>% giá trị phần nghĩa vụ bị vi phạm (Điều 301 Luật Thương mại 2005; xác nhận quy định hiện hành khi ký). Chậm thanh toán: Bên A chịu lãi theo Điều 4.3 và phạt tương tự <span class=\"fx\" data-k=\"\"></span>%/ngày, tối đa <span class=\"fx\" data-k=\"8\"></span>%.<span class=\"th\" data-t=\"การส่งมอบสินค้าล่าช้าเนื่องจากความผิดของฝ่าย B: ปรับร้อยละ 【0,05】 ต่อวันของมูลค่าส่วนที่ส่งมอบล่าช้า สูงสุดไม่เกินร้อยละ 【8】 ของมูลค่าส่วนภาระผูกพันที่ถูกละเมิด (มาตรา 301 กฎหมายพาณิชย์ ค.ศ. 2005 ทั้งนี้ ให้ยืนยันบทบัญญัติที่มีผลบังคับใช้ในปัจจุบันเมื่อลงนาม) การชำระเงินล่าช้า: ฝ่าย A ต้องรับผิดชำระดอกเบี้ยตามข้อ 4.3 และค่าปรับในทำนองเดียวกันร้อยละ 【】 ต่อวัน สูงสุดไม่เกินร้อยละ 【8】\"></span></p><p class=\"lv1\"><span class=\"lb\">10.2</span>Tổng trách nhiệm của Bên B (phạt, bồi thường, bảo hành) tối đa <span class=\"fx\" data-k=\"100\"></span>% giá trị hợp đồng chưa VAT; không bồi thường thiệt hại gián tiếp, mất sản lượng, mất lợi nhuận, thiệt hại vật nuôi hoặc nguyên liệu, trừ khi do cố ý hoặc vi phạm pháp luật bắt buộc.<span class=\"th\" data-t=\"ความรับผิดรวมของฝ่าย B (ค่าปรับ การชดใช้ค่าเสียหาย การรับประกัน) สูงสุดไม่เกินร้อยละ 【100】 ของมูลค่าสัญญาที่ยังไม่รวมภาษีมูลค่าเพิ่ม (VAT) ไม่ต้องชดใช้ความเสียหายทางอ้อม การสูญเสียผลผลิต การสูญเสียกำไร ความเสียหายต่อสัตว์เลี้ยงหรือวัตถุดิบ เว้นแต่เกิดจากเจตนาหรือการฝ่าฝืนบทบัญญัติแห่งกฎหมายที่เป็นข้อบังคับ\"></span></p><h3 class=\"art\" data-n=\"11\"><strong>ĐIỀU 11. CHẤM DỨT HỢP ĐỒNG</strong><span class=\"th\" data-t=\"ข้อ 11 การยุติสัญญา\"></span></h3><p class=\"lv1\"><span class=\"lb\">11.1</span>Mỗi Bên có quyền chấm dứt khi Bên kia vi phạm nghiêm trọng không khắc phục trong <span class=\"fx\" data-k=\"15\"></span> ngày kể từ thông báo bằng văn bản. Bên A chậm thanh toán quá <span class=\"fx\" data-k=\"30\"></span> ngày là vi phạm nghiêm trọng.<span class=\"th\" data-t=\"แต่ละฝ่ายมีสิทธิยุติสัญญาเมื่ออีกฝ่ายหนึ่งผิดสัญญาอย่างร้ายแรงและไม่แก้ไขภายใน 【15】 วันนับจากได้รับการบอกกล่าวเป็นหนังสือ การที่ฝ่าย A ชำระเงินล่าช้าเกิน 【30】 วันถือเป็นการผิดสัญญาอย่างร้ายแรง\"></span></p><p class=\"lv1\"><span class=\"lb\">11.2</span>Khi chấm dứt, Bên A thanh toán giá trị hàng đã giao và chi phí đã phát sinh cho hàng đặt riêng; Bên B hoàn trả tiền đã nhận cho phần chưa giao sau khi trừ các khoản Bên A phải trả.<span class=\"th\" data-t=\"เมื่อยุติสัญญา ฝ่าย A ต้องชำระมูลค่าสินค้าที่ส่งมอบแล้วและค่าใช้จ่ายที่เกิดขึ้นแล้วสำหรับสินค้าสั่งทำพิเศษ ฝ่าย B ต้องคืนเงินที่ได้รับสำหรับส่วนที่ยังไม่ส่งมอบ หลังหักเงินจำนวนที่ฝ่าย A ต้องชำระ\"></span></p><h3 class=\"art\" data-n=\"12\"><strong>ĐIỀU 12. BẤT KHẢ KHÁNG</strong><span class=\"th\" data-t=\"ข้อ 12 เหตุสุดวิสัย\"></span></h3><p class=\"lv1\"><span class=\"lb\">12.1</span>Bất khả kháng là sự kiện xảy ra một cách khách quan không thể lường trước và không thể khắc phục được mặc dù đã áp dụng mọi biện pháp cần thiết và khả năng cho phép (Điều 156 Bộ luật Dân sự 2015), kể cả thiên tai, dịch bệnh, chiến tranh, quyết định của cơ quan nhà nước có thẩm quyền làm cấm hoặc đình chỉ việc thực hiện hợp đồng.<span class=\"th\" data-t=\"เหตุสุดวิสัยคือเหตุการณ์ที่เกิดขึ้นโดยปรากฏชัดแจ้งตามวัตถุวิสัย ไม่อาจคาดการณ์ได้ และไม่อาจแก้ไขได้ แม้ได้ใช้มาตรการทุกอย่างที่จำเป็นและเท่าที่ความสามารถอำนวยแล้ว (มาตรา 156 ประมวลกฎหมายแพ่ง ค.ศ. 2015) รวมถึงภัยธรรมชาติ โรคระบาด สงคราม และคำสั่งของหน่วยงานของรัฐที่มีอำนาจที่ห้ามหรือระงับการปฏิบัติตามสัญญา\"></span></p><p class=\"lv1\"><span class=\"lb\">12.2</span>Bên bị ảnh hưởng phải thông báo bằng văn bản cho Bên kia trong <span class=\"fx\" data-k=\"07\"></span> ngày kể từ ngày sự kiện xảy ra, kèm chứng cứ (xác nhận của cơ quan có thẩm quyền nếu có), áp dụng mọi biện pháp hợp lý để hạn chế thiệt hại và nối lại việc thực hiện ngay khi có thể. Thông báo chậm làm Bên bị ảnh hưởng mất quyền miễn trách nhiệm đối với phần thiệt hại phát sinh do chậm thông báo.<span class=\"th\" data-t=\"ฝ่ายที่ได้รับผลกระทบต้องแจ้งเป็นลายลักษณ์อักษรให้อีกฝ่ายทราบภายใน 【07】 วัน นับจากวันที่เหตุการณ์เกิดขึ้น พร้อมพยานหลักฐาน (การรับรองจากหน่วยงานที่มีอำนาจ หากมี) ใช้มาตรการที่สมเหตุสมผลทุกอย่างเพื่อลดความเสียหาย และกลับมาปฏิบัติตามสัญญาโดยเร็วที่สุดเท่าที่ทำได้ การแจ้งล่าช้าทำให้ฝ่ายที่ได้รับผลกระทบสูญเสียสิทธิในการได้รับยกเว้นความรับผิดสำหรับความเสียหายที่เกิดจากการแจ้งล่าช้า\"></span></p><p class=\"lv1\"><span class=\"lb\">12.3</span>Không được coi là bất khả kháng: khó khăn tài chính, biến động giá, thiếu nhân công, vật tư, phương tiện; lỗi của nhà thầu phụ, nhà cung cấp, nhà vận chuyển của Bên vi phạm, trừ khi chính họ gặp sự kiện bất khả kháng đáp ứng định nghĩa trên.<span class=\"th\" data-t=\"ไม่ถือเป็นเหตุสุดวิสัย: ความยากลำบากทางการเงิน ความผันผวนของราคา การขาดแคลนแรงงาน วัสดุ และยานพาหนะ; ความผิดของผู้รับเหมาช่วง ผู้จัดหา ผู้ขนส่งของฝ่ายที่ผิดสัญญา เว้นแต่บุคคลเหล่านั้นประสบเหตุสุดวิสัยที่เข้าตามคำนิยามข้างต้น\"></span></p><p class=\"lv1\"><span class=\"lb\">12.4</span>Nếu sự kiện bất khả kháng kéo dài quá <span class=\"fx\" data-k=\"60\"></span> ngày liên tục, Các Bên thương lượng phương án tiếp tục hoặc chấm dứt. Nếu không thỏa thuận được, mỗi Bên có quyền chấm dứt phần hợp đồng bị ảnh hưởng bằng thông báo trước <span class=\"fx\" data-k=\"15\"></span> ngày; phần đã thực hiện đúng hợp đồng được thanh toán, không bên nào phải chịu phạt vi phạm.<span class=\"th\" data-t=\"หากเหตุสุดวิสัยดำเนินต่อเนื่องเกิน 【60】 วัน ทั้งสองฝ่ายต้องเจรจาแนวทางดำเนินการต่อหรือเลิกสัญญา หากตกลงกันไม่ได้ แต่ละฝ่ายมีสิทธิเลิกสัญญาในส่วนที่ได้รับผลกระทบโดยแจ้งล่วงหน้า 【15】 วัน; ส่วนที่ได้ดำเนินการถูกต้องตามสัญญาแล้วจะได้รับการชำระเงิน และไม่ฝ่ายใดต้องรับผิดค่าปรับตามสัญญา\"></span></p><h3 class=\"art\" data-n=\"13\"><strong>ĐIỀU 13. TUÂN THỦ, XUẤT XỨ VÀ SỬ DỤNG HÀNG HÓA</strong><span class=\"th\" data-t=\"ข้อ 13 การปฏิบัติตามกฎหมาย แหล่งกำเนิดสินค้า และการใช้สินค้า\"></span></h3><p class=\"lv1\"><span class=\"lb\">13.1</span>Bên A sử dụng hàng hóa đúng mục đích, tuân thủ quy định pháp luật về an toàn thiết bị, môi trường và các điều kiện cấp phép liên quan; chịu trách nhiệm về giấy phép sử dụng thuộc trách nhiệm người sử dụng.<span class=\"th\" data-t=\"ฝ่าย A ต้องใช้สินค้าตรงตามวัตถุประสงค์ ปฏิบัติตามบทบัญญัติของกฎหมายว่าด้วยความปลอดภัยของอุปกรณ์ สิ่งแวดล้อม และเงื่อนไขการอนุญาตที่เกี่ยวข้อง และรับผิดชอบเกี่ยวกับใบอนุญาตการใช้งานที่เป็นหน้าที่ของผู้ใช้งาน\"></span></p><p class=\"lv1\"><span class=\"lb\">13.2</span>Bên B cung cấp chứng từ xuất xứ, chất lượng (CO, CQ, hướng dẫn sử dụng bằng tiếng Việt) theo quy định áp dụng cho từng nhóm hàng.<span class=\"th\" data-t=\"ฝ่าย B ต้องจัดหาเอกสารแสดงแหล่งกำเนิดและคุณภาพ (CO, CQ, คู่มือการใช้งานเป็นภาษาเวียดนาม) ตามที่กฎหมายกำหนดสำหรับสินค้าแต่ละกลุ่ม\"></span></p><h3 class=\"art\" data-n=\"14\"><strong>ĐIỀU 14. BẢO MẬT, SỞ HỮU TRÍ TUỆ VÀ BẢO VỆ DỮ LIỆU CÁ NHÂN</strong><span class=\"th\" data-t=\"ข้อ 14 การรักษาความลับ ทรัพย์สินทางปัญญา และการคุ้มครองข้อมูลส่วนบุคคล\"></span></h3><p class=\"lv1\"><span class=\"lb\">14.1</span>Mỗi Bên giữ bí mật thông tin kỹ thuật, giá, tài liệu và thông tin kinh doanh của Bên kia nhận được liên quan đến hợp đồng; chỉ sử dụng cho mục đích thực hiện hợp đồng và chỉ tiết lộ cho nhân sự, tư vấn, ngân hàng, bảo hiểm cần biết hoặc khi cơ quan nhà nước có thẩm quyền yêu cầu theo luật.<span class=\"th\" data-t=\"แต่ละฝ่ายต้องรักษาความลับของข้อมูลทางเทคนิค ราคา เอกสาร และข้อมูลทางธุรกิจของอีกฝ่ายที่ได้รับเกี่ยวกับสัญญา ใช้เพื่อวัตถุประสงค์ในการปฏิบัติตามสัญญาเท่านั้น และเปิดเผยเฉพาะแก่บุคลากร ที่ปรึกษา ธนาคาร บริษัทประกันภัยที่จำเป็นต้องรู้ หรือเมื่อหน่วยงานของรัฐที่มีอำนาจเรียกร้องตามกฎหมาย\"></span></p><p class=\"lv1\"><span class=\"lb\">14.2</span>Nghĩa vụ bảo mật kéo dài <span class=\"fx\" data-k=\"03\"></span> năm sau khi hợp đồng chấm dứt hoặc hết hiệu lực. Quyền sở hữu trí tuệ đối với tài liệu, bản vẽ, phần mềm của mỗi Bên không chuyển giao, trừ phạm vi được cấp phép sử dụng để thực hiện và sử dụng sản phẩm của hợp đồng.<span class=\"th\" data-t=\"ภาระผูกพันในการรักษาความลับมีผลต่อเนื่อง 【03】 ปี หลังสัญญาเลิกหรือสิ้นผลบังคับ สิทธิในทรัพย์สินทางปัญญาในเอกสาร แบบ และซอฟต์แวร์ของแต่ละฝ่ายไม่โอนให้กัน เว้นแต่ขอบเขตที่ได้รับอนุญาตให้ใช้เพื่อปฏิบัติตามสัญญาและใช้ผลิตภัณฑ์ของสัญญา\"></span></p><p class=\"lv1\"><span class=\"lb\">14.3</span>Khi xử lý dữ liệu cá nhân của người lao động, đại diện, đầu mối của Bên kia, mỗi Bên tuân thủ pháp luật về bảo vệ dữ liệu cá nhân (Nghị định 13/2023/NĐ-CP và văn bản thay thế, sửa đổi nếu có), chỉ xử lý trong phạm vi cần thiết cho hợp đồng.<span class=\"th\" data-t=\"เมื่อประมวลผลข้อมูลส่วนบุคคลของลูกจ้าง ผู้แทน และผู้ประสานงานของอีกฝ่าย แต่ละฝ่ายต้องปฏิบัติตามกฎหมายว่าด้วยการคุ้มครองข้อมูลส่วนบุคคล (พระราชกฤษฎีกา ฉบับที่ 13/2023/NĐ-CP และเอกสารที่ใช้แทนหรือแก้ไขเพิ่มเติม หากมี) และประมวลผลเฉพาะในขอบเขตที่จำเป็นสำหรับสัญญา\"></span></p><h3 class=\"art\" data-n=\"15\"><strong>ĐIỀU 15. TUÂN THỦ PHÁP LUẬT, CHỐNG HỐI LỘ VÀ XUNG ĐỘT LỢI ÍCH</strong><span class=\"th\" data-t=\"ข้อ 15 การปฏิบัติตามกฎหมาย การต่อต้านการให้สินบน และความขัดแย้งทางผลประโยชน์\"></span></h3><p class=\"lv1\"><span class=\"lb\">15.1</span>Các Bên tuân thủ pháp luật Việt Nam về thuế, hóa đơn, lao động, môi trường, an toàn, cạnh tranh và phòng chống tham nhũng, hối lộ.<span class=\"th\" data-t=\"ทั้งสองฝ่ายปฏิบัติตามกฎหมายเวียดนามว่าด้วยภาษี ใบกำกับภาษี แรงงาน สิ่งแวดล้อม ความปลอดภัย การแข่งขัน และการป้องกันและต่อต้านการทุจริตและการให้สินบน\"></span></p><p class=\"lv1\"><span class=\"lb\">15.2</span>Không bên nào được đưa, đề nghị, nhận tiền, quà tặng hoặc lợi ích bất chính cho hoặc từ nhân sự của Bên kia, khách hàng hoặc bên thứ ba để có lợi thế trong hợp đồng; vi phạm là vi phạm nghiêm trọng, Bên bị vi phạm có quyền chấm dứt hợp đồng ngay bằng văn bản.<span class=\"th\" data-t=\"ห้ามฝ่ายใดให้ เสนอ หรือรับเงิน ของขวัญ หรือผลประโยชน์ที่มิชอบ แก่หรือจากบุคลากรของอีกฝ่าย ลูกค้า หรือบุคคลที่สาม เพื่อให้ได้เปรียบในสัญญา; การฝ่าฝืนถือเป็นการผิดสัญญาอย่างร้ายแรง ฝ่ายที่ถูกละเมิดมีสิทธิเลิกสัญญาทันทีโดยหนังสือเป็นลายลักษณ์อักษร\"></span></p><p class=\"lv1\"><span class=\"lb\">15.3</span>Mỗi Bên thông báo ngay cho Bên kia khi có xung đột lợi ích thực tế hoặc tiềm ẩn liên quan đến người tham gia ký kết, đánh giá, nghiệm thu hợp đồng.<span class=\"th\" data-t=\"แต่ละฝ่ายต้องแจ้งให้อีกฝ่ายทราบทันทีเมื่อมีความขัดแย้งทางผลประโยชน์ที่เกิดขึ้นจริงหรืออาจเกิดขึ้น เกี่ยวกับผู้ที่เข้าร่วมการลงนาม การประเมิน และการตรวจรับสัญญา\"></span></p><h3 class=\"art\" data-n=\"16\"><strong>ĐIỀU 16. LUẬT ÁP DỤNG VÀ GIẢI QUYẾT TRANH CHẤP</strong><span class=\"th\" data-t=\"ข้อ 16 กฎหมายที่ใช้บังคับและการระงับข้อพิพาท\"></span></h3><p class=\"lv1\"><span class=\"lb\">16.1</span>Hợp đồng chịu sự điều chỉnh của pháp luật Việt Nam.<span class=\"th\" data-t=\"สัญญานี้อยู่ภายใต้บังคับของกฎหมายเวียดนาม\"></span></p><p class=\"lv1\"><span class=\"lb\">16.2</span>Tranh chấp được giải quyết trước hết bằng thương lượng, hòa giải thiện chí trong <span class=\"fx\" data-k=\"30\"></span> ngày kể từ ngày một Bên gửi thông báo tranh chấp bằng văn bản nêu rõ nội dung, căn cứ và yêu cầu.<span class=\"th\" data-t=\"ข้อพิพาทให้ระงับเป็นลำดับแรกโดยการเจรจาและไกล่เกลี่ยด้วยความสุจริตภายใน 【30】 วัน นับจากวันที่ฝ่ายหนึ่งส่งหนังสือแจ้งข้อพิพาทเป็นลายลักษณ์อักษรระบุเนื้อหา ฐาน และข้อเรียกร้องอย่างชัดเจน\"></span></p><p class=\"lv1\"><span class=\"lb\">16.3</span>Nếu không giải quyết được, tranh chấp được đưa ra (chỉ chọn một): <span class=\"fx\" data-k=\"TÒA ÁN NHÂN DÂN CÓ THẨM QUYỀN TẠI (TỈNH/THÀNH PHỐ) / TRUNG TÂM TRỌNG TÀI QUỐC TẾ VIỆT NAM (VIAC), LUẬT TỐ TỤNG VIAC, 01 TRỌNG TÀI VIÊN, TRỤ SỞ TRỌNG TÀI TẠI (ĐỊA ĐIỂM), NGÔN NGỮ TIẾNG VIỆT\"></span>. Nếu chọn trọng tài, thỏa thuận này là thỏa thuận trọng tài độc lập, phán quyết là chung thẩm.<span class=\"th\" data-t=\"หากระงับไม่ได้ ให้นำข้อพิพาทเสนอต่อ (เลือกเพียงอย่างเดียว): 【TÒA ÁN NHÂN DÂN CÓ THẨM QUYỀN TẠI (TỈNH/THÀNH PHỐ) / TRUNG TÂM TRỌNG TÀI QUỐC TẾ VIỆT NAM (VIAC), LUẬT TỐ TỤNG VIAC, 01 TRỌNG TÀI VIÊN, TRỤ SỞ TRỌNG TÀI TẠI (ĐỊA ĐIỂM), NGÔN NGỮ TIẾNG VIỆT】 หากเลือกอนุญาโตตุลาการ ข้อตกลงนี้เป็นข้อตกลงอนุญาโตตุลาการที่เป็นอิสระ และคำชี้ขาดเป็นที่สุด\"></span></p><p class=\"lv1\"><span class=\"lb\">16.4</span>Trong thời gian giải quyết tranh chấp, Các Bên tiếp tục thực hiện các phần nghĩa vụ không bị tranh chấp.<span class=\"th\" data-t=\"ในระหว่างการระงับข้อพิพาท ทั้งสองฝ่ายต้องปฏิบัติตามภาระผูกพันในส่วนที่ไม่มีข้อพิพาทต่อไป\"></span></p><p class=\"lv1\"><span class=\"lb\">16.5</span>Hợp đồng lập bằng tiếng Việt. Bản dịch sang tiếng Anh hoặc tiếng Thái (nếu có) chỉ để tham khảo; khi có khác biệt, bản tiếng Việt có giá trị áp dụng.<span class=\"th\" data-t=\"สัญญาจัดทำเป็นภาษาเวียดนาม ฉบับแปลเป็นภาษาอังกฤษหรือภาษาไทย (หากมี) ใช้เพื่อการอ้างอิงเท่านั้น หากมีความแตกต่าง ให้ถือฉบับภาษาเวียดนามเป็นฉบับที่ใช้บังคับ\"></span></p><h3 class=\"art\" data-n=\"17\"><strong>ĐIỀU 17. ĐIỀU KHOẢN CHUNG VÀ HIỆU LỰC</strong><span class=\"th\" data-t=\"ข้อ 17 ข้อกำหนดทั่วไปและการมีผลบังคับ\"></span></h3><p class=\"lv1\"><span class=\"lb\">17.1</span>Thông báo phải bằng văn bản, gửi tới địa chỉ, email của đại diện nhận thông báo nêu ở phần đầu Hợp đồng (hoặc địa chỉ được thông báo thay đổi bằng văn bản). Thông báo gửi bằng email có hiệu lực khi hệ thống không báo lỗi và đã gửi bản gốc trong <span class=\"fx\" data-k=\"05\"></span> ngày làm việc nếu Bên nhận yêu cầu.<span class=\"th\" data-t=\"การแจ้งต้องเป็นลายลักษณ์อักษร ส่งไปยังที่อยู่และอีเมลของผู้แทนผู้รับแจ้งที่ระบุไว้ในส่วนต้นของสัญญา (หรือที่อยู่ที่แจ้งเปลี่ยนแปลงเป็นลายลักษณ์อักษร) การแจ้งทางอีเมลมีผลเมื่อระบบไม่แจ้งข้อผิดพลาด และได้ส่งฉบับจริงภายใน 【05】 วันทำการ หากฝ่ายผู้รับร้องขอ\"></span></p><p class=\"lv1\"><span class=\"lb\">17.2</span>Không bên nào được chuyển nhượng quyền, nghĩa vụ theo hợp đồng cho bên thứ ba khi chưa có chấp thuận bằng văn bản của Bên kia, trừ quyền nhận tiền được chuyển nhượng theo quy định pháp luật và thông báo cho Bên có nghĩa vụ.<span class=\"th\" data-t=\"ห้ามฝ่ายใดโอนสิทธิและภาระผูกพันตามสัญญาให้บุคคลที่สามโดยยังไม่ได้รับความยินยอมเป็นลายลักษณ์อักษรจากอีกฝ่าย เว้นแต่สิทธิในการรับเงินที่โอนได้ตามกฎหมายและแจ้งให้ฝ่ายที่มีหน้าที่ทราบ\"></span></p><p class=\"lv1\"><span class=\"lb\">17.3</span>Mọi sửa đổi, bổ sung chỉ có hiệu lực khi lập thành văn bản có chữ ký của người có thẩm quyền của cả hai Bên. Phụ lục là một phần không tách rời; khi có mâu thuẫn, thứ tự ưu tiên: (i) Phụ lục điều kiện đặc biệt được hai Bên ký, (ii) nội dung Hợp đồng, (iii) các Phụ lục còn lại.<span class=\"th\" data-t=\"การแก้ไขเพิ่มเติมทั้งหมดมีผลต่อเมื่อจัดทำเป็นลายลักษณ์อักษรและมีลายมือชื่อของผู้มีอำนาจของทั้งสองฝ่าย ภาคผนวกเป็นส่วนหนึ่งของสัญญาที่แยกจากกันไม่ได้ เมื่อมีความขัดแย้งให้ใช้ลำดับความสำคัญดังนี้: (i) ภาคผนวกเงื่อนไขพิเศษที่ทั้งสองฝ่ายลงนาม (ii) เนื้อหาของสัญญา (iii) ภาคผนวกอื่น ๆ\"></span></p><p class=\"lv1\"><span class=\"lb\">17.4</span>Nếu một điều khoản bị tuyên vô hiệu hoặc không thể thi hành, các điều khoản còn lại vẫn có hiệu lực; Các Bên thương lượng điều khoản thay thế gần nhất với ý chí ban đầu.<span class=\"th\" data-t=\"หากข้อกำหนดใดถูกวินิจฉัยว่าเป็นโมฆะหรือไม่อาจบังคับใช้ได้ ข้อกำหนดที่เหลือยังคงมีผลบังคับ; ทั้งสองฝ่ายต้องเจรจาข้อกำหนดทดแทนที่ใกล้เคียงกับเจตนารมณ์เดิมมากที่สุด\"></span></p><p class=\"lv1\"><span class=\"lb\">17.5</span>Hợp đồng có hiệu lực từ ngày <span class=\"fx\" data-k=\"NGÀY KÝ / ĐIỀU KIỆN CÓ HIỆU LỰC\"></span>, lập thành <span class=\"fx\" data-k=\"04\"></span> bản có giá trị như nhau, mỗi Bên giữ <span class=\"fx\" data-k=\"02\"></span> bản.<span class=\"th\" data-t=\"สัญญามีผลตั้งแต่วันที่ 【NGÀY KÝ / ĐIỀU KIỆN CÓ HIỆU LỰC】 จัดทำเป็น 【04】 ฉบับ มีค่าเท่ากัน โดยแต่ละฝ่ายเก็บไว้ 【02】 ฉบับ\"></span></p><div class=\"tw2\"><table class=\"ct\"><tr><th>ĐẠI DIỆN BÊN A<span class=\"th\" data-t=\"ผู้แทนฝ่าย A\"></span></th><th>ĐẠI DIỆN BÊN B<span class=\"th\" data-t=\"ผู้แทนฝ่าย B\"></span></th></tr><tr><td>(Ký, ghi rõ họ tên, chức danh, đóng dấu nếu có) <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ / NGÀY\"></span><span class=\"th\" data-t=\"(ลงนาม ระบุชื่อ-นามสกุล ตำแหน่ง และประทับตราหากมี) 【HỌ TÊN / CHỨC VỤ / NGÀY】\"></span></td><td>(Ký, ghi rõ họ tên, chức danh, đóng dấu nếu có) <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ / NGÀY\"></span><span class=\"th\" data-t=\"(ลงนาม ระบุชื่อ-นามสกุล ตำแหน่ง และประทับตราหากมี) 【HỌ TÊN / CHỨC VỤ / NGÀY】\"></span></td></tr></table></div><h3 class=\"ann\" data-n=\"01\"><strong>PHỤ LỤC 01 – DANH MỤC HÀNG HÓA, THÔNG SỐ VÀ GIÁ</strong><span class=\"th\" data-t=\"ภาคผนวก 01 – รายการสินค้า ข้อกำหนด และราคา\"></span></h3><div class=\"tw2\"><table class=\"ct\"><tr><th>STT<span class=\"th\" data-t=\"ลำดับ\"></span></th><th>Tên hàng / Model<span class=\"th\" data-t=\"ชื่อสินค้า / รุ่น\"></span></th><th>Thông số chính<span class=\"th\" data-t=\"ข้อกำหนดหลัก\"></span></th><th>Đơn vị<span class=\"th\" data-t=\"หน่วย\"></span></th><th>Số lượng<span class=\"th\" data-t=\"จำนวน\"></span></th><th>Đơn giá (VNĐ)<span class=\"th\" data-t=\"ราคาต่อหน่วย (VNĐ)\"></span></th><th>Thành tiền (VNĐ)<span class=\"th\" data-t=\"จำนวนเงิน (VNĐ)\"></span></th></tr><tr><td>1</td><td><span class=\"fx\" data-k=\"\"></span
