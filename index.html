ายการ\"></span></th><th>Hợp đồng bán (Owner)<span class=\"th\" data-t=\"สัญญาขาย (Owner)\"></span></th><th>Hợp đồng mua (Supplier) số <span class=\"fx\" data-k=\"SỐ\"></span><span class=\"th\" data-t=\"สัญญาซื้อ (Supplier) เลขที่ 【SỐ】\"></span></th><th>Chênh lệch / rủi ro KSP<span class=\"th\" data-t=\"ความแตกต่าง / ความเสี่ยงของ KSP\"></span></th><th>Biện pháp / người duyệt<span class=\"th\" data-t=\"มาตรการ / ผู้อนุมัติ\"></span></th></tr><tr><td>Giá trị / giá<span class=\"th\" data-t=\"มูลค่า / ราคา\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Tiến độ / ngày hoàn thành<span class=\"th\" data-t=\"กำหนดการ / วันที่แล้วเสร็จ\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Thời hạn thanh toán<span class=\"th\" data-t=\"กำหนดเวลาชำระเงิน\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Tạm ứng / bảo lãnh<span class=\"th\" data-t=\"เงินล่วงหน้า / หนังสือค้ำประกัน\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Phạt chậm / mức trần<span class=\"th\" data-t=\"ค่าปรับกรณีล่าช้า / เพดานสูงสุด\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Bảo hành (thời hạn, ngày bắt đầu, giữ lại)<span class=\"th\" data-t=\"การรับประกันผลงาน (ระยะเวลา วันเริ่มต้น เงินประกันผลงานที่กักไว้)\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Giới hạn trách nhiệm<span class=\"th\" data-t=\"ขีดจำกัดความรับผิด\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Quyền chấm dứt<span class=\"th\" data-t=\"สิทธิในการเลิกสัญญา\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Nghiệm thu / hồ sơ chất lượng<span class=\"th\" data-t=\"การตรวจรับ / เอกสารด้านคุณภาพ\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>An toàn, bảo hiểm<span class=\"th\" data-t=\"ความปลอดภัย การประกันภัย\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr></table></div>", "o4": "<p class=\"ctr\">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM<span class=\"th\" data-t=\"สาธารณรัฐสังคมนิยมเวียดนาม\"></span></p><p class=\"ctr\">Độc lập - Tự do - Hạnh phúc<span class=\"th\" data-t=\"เอกราช - เสรีภาพ - ความสุข\"></span></p><p class=\"ctr\"><strong>HỢP ĐỒNG KHUNG (HỢP ĐỒNG MỞ) CUNG CẤP HÀNG HÓA VÀ DỊCH VỤ</strong><span class=\"th\" data-t=\"สัญญากรอบ (สัญญาเปิด) การจัดหาสินค้าและบริการ\"></span></p><p class=\"ctr\">Số: <span class=\"fx\" data-k=\"SỐ HỢP ĐỒNG\"></span> | Dự án / PO: <span class=\"fx\" data-k=\"DỰ ÁN / MÃ PO / MÃ KHÁCH HÀNG\"></span><span class=\"th\" data-t=\"เลขที่: 【SỐ HỢP ĐỒNG】 | โครงการ / PO: 【DỰ ÁN / MÃ PO / MÃ KHÁCH HÀNG】\"></span></p><p>– Căn cứ Bộ luật Dân sự số 91/2015/QH13 và văn bản sửa đổi, bổ sung có hiệu lực tại thời điểm ký;<span class=\"th\" data-t=\"– โดยอาศัยประมวลกฎหมายแพ่ง ฉบับที่ 91/2015/QH13 และเอกสารแก้ไข เพิ่มเติมที่มีผลบังคับใช้ ณ เวลาลงนาม;\"></span></p><p>– Căn cứ Luật Thương mại số 36/2005/QH11 và văn bản hướng dẫn;<span class=\"th\" data-t=\"– อาศัยพระราชบัญญัติการพาณิชย์ ฉบับที่ 36/2005/QH11 และเอกสารที่ให้แนวทางปฏิบัติ;\"></span></p><p>– Căn cứ quy định pháp luật chuyên ngành tương ứng với hàng hóa, dịch vụ, công việc xây lắp thuộc từng đơn hàng;<span class=\"th\" data-t=\"– อาศัยบทบัญญัติของกฎหมายเฉพาะสาขาที่สอดคล้องกับสินค้า บริการ และงานก่อสร้างติดตั้งในแต่ละคำสั่งซื้อ;\"></span></p><p>– Căn cứ nhu cầu mua dài hạn của Bên A và khả năng cung cấp của Bên B.<span class=\"th\" data-t=\"– อาศัยความต้องการซื้อระยะยาวของฝ่าย A และความสามารถในการจัดหาของฝ่าย B\"></span></p><p>Hôm nay, ngày <span class=\"fx\" data-k=\"NGÀY\"></span> tháng <span class=\"fx\" data-k=\"THÁNG\"></span> năm <span class=\"fx\" data-k=\"NĂM\"></span>, Các Bên gồm:<span class=\"th\" data-t=\"วันนี้ วันที่ 【NGÀY】 เดือน 【THÁNG】 พ.ศ./ค.ศ. 【NĂM】 คู่สัญญาประกอบด้วย:\"></span></p><p class=\"sub\"><strong>BÊN A – KHÁCH HÀNG: <span class=\"fx\" data-k=\"TÊN PHÁP LÝ KHÁCH HÀNG\"></span></strong><span class=\"th\" data-t=\"ฝ่าย A – ลูกค้า: 【TÊN PHÁP LÝ KHÁCH HÀNG】\"></span></p><p>Đại diện: <span class=\"fx\" data-k=\"HỌ TÊN NGƯỜI KÝ\"></span> Chức vụ: <span class=\"fx\" data-k=\"CHỨC VỤ\"></span> Căn cứ thẩm quyền: <span class=\"fx\" data-k=\"ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY\"></span><span class=\"th\" data-t=\"ผู้แทน: 【HỌ TÊN NGƯỜI KÝ】 ตำแหน่ง: 【CHỨC VỤ】 ฐานอำนาจ: 【ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY】\"></span></p><p>Địa chỉ: <span class=\"fx\" data-k=\"ĐỊA CHỈ ĐĂNG KÝ\"></span> Mã số thuế / Mã số doanh nghiệp: <span class=\"fx\" data-k=\"MST / GCN ĐKDN\"></span><span class=\"th\" data-t=\"ที่อยู่: 【ĐỊA CHỈ ĐĂNG KÝ】 เลขประจำตัวผู้เสียภาษี / รหัสวิสาหกิจ: 【MST / GCN ĐKDN】\"></span></p><p>Tài khoản: <span class=\"fx\" data-k=\"CHỦ TÀI KHOẢN / SỐ TÀI KHOẢN / NGÂN HÀNG\"></span> Đại diện nhận thông báo: <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ\"></span> Email: <span class=\"fx\" data-k=\"EMAIL\"></span><span class=\"th\" data-t=\"บัญชี: 【CHỦ TÀI KHOẢN / SỐ TÀI KHOẢN / NGÂN HÀNG】 ผู้แทนรับหนังสือแจ้ง: 【HỌ TÊN / CHỨC VỤ】 อีเมล: 【EMAIL】\"></span></p><p class=\"sub\"><strong>BÊN B – NHÀ CUNG CẤP: CÔNG TY TNHH KSP VIỆT NAM <span class=\"fx\" data-k=\"CHI NHÁNH / ĐƠN VỊ THỰC HIỆN, NẾU CÓ\"></span></strong><span class=\"th\" data-t=\"ฝ่าย B – ผู้ขาย: บริษัท KSP เวียดนาม จำกัด (CÔNG TY TNHH KSP VIỆT NAM) 【CHI NHÁNH / ĐƠN VỊ THỰC HIỆN, NẾU CÓ】\"></span></p><p>Đại diện: <span class=\"fx\" data-k=\"HỌ TÊN NGƯỜI KÝ\"></span> Chức vụ: <span class=\"fx\" data-k=\"CHỨC VỤ\"></span> Căn cứ thẩm quyền: <span class=\"fx\" data-k=\"ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY\"></span><span class=\"th\" data-t=\"ผู้แทน: 【HỌ TÊN NGƯỜI KÝ】 ตำแหน่ง: 【CHỨC VỤ】 ฐานอำนาจ: 【ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY】\"></span></p><p>Địa chỉ: <span class=\"fx\" data-k=\"ĐỊA CHỈ PHÁP LÝ KSP – KIỂM TRA ĐĂNG KÝ HIỆN HÀNH\"></span> Mã số thuế: <span class=\"fx\" data-k=\"MST KSP / CHI NHÁNH\"></span><span class=\"th\" data-t=\"ที่อยู่: 【ĐỊA CHỈ PHÁP LÝ KSP – KIỂM TRA ĐĂNG KÝ HIỆN HÀNH】 เลขประจำตัวผู้เสียภาษี: 【MST KSP / CHI NHÁNH】\"></span></p><p>Tài khoản: <span class=\"fx\" data-k=\"SỐ TÀI KHOẢN / NGÂN HÀNG KSP\"></span> Đại diện nhận thông báo: <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ\"></span> Email: <span class=\"fx\" data-k=\"EMAIL\"></span><span class=\"th\" data-t=\"บัญชี: 【SỐ TÀI KHOẢN / NGÂN HÀNG KSP】 ผู้แทนรับหนังสือแจ้ง: 【HỌ TÊN / CHỨC VỤ】 อีเมล: 【EMAIL】\"></span></p><p>Hai Bên thỏa thuận ký kết hợp đồng khung cung cấp hàng hóa, dịch vụ (“Hợp đồng”) với các điều khoản sau:<span class=\"th\" data-t=\"ทั้งสองฝ่ายตกลงทำสัญญากรอบการจัดหาสินค้าและบริการ (“สัญญา”) โดยมีข้อกำหนดดังต่อไปนี้:\"></span></p><h3 class=\"art\" data-n=\"1\"><strong>ĐIỀU 1. BẢN CHẤT VÀ PHẠM VI HỢP ĐỒNG KHUNG</strong><span class=\"th\" data-t=\"ข้อ 1 ลักษณะและขอบเขตของสัญญากรอบ\"></span></h3><p class=\"lv1\"><span class=\"lb\">1.1</span>Hợp đồng này là hợp đồng khung, quy định điều kiện chung áp dụng cho mọi đơn đặt hàng (PO) hoặc lệnh công việc (WO) mà Bên A gửi và Bên B xác nhận trong thời hạn hiệu lực. Mỗi PO/WO được xác nhận là một hợp đồng riêng, gồm Hợp đồng khung này và nội dung PO/WO.<span class=\"th\" data-t=\"สัญญานี้เป็นสัญญากรอบ กำหนดเงื่อนไขทั่วไปที่ใช้กับทุกใบสั่งซื้อ (PO) หรือคำสั่งงาน (WO) ที่ฝ่าย A ส่งและฝ่าย B ยืนยันภายในระยะเวลาที่สัญญามีผลบังคับ PO/WO แต่ละฉบับที่ได้รับการยืนยันถือเป็นสัญญาแยกต่างหาก ประกอบด้วยสัญญากรอบนี้และเนื้อหาของ PO/WO\"></span></p><p class=\"lv1\"><span class=\"lb\">1.2</span>Phạm vi hàng hóa, dịch vụ thuộc hợp đồng khung: <span class=\"fx\" data-k=\"DANH MỤC / NHÓM HÀNG, DỊCH VỤ\"></span> theo Phụ lục 01.<span class=\"th\" data-t=\"ขอบเขตสินค้าและบริการภายใต้สัญญากรอบ: 【DANH MỤC / NHÓM HÀNG, DỊCH VỤ】 ตามภาคผนวก 01\"></span></p><p class=\"lv1\"><span class=\"lb\">1.3</span>Hợp đồng khung không tạo cam kết mua tối thiểu hay cung cấp độc quyền, trừ khi Phụ lục 04 quy định: <span class=\"fx\" data-k=\"KHÔNG CAM KẾT / SẢN LƯỢNG TỐI THIỂU / ĐỘC QUYỀN PHẠM VI\"></span>. Hạn mức dự kiến chỉ để tham khảo: <span class=\"fx\" data-k=\"SỐ TIỀN\"></span> VNĐ/<span class=\"fx\" data-k=\"NĂM\"></span>.<span class=\"th\" data-t=\"สัญญากรอบไม่ก่อให้เกิดข้อผูกพันในการซื้อขั้นต่ำหรือการจัดหาแต่เพียงผู้เดียว เว้นแต่ภาคผนวก 04 จะกำหนดว่า: 【KHÔNG CAM KẾT / SẢN LƯỢNG TỐI THIỂU / ĐỘC QUYỀN PHẠM VI】 วงเงินที่คาดการณ์ไว้ใช้เพื่อการอ้างอิงเท่านั้น: 【SỐ TIỀN】 VNĐ/ 【NĂM】\"></span></p><h3 class=\"art\" data-n=\"2\"><strong>ĐIỀU 2. PO / WO VÀ XÁC NHẬN</strong><span class=\"th\" data-t=\"ข้อ 2 PO / WO และการยืนยัน\"></span></h3><p class=\"lv1\"><span class=\"lb\">2.1</span>PO/WO nêu: hàng hóa/dịch vụ, số lượng, đơn giá (theo Phụ lục 01), địa điểm, thời hạn giao hoặc thực hiện, đầu mối nhận hàng. Gửi qua kênh <span class=\"fx\" data-k=\"EMAIL / PHẦN MỀM\"></span> do hai Bên thống nhất.<span class=\"th\" data-t=\"PO/WO ระบุ: สินค้า/บริการ จำนวน ราคาต่อหน่วย (ตามภาคผนวก 01) สถานที่ กำหนดส่งมอบหรือกำหนดดำเนินการ และผู้ประสานงานรับสินค้า ส่งผ่านช่องทาง 【EMAIL / PHẦN MỀM】 ที่ทั้งสองฝ่ายตกลงกัน\"></span></p><p class=\"lv1\"><span class=\"lb\">2.2</span>Bên B xác nhận hoặc từ chối trong <span class=\"fx\" data-k=\"03\"></span> ngày làm việc; không phản hồi không được coi là chấp nhận trừ khi PO đúng giá, thời hạn và hạn mức trong Phụ lục 01 và Bên B đã bắt đầu thực hiện. PO xác nhận chỉ thay đổi hoặc hủy theo Điều 7.<span class=\"th\" data-t=\"ฝ่าย B ยืนยันหรือปฏิเสธภายใน 【03】 วันทำการ การไม่ตอบกลับไม่ถือเป็นการยอมรับ เว้นแต่ PO นั้นถูกต้องตามราคา กำหนดเวลา และวงเงินในภาคผนวก 01 และฝ่าย B ได้เริ่มดำเนินการแล้ว PO ที่ได้รับการยืนยันแล้วจะเปลี่ยนแปลงหรือยกเลิกได้ตามข้อ 7 เท่านั้น\"></span></p><p class=\"lv1\"><span class=\"lb\">2.3</span>Điều kiện riêng trong báo giá, phiếu giao hàng, hóa đơn không làm thay đổi Hợp đồng khung, trừ khi hai Bên ký thỏa thuận riêng.<span class=\"th\" data-t=\"เงื่อนไขเฉพาะในใบเสนอราคา ใบส่งสินค้า หรือใบแจ้งหนี้ ไม่ทำให้สัญญากรอบเปลี่ยนแปลง เว้นแต่ทั้งสองฝ่ายลงนามในข้อตกลงแยกต่างหาก\"></span></p><h3 class=\"art\" data-n=\"3\"><strong>ĐIỀU 3. BẢNG GIÁ VÀ ĐIỀU CHỈNH</strong><span class=\"th\" data-t=\"ข้อ 3 ตารางราคาและการปรับราคา\"></span></h3><p class=\"lv1\"><span class=\"lb\">3.1</span>Đơn giá theo Phụ lục 01, <span class=\"fx\" data-k=\"CỐ ĐỊNH / THAY ĐỔI THEO CÔNG THỨC\"></span> trong <span class=\"fx\" data-k=\"SỐ\"></span> tháng kể từ ngày hiệu lực; chưa gồm VAT.<span class=\"th\" data-t=\"ราคาต่อหน่วยเป็นไปตามภาคผนวก 01 โดย 【CỐ ĐỊNH / THAY ĐỔI THEO CÔNG THỨC】 ภายใน 【SỐ】 เดือนนับจากวันที่มีผลบังคับ ราคายังไม่รวมภาษีมูลค่าเพิ่ม (VAT)\"></span></p><p class=\"lv1\"><span class=\"lb\">3.2</span>Điều chỉnh giá: khi chỉ số <span class=\"fx\" data-k=\"CHỈ SỐ / NGUỒN\"></span> biến động quá <span class=\"fx\" data-k=\"\"></span>% so với ngày tham chiếu, mỗi Bên đề nghị bằng văn bản; giá mới chỉ áp dụng cho PO chưa xác nhận kể từ ngày hai Bên ký phụ lục giá. PO đã xác nhận giữ giá.<span class=\"th\" data-t=\"การปรับราคา: เมื่อดัชนี 【CHỈ SỐ / NGUỒN】 เปลี่ยนแปลงเกินร้อยละ 【】 เมื่อเทียบกับวันอ้างอิง แต่ละฝ่ายอาจเสนอเป็นหนังสือ ราคาใหม่ใช้กับ PO ที่ยังไม่ได้รับการยืนยันนับจากวันที่ทั้งสองฝ่ายลงนามในภาคผนวกราคาเท่านั้น PO ที่ยืนยันแล้วคงราคาเดิม\"></span></p><h3 class=\"art\" data-n=\"4\"><strong>ĐIỀU 4. GIAO HÀNG, THỰC HIỆN VÀ CHUYỂN RỦI RO</strong><span class=\"th\" data-t=\"ข้อ 4 การส่งมอบ การดำเนินการ และการโอนความเสี่ยง\"></span></h3><p class=\"lv1\"><span class=\"lb\">4.1</span>Thời hạn và địa điểm theo từng PO/WO. Bên B thông báo trước <span class=\"fx\" data-k=\"24\"></span> giờ khi giao hàng. Giao từng phần được phép nếu PO không cấm.<span class=\"th\" data-t=\"กำหนดเวลาและสถานที่เป็นไปตามแต่ละ PO/WO ฝ่าย B แจ้งล่วงหน้า 【24】 ชั่วโมงเมื่อส่งมอบสินค้า อนุญาตให้ส่งมอบเป็นงวดได้หาก PO ไม่ห้ามไว้\"></span></p><p class=\"lv1\"><span class=\"lb\">4.2</span>Rủi ro và quyền sở hữu hàng hóa chuyển cho Bên A khi giao đúng địa điểm và ký biên bản giao nhận; với dịch vụ, khi nghiệm thu. Bên B bảo lưu quyền sở hữu đến khi thanh toán đủ giá trị PO tương ứng.<span class=\"th\" data-t=\"ความเสี่ยงและกรรมสิทธิ์ในสินค้าโอนไปยังฝ่าย A เมื่อส่งมอบถูกสถานที่และลงนามในรายงานการรับมอบ สำหรับบริการ เมื่อตรวจรับ ฝ่าย B สงวนกรรมสิทธิ์จนกว่าจะได้รับชำระเงินครบมูลค่า PO ที่เกี่ยวข้อง\"></span></p><h3 class=\"art\" data-n=\"5\"><strong>ĐIỀU 5. KIỂM TRA, NGHIỆM THU VÀ BẢO HÀNH</strong><span class=\"th\" data-t=\"ข้อ 5 การตรวจสอบ การตรวจรับ และการรับประกัน\"></span></h3><p class=\"lv1\"><span class=\"lb\">5.1</span>Bên A kiểm tra, nghiệm thu trong <span class=\"fx\" data-k=\"05\"></span> ngày làm việc; không phản hồi bằng văn bản thì hàng/dịch vụ đã được sử dụng được coi là nghiệm thu về số lượng và ngoại quan.<span class=\"th\" data-t=\"ฝ่าย A ตรวจสอบและตรวจรับภายใน 【05】 วันทำการ หากไม่ตอบกลับเป็นหนังสือ ให้ถือว่าสินค้า/บริการที่ได้นำไปใช้แล้วได้รับการตรวจรับในด้านจำนวนและลักษณะภายนอก\"></span></p><p class=\"lv1\"><span class=\"lb\">5.2</span>Bảo hành: <span class=\"fx\" data-k=\"12\"></span> tháng kể từ ngày giao/nghiệm thu từng PO, hoặc theo PO nếu khác; loại trừ như Điều 9 của hợp đồng mua bán tiêu chuẩn: hao mòn, vận hành sai, sửa chữa bởi bên không được ủy quyền.<span class=\"th\" data-t=\"การรับประกัน: 【12】 เดือนนับจากวันส่งมอบ/ตรวจรับของแต่ละ PO หรือตาม PO หากแตกต่าง ข้อยกเว้นเช่นเดียวกับข้อ 9 ของสัญญาซื้อขายมาตรฐาน ได้แก่ การสึกหรอ การใช้งานผิดวิธี การซ่อมแซมโดยบุคคลที่ไม่ได้รับมอบอำนาจ\"></span></p><h3 class=\"art\" data-n=\"6\"><strong>ĐIỀU 6. THANH TOÁN</strong><span class=\"th\" data-t=\"ข้อ 6 การชำระเงิน\"></span></h3><p class=\"lv1\"><span class=\"lb\">6.1</span>Thanh toán từng PO trong <span class=\"fx\" data-k=\"15 / 30\"></span> ngày kể từ ngày Bên A nhận hóa đơn điện tử hợp lệ (Nghị định 123/2020/NĐ-CP) kèm biên bản giao nhận/nghiệm thu; chuyển khoản VNĐ.<span class=\"th\" data-t=\"ชำระเงินแต่ละ PO ภายใน 【15 / 30】 วันนับจากวันที่ฝ่าย A ได้รับใบแจ้งหนี้อิเล็กทรอนิกส์ที่ชอบด้วยกฎหมาย (ตามพระราชกฤษฎีกา ฉบับที่ 123/2020/NĐ-CP) พร้อมรายงานการรับมอบ/ตรวจรับ โดยโอนเงินเป็นสกุล VNĐ\"></span></p><p class=\"lv1\"><span class=\"lb\">6.2</span>Tạm ứng, hạn mức công nợ: <span class=\"fx\" data-k=\"KHÔNG / TỶ LỆ, HẠN MỨC\"></span>; vượt hạn mức công nợ Bên B có quyền tạm hoãn xác nhận PO mới.<span class=\"th\" data-t=\"เงินล่วงหน้า วงเงินเครดิต: 【KHÔNG / TỶ LỆ, HẠN MỨC】 เมื่อเกินวงเงินเครดิต ฝ่าย B มีสิทธิระงับการยืนยัน PO ใหม่ไว้ชั่วคราว\"></span></p><p class=\"lv1\"><span class=\"lb\">6.3</span>Chậm thanh toán: lãi <span class=\"fx\" data-k=\"\"></span>%/năm trên số tiền chậm, không vượt mức pháp luật cho phép; chậm quá <span class=\"fx\" data-k=\"30\"></span> ngày sau thông báo, Bên B tạm ngừng giao hàng.<span class=\"th\" data-t=\"การชำระเงินล่าช้า: ดอกเบี้ยร้อยละ 【】 ต่อปีของจำนวนเงินที่ล่าช้า ทั้งนี้ไม่เกินอัตราที่กฎหมายอนุญาต หากล่าช้าเกิน 【30】 วันหลังการแจ้ง ฝ่าย B ระงับการส่งมอบสินค้าชั่วคราว\"></span></p><h3 class=\"art\" data-n=\"7\"><strong>ĐIỀU 7. THAY ĐỔI, HỦY PO VÀ HÀNG ĐẶT RIÊNG</strong><span class=\"th\" data-t=\"ข้อ 7 การเปลี่ยนแปลง การยกเลิก PO และสินค้าสั่งทำพิเศษ\"></span></h3><p class=\"lv1\"><span class=\"lb\">7.1</span>Bên A có thể yêu cầu thay đổi/hủy PO chưa giao trước <span class=\"fx\" data-k=\"\"></span> ngày so với ngày giao; Bên B chấp thuận nếu chưa mua, chưa gia công. Phát sinh chi phí chứng minh được (hàng đặt riêng, hàng đã mua, nguyên liệu, nhân công) do Bên A chịu.<span class=\"th\" data-t=\"ฝ่าย A อาจขอเปลี่ยนแปลง/ยกเลิก PO ที่ยังไม่ได้ส่งมอบล่วงหน้า 【】 วันก่อนวันส่งมอบ ฝ่าย B จะยอมรับหากยังไม่ได้จัดซื้อ ยังไม่ได้ผลิตหรือแปรรูป ค่าใช้จ่ายที่เกิดขึ้นซึ่งพิสูจน์ได้ (สินค้าสั่งทำพิเศษ สินค้าที่ซื้อแล้ว วัตถุดิบ แรงงาน) ให้ฝ่าย A เป็นผู้รับผิดชอบ\"></span></p><p class=\"lv1\"><span class=\"lb\">7.2</span>Hàng đặt riêng, theo thông số của Bên A không được trả lại hoặc hủy sau khi Bên B đã đặt nhà sản xuất.<span class=\"th\" data-t=\"สินค้าสั่งทำพิเศษตามข้อกำหนดของฝ่าย A ไม่อาจคืนหรือยกเลิกได้หลังจากที่ฝ่าย B ได้สั่งผู้ผลิตแล้ว\"></span></p><h3 class=\"art\" data-n=\"8\"><strong>ĐIỀU 8. PHẠT VI PHẠM VÀ GIỚI HẠN TRÁCH NHIỆM</strong><span class=\"th\" data-t=\"ข้อ 8 ค่าปรับตามสัญญาและการจำกัดความรับผิด\"></span></h3><p class=\"lv1\"><span class=\"lb\">8.1</span>Giao chậm theo PO do lỗi Bên B: phạt <span class=\"fx\" data-k=\"0,05\"></span>%/ngày giá trị phần chậm, tối đa <span class=\"fx\" data-k=\"8\"></span>% giá trị phần nghĩa vụ bị vi phạm (Điều 301 Luật Thương mại 2005 nếu áp dụng; xác nhận quy định hiện hành). Chậm thanh toán: lãi theo Điều 6.3.<span class=\"th\" data-t=\"การส่งมอบล่าช้าตาม PO เนื่องจากความผิดของฝ่าย B: ปรับร้อยละ 【0,05】 ต่อวันของมูลค่าส่วนที่ล่าช้า สูงสุดไม่เกินร้อยละ 【8】 ของมูลค่าส่วนภาระผูกพันที่ถูกละเมิด (มาตรา 301 กฎหมายพาณิชย์ ค.ศ. 2005 หากบังคับใช้ ทั้งนี้ ให้ยืนยันบทบัญญัติที่มีผลบังคับใช้ในปัจจุบัน) การชำระเงินล่าช้า: ดอกเบี้ยตามข้อ 6.3\"></span></p><p class=\"lv1\"><span class=\"lb\">8.2</span>Tổng trách nhiệm của Bên B trong mỗi PO tối đa <span class=\"fx\" data-k=\"100\"></span>% giá trị PO chưa VAT; không bồi thường thiệt hại gián tiếp, mất sản lượng, mất lợi nhuận, trừ khi do cố ý hoặc vi phạm pháp luật bắt buộc.<span class=\"th\" data-t=\"ความรับผิดรวมของฝ่าย B ในแต่ละ PO สูงสุดไม่เกินร้อยละ 【100】 ของมูลค่า PO ที่ยังไม่รวมภาษีมูลค่าเพิ่ม (VAT) ไม่ต้องชดใช้ความเสียหายทางอ้อม การสูญเสียผลผลิต การสูญเสียกำไร เว้นแต่เกิดจากเจตนาหรือการฝ่าฝืนบทบัญญัติแห่งกฎหมายที่เป็นข้อบังคับ\"></span></p><h3 class=\"art\" data-n=\"9\"><strong>ĐIỀU 9. THỜI HẠN VÀ CHẤM DỨT</strong><span class=\"th\" data-t=\"ข้อ 9 ระยะเวลาและการยุติสัญญา\"></span></h3><p class=\"lv1\"><span class=\"lb\">9.1</span>Hợp đồng khung có hiệu lực <span class=\"fx\" data-k=\"SỐ\"></span> tháng kể từ <span class=\"fx\" data-k=\"NGÀY\"></span>, tự gia hạn <span class=\"fx\" data-k=\"SỐ\"></span> tháng nếu không bên nào thông báo trước <span class=\"fx\" data-k=\"60\"></span> ngày.<span class=\"th\" data-t=\"สัญญากรอบมีผลบังคับเป็นเวลา 【SỐ】 เดือนนับจาก 【NGÀY】 และต่ออายุอัตโนมัติคราวละ 【SỐ】 เดือน หากไม่มีฝ่ายใดแจ้งล่วงหน้า 【60】 วัน\"></span></p><p class=\"lv1\"><span class=\"lb\">9.2</span>Mỗi Bên chấm dứt khi Bên kia vi phạm nghiêm trọng không khắc phục trong <span class=\"fx\" data-k=\"15\"></span> ngày kể từ thông báo; hoặc chấm dứt không cần lý do với thông báo trước <span class=\"fx\" data-k=\"60\"></span> ngày. PO đã xác nhận vẫn được thực hiện đến hết trừ khi chấm dứt do vi phạm nghiêm trọng liên quan đến PO đó.<span class=\"th\" data-t=\"แต่ละฝ่ายยุติสัญญาได้เมื่ออีกฝ่ายหนึ่งผิดสัญญาอย่างร้ายแรงและไม่แก้ไขภายใน 【15】 วันนับจากการแจ้ง หรือยุติสัญญาโดยไม่ต้องมีเหตุผลโดยแจ้งล่วงหน้า 【60】 วัน PO ที่ได้รับการยืนยันแล้วยังคงต้องดำเนินการจนเสร็จสิ้น เว้นแต่เป็นการยุติสัญญาเนื่องจากการผิดสัญญาอย่างร้ายแรงที่เกี่ยวข้องกับ PO นั้น\"></span></p><h3 class=\"art\" data-n=\"10\"><strong>ĐIỀU 10. BẤT KHẢ KHÁNG</strong><span class=\"th\" data-t=\"ข้อ 10 เหตุสุดวิสัย\"></span></h3><p class=\"lv1\"><span class=\"lb\">10.1</span>Bất khả kháng là sự kiện xảy ra một cách khách quan không thể lường trước và không thể khắc phục được mặc dù đã áp dụng mọi biện pháp cần thiết và khả năng cho phép (Điều 156 Bộ luật Dân sự 2015), kể cả thiên tai, dịch bệnh, chiến tranh, quyết định của cơ quan nhà nước có thẩm quyền làm cấm hoặc đình chỉ việc thực hiện hợp đồng.<span class=\"th\" data-t=\"เหตุสุดวิสัยคือเหตุการณ์ที่เกิดขึ้นโดยปรากฏชัดแจ้งตามวัตถุวิสัย ไม่อาจคาดการณ์ได้ และไม่อาจแก้ไขได้ แม้ได้ใช้มาตรการทุกอย่างที่จำเป็นและเท่าที่ความสามารถอำนวยแล้ว (มาตรา 156 ประมวลกฎหมายแพ่ง ค.ศ. 2015) รวมถึงภัยธรรมชาติ โรคระบาด สงคราม และคำสั่งของหน่วยงานของรัฐที่มีอำนาจที่ห้ามหรือระงับการปฏิบัติตามสัญญา\"></span></p><p class=\"lv1\"><span class=\"lb\">10.2</span>Bên bị ảnh hưởng phải thông báo bằng văn bản cho Bên kia trong <span class=\"fx\" data-k=\"07\"></span> ngày kể từ ngày sự kiện xảy ra, kèm chứng cứ (xác nhận của cơ quan có thẩm quyền nếu có), áp dụng mọi biện pháp hợp lý để hạn chế thiệt hại và nối lại việc thực hiện ngay khi có thể. Thông báo chậm làm Bên bị ảnh hưởng mất quyền miễn trách nhiệm đối với phần thiệt hại phát sinh do chậm thông báo.<span class=\"th\" data-t=\"ฝ่ายที่ได้รับผลกระทบต้องแจ้งเป็นลายลักษณ์อักษรให้อีกฝ่ายทราบภายใน 【07】 วัน นับจากวันที่เหตุการณ์เกิดขึ้น พร้อมพยานหลักฐาน (การรับรองจากหน่วยงานที่มีอำนาจ หากมี) ใช้มาตรการที่สมเหตุสมผลทุกอย่างเพื่อลดความเสียหาย และกลับมาปฏิบัติตามสัญญาโดยเร็วที่สุดเท่าที่ทำได้ การแจ้งล่าช้าทำให้ฝ่ายที่ได้รับผลกระทบสูญเสียสิทธิในการได้รับยกเว้นความรับผิดสำหรับความเสียหายที่เกิดจากการแจ้งล่าช้า\"></span></p><p class=\"lv1\"><span class=\"lb\">10.3</span>Không được coi là bất khả kháng: khó khăn tài chính, biến động giá, thiếu nhân công, vật tư, phương tiện; lỗi của nhà thầu phụ, nhà cung cấp, nhà vận chuyển của Bên vi phạm, trừ khi chính họ gặp sự kiện bất khả kháng đáp ứng định nghĩa trên.<span class=\"th\" data-t=\"ไม่ถือเป็นเหตุสุดวิสัย: ความยากลำบากทางการเงิน ความผันผวนของราคา การขาดแคลนแรงงาน วัสดุ และยานพาหนะ; ความผิดของผู้รับเหมาช่วง ผู้จัดหา ผู้ขนส่งของฝ่ายที่ผิดสัญญา เว้นแต่บุคคลเหล่านั้นประสบเหตุสุดวิสัยที่เข้าตามคำนิยามข้างต้น\"></span></p><p class=\"lv1\"><span class=\"lb\">10.4</span>Nếu sự kiện bất khả kháng kéo dài quá <span class=\"fx\" data-k=\"60\"></span> ngày liên tục, Các Bên thương lượng phương án tiếp tục hoặc chấm dứt. Nếu không thỏa thuận được, mỗi Bên có quyền chấm dứt phần hợp đồng bị ảnh hưởng bằng thông báo trước <span class=\"fx\" data-k=\"15\"></span> ngày; phần đã thực hiện đúng hợp đồng được thanh toán, không bên nào phải chịu phạt vi phạm.<span class=\"th\" data-t=\"หากเหตุสุดวิสัยดำเนินต่อเนื่องเกิน 【60】 วัน ทั้งสองฝ่ายต้องเจรจาแนวทางดำเนินการต่อหรือเลิกสัญญา หากตกลงกันไม่ได้ แต่ละฝ่ายมีสิทธิเลิกสัญญาในส่วนที่ได้รับผลกระทบโดยแจ้งล่วงหน้า 【15】 วัน; ส่วนที่ได้ดำเนินการถูกต้องตามสัญญาแล้วจะได้รับการชำระเงิน และไม่ฝ่ายใดต้องรับผิดค่าปรับตามสัญญา\"></span></p><h3 class=\"art\" data-n=\"11\"><strong>ĐIỀU 11. BẢO MẬT, SỞ HỮU TRÍ TUỆ VÀ BẢO VỆ DỮ LIỆU CÁ NHÂN</strong><span class=\"th\" data-t=\"ข้อ 11 การรักษาความลับ ทรัพย์สินทางปัญญา และการคุ้มครองข้อมูลส่วนบุคคล\"></span></h3><p class=\"lv1\"><span class=\"lb\">11.1</span>Mỗi Bên giữ bí mật thông tin kỹ thuật, giá, tài liệu và thông tin kinh doanh của Bên kia nhận được liên quan đến hợp đồng; chỉ sử dụng cho mục đích thực hiện hợp đồng và chỉ tiết lộ cho nhân sự, tư vấn, ngân hàng, bảo hiểm cần biết hoặc khi cơ quan nhà nước có thẩm quyền yêu cầu theo luật.<span class=\"th\" data-t=\"แต่ละฝ่ายต้องรักษาความลับของข้อมูลทางเทคนิค ราคา เอกสาร และข้อมูลทางธุรกิจของอีกฝ่ายที่ได้รับเกี่ยวกับสัญญา ใช้เพื่อวัตถุประสงค์ในการปฏิบัติตามสัญญาเท่านั้น และเปิดเผยเฉพาะแก่บุคลากร ที่ปรึกษา ธนาคาร บริษัทประกันภัยที่จำเป็นต้องรู้ หรือเมื่อหน่วยงานของรัฐที่มีอำนาจเรียกร้องตามกฎหมาย\"></span></p><p class=\"lv1\"><span class=\"lb\">11.2</span>Nghĩa vụ bảo mật kéo dài <span class=\"fx\" data-k=\"03\"></span> năm sau khi hợp đồng chấm dứt hoặc hết hiệu lực. Quyền sở hữu trí tuệ đối với tài liệu, bản vẽ, phần mềm của mỗi Bên không chuyển giao, trừ phạm vi được cấp phép sử dụng để thực hiện và sử dụng sản phẩm của hợp đồng.<span class=\"th\" data-t=\"ภาระผูกพันในการรักษาความลับมีผลต่อเนื่อง 【03】 ปี หลังสัญญาเลิกหรือสิ้นผลบังคับ สิทธิในทรัพย์สินทางปัญญาในเอกสาร แบบ และซอฟต์แวร์ของแต่ละฝ่ายไม่โอนให้กัน เว้นแต่ขอบเขตที่ได้รับอนุญาตให้ใช้เพื่อปฏิบัติตามสัญญาและใช้ผลิตภัณฑ์ของสัญญา\"></span></p><p class=\"lv1\"><span class=\"lb\">11.3</span>Khi xử lý dữ liệu cá nhân của người lao động, đại diện, đầu mối của Bên kia, mỗi Bên tuân thủ pháp luật về bảo vệ dữ liệu cá nhân (Nghị định 13/2023/NĐ-CP và văn bản thay thế, sửa đổi nếu có), chỉ xử lý trong phạm vi cần thiết cho hợp đồng.<span class=\"th\" data-t=\"เมื่อประมวลผลข้อมูลส่วนบุคคลของลูกจ้าง ผู้แทน และผู้ประสานงานของอีกฝ่าย แต่ละฝ่ายต้องปฏิบัติตามกฎหมายว่าด้วยการคุ้มครองข้อมูลส่วนบุคคล (พระราชกฤษฎีกา ฉบับที่ 13/2023/NĐ-CP และเอกสารที่ใช้แทนหรือแก้ไขเพิ่มเติม หากมี) และประมวลผลเฉพาะในขอบเขตที่จำเป็นสำหรับสัญญา\"></span></p><h3 class=\"art\" data-n=\"12\"><strong>ĐIỀU 12. TUÂN THỦ PHÁP LUẬT, CHỐNG HỐI LỘ VÀ XUNG ĐỘT LỢI ÍCH</strong><span class=\"th\" data-t=\"ข้อ 12 การปฏิบัติตามกฎหมาย การต่อต้านการให้สินบน และความขัดแย้งทางผลประโยชน์\"></span></h3><p class=\"lv1\"><span class=\"lb\">12.1</span>Các Bên tuân thủ pháp luật Việt Nam về thuế, hóa đơn, lao động, môi trường, an toàn, cạnh tranh và phòng chống tham nhũng, hối lộ.<span class=\"th\" data-t=\"ทั้งสองฝ่ายปฏิบัติตามกฎหมายเวียดนามว่าด้วยภาษี ใบกำกับภาษี แรงงาน สิ่งแวดล้อม ความปลอดภัย การแข่งขัน และการป้องกันและต่อต้านการทุจริตและการให้สินบน\"></span></p><p class=\"lv1\"><span class=\"lb\">12.2</span>Không bên nào được đưa, đề nghị, nhận tiền, quà tặng hoặc lợi ích bất chính cho hoặc từ nhân sự của Bên kia, khách hàng hoặc bên thứ ba để có lợi thế trong hợp đồng; vi phạm là vi phạm nghiêm trọng, Bên bị vi phạm có quyền chấm dứt hợp đồng ngay bằng văn bản.<span class=\"th\" data-t=\"ห้ามฝ่ายใดให้ เสนอ หรือรับเงิน ของขวัญ หรือผลประโยชน์ที่มิชอบ แก่หรือจากบุคลากรของอีกฝ่าย ลูกค้า หรือบุคคลที่สาม เพื่อให้ได้เปรียบในสัญญา; การฝ่าฝืนถือเป็นการผิดสัญญาอย่างร้ายแรง ฝ่ายที่ถูกละเมิดมีสิทธิเลิกสัญญาทันทีโดยหนังสือเป็นลายลักษณ์อักษร\"></span></p><p class=\"lv1\"><span class=\"lb\">12.3</span>Mỗi Bên thông báo ngay cho Bên kia khi có xung đột lợi ích thực tế hoặc tiềm ẩn liên quan đến người tham gia ký kết, đánh giá, nghiệm thu hợp đồng.<span class=\"th\" data-t=\"แต่ละฝ่ายต้องแจ้งให้อีกฝ่ายทราบทันทีเมื่อมีความขัดแย้งทางผลประโยชน์ที่เกิดขึ้นจริงหรืออาจเกิดขึ้น เกี่ยวกับผู้ที่เข้าร่วมการลงนาม การประเมิน และการตรวจรับสัญญา\"></span></p><h3 class=\"art\" data-n=\"13\"><strong>ĐIỀU 13. LUẬT ÁP DỤNG VÀ GIẢI QUYẾT TRANH CHẤP</strong><span class=\"th\" data-t=\"ข้อ 13 กฎหมายที่ใช้บังคับและการระงับข้อพิพาท\"></span></h3><p class=\"lv1\"><span class=\"lb\">13.1</span>Hợp đồng chịu sự điều chỉnh của pháp luật Việt Nam.<span class=\"th\" data-t=\"สัญญานี้อยู่ภายใต้บังคับของกฎหมายเวียดนาม\"></span></p><p class=\"lv1\"><span class=\"lb\">13.2</span>Tranh chấp được giải quyết trước hết bằng thương lượng, hòa giải thiện chí trong <span class=\"fx\" data-k=\"30\"></span> ngày kể từ ngày một Bên gửi thông báo tranh chấp bằng văn bản nêu rõ nội dung, căn cứ và yêu cầu.<span class=\"th\" data-t=\"ข้อพิพาทให้ระงับเป็นลำดับแรกโดยการเจรจาและไกล่เกลี่ยด้วยความสุจริตภายใน 【30】 วัน นับจากวันที่ฝ่ายหนึ่งส่งหนังสือแจ้งข้อพิพาทเป็นลายลักษณ์อักษรระบุเนื้อหา ฐาน และข้อเรียกร้องอย่างชัดเจน\"></span></p><p class=\"lv1\"><span class=\"lb\">13.3</span>Nếu không giải quyết được, tranh chấp được đưa ra (chỉ chọn một): <span class=\"fx\" data-k=\"TÒA ÁN NHÂN DÂN CÓ THẨM QUYỀN TẠI (TỈNH/THÀNH PHỐ) / TRUNG TÂM TRỌNG TÀI QUỐC TẾ VIỆT NAM (VIAC), LUẬT TỐ TỤNG VIAC, 01 TRỌNG TÀI VIÊN, TRỤ SỞ TRỌNG TÀI TẠI (ĐỊA ĐIỂM), NGÔN NGỮ TIẾNG VIỆT\"></span>. Nếu chọn trọng tài, thỏa thuận này là thỏa thuận trọng tài độc lập, phán quyết là chung thẩm.<span class=\"th\" data-t=\"หากระงับไม่ได้ ให้นำข้อพิพาทเสนอต่อ (เลือกเพียงอย่างเดียว): 【TÒA ÁN NHÂN DÂN CÓ THẨM QUYỀN TẠI (TỈNH/THÀNH PHỐ) / TRUNG TÂM TRỌNG TÀI QUỐC TẾ VIỆT NAM (VIAC), LUẬT TỐ TỤNG VIAC, 01 TRỌNG TÀI VIÊN, TRỤ SỞ TRỌNG TÀI TẠI (ĐỊA ĐIỂM), NGÔN NGỮ TIẾNG VIỆT】 หากเลือกอนุญาโตตุลาการ ข้อตกลงนี้เป็นข้อตกลงอนุญาโตตุลาการที่เป็นอิสระ และคำชี้ขาดเป็นที่สุด\"></span></p><p class=\"lv1\"><span class=\"lb\">13.4</span>Trong thời gian giải quyết tranh chấp, Các Bên tiếp tục thực hiện các phần nghĩa vụ không bị tranh chấp.<span class=\"th\" data-t=\"ในระหว่างการระงับข้อพิพาท ทั้งสองฝ่ายต้องปฏิบัติตามภาระผูกพันในส่วนที่ไม่มีข้อพิพาทต่อไป\"></span></p><p class=\"lv1\"><span class=\"lb\">13.5</span>Hợp đồng lập bằng tiếng Việt. Bản dịch sang tiếng Anh hoặc tiếng Thái (nếu có) chỉ để tham khảo; khi có khác biệt, bản tiếng Việt có giá trị áp dụng.<span class=\"th\" data-t=\"สัญญาจัดทำเป็นภาษาเวียดนาม ฉบับแปลเป็นภาษาอังกฤษหรือภาษาไทย (หากมี) ใช้เพื่อการอ้างอิงเท่านั้น หากมีความแตกต่าง ให้ถือฉบับภาษาเวียดนามเป็นฉบับที่ใช้บังคับ\"></span></p><h3 class=\"art\" data-n=\"14\"><strong>ĐIỀU 14. ĐIỀU KHOẢN CHUNG VÀ HIỆU LỰC</strong><span class=\"th\" data-t=\"ข้อ 14 ข้อกำหนดทั่วไปและการมีผลบังคับ\"></span></h3><p class=\"lv1\"><span class=\"lb\">14.1</span>Thông báo phải bằng văn bản, gửi tới địa chỉ, email của đại diện nhận thông báo nêu ở phần đầu Hợp đồng (hoặc địa chỉ được thông báo thay đổi bằng văn bản). Thông báo gửi bằng email có hiệu lực khi hệ thống không báo lỗi và đã gửi bản gốc trong <span class=\"fx\" data-k=\"05\"></span> ngày làm việc nếu Bên nhận yêu cầu.<span class=\"th\" data-t=\"การแจ้งต้องเป็นลายลักษณ์อักษร ส่งไปยังที่อยู่และอีเมลของผู้แทนผู้รับแจ้งที่ระบุไว้ในส่วนต้นของสัญญา (หรือที่อยู่ที่แจ้งเปลี่ยนแปลงเป็นลายลักษณ์อักษร) การแจ้งทางอีเมลมีผลเมื่อระบบไม่แจ้งข้อผิดพลาด และได้ส่งฉบับจริงภายใน 【05】 วันทำการ หากฝ่ายผู้รับร้องขอ\"></span></p><p class=\"lv1\"><span class=\"lb\">14.2</span>Không bên nào được chuyển nhượng quyền, nghĩa vụ theo hợp đồng cho bên thứ ba khi chưa có chấp thuận bằng văn bản của Bên kia, trừ quyền nhận tiền được chuyển nhượng theo quy định pháp luật và thông báo cho Bên có nghĩa vụ.<span class=\"th\" data-t=\"ห้ามฝ่ายใดโอนสิทธิและภาระผูกพันตามสัญญาให้บุคคลที่สามโดยยังไม่ได้รับความยินยอมเป็นลายลักษณ์อักษรจากอีกฝ่าย เว้นแต่สิทธิในการรับเงินที่โอนได้ตามกฎหมายและแจ้งให้ฝ่ายที่มีหน้าที่ทราบ\"></span></p><p class=\"lv1\"><span class=\"lb\">14.3</span>Mọi sửa đổi, bổ sung chỉ có hiệu lực khi lập thành văn bản có chữ ký của người có thẩm quyền của cả hai Bên. Phụ lục là một phần không tách rời; khi có mâu thuẫn, thứ tự ưu tiên: (i) Phụ lục điều kiện đặc biệt được hai Bên ký, (ii) nội dung Hợp đồng, (iii) các Phụ lục còn lại.<span class=\"th\" data-t=\"การแก้ไขเพิ่มเติมทั้งหมดมีผลต่อเมื่อจัดทำเป็นลายลักษณ์อักษรและมีลายมือชื่อของผู้มีอำนาจของทั้งสองฝ่าย ภาคผนวกเป็นส่วนหนึ่งของสัญญาที่แยกจากกันไม่ได้ เมื่อมีความขัดแย้งให้ใช้ลำดับความสำคัญดังนี้: (i) ภาคผนวกเงื่อนไขพิเศษที่ทั้งสองฝ่ายลงนาม (ii) เนื้อหาของสัญญา (iii) ภาคผนวกอื่น ๆ\"></span></p><p class=\"lv1\"><span class=\"lb\">14.4</span>Nếu một điều khoản bị tuyên vô hiệu hoặc không thể thi hành, các điều khoản còn lại vẫn có hiệu lực; Các Bên thương lượng điều khoản thay thế gần nhất với ý chí ban đầu.<span class=\"th\" data-t=\"หากข้อกำหนดใดถูกวินิจฉัยว่าเป็นโมฆะหรือไม่อาจบังคับใช้ได้ ข้อกำหนดที่เหลือยังคงมีผลบังคับ; ทั้งสองฝ่ายต้องเจรจาข้อกำหนดทดแทนที่ใกล้เคียงกับเจตนารมณ์เดิมมากที่สุด\"></span></p><p class=\"lv1\"><span class=\"lb\">14.5</span>Hợp đồng có hiệu lực từ ngày <span class=\"fx\" data-k=\"NGÀY KÝ / ĐIỀU KIỆN CÓ HIỆU LỰC\"></span>, lập thành <span class=\"fx\" data-k=\"04\"></span> bản có giá trị như nhau, mỗi Bên giữ <span class=\"fx\" data-k=\"02\"></span> bản.<span class=\"th\" data-t=\"สัญญามีผลตั้งแต่วันที่ 【NGÀY KÝ / ĐIỀU KIỆN CÓ HIỆU LỰC】 จัดทำเป็น 【04】 ฉบับ มีค่าเท่ากัน โดยแต่ละฝ่ายเก็บไว้ 【02】 ฉบับ\"></span></p><div class=\"tw2\"><table class=\"ct\"><tr><th>ĐẠI DIỆN BÊN A<span class=\"th\" data-t=\"ผู้แทนฝ่าย A\"></span></th><th>ĐẠI DIỆN BÊN B<span class=\"th\" data-t=\"ผู้แทนฝ่าย B\"></span></th></tr><tr><td>(Ký, ghi rõ họ tên, chức danh, đóng dấu nếu có) <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ / NGÀY\"></span><span class=\"th\" data-t=\"(ลงนาม ระบุชื่อ-นามสกุล ตำแหน่ง และประทับตราหากมี) 【HỌ TÊN / CHỨC VỤ / NGÀY】\"></span></td><td>(Ký, ghi rõ họ tên, chức danh, đóng dấu nếu có) <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ / NGÀY\"></span><span class=\"th\" data-t=\"(ลงนาม ระบุชื่อ-นามสกุล ตำแหน่ง และประทับตราหากมี) 【HỌ TÊN / CHỨC VỤ / NGÀY】\"></span></td></tr></table></div><h3 class=\"ann\" data-n=\"01\"><strong>PHỤ LỤC 01 – BẢNG GIÁ HÀNG HÓA, DỊCH VỤ VÀ HẠN MỨC</strong><span class=\"th\" data-t=\"ภาคผนวก 01 – ตารางราคาสินค้า บริการ และวงเงิน\"></span></h3><div class=\"tw2\"><table class=\"ct\"><tr><th>STT<span class=\"th\" data-t=\"ลำดับ\"></span></th><th>Hàng hóa / dịch vụ<span class=\"th\" data-t=\"สินค้า / บริการ\"></span></th><th>Quy cách / SLA<span class=\"th\" data-t=\"ข้อกำหนด / SLA\"></span></th><th>Đơn vị<span class=\"th\" data-t=\"หน่วย\"></span></th><th>Đơn giá (VNĐ)<span class=\"th\" data-t=\"ราคาต่อหน่วย (VNĐ)\"></span></th><th>Hiệu lực giá đến<span class=\"th\" data-t=\"ราคามีผลถึง\"></span></th><th>Giao tối thiểu / lead time<span class=\"th\" data-t=\"การส่งมอบขั้นต่ำ / lead time\"></span></th></tr><tr><td>1</td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>2</td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr></table></div><h3 class=\"ann\" data-n=\"02\"><strong>PHỤ LỤC 02 – MẪU PO / WO VÀ BIÊN BẢN GIAO NHẬN</strong><span class=\"th\" data-t=\"ภาคผนวก 02 – แบบ PO / WO และรายงานการรับมอบ\"></span></h3><div class=\"tw2\"><table class=\"ct\"><tr><th>Số PO<span class=\"th\" data-t=\"เลข PO\"></span></th><th>Ngày<span class=\"th\" data-t=\"วันที่\"></span></th><th>Hàng hóa / dịch vụ<span class=\"th\" data-t=\"สินค้า / บริการ\"></span></th><th>Số lượng<span class=\"th\" data-t=\"จำนวน\"></span></th><th>Đơn giá<span class=\"th\" data-t=\"ราคาต่อหน่วย\"></span></th><th>Giao tại / ngày<span class=\"th\" data-t=\"ส่งมอบที่ / วันที่\"></span></th><th>Đầu mối nhận hàng<span class=\"th\" data-t=\"ผู้ประสานงานรับสินค้า\"></span></th></tr><tr><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr></table></div><h3 class=\"ann\" data-n=\"03\"><strong>PHỤ LỤC 03 – ĐỐI CHIẾU NỘI BỘ BACK-TO-BACK VỚI NHÀ CUNG CẤP (KHÔNG GỬI KHÁCH HÀNG)</strong><span class=\"th\" data-t=\"ภาคผนวก 03 – การเทียบเคียงภายในแบบ Back-to-Back กับผู้ขาย (ไม่ส่งให้ลูกค้า)\"></span></h3><p>Tài liệu nội bộ KSP – xóa phụ lục này trước khi gửi cho đối tác. Mục đích: bảo đảm hợp đồng mua (Supplier) khớp với hợp đồng bán (Owner) về giá, tiến độ, chất lượng, bảo hành, phạt và bảo lãnh.<span class=\"th\" data-t=\"เอกสารภายในของ KSP – ให้ลบภาคผนวกนี้ก่อนส่งให้คู่ค้า วัตถุประสงค์: เพื่อให้แน่ใจว่าสัญญาซื้อ (Supplier) สอดคล้องกับสัญญาขาย (Owner) ในเรื่องราคา กำหนดการ คุณภาพ การรับประกันผลงาน ค่าปรับ และหนังสือค้ำประกัน\"></span></p><div class=\"tw2\"><table class=\"ct\"><tr><th>Hạng mục<span class=\"th\" data-t=\"รายการ\"></span></th><th>Hợp đồng bán (Owner)<span class=\"th\" data-t=\"สัญญาขาย (Owner)\"></span></th><th>Hợp đồng mua (Supplier) số <span class=\"fx\" data-k=\"SỐ\"></span><span class=\"th\" data-t=\"สัญญาซื้อ (Supplier) เลขที่ 【SỐ】\"></span></th><th>Chênh lệch / rủi ro KSP<span class=\"th\" data-t=\"ความแตกต่าง / ความเสี่ยงของ KSP\"></span></th><th>Biện pháp / người duyệt<span class=\"th\" data-t=\"มาตรการ / ผู้อนุมัติ\"></span></th></tr><tr><td>Giá trị / giá<span class=\"th\" data-t=\"มูลค่า / ราคา\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Tiến độ / ngày hoàn thành<span class=\"th\" data-t=\"กำหนดการ / วันที่แล้วเสร็จ\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Thời hạn thanh toán<span class=\"th\" data-t=\"กำหนดเวลาชำระเงิน\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Tạm ứng / bảo lãnh<span class=\"th\" data-t=\"เงินล่วงหน้า / หนังสือค้ำประกัน\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Phạt chậm / mức trần<span class=\"th\" data-t=\"ค่าปรับกรณีล่าช้า / เพดานสูงสุด\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Bảo hành (thời hạn, ngày bắt đầu, giữ lại)<span class=\"th\" data-t=\"การรับประกันผลงาน (ระยะเวลา วันเริ่มต้น เงินประกันผลงานที่กักไว้)\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Giới hạn trách nhiệm<span class=\"th\" data-t=\"ขีดจำกัดความรับผิด\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Quyền chấm dứt<span class=\"th\" data-t=\"สิทธิในการเลิกสัญญา\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Nghiệm thu / hồ sơ chất lượng<span class=\"th\" data-t=\"การตรวจรับ / เอกสารด้านคุณภาพ\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>An toàn, bảo hiểm<span class=\"th\" data-t=\"ความปลอดภัย การประกันภัย\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr></table></div><h3 class=\"ann\" data-n=\"04\"><strong>PHỤ LỤC 04 – ĐIỀU KIỆN ĐẶC BIỆT ĐƯỢC HAI BÊN KÝ</strong><span class=\"th\" data-t=\"ภาคผนวก 04 – เงื่อนไขพิเศษที่ทั้งสองฝ่ายลงนาม\"></span></h3><div class=\"tw2\"><table class=\"ct\"><tr><th>Điều khoản<span class=\"th\" data-t=\"ข้อกำหนด\"></span></th><th>Nội dung đặc biệt<span class=\"th\" data-t=\"เนื้อหาพิเศษ\"></span></th><th>Người phê duyệt KSP<span class=\"th\" data-t=\"ผู้อนุมัติของ KSP\"></span></th></tr><tr><td><span class=\"fx\" data-k=\"ĐIỀU\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"HỌ TÊN / NGÀY\"></span></td></tr></table></div>", "s5": "<p class=\"ctr\">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM<span class=\"th\" data-t=\"สาธารณรัฐสังคมนิยมเวียดนาม\"></span></p><p class=\"ctr\">Độc lập - Tự do - Hạnh phúc<span class=\"th\" data-t=\"เอกราช - เสรีภาพ - ความสุข\"></span></p><p class=\"ctr\"><strong>HỢP ĐỒNG VẬN CHUYỂN HÀNG HÓA</strong><span class=\"th\" data-t=\"สัญญาขนส่งสินค้า\"></span></p><p class=\"ctr\">Số: <span class=\"fx\" data-k=\"SỐ HỢP ĐỒNG\"></span> | Dự án / PO: <span class=\"fx\" data-k=\"DỰ ÁN / MÃ PO / MÃ KHÁCH HÀNG\"></span><span class=\"th\" data-t=\"เลขที่: 【SỐ HỢP ĐỒNG】 | โครงการ / PO: 【DỰ ÁN / MÃ PO / MÃ KHÁCH HÀNG】\"></span></p><p>– Căn cứ Bộ luật Dân sự số 91/2015/QH13 và văn bản sửa đổi, bổ sung có hiệu lực tại thời điểm ký (hợp đồng vận chuyển tài sản);<span class=\"th\" data-t=\"– อาศัยประมวลกฎหมายแพ่ง ฉบับที่ 91/2015/QH13 และเอกสารแก้ไขเพิ่มเติมที่มีผลบังคับ ณ เวลาลงนาม (สัญญาขนส่งทรัพย์สิน);\"></span></p><p>– Căn cứ Luật Thương mại số 36/2005/QH11 (quy định về dịch vụ logistics) trong phạm vi áp dụng;<span class=\"th\" data-t=\"– อาศัยกฎหมายพาณิชย์ ฉบับที่ 36/2005/QH11 (บทบัญญัติว่าด้วยบริการโลจิสติกส์) ภายในขอบเขตที่บังคับใช้;\"></span></p><p>– Căn cứ pháp luật về đường bộ, trật tự an toàn giao thông đường bộ và kinh doanh vận tải bằng xe ô tô hiện hành (kiểm tra số hiệu, hiệu lực văn bản tại thời điểm ký);<span class=\"th\" data-t=\"– อาศัยกฎหมายว่าด้วยทางหลวง ความปลอดภัยและความสงบเรียบร้อยทางการจราจรทางถนน และการประกอบธุรกิจขนส่งด้วยรถยนต์ที่มีผลบังคับในปัจจุบัน (ตรวจสอบเลขที่และผลบังคับของเอกสาร ณ เวลาลงนาม);\"></span></p><p>– Căn cứ nhu cầu vận chuyển của Bên A và khả năng cung cấp dịch vụ của Bên B.<span class=\"th\" data-t=\"– อาศัยความต้องการขนส่งของฝ่าย A และความสามารถในการให้บริการของฝ่าย B\"></span></p><p>Hôm nay, ngày <span class=\"fx\" data-k=\"NGÀY\"></span> tháng <span class=\"fx\" data-k=\"THÁNG\"></span> năm <span class=\"fx\" data-k=\"NĂM\"></span>, Các Bên gồm:<span class=\"th\" data-t=\"วันนี้ วันที่ 【NGÀY】 เดือน 【THÁNG】 พ.ศ./ค.ศ. 【NĂM】 คู่สัญญาประกอบด้วย:\"></span></p><p class=\"sub\"><strong>BÊN A – BÊN THUÊ VẬN CHUYỂN (KSP): CÔNG TY TNHH KSP VIỆT NAM <span class=\"fx\" data-k=\"CHI NHÁNH / ĐƠN VỊ THỰC HIỆN, NẾU CÓ\"></span></strong><span class=\"th\" data-t=\"ฝ่าย A – ผู้ว่าจ้างขนส่ง (KSP): บริษัท KSP เวียดนาม จำกัด (CÔNG TY TNHH KSP VIỆT NAM) 【CHI NHÁNH / ĐƠN VỊ THỰC HIỆN, NẾU CÓ】\"></span></p><p>Đại diện: <span class=\"fx\" data-k=\"HỌ TÊN NGƯỜI KÝ\"></span> Chức vụ: <span class=\"fx\" data-k=\"CHỨC VỤ\"></span> Căn cứ thẩm quyền: <span class=\"fx\" data-k=\"ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY\"></span><span class=\"th\" data-t=\"ผู้แทน: 【HỌ TÊN NGƯỜI KÝ】 ตำแหน่ง: 【CHỨC VỤ】 ฐานอำนาจ: 【ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY】\"></span></p><p>Địa chỉ: <span class=\"fx\" data-k=\"ĐỊA CHỈ PHÁP LÝ KSP – KIỂM TRA ĐĂNG KÝ HIỆN HÀNH\"></span> Mã số thuế: <span class=\"fx\" data-k=\"MST KSP / CHI NHÁNH\"></span><span class=\"th\" data-t=\"ที่อยู่: 【ĐỊA CHỈ PHÁP LÝ KSP – KIỂM TRA ĐĂNG KÝ HIỆN HÀNH】 เลขประจำตัวผู้เสียภาษี: 【MST KSP / CHI NHÁNH】\"></span></p><p>Tài khoản: <span class=\"fx\" data-k=\"SỐ TÀI KHOẢN / NGÂN HÀNG KSP\"></span> Đại diện nhận thông báo: <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ\"></span> Email: <span class=\"fx\" data-k=\"EMAIL\"></span><span class=\"th\" data-t=\"บัญชี: 【SỐ TÀI KHOẢN / NGÂN HÀNG KSP】 ผู้แทนรับหนังสือแจ้ง: 【HỌ TÊN / CHỨC VỤ】 อีเมล: 【EMAIL】\"></span></p><p class=\"sub\"><strong>BÊN B – BÊN VẬN CHUYỂN: <span class=\"fx\" data-k=\"TÊN PHÁP LÝ NHÀ VẬN CHUYỂN\"></span></strong><span class=\"th\" data-t=\"ฝ่าย B – ผู้ขนส่ง: 【TÊN PHÁP LÝ NHÀ VẬN CHUYỂN】\"></span></p><p>Đại diện: <span class=\"fx\" data-k=\"HỌ TÊN NGƯỜI KÝ\"></span> Chức vụ: <span class=\"fx\" data-k=\"CHỨC VỤ\"></span> Căn cứ thẩm quyền: <span class=\"fx\" data-k=\"ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY\"></span><span class=\"th\" data-t=\"ผู้แทน: 【HỌ TÊN NGƯỜI KÝ】 ตำแหน่ง: 【CHỨC VỤ】 ฐานอำนาจ: 【ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY】\"></span></p><p>Địa chỉ: <span class=\"fx\" data-k=\"ĐỊA CHỈ ĐĂNG KÝ\"></span> Mã số thuế / Mã số doanh nghiệp: <span class=\"fx\" data-k=\"MST / GCN ĐKDN\"></span><span class=\"th\" data-t=\"ที่อยู่: 【ĐỊA CHỈ ĐĂNG KÝ】 เลขประจำตัวผู้เสียภาษี / รหัสวิสาหกิจ: 【MST / GCN ĐKDN】\"></span></p><p>Tài khoản: <span class=\"fx\" data-k=\"CHỦ TÀI KHOẢN / SỐ TÀI KHOẢN / NGÂN HÀNG\"></span> Đại diện nhận thông báo: <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ\"></span> Email: <span class=\"fx\" data-k=\"EMAIL\"></span><span class=\"th\" data-t=\"บัญชี: 【CHỦ TÀI KHOẢN / SỐ TÀI KHOẢN / NGÂN HÀNG】 ผู้แทนรับหนังสือแจ้ง: 【HỌ TÊN / CHỨC VỤ】 อีเมล: 【EMAIL】\"></span></p><p>Hai Bên thỏa thuận ký kết hợp đồng vận chuyển hàng hóa (“Hợp đồng”) với các điều khoản sau:<span class=\"th\" data-t=\"ทั้งสองฝ่ายตกลงทำสัญญาขนส่งสินค้า (“สัญญา”) โดยมีข้อกำหนดดังต่อไปนี้:\"></span></p><h3 class=\"art\" data-n=\"1\"><strong>ĐIỀU 1. PHẠM VI VẬN CHUYỂN VÀ HỒ SƠ HỢP ĐỒNG</strong><span class=\"th\" data-t=\"ข้อ 1 ขอบเขตการขนส่งและเอกสารสัญญา\"></span></h3><p class=\"lv1\"><span class=\"lb\">1.1</span>Bên B vận chuyển hàng hóa của Bên A (hoặc khách hàng của Bên A) từ <span class=\"fx\" data-k=\"ĐIỂM NHẬN\"></span> đến <span class=\"fx\" data-k=\"ĐIỂM GIAO\"></span>, loại hàng <span class=\"fx\" data-k=\"THIẾT BỊ / VẬT TƯ / HÀNG QUÁ KHỔ / THỰC PHẨM, THỨC ĂN CHĂN NUÔI\"></span>, bằng <span class=\"fx\" data-k=\"XE TẢI / XE ĐẦU KÉO / XE CẨU / XE LẠNH\"></span>, theo Phụ lục 01.<span class=\"th\" data-t=\"ฝ่าย B ขนส่งสินค้าของฝ่าย A (หรือของลูกค้าของฝ่าย A) จาก 【ĐIỂM NHẬN】 ไปยัง 【ĐIỂM GIAO】 ประเภทสินค้า 【THIẾT BỊ / VẬT TƯ / HÀNG QUÁ KHỔ / THỰC PHẨM, THỨC ĂN CHĂN NUÔI】 โดยใช้ 【XE TẢI / XE ĐẦU KÉO / XE CẨU / XE LẠNH】 ตามภาคผนวก 01\"></span></p><p class=\"lv1\"><span class=\"lb\">1.2</span>Hồ sơ hợp đồng: Hợp đồng; Phụ lục 01 (tuyến, bảng cước); Phụ lục 02 (xe, tài xế); Phụ lục 03 (lệnh vận chuyển, biên bản giao nhận); Phụ lục 04 (nội bộ KSP); Phụ lục 05 (HSE). Áp dụng một lần hoặc theo nhiều lệnh vận chuyển: <span class=\"fx\" data-k=\"MỘT LẦN / NHIỀU LỆNH\"></span>.<span class=\"th\" data-t=\"เอกสารสัญญา: สัญญา; ภาคผนวก 01 (เส้นทาง ตารางค่าขนส่ง); ภาคผนวก 02 (รถ คนขับ); ภาคผนวก 03 (คำสั่งขนส่ง รายงานการรับมอบ); ภาคผนวก 04 (ใช้ภายใน KSP); ภาคผนวก 05 (HSE) ใช้ครั้งเดียวหรือตามคำสั่งขนส่งหลายฉบับ: 【MỘT LẦN / NHIỀU LỆNH】\"></span></p><h3 class=\"art\" data-n=\"2\"><strong>ĐIỀU 2. LỆNH VẬN CHUYỂN</strong><span class=\"th\" data-t=\"ข้อ 2 คำสั่งขนส่ง\"></span></h3><p class=\"lv1\"><span class=\"lb\">2.1</span>Mỗi chuyến thực hiện theo lệnh vận chuyển của Bên A nêu hàng hóa, khối lượng/thể tích, giá trị khai báo, thời gian nhận/giao, địa điểm, người liên hệ, yêu cầu đặc biệt (bảo quản, chằng buộc, niêm phong).<span class=\"th\" data-t=\"การขนส่งแต่ละเที่ยวดำเนินการตามคำสั่งขนส่งของฝ่าย A ซึ่งระบุสินค้า น้ำหนัก/ปริมาตร มูลค่าที่แจ้ง เวลารับ/ส่ง สถานที่ ผู้ติดต่อ และข้อกำหนดพิเศษ (การเก็บรักษา การยึดตรึง การปิดผนึก)\"></span></p><p class=\"lv1\"><span class=\"lb\">2.2</span>Bên B xác nhận hoặc từ chối trong <span class=\"fx\" data-k=\"02\"></span> giờ làm việc; đã xác nhận mà không cung cấp xe đúng thời gian là vi phạm theo Điều 7 và Điều 8.<span class=\"th\" data-t=\"ฝ่าย B ยืนยันหรือปฏิเสธภายใน 【02】 ชั่วโมงทำการ หากยืนยันแล้วแต่ไม่จัดหารถตามเวลา ถือเป็นการผิดสัญญาตามข้อ 7 และข้อ 8\"></span></p><h3 class=\"art\" data-n=\"3\"><strong>ĐIỀU 3. CƯỚC PHÍ VÀ PHỤ PHÍ</strong><span class=\"th\" data-t=\"ข้อ 3 ค่าขนส่งและค่าธรรมเนียมเพิ่มเติม\"></span></h3><p class=\"lv1\"><span class=\"lb\">3.1</span>Cước theo Phụ lục 01 (VNĐ/chuyến, VNĐ/tấn, VNĐ/km hoặc theo khối lượng thực nhận), chưa VAT. Cước gồm nhiên liệu, cầu đường, phí bến bãi thông thường, lương tài xế, bảo hiểm bắt buộc, chi phí xe.<span class=\"th\" data-t=\"ค่าขนส่งเป็นไปตามภาคผนวก 01 (VNĐ/เที่ยว, VNĐ/ตัน, VNĐ/กม. หรือตามน้ำหนักที่รับจริง) ยังไม่รวมภาษีมูลค่าเพิ่ม (VAT) ค่าขนส่งรวมเชื้อเพลิง ค่าทางด่วน ค่าสถานที่จอดรถตามปกติ ค่าจ้างคนขับ ประกันภัยภาคบังคับ และค่าใช้จ่ายของรถ\"></span></p><p class=\"lv1\"><span class=\"lb\">3.2</span>Phụ phí chỉ áp dụng khi có thỏa thuận: chờ xếp/dỡ quá <span class=\"fx\" data-k=\"SỐ\"></span> giờ: <span class=\"fx\" data-k=\"\"></span> VNĐ/giờ; bốc xếp bằng cẩu, nhân công: <span class=\"fx\" data-k=\"\"></span>; điểm giao phụ: <span class=\"fx\" data-k=\"\"></span>. Điều chỉnh cước theo giá nhiên liệu: <span class=\"fx\" data-k=\"CÔNG THỨC / NGƯỠNG\"></span>, chỉ áp dụng cho lệnh chưa xác nhận.<span class=\"th\" data-t=\"ค่าธรรมเนียมเพิ่มเติมใช้เฉพาะเมื่อมีข้อตกลง: รอขึ้น/ลงสินค้าเกิน 【SỐ】 ชั่วโมง: 【】 VNĐ/ชั่วโมง; ยกขนด้วยเครน แรงงาน: 【】; จุดส่งเพิ่มเติม: 【】 การปรับค่าขนส่งตามราคาเชื้อเพลิง: 【CÔNG THỨC / NGƯỠNG】 ใช้เฉพาะกับคำสั่งที่ยังไม่ได้ยืนยัน\"></span></p><h3 class=\"art\" data-n=\"4\"><strong>ĐIỀU 4. THANH TOÁN</strong><span class=\"th\" data-t=\"ข้อ 4. การชำระเงิน\"></span></h3><p class=\"lv1\"><span class=\"lb\">4.1</span>Bên B xuất hóa đơn điện tử hợp lệ theo Nghị định 123/2020/NĐ-CP sau khi hoàn thành chuyến, kèm biên bản giao nhận có xác nhận của bên nhận hàng (POD), vé cân/phiếu xuất kho, các chứng từ phụ phí (nếu có).<span class=\"th\" data-t=\"ฝ่าย B ออกใบแจ้งหนี้อิเล็กทรอนิกส์ที่ชอบด้วยกฎหมายตามพระราชกฤษฎีกา ฉบับที่ 123/2020/NĐ-CP หลังเสร็จสิ้นเที่ยวขนส่ง พร้อมรายงานการรับมอบที่ผู้รับสินค้ายืนยัน (POD) ใบชั่งน้ำหนัก/ใบเบิกสินค้า และเอกสารค่าธรรมเนียมเพิ่มเติม (ถ้ามี)\"></span></p><p class=\"lv1\"><span class=\"lb\">4.2</span>Bên A thanh toán trong <span class=\"fx\" data-k=\"30\"></span> ngày kể từ ngày nhận đủ hồ sơ hợp lệ, chuyển khoản VNĐ. Phần không tranh chấp vẫn thanh toán đúng hạn; Bên A có quyền khấu trừ giá trị hàng mất mát, hư hỏng đã được xác nhận hoặc có phán quyết.<span class=\"th\" data-t=\"ฝ่าย A ชำระเงินภายใน 【30】 วันนับจากวันที่ได้รับเอกสารที่ชอบด้วยกฎหมายครบถ้วน โดยโอนเงินเป็นสกุล VNĐ ส่วนที่ไม่มีข้อพิพาทยังคงต้องชำระตามกำหนด ฝ่าย A มีสิทธิหักมูลค่าสินค้าสูญหายหรือเสียหายที่ได้รับการยืนยันแล้วหรือมีคำวินิจฉัยแล้ว\"></span></p><p class=\"lv1\"><span class=\"lb\">4.3</span>Chậm thanh toán: lãi <span class=\"fx\" data-k=\"\"></span>%/năm trên số tiền chậm, không vượt mức pháp luật cho phép.<span class=\"th\" data-t=\"การชำระเงินล่าช้า: ดอกเบี้ยร้อยละ 【】 ต่อปีของจำนวนเงินที่ล่าช้า ทั้งนี้ไม่เกินอัตราที่กฎหมายอนุญาต\"></span></p><h3 class=\"art\" data-n=\"5\"><strong>ĐIỀU 5. PHƯƠNG TIỆN, TÀI XẾ VÀ GIẤY TỜ PHÁP LÝ</strong><span class=\"th\" data-t=\"ข้อ 5 ยานพาหนะ คนขับ และเอกสารทางกฎหมาย\"></span></h3><p class=\"lv1\"><span class=\"lb\">5.1</span>Bên B bảo đảm trong suốt hợp đồng: có đăng ký kinh doanh vận tải phù hợp, giấy phép kinh doanh vận tải hoặc điều kiện kinh doanh tương ứng theo quy định; xe còn hạn đăng kiểm, bảo hiểm trách nhiệm dân sự bắt buộc, thiết bị giám sát hành trình (nếu thuộc diện bắt buộc), giấy phép vận chuyển hàng quá khổ, quá tải, hàng nguy hiểm (nếu cần).<span class=\"th\" data-t=\"ฝ่าย B รับรองตลอดอายุสัญญาว่า: มีทะเบียนประกอบธุรกิจขนส่งที่เหมาะสม ใบอนุญาตประกอบธุรกิจขนส่งหรือเงื่อนไขการประกอบธุรกิจที่สอดคล้องตามกฎหมาย รถมีการตรวจสภาพที่ยังไม่หมดอายุ ประกันภัยความรับผิดทางแพ่งภาคบังคับ อุปกรณ์ติดตามการเดินทาง (หากเป็นกรณีบังคับ) ใบอนุญาตขนส่งสินค้าเกินขนาด เกินน้ำหนัก สินค้าอันตราย (หากจำเป็น)\"></span></p><p class=\"lv1\"><span class=\"lb\">5.2</span>Tài xế có giấy phép lái xe đúng hạng, hợp đồng lao động hoặc quan hệ pháp lý hợp lệ với Bên B, chấp hành thời gian lái xe, nghỉ ngơi theo quy định; không sử dụng rượu bia, ma túy; tuân thủ nội quy kho, nhà máy, trại của nơi nhận/giao.<span class=\"th\" data-t=\"คนขับมีใบอนุญาตขับขี่ตรงตามประเภท มีสัญญาจ้างแรงงานหรือความสัมพันธ์ทางกฎหมายที่ชอบด้วยกฎหมายกับฝ่าย B ปฏิบัติตามกำหนดเวลาขับรถและพักผ่อนตามที่กฎหมายกำหนด ไม่ใช้สุรา ยาเสพติด และปฏิบัติตามระเบียบของคลังสินค้า โรงงาน ฟาร์มของสถานที่รับ/ส่ง\"></span></p><p class=\"lv1\"><span class=\"lb\">5.3</span>Bên B không vận chuyển quá tải trọng cho phép; chịu mọi xử phạt hành chính liên quan đến phương tiện, tải trọng, giấy tờ, hành vi của tài xế; nếu Bên A bị xử phạt hoặc bị yêu cầu do lỗi này, Bên B hoàn trả toàn bộ.<span class=\"th\" data-t=\"ฝ่าย B ต้องไม่ขนส่งเกินน้ำหนักบรรทุกที่อนุญาต และต้องรับผิดชอบค่าปรับทางปกครองทั้งหมดที่เกี่ยวข้องกับยานพาหนะ น้ำหนักบรรทุก เอกสาร และพฤติกรรมของคนขับ หากฝ่าย A ถูกปรับหรือถูกเรียกร้องเนื่องจากความผิดนี้ ฝ่าย B ต้องชดใช้คืนทั้งหมด\"></span></p><h3 class=\"art\" data-n=\"6\"><strong>ĐIỀU 6. NHẬN, GIAO HÀNG VÀ CHỨNG TỪ</strong><span class=\"th\" data-t=\"ข้อ 6 การรับ การส่งมอบสินค้า และเอกสาร\"></span></h3><p class=\"lv1\"><span class=\"lb\">6.1</span>Bên B kiểm tra số lượng, bao bì bên ngoài, tình trạng chằng buộc khi nhận hàng và ghi ý kiến vào biên bản; không ghi ý kiến được coi là nhận hàng đúng số lượng, tình trạng bên ngoài. Giao hàng cho đúng người nhận có thẩm quyền theo lệnh vận chuyển.<span class=\"th\" data-t=\"ฝ่าย B ตรวจสอบจำนวน บรรจุภัณฑ์ภายนอก และสภาพการยึดตรึงเมื่อรับสินค้า และบันทึกความเห็นในรายงาน หากไม่บันทึกความเห็น ให้ถือว่ารับสินค้าถูกต้องตามจำนวนและสภาพภายนอก ส่งมอบสินค้าให้ผู้รับที่มีอำนาจตามคำสั่งขนส่ง\"></span></p><p class=\"lv1\"><span class=\"lb\">6.2</span>Bên B chằng buộc, che chắn, niêm phong theo yêu cầu; không tự ý chuyển tải, đổi xe, đổi tuyến, dừng đỗ không cần thiết khi không có chấp thuận của Bên A, trừ trường hợp khẩn cấp vì an toàn.<span class=\"th\" data-t=\"ฝ่าย B ยึดตรึง คลุมป้องกัน ปิดผนึกตามที่กำหนด ไม่ถ่ายลำ เปลี่ยนรถ เปลี่ยนเส้นทาง หรือหยุดจอดโดยไม่จำเป็นโดยไม่ได้รับความเห็นชอบจากฝ่าย A เว้นแต่กรณีฉุกเฉินเพื่อความปลอดภัย\"></span></p><p class=\"lv1\"><span class=\"lb\">6.3</span>Biên bản giao nhận (POD) gốc có chữ ký bên nhận hàng nộp cho Bên A trong <span class=\"fx\" data-k=\"03\"></span> ngày làm việc kể từ ngày giao; chậm nộp POD gốc thì thời hạn thanh toán tính từ ngày nhận POD.<span class=\"th\" data-t=\"รายงานการรับมอบ (POD) ฉบับจริงที่มีลายมือชื่อผู้รับสินค้าต้องส่งให้ฝ่าย A ภายใน 【03】 วันทำการนับจากวันส่งมอบ หากส่ง POD ฉบับจริงล่าช้า กำหนดการชำระเงินให้นับจากวันที่ได้รับ POD\"></span></p><h3 class=\"art\" data-n=\"7\"><strong>ĐIỀU 7. THỜI GIAN GIAO VÀ CHẬM TRỄ</strong><span class=\"th\" data-t=\"ข้อ 7 เวลาส่งมอบและความล่าช้า\"></span></h3><p class=\"lv1\"><span class=\"lb\">7.1</span>Bên B giao hàng đúng khung thời gian tại lệnh vận chuyển. Bên B thông báo ngay khi dự kiến chậm, nêu nguyên nhân và thời gian dự kiến.<span class=\"th\" data-t=\"ฝ่าย B ส่งมอบสินค้าให้ตรงช่วงเวลาตามคำสั่งขนส่ง ฝ่าย B ต้องแจ้งทันทีเมื่อคาดว่าจะล่าช้า โดยระบุสาเหตุและเวลาที่คาดการณ์\"></span></p><p class=\"lv1\"><span class=\"lb\">7.2</span>Chậm do lỗi Bên B: phạt <span class=\"fx\" data-k=\"0,5\"></span>% cước chuyến/giờ chậm hoặc <span class=\"fx\" data-k=\"\"></span> VNĐ/giờ, tối đa <span class=\"fx\" data-k=\"8\"></span>% cước của chuyến vi phạm; không loại trừ quyền yêu cầu bồi thường thiệt hại thực tế (phí phạt, phí dừng chờ, chi phí xe thay thế).<span class=\"th\" data-t=\"ความล่าช้าเนื่องจากความผิดของฝ่าย B: ปรับร้อยละ 【0,5】 ของค่าขนส่งเที่ยวนั้นต่อชั่วโมงที่ล่าช้า หรือ 【】 VNĐ/ชั่วโมง สูงสุดไม่เกินร้อยละ 【8】 ของค่าขนส่งของเที่ยวที่ผิดสัญญา ทั้งนี้ไม่ตัดสิทธิเรียกร้องการชดใช้ค่าเสียหายที่เกิดขึ้นจริง (ค่าปรับ ค่าจอดรอ ค่าใช้จ่ายรถทดแทน)\"></span></p><h3 class=\"art\" data-n=\"8\"><strong>ĐIỀU 8. TRÁCH NHIỆM VỀ HÀNG HÓA VÀ BỒI THƯỜNG</strong><span class=\"th\" data-t=\"ข้อ 8 ความรับผิดต่อสินค้าและการชดใช้ค่าเสียหาย\"></span></h3><p class=\"lv1\"><span class=\"lb\">8.1</span>Bên B chịu trách nhiệm về mất mát, thiếu hụt, hư hỏng hàng hóa từ khi nhận đến khi giao xong, trừ trường hợp do lỗi của Bên A (đóng gói, khai báo sai), bản chất hàng hóa, bất khả kháng hoặc quyết định của cơ quan có thẩm quyền.<span class=\"th\" data-t=\"ฝ่าย B รับผิดชอบต่อการสูญหาย ขาดหาย เสียหายของสินค้าตั้งแต่รับจนส่งมอบเสร็จสิ้น เว้นแต่เกิดจากความผิดของฝ่าย A (การบรรจุหีบห่อ การแจ้งข้อมูลผิด) ลักษณะเฉพาะของสินค้า เหตุสุดวิสัย หรือคำวินิจฉัยของหน่วยงานที่มีอำนาจ\"></span></p><p class=\"lv1\"><span class=\"lb\">8.2</span>Mức bồi thường: giá trị thực tế của hàng bị mất, hư hỏng theo hóa đơn mua bán / chứng từ hợp lệ cộng chi phí cứu hộ, thay thế, vận chuyển hợp lý; hàng hư hỏng một phần: tỷ lệ tổn thất theo biên bản giám định. Giới hạn trách nhiệm (nếu có): <span class=\"fx\" data-k=\"GIÁ TRỊ KHAI BÁO / GIỚI HẠN THEO LUẬT\"></span> (xác nhận giới hạn trách nhiệm đối với dịch vụ vận chuyển/logistics theo luật áp dụng khi ký); không áp dụng giới hạn khi có lỗi cố ý, vi phạm nghiêm trọng pháp luật.<span class=\"th\" data-t=\"อัตราการชดใช้: มูลค่าจริงของสินค้าที่สูญหายหรือเสียหายตามใบแจ้งหนี้ซื้อขาย / เอกสารที่ชอบด้วยกฎหมาย บวกค่าใช้จ่ายในการกู้ภัย การทดแทน และการขนส่งที่สมเหตุสมผล; กรณีสินค้าเสียหายบางส่วน: สัดส่วนความสูญเสียตามรายงานการตรวจประเมิน ขีดจำกัดความรับผิด (หากมี): 【GIÁ TRỊ KHAI BÁO / GIỚI HẠN THEO LUẬT】 (ให้ยืนยันขีดจำกัดความรับผิดสำหรับบริการขนส่ง/โลจิสติกส์ตามกฎหมายที่บังคับใช้เมื่อลงนาม); ไม่ใช้ขีดจำกัดเมื่อมีความผิดโดยเจตนาหรือการฝ่าฝืนกฎหมายอย่างร้ายแรง\"></span></p><p class=\"lv1\"><span class=\"lb\">8.3</span>Bên B có bảo hiểm trách nhiệm người vận chuyển / bảo hiểm hàng hóa với hạn mức tối thiểu <span class=\"fx\" data-k=\"SỐ TIỀN\"></span> VNĐ/chuyến và tối đa <span class=\"fx\" data-k=\"SỐ TIỀN\"></span> VNĐ/sự kiện, cung cấp giấy chứng nhận khi Bên A yêu cầu; Bên A có quyền được ghi là người thụ hưởng với phần giá trị hàng hóa.<span class=\"th\" data-t=\"ฝ่าย B มีประกันความรับผิดของผู้ขนส่ง / ประกันภัยสินค้า โดยมีวงเงินขั้นต่ำ 【SỐ TIỀN】 VNĐ/เที่ยว และสูงสุด 【SỐ TIỀN】 VNĐ/เหตุการณ์ และต้องจัดหาหนังสือรับรองเมื่อฝ่าย A ร้องขอ ฝ่าย A มีสิทธิได้รับการระบุเป็นผู้รับผลประโยชน์ในส่วนมูลค่าสินค้า\"></span></p><p class=\"lv1\"><span class=\"lb\">8.4</span>Khi xảy ra tai nạn, mất mát, hư hỏng: Bên B báo ngay trong <span class=\"fx\" data-k=\"02\"></span> giờ, bảo vệ hàng, lập biên bản có xác nhận của cơ quan có thẩm quyền, bảo lưu hiện trường và hình ảnh; Bên A được kiểm tra, giám định.<span class=\"th\" data-t=\"เมื่อเกิดอุบัติเหตุ การสูญหาย หรือความเสียหาย: ฝ่าย B แจ้งทันทีภายใน 【02】 ชั่วโมง ปกป้องสินค้า จัดทำรายงานที่มีหน่วยงานที่มีอำนาจยืนยัน รักษาสถานที่เกิดเหตุและภาพถ่าย ฝ่าย A มีสิทธิตรวจสอบและประเมินความเสียหาย\"></span></p><h3 class=\"art\" data-n=\"9\"><strong>ĐIỀU 9. HÀNG ĐẶC BIỆT, AN TOÀN VÀ MÔI TRƯỜNG</strong><span class=\"th\" data-t=\"ข้อ 9 สินค้าพิเศษ ความปลอดภัย และสิ่งแวดล้อม\"></span></h3><p class=\"lv1\"><span class=\"lb\">9.1</span>Hàng quá khổ, quá tải, siêu trường siêu trọng, hàng nguy hiểm, hàng cần bảo quản nhiệt độ phải được nêu trong lệnh vận chuyển; Bên B bảo đảm giấy phép, phương tiện chuyên dụng, người áp tải và phương án an toàn.<span class=\"th\" data-t=\"สินค้าเกินขนาด เกินน้ำหนัก สินค้าขนาดและน้ำหนักพิเศษ สินค้าอันตราย และสินค้าที่ต้องควบคุมอุณหภูมิ ต้องระบุในคำสั่งขนส่ง ฝ่าย B รับรองใบอนุญาต ยานพาหนะเฉพาะทาง ผู้ควบคุมการขนส่ง และแผนความปลอดภัย\"></span></p><p class=\"lv1\"><span class=\"lb\">9.2</span>Bên B tuân thủ quy định HSE của Bên A và của địa điểm nhận/giao (Phụ lục 05), quy định an toàn sinh học tại trại, nhà máy thức ăn chăn nuôi, thực phẩm (khử trùng xe, giày, thời gian chờ…); chịu trách nhiệm về an toàn của người lao động của mình.<span class=\"th\" data-t=\"ฝ่าย B ปฏิบัติตามระเบียบ HSE ของฝ่าย A และของสถานที่รับ/ส่ง (ภาคผนวก 05) ระเบียบความปลอดภัยทางชีวภาพที่ฟาร์ม โรงงานอาหารสัตว์ และอาหาร (การฆ่าเชื้อรถ รองเท้า เวลารอ…) และรับผิดชอบต่อความปลอดภัยของลูกจ้างของตน\"></span></p><h3 class=\"art\" data-n=\"10\"><strong>ĐIỀU 10. NHÀ VẬN CHUYỂN PHỤ VÀ CHUYỂN GIAO</strong><span class=\"th\" data-t=\"ข้อ 10 ผู้ขนส่งช่วงและการโอนสิทธิ\"></span></h3><p class=\"lv1\"><span class=\"lb\">10.1</span>Bên B không được giao lại toàn bộ hoặc một phần việc vận chuyển cho nhà vận chuyển khác khi chưa có chấp thuận bằng văn bản của Bên A; nếu được chấp thuận, Bên B chịu trách nhiệm trước Bên A như tự thực hiện và bảo đảm nhà vận chuyển phụ đáp ứng Điều 5.<span class=\"th\" data-t=\"ฝ่าย B ต้องไม่โอนงานขนส่งทั้งหมดหรือบางส่วนให้ผู้ขนส่งรายอื่นโดยไม่ได้รับความเห็นชอบเป็นหนังสือจากฝ่าย A หากได้รับความเห็นชอบ ฝ่าย B ต้องรับผิดต่อฝ่าย A เสมือนดำเนินการเอง และรับรองว่าผู้ขนส่งช่วงปฏิบัติตามข้อ 5\"></span></p><p class=\"lv1\"><span class=\"lb\">10.2</span>Bên B không được cầm cố, giữ hàng của Bên A để bù trừ nợ khác ngoài khoản cước của chính chuyến hàng đó theo quy định pháp luật.<span class=\"th\" data-t=\"ฝ่าย B ต้องไม่จำนำหรือยึดหน่วงสินค้าของฝ่าย A เพื่อหักกลบหนี้อื่นนอกจากค่าขนส่งของเที่ยวนั้นเองตามที่กฎหมายกำหนด\"></span></p><h3 class=\"art\" data-n=\"11\"><strong>ĐIỀU 11. ĐỐI CHIẾU VỚI HỢP ĐỒNG KHÁCH HÀNG CỦA KSP (BACK-TO-BACK)</strong><span class=\"th\" data-t=\"ข้อ 11 การเทียบเคียงกับสัญญาลูกค้าของ KSP (Back-to-Back)\"></span></h3><p class=\"lv1\"><span class=\"lb\">11.1</span>Khi vận chuyển liên quan đến hợp đồng bán của KSP với khách hàng <span class=\"fx\" data-k=\"TÊN KHÁCH HÀNG / HỢP ĐỒNG SỐ\"></span>, Bên B tuân thủ thời hạn giao, địa điểm, yêu cầu bốc dỡ, chứng từ, quy định an toàn nêu tại Phụ lục 04 mà Bên A thông báo bằng văn bản; thông tin giá của KSP không được cung cấp cho Bên B.<span class=\"th\" data-t=\"เมื่อการขนส่งเกี่ยวข้องกับสัญญาขายของ KSP กับลูกค้า 【TÊN KHÁCH HÀNG / HỢP ĐỒNG SỐ】 ฝ่าย B ต้องปฏิบัติตามกำหนดส่งมอบ สถานที่ ข้อกำหนดการขนขึ้นลง เอกสาร และระเบียบความปลอดภัยตามภาคผนวก 04 ที่ฝ่าย A แจ้งเป็นหนังสือ ข้อมูลราคาของ KSP จะไม่เปิดเผยแก่ฝ่าย B\"></span></p><p class=\"lv1\"><span class=\"lb\">11.2</span>Phạt, bồi thường mà KSP phải trả cho khách hàng do lỗi vận chuyển của Bên B được Bên B hoàn trả trong phạm vi lỗi và phạm vi chứng cứ; Bên A được khấu trừ vào cước phải thanh toán.<span class=\"th\" data-t=\"ค่าปรับและค่าชดใช้ที่ KSP ต้องชำระแก่ลูกค้าเนื่องจากความผิดในการขนส่งของฝ่าย B ฝ่าย B ต้องชดใช้คืนภายในขอบเขตความผิดและหลักฐาน ฝ่าย A มีสิทธิหักจากค่าขนส่งที่ต้องชำระ\"></span></p><h3 class=\"art\" data-n=\"12\"><strong>ĐIỀU 12. THỜI HẠN VÀ CHẤM DỨT</strong><span class=\"th\" data-t=\"ข้อ 12. ระยะเวลาและการเลิกสัญญา\"></span></h3><p class=\"lv1\"><span class=\"lb\">12.1</span>Hợp đồng có hiệu lực <span class=\"fx\" data-k=\"SỐ\"></span> tháng từ <span class=\"fx\" data-k=\"NGÀY\"></span> hoặc đến khi hoàn thành các chuyến theo lệnh vận chuyển đã xác nhận.<span class=\"th\" data-t=\"สัญญามีผลใช้บังคับเป็นเวลา 【SỐ】 เดือน นับจาก 【NGÀY】 หรือจนกว่าจะดำเนินการขนส่งครบทุกเที่ยวตามใบสั่งขนส่งที่ได้ยืนยันแล้ว\"></span></p><p class=\"lv1\"><span class=\"lb\">12.2</span>Mỗi Bên chấm dứt khi Bên kia vi phạm nghiêm trọng không khắc phục trong <span class=\"fx\" data-k=\"07\"></span> ngày kể từ thông báo. Bên A có quyền chấm dứt ngay khi Bên B mất giấy phép, bảo hiểm, bị xử phạt nghiêm trọng, vận chuyển quá tải lặp lại, hoặc vi phạm Điều 14 (hối lộ); chấm dứt không cần lý do với thông báo trước <span class=\"fx\" data-k=\"30\"></span> ngày.<span class=\"th\" data-t=\"แต่ละฝ่ายมีสิทธิเลิกสัญญาเมื่ออีกฝ่ายหนึ่งผิดสัญญาอย่างร้ายแรงและไม่แก้ไขภายใน 【07】 วัน นับแต่วันที่ได้รับหนังสือแจ้ง ฝ่าย A มีสิทธิเลิกสัญญาได้ทันทีเมื่อฝ่าย B สูญเสียใบอนุญาต ประกันภัย ถูกลงโทษปรับทางปกครองอย่างร้ายแรง บรรทุกน้ำหนักเกินซ้ำ ๆ หรือฝ่าฝืนข้อ 14 (การให้สินบน) และมีสิทธิเลิกสัญญาโดยไม่ต้องระบุเหตุผลโดยแจ้งล่วงหน้า 【30】 วัน\"></span></p><h3 class=\"art\" data-n=\"13\"><strong>ĐIỀU 13. BẤT KHẢ KHÁNG</strong><span class=\"th\" data-t=\"ข้อ 13. เหตุสุดวิสัย\"></span></h3><p class=\"lv1\"><span class=\"lb\">13.1</span>Bất khả kháng là sự kiện xảy ra một cách khách quan không thể lường trước và không thể khắc phục được mặc dù đã áp dụng mọi biện pháp cần thiết và khả năng cho phép (Điều 156 Bộ luật Dân sự 2015), kể cả thiên tai, dịch bệnh, chiến tranh, quyết định của cơ quan nhà nước có thẩm quyền làm cấm hoặc đình chỉ việc thực hiện hợp đồng.<span class=\"th\" data-t=\"เหตุสุดวิสัยคือเหตุการณ์ที่เกิดขึ้นโดยปรากฏชัดแจ้งตามวัตถุวิสัย ไม่อาจคาดการณ์ได้ และไม่อาจแก้ไขได้ แม้ได้ใช้มาตรการทุกอย่างที่จำเป็นและเท่าที่ความสามารถอำนวยแล้ว (มาตรา 156 ประมวลกฎหมายแพ่ง ค.ศ. 2015) รวมถึงภัยธรรมชาติ โรคระบาด สงคราม และคำสั่งของหน่วยงานของรัฐที่มีอำนาจที่ห้ามหรือระงับการปฏิบัติตามสัญญา\"></span></p><p class=\"lv1\"><span class=\"lb\">13.2</span>Bên bị ảnh hưởng phải thông báo bằng văn bản cho Bên kia trong <span class=\"fx\" data-k=\"07\"></span> ngày kể từ ngày sự kiện xảy ra, kèm chứng cứ (xác nhận của cơ quan có thẩm quyền nếu có), áp dụng mọi biện pháp hợp lý để hạn chế thiệt hại và nối lại việc thực hiện ngay khi có thể. Thông báo chậm làm Bên bị ảnh hưởng mất quyền miễn trách nhiệm đối với phần thiệt hại phát sinh do chậm thông báo.<span class=\"th\" data-t=\"ฝ่ายที่ได้รับผลกระทบต้องแจ้งเป็นลายลักษณ์อักษรให้อีกฝ่ายทราบภายใน 【07】 วัน นับจากวันที่เหตุการณ์เกิดขึ้น พร้อมพยานหลักฐาน (การรับรองจากหน่วยงานที่มีอำนาจ หากมี) ใช้มาตรการที่สมเหตุสมผลทุกอย่างเพื่อลดความเสียหาย และกลับมาปฏิบัติตามสัญญาโดยเร็วที่สุดเท่าที่ทำได้ การแจ้งล่าช้าทำให้ฝ่ายที่ได้รับผลกระทบสูญเสียสิทธิในการได้รับยกเว้นความรับผิดสำหรับความเสียหายที่เกิดจากการแจ้งล่าช้า\"></span></p><p class=\"lv1\"><span class=\"lb\">13.3</span>Không được coi là bất khả kháng: khó khăn tài chính, biến động giá, thiếu nhân công, vật tư, phương tiện; lỗi của nhà thầu phụ, nhà cung cấp, nhà vận chuyển của Bên vi phạm, trừ khi chính họ gặp sự kiện bất khả kháng đáp ứng định nghĩa trên.<span class=\"th\" data-t=\"ไม่ถือเป็นเหตุสุดวิสัย: ความยากลำบากทางการเงิน ความผันผวนของราคา การขาดแคลนแรงงาน วัสดุ และยานพาหนะ; ความผิดของผู้รับเหมาช่วง ผู้จัดหา ผู้ขนส่งของฝ่ายที่ผิดสัญญา เว้นแต่บุคคลเหล่านั้นประสบเหตุสุดวิสัยที่เข้าตามคำนิยามข้างต้น\"></span></p><p class=\"lv1\"><span class=\"lb\">13.4</span>Nếu sự kiện bất khả kháng kéo dài quá <span class=\"fx\" data-k=\"60\"></span> ngày liên tục, Các Bên thương lượng phương án tiếp tục hoặc chấm dứt. Nếu không thỏa thuận được, mỗi Bên có quyền chấm dứt phần hợp đồng bị ảnh hưởng bằng thông báo trước <span class=\"fx\" data-k=\"15\"></span> ngày; phần đã thực hiện đúng hợp đồng được thanh toán, không bên nào phải chịu phạt vi phạm.<span class=\"th\" data-t=\"หากเหตุสุดวิสัยดำเนินต่อเนื่องเกิน 【60】 วัน ทั้งสองฝ่ายต้องเจรจาแนวทางดำเนินการต่อหรือเลิกสัญญา หากตกลงกันไม่ได้ แต่ละฝ่ายมีสิทธิเลิกสัญญาในส่วนที่ได้รับผลกระทบโดยแจ้งล่วงหน้า 【15】 วัน; ส่วนที่ได้ดำเนินการถูกต้องตามสัญญาแล้วจะได้รับการชำระเงิน และไม่ฝ่ายใดต้องรับผิดค่าปรับตามสัญญา\"></span></p><h3 class=\"art\" data-n=\"14\"><strong>ĐIỀU 14. TUÂN THỦ PHÁP LUẬT, CHỐNG HỐI LỘ VÀ XUNG ĐỘT LỢI ÍCH</strong><span class=\"th\" data-t=\"ข้อ 14. การปฏิบัติตามกฎหมาย การต่อต้านการให้สินบน และความขัดแย้งทางผลประโยชน์\"></span></h3><p class=\"lv1\"><span class=\"lb\">14.1</span>Các Bên tuân thủ pháp luật Việt Nam về thuế, hóa đơn, lao động, môi trường, an toàn, cạnh tranh và phòng chống tham nhũng, hối lộ.<span class=\"th\" data-t=\"ทั้งสองฝ่ายปฏิบัติตามกฎหมายเวียดนามว่าด้วยภาษี ใบกำกับภาษี แรงงาน สิ่งแวดล้อม ความปลอดภัย การแข่งขัน และการป้องกันและต่อต้านการทุจริตและการให้สินบน\"></span></p><p class=\"lv1\"><span class=\"lb\">14.2</span>Không bên nào được đưa, đề nghị, nhận tiền, quà tặng hoặc lợi ích bất chính cho hoặc từ nhân sự của Bên kia, khách hàng hoặc bên thứ ba để có lợi thế trong hợp đồng; vi phạm là vi phạm nghiêm trọng, Bên bị vi phạm có quyền chấm dứt hợp đồng ngay bằng văn bản.<span class=\"th\" data-t=\"ห้ามฝ่ายใดให้ เสนอ หรือรับเงิน ของขวัญ หรือผลประโยชน์ที่มิชอบ แก่หรือจากบุคลากรของอีกฝ่าย ลูกค้า หรือบุคคลที่สาม เพื่อให้ได้เปรียบในสัญญา; การฝ่าฝืนถือเป็นการผิดสัญญาอย่างร้ายแรง ฝ่ายที่ถูกละเมิดมีสิทธิเลิกสัญญาทันทีโดยหนังสือเป็นลายลักษณ์อักษร\"></span></p><p class=\"lv1\"><span class=\"lb\">14.3</span>Mỗi Bên thông báo ngay cho Bên kia khi có xung đột lợi ích thực tế hoặc tiềm ẩn liên quan đến người tham gia ký kết, đánh giá, nghiệm thu hợp đồng.<span class=\"th\" data-t=\"แต่ละฝ่ายต้องแจ้งให้อีกฝ่ายทราบทันทีเมื่อมีความขัดแย้งทางผลประโยชน์ที่เกิดขึ้นจริงหรืออาจเกิดขึ้น เกี่ยวกับผู้ที่เข้าร่วมการลงนาม การประเมิน และการตรวจรับสัญญา\"></span></p><h3 class=\"art\" data-n=\"15\"><strong>ĐIỀU 15. BẢO MẬT, SỞ HỮU TRÍ TUỆ VÀ BẢO VỆ DỮ LIỆU CÁ NHÂN</strong><span class=\"th\" data-t=\"ข้อ 15. การรักษาความลับ ทรัพย์สินทางปัญญา และการคุ้มครองข้อมูลส่วนบุคคล\"></span></h3><p class=\"lv1\"><span class=\"lb\">15.1</span>Mỗi Bên giữ bí mật thông tin kỹ thuật, giá, tài liệu và thông tin kinh doanh của Bên kia nhận được liên quan đến hợp đồng; chỉ sử dụng cho mục đích thực hiện hợp đồng và chỉ tiết lộ cho nhân sự, tư vấn, ngân hàng, bảo hiểm cần biết hoặc khi cơ quan nhà nước có thẩm quyền yêu cầu theo luật.<span class=\"th\" data-t=\"แต่ละฝ่ายต้องรักษาความลับของข้อมูลทางเทคนิค ราคา เอกสาร และข้อมูลทางธุรกิจของอีกฝ่ายที่ได้รับเกี่ยวกับสัญญา ใช้เพื่อวัตถุประสงค์ในการปฏิบัติตามสัญญาเท่านั้น และเปิดเผยเฉพาะแก่บุคลากร ที่ปรึกษา ธนาคาร บริษัทประกันภัยที่จำเป็นต้องรู้ หรือเมื่อหน่วยงานของรัฐที่มีอำนาจเรียกร้องตามกฎหมาย\"></span></p><p class=\"lv1\"><span class=\"lb\">15.2</span>Nghĩa vụ bảo mật kéo dài <span class=\"fx\" data-k=\"03\"></span> năm sau khi hợp đồng chấm dứt hoặc hết hiệu lực. Quyền sở hữu trí tuệ đối với tài liệu, bản vẽ, phần mềm của mỗi Bên không chuyển giao, trừ phạm vi được cấp phép sử dụng để thực hiện và sử dụng sản phẩm của hợp đồng.<span class=\"th\" data-t=\"ภาระผูกพันในการรักษาความลับมีผลต่อเนื่อง 【03】 ปี หลังสัญญาเลิกหรือสิ้นผลบังคับ สิทธิในทรัพย์สินทางปัญญาในเอกสาร แบบ และซอฟต์แวร์ของแต่ละฝ่ายไม่โอนให้กัน เว้นแต่ขอบเขตที่ได้รับอนุญาตให้ใช้เพื่อปฏิบัติตามสัญญาและใช้ผลิตภัณฑ์ของสัญญา\"></span></p><p class=\"lv1\"><span class=\"lb\">15.3</span>Khi xử lý dữ liệu cá nhân của người lao động, đại diện, đầu mối của Bên kia, mỗi Bên tuân thủ pháp luật về bảo vệ dữ liệu cá nhân (Nghị định 13/2023/NĐ-CP và văn bản thay thế, sửa đổi nếu có), chỉ xử lý trong phạm vi cần thiết cho hợp đồng.<span class=\"th\" data-t=\"เมื่อประมวลผลข้อมูลส่วนบุคคลของลูกจ้าง ผู้แทน และผู้ประสานงานของอีกฝ่าย แต่ละฝ่ายต้องปฏิบัติตามกฎหมายว่าด้วยการคุ้มครองข้อมูลส่วนบุคคล (พระราชกฤษฎีกา ฉบับที่ 13/2023/NĐ-CP และเอกสารที่ใช้แทนหรือแก้ไขเพิ่มเติม หากมี) และประมวลผลเฉพาะในขอบเขตที่จำเป็นสำหรับสัญญา\"></span></p><h3 class=\"art\" data-n=\"16\"><strong>ĐIỀU 16. LUẬT ÁP DỤNG VÀ GIẢI QUYẾT TRANH CHẤP</strong><span class=\"th\" data-t=\"ข้อ 16 กฎหมายที่ใช้บังคับและการระงับข้อพิพาท\"></span></h3><p class=\"lv1\"><span class=\"lb\">16.1</span>Hợp đồng chịu sự điều chỉnh của pháp luật Việt Nam.<span class=\"th\" data-t=\"สัญญานี้อยู่ภายใต้บังคับของกฎหมายเวียดนาม\"></span></p><p class=\"lv1\"><span class=\"lb\">16.2</span>Tranh chấp được giải quyết trước hết bằng thương lượng, hòa giải thiện chí trong <span class=\"fx\" data-k=\"30\"></span> ngày kể từ ngày một Bên gửi thông báo tranh chấp bằng văn bản nêu rõ nội dung, căn cứ và yêu cầu.<span class=\"th\" data-t=\"ข้อพิพาทให้ระงับเป็นลำดับแรกโดยการเจรจาและไกล่เกลี่ยด้วยความสุจริตภายใน 【30】 วัน นับจากวันที่ฝ่ายหนึ่งส่งหนังสือแจ้งข้อพิพาทเป็นลายลักษณ์อักษรระบุเนื้อหา ฐาน และข้อเรียกร้องอย่างชัดเจน\"></span></p><p class=\"lv1\"><span class=\"lb\">16.3</span>Nếu không giải quyết được, tranh chấp được đưa ra (chỉ chọn một): <span class=\"fx\" data-k=\"TÒA ÁN NHÂN DÂN CÓ THẨM QUYỀN TẠI (TỈNH/THÀNH PHỐ) / TRUNG TÂM TRỌNG TÀI QUỐC TẾ VIỆT NAM (VIAC), LUẬT TỐ TỤNG VIAC, 01 TRỌNG TÀI VIÊN, TRỤ SỞ TRỌNG TÀI TẠI (ĐỊA ĐIỂM), NGÔN NGỮ TIẾNG VIỆT\"></span>. Nếu chọn trọng tài, thỏa thuận này là thỏa thuận trọng tài độc lập, phán quyết là chung thẩm.<span class=\"th\" data-t=\"หากระงับไม่ได้ ให้นำข้อพิพาทเสนอต่อ (เลือกเพียงอย่างเดียว): 【TÒA ÁN NHÂN DÂN CÓ THẨM QUYỀN TẠI (TỈNH/THÀNH PHỐ) / TRUNG TÂM TRỌNG TÀI QUỐC TẾ VIỆT NAM (VIAC), LUẬT TỐ TỤNG VIAC, 01 TRỌNG TÀI VIÊN, TRỤ SỞ TRỌNG TÀI TẠI (ĐỊA ĐIỂM), NGÔN NGỮ TIẾNG VIỆT】 หากเลือกอนุญาโตตุลาการ ข้อตกลงนี้เป็นข้อตกลงอนุญาโตตุลาการที่เป็นอิสระ และคำชี้ขาดเป็นที่สุด\"></span></p><p class=\"lv1\"><span class=\"lb\">16.4</span>Trong thời gian giải quyết tranh chấp, Các Bên tiếp tục thực hiện các phần nghĩa vụ không bị tranh chấp.<span class=\"th\" data-t=\"ในระหว่างการระงับข้อพิพาท ทั้งสองฝ่ายต้องปฏิบัติตามภาระผูกพันในส่วนที่ไม่มีข้อพิพาทต่อไป\"></span></p><p class=\"lv1\"><span class=\"lb\">16.5</span>Hợp đồng lập bằng tiếng Việt. Bản dịch sang tiếng Anh hoặc tiếng Thái (nếu có) chỉ để tham khảo; khi có khác biệt, bản tiếng Việt có giá trị áp dụng.<span class=\"th\" data-t=\"สัญญาจัดทำเป็นภาษาเวียดนาม ฉบับแปลเป็นภาษาอังกฤษหรือภาษาไทย (หากมี) ใช้เพื่อการอ้างอิงเท่านั้น หากมีความแตกต่าง ให้ถือฉบับภาษาเวียดนามเป็นฉบับที่ใช้บังคับ\"></span></p><h3 class=\"art\" data-n=\"17\"><strong>ĐIỀU 17. ĐIỀU KHOẢN CHUNG VÀ HIỆU LỰC</strong><span class=\"th\" data-t=\"ข้อ 17 ข้อกำหนดทั่วไปและการมีผลบังคับ\"></span></h3><p class=\"lv1\"><span class=\"lb\">17.1</span>Thông báo phải bằng văn bản, gửi tới địa chỉ, email của đại diện nhận thông báo nêu ở phần đầu Hợp đồng (hoặc địa chỉ được thông báo thay đổi bằng văn bản). Thông báo gửi bằng email có hiệu lực khi hệ thống không báo lỗi và đã gửi bản gốc trong <span class=\"fx\" data-k=\"05\"></span> ngày làm việc nếu Bên nhận yêu cầu.<span class=\"th\" data-t=\"การแจ้งต้องเป็นลายลักษณ์อักษร ส่งไปยังที่อยู่และอีเมลของผู้แทนผู้รับแจ้งที่ระบุไว้ในส่วนต้นของสัญญา (หรือที่อยู่ที่แจ้งเปลี่ยนแปลงเป็นลายลักษณ์อักษร) การแจ้งทางอีเมลมีผลเมื่อระบบไม่แจ้งข้อผิดพลาด และได้ส่งฉบับจริงภายใน 【05】 วันทำการ หากฝ่ายผู้รับร้องขอ\"></span></p><p class=\"lv1\"><span class=\"lb\">17.2</span>Không bên nào được chuyển nhượng quyền, nghĩa vụ theo hợp đồng cho bên thứ ba khi chưa có chấp thuận bằng văn bản của Bên kia, trừ quyền nhận tiền được chuyển nhượng theo quy định pháp luật và thông báo cho Bên có nghĩa vụ.<span class=\"th\" data-t=\"ห้ามฝ่ายใดโอนสิทธิและภาระผูกพันตามสัญญาให้บุคคลที่สามโดยยังไม่ได้รับความยินยอมเป็นลายลักษณ์อักษรจากอีกฝ่าย เว้นแต่สิทธิในการรับเงินที่โอนได้ตามกฎหมายและแจ้งให้ฝ่ายที่มีหน้าที่ทราบ\"></span></p><p class=\"lv1\"><span class=\"lb\">17.3</span>Mọi sửa đổi, bổ sung chỉ có hiệu lực khi lập thành văn bản có chữ ký của người có thẩm quyền của cả hai Bên. Phụ lục là một phần không tách rời; khi có mâu thuẫn, thứ tự ưu tiên: (i) Phụ lục điều kiện đặc biệt được hai Bên ký, (ii) nội dung Hợp đồng, (iii) các Phụ lục còn lại.<span class=\"th\" data-t=\"การแก้ไขเพิ่มเติมทั้งหมดมีผลต่อเมื่อจัดทำเป็นลายลักษณ์อักษรและมีลายมือชื่อของผู้มีอำนาจของทั้งสองฝ่าย ภาคผนวกเป็นส่วนหนึ่งของสัญญาที่แยกจากกันไม่ได้ เมื่อมีความขัดแย้งให้ใช้ลำดับความสำคัญดังนี้: (i) ภาคผนวกเงื่อนไขพิเศษที่ทั้งสองฝ่ายลงนาม (ii) เนื้อหาของสัญญา (iii) ภาคผนวกอื่น ๆ\"></span></p><p class=\"lv1\"><span class=\"lb\">17.4</span>Nếu một điều khoản bị tuyên vô hiệu hoặc không thể thi hành, các điều khoản còn lại vẫn có hiệu lực; Các Bên thương lượng điều khoản thay thế gần nhất với ý chí ban đầu.<span class=\"th\" data-t=\"หากข้อกำหนดใดถูกวินิจฉัยว่าเป็นโมฆะหรือไม่อาจบังคับใช้ได้ ข้อกำหนดที่เหลือยังคงมีผลบังคับ; ทั้งสองฝ่ายต้องเจรจาข้อกำหนดทดแทนที่ใกล้เคียงกับเจตนารมณ์เดิมมากที่สุด\"></span></p><p class=\"lv1\"><span class=\"lb\">17.5</span>Hợp đồng có hiệu lực từ ngày <span class=\"fx\" data-k=\"NGÀY KÝ / ĐIỀU KIỆN CÓ HIỆU LỰC\"></span>, lập thành <span class=\"fx\" data-k=\"04\"></span> bản có giá trị như nhau, mỗi Bên giữ <span class=\"fx\" data-k=\"02\"></span> bản.<span class=\"th\" data-t=\"สัญญามีผลตั้งแต่วันที่ 【NGÀY KÝ / ĐIỀU KIỆN CÓ HIỆU LỰC】 จัดทำเป็น 【04】 ฉบับ มีค่าเท่ากัน โดยแต่ละฝ่ายเก็บไว้ 【02】 ฉบับ\"></span></p><div class=\"tw2\"><table class=\"ct\"><tr><th>ĐẠI DIỆN BÊN A<span class=\"th\" data-t=\"ผู้แทนฝ่าย A\"></span></th><th>ĐẠI DIỆN BÊN B<span class=\"th\" data-t=\"ผู้แทนฝ่าย B\"></span></th></tr><tr><td>(Ký, ghi rõ họ tên, chức danh, đóng dấu nếu có) <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ / NGÀY\"></span><span class=\"th\" data-t=\"(ลงนาม ระบุชื่อ-นามสกุล ตำแหน่ง และประทับตราหากมี) 【HỌ TÊN / CHỨC VỤ / NGÀY】\"></span></td><td>(Ký, ghi rõ họ tên, chức danh, đóng dấu nếu có) <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ / NGÀY\"></span><span class=\"th\" data-t=\"(ลงนาม ระบุชื่อ-นามสกุล ตำแหน่ง และประทับตราหากมี) 【HỌ TÊN / CHỨC VỤ / NGÀY】\"></span></td></tr></table></div><h3 class=\"ann\" data-n=\"01\"><strong>PHỤ LỤC 01 – TUYẾN VẬN CHUYỂN VÀ BẢNG CƯỚC</strong><span class=\"th\" data-t=\"ภาคผนวก 01 – เส้นทางขนส่งและตารางอัตราค่าขนส่ง\"></span></h3><div class=\"tw2\"><table class=\"ct\"><tr><th>STT<span class=\"th\" data-t=\"ลำดับ\"></span></th><th>Tuyến (từ – đến)<span class=\"th\" data-t=\"เส้นทาง (ต้นทาง – ปลายทาง)\"></span></th><th>Loại hàng<span class=\"th\" data-t=\"ประเภทสินค้า\"></span></th><th>Loại xe / tải trọng<span class=\"th\" data-t=\"ประเภทรถ / น้ำหนักบรรทุก\"></span></th><th>Đơn vị tính<span class=\"th\" data-t=\"หน่วยนับ\"></span></th><th>Cước (VNĐ)<span class=\"th\" data-t=\"อัตราค่าขนส่ง (VNĐ)\"></span></th><th>Thời gian giao tiêu chuẩn<span class=\"th\" data-t=\"ระยะเวลาส่งมอบมาตรฐาน\"></span></th></tr><tr><td>1</td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><sp
