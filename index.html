ชดใช้ค่าเสียหาย การคืนเงินล่วงหน้าส่วนที่ขาด การรักษาความลับ และการระงับข้อพิพาท ยังคงมีผลบังคับต่อไปภายหลังการชำระสะสาง/การยุติสัญญา ภายในขอบเขตตามสัญญาและกฎหมาย\"></span></p><p>17.5. Trường hợp chấm dứt trước khi hoàn thành toàn bộ công việc, điều kiện hoàn thành toàn bộ tại khoản 17.1 không áp dụng cho quyết toán phần việc đã thực hiện hợp lệ. Bên B nộp hồ sơ trong (15) ngày làm việc từ ngày kiểm kê; Bên A phản hồi trong (10) ngày làm việc. Hai Bên đối chiếu khối lượng đạt yêu cầu, vật tư, tạm ứng và các khoản khấu trừ theo Điều 8; khoản không tranh chấp thanh toán trong (15) ngày làm việc từ khi đủ hồ sơ, không buộc chờ giải quyết toàn bộ tranh chấp.<span class=\"th\" data-t=\"17.5. ในกรณีที่มีการยุติสัญญาก่อนที่งานทั้งหมดจะแล้วเสร็จ เงื่อนไขการแล้วเสร็จทั้งหมดตามข้อย่อย 17.1 ไม่ใช้บังคับกับการสรุปยอดงานส่วนที่ได้ดำเนินการโดยชอบ ฝ่าย B ยื่นเอกสารภายใน (15) วันทำการนับจากวันตรวจนับ ฝ่าย A ตอบกลับภายใน (10) วันทำการ คู่สัญญาทั้งสองฝ่ายตรวจสอบเทียบปริมาณงานที่ได้มาตรฐาน วัสดุ เงินล่วงหน้า และรายการหักตามข้อ 8 รายการที่ไม่มีข้อพิพาทให้ชำระภายใน (15) วันทำการนับแต่เมื่อเอกสารครบถ้วน โดยไม่ต้องรอให้ข้อพิพาททั้งหมดได้รับการระงับ\"></span></p><h3 class=\"art\" data-n=\"18\">ĐIỀU 18. THÀNH PHẦN HỢP ĐỒNG<span class=\"th\" data-t=\"ข้อ 18 องค์ประกอบของสัญญา\"></span></h3><p>Hồ sơ Hợp đồng và thứ tự ưu tiên khi có mâu thuẫn: (1) Văn bản sửa đổi/phụ lục sửa đổi và Phiếu yêu cầu thay đổi/Variation Order (VO) theo Phụ lục 05 được các Bên ký hợp lệ, đúng thẩm quyền; văn bản ký sau được ưu tiên đối với nội dung được sửa đổi; (2) Văn bản Hợp đồng này; (3) Phụ lục 06 – Thông số thương mại/Chế tài; (4) Phụ lục 04 – Ma trận Back-to-Back được hai bên ký xác nhận; (5) Phụ lục 01 – BOQ/SOW/Bản vẽ được duyệt; (6) Phụ lục 03 – Tiến độ và nghiệm thu; (7) Phụ lục 02 – HSE và các tài liệu khác liệt kê rõ số hiệu, ngày, phiên bản. Không tự động dẫn chiếu toàn bộ hợp đồng chủ đầu tư chưa công bố.<span class=\"th\" data-t=\"เอกสารสัญญาและลำดับความสำคัญในกรณีขัดแย้งกัน: (1) เอกสารแก้ไข/ภาคผนวกแก้ไข และแบบฟอร์มขอเปลี่ยนแปลง/Variation Order (VO) ตามภาคผนวก 05 ที่คู่สัญญาลงนามโดยชอบและถูกต้องตามอำนาจ เอกสารที่ลงนามภายหลังมีความสำคัญเหนือกว่าสำหรับเนื้อหาที่ได้รับการแก้ไข; (2) ตัวสัญญาฉบับนี้; (3) ภาคผนวก 06 – พารามิเตอร์ทางการค้า/มาตรการลงโทษ; (4) ภาคผนวก 04 – เมทริกซ์ Back-to-Back ที่คู่สัญญาทั้งสองฝ่ายลงนามยืนยัน; (5) ภาคผนวก 01 – BOQ/SOW/แบบก่อสร้างที่ได้รับอนุมัติ; (6) ภาคผนวก 03 – กำหนดการและการตรวจรับ; (7) ภาคผนวก 02 – HSE และเอกสารอื่น ๆ ที่ระบุชัดเจนถึงเลขที่ วันที่ และฉบับ ไม่มีการอ้างอิงโดยอัตโนมัติถึงสัญญาของเจ้าของโครงการทั้งฉบับที่ยังไม่ได้เปิดเผย\"></span></p><p>Điều kiện riêng tại phụ lục được hai Bên ký hợp lệ và xác định rõ điều, khoản bị sửa đổi hoặc thay thế có giá trị ưu tiên áp dụng đối với nội dung đó. Tài liệu kỹ thuật mới chỉ thay thế phiên bản cũ khi được phê duyệt đúng thẩm quyền; mọi thay đổi chi phí hoặc tiến độ được xử lý theo Điều 20. Trường hợp có khác biệt với quy định bắt buộc của pháp luật, quy định bắt buộc của pháp luật được ưu tiên áp dụng.<span class=\"th\" data-t=\"เงื่อนไขเฉพาะในภาคผนวกที่คู่สัญญาทั้งสองฝ่ายลงนามโดยชอบและระบุชัดเจนถึงข้อและข้อย่อยที่ถูกแก้ไขหรือแทนที่ มีผลบังคับใช้เหนือกว่าสำหรับเนื้อหานั้น เอกสารทางเทคนิคฉบับใหม่จะแทนที่ฉบับเดิมได้ก็ต่อเมื่อได้รับอนุมัติโดยถูกต้องตามอำนาจ การเปลี่ยนแปลงค่าใช้จ่ายหรือกำหนดการทั้งหมดให้ดำเนินการตามข้อ 20 ในกรณีที่มีความแตกต่างจากบทบัญญัติที่เป็นข้อบังคับของกฎหมาย ให้บทบัญญัติที่เป็นข้อบังคับของกฎหมายมีผลบังคับใช้เหนือกว่า\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Văn bản hợp đồng, phụ lục sửa đổi được ký sau và Phụ lục 01 đến 06 được liệt kê rõ là bộ phận không tách rời;<span class=\"th\" data-t=\"ตัวสัญญา ภาคผนวกแก้ไขที่ลงนามภายหลัง และภาคผนวก 01 ถึง 06 ซึ่งระบุชัดเจนว่าเป็นส่วนหนึ่งที่แยกจากกันไม่ได้;\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Các bản vẽ, tiêu chuẩn, hồ sơ thầu và tài liệu khác có số hiệu, ngày, phiên bản được ghi trong Danh mục tài liệu Hợp đồng tại Phụ lục 01.<span class=\"th\" data-t=\"แบบก่อสร้าง มาตรฐาน เอกสารประกวดราคา และเอกสารอื่น ๆ ที่มีเลขที่ วันที่ ฉบับ ตามที่ระบุไว้ในรายการเอกสารสัญญาในภาคผนวก 01\"></span></p><p>Thông tin gửi hồ sơ <span class=\"th\" data-t=\"ข้อมูลการจัดส่งเอกสาร\"></span></p><p><strong>Nếu gửi cho Công Ty:</strong><span class=\"th\" data-t=\"กรณีส่งถึงบริษัท:\"></span></p><p>Người nhận : Hồng Như<span class=\"th\" data-t=\"ผู้รับ: Hồng Như\"></span></p><p>Công ty : TNHH KSP Việt Nam<span class=\"th\" data-t=\"บริษัท: TNHH KSP Việt Nam\"></span></p><p>Địa chỉ  : Lô M-3A-CN, Khu Công Nghiệp Mỹ Phước 2, Phường Bến Cát, Thành Phố Hồ Chí Minh, Việt Nam<span class=\"th\" data-t=\"ที่อยู่: Lô M-3A-CN, Khu Công Nghiệp Mỹ Phước 2, Phường Bến Cát, Thành Phố Hồ Chí Minh, เวียดนาม\"></span></p><p>Điện thoại : 0987896857<span class=\"th\" data-t=\"โทรศัพท์: 0987896857\"></span></p><p>Email  : Phannhu@ksp.com.vn <span class=\"th\" data-t=\"อีเมล: Phannhu@ksp.com.vn\"></span></p><p><strong>Nếu gửi cho Nhà Thầu</strong>:<span class=\"th\" data-t=\"กรณีส่งถึงผู้รับเหมา:\"></span></p><p>Người nhận: <strong><span class=\"fx\" data-k=\"HỌ TÊN ĐẦU MỐI NHÀ THẦU\"></span></strong><span class=\"th\" data-t=\"ผู้รับ: 【HỌ TÊN ĐẦU MỐI NHÀ THẦU】\"></span></p><p>Công ty: <strong><span class=\"fx\" data-k=\"TÊN NHÀ THẦU\"></span></strong><span class=\"th\" data-t=\"บริษัท: 【TÊN NHÀ THẦU】\"></span></p><p>Địa chỉ: <strong><span class=\"fx\" data-k=\"ĐỊA CHỈ LIÊN HỆ\"></span></strong><span class=\"th\" data-t=\"ที่อยู่: 【ĐỊA CHỈ LIÊN HỆ】\"></span></p><p>Điện thoại / Email: <strong><span class=\"fx\" data-k=\"SỐ ĐIỆN THOẠI / EMAIL\"></span></strong><span class=\"th\" data-t=\"โทรศัพท์ / อีเมล: 【SỐ ĐIỆN THOẠI / EMAIL】\"></span></p><p>18.4. Thông tin liên hệ có thể thay đổi bằng văn bản có xác nhận; thông báo chấm dứt, khiếu nại hoặc yêu cầu phạt phải được gửi đến địa chỉ/email được chỉ định để bảo đảm chứng cứ nhận. <span class=\"th\" data-t=\"18.4. ข้อมูลการติดต่ออาจเปลี่ยนแปลงได้โดยเป็นหนังสือที่มีการยืนยัน หนังสือบอกเลิก ข้อร้องเรียน หรือคำเรียกร้องค่าปรับ ต้องส่งไปยังที่อยู่/อีเมลที่กำหนดไว้ เพื่อให้มีหลักฐานการรับ\"></span></p><h3 class=\"art\" data-n=\"19\">ĐIỀU 19. ĐIỀU KHOẢN CHUNG<span class=\"th\" data-t=\"ข้อ 19 ข้อกำหนดทั่วไป\"></span></h3><p class=\"lv1 bl\"><span class=\"lb\">•</span>Hai bên cam kết tuân thủ đầy đủ và nghiêm túc tất cả các điều khoản trong Hợp đồng này. Mọi sửa đổi, bổ sung chỉ có giá trị khi được lập thành văn bản có chữ ký xác nhận của cả hai bên, và được xem là một phần không thể tách rời của Hợp đồng.<span class=\"th\" data-t=\"คู่สัญญาทั้งสองฝ่ายให้คำมั่นที่จะปฏิบัติตามข้อกำหนดทั้งหมดในสัญญาฉบับนี้อย่างครบถ้วนและเคร่งครัด การแก้ไขเพิ่มเติมใด ๆ จะมีผลก็ต่อเมื่อจัดทำเป็นหนังสือที่มีลายมือชื่อยืนยันของคู่สัญญาทั้งสองฝ่าย และถือเป็นส่วนหนึ่งที่แยกจากกันไม่ได้ของสัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Những nội dung không được quy định trong Hợp đồng này sẽ được áp dụng theo quy định pháp luật hiện hành của Việt Nam.<span class=\"th\" data-t=\"เนื้อหาที่มิได้กำหนดไว้ในสัญญาฉบับนี้ ให้บังคับตามบทบัญญัติของกฎหมายเวียดนามที่ใช้บังคับอยู่\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Mọi tranh chấp phát sinh từ Hợp đồng được ưu tiên giải quyết bằng thương lượng trong <strong><span class=\"fx\" data-k=\"15\"></span></strong> ngày làm việc; nếu không giải quyết được, tranh chấp được giải quyết tại <strong><span class=\"fx\" data-k=\"TÒA ÁN VIỆT NAM CÓ THẨM QUYỀN / TRỌNG TÀI VIAC (LỰA CHỌN VÀ CHỈ GHI MỘT)\"></span></strong> theo pháp luật áp dụng. Bản án/quyết định trọng tài có hiệu lực theo trình tự pháp luật; chi phí tố tụng theo quyết định có thẩm quyền và thỏa thuận hợp pháp của Các Bên.<span class=\"th\" data-t=\"ข้อพิพาทใด ๆ ที่เกิดจากสัญญาให้ระงับโดยการเจรจาเป็นลำดับแรกภายใน 【15】 วันทำการ หากไม่สามารถระงับได้ ให้ระงับข้อพิพาทที่ 【TÒA ÁN VIỆT NAM CÓ THẨM QUYỀN / TRỌNG TÀI VIAC (LỰA CHỌN VÀ CHỈ GHI MỘT)】 ตามกฎหมายที่ใช้บังคับ คำพิพากษา/คำชี้ขาดของอนุญาโตตุลาการมีผลบังคับตามขั้นตอนของกฎหมาย ค่าใช้จ่ายในการดำเนินคดีเป็นไปตามคำวินิจฉัยของผู้มีอำนาจและข้อตกลงที่ชอบด้วยกฎหมายของคู่สัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Hợp đồng lập thành <strong><span class=\"fx\" data-k=\"SỐ BẢN GỐC\"></span></strong> bản có giá trị pháp lý như nhau, Bên A giữ <strong><span class=\"fx\" data-k=\"SỐ BẢN\"></span></strong> bản và Bên B giữ <strong><span class=\"fx\" data-k=\"SỐ BẢN\"></span></strong> bản.<span class=\"th\" data-t=\"สัญญาจัดทำขึ้นจำนวน 【SỐ BẢN GỐC】 ฉบับ มีค่าบังคับทางกฎหมายเท่ากัน ฝ่าย A เก็บไว้ 【SỐ BẢN】 ฉบับ และฝ่าย B เก็บไว้ 【SỐ BẢN】 ฉบับ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Hợp đồng có hiệu lực kể từ <strong><span class=\"fx\" data-k=\"NGÀY KÝ / ĐIỀU KIỆN CÓ HIỆU LỰC\"></span></strong> với chữ ký của người đại diện hợp pháp hoặc được ủy quyền của mỗi Bên; việc sử dụng con dấu/chữ ký số áp dụng theo pháp luật hiện hành.<span class=\"th\" data-t=\"สัญญามีผลบังคับตั้งแต่ 【NGÀY KÝ / ĐIỀU KIỆN CÓ HIỆU LỰC】 โดยมีลายมือชื่อของผู้แทนโดยชอบด้วยกฎหมายหรือผู้ได้รับมอบอำนาจของแต่ละฝ่าย การใช้ตราประทับ/ลายมือชื่อดิจิทัลให้เป็นไปตามกฎหมายที่ใช้บังคับอยู่\"></span></p><h3 class=\"art\" data-n=\"20\">ĐIỀU 20. THAY ĐỔI, PHÁT SINH KHỐI LƯỢNG VÀ ĐIỀU CHỈNH GIÁ<span class=\"th\" data-t=\"ข้อ 20 การเปลี่ยนแปลง ปริมาณงานที่เกิดเพิ่ม และการปรับราคา\"></span></h3><p>20.1. Mọi thay đổi phạm vi, bản vẽ, chất lượng, đơn giá hoặc tiến độ phải được lập bằng Phiếu yêu cầu thay đổi (VO) tại Phụ lục 05, có nội dung công việc phát sinh/tăng giảm, đơn giá áp dụng, ảnh hưởng chi phí/thời gian và chữ ký phê duyệt hợp lệ trước khi thực hiện; trường hợp khẩn cấp để bảo vệ an toàn, lập biên bản ngay sau khi xử lý.<span class=\"th\" data-t=\"20.1. การเปลี่ยนแปลงใด ๆ เกี่ยวกับขอบเขต แบบก่อสร้าง คุณภาพ ราคาต่อหน่วย หรือกำหนดการ ต้องจัดทำโดยแบบฟอร์มขอเปลี่ยนแปลง (VO) ตามภาคผนวก 05 ซึ่งมีเนื้อหางานที่เกิดเพิ่ม/เพิ่มลด ราคาต่อหน่วยที่ใช้ ผลกระทบต่อค่าใช้จ่าย/เวลา และลายมือชื่ออนุมัติที่ชอบก่อนดำเนินการ ในกรณีฉุกเฉินเพื่อคุ้มครองความปลอดภัย ให้จัดทำรายงานทันทีภายหลังการจัดการ\"></span></p><p>20.2. Bên B gửi đề xuất giá và tiến độ trong <strong><span class=\"fx\" data-k=\"03\"></span></strong> ngày làm việc từ khi nhận yêu cầu. Bên A phản hồi trong <strong><span class=\"fx\" data-k=\"05\"></span></strong> ngày làm việc hoặc thời hạn tại Phụ lục 04. Đơn giá theo BOQ nếu tương đương; công việc mới phải có đơn giá mới được phê duyệt. Việc chủ đầu tư chấp thuận VO không có nghĩa Bên A mặc nhiên chấp thuận đơn giá Bên B nếu chưa ký VO với Bên B.<span class=\"th\" data-t=\"20.2. ฝ่าย B ส่งข้อเสนอราคาและกำหนดการภายใน 【03】 วันทำการนับแต่ได้รับคำขอ ฝ่าย A ตอบกลับภายใน 【05】 วันทำการ หรือภายในกำหนดเวลาตามภาคผนวก 04 ราคาต่อหน่วยให้เป็นไปตาม BOQ หากเทียบเท่ากัน งานใหม่ต้องมีราคาต่อหน่วยใหม่ที่ได้รับอนุมัติ การที่เจ้าของโครงการยอมรับ VO ไม่ได้หมายความว่าฝ่าย A ยอมรับราคาต่อหน่วยของฝ่าย B โดยปริยาย หากยังไม่ได้ลงนาม VO กับฝ่าย B\"></span></p><p>20.3. VO xác định phạm vi, giá trị tăng/giảm và ảnh hưởng tiến độ; không thanh toán trùng chi phí đã bao gồm trong giá Hợp đồng. Bên B tự chịu chi phí bù tiến độ do lỗi mình. Yêu cầu đẩy nhanh vượt tiến độ cam kết không do lỗi Bên B chỉ phát sinh chi phí khi có thỏa thuận được phê duyệt trước, trừ trường hợp bắt buộc theo pháp luật. Trong tình huống nguy hiểm khẩn cấp, Bên B phải thực hiện ngay biện pháp tối thiểu cần thiết để bảo vệ người, tài sản; thông báo ngay bằng phương tiện nhanh nhất cho đầu mối Bên A và xác nhận bằng văn bản trong (24) giờ kể từ khi có thể thông báo; lập ảnh, nhật ký, khối lượng và chứng từ chi phí. Bên B không được lợi dụng tình huống khẩn cấp để mở rộng phạm vi không cần thiết. Chi phí do lỗi, vi phạm hoặc biện pháp thi công không phù hợp của Bên B do Bên B chịu. Các chi phí còn lại chỉ được xem xét theo trách nhiệm từng Bên, tính cần thiết, mức giá hợp lý, chứng cứ và nghĩa vụ giảm thiểu; Bên A được kiểm tra, đối chiếu trước thanh toán. Không có VO trước xử lý không phải căn cứ duy nhất từ chối chi phí khẩn cấp hợp lệ, nhưng không tạo quyền mặc nhiên yêu cầu KSP thanh toán toàn bộ chi phí.<span class=\"th\" data-t=\"20.3. VO กำหนดขอบเขต มูลค่าที่เพิ่ม/ลด และผลกระทบต่อกำหนดการ ห้ามชำระซ้ำซ้อนสำหรับค่าใช้จ่ายที่รวมอยู่ในราคาสัญญาแล้ว ฝ่าย B รับผิดชอบค่าใช้จ่ายในการเร่งรัดกำหนดการที่เกิดจากความผิดของตนเอง คำขอให้เร่งรัดเกินกว่ากำหนดการที่ผูกพันไว้ซึ่งมิได้เกิดจากความผิดของฝ่าย B จะก่อให้เกิดค่าใช้จ่ายก็ต่อเมื่อมีข้อตกลงที่ได้รับอนุมัติล่วงหน้า เว้นแต่เป็นกรณีที่กฎหมายบังคับ ในสถานการณ์อันตรายเร่งด่วน ฝ่าย B ต้องดำเนินมาตรการขั้นต่ำที่จำเป็นทันทีเพื่อคุ้มครองบุคคลและทรัพย์สิน แจ้งผู้ประสานงานของฝ่าย A ทันทีด้วยช่องทางที่รวดเร็วที่สุด และยืนยันเป็นหนังสือภายใน (24) ชั่วโมงนับแต่เมื่อสามารถแจ้งได้ จัดทำภาพถ่าย บันทึกประจำวัน ปริมาณงาน และเอกสารหลักฐานค่าใช้จ่าย ฝ่าย B ต้องไม่ฉวยโอกาสจากสถานการณ์ฉุกเฉินเพื่อขยายขอบเขตงานโดยไม่จำเป็น ค่าใช้จ่ายที่เกิดจากความผิด การละเมิด หรือวิธีการก่อสร้างที่ไม่เหมาะสมของฝ่าย B ให้ฝ่าย B เป็นผู้รับผิดชอบ ค่าใช้จ่ายส่วนที่เหลือจะได้รับการพิจารณาตามความรับผิดชอบของแต่ละฝ่าย ความจำเป็น ระดับราคาที่สมเหตุสมผล หลักฐาน และหน้าที่บรรเทาความเสียหายเท่านั้น ฝ่าย A มีสิทธิตรวจสอบและเทียบยอดก่อนการชำระเงิน การไม่มี VO ล่วงหน้าก่อนการจัดการไม่ใช่เหตุผลเดียวที่จะปฏิเสธค่าใช้จ่ายฉุกเฉินที่ชอบ แต่ไม่ก่อให้เกิดสิทธิโดยปริยายที่จะเรียกให้ KSP ชำระค่าใช้จ่ายทั้งหมด\"></span></p><h3 class=\"art\" data-n=\"21\">ĐIỀU 21. BẢO LÃNH THỰC HIỆN, BẢO HIỂM VÀ TÀI SẢN<span class=\"th\" data-t=\"ข้อ 21 หนังสือค้ำประกันการปฏิบัติตามสัญญา การประกันภัย และทรัพย์สิน\"></span></h3><p>21.1. Bên B phải nộp bảo lãnh thực hiện hợp đồng trị giá (05)% giá Hợp đồng trước VAT trong (07) ngày làm việc từ ngày Hợp đồng có hiệu lực và trước khi nhận tạm ứng hoặc huy động thi công, tùy mốc nào đến trước. Bảo lãnh không hủy ngang do ngân hàng được Bên A chấp thuận phát hành; mẫu bảo lãnh phải quy định rõ nghĩa vụ được bảo đảm, hồ sơ yêu cầu thanh toán, thời hạn và phương thức gửi yêu cầu. Không đặt điều kiện phải có bản án/quyết định trọng tài hoặc sự chấp thuận của Bên B mới được yêu cầu thanh toán đối với nghĩa vụ đã được bảo lãnh. Hiệu lực kéo dài đến khi hoàn tất nghiệm thu, bàn giao, khắc phục tồn đọng và nộp bảo đảm bảo hành hợp lệ, cộng (30) ngày dự phòng; ghi ngày hết hạn cụ thể và gia hạn theo khoản 21.5 khi cần. Bảo lãnh này độc lập với bảo lãnh tạm ứng và bảo đảm bảo hành. Mọi ngoại lệ chỉ có hiệu lực khi ghi rõ tại Phụ lục 06 được hai Bên ký, phù hợp pháp luật.<span class=\"th\" data-t=\"21.1. ฝ่าย B ต้องวางหนังสือค้ำประกันการปฏิบัติตามสัญญามูลค่า (05)% ของราคาสัญญาก่อนภาษีมูลค่าเพิ่ม (VAT) ภายใน (07) วันทำการนับจากวันที่สัญญามีผลบังคับ และก่อนการรับเงินล่วงหน้าหรือการระดมกำลังเข้าก่อสร้าง แล้วแต่กรณีใดจะถึงก่อน หนังสือค้ำประกันต้องเป็นแบบเพิกถอนไม่ได้ ออกโดยธนาคารที่ฝ่าย A ยอมรับ แบบหนังสือค้ำประกันต้องระบุชัดเจนถึงภาระหน้าที่ที่ค้ำประกัน เอกสารประกอบการเรียกให้ชำระเงิน ระยะเวลา และวิธีการส่งคำเรียกร้อง ห้ามกำหนดเงื่อนไขให้ต้องมีคำพิพากษา/คำชี้ขาดของอนุญาโตตุลาการ หรือความยินยอมของฝ่าย B จึงจะเรียกให้ชำระเงินได้ สำหรับภาระหน้าที่ที่ได้รับการค้ำประกันแล้ว ให้มีผลต่อเนื่องจนกว่าการตรวจรับ การส่งมอบ การแก้ไขรายการค้างแก้ และการวางหลักประกันการรับประกันผลงานที่ถูกต้องจะแล้วเสร็จ บวกระยะเวลาสำรองอีก (30) วัน ระบุวันหมดอายุที่ชัดเจนและต่ออายุตามข้อย่อย 21.5 เมื่อจำเป็น หนังสือค้ำประกันนี้เป็นอิสระจากหนังสือค้ำประกันเงินล่วงหน้าและหลักประกันการรับประกันผลงาน ข้อยกเว้นใด ๆ จะมีผลก็ต่อเมื่อระบุชัดเจนในภาคผนวก 06 ที่คู่สัญญาทั้งสองฝ่ายลงนาม และสอดคล้องกับกฎหมาย\"></span></p><p>21.2. Bên B phải duy trì bảo hiểm bắt buộc theo pháp luật và các loại bổ sung được chọn: <span class=\"fx\" data-k=\"BẢO HIỂM CÔNG TRÌNH / LẮP ĐẶT, TRÁCH NHIỆM BÊN THỨ BA, NGƯỜI LAO ĐỘNG, THIẾT BỊ\"></span>, hạn mức <span class=\"fx\" data-k=\"SỐ TIỀN\"></span>, đến ngày <span class=\"fx\" data-k=\"NGÀY\"></span>. Xuất trình chứng từ hợp lệ trước khi bắt đầu công việc; mỗi bên chịu trách nhiệm trong phạm vi lỗi và nghĩa vụ pháp luật của mình<span class=\"th\" data-t=\"21.2. ฝ่าย B ต้องรักษาการประกันภัยภาคบังคับตามกฎหมายและประกันภัยเพิ่มเติมประเภทที่เลือก: 【BẢO HIỂM CÔNG TRÌNH / LẮP ĐẶT, TRÁCH NHIỆM BÊN THỨ BA, NGƯỜI LAO ĐỘNG, THIẾT BỊ】 วงเงินความคุ้มครอง 【SỐ TIỀN】 ถึงวันที่ 【NGÀY】 ต้องแสดงเอกสารหลักฐานที่ถูกต้องก่อนเริ่มงาน แต่ละฝ่ายรับผิดชอบภายในขอบเขตความผิดและหน้าที่ตามกฎหมายของตน\"></span></p><p>21.3. Vật tư KSP cấp phải được giao nhận bằng biên bản về số lượng, tình trạng và giá trị đối chiếu. Định mức hao hụt, trách nhiệm bảo quản, kiểm kê, hoàn trả vật tư dư và quyền sở hữu phế liệu được thực hiện theo Phụ lục 01. Bên B không tự ý bán, chuyển giao hoặc sử dụng ngoài dự án; mất mát, hư hỏng do lỗi Bên B được bồi hoàn theo giá trị thiệt hại thực tế.<br/>21.4. Vật tư/thiết bị do Bên B cung cấp: thời điểm chuyển quyền sở hữu, chuyển rủi ro và điều kiện bảo quản được ghi tại Phụ lục 01. Với vật tư cụ thể đã được KSP thanh toán, hai Bên xác nhận quyền sở hữu tương ứng bằng danh mục/biên bản, nhận diện riêng tại xưởng/kho và cam kết không cầm cố, bán hoặc định đoạt trái quyền KSP. Quyền sở hữu chuyển giao không tự động chấm dứt trách nhiệm bảo quản của Bên B trước bàn giao theo thỏa thuận. Khoản tạm ứng đơn thuần không tự động xác lập quyền sở hữu đối với vật tư chưa xác định.<br/>21.5. Bên B nộp gia hạn/thay thế bảo lãnh trước ngày hết hiệu lực ít nhất (15) ngày khi nghĩa vụ được bảo đảm còn tồn tại. Nếu không thực hiện, Bên A được yêu cầu khắc phục và sử dụng quyền yêu cầu thanh toán trong thời hạn, phạm vi, chứng từ và điều kiện của thư bảo lãnh; không tự động coi toàn bộ giá trị bảo lãnh là khoản phạt. Bên mua bảo hiểm, đối tượng được bảo hiểm, hạn mức, mức miễn thường, thời gian bảo hiểm và thủ tục xử lý tổn thất được xác định tại Phụ lục 06 và hợp đồng bảo hiểm tương ứng. Mỗi Bên thực hiện nghĩa vụ mua bảo hiểm bắt buộc thuộc trách nhiệm của mình theo pháp luật.<span class=\"th\" data-t=\"21.3. วัสดุที่ KSP จัดหาให้ต้องมีการส่งมอบและรับมอบด้วยรายงานระบุจำนวน สภาพ และมูลค่าเพื่อเทียบยอด อัตราสูญเสียที่ยอมรับได้ ความรับผิดชอบในการเก็บรักษา การตรวจนับ การคืนวัสดุคงเหลือ และกรรมสิทธิ์ในเศษวัสดุ ให้เป็นไปตามภาคผนวก 01 ฝ่าย B ต้องไม่ขาย โอน หรือนำไปใช้นอกโครงการตามอำเภอใจ การสูญหายหรือเสียหายที่เกิดจากความผิดของฝ่าย B ให้ชดใช้ตามมูลค่าความเสียหายที่เกิดขึ้นจริง 21.4. วัสดุ/อุปกรณ์ที่ฝ่าย B เป็นผู้จัดหา: เวลาโอนกรรมสิทธิ์ การโอนความเสี่ยง และเงื่อนไขการเก็บรักษา ให้ระบุไว้ในภาคผนวก 01 สำหรับวัสดุเฉพาะรายการที่ KSP ชำระเงินแล้ว คู่สัญญาทั้งสองฝ่ายยืนยันกรรมสิทธิ์ที่สอดคล้องกันโดยรายการ/รายงาน ระบุแยกต่างหากที่โรงงาน/คลังสินค้า และให้คำมั่นว่าจะไม่จำนำ ขาย หรือจำหน่ายจ่ายโอนโดยขัดต่อสิทธิของ KSP การโอนกรรมสิทธิ์ไม่ทำให้ความรับผิดชอบในการเก็บรักษาของฝ่าย B ก่อนการส่งมอบตามข้อตกลงสิ้นสุดลงโดยอัตโนมัติ เงินล่วงหน้าเพียงอย่างเดียวไม่ก่อให้เกิดกรรมสิทธิ์โดยอัตโนมัติในวัสดุที่ยังไม่ได้ระบุเฉพาะเจาะจง 21.5. ฝ่าย B ส่งหนังสือค้ำประกันฉบับต่ออายุ/ฉบับทดแทนก่อนวันสิ้นผลอย่างน้อย (15) วัน เมื่อภาระหน้าที่ที่ค้ำประกันยังคงมีอยู่ หากไม่ปฏิบัติ ฝ่าย A มีสิทธิเรียกให้แก้ไข และใช้สิทธิเรียกให้ชำระเงินภายในระยะเวลา ขอบเขต เอกสาร และเงื่อนไขของหนังสือค้ำประกัน ไม่ถือโดยอัตโนมัติว่ามูลค่าทั้งหมดของหนังสือค้ำประกันเป็นค่าปรับ ผู้ซื้อประกันภัย ผู้เอาประกันภัย วงเงินความคุ้มครอง ค่าเสียหายส่วนแรก ระยะเวลาประกันภัย และขั้นตอนการจัดการความสูญเสีย ให้กำหนดไว้ในภาคผนวก 06 และกรมธรรม์ประกันภัยที่เกี่ยวข้อง แต่ละฝ่ายปฏิบัติตามหน้าที่ในการซื้อประกันภัยภาคบังคับที่อยู่ในความรับผิดชอบของตนตามกฎหมาย\"></span></p><h3 class=\"art\" data-n=\"22\">ĐIỀU 22. NGUYÊN TẮC BACK-TO-BACK VỚI HỢP ĐỒNG CHỦ ĐẦU TƯ<span class=\"th\" data-t=\"ข้อ 22 หลักการ Back-to-Back กับสัญญาของเจ้าของโครงการ\"></span></h3><p>22.1. Hợp đồng giữa Bên A và Bên B độc lập với hợp đồng giữa KSP và Chủ đầu tư.<span class=\"th\" data-t=\"22.1. สัญญาระหว่างฝ่าย A และฝ่าย B เป็นอิสระจากสัญญาระหว่าง KSP และเจ้าของโครงการ\"></span></p><p>Các yêu cầu của chủ đầu tư áp dụng cho phần việc Bên B được liệt kê rõ tại Phụ lục 04, kèm điều khoản tham chiếu, phiên bản và tài liệu được cung cấp cho Bên B. Phụ lục 04 phải được hai Bên hoàn thiện và ký cùng Hợp đồng khi có nghĩa vụ chuyển giao; nếu không áp dụng, phải ghi rõ lý do và phạm vi không áp dụng. Nghĩa vụ chuyển giao bao gồm tiến độ có thời gian dự phòng cho KSP, tiêu chí chất lượng/chạy thử, hồ sơ, nghiệm thu, HSE, bảo hành và trách nhiệm tương ứng do lỗi Bên B. Việc chuyển giao không miễn trừ nghĩa vụ đã quy định trực tiếp trong Hợp đồng và không tự động chuyển toàn bộ rủi ro của KSP sang Bên B. Không loại trừ hoặc hạn chế trách nhiệm của Bên B đối với phần công việc và nghĩa vụ đã nhận theo Hợp đồng. Trường hợp Bên B vi phạm nghĩa vụ làm phát sinh chi phí hoặc thiệt hại cho Bên A, Bên B phải chịu trách nhiệm đối với các chi phí hợp lý, thiệt hại thực tế, trực tiếp có đầy đủ căn cứ chứng minh và có quan hệ nhân quả với hành vi vi phạm của Bên B, theo Hợp đồng và pháp luật áp dụng.<span class=\"th\" data-t=\"ข้อกำหนดของเจ้าของโครงการที่ใช้บังคับกับงานส่วนของฝ่าย B ให้ระบุไว้อย่างชัดเจนในภาคผนวก 04 พร้อมข้อกำหนดอ้างอิง ฉบับ และเอกสารที่ส่งมอบให้ฝ่าย B ภาคผนวก 04 ต้องได้รับการจัดทำให้สมบูรณ์และลงนามโดยคู่สัญญาทั้งสองฝ่ายพร้อมกับสัญญา เมื่อมีภาระหน้าที่ที่ส่งต่อ หากไม่ใช้บังคับ ต้องระบุเหตุผลและขอบเขตที่ไม่ใช้บังคับอย่างชัดเจน ภาระหน้าที่ที่ส่งต่อรวมถึงกำหนดการที่มีระยะเวลาสำรองให้ KSP เกณฑ์คุณภาพ/การทดสอบเดินเครื่อง เอกสาร การตรวจรับ HSE การรับประกันผลงาน และความรับผิดที่สอดคล้องกันอันเกิดจากความผิดของฝ่าย B การส่งต่อไม่เป็นการยกเว้นภาระหน้าที่ที่กำหนดโดยตรงในสัญญา และไม่ถ่ายโอนความเสี่ยงทั้งหมดของ KSP มายังฝ่าย B โดยอัตโนมัติ ไม่มีการยกเว้นหรือจำกัดความรับผิดของฝ่าย B ต่องานและภาระหน้าที่ที่ได้รับตามสัญญา ในกรณีที่ฝ่าย B ละเมิดภาระหน้าที่จนก่อให้เกิดค่าใช้จ่ายหรือความเสียหายแก่ฝ่าย A ฝ่าย B ต้องรับผิดต่อค่าใช้จ่ายที่สมเหตุสมผล ความเสียหายที่เกิดขึ้นจริงโดยตรงซึ่งมีหลักฐานพิสูจน์อย่างครบถ้วนและมีความสัมพันธ์เชิงเหตุและผลกับการละเมิดของฝ่าย B ตามสัญญาและกฎหมายที่ใช้บังคับ\"></span></p><p>Các mốc tiến độ, thời gian dự phòng, yêu cầu kỹ thuật, hồ sơ, nghiệm thu và bảo hành chuyển giao cho Bên B phải được hai bên xác định cụ thể bằng văn bản khi ký Hợp đồng. Trường hợp có nội dung mâu thuẫn giữa các tài liệu, hai bên phải làm rõ và thống nhất bằng văn bản trước khi thực hiện phần công việc liên quan.<span class=\"th\" data-t=\"หลักเกณฑ์กำหนดการ ระยะเวลาสำรอง ข้อกำหนดทางเทคนิค เอกสาร การตรวจรับ และการรับประกันผลงานที่ส่งต่อให้ฝ่าย B ต้องได้รับการกำหนดอย่างเฉพาะเจาะจงเป็นหนังสือโดยคู่สัญญาทั้งสองฝ่ายเมื่อลงนามสัญญา ในกรณีที่เนื้อหาในเอกสารต่าง ๆ ขัดแย้งกัน คู่สัญญาทั้งสองฝ่ายต้องทำให้ชัดเจนและตกลงเป็นหนังสือก่อนดำเนินงานส่วนที่เกี่ยวข้อง\"></span></p><p>22.2. Nếu Bên A bị Chủ đầu tư phạt hoặc yêu cầu bồi thường do hành vi của Bên B, KSP phải chứng minh hành vi vi phạm tương ứng, mối liên hệ nhân quả, căn cứ nghĩa vụ đã được chuyển giao, số tiền có căn cứ và nghĩa vụ giảm thiểu; các khoản được xem xét theo Điều 9 và 15, không đòi bồi thường trùng với khoản đã thu hồi.<span class=\"th\" data-t=\"22.2. หากฝ่าย A ถูกเจ้าของโครงการปรับหรือเรียกร้องการชดใช้ค่าเสียหายอันเนื่องจากการกระทำของฝ่าย B KSP ต้องพิสูจน์การละเมิดที่สอดคล้องกัน ความสัมพันธ์เชิงเหตุและผล หลักแห่งภาระหน้าที่ที่ได้ส่งต่อ จำนวนเงินที่มีหลักฐาน และหน้าที่บรรเทาความเสียหาย รายการเหล่านี้จะได้รับการพิจารณาตามข้อ 9 และ 15 ห้ามเรียกร้องการชดใช้ซ้ำกับจำนวนที่ได้เรียกคืนแล้ว\"></span></p><p>22.3. Bên B phải phối hợp cung cấp hồ sơ, chứng cứ và thực hiện các biện pháp khắc phục để Bên A giải quyết yêu cầu của chủ đầu tư liên quan đến công việc của Bên B. Thay đổi yêu cầu của chủ đầu tư sau khi ký hợp đồng phải được Bên A thông báo kịp thời và xử lý theo Điều 20; phần công việc thuộc nghĩa vụ và cam kết của Bên B không được coi là phát sinh chỉ vì có yêu cầu nhắc lại.<span class=\"th\" data-t=\"22.3. ฝ่าย B ต้องให้ความร่วมมือในการจัดหาเอกสาร หลักฐาน และดำเนินมาตรการแก้ไข เพื่อให้ฝ่าย A ระงับคำเรียกร้องของเจ้าของโครงการที่เกี่ยวข้องกับงานของฝ่าย B ฝ่าย A ต้องแจ้งการเปลี่ยนแปลงข้อกำหนดของเจ้าของโครงการภายหลังลงนามสัญญาอย่างทันท่วงทีและดำเนินการตามข้อ 20 งานส่วนที่อยู่ในภาระหน้าที่และคำมั่นของฝ่าย B ไม่ถือเป็นงานเกิดเพิ่มเพียงเพราะมีการเรียกร้องย้ำอีกครั้ง\"></span></p><p>Thay đổi thực sự ngoài phạm vi hợp đồng chỉ ràng buộc Bên B sau khi được người có thẩm quyền của Bên A chấp thuận bằng văn bản về phạm vi công việc, chi phí và tiến độ, hoặc thuộc trường hợp khẩn cấp bắt buộc theo Hợp đồng và pháp luật.<span class=\"th\" data-t=\"การเปลี่ยนแปลงที่อยู่นอกขอบเขตสัญญาโดยแท้จริงจะผูกพันฝ่าย B ก็ต่อเมื่อผู้มีอำนาจของฝ่าย A ให้ความเห็นชอบเป็นหนังสือเกี่ยวกับขอบเขตงาน ค่าใช้จ่าย และกำหนดการ หรือเป็นกรณีฉุกเฉินที่สัญญาและกฎหมายบังคับ\"></span></p><p>Không tự động chuyển cho Bên B các khoản phạt hoặc thiệt hại không do lỗi hoặc hành vi vi phạm Hợp đồng của Bên B gây ra. Bên B vẫn phải chịu các chi phí khắc phục và bồi thường thiệt hại thực tế, trực tiếp phát sinh do lỗi hoặc hành vi vi phạm Hợp đồng của mình, tương ứng với mức độ trách nhiệm của Bên B. Việc phối hợp xử lý yêu cầu của chủ đầu tư không miễn trừ trách nhiệm này của Bên B.<span class=\"th\" data-t=\"ไม่โอนค่าปรับหรือความเสียหายที่ไม่ได้เกิดจากความผิดหรือการกระทำที่ฝ่าฝืนสัญญาของฝ่าย B ไปยังฝ่าย B โดยอัตโนมัติ ฝ่าย B ยังคงต้องรับผิดชอบค่าใช้จ่ายในการแก้ไขและการชดใช้ค่าเสียหายที่เกิดขึ้นจริงและโดยตรงจากความผิดหรือการกระทำที่ฝ่าฝืนสัญญาของตน ตามสัดส่วนของระดับความรับผิดของฝ่าย B การประสานงานเพื่อดำเนินการตามข้อเรียกร้องของเจ้าของโครงการไม่ทำให้ฝ่าย B หลุดพ้นจากความรับผิดนี้\"></span></p><h3 class=\"art\" data-n=\"23\">ĐIỀU 23. BẢO MẬT, LIÊM CHÍNH, THÔNG BÁO VÀ HIỆU LỰC TỪNG PHẦN<span class=\"th\" data-t=\"ข้อ 23 การรักษาความลับ ความซื่อสัตย์สุจริต การแจ้งความ และผลบังคับเป็นส่วน ๆ\"></span></h3><p>23.1. Các Bên giữ bí mật bản vẽ, giá, công nghệ, thông tin khách hàng và tài liệu hợp đồng; không tiết lộ cho bên thứ ba ngoài phạm vi cần thiết để thực hiện công việc hoặc theo pháp luật. Bên B và nhà thầu phụ tuân thủ quy định chống hối lộ, lợi ích xung đột, lao động và bảo vệ dữ liệu theo pháp luật Việt Nam.<span class=\"th\" data-t=\"23.1 คู่สัญญาต้องรักษาความลับของแบบแปลน ราคา เทคโนโลยี ข้อมูลลูกค้า และเอกสารสัญญา และต้องไม่เปิดเผยแก่บุคคลที่สามนอกเหนือขอบเขตที่จำเป็นต่อการปฏิบัติงานหรือตามที่กฎหมายกำหนด ฝ่าย B และผู้รับเหมาช่วงต้องปฏิบัติตามข้อกำหนดว่าด้วยการต่อต้านการให้สินบน ผลประโยชน์ทับซ้อน แรงงาน และการคุ้มครองข้อมูลตามกฎหมายเวียดนาม\"></span></p><p>23.2. Việc một điều khoản không có hiệu lực không làm vô hiệu các phần còn lại nếu pháp luật cho phép. Các thông báo chính thức phải theo Điều 18; số lượng bản, hiệu lực hợp đồng và người ký theo Điều 19.<span class=\"th\" data-t=\"23.2 การที่ข้อกำหนดใดไม่มีผลบังคับไม่ทำให้ส่วนที่เหลือเสียไป หากกฎหมายอนุญาต การแจ้งอย่างเป็นทางการต้องเป็นไปตามข้อ 18 จำนวนฉบับ ผลบังคับของสัญญา และผู้ลงนามเป็นไปตามข้อ 19\"></span></p><p>23.3. Bên B cấp cho KSP quyền sử dụng và cho phép chủ đầu tư, đơn vị vận hành, bảo trì hoặc nhà thầu thay thế sử dụng hồ sơ do Bên B lập để vận hành, bảo trì, sửa chữa và hoàn thành phần việc của dự án. Chi phí quyền sử dụng này đã bao gồm trong giá Hợp đồng. Bên B bảo đảm có quyền cấp phép đối với hồ sơ do mình cung cấp và chịu trách nhiệm về vi phạm quyền sở hữu trí tuệ do mình gây ra. Các giới hạn sử dụng tài liệu của bên thứ ba chỉ áp dụng khi đã được kê khai và hai Bên chấp thuận tại Phụ lục 01.<br/><span class=\"th\" data-t=\"23.3 ฝ่าย B ให้สิทธิการใช้แก่ KSP และอนุญาตให้เจ้าของโครงการ ผู้ดำเนินการ ผู้บำรุงรักษา หรือผู้รับเหมารายใหม่ ใช้เอกสารที่ฝ่าย B จัดทำขึ้น เพื่อการดำเนินงาน บำรุงรักษา ซ่อมแซม และทำงานส่วนที่เหลือของโครงการให้แล้วเสร็จ ค่าตอบแทนสำหรับสิทธิการใช้นี้รวมอยู่ในราคาสัญญาแล้ว ฝ่าย B รับรองว่ามีสิทธิอนุญาตให้ใช้เอกสารที่ตนจัดส่ง และรับผิดชอบต่อการละเมิดทรัพย์สินทางปัญญาที่ตนก่อขึ้น ข้อจำกัดการใช้เอกสารของบุคคลที่สามให้ใช้บังคับเฉพาะเมื่อได้แจ้งรายการและคู่สัญญาทั้งสองฝ่ายยอมรับไว้ในภาคผนวก 01\"></span></p><div class=\"tw2\"><table class=\"ct\"><tr><th><strong>ĐẠI DIỆN BÊN B</strong><span class=\"th\" data-t=\"ผู้แทนฝ่าย B\"></span></th><th><strong>ĐẠI DIỆN BÊN A</strong><span class=\"th\" data-t=\"ผู้แทนฝ่าย A\"></span></th></tr></table></div><h3 class=\"ann\" data-n=\"01\">PHỤ LỤC 01 – PHẠM VI, BOQ, BẢN VẼ VÀ YÊU CẦU KỸ THUẬT (ĐIỀN CHO TỪNG DỰ ÁN)<span class=\"th\" data-t=\"ภาคผนวก 01 – ขอบเขตงาน BOQ แบบแปลน และข้อกำหนดทางเทคนิค (กรอกสำหรับแต่ละโครงการ)\"></span></h3><p>Tên dự án: <strong><span class=\"fx\" data-k=\"DỰ ÁN\"></span></strong> – Gói thầu: <strong><span class=\"fx\" data-k=\"HẠNG MỤC\"></span></strong> – Tài liệu kỹ thuật tham chiếu: <strong><span class=\"fx\" data-k=\"MÃ BẢN VẼ / NGÀY / PHIÊN BẢN\"></span></strong> – Nội dung loại trừ: <strong><span class=\"fx\" data-k=\"CÁC PHẦN KHÔNG BAO GỒM\"></span></strong>.<span class=\"th\" data-t=\"ชื่อโครงการ: 【DỰ ÁN】 – แพ็คเกจงาน: 【HẠNG MỤC】 – เอกสารทางเทคนิคอ้างอิง: 【MÃ BẢN VẼ / NGÀY / PHIÊN BẢN】 – เนื้อหาที่ไม่รวม: 【CÁC PHẦN KHÔNG BAO GỒM】\"></span></p><div class=\"tw2\"><table class=\"ct\"><tr><th><strong>STT</strong><span class=\"th\" data-t=\"ลำดับ\"></span></th><th><strong>Nội dung công việc / vật tư / thiết bị</strong><span class=\"th\" data-t=\"รายการงาน / วัสดุ / อุปกรณ์\"></span></th><th><strong>ĐVT</strong><span class=\"th\" data-t=\"หน่วย\"></span></th><th><strong>Khối lượng</strong><span class=\"th\" data-t=\"ปริมาณ\"></span></th><th><strong>Đơn giá trước VAT</strong><span class=\"th\" data-t=\"ราคาต่อหน่วยก่อนภาษีมูลค่าเพิ่ม (VAT)\"></span></th><th><strong>Thành tiền</strong><span class=\"th\" data-t=\"จำนวนเงิน\"></span></th><th><strong>Yêu cầu kỹ thuật</strong><span class=\"th\" data-t=\"ข้อกำหนดทางเทคนิค\"></span></th></tr><tr><td>1</td><td><span class=\"fx\" data-k=\"NỘI DUNG\"></span></td><td><span class=\"fx\" data-k=\"ĐVT\"></span></td><td><span class=\"fx\" data-k=\"SL\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"BẢN VẼ / QC\"></span></td></tr><tr><td>2</td><td><span class=\"fx\" data-k=\"NỘI DUNG\"></span></td><td><span class=\"fx\" data-k=\"ĐVT\"></span></td><td><span class=\"fx\" data-k=\"SL\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"BẢN VẼ / QC\"></span></td></tr><tr><td>3</td><td><span class=\"fx\" data-k=\"NỘI DUNG\"></span></td><td><span class=\"fx\" data-k=\"ĐVT\"></span></td><td><span class=\"fx\" data-k=\"SL\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"BẢN VẼ / QC\"></span></td></tr><tr><td>4</td><td><span class=\"fx\" data-k=\"NỘI DUNG\"></span></td><td><span class=\"fx\" data-k=\"ĐVT\"></span></td><td><span class=\"fx\" data-k=\"SL\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"BẢN VẼ / QC\"></span></td></tr><tr><td>5</td><td><span class=\"fx\" data-k=\"NỘI DUNG\"></span></td><td><span class=\"fx\" data-k=\"ĐVT\"></span></td><td><span class=\"fx\" data-k=\"SL\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"BẢN VẼ / QC\"></span></td></tr><tr><td>6</td><td><span class=\"fx\" data-k=\"NỘI DUNG\"></span></td><td><span class=\"fx\" data-k=\"ĐVT\"></span></td><td><span class=\"fx\" data-k=\"SL\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"BẢN VẼ / QC\"></span></td></tr><tr><td>7</td><td><span class=\"fx\" data-k=\"NỘI DUNG\"></span></td><td><span class=\"fx\" data-k=\"ĐVT\"></span></td><td><span class=\"fx\" data-k=\"SL\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"BẢN VẼ / QC\"></span></td></tr><tr><td>8</td><td><span class=\"fx\" data-k=\"NỘI DUNG\"></span></td><td><span class=\"fx\" data-k=\"ĐVT\"></span></td><td><span class=\"fx\" data-k=\"SL\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"BẢN VẼ / QC\"></span></td></tr></table></div><p>Tổng giá trị trước VAT: <strong><span class=\"fx\" data-k=\"VND\"></span></strong> | Thuế GTGT theo luật: <strong><span class=\"fx\" data-k=\"% / VND\"></span></strong> | Tổng gồm VAT: <strong><span class=\"fx\" data-k=\"VND\"></span></strong>. Kèm chữ ký và xác nhận của hai Bên.<span class=\"th\" data-t=\"มูลค่ารวมก่อนภาษีมูลค่าเพิ่ม (VAT): 【VND】 | ภาษีมูลค่าเพิ่มตามกฎหมาย: 【% / VND】 | มูลค่ารวมภาษีมูลค่าเพิ่ม (VAT): 【VND】 พร้อมลายมือชื่อและการยืนยันของคู่สัญญาทั้งสองฝ่าย\"></span></p><h3 class=\"ann\" data-n=\"02\">PHỤ LỤC 02 – QUY ĐỊNH HSE VÀ AN TOÀN CÔNG TRƯỜNG<span class=\"th\" data-t=\"ภาคผนวก 02 – ข้อกำหนด HSE และความปลอดภัยในสถานที่ก่อสร้าง\"></span></h3><p>Công việc nguy hiểm, thiết bị nâng, làm việc trên cao, PCCC, vệ sinh môi trường, nội quy ra vào nhà máy và tài liệu bắt buộc: <strong><span class=\"fx\" data-k=\"DANH MỤC HSE / QUY CHUẨN / PHIÊN BẢN\"></span></strong>. Trình tự: ghi nhận vi phạm bằng biên bản → yêu cầu khắc phục / dừng công việc nguy hiểm → nghiệm thu khắc phục → xử lý phạt theo Điều 9 nếu đủ cơ sở và trong trần pháp luật.<span class=\"th\" data-t=\"งานอันตราย อุปกรณ์ยก งานบนที่สูง การป้องกันและดับเพลิง สุขอนามัยสิ่งแวดล้อม ระเบียบการเข้าออกโรงงาน และเอกสารที่ต้องมี: 【DANH MỤC HSE / QUY CHUẨN / PHIÊN BẢN】 ลำดับขั้นตอน: บันทึกการฝ่าฝืนด้วยรายงาน → เรียกร้องให้แก้ไข / หยุดงานอันตราย → ตรวจรับการแก้ไข → ดำเนินการปรับตามข้อ 9 หากมีหลักฐานเพียงพอและอยู่ภายในเพดานตามกฎหมาย\"></span></p><div class=\"tw2\"><table class=\"ct\"><tr><th><strong>Rủi ro</strong><span class=\"th\" data-t=\"ความเสี่ยง\"></span></th><th><strong>Yêu cầu / Chứng từ</strong><span class=\"th\" data-t=\"ข้อกำหนด / เอกสารหลักฐาน\"></span></th><th><strong>Thời hạn / người phụ trách</strong><span class=\"th\" data-t=\"กำหนดเวลา / ผู้รับผิดชอบ\"></span></th></tr><tr><td>Nhân sự / chứng chỉ<span class=\"th\" data-t=\"บุคลากร / ใบรับรอง\"></span></td><td><span class=\"fx\" data-k=\"DANH SÁCH / GIẤY PHÉP\"></span></td><td><span class=\"fx\" data-k=\"ĐẦU MỐI / NGÀY\"></span></td></tr><tr><td>Thiết bị nâng / điện / trên cao<span class=\"th\" data-t=\"อุปกรณ์ยก / ไฟฟ้า / งานบนที่สูง\"></span></td><td><span class=\"fx\" data-k=\"KIỂM ĐỊNH / BIỆN PHÁP\"></span></td><td><span class=\"fx\" data-k=\"ĐẦU MỐI / NGÀY\"></span></ a-t=\"การเลิก / การหยุดโครงการชั่วคราว\"></span></td><td><span class=\"fx\" data-k=\"ĐIỀU / TRANG / NGÀY\"></span></td><td><span class=\"fx\" data-k=\"NGHĨA VỤ CỤ THỂ / GIỚI HẠN ÁP DỤNG\"></span></td><td><span class=\"fx\" data-k=\"BÊN KÝ / NGÀY\"></span></td></tr></table></div><h3 class=\"ann\" data-n=\"05\">PHỤ LỤC 05 – PHIẾU YÊU CẦU THAY ĐỔI / VARIATION ORDER<span class=\"th\" data-t=\"ภาคผนวก 05 – ใบขอเปลี่ยนแปลง / Variation Order\"></span></h3><p>Số VO: <strong><span class=\"fx\" data-k=\"SỐ VO\"></span></strong> – Ngày: <strong><span class=\"fx\" data-k=\"NGÀY\"></span></strong> – Dự án: <strong><span class=\"fx\" data-k=\"DỰ ÁN\"></span></strong><span class=\"th\" data-t=\"เลขที่ VO: 【SỐ VO】 – วันที่: 【NGÀY】 – โครงการ: 【DỰ ÁN】\"></span></p><p>Yêu cầu gốc / lý do: <strong><span class=\"fx\" data-k=\"MÃ YÊU CẦU CỦA CHỦ ĐẦU TƯ / NỘI DUNG\"></span></strong><span class=\"th\" data-t=\"ข้อเรียกร้องเดิม / เหตุผล: 【MÃ YÊU CẦU CỦA CHỦ ĐẦU TƯ / NỘI DUNG】\"></span></p><p>Phạm vi hiện tại: <strong><span class=\"fx\" data-k=\"CÔNG VIỆC CŨ\"></span></strong>; Phạm vi mới: <strong><span class=\"fx\" data-k=\"CÔNG VIỆC MỚI\"></span></strong><span class=\"th\" data-t=\"ขอบเขตปัจจุบัน: 【CÔNG VIỆC CŨ】; ขอบเขตใหม่: 【CÔNG VIỆC MỚI】\"></span></p><p>Đơn giá / Giá trị tăng (giảm) trước VAT: <strong><span class=\"fx\" data-k=\"VND\"></span></strong>; Ảnh hưởng tiến độ: <strong><span class=\"fx\" data-k=\"NGÀY\"></span></strong><span class=\"th\" data-t=\"ราคาต่อหน่วย / มูลค่าที่เพิ่ม (ลด) ก่อนภาษีมูลค่าเพิ่ม (VAT): 【VND】; ผลกระทบต่อกำหนดการ: 【NGÀY】\"></span></p><p>Điều kiện kỹ thuật, HSE, hồ sơ và bảo hành điều chỉnh: <strong><span class=\"fx\" data-k=\"NỘI DUNG\"></span></strong><span class=\"th\" data-t=\"เงื่อนไขทางเทคนิค HSE เอกสาร และการรับประกันผลงานที่ปรับปรุง: 【NỘI DUNG】\"></span></p><p>Chữ ký phê duyệt Bên A: <strong><span class=\"fx\" data-k=\"HỌ TÊN/CHỨC VỤ/NGÀY\"></span></strong>; Bên B: <strong><span class=\"fx\" data-k=\"HỌ TÊN/CHỨC VỤ/NGÀY\"></span></strong><span class=\"th\" data-t=\"ลายมือชื่ออนุมัติของฝ่าย A: 【HỌ TÊN/CHỨC VỤ/NGÀY】; ฝ่าย B: 【HỌ TÊN/CHỨC VỤ/NGÀY】\"></span></p><h3 class=\"ann\" data-n=\"06\">PHỤ LỤC 06 – THÔNG SỐ CHẾ TÀI, BẢO LÃNH VÀ THANH TOÁN (CHỌN/GHI RÕ)<span class=\"th\" data-t=\"ภาคผนวก 06 – พารามิเตอร์มาตรการลงโทษ หนังสือค้ำประกัน และการชำระเงิน (เลือก/ระบุให้ชัดเจน)\"></span></h3><div class=\"tw2\"><table class=\"ct\"><tr><th><strong>Thông số</strong><span class=\"th\" data-t=\"พารามิเตอร์\"></span></th><th><strong>Giá trị/điều kiện được duyệt</strong><span class=\"th\" data-t=\"ค่า/เงื่อนไขที่ได้รับอนุมัติ\"></span></th></tr><tr><td>Phân loại hợp đồng / nguồn vốn<span class=\"th\" data-t=\"ประเภทสัญญา / แหล่งเงินทุน\"></span></td><td><span class=\"fx\" data-k=\"TƯ NHÂN / ĐẦU TƯ CÔNG / PPP / KHÁC\"></span></td></tr><tr><td>Cơ sở giá trị phần nghĩa vụ vi phạm<span class=\"th\" data-t=\"เกณฑ์มูลค่าของส่วนภาระผูกพันที่ถูกฝ่าฝืน\"></span></td><td><span class=\"fx\" data-k=\"MỐC / BOQ / VND\"></span></td></tr><tr><td>Tỷ lệ phạt chậm tiến độ<span class=\"th\" data-t=\"อัตราค่าปรับกรณีล่าช้า\"></span></td><td><span class=\"fx\" data-k=\"%/NGÀY\"></span> trên phần việc chậm; cộng dồn theo Điều 9<span class=\"th\" data-t=\"【%/NGÀY】 ของส่วนงานที่ล่าช้า สะสมตามข้อ 9\"></span></td></tr><tr><td>Tỷ lệ phạt lỗi chất lượng<span class=\"th\" data-t=\"อัตราค่าปรับกรณีบกพร่องด้านคุณภาพ\"></span></td><td><span class=\"fx\" data-k=\"%\"></span> trên phần việc vi phạm<span class=\"th\" data-t=\"【%】 ของส่วนงานที่ฝ่าฝืน\"></span></td></tr><tr><td>Tỷ lệ phạt tự ý ngừng / bỏ việc<span class=\"th\" data-t=\"อัตราค่าปรับกรณีหยุดงานหรือทิ้งงานโดยพลการ\"></span></td><td><span class=\"fx\" data-k=\"%\"></span> trên phần nghĩa vụ chưa thực hiện<span class=\"th\" data-t=\"【%】 ของส่วนภาระผูกพันที่ยังไม่ได้ปฏิบัติ\"></span></td></tr><tr><td>Giới hạn phạt cộng dồn<span class=\"th\" data-t=\"เพดานค่าปรับสะสม\"></span></td><td><span class=\"fx\" data-k=\"THEO LUẬT ÁP DỤNG; GHI CƠ SỞ / %\"></span></td></tr><tr><td>Thời hạn khắc phục vi phạm<span class=\"th\" data-t=\"กำหนดเวลาแก้ไขการฝ่าฝืน\"></span></td><td><span class=\"fx\" data-k=\"GIỜ / NGÀY\"></span></td></tr><tr><td>Bảo lãnh thực hiện<span class=\"th\" data-t=\"หนังสือค้ำประกันการปฏิบัติตามสัญญา\"></span></td><td>Theo Điều 21.1: (05)% giá Hợp đồng trước VAT; hiệu lực đến hoàn tất nghiệm thu, bàn giao, khắc phục tồn đọng và nộp bảo đảm bảo hành + (30) ngày; ngoại lệ (nếu có): <span class=\"fx\" data-k=\"KHÔNG / NỘI DUNG ĐƯỢC DUYỆT\"></span><span class=\"th\" data-t=\"ตามข้อ 21.1: (05)% ของราคาสัญญาก่อนภาษีมูลค่าเพิ่ม (VAT) มีผลจนกว่าจะเสร็จสิ้นการตรวจรับ การส่งมอบ การแก้ไขงานค้าง และการยื่นหลักประกันการรับประกันผลงาน + (30) วัน ข้อยกเว้น (ถ้ามี): 【KHÔNG / NỘI DUNG ĐƯỢC DUYỆT】\"></span></td></tr><tr><td>Bảo lãnh tạm ứng<span class=\"th\" data-t=\"หนังสือค้ำประกันเงินล่วงหน้า\"></span></td><td><span class=\"fx\" data-k=\"100% TẠM ỨNG / HIỆU LỰC ĐẾN THU HỒI HẾT + ĐỆM\"></span></td></tr><tr><td>Bảo lãnh bảo hành hoặc tiền giữ lại<span class=\"th\" data-t=\"หนังสือค้ำประกันการรับประกันผลงาน หรือเงินประกันผลงานที่กักไว้ (Retention)\"></span></td><td><span class=\"fx\" data-k=\"CHỌN MỘT / % / NGÀY HẾT HIỆU LỰC\"></span></td></tr><tr><td>Thời hạn bảo hành<span class=\"th\" data-t=\"ระยะเวลารับประกันผลงาน\"></span></td><td><span class=\"fx\" data-k=\"SỐ THÁNG\"></span> thời điểm bắt đầu, ngày kết thúc theo Điều 12.1/Phụ lục 04; thời gian chờ tối đa <span class=\"fx\" data-k=\"SỐ THÁNG CHỜ\"></span>; bảo hành lại phần sửa/thay: <span class=\"fx\" data-k=\"SỐ THÁNG\"></span><span class=\"th\" data-t=\"【SỐ THÁNG】 จุดเริ่มต้น วันสิ้นสุดตามข้อ 12.1/ภาคผนวก 04 ระยะเวลารอสูงสุด 【SỐ THÁNG CHỜ】 การรับประกันซ้ำสำหรับส่วนที่ซ่อม/เปลี่ยน: 【SỐ THÁNG】\"></span></td></tr><tr><td>Thời hạn thanh toán / đợt 1-4<span class=\"th\" data-t=\"กำหนดการชำระเงิน / งวดที่ 1-4\"></span></td><td></td></tr><tr><td>Cơ quan giải quyết tranh chấp<span class=\"th\" data-t=\"หน่วยงานระงับข้อพิพาท\"></span></td><td><span class=\"fx\" data-k=\"TÒA ÁN CÓ THẨM QUYỀN / TRỌNG TÀI\"></span></td></tr><tr><td></td><td></td></tr></table></div><p>Ghi chú phê duyệt: Không sử dụng một tỷ lệ phạt cố định cho mọi dự án. Phòng Pháp chế phải kiểm tra luật áp dụng, nguồn vốn, giá trị phần nghĩa vụ bị vi phạm và tính hợp lý của phương pháp định giá trước khi ký.<span class=\"th\" data-t=\"หมายเหตุการอนุมัติ: ห้ามใช้อัตราค่าปรับคงที่อัตราเดียวสำหรับทุกโครงการ ฝ่ายกฎหมายต้องตรวจสอบกฎหมายที่ใช้บังคับ แหล่งเงินทุน มูลค่าของส่วนภาระผูกพันที่ถูกฝ่าฝืน และความสมเหตุสมผลของวิธีการกำหนดราคา ก่อนการลงนาม\"></span></p><p>DANH MỤC VẤN ĐỀ PHẢI XÁC NHẬN TRƯỚC KHI KÝ<span class=\"th\" data-t=\"รายการประเด็นที่ต้องยืนยันก่อนลงนาม\"></span></p><p>1. Điều 1: Chọn rõ phạm vi thi công xây dựng, công việc xây dựng bao gồm/loại trừ; kiểm tra sự phù hợp giữa tên hợp đồng ở bìa và phần nội dung.<span class=\"th\" data-t=\"1. ข้อ 1: เลือกขอบเขตงานก่อสร้างให้ชัดเจน งานก่อสร้างที่รวม/ไม่รวม ตรวจสอบความสอดคล้องระหว่างชื่อสัญญาที่หน้าปกกับเนื้อหา\"></span></p><p>2. Điều 5 và Phụ lục 03: Xác định cơ sở thanh toán riêng của từng đợt, địa điểm và tiêu chí nghiệm thu; lập bảng kiểm soát tổng thanh toán, tạm ứng, thu hồi và phần giữ lại để không chi vượt thực tế.<span class=\"th\" data-t=\"2. ข้อ 5 และภาคผนวก 03: กำหนดเกณฑ์การชำระเงินแยกของแต่ละงวด สถานที่ และเกณฑ์การตรวจรับ จัดทำตารางควบคุมยอดรวมการชำระเงิน เงินล่วงหน้า การเรียกคืน และเงินประกันผลงานที่กักไว้ เพื่อมิให้จ่ายเกินจริง\"></span></p><p>3. Điều 5, 8: Thống nhất thời hạn hoàn trả tạm ứng chưa thu hồi (03 ngày) và thời hạn hoàn trả khoản nhận thừa sau quyết toán (07 ngày); xác định trường hợp áp dụng từng mốc.<span class=\"th\" data-t=\"3. ข้อ 5, 8: ตกลงกำหนดเวลาคืนเงินล่วงหน้าที่ยังไม่ได้เรียกคืน (03 วัน) และกำหนดเวลาคืนเงินที่ได้รับเกินภายหลังการสรุปบัญชี (07 วัน) กำหนดกรณีที่ใช้บังคับของแต่ละกำหนดเวลา\"></span></p><p>4. Điều 8: Chọn thời hạn thông báo chấm dứt hợp đồng do vi phạm và chấm dứt vì dừng dự án; xác nhận căn cứ, thời hạn báo trước, quyền lợi vật tư đặt mua và thời hạn quyết toán theo luật áp dụng.<span class=\"th\" data-t=\"4. ข้อ 8: เลือกกำหนดเวลาแจ้งการเลิกสัญญาเนื่องจากการฝ่าฝืน และการเลิกสัญญาเนื่องจากการหยุดโครงการ ยืนยันเหตุ ระยะเวลาแจ้งล่วงหน้า สิทธิเกี่ยวกับวัสดุที่สั่งซื้อ และกำหนดเวลาสรุปบัญชีตามกฎหมายที่ใช้บังคับ\"></span></p><p>5. Điều 9 / Phụ lục 06: Phê duyệt mức phạt từng hành vi và trần phạt theo hợp đồng/nguồn vốn, giá trị phần nghĩa vụ bị vi phạm; tránh phạt trùng một hành vi. Kiểm tra các con số ví dụ như 0,10%/ngày.<span class=\"th\" data-t=\"5. ข้อ 9 / ภาคผนวก 06: อนุมัติอัตราค่าปรับสำหรับแต่ละการกระทำและเพดานค่าปรับตามสัญญา/แหล่งเงินทุน มูลค่าของส่วนภาระผูกพันที่ถูกฝ่าฝืน หลีกเลี่ยงการปรับซ้ำสำหรับการกระทำเดียว ตรวจสอบตัวเลขตัวอย่าง เช่น 0,10%/วัน\"></span></p><p>6. Điều 12 và Điều 21: Ấn định thời điểm bắt đầu/kết thúc bảo hành, thời gian chờ tối đa, phạm vi bảo hành, thời hạn và mẫu bảo lãnh bảo hành tương ứng; xem xét luật bắt buộc.<span class=\"th\" data-t=\"6. ข้อ 12 และข้อ 21: กำหนดจุดเริ่มต้น/สิ้นสุดของการรับประกันผลงาน ระยะเวลารอสูงสุด ขอบเขตการรับประกัน ระยะเวลาและแบบหนังสือค้ำประกันการรับประกันผลงานที่สอดคล้องกัน พิจารณากฎหมายบังคับ\"></span></p><p>7. Điều 21 / Phụ lục 06: Quyết định bảo lãnh thực hiện 5% (áp dụng/ngoại lệ) theo phân loại giao dịch, khả năng của nhà thầu, nguồn vốn; có văn bản được hai bên ký.<span class=\"th\" data-t=\"7. ข้อ 21 / ภาคผนวก 06: ตัดสินใจเรื่องหนังสือค้ำประกันการปฏิบัติตามสัญญา 5% (ใช้บังคับ/ข้อยกเว้น) ตามการจำแนกประเภทธุรกรรม ความสามารถของผู้รับเหมา แหล่งเงินทุน มีเอกสารเป็นลายลักษณ์อักษรที่คู่สัญญาทั้งสองฝ่ายลงนาม\"></span></p><p>8. Điều 15 và Điều 22: Làm rõ nghĩa vụ bồi thường theo lỗi, quan hệ nhân quả, chứng cứ, giới hạn trách nhiệm nếu áp dụng và phần công việc Bên B có thể kiểm soát.<span class=\"th\" data-t=\"8. ข้อ 15 และข้อ 22: ทำให้ชัดเจนเรื่องภาระการชดใช้ค่าเสียหายตามความผิด ความสัมพันธ์เชิงเหตุและผล พยานหลักฐาน เพดานความรับผิด (ถ้ามี) และส่วนงานที่ฝ่าย B ควบคุมได้\"></span></p><p>9. Điều 20: Thống nhất quy trình VO và chi phí khẩn cấp; tránh lệnh miệng tạo tăng giá ngoài thẩm quyền.<span class=\"th\" data-t=\"9. ข้อ 20: ตกลงขั้นตอน VO และค่าใช้จ่ายฉุกเฉิน หลีกเลี่ยงคำสั่งด้วยวาจาที่ก่อให้เกิดการเพิ่มราคานอกอำนาจ\"></span></p><p>10. Điều 22 / Phụ lục 04: Mỗi dự án lập Back-to-Back Matrix được ký, gồm thanh toán, tiến độ, phạt, nghiệm thu, bảo hành, bảo lãnh, VO và chấm dứt; kiểm tra điều khoản hợp đồng khách hàng có thể chia sẻ.<span class=\"th\" data-t=\"10. ข้อ 22 / ภาคผนวก 04: แต่ละโครงการต้องจัดทำตาราง Back-to-Back ที่ลงนามแล้ว ครอบคลุมการชำระเงิน กำหนดการ ค่าปรับ การตรวจรับ การรับประกันผลงาน หนังสือค้ำประกัน VO และการเลิกสัญญา ตรวจสอบข้อกำหนดในสัญญาลูกค้าที่สามารถเปิดเผยได้\"></span></p><p>11. Điều 7.5 và Phụ lục 02: Hoàn thiện yêu cầu an toàn sinh học cho trang trại, dừng máy, LOTO, làm việc nóng và yêu cầu HSE thực tế của nhà máy.<span class=\"th\" data-t=\"11. ข้อ 7.5 และภาคผนวก 02: ปรับปรุงข้อกำหนดความปลอดภัยทางชีวภาพสำหรับฟาร์ม การหยุดเครื่องจักร LOTO งานที่ใช้ความร้อน และข้อกำหนด HSE จริงของโรงงาน\"></span></p><p>12. Trước khi ký: Xóa mọi lựa chọn không áp dụng, điền đủ các ô <span class=\"fx\" data-k=\"...\"></span>, kiểm tra số điều/phụ lục và người ký có thẩm quyền.<span class=\"th\" data-t=\"12. ก่อนลงนาม: ลบตัวเลือกที่ไม่ใช้ทั้งหมด กรอกช่อง 【...】 ให้ครบ ตรวจสอบหมายเลขข้อ/ภาคผนวก และผู้ลงนามที่มีอำนาจ\"></span></p><p><strong>BẢN DỰ THẢO TÍCH HỢP Ý KIẾN ĐỘI MUA HÀNG; CHƯA QUA THẨM ĐỊNH VÀ PHÊ DUYỆT CUỐI CÙNG CỦA CÔNG TY LUẬT VIỆT NAM. </strong><span class=\"th\" data-t=\"ร่างฉบับนี้รวมความเห็นของทีมจัดซื้อแล้ว ยังไม่ผ่านการตรวจสอบและการอนุมัติขั้นสุดท้ายจากสำนักงานกฎหมายเวียดนามของบริษัท\"></span></p>", "si": "<p class=\"ctr\"><strong>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</strong><span class=\"th\" data-t=\"สาธารณรัฐสังคมนิยมเวียดนาม\"></span></p><p class=\"ctr\"><strong>Độc lập - Tự do - Hạnh phúc</strong><span class=\"th\" data-t=\"เอกราช - เสรีภาพ - ความสุข\"></span></p><p class=\"ctr\">HỢP ĐỒNG THI CÔNG XÂY DỰNG, CUNG CẤP VÀ LẮP ĐẶT<em> – MẪU KSP, PHIÊN BẢN KIỂM TRA PHÁP LÝ</em><span class=\"th\" data-t=\"สัญญาจ้างก่อสร้าง จัดหา และติดตั้ง – แบบฟอร์ม KSP ฉบับตรวจสอบทางกฎหมาย\"></span></p><p class=\"ctr\">Số: <strong><span class=\"fx\" data-k=\"SỐ HỢP ĐỒNG\"></span></strong><span class=\"th\" data-t=\"เลขที่: 【SỐ HỢP ĐỒNG】\"></span></p><p class=\"ctr\">DỰ ÁN: <span class=\"fx\" data-k=\"TÊN DỰ ÁN / CHỦ ĐẦU TƯ CUỐI CÙNG\"></span><span class=\"th\" data-t=\"โครงการ: 【TÊN DỰ ÁN / CHỦ ĐẦU TƯ CUỐI CÙNG】\"></span></p><p class=\"ctr\">HẠNG MỤC: <span class=\"fx\" data-k=\"TÊN GÓI THẦU / PHẠM VI CÔNG VIỆC\"></span><span class=\"th\" data-t=\"รายการ: 【TÊN GÓI THẦU / PHẠM VI CÔNG VIỆC】\"></span></p><p class=\"ctr\"><strong>GIỮA</strong><span class=\"th\" data-t=\"ระหว่าง\"></span></p><p class=\"ctr\">CÔNG TY TNHH KSP VIỆT NAM <strong><span class=\"fx\" data-k=\"CHI NHÁNH / ĐƠN VỊ THỰC HIỆN\"></span></strong><span class=\"th\" data-t=\"บริษัท KSP เวียดนาม จำกัด (CÔNG TY TNHH KSP VIỆT NAM) 【CHI NHÁNH / ĐƠN VỊ THỰC HIỆN】\"></span></p><p class=\"ctr\"><strong> VÀ</strong><span class=\"th\" data-t=\"และ\"></span></p><p class=\"ctr\"><strong><span class=\"fx\" data-k=\"TÊN PHÁP LÝ NHÀ THẦU\"></span></strong></p><p class=\"ctr\"><strong>CỘNG HOÀ XÃ HỘI CHỦ NGHĨA VIỆT NAM</strong><span class=\"th\" data-t=\"สาธารณรัฐสังคมนิยมเวียดนาม\"></span></p><p class=\"ctr\"><strong>Độc lập - Tự do - Hạnh phúc</strong><span class=\"th\" data-t=\"เอกราช - เสรีภาพ - ความสุข\"></span></p><p class=\"ctr\">HỢP ĐỒNG THI CÔNG XÂY DỰNG VÀ LẮP ĐẶT<span class=\"th\" data-t=\"สัญญาจ้างก่อสร้างและติดตั้ง\"></span></p><p class=\"ctr\">Số: <strong><span class=\"fx\" data-k=\"SỐ HỢP ĐỒNG\"></span></strong><span class=\"th\" data-t=\"เลขที่: 【SỐ HỢP ĐỒNG】\"></span></p><p class=\"ctr\">DỰ ÁN: <strong><span class=\"fx\" data-k=\"TÊN DỰ ÁN\"></span></strong><span class=\"th\" data-t=\"โครงการ: 【TÊN DỰ ÁN】\"></span></p><p class=\"ctr\">HẠNG MỤC: <strong><span class=\"fx\" data-k=\"PHẠM VI THI CÔNG / LẮP ĐẶT\"></span></strong><span class=\"th\" data-t=\"รายการ: 【PHẠM VI THI CÔNG / LẮP ĐẶT】\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Căn cứ Bộ luật Dân sự số 91/2015/QH13 ngày 24/11/2015 và các văn bản sửa đổi, bổ sung có liên quan;<span class=\"th\" data-t=\"อาศัยอำนาจตามประมวลกฎหมายแพ่ง ฉบับที่ 91/2015/QH13 ลงวันที่ 24/11/2015 และกฎหมายแก้ไข เพิ่มเติมที่เกี่ยวข้อง;\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Căn cứ Luật Xây dựng số 135/2025/QH15 có hiệu lực từ ngày 01/7/2026 và Nghị định số 210/2026/NĐ-CP về hợp đồng xây dựng trong phạm vi áp dụng;<span class=\"th\" data-t=\"อาศัยอำนาจตามกฎหมายว่าด้วยการก่อสร้าง ฉบับที่ 135/2025/QH15 ซึ่งมีผลใช้บังคับตั้งแต่วันที่ 01/7/2026 และพระราชกฤษฎีกา (Nghị định) ฉบับที่ 210/2026/NĐ-CP ว่าด้วยสัญญาก่อสร้างภายในขอบเขตที่ใช้บังคับ;\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Căn cứ Luật Thương mại số 36/2005/QH11 trong phạm vi điều chỉnh; quy định hiện hành về quản lý chất lượng, thi công xây dựng và bảo trì công trình;<span class=\"th\" data-t=\"อาศัยอำนาจตามกฎหมายว่าด้วยการพาณิชย์ ฉบับที่ 36/2005/QH11 ภายในขอบเขตที่กฎหมายนั้นกำกับดูแล; ระเบียบที่ใช้บังคับในปัจจุบันว่าด้วยการบริหารจัดการคุณภาพ การก่อสร้าง และการบำรุงรักษางานก่อสร้าง;\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Căn cứ hồ sơ mời thầu, bản vẽ, biện pháp thi công, yêu cầu kỹ thuật và các tiêu chuẩn được liệt kê tại Phụ lục 01; các điều kiện Back-to-Back tại Phụ lục 04;<span class=\"th\" data-t=\"อาศัยเอกสารเชิญชวนประกวดราคา แบบแปลน วิธีการก่อสร้าง ข้อกำหนดทางเทคนิค และมาตรฐานที่ระบุไว้ในภาคผนวก 01; เงื่อนไขแบบ Back-to-Back (ส่งต่อเงื่อนไขกับสัญญาหลัก) ในภาคผนวก 04;\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Căn cứ nhu cầu và khả năng của các bên.<span class=\"th\" data-t=\"อาศัยความต้องการและความสามารถของคู่สัญญา\"></span></p><p>Hôm nay, ngày <strong><span class=\"fx\" data-k=\"NGÀY\"></span></strong> tháng <strong><span class=\"fx\" data-k=\"THÁNG\"></span></strong> năm <strong><span class=\"fx\" data-k=\"NĂM\"></span></strong>, chúng tôi gồm có:<span class=\"th\" data-t=\"วันนี้ วันที่ 【NGÀY】 เดือน 【THÁNG】 ปี 【NĂM】 คู่สัญญาประกอบด้วย:\"></span></p><p>Bên A (Bên giao thầu): CÔNG TY TNHH KSP VIỆT NAM – <span class=\"fx\" data-k=\"ĐƠN VỊ/CHI NHÁNH THỰC HIỆN, NẾU CÓ\"></span><span class=\"th\" data-t=\"ฝ่าย A (ฝ่ายว่าจ้าง): บริษัท KSP เวียดนาม จำกัด (CÔNG TY TNHH KSP VIỆT NAM) – 【ĐƠN VỊ/CHI NHÁNH THỰC HIỆN, NẾU CÓ】\"></span></p><p>Đại diện: <strong><span class=\"fx\" data-k=\"HỌ TÊN NGƯỜI KÝ\"></span></strong>     Chức vụ: <strong><span class=\"fx\" data-k=\"CHỨC VỤ\"></span></strong>      Căn cứ thẩm quyền ký: <strong><span class=\"fx\" data-k=\"ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY\"></span></strong><span class=\"th\" data-t=\"ผู้แทน: 【HỌ TÊN NGƯỜI KÝ】 ตำแหน่ง: 【CHỨC VỤ】 ฐานอำนาจในการลงนาม: 【ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY】\"></span></p><p>Địa chỉ trụ sở / địa chỉ đơn vị thực hiện: <strong><span class=\"fx\" data-k=\"ĐỊA CHỈ PHÁP LÝ – KIỂM TRA ĐĂNG KÝ HIỆN HÀNH\"></span></strong><span class=\"th\" data-t=\"ที่อยู่สำนักงานใหญ่ / ที่อยู่หน่วยงานที่ดำเนินการ: 【ĐỊA CHỈ PHÁP LÝ – KIỂM TRA ĐĂNG KÝ HIỆN HÀNH】\"></span></p><p>Mã số thuế của pháp nhân: <strong><span class=\"fx\" data-k=\"MST\"></span></strong>; Mã số thuế chi nhánh (nếu áp dụng): <strong><span class=\"fx\" data-k=\"MST CHI NHÁNH\"></span></strong><span class=\"th\" data-t=\"เลขประจำตัวผู้เสียภาษีของนิติบุคคล: 【MST】; เลขประจำตัวผู้เสียภาษีของสาขา (ถ้ามี): 【MST CHI NHÁNH】\"></span></p><p>Số tài khoản thanh toán: <strong><span class=\"fx\" data-k=\"TÀI KHOẢN, NGÂN HÀNG KSP\"></span></strong><span class=\"th\" data-t=\"หมายเลขบัญชีสำหรับการชำระเงิน: 【TÀI KHOẢN, NGÂN HÀNG KSP】\"></span></p><p>Bên B (Bên nhận thầu): <span class=\"fx\" data-k=\"TÊN ĐẦY ĐỦ NHÀ THẦU\"></span><span class=\"th\" data-t=\"ฝ่าย B (ฝ่ายรับเหมา): 【TÊN ĐẦY ĐỦ NHÀ THẦU】\"></span></p><p>Đại diện: <strong><span class=\"fx\" data-k=\"HỌ TÊN\"></span></strong>     Chức vụ: <strong><span class=\"fx\" data-k=\"CHỨC VỤ\"></span></strong>      Căn cứ thẩm quyền ký: <strong><span class=\"fx\" data-k=\"THẨM QUYỀN / ỦY QUYỀN\"></span></strong><span class=\"th\" data-t=\"ผู้แทน: 【HỌ TÊN】 ตำแหน่ง: 【CHỨC VỤ】 ฐานอำนาจในการลงนาม: 【THẨM QUYỀN / ỦY QUYỀN】\"></span></p><p>Địa chỉ đăng ký: <strong><span class=\"fx\" data-k=\"ĐỊA CHỈ NHÀ THẦU\"></span></strong><span class=\"th\" data-t=\"ที่อยู่ตามที่จดทะเบียน: 【ĐỊA CHỈ NHÀ THẦU】\"></span></p><p>Mã số thuế/Mã số doanh nghiệp: <strong><span class=\"fx\" data-k=\"MST/GCN ĐKDN\"></span></strong><span class=\"th\" data-t=\"เลขประจำตัวผู้เสียภาษี/เลขทะเบียนวิสาหกิจ: 【MST/GCN ĐKDN】\"></span></p><p>Tài khoản: <strong><span class=\"fx\" data-k=\"SỐ TÀI KHOẢN / NGÂN HÀNG / CHỦ TÀI KHOẢN\"></span></strong><span class=\"th\" data-t=\"บัญชี: 【SỐ TÀI KHOẢN / NGÂN HÀNG / CHỦ TÀI KHOẢN】\"></span></p><p>Hai bên thỏa thuận ký hợp đồng với các nội dung sau:<span class=\"th\" data-t=\"คู่สัญญาทั้งสองฝ่ายตกลงทำสัญญาโดยมีข้อความดังต่อไปนี้:\"></span></p><h3 class=\"art\" data-n=\"1\">ĐIỀU 1. PHẠM VI CÔNG VIỆC<span class=\"th\" data-t=\"ข้อ 1 ขอบเขตงาน\"></span></h3><p class=\"lv1\"><span class=\"lb\">1.1</span>1.1. Bên A giao cho Bên B thực hiện <strong><span class=\"fx\" data-k=\"PHẠM VI CÔNG VIỆC, CUNG CẤP / GIA CÔNG / THI CÔNG / LẮP ĐẶT / CHẠY THỬ\"></span></strong> tại Dự án <strong><span class=\"fx\" data-k=\"DỰ ÁN\"></span></strong> theo BOQ, bản vẽ, biện pháp thi công, yêu cầu kỹ thuật, tiêu chuẩn và tiến độ do Bên A phê duyệt tại các Phụ lục. Những hạng mục đặc thù (như kết cấu thép, tôn mái, điện, cơ khí) chỉ áp dụng nếu được liệt kê rõ trong Phụ lục 01.<span class=\"th\" data-t=\"1.1 ฝ่าย A มอบให้ฝ่าย B ดำเนินการ 【PHẠM VI CÔNG VIỆC, CUNG CẤP / GIA CÔNG / THI CÔNG / LẮP ĐẶT / CHẠY THỬ】 ณ โครงการ 【DỰ ÁN】 ตาม BOQ แบบแปลน วิธีการก่อสร้าง ข้อกำหนดทางเทคนิค มาตรฐาน และกำหนดการที่ฝ่าย A อนุมัติไว้ในภาคผนวก รายการเฉพาะ (เช่น โครงสร้างเหล็ก แผ่นหลังคา ระบบไฟฟ้า เครื่องกล) ให้ใช้บังคับเฉพาะเมื่อมีระบุไว้อย่างชัดเจนในภาคผนวก 01\"></span></p><p class=\"lv1\"><span class=\"lb\">1.2</span>1.2. Phạm vi công việc của Bên B bao gồm nhưng không giới hạn các công việc cần thiết để hoàn thành đúng phạm vi, tiêu chuẩn kỹ thuật và yêu cầu nghiệm thu tại Phụ lục 01:<span class=\"th\" data-t=\"1.2 ขอบเขตงานของฝ่าย B ครอบคลุมแต่ไม่จำกัดเฉพาะงานที่จำเป็นเพื่อให้แล้วเสร็จถูกต้องตามขอบเขต มาตรฐานทางเทคนิค และข้อกำหนดการตรวจรับในภาคผนวก 01:\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Tiếp nhận hồ sơ thiết kế, bản vẽ, yêu cầu kỹ thuật và các thông tin liên quan do Bên A cung cấp để triển khai thực hiện công việc.<span class=\"th\" data-t=\"รับแบบแปลน ข้อกำหนดทางเทคนิค และข้อมูลที่เกี่ยวข้องซึ่งฝ่าย A จัดให้ เพื่อดำเนินงาน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Tự tổ chức mua sắm, gia công, chế tạo vật tư, thiết bị, cấu kiện <strong><span class=\"fx\" data-k=\"NẾU THUỘC PHẠM VI BÊN B\"></span></strong> theo đúng hồ sơ thiết kế, yêu cầu kỹ thuật, chất lượng và tiến độ được Bên A phê duyệt.<span class=\"th\" data-t=\"จัดหา แปรรูป และผลิตวัสดุ อุปกรณ์ และชิ้นส่วนด้วยตนเอง 【NẾU THUỘC PHẠM VI BÊN B】 ให้ถูกต้องตามแบบแปลน ข้อกำหนดทางเทคนิค คุณภาพ และกำหนดการที่ฝ่าย A อนุมัติ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Cung cấp đầy đủ vật tư, nhân công, cán bộ kỹ thuật, tổ đội thi công, máy móc, thiết bị nâng hạ, phương tiện vận chuyển, dụng cụ thi công và các vật tư phụ cần thiết để thực hiện toàn bộ công việc.<span class=\"th\" data-t=\"จัดหาวัสดุ แรงงาน เจ้าหน้าที่เทคนิค ทีมงานก่อสร้าง เครื่องจักร เครื่องมือยก ยานพาหนะขนส่ง เครื่องมือก่อสร้าง และวัสดุประกอบที่จำเป็นให้ครบถ้วน เพื่อดำเนินงานทั้งหมด\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Thực hiện các công tác gia công, sản xuất, lắp ráp, lắp đặt, hoàn thiện hạng mục <strong><span class=\"fx\" data-k=\"MÔ TẢ CHI TIẾT TẠI BOQ/PHỤ LỤC 01\"></span></strong> theo bản vẽ, yêu cầu kỹ thuật và biện pháp thi công được duyệt.<span class=\"th\" data-t=\"ดำเนินการงานแปรรูป ผลิต ประกอบ ติดตั้ง และทำรายการ 【MÔ TẢ CHI TIẾT TẠI BOQ/PHỤ LỤC 01】 ให้แล้วเสร็จ ตามแบบแปลน ข้อกำหนดทางเทคนิค และวิธีการก่อสร้างที่ได้รับอนุมัติ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Vận chuyển, bốc xếp, tập kết, bảo quản vật tư, thiết bị, cấu kiện thuộc phạm vi Bên B đến khi nghiệm thu, bàn giao và chuyển giao rủi ro theo Hợp đồng.<span class=\"th\" data-t=\"ขนส่ง ขนถ่าย รวบรวม และเก็บรักษาวัสดุ อุปกรณ์ และชิ้นส่วนที่อยู่ในขอบเขตของฝ่าย B จนกว่าจะมีการตรวจรับ การส่งมอบ และการโอนความเสี่ยงตามสัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Thực hiện công tác thi công, lắp đặt, hiệu chỉnh, thử nghiệm, chạy thử, hoàn thiện <strong><span class=\"fx\" data-k=\"HẠNG MỤC CHI TIẾT\"></span></strong> tại công trường theo hồ sơ đã được phê duyệt.<span class=\"th\" data-t=\"ดำเนินการก่อสร้าง ติดตั้ง ปรับแต่ง ทดสอบ ทดลองเดินระบบ และทำให้แล้วเสร็จซึ่ง 【HẠNG MỤC CHI TIẾT】 ณ สถานที่ก่อสร้าง ตามเอกสารที่ได้รับอนุมัติ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Tự tổ chức thi công, bố trí đầy đủ nhân sự, máy móc, thiết bị và các nguồn lực cần thiết, đồng thời đảm bảo tiến độ thực hiện theo yêu cầu của Bên A.<span class=\"th\" data-t=\"จัดการก่อสร้างด้วยตนเอง จัดสรรบุคลากร เครื่องจักร อุปกรณ์ และทรัพยากรที่จำเป็นให้ครบถ้วน พร้อมทั้งรับรองกำหนดการตามที่ฝ่าย A กำหนด\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Thực hiện kiểm tra chất lượng vật tư, cấu kiện và chất lượng gia công, sản xuất, lắp đặt; chịu trách nhiệm đảm bảo toàn bộ sản phẩm và công việc do Bên B thực hiện phù hợp với hồ sơ thiết kế, tiêu chuẩn kỹ thuật và yêu cầu của Hợp đồng.<span class=\"th\" data-t=\"ตรวจสอบคุณภาพวัสดุ ชิ้นส่วน และคุณภาพการแปรรูป การผลิต และการติดตั้ง รับผิดชอบรับรองว่าผลิตภัณฑ์และงานทั้งหมดที่ฝ่าย B ดำเนินการเป็นไปตามเอกสารการออกแบบ มาตรฐานทางเทคนิค และข้อกำหนดของสัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Thực hiện vệ sinh khu vực sản xuất, lắp đặt và thi công; thu gom, vận chuyển vật tư thừa, phế liệu và chất thải phát sinh trong phạm vi công việc của Bên B.<span class=\"th\" data-t=\"ทำความสะอาดพื้นที่ผลิต ติดตั้ง และก่อสร้าง เก็บรวบรวมและขนย้ายวัสดุส่วนเกิน เศษวัสดุ และของเสียที่เกิดขึ้นภายในขอบเขตงานของฝ่าย B\"></span></p><p class=\"lv1\"><span class=\"lb\">1.3</span>Trách nhiệm đối với vật tư, cấu kiện và tài sản do Bên B cung cấp<span class=\"th\" data-t=\"ความรับผิดชอบต่อวัสดุ ชิ้นส่วน และทรัพย์สินที่ฝ่าย B จัดหา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B chịu trách nhiệm về vật tư, thiết bị, cấu kiện và tài sản thuộc phạm vi cung cấp, quản lý, sử dụng của Bên B đến khi được nghiệm thu, bàn giao, trừ mất mát do lỗi của Bên A hoặc rủi ro thuộc Bên A theo Hợp đồng.<span class=\"th\" data-t=\"ฝ่าย B รับผิดชอบต่อวัสดุ อุปกรณ์ ชิ้นส่วน และทรัพย์สินที่อยู่ในขอบเขตการจัดหา การดูแล และการใช้งานของฝ่าย B จนกว่าจะได้รับการตรวจรับและส่งมอบ เว้นแต่การสูญหายเกิดจากความผิดของฝ่าย A หรือความเสี่ยงที่เป็นของฝ่าย A ตามสัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B chịu trách nhiệm kiểm soát chất lượng từ khâu mua sắm vật tư, gia công, sản xuất, vận chuyển đến lắp đặt tại công trường.<span class=\"th\" data-t=\"ฝ่าย B รับผิดชอบการควบคุมคุณภาพตั้งแต่การจัดหาวัสดุ การแปรรูป การผลิต การขนส่ง จนถึงการติดตั้ง ณ หน่วยงานก่อสร้าง\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trường hợp xảy ra mất mát, thất thoát, hư hỏng hoặc sản phẩm/cấu kiện không phù hợp do lỗi của Bên B, Bên B phải tự chịu mọi chi phí sửa chữa, gia công lại, thay thế và bồi thường toàn bộ thiệt hại phát sinh cho Bên A.<span class=\"th\" data-t=\"ในกรณีที่เกิดการสูญหาย สูญเสีย ความเสียหาย หรือผลิตภัณฑ์/ชิ้นส่วนไม่เป็นไปตามข้อกำหนดเนื่องจากความผิดของฝ่าย B ฝ่าย B ต้องรับผิดชอบค่าใช้จ่ายในการซ่อมแซม แปรรูปใหม่ และเปลี่ยนทดแทนทั้งหมดด้วยตนเอง และชดใช้ค่าเสียหายทั้งหมดที่เกิดขึ้นแก่ฝ่าย A\"></span></p><p class=\"lv1\"><span class=\"lb\">1.4</span>Trách nhiệm về chất lượng, an toàn lao động và tổ chức thi công<span class=\"th\" data-t=\"ความรับผิดชอบด้านคุณภาพ ความปลอดภัยในการทำงาน และการจัดการก่อสร้าง\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B chịu trách nhiệm về chất lượng công tác gia công, thi công, lắp đặt, thử nghiệm và chạy thử do mình thực hiện theo phạm vi Hợp đồng.<span class=\"th\" data-t=\"ฝ่าย B รับผิดชอบต่อคุณภาพของงานแปรรูป ก่อสร้าง ติดตั้ง ทดสอบ และทดลองเดินระบบที่ตนดำเนินการตามขอบเขตของสัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B có trách nhiệm trang bị đầy đủ bảo hộ lao động, tổ chức huấn luyện an toàn lao động và thực hiện đầy đủ các biện pháp đảm bảo an toàn cho người lao động, thiết bị, máy móc và công trường trong suốt quá trình thực hiện công việc.<span class=\"th\" data-t=\"ฝ่าย B มีหน้าที่จัดหาอุปกรณ์ป้องกันส่วนบุคคลให้ครบถ้วน จัดอบรมความปลอดภัยในการทำงาน และดำเนินมาตรการรักษาความปลอดภัยแก่ผู้ปฏิบัติงาน อุปกรณ์ เครื่องจักร และหน่วยงานก่อสร้างอย่างครบถ้วนตลอดระยะเวลาการปฏิบัติงาน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B là đơn vị sử dụng lao động trực tiếp và hoàn toàn chịu trách nhiệm trước pháp luật đối với người lao động, nhân sự, máy móc, thiết bị do mình huy động.<span class=\"th\" data-t=\"ฝ่าย B เป็นนายจ้างโดยตรง และต้องรับผิดชอบต่อกฎหมายโดยสมบูรณ์ต่อผู้ปฏิบัติงาน บุคลากร เครื่องจักร และอุปกรณ์ที่ตนจัดหามา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B chịu trách nhiệm về mọi tai nạn lao động, sự cố kỹ thuật, thiệt hại về người hoặc tài sản phát sinh do lỗi của Bên B, nhân sự, nhà cung cấp hoặc đơn vị do Bên B huy động trong quá trình thực hiện công việc. Bên B có nghĩa vụ tự giải quyết và bồi thường toàn bộ thiệt hại phát sinh theo quy định của pháp luật và Hợp đồng.<span class=\"th\" data-t=\"ฝ่าย B รับผิดชอบต่ออุบัติเหตุจากการทำงาน เหตุขัดข้องทางเทคนิค ความเสียหายต่อบุคคลหรือทรัพย์สินทุกประการที่เกิดจากความผิดของฝ่าย B บุคลากร ผู้จัดหา หรือหน่วยงานที่ฝ่าย B จัดหามาในระหว่างการปฏิบัติงาน ฝ่าย B มีหน้าที่แก้ไขด้วยตนเองและชดใช้ค่าเสียหายทั้งหมดที่เกิดขึ้นตามบทบัญญัติของกฎหมายและสัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B phải tuân thủ đầy đủ các quy định về an toàn lao động, phòng cháy chữa cháy, vệ sinh môi trường, nội quy công trường và các yêu cầu quản lý thi công tại công trình.<span class=\"th\" data-t=\"ฝ่าย B ต้องปฏิบัติตามระเบียบว่าด้วยความปลอดภัยในการทำงาน การป้องกันและระงับอัคคีภัย สุขอนามัยด้านสิ่งแวดล้อม ข้อบังคับของหน่วยงานก่อสร้าง และข้อกำหนดการบริหารการก่อสร้าง ณ โครงการอย่างครบถ้วน\"></span></p><p class=\"lv1\"><span class=\"lb\">1.5</span>Bên B có trách nhiệm cung cấp đầy đủ, kịp thời các hồ sơ về vật tư, nhân sự, biện pháp thi công, bản vẽ gia công/shop drawing, hồ sơ chất lượng, hồ sơ an toàn lao động, hồ sơ máy móc thiết bị và các tài liệu liên quan khác theo yêu cầu của Bên A, Chủ đầu tư hoặc Ban quản lý công trường để phục vụ công tác đăng ký, phê duyệt, kiểm tra và quản lý thi công tại công trình.<span class=\"th\" data-t=\"ฝ่าย B มีหน้าที่จัดส่งเอกสารเกี่ยวกับวัสดุ บุคลากร วิธีการก่อสร้าง แบบแปลนการแปรรูป/shop drawing เอกสารด้านคุณภาพ เอกสารด้านความปลอดภัยในการทำงาน เอกสารเครื่องจักรอุปกรณ์ และเอกสารอื่นที่เกี่ยวข้องให้ครบถ้วนและทันเวลา ตามที่ฝ่าย A เจ้าของโครงการ หรือคณะผู้บริหารหน่วยงานก่อสร้างร้องขอ เพื่อใช้ในการลงทะเบียน อนุมัติ ตรวจสอบ และบริหารการก่อสร้าง ณ โครงการ\"></span></p><p>Trách nhiệm cung cấp vật tư chính, vật tư phụ, thiết bị, cẩu, giàn giáo, vận chuyển, bốc dỡ, kho bãi, điện, nước, thí nghiệm, giấy phép và xử lý phế thải của mỗi Bên, bao gồm chi phí và các phần loại trừ, được xác định tại Phụ lục 01. Bên B chỉ chịu trách nhiệm thiết kế đối với phần việc được giao rõ trong Hợp đồng hoặc Phụ lục 01; việc Bên A cung cấp hồ sơ thiết kế không làm phát sinh nghĩa vụ thiết kế của Bên B.<span class=\"th\" data-t=\"ความรับผิดชอบในการจัดหาวัสดุหลัก วัสดุประกอบ อุปกรณ์ เครน นั่งร้าน การขนส่ง การขนถ่าย คลังและพื้นที่เก็บของ ไฟฟ้า น้ำ การทดสอบ ใบอนุญาต และการกำจัดของเสียของแต่ละฝ่าย รวมทั้งค่าใช้จ่ายและส่วนที่ไม่รวมอยู่ ให้เป็นไปตามที่กำหนดในภาคผนวก 01 ฝ่าย B รับผิดชอบด้านการออกแบบเฉพาะงานที่ได้รับมอบหมายอย่างชัดเจนในสัญญาหรือภาคผนวก 01 เท่านั้น การที่ฝ่าย A จัดส่งเอกสารแบบแปลนให้ไม่ก่อให้เกิดหน้าที่ด้านการออกแบบแก่ฝ่าย B\"></span></p><h3 class=\"art\" data-n=\"2\">ĐIỀU 2. ĐỊA ĐIỂM VÀ THỜI GIAN THI CÔNG<span class=\"th\" data-t=\"ข้อ 2 สถานที่และระยะเวลาก่อสร้าง\"></span></h3><p>Địa điểm: <strong><span class=\"fx\" data-k=\"ĐỊA ĐIỂM CÔNG TRÌNH, KHU VỰC / NHÀ MÁY\"></span></strong><span class=\"th\" data-t=\"สถานที่: 【ĐỊA ĐIỂM CÔNG TRÌNH, KHU VỰC / NHÀ MÁY】\"></span></p><p class=\"lv1\"><span class=\"lb\">2.1</span>Thời gian thực hiện hợp đồng<span class=\"th\" data-t=\"ระยะเวลาการปฏิบัติตามสัญญา\"></span></p><p>Bên B thực hiện công tác chuẩn bị theo tiến độ được duyệt. Ngày bắt đầu thi công là ngày các điều kiện khởi công quy định tại Điều 2 được đáp ứng và được hai Bên xác nhận bằng biên bản hoặc lệnh khởi công. Thời hạn thi công được tính từ ngày bắt đầu thi công này.<span class=\"th\" data-t=\"ฝ่าย B ดำเนินการเตรียมงานตามกำหนดการที่ได้รับอนุมัติ วันเริ่มก่อสร้างคือวันที่เงื่อนไขการเริ่มงานตามที่กำหนดในข้อ 2 ครบถ้วน และคู่สัญญาทั้งสองฝ่ายยืนยันด้วยรายงานหรือคำสั่งเริ่มงาน ระยะเวลาก่อสร้างนับตั้งแต่วันเริ่มก่อสร้างนี้\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B phải hoàn thành công việc trong <strong><span class=\"fx\" data-k=\"SỐ NGÀY\"></span></strong> ngày <strong><span class=\"fx\" data-k=\"LỊCH / LÀM VIỆC\"></span></strong> kể từ khi đồng thời đáp ứng: (i) Hợp đồng có hiệu lực; (ii) Bên A bàn giao mặt bằng đủ điều kiện có biên bản; (iii) Bên B nhận tạm ứng hợp lệ (nếu có); và (iv) <strong><span class=\"fx\" data-k=\"ĐIỀU KIỆN KHỞI CÔNG KHÁC\"></span></strong>. Ngày bắt đầu và mốc tiến độ của từng giai đoạn ghi tại Phụ lục 03. Thời gian bao gồm các ngày nghỉ, lễ nếu chọn “ngày lịch” nhưng phải tuân thủ pháp luật lao động và nội quy nhà máy.<span class=\"th\" data-t=\"ฝ่าย B ต้องทำงานให้แล้วเสร็จภายใน 【SỐ NGÀY】 วัน 【LỊCH / LÀM VIỆC】 นับแต่เมื่อเงื่อนไขต่อไปนี้ครบถ้วนพร้อมกัน: (i) สัญญามีผลใช้บังคับ; (ii) ฝ่าย A ส่งมอบพื้นที่ก่อสร้างที่พร้อมใช้งานโดยมีรายงาน; (iii) ฝ่าย B ได้รับเงินล่วงหน้าโดยชอบ (ถ้ามี); และ (iv) 【ĐIỀU KIỆN KHỞI CÔNG KHÁC】 วันเริ่มต้นและหมุดหมายกำหนดการของแต่ละงวดระบุไว้ในภาคผนวก 03 ระยะเวลานับรวมวันหยุดและวันนักขัตฤกษ์หากเลือก “วันตามปฏิทิน” แต่ต้องปฏิบัติตามกฎหมายแรงงานและข้อบังคับของโรงงาน\"></span></p><p>Trường hợp tạm ngừng do lỗi của Bên A, yêu cầu của chủ đầu tư được Bên A xác nhận, thay đổi được phê duyệt hoặc sự kiện bất khả kháng theo Điều 16, Bên B phải thông báo trong (02) ngày làm việc từ khi biết sự kiện và gửi chứng cứ, phân tích tác động trong (05) ngày làm việc tiếp theo. Chỉ gia hạn phần thời gian ảnh hưởng thực tế đến mốc hoàn thành sau khi trừ thời gian có thể khắc phục bằng biện pháp hợp lý và phần chậm trễ do Bên B gây ra. Việc gia hạn không tự động làm phát sinh quyền được bù chi phí; chi phí chỉ được thanh toán theo Điều 20 hoặc quy định bắt buộc của pháp luật. Các nguyên nhân khác chỉ được xem xét khi có căn cứ cụ thể và được hai Bên xác nhận bằng văn bản. Trong thời gian chờ giải quyết, Bên B phải tiếp tục thực hiện các công việc không bị ảnh hưởng<span class=\"th\" data-t=\"ในกรณีที่หยุดงานชั่วคราวเนื่องจากความผิดของฝ่าย A ข้อเรียกร้องของเจ้าของโครงการที่ฝ่าย A ยืนยัน การเปลี่ยนแปลงที่ได้รับอนุมัติ หรือเหตุสุดวิสัยตามข้อ 16 ฝ่าย B ต้องแจ้งภายใน (02) วันทำการนับแต่ทราบเหตุการณ์ และส่งหลักฐานพร้อมการวิเคราะห์ผลกระทบภายใน (05) วันทำการถัดไป จะขยายเฉพาะระยะเวลาส่วนที่ส่งผลกระทบจริงต่อกำหนดแล้วเสร็จ หลังหักระยะเวลาที่สามารถแก้ไขได้ด้วยมาตรการที่สมเหตุสมผล และส่วนที่ล่าช้าเนื่องจากฝ่าย B การขยายระยะเวลาไม่ก่อให้เกิดสิทธิในการได้รับชดเชยค่าใช้จ่ายโดยอัตโนมัติ ค่าใช้จ่ายจะชำระตามข้อ 20 หรือบทบัญญัติบังคับของกฎหมายเท่านั้น เหตุอื่น ๆ จะพิจารณาเมื่อมีหลักฐานเฉพาะเจาะจงและคู่สัญญาทั้งสองฝ่ายยืนยันเป็นลายลักษณ์อักษร ในระหว่างรอการแก้ไขปัญหา ฝ่าย B ต้องดำเนินงานที่ไม่ได้รับผลกระทบต่อไป\"></span></p><h3 class=\"art\" data-n=\"3\"><strong>ĐIỀU 3. TIẾN ĐỘ THỰC HIỆN HỢP ĐỒNG</strong><span class=\"th\" data-t=\"ข้อ 3 กำหนดการปฏิบัติตามสัญญา\"></span></h3><p class=\"sub\"><strong>3.1 Lập và quản lý tiến độ</strong><span class=\"th\" data-t=\"3.1 การจัดทำและบริหารกำหนดการ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Trong vòng <strong><span class=\"fx\" data-k=\"03\"></span></strong> ngày làm việc kể từ ngày hợp đồng có hiệu lực, Bên B lập và trình Bên A phê duyệt tiến độ chi tiết phù hợp các mốc tại Phụ lục 03; thời hạn phải sớm hơn thời hạn báo cáo tương ứng theo hợp đồng chủ đầu tư đã chuyển giao (nếu có).<span class=\"th\" data-t=\"ภายใน 【03】 วันทำการนับแต่วันที่สัญญามีผลใช้บังคับ ฝ่าย B จัดทำและเสนอกำหนดการโดยละเอียดให้ฝ่าย A อนุมัติ ให้สอดคล้องกับหมุดหมายในภาคผนวก 03; กำหนดเวลาต้องเร็วกว่ากำหนดเวลารายงานที่เกี่ยวข้องตามสัญญาเจ้าของโครงการที่ส่งต่อมา (ถ้ามี)\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Tiến độ thi công chi tiết sau khi được Bên A chấp thuận là cơ sở để Bên A theo dõi, kiểm tra và đánh giá việc thực hiện Hợp đồng của Bên B. Việc Bên A xem xét hoặc chấp thuận tiến độ không làm giảm, miễn trừ hoặc chuyển giao bất kỳ trách nhiệm nào của Bên B đối với nghĩa vụ hoàn thành công việc đúng thời hạn theo Hợp đồng.<span class=\"th\" data-t=\"กำหนดการก่อสร้างโดยละเอียดที่ฝ่าย A เห็นชอบแล้ว เป็นฐานให้ฝ่าย A ติดตาม ตรวจสอบ และประเมินการปฏิบัติตามสัญญาของฝ่าย B การที่ฝ่าย A พิจารณาหรือเห็นชอบกำหนดการไม่ทำให้ความรับผิดชอบใด ๆ ของฝ่าย B ในหน้าที่ทำงานให้แล้วเสร็จตามกำหนดเวลาตามสัญญาลดลง หลุดพ้น หรือถูกโอนไป\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Trường hợp tiến độ thi công đã được phê duyệt không còn phù hợp với thực tế hoặc theo yêu cầu của Bên A, Bên B có trách nhiệm cập nhật, điều chỉnh và trình Bên A xem xét trong vòng 03 (ba) ngày kể từ ngày phát sinh yêu cầu hoặc sự kiện ảnh hưởng đến tiến độ.<span class=\"th\" data-t=\"ในกรณีที่กำหนดการก่อสร้างที่ได้รับอนุมัติไม่สอดคล้องกับสภาพความเป็นจริง หรือตามที่ฝ่าย A ร้องขอ ฝ่าย B มีหน้าที่ปรับปรุง แก้ไข และเสนอให้ฝ่าย A พิจารณาภายใน 03 (สาม) วันนับแต่วันที่เกิดข้อเรียกร้องหรือเหตุการณ์ที่ส่งผลกระทบต่อกำหนดการ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span> Mỗi bảng tiến độ thi công phải thể hiện tối thiểu các nội dung sau:<span class=\"th\" data-t=\"กำหนดการก่อสร้างแต่ละฉบับต้องแสดงเนื้อหาอย่างน้อยดังต่อไปนี้:\"></span></p><p class=\"lv0\"><span class=\"lb\">a)</span>Trình tự thực hiện các công việc, thời gian thực hiện từng hạng mục và các mốc hoàn thành chính;<span class=\"th\" data-t=\"ลำดับการดำเนินงาน ระยะเวลาดำเนินการของแต่ละรายการงาน และหมุดหมายการแล้วเสร็จหลัก;\"></span></p><p class=\"lv0\"><span class=\"lb\">b)</span>Kế hoạch huy động nhân sự, máy móc, thiết bị phục vụ thi công;<span class=\"th\" data-t=\"แผนการระดมบุคลากร เครื่องจักร และอุปกรณ์เพื่อการก่อสร้าง;\"></span></p><p class=\"lv0\"><span class=\"lb\">c)</span>Thời gian kiểm tra, nghiệm thu từng giai đoạn và nghiệm thu hoàn thành;<span class=\"th\" data-t=\"ระยะเวลาการตรวจสอบ การตรวจรับเป็นงวด และการตรวจรับเมื่อแล้วเสร็จ;\"></span></p><p class=\"lv0\"><span class=\"lb\">d)</span>Các mốc kiểm tra và nghiệm thu các giai đoạn, thử nghiệm, chạy thử và nghiệm thu hoàn thành;<span class=\"th\" data-t=\"หมุดหมายการตรวจสอบและตรวจรับในแต่ละงวด การทดสอบ การทดลองเดินระบบ และการตรวจรับเมื่อแล้วเสร็จ;\"></span></p><p class=\"lv0\"><span class=\"lb\">e)</span>Kế hoạch tăng cường nguồn lực và biện pháp khắc phục trong trường hợp có nguy cơ chậm tiến độ.<span class=\"th\" data-t=\"แผนเพิ่มทรัพยากรและมาตรการแก้ไขในกรณีที่มีความเสี่ยงล่าช้า\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B có trách nhiệm báo cáo tiến độ thực hiện công việc định kỳ hàng tuần hoặc bất kỳ thời điểm nào theo yêu cầu của Bên A.<span class=\"th\" data-t=\"ฝ่าย B มีหน้าที่รายงานความคืบหน้าของงานเป็นประจำทุกสัปดาห์ หรือเมื่อใดก็ตามที่ฝ่าย A ร้องขอ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B chỉ được điều chỉnh tiến độ chi tiết theo tuần hoặc theo tháng khi có văn bản chấp thuận trước của Bên A. Việc điều chỉnh tiến độ chi tiết không được làm ảnh hưởng đến các mốc tiến độ và thời hạn hoàn thành toàn bộ công việc theo Hợp đồng, trừ trường hợp được Bên A chấp thuận bằng văn bản.<span class=\"th\" data-t=\"ฝ่าย B จะปรับกำหนดการโดยละเอียดรายสัปดาห์หรือรายเดือนได้ต่อเมื่อได้รับความเห็นชอบเป็นลายลักษณ์อักษรจากฝ่าย A ล่วงหน้า การปรับกำหนดการโดยละเอียดต้องไม่กระทบต่อหมุดหมายกำหนดการและกำหนดแล้วเสร็จของงานทั้งหมดตามสัญญา เว้นแต่ฝ่าย A เห็นชอบเป็นลายลักษณ์อักษร\"></span></p><p class=\"sub\"><strong>3.2 Điều chỉnh thời gian thực hiện Hợp đồng</strong><span class=\"th\" data-t=\"3.2 การปรับระยะเวลาการปฏิบัติตามสัญญา\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Thời gian thực hiện Hợp đồng chỉ được xem xét điều chỉnh trong các trường hợp sau:<span class=\"th\" data-t=\"ระยะเวลาการปฏิบัติตามสัญญาจะพิจารณาปรับได้เฉพาะในกรณีดังต่อไปนี้:\"></span></p><p class=\"lv0\"><span class=\"lb\">a)</span>Xảy ra sự kiện bất khả kháng theo quy định của pháp luật mà Bên B đã áp dụng mọi biện pháp cần thiết và hợp lý để khắc phục nhưng vẫn không thể khắc phục được hậu quả;<span class=\"th\" data-t=\"เกิดเหตุสุดวิสัยตามที่กฎหมายกำหนด ซึ่งฝ่าย B ได้ใช้มาตรการที่จำเป็นและสมเหตุสมผลทั้งหมดเพื่อแก้ไขแล้ว แต่ยังไม่สามารถแก้ไขผลที่ตามมาได้;\"></span></p><p class=\"lv0\"><span class=\"lb\">b)</span>Bên A có văn bản yêu cầu thay đổi phạm vi công việc hoặc tạm dừng thực hiện công việc và việc thay đổi, tạm dừng đó ảnh hưởng trực tiếp đến tiến độ thực hiện Hợp đồng;<span class=\"th\" data-t=\"ฝ่าย A มีหนังสือขอเปลี่ยนแปลงขอบเขตงานหรือหยุดการปฏิบัติงานชั่วคราว และการเปลี่ยนแปลงหรือการหยุดนั้นส่งผลกระทบโดยตรงต่อกำหนดการปฏิบัติตามสัญญา;\"></span></p><p class=\"lv0\"><span class=\"lb\">c)</span>Bên A có văn bản yêu cầu tạm dừng thi công hoặc thay đổi thiết kế, biện pháp thi công làm ảnh hưởng trực tiếp đến tiến độ thực hiện công việc;<span class=\"th\" data-t=\"ฝ่าย A มีหนังสือขอหยุดการก่อสร้างชั่วคราวหรือเปลี่ยนแปลงแบบแปลน วิธีการก่อสร้าง ซึ่งส่งผลกระทบโดยตรงต่อกำหนดการปฏิบัติงาน;\"></span></p><p class=\"lv0\"><span class=\"lb\">d)</span>Bên A bàn giao mặt bằng không đúng thỏa thuận hoặc việc tạm dừng Hợp đồng do lỗi của Bên A và có ảnh hưởng trực tiếp đến tiến độ thực hiện công việc;<span class=\"th\" data-t=\"ฝ่าย A ส่งมอบพื้นที่ก่อสร้างไม่ตรงตามที่ตกลง หรือการหยุดสัญญาชั่วคราวเกิดจากความผิดของฝ่าย A และส่งผลกระทบโดยตรงต่อกำหนดการปฏิบัติงาน;\"></span></p><p class=\"lv0\"><span class=\"lb\">e)</span>Bên B phải thông báo trong <strong><span class=\"fx\" data-k=\"02\"></span></strong> ngày làm việc khi biết sự kiện ảnh hưởng tiến độ, nộp bằng chứng và phân tích tác động trong <strong><span class=\"fx\" data-k=\"05\"></span></strong> ngày làm việc tiếp theo. Việc thông báo chậm chỉ ảnh hưởng đến yêu cầu gia hạn trong phạm vi gây thiệt hại thực tế do thông báo chậm hoặc theo pháp luật.<span class=\"th\" data-t=\"ฝ่าย B ต้องแจ้งภายใน 【02】 วันทำการนับแต่ทราบเหตุการณ์ที่กระทบกำหนดการ ส่งหลักฐานและการวิเคราะห์ผลกระทบภายใน 【05】 วันทำการถัดไป การแจ้งล่าช้าส่งผลต่อข้อเรียกร้องขอขยายระยะเวลาเฉพาะในขอบเขตที่ก่อให้เกิดความเสียหายจริงจากการแจ้งล่าช้า หรือตามกฎหมาย\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Quá thời hạn thông báo quy định, Bên A được xem xét hậu quả của việc chậm thông báo để quyết định gia hạn dựa trên chứng cứ thực tế; không mặc nhiên coi Bên B từ bỏ mọi quyền yêu cầu nếu pháp luật quy định khác.<span class=\"th\" data-t=\"เมื่อพ้นกำหนดเวลาแจ้งที่กำหนด ฝ่าย A อาจพิจารณาผลของการแจ้งล่าช้าเพื่อตัดสินใจขยายระยะเวลาโดยอาศัยหลักฐานจริง; ไม่ถือโดยปริยายว่าฝ่าย B สละสิทธิเรียกร้องทั้งหมด หากกฎหมายบัญญัติไว้เป็นอย่างอื่น\"></span></p><p>Bên B phải tuân thủ thời hạn thông báo và cung cấp hồ sơ theo khoản này. Trường hợp thông báo quá hạn, Bên B phải giải trình lý do và cung cấp đầy đủ chứng cứ chứng minh sự kiện, thời gian ảnh hưởng thực tế đến mốc hoàn thành và các biện pháp giảm thiểu đã thực hiện. Bên A có quyền từ chối phần yêu cầu không đủ căn cứ hoặc không thể kiểm chứng do việc thông báo chậm. Việc thông báo hoặc nộp hồ sơ không tự động làm thay đổi tiến độ; mọi gia hạn phải được người có thẩm quyền của hai Bên xác nhận bằng văn bản, trừ trường hợp pháp luật bắt buộc quy định khác. Trong thời gian xem xét, Bên B phải tiếp tục thực hiện các công việc không bị ảnh hưởng<span class=\"th\" data-t=\"ฝ่าย B ต้องปฏิบัติตามกำหนดเวลาแจ้งและจัดส่งเอกสารตามวรรคนี้ ในกรณีที่แจ้งเกินกำหนด ฝ่าย B ต้องชี้แจงเหตุผลและจัดส่งหลักฐานครบถ้วนเพื่อพิสูจน์เหตุการณ์ ระยะเวลาที่ส่งผลกระทบจริงต่อกำหนดแล้วเสร็จ และมาตรการบรรเทาที่ได้ดำเนินการแล้ว ฝ่าย A มีสิทธิปฏิเสธส่วนของข้อเรียกร้องที่ไม่มีหลักฐานเพียงพอหรือไม่สามารถตรวจสอบได้เนื่องจากการแจ้งล่าช้า การแจ้งหรือการยื่นเอกสารไม่ทำให้กำหนดการเปลี่ยนแปลงโดยอัตโนมัติ การขยายระยะเวลาทุกครั้งต้องได้รับการยืนยันเป็นลายลักษณ์อักษรจากผู้มีอำนาจของคู่สัญญาทั้งสองฝ่าย เว้นแต่กฎหมายบังคับไว้เป็นอย่างอื่น ในระหว่างการพิจารณา ฝ่าย B ต้องดำเนินงานที่ไม่ได้รับผลกระทบต่อไป\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Tiến độ thực hiện Hợp đồng chỉ được điều chỉnh khi có văn bản chấp thuận của Bên A. Việc Bên B tự ý kéo dài thời gian thực hiện, tiếp tục thi công theo tiến độ riêng hoặc viện dẫn các sự kiện chưa được Bên A chấp thuận không được xem là căn cứ gia hạn tiến độ.<span class=\"th\" data-t=\"กำหนดการปฏิบัติตามสัญญาจะปรับได้ต่อเมื่อมีหนังสือเห็นชอบจากฝ่าย A การที่ฝ่าย B ขยายระยะเวลาปฏิบัติงานโดยพลการ ก่อสร้างต่อไปตามกำหนดการของตนเอง หรืออ้างเหตุการณ์ที่ฝ่าย A ยังไม่เห็นชอบ ไม่ถือเป็นเหตุขยายกำหนดการ\"></span></p><p class=\"sub\">3.3  Các trường hợp không được gia hạn tiến độ<span class=\"th\" data-t=\"3.3 กรณีที่ไม่ได้รับการขยายกำหนดการ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Các nguyên nhân thuộc trách nhiệm của Bên B, bao gồm nhưng không giới hạn: thiếu nhân công, thiếu cán bộ kỹ thuật, thiếu máy móc thiết bị, thiếu vật tư, khó khăn tài chính, sai sót trong quản lý và tổ chức thi công, năng lực huy động nguồn lực không đáp ứng yêu cầu, vi phạm an toàn lao động, vi phạm nội quy công trường, chậm trễ của nhà thầu phụ, nhà cung cấp hoặc bất kỳ bên thứ ba nào do Bên B thuê hoặc lựa chọn, không được xem là căn cứ để gia hạn hoặc điều chỉnh tiến độ.<span class=\"th\" data-t=\"เหตุที่เป็นความรับผิดชอบของฝ่าย B ซึ่งรวมถึงแต่ไม่จำกัดเฉพาะ: การขาดแคลนแรงงาน เจ้าหน้าที่เทคนิค เครื่องจักรอุปกรณ์ วัสดุ ปัญหาทางการเงิน ข้อผิดพลาดในการบริหารและจัดการก่อสร้าง ความสามารถในการระดมทรัพยากรไม่เป็นไปตามข้อกำหนด การฝ่าฝืนความปลอดภัยในการทำงาน การฝ่าฝืนข้อบังคับของหน่วยงานก่อสร้าง ความล่าช้าของผู้รับเหมาช่วง ผู้ขาย หรือบุคคลที่สามใด ๆ ที่ฝ่าย B ว่าจ้างหรือคัดเลือก ไม่ถือเป็นเหตุในการขยายหรือปรับกำหนดการ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Việc Bên A xem xét hoặc chấp thuận điều chỉnh tiến độ (nếu có) không làm miễn trừ trách nhiệm của Bên B đối với các thiệt hại, chi phí phát sinh hoặc các nghĩa vụ khác theo Hợp đồng.<span class=\"th\" data-t=\"การที่ฝ่าย A พิจารณาหรือเห็นชอบการปรับกำหนดการ (ถ้ามี) ไม่ทำให้ฝ่าย B หลุดพ้นจากความรับผิดต่อความเสียหาย ค่าใช้จ่ายที่เกิดขึ้น หรือหน้าที่อื่นตามสัญญา\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Các nội dung liên quan đến việc điều chỉnh tiến độ cần được Bên B ghi nhận đầy đủ vào Nhật ký công trình để làm cơ sở xem xét.<span class=\"th\" data-t=\"เนื้อหาที่เกี่ยวข้องกับการปรับกำหนดการ ฝ่าย B ต้องบันทึกให้ครบถ้วนในสมุดบันทึกงานก่อสร้าง (Nhật ký công trình) เพื่อเป็นฐานในการพิจารณา\"></span></p><p class=\"sub\">3.4 Xử lý trường hợp Bên B chậm tiến độ<span class=\"th\" data-t=\"3.4 การจัดการกรณีฝ่าย B ล่าช้า\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Trong trường hợp Bên B chậm tiến độ hoặc có nguy cơ không hoàn thành công việc theo tiến độ cam kết, Bên A có quyền:<span class=\"th\" data-t=\"ในกรณีที่ฝ่าย B ล่าช้าหรือมีความเสี่ยงที่จะไม่แล้วเสร็จตามกำหนดการที่ให้คำมั่น ฝ่าย A มีสิทธิ:\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Yêu cầu Bên B lập và thực hiện ngay kế hoạch khắc phục tiến độ, bao gồm việc bổ sung nhân lực, máy móc, thiết bị, tăng ca, làm thêm giờ và áp dụng các biện pháp cần thiết khác nhằm đảm bảo tiến độ thực hiện Hợp đồng. Mọi chi phí phát sinh do Bên B tự chịu.<span class=\"th\" data-t=\"เรียกให้ฝ่าย B จัดทำและดำเนินแผนแก้ไขกำหนดการทันที ซึ่งรวมถึงการเพิ่มบุคลากร เครื่องจักร อุปกรณ์ การทำงานล่วงเวลา การทำงานเพิ่มชั่วโมง และมาตรการจำเป็นอื่น ๆ เพื่อรับรองกำหนดการปฏิบัติตามสัญญา ค่าใช้จ่ายที่เกิดขึ้นทั้งหมดฝ่าย B เป็นผู้รับผิดชอบเอง\"></span></p><p c
