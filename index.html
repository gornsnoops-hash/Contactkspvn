lass=\"th\" data-t=\"ภาคผนวก 06 – ข้อยกเว้นจากการเจรจาและรายการความเสี่ยงที่ต้องอนุมัติ\"></span></h3><p>Bên bán: <strong><span class=\"fx\" data-k=\"...\"></span></strong>    Loại hàng: <strong><span class=\"fx\" data-k=\"...\"></span></strong>    Giá trị: <strong><span class=\"fx\" data-k=\"...\"></span></strong>    Nhóm rủi ro: <strong><span class=\"fx\" data-k=\"THÔNG THƯỜNG / HÀNG OEM / GIÁ TRỊ CAO / KHÁC\"></span></strong><span class=\"th\" data-t=\"ผู้ขาย: 【...】 ประเภทสินค้า: 【...】 มูลค่า: 【...】 กลุ่มความเสี่ยง: 【THÔNG THƯỜNG / HÀNG OEM / GIÁ TRỊ CAO / KHÁC】\"></span></p><div class=\"tw2\"><table class=\"ct\"><tr><th><strong>Điều khoản</strong><span class=\"th\" data-t=\"ข้อกำหนด\"></span></th><th><strong>Mặc định KSP</strong><span class=\"th\" data-t=\"ค่ามาตรฐานของ KSP\"></span></th><th><strong>Nếu Nhà cung cấp không chấp nhận</strong><span class=\"th\" data-t=\"หากผู้ขาย/ผู้จัดหาไม่ยอมรับ\"></span></th><th><strong>Rủi ro còn lại / Phê duyệt</strong><span class=\"th\" data-t=\"ความเสี่ยงที่เหลือ / การอนุมัติ\"></span></th></tr><tr><td>Thanh toán<span class=\"th\" data-t=\"การชำระเงิน\"></span></td><td>Sau nhận/nghiệm thu, chứng từ đúng<span class=\"th\" data-t=\"หลังรับสินค้า/ตรวจรับ และเอกสารถูกต้อง\"></span></td><td>Đặt cọc/LC/escrow/bảo lãnh; không bảo đảm phải ghi giá trị rủi ro<span class=\"th\" data-t=\"เงินมัดจำ/L/C/escrow/หนังสือค้ำประกัน; หากไม่มีหลักประกันต้องระบุมูลค่าความเสี่ยง\"></span></td><td><strong><span class=\"fx\" data-k=\"...\"></span></strong></td></tr><tr><td>Trước giao hàng 100%<span class=\"th\" data-t=\"ชำระ 100% ก่อนส่งมอบสินค้า\"></span></td><td>Không ưu tiên<span class=\"th\" data-t=\"ไม่ให้ความสำคัญ\"></span></td><td>Kiểm hàng trước giao + sở hữu/tách hàng + bảo lãnh/điều kiện nhận hàng<span class=\"th\" data-t=\"ตรวจสินค้าก่อนส่งมอบ + กรรมสิทธิ์/การแยกสินค้าไว้ต่างหาก + หนังสือค้ำประกัน/เงื่อนไขการรับสินค้า\"></span></td><td><strong><span class=\"fx\" data-k=\"...\"></span></strong></td></tr><tr><td>Phí hủy đơn OEM<span class=\"th\" data-t=\"ค่าธรรมเนียมยกเลิกคำสั่งซื้อ OEM\"></span></td><td>Tính chi phí thực tế không thể hủy sau giảm thiểu<span class=\"th\" data-t=\"คิดตามค่าใช้จ่ายจริงที่ไม่อาจยกเลิกได้หลังจากการลดผลกระทบแล้ว\"></span></td><td>Yêu cầu bảng chi phí có chứng cứ và hạn mức; không tự nhận mức 30/60/90/100%<span class=\"th\" data-t=\"ต้องขอตารางค่าใช้จ่ายที่มีหลักฐานและวงเงินสูงสุด ไม่รับอัตรา 30/60/90/100% โดยอัตโนมัติ\"></span></td><td><strong><span class=\"fx\" data-k=\"...\"></span></strong></td></tr><tr><td>Bảo hành<span class=\"th\" data-t=\"การรับประกันผลงาน/สินค้า\"></span></td><td>Bắt đầu từ nghiệm thu; thời gian phù hợp khách hàng<span class=\"th\" data-t=\"เริ่มนับตั้งแต่การตรวจรับ; ระยะเวลาที่สอดคล้องกับลูกค้า\"></span></td><td>Giới hạn từ xuất xưởng cần đánh giá gap, mua mở rộng bảo hành/điều chỉnh lịch<span class=\"th\" data-t=\"การจำกัดนับจากวันออกจากโรงงานต้องประเมินช่องว่าง ซื้อการรับประกันเพิ่มเติม/ปรับกำหนดการ\"></span></td><td><strong><span class=\"fx\" data-k=\"...\"></span></strong></td></tr><tr><td>Liability cap<span class=\"th\" data-t=\"ขีดจำกัดความรับผิด (Liability cap)\"></span></td><td>Theo nghĩa vụ thực tế và luật<span class=\"th\" data-t=\"ตามภาระผูกพันที่แท้จริงและตามกฎหมาย\"></span></td><td>Nếu cap 100% giá trị hợp đồng/PO hoặc loại trừ thiệt hại phải phân tích ngoại lệ<span class=\"th\" data-t=\"หากกำหนดเพดาน 100% ของมูลค่าสัญญา/PO หรือยกเว้นความเสียหาย ต้องวิเคราะห์ข้อยกเว้น\"></span></td><td><strong><span class=\"fx\" data-k=\"...\"></span></strong></td></tr><tr><td>Phạt giao trễ<span class=\"th\" data-t=\"ค่าปรับกรณีส่งมอบล่าช้า\"></span></td><td>Có mức và căn cứ theo luật<span class=\"th\" data-t=\"มีอัตราและฐานตามกฎหมาย\"></span></td><td>Thay bằng điều khoản bù chi phí hợp lý/ưu tiên giao hàng nếu khó thương lượng<span class=\"th\" data-t=\"แทนที่ด้วยข้อกำหนดการชดเชยค่าใช้จ่ายที่สมเหตุสมผล/การให้ความสำคัญในการส่งมอบ หากเจรจายาก\"></span></td><td><strong><span class=\"fx\" data-k=\"...\"></span></strong></td></tr><tr><td>Back-to-Back<span class=\"th\" data-t=\"แบบ Back-to-Back (ส่งต่อเงื่อนไขกับสัญญาหลัก)\"></span></td><td>Căn cứ PO khách hàng có liên quan<span class=\"th\" data-t=\"อ้างอิง PO ของลูกค้าที่เกี่ยวข้อง\"></span></td><td>Phần không thể chuyển tiếp ghi chủ sở hữu rủi ro / ngân sách dự phòng<span class=\"th\" data-t=\"ส่วนที่ไม่อาจส่งต่อได้ให้ระบุเจ้าของความเสี่ยง / งบประมาณสำรอง\"></span></td><td><strong><span class=\"fx\" data-k=\"...\"></span></strong></td></tr></table></div><p>Quyết định ngoại lệ (đính kèm bằng chứng thương lượng): <strong><span class=\"fx\" data-k=\"CHẤP THUẬN / KHÔNG CHẤP THUẬN\"></span></strong>    Người duyệt: <strong><span class=\"fx\" data-k=\"CHỨC VỤ / HỌ TÊN / NGÀY\"></span></strong><span class=\"th\" data-t=\"การตัดสินใจเกี่ยวกับข้อยกเว้น (แนบหลักฐานการเจรจา): 【CHẤP THUẬN / KHÔNG CHẤP THUẬN】 ผู้อนุมัติ: 【CHỨC VỤ / HỌ TÊN / NGÀY】\"></span></p><p>Kết luận quản trị rủi ro: <strong><span class=\"fx\" data-k=\"NGUỒN TÀI TRỢ CẦN BỐ TRÍ / GIỚI HẠN RỦI RO / HÀNH ĐỘNG GIẢM THIỂU\"></span></strong>.<span class=\"th\" data-t=\"ข้อสรุปด้านการบริหารความเสี่ยง: 【NGUỒN TÀI TRỢ CẦN BỐ TRÍ / GIỚI HẠN RỦI RO / HÀNH ĐỘNG GIẢM THIỂU】\"></span></p><p><strong>DANH MỤC VẤN ĐỀ PHẢI KIỂM TRA TRƯỚC KHI KÝ</strong><span class=\"th\" data-t=\"รายการประเด็นที่ต้องตรวจสอบก่อนลงนาม\"></span></p><p>1. Kiểm tra tên pháp nhân/đơn vị ký, thẩm quyền đại diện, mã số thuế, địa chỉ cập nhật và phương án áp dụng một PO hay nhiều PO.<span class=\"th\" data-t=\"1. ตรวจสอบชื่อนิติบุคคล/หน่วยที่ลงนาม อำนาจของผู้แทน เลขประจำตัวผู้เสียภาษี ที่อยู่ที่เป็นปัจจุบัน และทางเลือกว่าจะใช้กับ PO เดียวหรือหลาย PO\"></span></p><p>2. Xác định hàng hóa thông thường so với máy móc/thiết bị OEM hoặc hàng có dịch vụ lắp đặt; trường hợp sau cần phụ lục chuyên biệt hoặc hợp đồng riêng.<span class=\"th\" data-t=\"2. ระบุให้ชัดเจนว่าเป็นสินค้าทั่วไป หรือเครื่องจักร/อุปกรณ์ OEM หรือสินค้าที่มีบริการติดตั้ง ในกรณีหลังต้องมีภาคผนวกเฉพาะหรือสัญญาแยกต่างหาก\"></span></p><p>3. Lựa chọn dứt khoát điều kiện giao hàng, quyền sở hữu, rủi ro, chứng từ và thời điểm nghiệm thu; kiểm tra lỗi ẩn.<span class=\"th\" data-t=\"3. เลือกให้เด็ดขาดซึ่งเงื่อนไขการส่งมอบ กรรมสิทธิ์ ความเสี่ยง เอกสาร และเวลาการตรวจรับ; ตรวจสอบข้อบกพร่องแอบแฝง\"></span></p><p>4. Phê duyệt lựa chọn thanh toán A/B/C, bảo lãnh tạm ứng và xác định cash gap với khách hàng cuối cùng.<span class=\"th\" data-t=\"4. อนุมัติทางเลือกการชำระเงิน A/B/C หนังสือค้ำประกันเงินล่วงหน้า และกำหนดช่องว่างกระแสเงินสด (cash gap) กับลูกค้าปลายทาง\"></span></p><p>5. Điều 12: kiểm tra mức phạt, cơ sở tính, giới hạn tổng hợp và phân biệt phạt vi phạm với thiệt hại thực tế theo luật hiện hành.<span class=\"th\" data-t=\"5. ข้อ 12: ตรวจสอบอัตราค่าปรับ ฐานการคำนวณ เพดานรวม และการแยกค่าปรับตามสัญญาออกจากความเสียหายที่เกิดขึ้นจริงตามกฎหมายที่มีผลบังคับใช้\"></span></p><p>6. Điều 13 &amp; 15: kiểm soát giới hạn trách nhiệm, chi phí hủy đơn OEM, hàng dở dang, quyền đổi hàng và biện pháp hạn chế thiệt hại.<span class=\"th\" data-t=\"6. ข้อ 13 และ 15: ควบคุมขีดจำกัดความรับผิด ค่าใช้จ่ายในการยกเลิกคำสั่งซื้อ OEM สินค้าระหว่างผลิต สิทธิในการเปลี่ยนสินค้า และมาตรการบรรเทาความเสียหาย\"></span></p><p>7. Điều 9: xác định ngày khởi đầu bảo hành, thời hạn bảo hành từ xuất xưởng/giao hàng và trách nhiệm sau nghiệm thu khách hàng.<span class=\"th\" data-t=\"7. ข้อ 9: ระบุวันเริ่มต้นการรับประกัน ระยะเวลารับประกันนับจากออกจากโรงงาน/ส่งมอบสินค้า และความรับผิดชอบภายหลังการตรวจรับของลูกค้า\"></span></p><p>8. Điều 21: lựa chọn nhất quán VIAC hoặc Tòa án; điều kiện trọng tài phải được Law Firm kiểm tra.<span class=\"th\" data-t=\"8. ข้อ 21: เลือกให้สอดคล้องกันระหว่าง VIAC หรือศาล; เงื่อนไขอนุญาโตตุลาการต้องได้รับการตรวจสอบจากสำนักงานกฎหมาย (Law Firm)\"></span></p><p>9. Điều 22/Phụ lục 04: chỉ chuyển giao nghĩa vụ khách hàng liên quan phần cung cấp, được hai Bên xác nhận bằng văn bản.<span class=\"th\" data-t=\"9. ข้อ 22/ภาคผนวก 04: โอนเฉพาะภาระผูกพันของลูกค้าที่เกี่ยวข้องกับส่วนที่จัดหา และต้องได้รับการยืนยันเป็นลายลักษณ์อักษรจากคู่สัญญาทั้งสองฝ่าย\"></span></p><p>10. Phụ lục 06: mọi ngoại lệ quyền lực đàm phán thấp phải ghi người duyệt cùng rủi ro còn lại, không tự xem là tuân thủ chuẩn.<span class=\"th\" data-t=\"10. ภาคผนวก 06: ข้อยกเว้นทุกรายการที่มีอำนาจต่อรองต่ำต้องระบุผู้อนุมัติพร้อมความเสี่ยงที่เหลือ ไม่ถือเป็นการปฏิบัติตามมาตรฐานโดยอัตโนมัติ\"></span></p><p>11. Kiểm tra Luật Chất lượng sản phẩm, hàng hóa được sửa đổi hiệu lực 01/01/2026; kiểm tra nguồn gốc, chứng nhận đặc thù theo nhóm hàng.<span class=\"th\" data-t=\"11. ตรวจสอบกฎหมายว่าด้วยคุณภาพผลิตภัณฑ์ สินค้า ที่ได้รับการแก้ไขซึ่งมีผลตั้งแต่ 01/01/2026; ตรวจสอบแหล่งกำเนิด ใบรับรองเฉพาะตามกลุ่มสินค้า\"></span></p><p>12. Xóa mọi lựa chọn không áp dụng, hoàn thành tất cả ô <strong><span class=\"fx\" data-k=\"...\"></span></strong>, rà soát danh mục phụ lục và chỉ ký sau khi Law Firm phê duyệt.<span class=\"th\" data-t=\"12. ลบทางเลือกที่ไม่นำมาใช้ทั้งหมด กรอกช่อง 【...】 ให้ครบถ้วน ทบทวนรายการภาคผนวก และลงนามหลังจากสำนักงานกฎหมาย (Law Firm) อนุมัติแล้วเท่านั้น\"></span></p><p><em>CƠ SỞ THAM CHIẾU NỘI BỘ: HĐ Nguyên tắc CPV số 012516150-00 (áp dụng năm 2026); các hợp đồng thực tế KSP–Phương Nam, Hoàn Tuấn Thành, Mai Tiến Phát, GEA. Điều khoản khách hàng không được sao chép nguyên văn nếu không phù hợp quyền/nghĩa vụ của bên bán.</em><span class=\"th\" data-t=\"ฐานอ้างอิงภายใน: สัญญาหลักการ (HĐ Nguyên tắc) CPV เลขที่ 012516150-00 (ใช้ในปี 2026); สัญญาจริงของ KSP–Phương Nam, Hoàn Tuấn Thành, Mai Tiến Phát, GEA ข้อกำหนดของลูกค้าต้องไม่ถูกคัดลอกตามถ้อยคำเดิม หากไม่เหมาะสมกับสิทธิ/ภาระผูกพันของฝ่ายผู้ขาย\"></span></p><p><em><strong>DỰ THẢO ĐỂ TEAM MUA HÀNG &amp; LAW FIRM ĐÁNH GIÁ – KHÔNG DÙNG KÝ KẾT TRƯỚC KHI HOÀN THIỆN</strong></em><span class=\"th\" data-t=\"ร่างสำหรับทีมจัดซื้อและสำนักงานกฎหมาย (Law Firm) ประเมิน – ห้ามใช้ลงนามก่อนดำเนินการให้สมบูรณ์\"></span></p>", "sm": "<p class=\"ctr\"><strong>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</strong><span class=\"th\" data-t=\"สาธารณรัฐสังคมนิยมเวียดนาม\"></span></p><p class=\"ctr\"><strong>Độc lập - Tự do - Hạnh phúc</strong><span class=\"th\" data-t=\"เอกราช - เสรีภาพ - ความสุข\"></span></p><p class=\"ctr\"><strong>HỢP ĐỒNG NGUYÊN TẮC MUA BÁN HÀNG HÓA / GIA CÔNG</strong><span class=\"th\" data-t=\"สัญญาหลักการซื้อขายสินค้า / การจ้างผลิต\"></span></p><p class=\"ctr\"><strong>ÁP DỤNG CHO ĐƠN GIÁ GIỮ ỔN ĐỊNH DÀI HẠN</strong><span class=\"th\" data-t=\"ใช้กับราคาต่อหน่วยที่คงที่ในระยะยาว\"></span></p><p class=\"ctr\">KSP STANDARD • DỰ THẢO CHO CÔNG TY LUẬT RÀ SOÁT<span class=\"th\" data-t=\"KSP STANDARD • ร่างสำหรับสำนักงานกฎหมายทบทวน\"></span></p><p class=\"ctr\"><strong>SỐ: <span class=\"fx\" data-k=\"SỐ HỢP ĐỒNG\"></span></strong><span class=\"th\" data-t=\"เลขที่: 【SỐ HỢP ĐỒNG】\"></span></p><p class=\"ctr\"><strong>THỜI GIAN GIỮ GIÁ: <span class=\"fx\" data-k=\"TỪ NGÀY\"></span> – <span class=\"fx\" data-k=\"ĐẾN NGÀY\"></span></strong><span class=\"th\" data-t=\"ระยะเวลาคงราคา: 【TỪ NGÀY】 – 【ĐẾN NGÀY】\"></span></p><p class=\"ctr\"><strong>NHÓM HÀNG / DỊCH VỤ: <span class=\"fx\" data-k=\"MÔ TẢ\"></span></strong><span class=\"th\" data-t=\"กลุ่มสินค้า / บริการ: 【MÔ TẢ】\"></span></p><p class=\"ctr\"><strong>GIỮA</strong><span class=\"th\" data-t=\"ระหว่าง\"></span></p><p class=\"ctr\"><strong>CÔNG TY TNHH KSP VIỆT NAM</strong><span class=\"th\" data-t=\"บริษัท KSP เวียดนาม จำกัด (CÔNG TY TNHH KSP VIỆT NAM)\"></span></p><p class=\"ctr\"><strong>VÀ</strong><span class=\"th\" data-t=\"และ\"></span></p><p class=\"ctr\"><strong><span class=\"fx\" data-k=\"TÊN PHÁP LÝ NHÀ CUNG CẤP\"></span></strong></p><p class=\"ctr\"><strong>LỰA CHỌN PHẠM VI: <span class=\"fx\" data-k=\"HÀNG HÓA / GIA CÔNG / CẢ HAI\"></span></strong><span class=\"th\" data-t=\"ทางเลือกขอบเขต: 【HÀNG HÓA / GIA CÔNG / CẢ HAI】\"></span></p><p class=\"ctr\"><strong>KHÔNG ĐƯỢC KÝ KHI CÒN LỰA CHỌN / Ô TRỐNG CHƯA HOÀN TẤT</strong><span class=\"th\" data-t=\"ห้ามลงนามเมื่อยังมีทางเลือก / ช่องว่างที่ยังไม่เสร็จสมบูรณ์\"></span></p><p class=\"ctr\"><strong>HỢP ĐỒNG NGUYÊN TẮC</strong><span class=\"th\" data-t=\"สัญญาหลักการ\"></span></p><p>Căn cứ Bộ luật Dân sự 91/2015/QH13 và Luật Thương mại 36/2005/QH11, cùng văn bản sửa đổi có hiệu lực và luật liên quan trong phạm vi áp dụng.<span class=\"th\" data-t=\"อาศัยอำนาจตามประมวลกฎหมายแพ่ง ฉบับที่ 91/2015/QH13 และกฎหมายการพาณิชย์ ฉบับที่ 36/2005/QH11 ตลอดจนเอกสารแก้ไขเพิ่มเติมที่มีผลบังคับใช้ และกฎหมายที่เกี่ยวข้องในขอบเขตที่ใช้บังคับ\"></span></p><p>Hôm nay, ngày <strong><span class=\"fx\" data-k=\"NGÀY/THÁNG/NĂM\"></span></strong>, tại <strong><span class=\"fx\" data-k=\"ĐỊA ĐIỂM\"></span></strong>, các Bên gồm:<span class=\"th\" data-t=\"วันนี้ ณ วันที่ 【NGÀY/THÁNG/NĂM】 ณ 【ĐỊA ĐIỂM】 คู่สัญญา ประกอบด้วย:\"></span></p><p>BÊN A / BÊN MUA: CÔNG TY TNHH KSP VIỆT NAM<span class=\"th\" data-t=\"ฝ่าย A / ผู้ซื้อ: บริษัท KSP เวียดนาม จำกัด (CÔNG TY TNHH KSP VIỆT NAM)\"></span></p><p>Đơn vị/Chi nhánh <strong><span class=\"fx\" data-k=\"...\"></span></strong>; Mã số thuế <strong><span class=\"fx\" data-k=\"...\"></span></strong>; Địa chỉ <strong><span class=\"fx\" data-k=\"ĐIỀN THEO GIẤY ĐKKD\"></span></strong><span class=\"th\" data-t=\"หน่วย/สาขา 【...】; เลขประจำตัวผู้เสียภาษี 【...】; ที่อยู่ 【ĐIỀN THEO GIẤY ĐKKD】\"></span></p><p>Đại diện <strong><span class=\"fx\" data-k=\"...\"></span></strong>; Chức vụ <strong><span class=\"fx\" data-k=\"...\"></span></strong>; Thẩm quyền ký <strong><span class=\"fx\" data-k=\"...\"></span></strong><span class=\"th\" data-t=\"ผู้แทน 【...】; ตำแหน่ง 【...】; อำนาจลงนาม 【...】\"></span></p><p>BÊN B / NHÀ CUNG CẤP: <strong><span class=\"fx\" data-k=\"TÊN PHÁP LÝ\"></span></strong><span class=\"th\" data-t=\"ฝ่าย B / ผู้ขาย/ผู้จัดหา: 【TÊN PHÁP LÝ】\"></span></p><p>Mã số thuế <strong><span class=\"fx\" data-k=\"...\"></span></strong>; Địa chỉ <strong><span class=\"fx\" data-k=\"...\"></span></strong>; Tài khoản / Ngân hàng <strong><span class=\"fx\" data-k=\"...\"></span></strong><span class=\"th\" data-t=\"เลขประจำตัวผู้เสียภาษี 【...】; ที่อยู่ 【...】; บัญชี / ธนาคาร 【...】\"></span></p><p>Đại diện <strong><span class=\"fx\" data-k=\"...\"></span></strong>; Chức vụ <strong><span class=\"fx\" data-k=\"...\"></span></strong>; Thẩm quyền ký <strong><span class=\"fx\" data-k=\"...\"></span></strong><span class=\"th\" data-t=\"ผู้แทน 【...】; ตำแหน่ง 【...】; อำนาจลงนาม 【...】\"></span></p><h3 class=\"art\" data-n=\"1\"><strong>ĐIỀU 1. PHẠM VI VÀ BẢN CHẤT HỢP ĐỒNG</strong><span class=\"th\" data-t=\"ข้อ 1 ขอบเขตและลักษณะของสัญญา\"></span></h3><p>Bên A là CÔNG TY TNHH KSP VIỆT NAM (Bên mua/Bên thuê gia công); Bên B là <strong><span class=\"fx\" data-k=\"TÊN PHÁP LÝ NHÀ CUNG CẤP\"></span></strong> (Bên bán/Bên nhận gia công). Loại giao dịch áp dụng: <strong><span class=\"fx\" data-k=\"CHỌN MỘT: MUA HÀNG HÓA / GIA CÔNG BẰNG VẬT TƯ KSP / CẢ HAI (CÓ PHỤ LỤC RIÊNG)\"></span></strong>. Đối với mỗi giao dịch, phạm vi cụ thể xác định tại PO, Phụ lục 01 và Phụ lục 02 đã xác nhận.<span class=\"th\" data-t=\"ฝ่าย A คือบริษัท KSP เวียดนาม จำกัด (ผู้ซื้อ/ผู้ว่าจ้างผลิต) ฝ่าย B คือ 【TÊN PHÁP LÝ NHÀ CUNG CẤP】 (ผู้ขาย/ผู้รับจ้างผลิต) ประเภทธุรกรรมที่ใช้: 【CHỌN MỘT: MUA HÀNG HÓA / GIA CÔNG BẰNG VẬT TƯ KSP / CẢ HAI (CÓ PHỤ LỤC RIÊNG)】 สำหรับแต่ละธุรกรรม ขอบเขตเฉพาะให้กำหนดใน PO ภาคผนวก 01 และภาคผนวก 02 ที่ได้รับการยืนยันแล้ว\"></span></p><p>Hợp đồng này là khung điều kiện chung cho các PO trong thời hạn hiệu lực. Trừ khi Phụ lục 01 ghi rõ mức mua tối thiểu có chữ ký hợp lệ, Bên A không cam kết số lượng mua tối thiểu, doanh thu tối thiểu hoặc độc quyền; dự báo nhu cầu chỉ có tính tham khảo.<span class=\"th\" data-t=\"สัญญานี้เป็นกรอบเงื่อนไขทั่วไปสำหรับ PO ต่าง ๆ ในระหว่างระยะเวลาที่สัญญามีผลบังคับ เว้นแต่ภาคผนวก 01 จะระบุไว้อย่างชัดเจนถึงปริมาณซื้อขั้นต่ำที่มีการลงนามโดยชอบ ฝ่าย A ไม่ผูกพันปริมาณซื้อขั้นต่ำ รายได้ขั้นต่ำ หรือการให้สิทธิแต่ผู้เดียว การพยากรณ์ความต้องการใช้เป็นเพียงข้อมูลอ้างอิง\"></span></p><h3 class=\"art\" data-n=\"2\"><strong>ĐIỀU 2. ĐƠN ĐẶT HÀNG (PO) VÀ XÁC NHẬN</strong><span class=\"th\" data-t=\"ข้อ 2 ใบสั่งซื้อ (PO) และการยืนยัน\"></span></h3><p>Mỗi PO do người có thẩm quyền của Bên A phát hành phải nêu mã hàng/quy cách, số lượng, đơn giá áp dụng, VAT, địa điểm, tiến độ và hồ sơ giao nhận. Bên B xác nhận chấp nhận hoặc đề nghị sửa PO bằng văn bản trong <strong><span class=\"fx\" data-k=\"02\"></span></strong> ngày làm việc. Im lặng không được coi là chấp nhận; Bên B không được giao hoặc gia công vượt PO đã xác nhận.<span class=\"th\" data-t=\"PO แต่ละฉบับที่ออกโดยผู้มีอำนาจของฝ่าย A ต้องระบุรหัสสินค้า/ข้อกำหนดเฉพาะ จำนวน ราคาต่อหน่วยที่ใช้ ภาษีมูลค่าเพิ่ม (VAT) สถานที่ กำหนดการ และเอกสารการส่งมอบ-รับมอบ ฝ่าย B ต้องยืนยันการยอมรับหรือเสนอขอแก้ไข PO เป็นลายลักษณ์อักษรภายใน 【02】 วันทำการ การนิ่งเฉยไม่ถือว่าเป็นการยอมรับ ฝ่าย B ห้ามส่งมอบหรือผลิตเกินกว่า PO ที่ได้รับการยืนยัน\"></span></p><p>Điều kiện riêng trong báo giá, phiếu giao hàng, hóa đơn hoặc điều khoản tiêu chuẩn của Bên B không thay thế Hợp đồng này trừ khi người được ủy quyền hợp lệ của hai Bên đồng ý bằng văn bản nêu rõ điều khoản được thay thế.<span class=\"th\" data-t=\"เงื่อนไขเฉพาะในใบเสนอราคา ใบส่งสินค้า ใบแจ้งหนี้/ใบกำกับภาษี หรือข้อกำหนดมาตรฐานของฝ่าย B ไม่อาจแทนที่สัญญานี้ได้ เว้นแต่ผู้ที่ได้รับมอบอำนาจโดยชอบของทั้งสองฝ่ายตกลงเป็นลายลักษณ์อักษรโดยระบุให้ชัดเจนถึงข้อกำหนดที่ถูกแทนที่\"></span></p><h3 class=\"art\" data-n=\"3\"><strong>ĐIỀU 3. BẢNG GIÁ VÀ CAM KẾT GIỮ GIÁ DÀI HẠN</strong><span class=\"th\" data-t=\"ข้อ 3 ตารางราคาและข้อผูกพันคงราคาระยะยาว\"></span></h3><p>Đơn giá tại Phụ lục 01 là GIÁ RÀNG BUỘC trong thời gian từ <strong><span class=\"fx\" data-k=\"NGÀY BẮT ĐẦU\"></span></strong> đến hết <strong><span class=\"fx\" data-k=\"NGÀY KẾT THÚC\"></span></strong>, không phải giá tham khảo. Trong thời gian giữ giá, Bên B phải thực hiện các PO hợp lệ theo giá và công suất/lead time cam kết tại Phụ lục 01–02; không được đơn phương báo giá lại, thêm phụ phí hoặc đổi đơn vị tính.<span class=\"th\" data-t=\"ราคาต่อหน่วยในภาคผนวก 01 เป็นราคาผูกพัน ในระหว่างตั้งแต่ 【NGÀY BẮT ĐẦU】 จนถึงสิ้นสุด 【NGÀY KẾT THÚC】 ไม่ใช่ราคาอ้างอิง ในระหว่างระยะเวลาคงราคา ฝ่าย B ต้องปฏิบัติตาม PO ที่ถูกต้องตามราคา และกำลังการผลิต/lead time ที่ผูกพันไว้ในภาคผนวก 01–02 ห้ามเสนอราคาใหม่ฝ่ายเดียว เพิ่มค่าธรรมเนียมเพิ่มเติม หรือเปลี่ยนหน่วยนับ\"></span></p><p>Giá bao gồm các khoản chi phí đã liệt kê tại Phụ lục 01 (đóng gói, kiểm tra, vận chuyển, bốc dỡ, bảo hiểm, chứng từ…). Các khoản không bao gồm phải liệt kê từng loại, mức tiền và điều kiện áp dụng; khoản không ghi rõ được coi là đã bao gồm, trừ nghĩa vụ bắt buộc theo pháp luật. VAT áp dụng theo pháp luật tại thời điểm lập hóa đơn và thể hiện riêng nếu cần.<span class=\"th\" data-t=\"ราคารวมค่าใช้จ่ายต่าง ๆ ที่ระบุไว้ในภาคผนวก 01 (การบรรจุหีบห่อ การตรวจสอบ การขนส่ง การขนถ่าย การประกันภัย เอกสาร…) รายการที่ไม่รวมต้องระบุเป็นรายประเภท พร้อมจำนวนเงินและเงื่อนไขการใช้ รายการที่ไม่ได้ระบุไว้อย่างชัดเจนถือว่ารวมอยู่แล้ว เว้นแต่เป็นภาระผูกพันที่กฎหมายบังคับ ภาษีมูลค่าเพิ่ม (VAT) ให้เป็นไปตามกฎหมายณ เวลาที่ออกใบกำกับภาษี และแสดงแยกต่างหากหากจำเป็น\"></span></p><h3 class=\"art\" data-n=\"4\"><strong>ĐIỀU 4. ĐIỀU CHỈNH GIÁ – CHỈ KHI ĐƯỢC CHỌN</strong><span class=\"th\" data-t=\"ข้อ 4 การปรับราคา – เฉพาะเมื่อได้เลือกไว้\"></span></h3><p>CHỌN MỘT: <strong><span class=\"fx\" data-k=\"A – GIÁ CỐ ĐỊNH, KHÔNG ĐIỀU CHỈNH TRONG KỲ\"></span></strong> hoặc <strong><span class=\"fx\" data-k=\"B – CƠ CHẾ CHỈ SỐ TẠI PHỤ LỤC 01\"></span></strong>. Nếu chọn B, phải điền đủ chỉ số khách quan, nguồn công bố, giá gốc, kỳ bình quân, ngưỡng biến động <strong><span class=\"fx\" data-k=\"±10%\"></span></strong>, thời gian duy trì <strong><span class=\"fx\" data-k=\"30\"></span></strong> ngày, tần suất rà soát <strong><span class=\"fx\" data-k=\"QUÝ\"></span></strong>, tỷ trọng nguyên liệu, công thức điều chỉnh tăng VÀ giảm và mức trần thay đổi <strong><span class=\"fx\" data-k=\"%\"></span></strong>; không để trống hoặc thay bằng “thỏa thuận sau”.<span class=\"th\" data-t=\"เลือกหนึ่ง: 【A – GIÁ CỐ ĐỊNH, KHÔNG ĐIỀU CHỈNH TRONG KỲ】 หรือ 【B – CƠ CHẾ CHỈ SỐ TẠI PHỤ LỤC 01】 หากเลือก B ต้องกรอกให้ครบถ้วนซึ่งดัชนีที่เป็นภววิสัย แหล่งเผยแพร่ ราคาฐาน ช่วงเวลาเฉลี่ย เกณฑ์ความผันผวน 【±10%】 ระยะเวลาคงอยู่ 【30】 วัน ความถี่ในการทบทวน 【QUÝ】 สัดส่วนวัตถุดิบ สูตรปรับทั้งขึ้นและลง และเพดานการเปลี่ยนแปลง 【%】 ห้ามเว้นว่างหรือแทนที่ด้วย “ตกลงกันภายหลัง”\"></span></p><p>Không có sửa đổi giá tự động. Giá mới chỉ có hiệu lực cho PO phát hành sau ngày ký Phụ lục điều chỉnh bởi đại diện có thẩm quyền của cả hai Bên. Mọi PO đã được chấp nhận trước thời điểm đó giữ nguyên giá, tiến độ và điều kiện, trừ khi hai Bên thỏa thuận riêng hợp pháp. Trong thời gian thương lượng, Bên B phải thực hiện các PO đã xác nhận.<span class=\"th\" data-t=\"ไม่มีการแก้ไขราคาโดยอัตโนมัติ ราคาใหม่มีผลเฉพาะ PO ที่ออกภายหลังวันที่ผู้แทนผู้มีอำนาจของทั้งสองฝ่ายลงนามในภาคผนวกการปรับราคา PO ทุกฉบับที่ได้รับการยอมรับก่อนเวลาดังกล่าวคงราคา กำหนดการ และเงื่อนไขเดิม เว้นแต่ทั้งสองฝ่ายจะตกลงแยกต่างหากโดยชอบด้วยกฎหมาย ในระหว่างการเจรจา ฝ่าย B ต้องปฏิบัติตาม PO ที่ได้ยืนยันแล้ว\"></span></p><h3 class=\"art\" data-n=\"5\"><strong>ĐIỀU 5. NĂNG LỰC CUNG ỨNG VÀ THỜI HẠN GIAO HÀNG</strong><span class=\"th\" data-t=\"ข้อ 5 กำลังการจัดหาและกำหนดเวลาส่งมอบ\"></span></h3><p>Bên B duy trì năng lực tối thiểu <strong><span class=\"fx\" data-k=\"CÔNG SUẤT/THÁNG\"></span></strong> và thời gian giao hàng tiêu chuẩn <strong><span class=\"fx\" data-k=\"SỐ NGÀY\"></span></strong> theo Phụ lục 02 đối với lượng PO thuộc phạm vi năng lực đã cam kết. Nếu có nguy cơ thiếu hàng hoặc chậm tiến độ, Bên B thông báo ngay trong <strong><span class=\"fx\" data-k=\"01\"></span></strong> ngày làm việc, nêu nguyên nhân, số lượng ảnh hưởng và kế hoạch khắc phục, nhưng thông báo không tự động gia hạn.<span class=\"th\" data-t=\"ฝ่าย B รักษากำลังการผลิตขั้นต่ำ 【CÔNG SUẤT/THÁNG】 และระยะเวลาส่งมอบมาตรฐาน 【SỐ NGÀY】 ตามภาคผนวก 02 สำหรับปริมาณ PO ที่อยู่ในขอบเขตกำลังการผลิตที่ผูกพันไว้ หากมีความเสี่ยงที่จะขาดสินค้าหรือล่าช้า ฝ่าย B ต้องแจ้งทันทีภายใน 【01】 วันทำการ โดยระบุสาเหตุ จำนวนที่ได้รับผลกระทบ และแผนการแก้ไข ทั้งนี้ การแจ้งดังกล่าวไม่ทำให้กำหนดเวลาขยายออกโดยอัตโนมัติ\"></span></p><p>Địa điểm, phương thức, việc bốc dỡ và người chịu chi phí giao hàng xác định tại PO/Phụ lục 02. Bên B chỉ được giao sớm, giao từng phần, giao thay thế hoặc chuyển địa điểm khi Bên A chấp thuận trước bằng văn bản.<span class=\"th\" data-t=\"สถานที่ วิธีการ การขนถ่าย และผู้รับภาระค่าใช้จ่ายในการส่งมอบ ให้กำหนดตาม PO/ภาคผนวก 02 ฝ่าย B จะส่งมอบก่อนกำหนด ส่งมอบเป็นงวด ส่งมอบสินค้าทดแทน หรือเปลี่ยนสถานที่ส่งมอบได้ต่อเมื่อฝ่าย A ให้ความเห็นชอบล่วงหน้าเป็นลายลักษณ์อักษร\"></span></p><h3 class=\"art\" data-n=\"6\"><strong>ĐIỀU 6. KIỂM TRA, NGHIỆM THU VÀ HÀNG KHÔNG PHÙ HỢP</strong><span class=\"th\" data-t=\"ข้อ 6 การตรวจสอบ การตรวจรับ และสินค้าที่ไม่สอดคล้อง\"></span></h3><p>Bên A kiểm tra số lượng, tình trạng bên ngoài trong <strong><span class=\"fx\" data-k=\"03\"></span></strong> ngày làm việc sau giao hàng; việc ký phiếu giao nhận không đồng nghĩa chấp nhận chất lượng ẩn hoặc miễn trách nhiệm bảo hành. Yêu cầu kỹ thuật, CO/CQ, chứng chỉ, mẫu duyệt và tiêu chí thử nghiệm được quy định tại Phụ lục 02/PO.<span class=\"th\" data-t=\"ฝ่าย A ตรวจสอบจำนวนและสภาพภายนอกภายใน 【03】 วันทำการหลังส่งมอบสินค้า การลงนามในใบส่งมอบ-รับมอบไม่ถือเป็นการยอมรับคุณภาพที่แอบแฝงหรือการยกเว้นความรับผิดในการรับประกัน ข้อกำหนดทางเทคนิค CO/CQ ใบรับรอง ตัวอย่างที่ได้รับอนุมัติ และเกณฑ์การทดสอบ กำหนดไว้ในภาคผนวก 02/PO\"></span></p><p>Bên A có quyền yêu cầu Bên B, bằng chi phí của Bên B, sửa chữa, đổi hàng, giao bổ sung hoặc hoàn lại khoản tiền đã trả cho phần không phù hợp trong <strong><span class=\"fx\" data-k=\"07\"></span></strong> ngày hoặc thời gian cấp bách <strong><span class=\"fx\" data-k=\"GIỜ/NGÀY\"></span></strong> theo Phụ lục 02; nếu Bên B không khắc phục hợp lệ, Bên A có thể mua thay thế và yêu cầu chi phí hợp lý có chứng từ do lỗi Bên B.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิเรียกให้ฝ่าย B ด้วยค่าใช้จ่ายของฝ่าย B ซ่อมแซม เปลี่ยนสินค้า ส่งมอบเพิ่มเติม หรือคืนเงินที่ชำระแล้วสำหรับส่วนที่ไม่สอดคล้อง ภายใน 【07】 วัน หรือระยะเวลาเร่งด่วน 【GIỜ/NGÀY】 ตามภาคผนวก 02 หากฝ่าย B ไม่แก้ไขให้ถูกต้อง ฝ่าย A อาจซื้อสินค้าทดแทนและเรียกค่าใช้จ่ายที่สมเหตุสมผลซึ่งมีเอกสารประกอบอันเกิดจากความผิดของฝ่าย B\"></span></p><h3 class=\"art\" data-n=\"7\"><strong>ĐIỀU 7. CHUYỂN RỦI RO VÀ QUYỀN SỞ HỮU</strong><span class=\"th\" data-t=\"ข้อ 7 การโอนความเสี่ยงและกรรมสิทธิ์\"></span></h3><p>Đối với hàng hóa Bên B bán, quyền sở hữu chuyển cho Bên A khi bàn giao hợp lệ theo PO và không có quyền của bên thứ ba; rủi ro tổn thất vật chất chuyển tại thời điểm giao nhận thực tế ở địa điểm đã thỏa thuận, trừ khi các Bên ghi khác. Quyền khiếu nại lỗi ẩn, sai quy cách và bảo hành vẫn được bảo lưu.<span class=\"th\" data-t=\"สำหรับสินค้าที่ฝ่าย B ขาย กรรมสิทธิ์โอนไปยังฝ่าย A เมื่อมีการส่งมอบที่ชอบตาม PO และไม่มีสิทธิของบุคคลภายนอก ความเสี่ยงต่อความสูญเสียทางกายภาพโอน ณ เวลาที่ส่งมอบ-รับมอบจริง ณ สถานที่ที่ตกลงกัน เว้นแต่คู่สัญญาจะระบุไว้เป็นอย่างอื่น สิทธิในการร้องเรียนข้อบกพร่องแอบแฝง การผิดข้อกำหนดเฉพาะ และการรับประกัน ยังคงได้รับการสงวนไว้\"></span></p><p>Đối với vật tư, cấu kiện, khuôn, bản vẽ hoặc bán thành phẩm do Bên A giao để gia công, quyền sở hữu luôn thuộc Bên A. Bên B phải tách riêng, ghi mã nhận diện, kiểm kê, bảo quản và không cầm cố, bán, sử dụng cho bên khác hoặc định đoạt tài sản đó trái pháp luật. Mọi quyền giữ tài sản nếu có theo luật phải được xử lý đúng pháp luật, có thông báo, đối chiếu khoản nợ và cơ chế giải quyết tranh chấp; không mặc nhiên có quyền tự bán tài sản Bên A.<span class=\"th\" data-t=\"สำหรับวัสดุ ชิ้นส่วน แม่พิมพ์ แบบแปลน หรือกึ่งสำเร็จรูปที่ฝ่าย A ส่งมอบเพื่อการผลิต กรรมสิทธิ์เป็นของฝ่าย A เสมอ ฝ่าย B ต้องแยกเก็บต่างหาก ระบุรหัสแสดงตัว ตรวจนับ ดูแลรักษา และไม่นำไปจำนำ ขาย ใช้เพื่อบุคคลอื่น หรือจำหน่ายจ่ายโอนทรัพย์สินดังกล่าวโดยฝ่าฝืนกฎหมาย สิทธิยึดหน่วงทรัพย์สิน (ถ้ามี) ตามกฎหมายต้องดำเนินการให้ถูกต้องตามกฎหมาย โดยมีการแจ้ง การตรวจสอบกระทบยอดหนี้ และกลไกระงับข้อพิพาท ฝ่าย B ไม่มีสิทธิโดยปริยายในการขายทรัพย์สินของฝ่าย A เอง\"></span></p><h3 class=\"art\" data-n=\"8\"><strong>ĐIỀU 8. THANH TOÁN VÀ CHỨNG TỪ</strong><span class=\"th\" data-t=\"ข้อ 8 การชำระเงินและเอกสาร\"></span></h3><p>Điều kiện thanh toán chuẩn: <strong><span class=\"fx\" data-k=\"30 / 45 / 60\"></span></strong> ngày kể từ khi Bên A nhận đủ hàng/dịch vụ được nghiệm thu phù hợp và chứng từ hợp lệ (PO, phiếu giao nhận, biên bản nghiệm thu/phiếu cân được xác nhận, hóa đơn GTGT hợp pháp và chứng chỉ theo PO). Không tính thời hạn từ ngày hóa đơn nếu hàng chưa được giao đủ hoặc hồ sơ sai do Bên B.<span class=\"th\" data-t=\"เงื่อนไขการชำระเงินมาตรฐาน: 【30 / 45 / 60】 วันนับแต่ฝ่าย A ได้รับสินค้า/บริการครบถ้วนที่ผ่านการตรวจรับอย่างเหมาะสม และเอกสารที่ถูกต้อง (PO ใบส่งมอบ-รับมอบ รายงานการตรวจรับ/ใบชั่งน้ำหนักที่ได้รับการยืนยัน ใบกำกับภาษีมูลค่าเพิ่มที่ถูกต้องตามกฎหมาย และใบรับรองตาม PO) ไม่นับระยะเวลาจากวันที่ในใบแจ้งหนี้/ใบกำกับภาษี หากสินค้ายังส่งมอบไม่ครบหรือเอกสารผิดพลาดเนื่องจากฝ่าย B\"></span></p><p>Bên A phải thông báo phần chứng từ thiếu/sai trong <strong><span class=\"fx\" data-k=\"05\"></span></strong> ngày làm việc sau khi kiểm tra. Đối với khoản thanh toán có tranh chấp có căn cứ, Bên A thông báo bằng văn bản và thanh toán đúng hạn phần không tranh chấp. Lãi chậm trả (nếu có) chỉ tính trên số tiền quá hạn thực tế, theo thỏa thuận hợp pháp hoặc pháp luật; không được cộng tự động phụ phí vào hóa đơn PO khác.<span class=\"th\" data-t=\"ฝ่าย A ต้องแจ้งส่วนของเอกสารที่ขาด/ผิดภายใน 【05】 วันทำการหลังการตรวจสอบ สำหรับการชำระเงินที่มีข้อพิพาทโดยมีเหตุผลรองรับ ฝ่าย A แจ้งเป็นลายลักษณ์อักษรและชำระส่วนที่ไม่มีข้อพิพาทตรงตามกำหนด ดอกเบี้ยชำระล่าช้า (ถ้ามี) คิดเฉพาะจากจำนวนเงินที่เกินกำหนดจริง ตามข้อตกลงที่ชอบด้วยกฎหมายหรือตามกฎหมาย ห้ามบวกค่าธรรมเนียมเพิ่มเติมโดยอัตโนมัติเข้าในใบแจ้งหนี้/ใบกำกับภาษีของ PO อื่น\"></span></p><h3 class=\"art\" data-n=\"9\"><strong>ĐIỀU 9. TẠM ỨNG VÀ BẢO ĐẢM</strong><span class=\"th\" data-t=\"ข้อ 9 เงินล่วงหน้าและหลักประกัน\"></span></h3><p>Nguyên tắc không tạm ứng, trừ trường hợp <strong><span class=\"fx\" data-k=\"SỐ PO / TỶ LỆ\"></span></strong> được phê duyệt tại Phụ lục 03/06. Nếu tạm ứng, Bên B cung cấp bảo lãnh hoàn trả tạm ứng hợp lệ từ ngân hàng Bên A chấp thuận, có hiệu lực tới khi thu hồi hết số dư và thời gian dự phòng <strong><span class=\"fx\" data-k=\"30\"></span></strong> ngày, trừ trường hợp miễn bảo lãnh được phê duyệt theo quy trình nội bộ và ghi nhận rõ điều kiện bảo vệ thay thế.<span class=\"th\" data-t=\"หลักการคือไม่มีเงินล่วงหน้า เว้นแต่กรณี 【SỐ PO / TỶ LỆ】 ที่ได้รับอนุมัติตามภาคผนวก 03/06 หากมีเงินล่วงหน้า ฝ่าย B ต้องจัดหาหนังสือค้ำประกันการคืนเงินล่วงหน้าที่ถูกต้องจากธนาคารที่ฝ่าย A เห็นชอบ มีผลจนกว่าจะได้รับคืนยอดคงเหลือครบถ้วนและมีระยะเวลาสำรองเพิ่มอีก 【30】 วัน เว้นแต่กรณียกเว้นหนังสือค้ำประกันที่ได้รับอนุมัติตามขั้นตอนภายในและมีการบันทึกเงื่อนไขการคุ้มครองทดแทนไว้อย่างชัดเจน\"></span></p><p>Bảo lãnh thực hiện, bảo hành, giữ lại tiền và bảo hiểm chỉ áp dụng theo từng nhóm hàng/rủi ro, ghi cụ thể số tiền, thời điểm nộp, thời hạn và điều kiện giải tỏa tại Phụ lục 03; không tự động áp dụng tất cả cho mọi nhà cung cấp.<span class=\"th\" data-t=\"หนังสือค้ำประกันการปฏิบัติตามสัญญา การรับประกัน เงินประกันผลงานที่กักไว้ และการประกันภัย ให้ใช้บังคับเฉพาะตามกลุ่มสินค้า/ความเสี่ยงแต่ละกลุ่ม โดยระบุจำนวนเงิน เวลาที่ต้องส่งมอบ ระยะเวลา และเงื่อนไขการปลดภาระอย่างเฉพาะเจาะจงไว้ในภาคผนวก 03 ทั้งนี้ไม่ใช้บังคับทั้งหมดกับผู้ขายทุกรายโดยอัตโนมัติ\"></span></p><h3 class=\"art\" data-n=\"10\"><strong>ĐIỀU 10. BẢO HÀNH VÀ KHIẾU NẠI</strong><span class=\"th\" data-t=\"ข้อ 10. การรับประกันและการเรียกร้อง\"></span></h3><p>Bên B bảo đảm hàng mới 100%, đúng nguồn gốc, tiêu chuẩn, công năng và không có lỗi vật liệu/chế tạo, trừ khi PO ghi rõ tình trạng khác được Bên A chấp thuận. Thời hạn bảo hành là <strong><span class=\"fx\" data-k=\"12 / 24 / SỐ THÁNG\"></span></strong> tháng từ ngày Bên A nghiệm thu hàng tại địa điểm sử dụng hoặc mốc được xác định tại Phụ lục 02, không mặc nhiên bắt đầu tại ngày xuất xưởng.<span class=\"th\" data-t=\"ฝ่าย B รับรองว่าสินค้าเป็นของใหม่ 100% มีแหล่งกำเนิด มาตรฐาน และสมรรถนะการใช้งานถูกต้อง และไม่มีข้อบกพร่องด้านวัสดุ/การผลิต เว้นแต่ใน PO ระบุสภาพอื่นอย่างชัดเจนซึ่งฝ่าย A ได้ให้ความเห็นชอบ ระยะเวลาการรับประกันคือ 【12 / 24 / SỐ THÁNG】 เดือน นับจากวันที่ฝ่าย A ตรวจรับสินค้า ณ สถานที่ใช้งาน หรือจากช่วงเวลาที่กำหนดไว้ในภาคผนวก 02 ทั้งนี้ ไม่ถือโดยปริยายว่าเริ่มนับตั้งแต่วันที่สินค้าออกจากโรงงาน\"></span></p><p>Bên B phản hồi trong <strong><span class=\"fx\" data-k=\"24\"></span></strong> giờ đối với sự cố nghiêm trọng và <strong><span class=\"fx\" data-k=\"02\"></span></strong> ngày làm việc đối với lỗi thông thường; hoàn thành sửa/chuyển hàng thay thế trong <strong><span class=\"fx\" data-k=\"SỐ NGÀY\"></span></strong>; chi phí kiểm tra, vận chuyển, tháo dỡ, thay thế, thử lại thuộc trách nhiệm Bên B nếu lỗi của Bên B. Quyền bảo hành của KSP đối với nhà cung cấp không phụ thuộc duy nhất vào bảo hành nhà sản xuất.<span class=\"th\" data-t=\"ฝ่าย B ต้องตอบกลับภายใน 【24】 ชั่วโมงสำหรับเหตุขัดข้องร้ายแรง และภายใน 【02】 วันทำการสำหรับข้อบกพร่องทั่วไป และต้องดำเนินการซ่อมหรือส่งมอบสินค้าทดแทนให้แล้วเสร็จภายใน 【SỐ NGÀY】 ค่าใช้จ่ายในการตรวจสอบ ขนส่ง รื้อถอน เปลี่ยนทดแทน และทดสอบซ้ำ เป็นความรับผิดชอบของฝ่าย B หากเป็นความผิดของฝ่าย B สิทธิในการรับประกันของ KSP ต่อผู้ขายไม่ขึ้นอยู่กับการรับประกันของผู้ผลิตแต่เพียงอย่างเดียว\"></span></p><h3 class=\"art\" data-n=\"11\"><strong>ĐIỀU 11. PHẠT VI PHẠM VÀ BỒI THƯỜNG</strong><span class=\"th\" data-t=\"ข้อ 11. ค่าปรับตามสัญญาและการชดใช้ค่าเสียหาย\"></span></h3><p>Trường hợp Bên B giao trễ do lỗi của mình: phạt <strong><span class=\"fx\" data-k=\"0,1\"></span></strong>%/ngày trên GIÁ TRỊ PHẦN HÀNG/NGHĨA VỤ GIAO TRỄ, không mặc nhiên trên toàn bộ Hợp đồng khung. Tổng phạt đối với phần nghĩa vụ bị vi phạm không vượt mức pháp luật bắt buộc áp dụng (tham chiếu Điều 301 Luật Thương mại, nếu thuộc phạm vi điều chỉnh).<span class=\"th\" data-t=\"กรณีฝ่าย B ส่งมอบล่าช้าโดยความผิดของตน: ค่าปรับ 【0,1】 %/วัน คำนวณจากมูลค่าส่วนของสินค้า/ภาระหน้าที่ที่ส่งมอบล่าช้า ไม่ถือโดยปริยายว่าคำนวณจากมูลค่าสัญญากรอบทั้งหมด ค่าปรับรวมสำหรับส่วนภาระหน้าที่ที่ฝ่าฝืนต้องไม่เกินอัตราที่กฎหมายบังคับใช้ (อ้างอิงข้อ 301 แห่งกฎหมายการพาณิชย์ หากอยู่ในขอบเขตที่กฎหมายควบคุม)\"></span></p><p>Bồi thường thiệt hại được xét riêng trên cơ sở tổn thất thực tế, trực tiếp, chứng từ, quan hệ nhân quả và nghĩa vụ hạn chế tổn thất; không thu hồi hai lần cho cùng thiệt hại. Giới hạn trách nhiệm (nếu thương lượng) phải ghi tại Phụ lục 06 cùng các ngoại lệ hợp pháp và được xem xét theo mức độ rủi ro.<span class=\"th\" data-t=\"การชดใช้ค่าเสียหายให้พิจารณาเป็นรายกรณีโดยอาศัยความสูญเสียที่เกิดขึ้นจริงและโดยตรง หลักฐานเอกสาร ความสัมพันธ์เชิงเหตุและผล และหน้าที่ในการบรรเทาความเสียหาย ไม่เรียกคืนสองครั้งสำหรับความเสียหายเดียวกัน ขีดจำกัดความรับผิด (หากมีการเจรจา) ต้องระบุไว้ในภาคผนวก 06 พร้อมข้อยกเว้นที่ชอบด้วยกฎหมาย และให้พิจารณาตามระดับความเสี่ยง\"></span></p><h3 class=\"art\" data-n=\"12\"><strong>ĐIỀU 12. THAY ĐỔI, HỦY PO VÀ HỦY SẢN PHẨM ĐẶT RIÊNG</strong><span class=\"th\" data-t=\"ข้อ 12. การเปลี่ยนแปลง การยกเลิก PO และการยกเลิกผลิตภัณฑ์ที่สั่งทำเป็นพิเศษ\"></span></h3><p>Mọi thay đổi PO về số lượng, quy cách, tiến độ hoặc giá phải được hai Bên xác nhận bằng văn bản trước khi thực hiện. Nếu Bên A hủy PO không do lỗi Bên B, phí hủy (nếu có) chỉ áp dụng đối với vật tư/công việc đặc thù đã cam kết không thể hủy hoặc sử dụng lại, có bằng chứng và sau khi trừ giá trị thu hồi; không áp dụng tỷ lệ 30%–100% tự động theo thời gian.<span class=\"th\" data-t=\"การเปลี่ยนแปลง PO ทุกกรณีเกี่ยวกับปริมาณ ข้อกำหนดจำเพาะ กำหนดการ หรือราคา ต้องได้รับการยืนยันเป็นลายลักษณ์อักษรจากทั้งสองฝ่ายก่อนดำเนินการ หากฝ่าย A ยกเลิก PO โดยไม่ใช่ความผิดของฝ่าย B ค่าธรรมเนียมการยกเลิก (หากมี) ให้ใช้บังคับเฉพาะกับวัสดุ/งานเฉพาะที่ได้ผูกพันไว้แล้วซึ่งไม่อาจยกเลิกหรือนำกลับมาใช้ซ้ำได้ โดยมีหลักฐานและภายหลังหักมูลค่าที่เรียกคืนได้แล้ว ไม่ใช้อัตราร้อยละ 30%–100% โดยอัตโนมัติตามระยะเวลา\"></span></p><p>Bên B phải ngừng phát sinh chi phí mới sau khi nhận thông báo hủy, áp dụng biện pháp giảm thiểu và bàn giao vật tư đã được Bên A thanh toán khi có cơ sở pháp lý. Khoản hủy còn tranh chấp được xử lý theo Điều 21, không làm phát sinh quyền bán vật tư của Bên A.<span class=\"th\" data-t=\"ฝ่าย B ต้องหยุดก่อให้เกิดค่าใช้จ่ายใหม่ภายหลังได้รับหนังสือแจ้งยกเลิก ใช้มาตรการลดความเสียหาย และส่งมอบวัสดุที่ฝ่าย A ได้ชำระเงินแล้วเมื่อมีฐานทางกฎหมาย ส่วนค่าใช้จ่ายจากการยกเลิกที่ยังเป็นข้อพิพาทให้ดำเนินการตามข้อ 21 และไม่ก่อให้เกิดสิทธิแก่ฝ่าย A ในการขายวัสดุ\"></span></p><h3 class=\"art\" data-n=\"13\"><strong>ĐIỀU 13. DỊCH VỤ GIA CÔNG: CHỈ KHI PHỤ LỤC 05 ĐƯỢC CHỌN</strong><span class=\"th\" data-t=\"ข้อ 13. บริการรับจ้างแปรรูป: เฉพาะเมื่อมีการเลือกภาคผนวก 05\"></span></h3><p>Nếu giao dịch là mạ kẽm nhúng nóng hoặc gia công vật tư của KSP, phải ký Phụ lục 05 về đặc tính vật tư đầu vào, tiêu chuẩn mạ, phương pháp cân, hao hụt, quyền sở hữu, giữ hàng, lưu kho và phụ phí. Đối với giao dịch chỉ mua hàng hóa, Phụ lục 05 ghi “KHÔNG ÁP DỤNG”.<span class=\"th\" data-t=\"หากธุรกรรมเป็นการชุบสังกะสีแบบจุ่มร้อนหรือรับจ้างแปรรูปวัสดุของ KSP ต้องลงนามในภาคผนวก 05 ว่าด้วยคุณลักษณะของวัสดุนำเข้า มาตรฐานการชุบ วิธีการชั่งน้ำหนัก การสูญเสีย กรรมสิทธิ์ การยึดหน่วง การจัดเก็บในคลัง และค่าธรรมเนียมเพิ่มเติม สำหรับธุรกรรมที่เป็นการซื้อสินค้าเท่านั้น ให้ระบุในภาคผนวก 05 ว่า “ไม่ใช้บังคับ” (“KHÔNG ÁP DỤNG”)\"></span></p><h3 class=\"art\" data-n=\"14\"><strong>ĐIỀU 14. BẢO QUẢN, BẢO HIỂM VÀ HÀNG GỬI GIA CÔNG</strong><span class=\"th\" data-t=\"ข้อ 14. การเก็บรักษา การประกันภัย และสินค้าฝากแปรรูป\"></span></h3><p>Bên B chịu trách nhiệm bảo quản hàng/vật tư do Bên A giao trong thời gian thực tế chiếm giữ, lập biên bản giao nhận tình trạng và số lượng, phân biệt hàng của các khách hàng. Mất mát/hư hỏng do lỗi Bên B phải được sửa chữa, thay thế hoặc bồi thường theo giá trị thực tế có chứng cứ. Bảo hiểm tài sản của Bên A tại cơ sở Bên B áp dụng theo Phụ lục 03/05.<span class=\"th\" data-t=\"ฝ่าย B รับผิดชอบในการเก็บรักษาสินค้า/วัสดุที่ฝ่าย A ส่งมอบในระยะเวลาที่ครอบครองอยู่จริง จัดทำรายงานการรับส่งมอบแสดงสภาพและปริมาณ และแยกสินค้าของลูกค้าแต่ละรายออกจากกัน ความสูญหาย/เสียหายที่เกิดจากความผิดของฝ่าย B ต้องได้รับการซ่อมแซม เปลี่ยนทดแทน หรือชดใช้ตามมูลค่าที่แท้จริงซึ่งมีหลักฐาน การประกันภัยทรัพย์สินของฝ่าย A ณ สถานประกอบการของฝ่าย B ให้ใช้บังคับตามภาคผนวก 03/05\"></span></p><h3 class=\"art\" data-n=\"15\"><strong>ĐIỀU 15. CHẤM DỨT HỢP ĐỒNG KHUNG VÀ PO ĐANG MỞ</strong><span class=\"th\" data-t=\"ข้อ 15. การเลิกสัญญากรอบและ PO ที่ยังค้างอยู่\"></span></h3><p>Hợp đồng khung có hiệu lực từ <strong><span class=\"fx\" data-k=\"NGÀY\"></span></strong> đến <strong><span class=\"fx\" data-k=\"NGÀY\"></span></strong>. Hết hạn hoặc chấm dứt Hợp đồng không tự hủy các PO đã được chấp nhận trước đó; các PO này tiếp tục theo giá và điều kiện đã xác nhận cho đến khi hoàn thành, trừ khi hai Bên có thỏa thuận chấm dứt hợp pháp từng PO.<span class=\"th\" data-t=\"สัญญากรอบมีผลตั้งแต่ 【NGÀY】 ถึง 【NGÀY】 การสิ้นอายุหรือการเลิกสัญญาไม่ทำให้ PO ที่ได้รับการตอบรับไว้ก่อนหน้านี้ถูกยกเลิกไปโดยอัตโนมัติ PO ดังกล่าวให้ดำเนินต่อไปตามราคาและเงื่อนไขที่ได้ยืนยันไว้จนกว่าจะแล้วเสร็จ เว้นแต่ทั้งสองฝ่ายมีข้อตกลงยุติ PO แต่ละฉบับโดยชอบด้วยกฎหมาย\"></span></p><p>Một Bên có quyền chấm dứt đối với vi phạm trọng yếu không khắc phục trong <strong><span class=\"fx\" data-k=\"15\"></span></strong> ngày kể từ thông báo hợp lệ; vi phạm không thể khắc phục hoặc mất khả năng cung ứng nghiêm trọng xử lý theo pháp luật. Các nghĩa vụ thanh toán hợp lệ, bảo hành, bảo mật và bồi thường phát sinh trước khi chấm dứt vẫn có hiệu lực.<span class=\"th\" data-t=\"คู่สัญญาฝ่ายหนึ่งมีสิทธิเลิกสัญญาเมื่อมีการฝ่าฝืนสาระสำคัญที่ไม่ได้รับการแก้ไขภายใน 【15】 วัน นับจากวันที่ได้รับหนังสือแจ้งที่ชอบด้วยกฎหมาย ส่วนการฝ่าฝืนที่ไม่อาจแก้ไขได้หรือการขาดความสามารถในการจัดหาสินค้าอย่างร้ายแรงให้ดำเนินการตามกฎหมาย ภาระหน้าที่ในการชำระเงินที่ชอบด้วยกฎหมาย การรับประกัน การรักษาความลับ และการชดใช้ค่าเสียหายที่เกิดขึ้นก่อนการเลิกสัญญายังคงมีผลบังคับ\"></span></p><h3 class=\"art\" data-n=\"16\"><strong>ĐIỀU 16. BẤT KHẢ KHÁNG</strong><span class=\"th\" data-t=\"ข้อ 16. เหตุสุดวิสัย\"></span></h3><p>Bên bị ảnh hưởng thông báo bằng văn bản trong <strong><span class=\"fx\" data-k=\"03\"></span></strong> ngày làm việc sau khi biết sự kiện, cung cấp chứng cứ và biện pháp giảm thiểu. Biến động giá nguyên liệu thông thường, thiếu vốn, thiếu nhân công hoặc nguồn hàng dự phòng không tự động là bất khả kháng. Sau <strong><span class=\"fx\" data-k=\"30\"></span></strong> ngày gián đoạn nghiêm trọng, hai Bên trao đổi phương án; quyền chấm dứt PO liên quan được thực hiện theo pháp luật và thỏa thuận.<span class=\"th\" data-t=\"ฝ่ายที่ได้รับผลกระทบต้องแจ้งเป็นลายลักษณ์อักษรภายใน 【03】 วันทำการ นับจากวันที่ทราบเหตุการณ์ พร้อมทั้งจัดส่งหลักฐานและมาตรการบรรเทาความเสียหาย ความผันผวนของราคาวัตถุดิบตามปกติ การขาดแคลนเงินทุน การขาดแคลนแรงงาน หรือการขาดแหล่งสินค้าสำรอง ไม่ถือเป็นเหตุสุดวิสัยโดยอัตโนมัติ เมื่อเกิดการหยุดชะงักอย่างร้ายแรงเป็นเวลา 【30】 วัน ทั้งสองฝ่ายจะหารือแนวทางดำเนินการ สิทธิในการเลิก PO ที่เกี่ยวข้องให้ดำเนินการตามกฎหมายและข้อตกลง\"></span></p><h3 class=\"art\" data-n=\"17\"><strong>ĐIỀU 17. TUÂN THỦ PHÁP LUẬT, HSE VÀ CHỐNG HỐI LỘ</strong><span class=\"th\" data-t=\"ข้อ 17. การปฏิบัติตามกฎหมาย HSE และการต่อต้านการให้สินบน\"></span></h3><p>Bên B tuân thủ quy định áp dụng về chất lượng, nhãn hàng, an toàn, môi trường, lao động, chống tham nhũng, thuế, hóa đơn và bảo vệ dữ liệu; cung cấp chứng từ hợp pháp theo PO. Tại trang trại/nhà máy đang hoạt động, nhân sự Bên B tuân thủ nội quy an toàn sinh học, HSE và an ninh đã được thông báo.<span class=\"th\" data-t=\"ฝ่าย B ต้องปฏิบัติตามกฎระเบียบที่ใช้บังคับด้านคุณภาพ ฉลากสินค้า ความปลอดภัย สิ่งแวดล้อม แรงงาน การต่อต้านการทุจริต ภาษี ใบแจ้งหนี้/ใบกำกับภาษี และการคุ้มครองข้อมูล และต้องจัดส่งเอกสารที่ชอบด้วยกฎหมายตาม PO ในฟาร์ม/โรงงานที่กำลังดำเนินการอยู่ บุคลากรของฝ่าย B ต้องปฏิบัติตามระเบียบด้านความปลอดภัยทางชีวภาพ HSE และความมั่นคงปลอดภัยที่ได้แจ้งให้ทราบแล้ว\"></span></p><h3 class=\"art\" data-n=\"18\"><strong>ĐIỀU 18. BẢO MẬT, SỞ HỮU TRÍ TUỆ VÀ NHÀ THẦU PHỤ</strong><span class=\"th\" data-t=\"ข้อ 18. การรักษาความลับ ทรัพย์สินทางปัญญา และผู้รับเหมาช่วง\"></span></h3><p>Bên B bảo mật giá, bản vẽ, thiết kế, thông tin khách hàng và tài liệu của Bên A; không tiết lộ hoặc dùng cho bên khác, trừ khi pháp luật yêu cầu. Quyền sở hữu đối với bản vẽ, khuôn, dữ liệu do Bên A cung cấp không chuyển cho Bên B. Bên B không được giao thầu phụ phần việc trọng yếu khi chưa được Bên A chấp thuận bằng văn bản và vẫn chịu trách nhiệm cho đơn vị được chấp thuận.<span class=\"th\" data-t=\"ฝ่าย B ต้องรักษาความลับของราคา แบบแปลน การออกแบบ ข้อมูลลูกค้า และเอกสารของฝ่าย A และต้องไม่เปิดเผยหรือนำไปใช้เพื่อบุคคลอื่น เว้นแต่กฎหมายกำหนด กรรมสิทธิ์ในแบบแปลน แม่พิมพ์ และข้อมูลที่ฝ่าย A จัดหาให้ไม่โอนไปยังฝ่าย B ฝ่าย B ต้องไม่ให้ผู้รับเหมาช่วงทำงานส่วนสำคัญหากยังไม่ได้รับความเห็นชอบเป็นลายลักษณ์อักษรจากฝ่าย A และยังคงต้องรับผิดชอบต่อหน่วยงานที่ได้รับความเห็นชอบ\"></span></p><h3 class=\"art\" data-n=\"19\"><strong>ĐIỀU 19. ĐỐI CHIẾU BACK-TO-BACK VỚI KHÁCH HÀNG</strong><span class=\"th\" data-t=\"ข้อ 19. การเทียบเคียงแบบ Back-to-Back กับลูกค้า\"></span></h3><p>Nếu PO phục vụ hợp đồng khách hàng cụ thể của KSP, các yêu cầu về giao hàng, thử nghiệm, CO/CQ, chứng từ, nghiệm thu, bảo hành và trách nhiệm kỹ thuật chỉ chuyển giao cho Bên B khi được nêu rõ tại Phụ lục 04/PO và tài liệu tham chiếu đã cung cấp cho Bên B. Không chuyển tự động mọi khoản phạt hoặc rủi ro của KSP cho Bên B.<span class=\"th\" data-t=\"หาก PO ใช้เพื่อสนองสัญญากับลูกค้าที่เฉพาะเจาะจงของ KSP ข้อกำหนดเกี่ยวกับการส่งมอบสินค้า การทดสอบ CO/CQ เอกสาร การตรวจรับ การรับประกันผลงาน/สินค้า และความรับผิดชอบทางเทคนิค จะส่งต่อให้ฝ่าย B ได้ก็ต่อเมื่อระบุไว้อย่างชัดเจนในภาคผนวก 04/PO และเอกสารอ้างอิงที่ได้ส่งมอบให้ฝ่าย B แล้ว ไม่ส่งต่อค่าปรับหรือความเสี่ยงทั้งหมดของ KSP ให้ฝ่าย B โดยอัตโนมัติ\"></span></p><p>Bên B chịu trách nhiệm về thiệt hại thực tế, trực tiếp do vi phạm của mình theo chứng cứ, mối quan hệ nhân quả và Điều 11. Các chênh lệch về thời hạn, chất lượng hoặc bảo hành phải được nhận diện và xử lý bằng biện pháp thực tế trước khi phát hành PO.<span class=\"th\" data-t=\"ฝ่าย B รับผิดชอบต่อความเสียหายที่เกิดขึ้นจริงและโดยตรงจากการฝ่าฝืนของตน ตามหลักฐาน ความสัมพันธ์เชิงเหตุและผล และข้อ 11 ส่วนความแตกต่างในด้านกำหนดเวลา คุณภาพ หรือการรับประกัน ต้องได้รับการระบุและจัดการด้วยมาตรการที่ปฏิบัติได้จริงก่อนออก PO\"></span></p><h3 class=\"art\" data-n=\"20\"><strong>ĐIỀU 20. THAY ĐỔI ĐIỀU KIỆN VÀ THỨ TỰ ƯU TIÊN</strong><span class=\"th\" data-t=\"ข้อ 20. การเปลี่ยนแปลงเงื่อนไขและลำดับความสำคัญ\"></span></h3><p>Thứ tự ưu tiên khi có mâu thuẫn: (i) văn bản sửa đổi có chữ ký hai Bên nêu rõ điều bị thay đổi; (ii) điều kiện đặc thù đã ký tại Phụ lục 06; (iii) Hợp đồng khung; (iv) Phụ lục 01–05 trong phạm vi áp dụng; (v) PO đã xác nhận về số lượng, thời gian, địa điểm; (vi) báo giá được chấp thuận. Không sửa Hợp đồng chỉ bằng email nghiệp vụ, hóa đơn hoặc thông báo đơn phương.<span class=\"th\" data-t=\"ลำดับความสำคัญเมื่อเกิดความขัดแย้ง: (i) เอกสารแก้ไขที่ลงนามโดยทั้งสองฝ่ายซึ่งระบุข้อที่ถูกเปลี่ยนแปลงอย่างชัดเจน; (ii) เงื่อนไขเฉพาะที่ได้ลงนามไว้ในภาคผนวก 06; (iii) สัญญากรอบ; (iv) ภาคผนวก 01–05 ภายในขอบเขตที่ใช้บังคับ; (v) PO ที่ได้รับการยืนยันในส่วนของปริมาณ เวลา และสถานที่; (vi) ใบเสนอราคาที่ได้รับความเห็นชอบ ห้ามแก้ไขสัญญาด้วยอีเมลเชิงปฏิบัติการ ใบแจ้งหนี้/ใบกำกับภาษี หรือหนังสือแจ้งฝ่ายเดียวเพียงอย่างเดียว\"></span></p><h3 class=\"art\" data-n=\"21\"><strong>ĐIỀU 21. THÔNG BÁO, LUẬT ÁP DỤNG VÀ TRANH CHẤP</strong><span class=\"th\" data-t=\"ข้อ 21. การแจ้ง กฎหมายที่ใช้บังคับ และข้อพิพาท\"></span></h3><p>Thông báo chính thức gửi tới đầu mối tại Điều thông tin các Bên qua <strong><span class=\"fx\" data-k=\"EMAIL CHÍNH THỨC / THƯ BẢO ĐẢM\"></span></strong>, có bằng chứng đã gửi/nhận. Hợp đồng điều chỉnh bởi pháp luật Việt Nam. Tranh chấp trước hết được thương lượng trong <strong><span class=\"fx\" data-k=\"30\"></span></strong> ngày; nếu không giải quyết, đưa tới <strong><span class=\"fx\" data-k=\"VIAC / TÒA ÁN CÓ THẨM QUYỀN – CHỌN MỘT\"></span></strong> theo Phụ lục 06.<span class=\"th\" data-t=\"หนังสือแจ้งอย่างเป็นทางการให้ส่งถึงผู้ประสานงานตามข้อว่าด้วยข้อมูลของคู่สัญญา ผ่านทาง 【EMAIL CHÍNH THỨC / THƯ BẢO ĐẢM】 โดยมีหลักฐานการส่ง/รับ สัญญานี้อยู่ภายใต้บังคับของกฎหมายเวียดนาม ข้อพิพาทให้เจรจากันก่อนภายใน 【30】 วัน หากไม่สามารถระงับได้ ให้นำเสนอต่อ 【VIAC / TÒA ÁN CÓ THẨM QUYỀN – CHỌN MỘT】 ตามภาคผนวก 06\"></span></p><h3 class=\"art\" data-n=\"22\"><strong>ĐIỀU 22. HIỆU LỰC, GIA HẠN VÀ NGHĨA VỤ CÒN TỒN TẠI</strong><span class=\"th\" data-t=\"ข้อ 22. ผลบังคับ การขยายระยะเวลา และภาระหน้าที่ที่ยังคงอยู่\"></span></h3><p>Gia hạn thời gian giữ giá hoặc gia hạn Hợp đồng phải được hai Bên ký trước ngày hết hạn; không tự động gia hạn giá. Nếu một điều khoản vô hiệu theo pháp luật, các phần còn lại tiếp tục có hiệu lực nếu có thể. Nghĩa vụ bảo hành, thanh toán, bảo mật, sở hữu và giải quyết tranh chấp còn hiệu lực theo tính chất của chúng.<span class=\"th\" data-t=\"การขยายระยะเวลาการคงราคาหรือการขยายอายุสัญญาต้องได้รับการลงนามจากทั้งสองฝ่ายก่อนวันครบกำหนด ไม่มีการขยายราคาโดยอัตโนมัติ หากข้อกำหนดใดเป็นโมฆะตามกฎหมาย ส่วนที่เหลือยังคงมีผลบังคับต่อไปหากเป็นไปได้ ภาระหน้าที่เกี่ยวกับการรับประกัน การชำระเงิน การรักษาความลับ ทรัพย์สิน และการระงับข้อพิพาท ยังคงมีผลบังคับตามลักษณะของภาระหน้าที่นั้น\"></span></p><h3 class=\"art\" data-n=\"23\"><strong>ĐIỀU 23. ĐIỀU KHOẢN CUỐI CÙNG</strong><span class=\"th\" data-t=\"ข้อ 23. ข้อกำหนดสุดท้าย\"></span></h3><p>Hai Bên xác nhận đã đọc và hiểu toàn bộ điều khoản, Phụ lục 01–06 được chọn và ký hợp lệ; các ô <strong><span class=\"fx\" data-k=\"...\"></span></strong> chưa điền phải hoàn tất hoặc ghi “KHÔNG ÁP DỤNG” trước ký. Hợp đồng lập thành <strong><span class=\"fx\" data-k=\"02 / 04\"></span></strong> bản tiếng Việt có giá trị ngang nhau; bản dịch tiếng Thái (nếu có) chỉ để tham khảo nội bộ trừ thỏa thuận khác.<span class=\"th\" data-t=\"ทั้งสองฝ่ายยืนยันว่าได้อ่านและเข้าใจข้อกำหนดทั้งหมดแล้ว ภาคผนวก 01–06 ที่เลือกได้รับการลงนามโดยชอบ ช่อง 【...】 ที่ยังไม่ได้กรอกต้องกรอกให้เสร็จสมบูรณ์หรือระบุว่า “ไม่ใช้บังคับ” (“KHÔNG ÁP DỤNG”) ก่อนลงนาม สัญญานี้จัดทำเป็นภาษาเวียดนาม 【02 / 04】 ฉบับ มีค่าเท่ากัน ฉบับแปลภาษาไทย (หากมี) ใช้เพื่ออ้างอิงภายในเท่านั้น เว้นแต่จะตกลงเป็นอย่างอื่น\"></span></p><div class=\"tw2\"><table class=\"ct\"><tr><th><strong>ĐẠI DIỆN BÊN A – KSP</strong><span class=\"th\" data-t=\"ผู้แทนฝ่าย A – KSP\"></span></th><th><strong>ĐẠI DIỆN BÊN B</strong><span class=\"th\" data-t=\"ผู้แทนฝ่าย B\"></span></th></tr><tr><td>(Ký, ghi rõ họ tên, đóng dấu nếu áp dụng)<span class=\"th\" data-t=\"(ลงนาม ระบุชื่อ-นามสกุลให้ชัดเจน ประทับตราหากมี)\"></span></td><td>(Ký, ghi rõ họ tên, đóng dấu nếu áp dụng)<span class=\"th\" data-t=\"(ลงนาม ระบุชื่อ-นามสกุลให้ชัดเจน ประทับตราหากมี)\"></span></td></tr></table></div><h3 class=\"ann\" data-n=\"01\"><strong>PHỤ LỤC 01 – BẢNG GIÁ RÀNG BUỘC VÀ CƠ CHẾ GIỮ GIÁ</strong><span class=\"th\" data-t=\"ภาคผนวก 01 – ตารางราคาที่มีผลผูกพันและกลไกการคงราคา\"></span></h3><div class=\"tw2\"><table class=\"ct\"><tr><th><strong>Mã hàng / Nhóm hàng</strong><span class=\"th\" data-t=\"รหัสสินค้า / กลุ่มสินค้า\"></span></th><th><strong>Quy cách / Chất lượng</strong><span class=\"th\" data-t=\"ข้อกำหนดจำเพาะ / คุณภาพ\"></span></th><th><strong>ĐVT</strong><span class=\"th\" data-t=\"หน่วย\"></span></th><th><strong>Đơn giá trước VAT (VND)</strong><span class=\"th\" data-t=\"ราคาต่อหน่วยก่อนภาษีมูลค่าเพิ่ม (VAT) (VND)\"></span></th><th><strong>Thời gian giữ giá</strong><span class=\"th\" data-t=\"ระยะเวลาคงราคา\"></span></th><th><strong>Công suất / ghi chú</strong><span class=\"th\" data-t=\"กำลังการผลิต / หมายเหตุ\"></span></th></tr><tr><td><span class=\"fx\" data-k=\"MÃ 01\"></span></td><td><span class=\"fx\" data-k=\"MÔ TẢ\"></span></td><td><span class=\"fx\" data-k=\"ĐVT\"></span></td><td><span class=\"fx\" data-k=\"GIÁ\"></span></td><td><span class=\"fx\" data-k=\"TỪ...ĐẾN...\"></span></td><td><span class=\"fx\" data-k=\"LƯỢNG/THÁNG\"></span></td></tr><tr><td><span class=\"fx\" data-k=\"MÃ 02\"></span></td><td><span class=\"fx\" data-k=\"MÔ TẢ\"></span></td><td><span class=\"fx\" data-k=\"ĐVT\"></span></td><td><span class=\"fx\" data-k=\"GIÁ\"></span></td><td><span class=\"fx\" data-k=\"TỪ...ĐẾN...\"></span></td><td><span class=\"fx\" data-k=\"LƯỢNG/THÁNG\"></span></td></tr><tr><td><span class=\"fx\" data-k=\"MÃ 03\"></span></td><td><span class=\"fx\" data-k=\"MÔ TẢ\"></span></td><td><span class=\"fx\" data-k=\"ĐVT\"></span></td><td><span class=\"fx\" data-k=\"GIÁ\"></span></td><td><span class=\"fx\" data-k=\"TỪ...ĐẾN...\"></span></td><td><span class=\"fx\" data-k=\"LƯỢNG/THÁNG\"></span></td></tr></table></div><p>Lựa chọn cơ chế giá: <strong><span class=\"fx\" data-k=\"A GIỮ GIÁ CỐ ĐỊNH / B CHỈ SỐ – ĐIỀN ĐỦ\"></span></strong>. Nếu B: Chỉ số <strong><span class=\"fx\" data-k=\"TÊN\"></span></strong> nguồn <strong><span class=\"fx\" data-k=\"NHÀ CÔNG BỐ\"></span></strong>, giá gốc <strong><span class=\"fx\" data-k=\"VND/ĐƠN VỊ\"></span></strong>, bình quân <strong><span class=\"fx\" data-k=\"THÁNG\"></span></strong>, ngưỡng <strong><span class=\"fx\" data-k=\"±%\"></span></strong> trong <strong><span class=\"fx\" data-k=\"SỐ NGÀY\"></span></strong> ngày, tỷ trọng nguyên liệu <strong><span class=\"fx\" data-k=\"%\"></span></strong>, trần điều chỉnh mỗi kỳ <strong><span class=\"fx\" data-k=\"%\"></span></strong>, công thức tăng/giảm đối xứng <strong><span class=\"fx\" data-k=\"CÔNG THỨC CỤ THỂ\"></span></strong>.<span class=\"th\" data-t=\"การเลือกกลไกราคา: 【A GIỮ GIÁ CỐ ĐỊNH / B CHỈ SỐ – ĐIỀN ĐỦ】 หากเลือก B: ดัชนี 【TÊN】 แหล่งที่มา 【NHÀ CÔNG BỐ】 ราคาฐาน 【VND/ĐƠN VỊ】 ค่าเฉลี่ย 【THÁNG】 เกณฑ์ 【±%】 ภายใน 【SỐ NGÀY】 วัน สัดส่วนวัตถุดิบ 【%】 เพดานการปรับในแต่ละงวด 【%】 สูตรปรับขึ้น/ลงแบบสมมาตร 【CÔNG THỨC CỤ THỂ】\"></span></p><p>Các phụ phí được phép: <strong><span class=\"fx\" data-k=\"LOẠI/ĐIỀU KIỆN/ĐƠN GIÁ/PHÊ DUYỆT TRƯỚC\"></span></strong>; khoản khác: KHÔNG ĐƯỢC TÍNH TỰ ĐỘNG. Dự báo <strong><span class=\"fx\" data-k=\"KHÔNG CAM KẾT / CAM KẾT MUA TỐI THIỂU CÓ KÝ\"></span></strong>.<span class=\"th\" data-t=\"ค่าธรรมเนียมเพิ่มเติมที่อนุญาต: 【LOẠI/ĐIỀU KIỆN/ĐƠN GIÁ/PHÊ DUYỆT TRƯỚC】 รายการอื่น: ห้ามคิดโดยอัตโนมัติ การคาดการณ์ 【KHÔNG CAM KẾT / CAM KẾT MUA TỐI THIỂU CÓ KÝ】\"></span></p><p>Xác nhận Phụ lục: BÊN A <strong><span class=\"fx\" data-k=\"KÝ/TÊN/NGÀY\"></span></strong> | BÊN B <strong><span class=\"fx\" data-k=\"KÝ/TÊN/NGÀY\"></span></strong><span class=\"th\" data-t=\"การยืนยันภาคผนวก: ฝ่าย A 【KÝ/TÊN/NGÀY】 | ฝ่าย B 【KÝ/TÊN/NGÀY】\"></span></p><h3 class=\"ann\" data-n=\"02\"><strong>PHỤ LỤC 02 – SLA GIAO HÀNG VÀ TIÊU CHUẨN NGHIỆM THU</strong><span class=\"th\" data-t=\"ภาคผนวก 02 – SLA การส่งมอบและมาตรฐานการตรวจรับ\"></span></h3><div class=\"tw2\"><table class=\"ct\"><tr><th><strong>Hạng mục</strong><span class=\"th\" data-t=\"รายการ\"></span></th><th><strong>Điều kiện phê duyệt</strong><span class=\"th\" data-t=\"เงื่อนไขการอนุมัติ\"></span></th><th><strong>Thời gian / Địa điểm</strong><span class=\"th\" data-t=\"เวลา / สถานที่\"></span></th><th><strong>Bằng chứng</strong><span class=\"th\" data-t=\"หลักฐาน\"></span></th></tr><tr><td>Lead time chuẩn<span class=\"th\" data-t=\"Lead time มาตรฐาน\"></span></td><td><span class=\"fx\" data-k=\"MÃ/NHÓM\"></span></td><td><span class=\"fx\" data-k=\"SỐ NGÀY\"></span></td><td><span class=\"fx\" data-k=\"PO/ACK\"></span></td></tr><tr><td>Điểm giao / bốc dỡ<span class=\"th\" data-t=\"จุดส่งมอบ / จุดขนถ่าย\"></span></td><td><span class=\"fx\" data-k=\"MÔ TẢ\"></span></td><td><span class=\"fx\" data-k=\"ĐỊA ĐIỂM\"></span></td><td><span class=\"fx\" data-k=\"POD\"></span></td></tr><tr><td>Kiểm tra kỹ thuật/CO-CQ<span class=\"th\" data-t=\"การตรวจสอบทางเทคนิค/CO-CQ\"></span></td><td><span class=\"fx\" data-k=\"TIÊU CHUẨN\"></span></td><td><span class=\"fx\" data-k=\"TRONG...NGÀY\"></span></td><td><span class=\"fx\" data-k=\"CHỨNG TỪ\"></span></td></tr><tr><td>Lỗi khẩn cấp / thay thế<span class=\"th\" data-t=\"ข้อบกพร่องเร่งด่วน / การเปลี่ยนทดแทน\"></span></td><td><span class=\"fx\" data-k=\"SỰ CỐ\"></span></td><td><span class=\"fx\" data-k=\"GIỜ / NGÀY\"></span></td><td><span class=\"fx\" data-k=\"BIÊN BẢN\"></span></td></tr></table></div><p>Việc ký nhận số lượng không miễn trừ khiếu nại về khuyết tật ẩn và bảo hành. Phải ghi rõ tiêu chuẩn, phiên bản, mẫu đã duyệt, điều kiện thử nghiệm và quyền xử lý hàng lỗi.<span class=\"th\" data-t=\"การลงนามรับปริมาณไม่เป็นการสละสิทธิ์ในการเรียกร้องเกี่ยวกับข้อบกพร่องแฝงและการรับประกัน ต้องระบุอย่างชัดเจนซึ่งมาตรฐาน เวอร์ชัน ตัวอย่างที่ได้รับอนุมัติ เงื่อนไขการทดสอบ และสิทธิในการจัดการกับสินค้าที่บกพร่อง\"></span></p><p>Xác nhận Phụ lục: BÊN A <strong><span class=\"fx\" data-k=\"KÝ/TÊN/NGÀY\"></span></strong> | BÊN B <strong><span class=\"fx\" data-k=\"KÝ/TÊN/NGÀY\"></span></strong><span class=\"th\" data-t=\"การยืนยันภาคผนวก: ฝ่าย A 【KÝ/TÊN/NGÀY】 | ฝ่าย B 【KÝ/TÊN/NGÀY】\"></span></p><h3 class=\"ann\" data-n=\"03\"><strong>PHỤ LỤC 03 – THANH TOÁN, BẢO LÃNH VÀ RỦI RO DÒNG TIỀN</strong><span class=\"th\" data-t=\"ภาคผนวก 03 – การชำระเงิน หนังสือค้ำประกัน และความเสี่ยงด้านกระแสเงินสด\"></span></h3><div class=\"tw2\"><table class=\"ct\"><tr><th><strong>PO / Nhóm</strong><span class=\"th\" data-t=\"PO / กลุ่ม\"></span></th><th><strong>Tạm ứng</strong><span class=\"th\" data-t=\"เงินล่วงหน้า\"></span></th><th><strong>Điều kiện thanh toán</strong><span class=\"th\" data-t=\"เงื่อนไขการชำระเงิน\"></span></th><th><strong>Bảo lãnh / bảo hiểm</strong><span class=\"th\" data-t=\"หนังสือค้ำประกัน / การประกันภัย\"></span></th><th><strong>Phê duyệt ngoại lệ</strong><span class=\"th\" data-t=\"การอนุมัติกรณียกเว้น\"></span></th></tr><tr><td><span class=\"fx\" data-k=\"PO/LOẠI\"></span></td><td><span class=\"fx\" data-k=\"0 / %\"></span></td><td><span class=\"fx\" data-k=\"30 / 45 / 60 NGÀY\"></span></td><td><span class=\"fx\" data-k=\"LOẠI / GIÁ TRỊ / NGÀY HẾT\"></span></td><td><span class=\"fx\" data-k=\"CẤP / NGÀY\"></span></td></tr></table></div><p>Bảng dòng tiền nội bộ trước PO (không phải nghĩa vụ của Bên B): ngày KSP trả nhà cung cấp <strong><span class=\"fx\" data-k=\"NGÀY\"></span></strong>, ngày KSP dự kiến thu khách hàng <strong><span class=\"fx\" data-k=\"NGÀY\"></span></strong>, chênh lệch <strong><span class=\"fx\" data-k=\"SỐ NGÀY/VND\"></span></strong>, nguồn vốn và cấp phê duyệt <strong><span class=\"fx\" data-k=\"...\"></span></strong>. Nếu tạm ứng hoặc trả trước nghiệm thu, bắt buộc đánh giá phương án bảo vệ.<span class=\"th\" data-t=\"ตารางกระแสเงินสดภายในก่อน PO (ไม่ใช่ภาระหน้าที่ของฝ่าย B): วันที่ KSP ชำระเงินให้ผู้ขาย 【NGÀY】 วันที่ KSP คาดว่าจะได้รับชำระจากลูกค้า 【NGÀY】 ส่วนต่าง 【SỐ NGÀY/VND】 แหล่งเงินทุนและระดับผู้อนุมัติ 【...】 หากมีเงินล่วงหน้าหรือการชำระก่อนการตรวจรับ ต้องประเมินมาตรการคุ้มครอง\"></span></p><p>Xác nhận Phụ lục: BÊN A <strong><span class=\"fx\" data-k=\"KÝ/TÊN/NGÀY\"></span></strong> | BÊN B <strong><span class=\"fx\" data-k=\"KÝ/TÊN/NGÀY\"></span></strong><span class=\"th\" data-t=\"การยืนยันภาคผนวก: ฝ่าย A 【KÝ/TÊN/NGÀY】 | ฝ่าย B 【KÝ/TÊN/NGÀY】\"></span></p><h3 class=\"ann\" data-n=\"04\"><strong>PHỤ LỤC 04 – MA TRẬN BACK-TO-BACK THEO PO / DỰ ÁN</strong><span class=\"th\" data-t=\"ภาคผนวก 04 – ตารางเมทริกซ์ Back-to-Back ตาม PO / โครงการ\"></span></h3><div class=\"tw2\"><table class=\"ct\"><tr><th><strong>Nghĩa vụ khách hàng</strong><span class=\"th\" data-t=\"ภาระหน้าที่ต่อลูกค้า\"></span></th><th><strong>Tham chiếu HĐ khách</strong><span class=\"th\" data-t=\"อ้างอิงสัญญาลูกค้า\"></span></th><th><strong>Nghĩa vụ Bên B đã nhận</strong><span class=\"th\" data-t=\"ภาระหน้าที่ของฝ่าย B ที่รับไว้\"></span></th><th><strong>Khoảng cách / Biện pháp</strong><span class=\"th\" data-t=\"ช่องว่าง / มาตรการ\"></span></th></tr><tr><td>Thời gian giao<span class=\"th\" data-t=\"ระยะเวลาส่งมอบ\"></span></td><td><span class=\"fx\" data-k=\"ĐIỀU/NGÀY\"></span></td><td><span class=\"fx\" data-k=\"NGÀY\"></span></td><td><span class=\"fx\" data-k=\"BUFFER\"></span></td></tr><tr><td>Thanh toán / Dòng tiền<span class=\"th\" data-t=\"การชำระเงิน / กระแสเงินสด\"></span></td><td><span class=\"fx\" data-k=\"ĐIỀU/NGÀY\"></span></td><td><span class=\"fx\" data-k=\"KỲ HẠN\"></span></td><td><span class=\"fx\" data-k=\"NGÀY/VỐN\"></span></td></tr><tr><td>Chất lượng / CO-CQ<span class=\"th\" data-t=\"คุณภาพ / CO-CQ\"></span></td><td><span class=\"fx\" data-k=\"TIÊU CHUẨN\"></span></td><td><span class=\"fx\" data-k=\"TIÊU CHUẨN\"></span></td><td><span class=\"fx\" data-k=\"XÁC NHẬN\"></span></td></tr><tr><td>Nghiệm thu / chứng từ<span class=\"th\" data-t=\"การตรวจรับ / เอกสาร\"></span></td><td><span class=\"fx\" data-k=\"ĐIỀU\"></span></td><td><span class=\"fx\" data-k=\"DANH MỤC\"></span></td><td><span class=\"fx\" data-k=\"RỦI RO\"></span></td></tr><tr><td>Bảo hành<span class=\"th\" data-t=\"การรับประกันผลงาน/สินค้า\"></span></td><td><span class=\"fx\" data-k=\"MỐC/THÁNG\"></span></td><td><span class=\"fx\" data-k=\"MỐC/THÁNG\"></span></td><td><span class=\"fx\" data-k=\"GAP\"></span></td></tr><tr><td>Phạt / Bồi thường<span class=\"th\" data-t=\"ค่าปรับ / การชดใช้ค่าเสียหาย\"></span></td><td><span class=\"fx\" data-k=\"ĐIỀU\"></span></td><td><span class=\"fx\" data-k=\"ĐIỀU\"></span></td><td><span class=\"fx\" data-k=\"GIỚI HẠN\"></span></td></tr><tr><td>Hủy PO / dự án<span class=\"th\" data-t=\"การยกเลิก PO / โครงการ\"></span></td><td><span class=\"fx\" data-k=\"ĐIỀU\"></span></td><td><span class=\"fx\" data-k=\"ĐIỀU\"></span></td><td><span class=\"fx\" data-k=\"PHƯƠNG ÁN\"></span></td></tr></table></div><p>Chỉ áp dụng đối với nghĩa vụ được liệt kê rõ, được cung cấp và ký với Bên B. Nếu không có khách hàng cuối cùng, ghi “KHÔNG ÁP DỤNG”.<span class=\"th\" data-t=\"ใช้บังคับเฉพาะภาระหน้าที่ที่ระบุไว้อย่างชัดเจน ซึ่งได้จัดส่งและลงนามกับฝ่าย B แล้ว หากไม่มีลูกค้าปลายทาง ให้ระบุว่า “ไม่ใช้บังคับ” (“KHÔNG ÁP DỤNG”)\"></span></p><p>Xác nhận Phụ lục: BÊN A <strong><span class=\"fx\" data-k=\"KÝ/TÊN/NGÀY\"></span></strong> | BÊN B <strong><span class=\"fx\" data-k=\"KÝ/TÊN/NGÀY\"></span></strong><span class=\"th\" data-t=\"การยืนยันภาคผนวก: ฝ่าย A 【KÝ/TÊN/NGÀY】 | ฝ่าย B 【KÝ/TÊN/NGÀY】\"></span></p><h3 class=\"ann\" data-n=\"05\"><strong>PHỤ LỤC 05 – ĐIỀU KIỆN RIÊNG GIA CÔNG / MẠ KẼM (NẾU ÁP DỤNG)</strong><span class=\"th\" data-t=\"ภาคผนวก 05 – เงื่อนไขเฉพาะการรับจ้างแปรรูป / ชุบสังกะสี (หากใช้บังคับ)\"></span></h3><div class=\"tw2\"><table class=\"ct\"><tr><th><strong>Nội dung kiểm soát</strong><span class=\"th\" data-t=\"เนื้อหาที่ควบคุม\"></span></th><th><strong>Điều kiện phải ký trước PO</strong><span class=\"th\" data-t=\"เงื่อนไขที่ต้องลงนามก่อน PO\"></span></th></tr><tr><td>Tiêu chuẩn mạ / đo độ dày<span class=\"th\" data-t=\"มาตรฐานการชุบ / การวัดความหนา\"></span></td><td><span class=\"fx\" data-k=\"AS/NZS 4680 / ASTM A123 – PHIÊN BẢN / YÊU CẦU THỰC TẾ\"></span></td></tr><tr><td>Quy cách vật tư KSP / tiêu chí kiểm tra đầu vào<span class=\"th\" data-t=\"ข้อกำหนดจำเพาะของวัสดุ KSP / เกณฑ์การตรวจสอบวัสดุนำเข้า\"></span></td><td><span class=\"fx\" data-k=\"BẢN VẼ / SI-P / THÀNH PHẦN / GIỚI HẠN\"></span></td></tr><tr><td>Trọng lượng tính tiền / hiệu chuẩn cân<span class=\"th\" data-t=\"น้ำหนักที่ใช้คิดเงิน / การสอบเทียบเครื่องชั่ง\"></span></td><td><span class=\"fx\" data-k=\"TRƯỚC HAY SAU MẠ / CÂN / BIÊN BẢN\"></span></td></tr><tr><td>Phụ phí làm sạch/nhúng lại/khoan lỗ/lưu kho<span class=\"th\" data-t=\"ค่าธรรมเนียมเพิ่มเติมสำหรับการทำความสะอาด/จุ่มซ้ำ/เจาะรู/จัดเก็บในคลัง\"></span></td><td><span class=\"fx\" data-k=\"ĐƠN GIÁ/ĐIỀU KIỆN/PHÊ DUYỆT\"></span></td></tr><tr><td>Thời gian giao trả / trách nhiệm bảo quản<span class=\"th\" data-t=\"ระยะเวลาส่งคืน / ความรับผิดชอบในการเก็บรักษา\"></span></td><td><span class=\"fx\" data-k=\"NGÀY/ĐIỂM/BẢO HIỂM\"></span></td></tr><tr><td>Bảo hành / môi trường ứng dụng<span class=\"th\" data-t=\"การรับประกัน / สภาพแวดล้อมการใช้งาน\"></span></td><td><span class=\"fx\" data-k=\"THÁNG/NĂM/PHẠM VI/LOẠI TRỪ\"></span></td></tr></table></div><p>Bên B phải thông báo lỗi vật tư đầu vào trong <strong><span class=\"fx\" data-k=\"02\"></span></strong> ngày sau nhận, có ảnh/chứng cứ và chỉ thực hiện sau khi được Bên A xác nhận hướng xử lý. Không tự áp dụng phụ phí 35%/45%, phí lưu kho hoặc bán tài sản của Bên A. Việc giữ tài sản nếu có phải theo pháp luật và Điều 7.<span class=\"th\" data-t=\"ฝ่าย B ต้องแจ้งข้อบกพร่องของวัสดุนำเข้าภายใน 【02】 วันหลังได้รับ พร้อมภาพถ่าย/หลักฐาน และจะดำเนินการได้ก็ต่อเมื่อฝ่าย A ยืนยันแนวทางจัดการแล้ว ห้ามใช้ค่าธรรมเนียมเพิ่มเติม 35%/45% ค่าจัดเก็บในคลัง หรือการขายทรัพย์สินของฝ่าย A โดยพลการ การยึดหน่วงทรัพย์สิน (หากมี) ต้องเป็นไปตามกฎหมายและข้อ 7\"></span></p><p>Xác nhận Phụ lục: BÊN A <strong><span class=\"fx\" data-k=\"KÝ/TÊN/NGÀY\"></span></strong> | BÊN B <strong><span class=\"fx\" data-k=\"KÝ/TÊN/NGÀY\"></span></strong><span class=\"th\" data-t=\"การยืนยันภาคผนวก: ฝ่าย A 【KÝ/TÊN/NGÀY】 | ฝ่าย B 【KÝ/TÊN/NGÀY】\"></span></p><h3 class=\"ann\" data-n=\"06\"><strong>PHỤ LỤC 06 – ĐIỀU KIỆN ĐẶC BIỆT ĐƯỢC HAI BÊN KÝ</strong><span class=\"th\" data-t=\"ภาคผนวก 06 – เงื่อนไขพิเศษที่ทั้งสองฝ่ายลงนาม\"></span></h3><div class=\"tw2\"><table class=\"ct\"><tr><th><strong>Điều cần ngoại lệ</strong><span class=\"th\" data-t=\"ข้อที่ต้องมีข้อยกเว้น\"></span></th><th><strong>Quy định chuẩn</strong><span class=\"th\" data-t=\"ข้อกำหนดมาตรฐาน\"></span></th><th><strong>Ngoại lệ được thống nhất</strong><span class=\"th\" data-t=\"ข้อยกเว้นที่ตกลงกัน\"></span></th><th><strong>Giới hạn/Thời hạn</strong><span class=\"th\" data-t=\"ขีดจำกัด/ระยะเวลา\"></span></th></tr><tr><td>Đơn giá / index<span class=\"th\" data-t=\"ราคาต่อหน่วย / ดัชนี\"></span></td><td>Giữ giá<span class=\"th\" data-t=\"การคงราคา\"></span></td><td><span class=\"fx\" data-k=\"NỘI DUNG\"></span></td><td><span class=\"fx\" data-k=\"KỲ\"></span></td></tr><tr><td>Tạm ứng / bảo đảm<span class=\"th\" data-t=\"เงินล่วงหน้า / หลักประกัน\"></span></td><td>Không tạm ứng<span class=\"th\" data-t=\"ไม่มีเงินล่วงหน้า\"></span></td><td><span class=\"fx\" data-k=\"NỘI DUNG\"></span></td><td><span class=\"fx\" data-k=\"VND/NGÀY\"></span></td></tr><tr><td>Hủy PO<span class=\"th\" data-t=\"การยกเลิก PO\"></span></td><td>Thiệt hại chứng minh<span class=\"th\" data-t=\"ความเสียหายที่พิสูจน์ได้\"></span></td><td><span class=\"fx\" data-k=\"NỘI DUNG\"></span></td><td><span class=\"fx\" data-k=\"TRẦN\"></span></td></tr><tr><td>Giới hạn trách nhiệm<span class=\"th\" data-t=\"ขีดจำกัดความรับผิด\"></span></td><td>Theo luật và Điều 11<span class=\"th\" data-t=\"ตามกฎหมายและข้อ 11\"></span></td><td><span class=\"fx\" data-k=\"NỘI DUNG\"></span></td><td><span class=\"fx\" data-k=\"NGOẠI LỆ\"></span></td></tr><tr><td>Tranh chấp<span class=\"th\" data-t=\"ข้อพิพาท\"></span></td><td>Thương lượng, chọn 1 cơ quan<span class=\"th\" data-t=\"เจรจา เลือกหน่วยงานหนึ่งแห่ง\"></span></td><td><span class=\"fx\" data-k=\"VIAC / TÒA ÁN\"></span></td><td><span class=\"fx\" data-k=\"ĐỊA ĐIỂM\"></span></td></tr></table></div><p>Mọi ngoại lệ chỉ có giá trị khi ghi rõ điều khoản bị thay đổi, có chữ ký đại diện được ủy quyền của hai Bên. KSP phải hoàn tất phê duyệt rủi ro nội bộ trước khi ký, nhưng phiếu phê duyệt nội bộ không thuộc tài liệu hợp đồng cung cấp cho Bên B.<span class=\"th\" data-t=\"ข้อยกเว้นทั้งหมดมีผลก็ต่อเมื่อระบุข้อที่ถูกเปลี่ยนแปลงอย่างชัดเจน และมีลายมือชื่อของผู้แทนที่ได้รับมอบอำนาจของทั้งสองฝ่าย KSP ต้องดำเนินการอนุมัติความเสี่ยงภายในให้เสร็จสิ้นก่อนลงนาม ทั้งนี้ แบบฟอร์มอนุมัติภายในไม่เป็นส่วนของเอกสารสัญญาที่จัดส่งให้ฝ่าย B\"></span></p><p>Xác nhận Phụ lục: BÊN A <strong><span class=\"fx\" data-k=\"KÝ/TÊN/NGÀY\"></span></strong> | BÊN B <strong><span class=\"fx\" data-k=\"KÝ/TÊN/NGÀY\"></span></strong><span class=\"th\" data-t=\"การยืนยันภาคผนวก: ฝ่าย A 【KÝ/TÊN/NGÀY】 | ฝ่าย B 【KÝ/TÊN/NGÀY】\"></span></p><p><strong>DANH MỤC KIỂM TRA TRƯỚC KHI KÝ – CHỈ DÙNG NỘI BỘ KSP</strong><span class=\"th\" data-t=\"รายการตรวจสอบก่อนลงนาม – ใช้ภายใน KSP เท่านั้น\"></span></p><p>(1) Đã chọn rõ phạm vi HÀNG HÓA / GIA CÔNG, không trộn tiêu chuẩn không phù hợp.<span class=\"th\" data-t=\"(1) ได้เลือกขอบเขต สินค้า / การรับจ้างแปรรูป อย่างชัดเจนแล้ว ไม่ปะปนมาตรฐานที่ไม่เหมาะสม\"></span></p><p>(2) Bảng giá Phụ lục 01 có hiệu lực, không ghi “tham khảo” hoặc cho báo giá lại mỗi PO.<span class=\"th\" data-t=\"(2) ตารางราคาในภาคผนวก 01 มีผลบังคับ ไม่ระบุว่า “อ้างอิง” หรือให้เสนอราคาใหม่ในแต่ละ PO\"></span></p><p>(3) Cơ chế thay đổi giá A hoặc B được chọn, công thức B đầy đủ nếu áp dụng; mọi PO đã xác nhận được giữ giá.<span class=\"th\" data-t=\"(3) ได้เลือกกลไกการเปลี่ยนแปลงราคา A หรือ B แล้ว สูตร B ครบถ้วนหากใช้บังคับ PO ที่ได้รับการยืนยันทุกฉบับได้รับการคงราคา\"></span></p><p>(4) Phụ phí được niêm yết và phê duyệt trước, không tính tự động 35%/45% hoặc phí kho.<span class=\"th\" data-t=\"(4) ค่าธรรมเนียมเพิ่มเติมได้ประกาศและอนุมัติไว้ล่วงหน้า ไม่คิด 35%/45% หรือค่าคลังสินค้าโดยอัตโนมัติ\"></span></p><p>(5) Lead time, công suất, địa điểm giao, nghiệm thu, bảo hành và đầu mối đã điền.<span class=\"th\" data-t=\"(5) ได้กรอก Lead time กำลังการผลิต สถานที่ส่งมอบ การตรวจรับ การรับประกัน และผู้ประสานงานครบถ้วนแล้ว\"></span></p><p>(6) Không có điều khoản tự ý bán tài sản KSP; rà soát riêng các quyền giữ tài sản hợp pháp.<span class=\"th\" data-t=\"(6) ไม่มีข้อกำหนดให้ขายทรัพย์สินของ KSP โดยพลการ ทบทวนสิทธิยึดหน่วงทรัพย์สินที่ชอบด้วยกฎหมายเป็นการเฉพาะ\"></span></p><p>(7) Đã đánh giá trả trước / bảo lãnh / dòng tiền và phê duyệt ngoại lệ.<span class=\"th\" data-t=\"(7) ได้ประเมินการชำระล่วงหน้า / หนังสือค้ำประกัน / กระแสเงินสด และอนุมัติกรณียกเว้นแล้ว\"></span></p><p>(8) Đã làm ma trận Back-to-Back nếu PO có khách hàng cuối cùng.<span class=\"th\" data-t=\"(8) ได้จัดทำเมทริกซ์ Back-to-Back หาก PO มีลูกค้าปลายทาง\"></span></p><p>(9) Đã điền phụ lục 05 nếu gia công mạ kẽm; nếu mua hàng ghi không áp dụng.<span class=\"th\" data-t=\"(9) ได้กรอกภาคผนวก 05 หากเป็นการรับจ้างชุบสังกะสี หากเป็นการซื้อสินค้าให้ระบุว่าไม่ใช้บังคับ\"></span></p><p>(10) Đã kiểm tra quyền ký, phiên bản pháp luật và công ty luật rà soát trước sử dụng.<span class=\"th\" data-t=\"(10) ได้ตรวจสอบอำนาจลงนาม เวอร์ชันของกฎหมาย และสำนักงานกฎหมายได้ทบทวนก่อนนำไปใช้\"></span></p><p>BẢN DỰ THẢO ĐỀ XUẤT; KHÔNG PHẢI Ý KIẾN PHÁP LÝ HAY HỢP ĐỒNG ĐÃ ĐƯỢC PHÊ DUYỆT.<span class=\"th\" data-t=\"ร่างที่เสนอ ไม่ใช่ความเห็นทางกฎหมายหรือสัญญาที่ได้รับการอนุมัติแล้ว\"></span></p>", "o1": "<p class=\"ctr\">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM<span class=\"th\" data-t=\"สาธารณรัฐสังคมนิยมเวียดนาม\"></span></p><p class=\"ctr\">Độc lập - Tự do - Hạnh phúc<span class=\"th\" data-t=\"เอกราช - เสรีภาพ - ความสุข\"></span></p><p class=\"ctr\"><strong>HỢP ĐỒNG THI CÔNG XÂY DỰNG, LẮP ĐẶT VÀ TỔNG THẦU TRỌN GÓI (TURNKEY)</strong><span class=\"th\" data-t=\"สัญญาก่อสร้าง ติดตั้ง และงานรับเหมาเหมาจ่ายแบบครบวงจร (TURNKEY)\"></span></p><p class=\"ctr\">Số: <span class=\"fx\" data-k=\"SỐ HỢP ĐỒNG\"></span> | Dự án / PO: <span class=\"fx\" data-k=\"DỰ ÁN / MÃ PO / MÃ KHÁCH HÀNG\"></span><span class=\"th\" data-t=\"เลขที่: 【SỐ HỢP ĐỒNG】 | โครงการ / PO: 【DỰ ÁN / MÃ PO / MÃ KHÁCH HÀNG】\"></span></p><p>– Căn cứ Bộ luật Dân sự số 91/2015/QH13 và văn bản sửa đổi, bổ sung có hiệu lực tại thời điểm ký;<span class=\"th\" data-t=\"– โดยอาศัยประมวลกฎหมายแพ่ง ฉบับที่ 91/2015/QH13 และเอกสารแก้ไข เพิ่มเติมที่มีผลบังคับใช้ ณ เวลาลงนาม;\"></span></p><p>– Căn cứ Luật Xây dựng số 135/2025/QH15 (có hiệu lực từ 01/7/2026), các văn bản hướng dẫn về hợp đồng xây dựng, quản lý chất lượng, bảo hành và bảo trì công trình xây dựng hiện hành;<span class=\"th\" data-t=\"– อาศัยกฎหมายก่อสร้าง ฉบับที่ 135/2025/QH15 (มีผลตั้งแต่ 01/7/2026) และเอกสารแนวทางปฏิบัติว่าด้วยสัญญาก่อสร้าง การบริหารคุณภาพ การรับประกันและการบำรุงรักษางานก่อสร้างที่มีผลบังคับใช้ในปัจจุบัน;\"></span></p><p>– Căn cứ Luật Thương mại số 36/2005/QH11 trong phạm vi áp dụng đối với phần cung cấp hàng hóa, thiết bị;<span class=\"th\" data-t=\"– อาศัยกฎหมายการพาณิชย์ ฉบับที่ 36/2005/QH11 ภายในขอบเขตที่ใช้บังคับกับส่วนการจัดหาสินค้าและอุปกรณ์;\"></span></p><p>– Căn cứ hồ sơ thiết kế, yêu cầu kỹ thuật, bảng khối lượng (BOQ) và các tiêu chuẩn liệt kê tại Phụ lục 01;<span class=\"th\" data-t=\"– อาศัยแฟ้มแบบ ข้อกำหนดทางเทคนิค ตารางปริมาณงาน (BOQ) และมาตรฐานที่ระบุไว้ในภาคผนวก 01;\"></span></p><p>– Căn cứ nhu cầu và khả năng của Các Bên.<span class=\"th\" data-t=\"– โดยอาศัยความต้องการและความสามารถของคู่สัญญาทั้งสองฝ่าย\"></span></p><p>Hôm nay, ngày <span class=\"fx\" data-k=\"NGÀY\"></span> tháng <span class=\"fx\" data-k=\"THÁNG\"></span> năm <span class=\"fx\" data-k=\"NĂM\"></span>, Các Bên gồm:<span class=\"th\" data-t=\"วันนี้ วันที่ 【NGÀY】 เดือน 【THÁNG】 พ.ศ./ค.ศ. 【NĂM】 คู่สัญญาประกอบด้วย:\"></span></p><p class=\"sub\"><strong>BÊN A – CHỦ ĐẦU TƯ / BÊN GIAO THẦU (KHÁCH HÀNG): <span class=\"fx\" data-k=\"TÊN PHÁP LÝ KHÁCH HÀNG\"></span></strong><span class=\"th\" data-t=\"ฝ่าย A – เจ้าของโครงการ / ฝ่ายว่าจ้าง (ลูกค้า): 【TÊN PHÁP LÝ KHÁCH HÀNG】\"></span></p><p>Đại diện: <span class=\"fx\" data-k=\"HỌ TÊN NGƯỜI KÝ\"></span> Chức vụ: <span class=\"fx\" data-k=\"CHỨC VỤ\"></span> Căn cứ thẩm quyền: <span class=\"fx\" data-k=\"ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY\"></span><span class=\"th\" data-t=\"ผู้แทน: 【HỌ TÊN NGƯỜI KÝ】 ตำแหน่ง: 【CHỨC VỤ】 ฐานอำนาจ: 【ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY】\"></span></p><p>Địa chỉ: <span class=\"fx\" data-k=\"ĐỊA CHỈ ĐĂNG KÝ\"></span> Mã số thuế / Mã số doanh nghiệp: <span class=\"fx\" data-k=\"MST / GCN ĐKDN\"></span><span class=\"th\" data-t=\"ที่อยู่: 【ĐỊA CHỈ ĐĂNG KÝ】 เลขประจำตัวผู้เสียภาษี / รหัสวิสาหกิจ: 【MST / GCN ĐKDN】\"></span></p><p>Tài khoản: <span class=\"fx\" data-k=\"CHỦ TÀI KHOẢN / SỐ TÀI KHOẢN / NGÂN HÀNG\"></span> Đại diện nhận thông báo: <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ\"></span> Email: <span class=\"fx\" data-k=\"EMAIL\"></span><span class=\"th\" data-t=\"บัญชี: 【CHỦ TÀI KHOẢN / SỐ TÀI KHOẢN / NGÂN HÀNG】 ผู้แทนรับหนังสือแจ้ง: 【HỌ TÊN / CHỨC VỤ】 อีเมล: 【EMAIL】\"></span></p><p class=\"sub\"><strong>BÊN B – NHÀ THẦU: CÔNG TY TNHH KSP VIỆT NAM <span class=\"fx\" data-k=\"CHI NHÁNH / ĐƠN VỊ THỰC HIỆN, NẾU CÓ\"></span></strong><span class=\"th\" data-t=\"ฝ่าย B – ผู้รับเหมา: บริษัท KSP เวียดนาม จำกัด (CÔNG TY TNHH KSP VIỆT NAM) 【CHI NHÁNH / ĐƠN VỊ THỰC HIỆN, NẾU CÓ】\"></span></p><p>Đại diện: <span class=\"fx\" data-k=\"HỌ TÊN NGƯỜI KÝ\"></span> Chức vụ: <span class=\"fx\" data-k=\"CHỨC VỤ\"></span> Căn cứ thẩm quyền: <span class=\"fx\" data-k=\"ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY\"></span><span class=\"th\" data-t=\"ผู้แทน: 【HỌ TÊN NGƯỜI KÝ】 ตำแหน่ง: 【CHỨC VỤ】 ฐานอำนาจ: 【ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY】\"></span></p><p>Địa chỉ: <span class=\"fx\" data-k=\"ĐỊA CHỈ PHÁP LÝ KSP – KIỂM TRA ĐĂNG KÝ HIỆN HÀNH\"></span> Mã số thuế: <span class=\"fx\" data-k=\"MST KSP / CHI NHÁNH\"></span><span class=\"th\" data-t=\"ที่อยู่: 【ĐỊA CHỈ PHÁP LÝ KSP – KIỂM TRA ĐĂNG KÝ HIỆN HÀNH】 เลขประจำตัวผู้เสียภาษี: 【MST KSP / CHI NHÁNH】\"></span></p><p>Tài khoản: <span class=\"fx\" data-k=\"SỐ TÀI KHOẢN / NGÂN HÀNG KSP\"></span> Đại diện nhận thông báo: <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ\"></span> Email: <span class=\"fx\" data-k=\"EMAIL\"></span><span class=\"th\" data-t=\"บัญชี: 【SỐ TÀI KHOẢN / NGÂN HÀNG KSP】 ผู้แทนรับหนังสือแจ้ง: 【HỌ TÊN / CHỨC VỤ】 อีเมล: 【EMAIL】\"></span></p><p>Hai Bên thỏa thuận ký kết hợp đồng thi công xây dựng, cung cấp, lắp đặt và chạy thử (“Hợp đồng”) với các điều khoản sau:<span class=\"th\" data-t=\"ทั้งสองฝ่ายตกลงทำสัญญาก่อสร้าง จัดหา ติดตั้ง และทดสอบเดินระบบ (“สัญญา” (“Hợp đồng”)) โดยมีข้อกำหนดดังต่อไปนี้\"></span></p><h3 class=\"art\" data-n=\"1\"><strong>ĐIỀU 1. ĐỊNH NGHĨA, HỒ SƠ HỢP ĐỒNG VÀ THỨ TỰ ƯU TIÊN</strong><span class=\"th\" data-t=\"ข้อ 1. คำนิยาม เอกสารสัญญา และลำดับความสำคัญ\"></span></h3><p class=\"lv1\"><span class=\"lb\">1.1</span>Công trình / Dự án: <span class=\"fx\" data-k=\"TÊN CÔNG TRÌNH / DỰ ÁN\"></span> tại <span class=\"fx\" data-k=\"ĐỊA ĐIỂM\"></span>. Hình thức thực hiện: <span class=\"fx\" data-k=\"THI CÔNG / THI CÔNG VÀ LẮP ĐẶT / TURNKEY (THIẾT KẾ – CUNG CẤP – THI CÔNG – CHẠY THỬ – BÀN GIAO)\"></span>.<span class=\"th\" data-t=\"งาน / โครงการ: 【TÊN CÔNG TRÌNH / DỰ ÁN】 ณ 【ĐỊA ĐIỂM】 รูปแบบการดำเนินการ: 【THI CÔNG / THI CÔNG VÀ LẮP ĐẶT / TURNKEY (THIẾT KẾ – CUNG CẤP – THI CÔNG – CHẠY THỬ – BÀN GIAO)】\"></span></p><p class=\"lv1\"><span class=\"lb\">1.2</span>Hồ sơ hợp đồng gồm: Hợp đồng này; Phụ lục 01 (Phạm vi, BOQ, bản vẽ, yêu cầu kỹ thuật); Phụ lục 02 (Tiến độ và thanh toán); Phụ lục 03 (HSE); Phụ lục 05 (Phiếu thay đổi); Phụ lục 06 (Điều kiện đặc biệt đã ký). Khi có mâu thuẫn, áp dụng thứ tự ưu tiên tại Điều 23.3.<span class=\"th\" data-t=\"เอกสารสัญญาประกอบด้วย: สัญญาฉบับนี้; ภาคผนวก 01 (ขอบเขต BOQ แบบแปลน ข้อกำหนดทางเทคนิค); ภาคผนวก 02 (กำหนดการและการชำระเงิน); ภาคผนวก 03 (HSE); ภาคผนวก 05 (แบบฟอร์มการเปลี่ยนแปลง); ภาคผนวก 06 (เงื่อนไขพิเศษที่ลงนามแล้ว) เมื่อมีความขัดแย้ง ให้ใช้ลำดับความสำคัญตามข้อ 23.3\"></span></p><h3 class=\"art\" data-n=\"2\"><strong>ĐIỀU 2. PHẠM VI CÔNG VIỆC</strong><span class=\"th\" data-t=\"ข้อ 2. ขอบเขตงาน\"></span></h3><p class=\"lv1\"><span class=\"lb\">2.1</span>Bên B thực hiện <span class=\"fx\" data-k=\"THIẾT KẾ (NẾU TURNKEY) / CUNG CẤP THIẾT BỊ, VẬT TƯ / THI CÔNG XÂY DỰNG / LẮP ĐẶT / THỬ NGHIỆM, CHẠY THỬ / ĐÀO TẠO VẬN HÀNH / BÀN GIAO\"></span> theo phạm vi mô tả tại Phụ lục 01.<span class=\"th\" data-t=\"ฝ่าย B ดำเนินการ 【THIẾT KẾ (NẾU TURNKEY) / CUNG CẤP THIẾT BỊ, VẬT TƯ / THI CÔNG XÂY DỰNG / LẮP ĐẶT / THỬ NGHIỆM, CHẠY THỬ / ĐÀO TẠO VẬN HÀNH / BÀN GIAO】 ตามขอบเขตที่อธิบายไว้ในภาคผนวก 01\"></span></p><p class=\"lv1\"><span class=\"lb\">2.2</span>Trong hình thức Turnkey, Bên B chịu trách nhiệm tổ chức toàn bộ công việc từ thiết kế (nếu thuộc phạm vi) đến khi công trình đạt thông số vận hành tại Phụ lục 01 và được Bên A tiếp nhận; các hạng mục Bên A thực hiện hoặc cung cấp được liệt kê rõ tại Phụ lục 01 (ngoài phạm vi và giá của Bên B).<span class=\"th\" data-t=\"ในรูปแบบ Turnkey ฝ่าย B รับผิดชอบในการจัดการงานทั้งหมดตั้งแต่การออกแบบ (หากอยู่ในขอบเขต) จนกว่าอาคาร/งานก่อสร้างจะบรรลุค่าพารามิเตอร์การใช้งานตามภาคผนวก 01 และฝ่าย A รับมอบ รายการที่ฝ่าย A ดำเนินการหรือจัดหาเองระบุไว้อย่างชัดเจนในภาคผนวก 01 (อยู่นอกขอบเขตและนอกราคาของฝ่าย B)\"></span></p><p class=\"lv1\"><span class=\"lb\">2.3</span>Công việc không nêu tại Phụ lục 01 nhưng cần thiết hợp lý để công trình vận hành theo mục đích đã thỏa thuận chỉ được coi là trong phạm vi nếu thuộc nội dung mà Bên B đã biết hoặc phải biết từ hồ sơ mời thầu, bản vẽ; phần còn lại là phát sinh theo Điều 11.<span class=\"th\" data-t=\"งานที่ไม่ได้ระบุไว้ในภาคผนวก 01 แต่มีความจำเป็นตามสมควรเพื่อให้งานก่อสร้างใช้งานได้ตามวัตถุประสงค์ที่ตกลงกัน จะถือว่าอยู่ในขอบเขตก็ต่อเมื่ออยู่ในเนื้อหาที่ฝ่าย B ทราบหรือควรทราบจากเอกสารเชิญประกวดราคา และแบบแปลน ส่วนที่เหลือถือเป็นงานเพิ่มตามข้อ 11\"></span></p><h3 class=\"art\" data-n=\"3\"><strong>ĐIỀU 3. GIÁ HỢP ĐỒNG VÀ LOẠI GIÁ</strong><span class=\"th\" data-t=\"ข้อ 3. ราคาสัญญาและประเภทราคา\"></span></h3><p class=\"lv1\"><span class=\"lb\">3.1</span>Loại giá hợp đồng: <span class=\"fx\" data-k=\"TRỌN GÓI / ĐƠN GIÁ CỐ ĐỊNH / ĐƠN GIÁ ĐIỀU CHỈNH / KẾT HỢP\"></span>. Giá trước VAT: <span class=\"fx\" data-k=\"SỐ TIỀN\"></span> VNĐ; VAT <span class=\"fx\" data-k=\"8/10\"></span>%: <span class=\"fx\" data-k=\"SỐ TIỀN\"></span> VNĐ; tổng cộng: <span class=\"fx\" data-k=\"SỐ TIỀN\"></span> VNĐ (bằng chữ: <span class=\"fx\" data-k=\"\"></span>).<span class=\"th\" data-t=\"ประเภทราคาสัญญา: 【TRỌN GÓI / ĐƠN GIÁ CỐ ĐỊNH / ĐƠN GIÁ ĐIỀU CHỈNH / KẾT HỢP】 ราคาก่อนภาษีมูลค่าเพิ่ม (VAT): 【SỐ TIỀN】 ดอง (VNĐ); ภาษีมูลค่าเพิ่ม (VAT) 【8/10】 %: 【SỐ TIỀN】 VNĐ; รวมทั้งสิ้น: 【SỐ TIỀN】 VNĐ (ตัวอักษร: 【】)\"></span></p><p class=\"lv1\"><span class=\"lb\">3.2</span>Giá trọn gói bao gồm mọi chi phí, thuế, phí để hoàn thành phạm vi tại Phụ lục 01 (trừ VAT), không điều chỉnh do thay đổi khối lượng trong phạm vi, trừ các trường hợp tại Điều 11 và biến động chính sách pháp luật làm thay đổi nghĩa vụ thuế, phí.<span class=\"th\" data-t=\"ราคาเหมาจ่ายรวมค่าใช้จ่าย ภาษี และค่าธรรมเนียมทั้งหมดเพื่อให้งานแล้วเสร็จตามขอบเขตในภาคผนวก 01 (ไม่รวมภาษีมูลค่าเพิ่ม (VAT)) ไม่ปรับราคาเนื่องจากการเปลี่ยนแปลงปริมาณงานภายในขอบเขต เว้นแต่กรณีตามข้อ 11 และการเปลี่ยนแปลงนโยบายกฎหมายที่ทำให้ภาระภาษีและค่าธรรมเนียมเปลี่ยนแปลง\"></span></p><p class=\"lv1\"><span class=\"lb\">3.3</span>Điều chỉnh giá (chỉ áp dụng khi chọn đơn giá điều chỉnh hoặc khi có thỏa thuận tại Phụ lục 06): công thức / chỉ số <span class=\"fx\" data-k=\"CÔNG THỨC, NGUỒN CHỈ SỐ, NGƯỠNG ĐIỀU CHỈNH, THỜI ĐIỂM\"></span>.<span class=\"th\" data-t=\"การปรับราคา (ใช้บังคับเฉพาะเมื่อเลือกราคาต่อหน่วยแบบปรับได้ หรือเมื่อมีข้อตกลงในภาคผนวก 06): สูตร / ดัชนี 【CÔNG THỨC, NGUỒN CHỈ SỐ, NGƯỠNG ĐIỀU CHỈNH, THỜI ĐIỂM】\"></span></p><p class=\"lv1\"><span class=\"lb\">3.4</span>Thuế suất VAT áp dụng theo quy định có hiệu lực tại thời điểm xuất hóa đơn; nếu pháp luật thay đổi sau ngày ký, hai Bên điều chỉnh phần thuế tương ứng mà không thay đổi giá chưa thuế.<span class=\"th\" data-t=\"อัตราภาษีมูลค่าเพิ่ม (VAT) ให้ใช้ตามระเบียบที่มีผลบังคับ ณ เวลาออกใบแจ้งหนี้/ใบกำกับภาษี หากกฎหมายเปลี่ยนแปลงภายหลังวันลงนาม ทั้งสองฝ่ายจะปรับส่วนภาษีที่เกี่ยวข้อง โดยไม่เปลี่ยนแปลงราคาที่ยังไม่รวมภาษี\"></span></p><h3 class=\"art\" data-n=\"4\"><strong>ĐIỀU 4. TẠM ỨNG, THANH TOÁN VÀ BẢO LÃNH TẠM ỨNG</strong><span class=\"th\" data-t=\"ข้อ 4. เงินล่วงหน้า การชำระเงิน และหนังสือค้ำประกันเงินล่วงหน้า\"></span></h3><p class=\"lv1\"><span class=\"lb\">4.1</span>Tạm ứng: <span class=\"fx\" data-k=\"TỶ LỆ\"></span>% giá trị hợp đồng (<span class=\"fx\" data-k=\"SỐ TIỀN\"></span> VNĐ) trong <span class=\"fx\" data-k=\"07\"></span> ngày kể từ khi Bên A nhận được (i) đề nghị tạm ứng, (ii) bảo lãnh tạm ứng của ngân hàng hoạt động hợp pháp tại Việt Nam với giá trị bằng khoản tạm ứng, (iii) hóa đơn hợp lệ. Tạm ứng được thu hồi theo tỷ lệ <span class=\"fx\" data-k=\"\"></span>% giá trị mỗi đợt thanh toán.<span class=\"th\" data-t=\"เงินล่วงหน้า: 【TỶ LỆ】 % ของมูลค่าสัญญา (【SỐ TIỀN】 VNĐ) ภายใน 【07】 วัน นับจากวันที่ฝ่าย A ได้รับ (i) คำขอรับเงินล่วงหน้า (ii) หนังสือค้ำประกันเงินล่วงหน้าของธนาคารที่ประกอบธุรกิจโดยชอบด้วยกฎหมายในเวียดนาม มูลค่าเท่ากับเงินล่วงหน้า (iii) ใบแจ้งหนี้/ใบกำกับภาษีที่ถูกต้อง เงินล่วงหน้าจะถูกหักคืนตามอัตรา 【】 % ของมูลค่าการชำระเงินแต่ละงวด\"></span></p><p class=\"lv1\"><span class=\"lb\">4.2</span>Thanh toán theo giai đoạn / khối lượng nghiệm thu theo Phụ lục 02. Hồ sơ thanh toán gồm: biên bản nghiệm thu khối lượng hoặc giai đoạn, bảng xác nhận giá trị thanh toán, hóa đơn điện tử hợp lệ theo Nghị định 123/2020/NĐ-CP, và các chứng từ chất lượng theo Điều 9.<span class=\"th\" data-t=\"การชำระเงินตามงวด / ปริมาณงานที่ตรวจรับตามภาคผนวก 02 เอกสารประกอบการชำระเงินประกอบด้วย: รายงานการตรวจรับปริมาณงานหรืองวดงาน ตารางยืนยันมูลค่าการชำระเงิน ใบแจ้งหนี้/ใบกำกับภาษีอิเล็กทรอนิกส์ที่ถูกต้องตามพระราชกฤษฎีกา (Nghị định) ฉบับที่ 123/2020/NĐ-CP และเอกสารด้านคุณภาพตามข้อ 9\"></span></p><p class=\"lv1\"><span class=\"lb\">4.3</span>Bên A thanh toán trong <span class=\"fx\" data-k=\"15 / 30\"></span> ngày kể từ ngày nhận đủ hồ sơ hợp lệ, bằng chuyển khoản VNĐ vào tài khoản của Bên B nêu tại phần đầu Hợp đồng. Thời hạn chỉ bắt đầu khi hồ sơ đầy đủ; thiếu sót phải được Bên A thông báo bằng văn bản trong <span class=\"fx\" data-k=\"05\"></span> ngày làm việc kể từ khi nhận hồ sơ.<span class=\"th\" data-t=\"ฝ่าย A ชำระเงินภายใน 【15 / 30】 วัน นับจากวันที่ได้รับเอกสารที่ถูกต้องครบถ้วน โดยโอนเงินเป็น VNĐ เข้าบัญชีของฝ่าย B ตามที่ระบุไว้ในส่วนต้นของสัญญา ระยะเวลาจะเริ่มนับต่อเมื่อเอกสารครบถ้วน หากมีข้อบกพร่อง ฝ่าย A ต้องแจ้งเป็นลายลักษณ์อักษรภายใน 【05】 วันทำการ นับจากวันที่ได้รับเอกสาร\"></span></p><p class=\"lv1\"><span class=\"lb\">4.4</span>Giữ lại bảo hành: <span class=\"fx\" data-k=\"3 / 5\"></span>% giá trị quyết toán, được hoàn trả trong <span class=\"fx\" data-k=\"\"></span> ngày sau khi hết thời hạn bảo hành hoặc thay thế bằng bảo lãnh bảo hành theo Điều 13.<span class=\"th\" data-t=\"เงินประกันผลงานที่กักไว้ (Retention) เพื่อการรับประกัน: 【3 / 5】 % ของมูลค่าที่ตัดยอด จะคืนภายใน 【】 วัน หลังสิ้นสุดระยะเวลารับประกัน หรือให้ใช้หนังสือค้ำประกันการรับประกันแทนตามข้อ 13\"></span></p><p class=\"lv1\"><span class=\"lb\">4.5</span>Chậm thanh toán phần không tranh chấp: Bên A trả lãi <span class=\"fx\" data-k=\"\"></span>%/năm trên số tiền chậm, không vượt mức pháp luật cho phép, tính từ ngày quá hạn đến ngày thanh toán thực tế; ngoài ra Bên B có quyền áp dụng Điều 15.3.<span class=\"th\" data-t=\"การชำระเงินล่าช้าในส่วนที่ไม่มีข้อพิพาท: ฝ่าย A ต้องชำระดอกเบี้ยอั
