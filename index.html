lass=\"lv0 bl\"><span class=\"lb\">•</span>Yêu cầu Bên B thay thế nhân sự quản lý, cán bộ kỹ thuật, tổ đội thi công hoặc các nguồn lực khác không đáp ứng yêu cầu về năng lực, chất lượng hoặc tiến độ.<span class=\"th\" data-t=\"เรียกให้ฝ่าย B เปลี่ยนตัวบุคลากรบริหาร เจ้าหน้าที่เทคนิค ทีมงานก่อสร้าง หรือทรัพยากรอื่นที่ไม่ตรงตามข้อกำหนดด้านความสามารถ คุณภาพ หรือกำหนดการ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên A chỉ được tạm giữ khoản thanh toán tương ứng trực tiếp với phần công việc đang bị tranh chấp, chưa nghiệm thu hoặc khoản khấu trừ có căn cứ, và phải thông báo số tiền, căn cứ cho Bên B; khoản không tranh chấp tiếp tục thanh toán đúng hạn.<span class=\"th\" data-t=\"ฝ่าย A กักไว้ได้เฉพาะเงินชำระที่สัมพันธ์โดยตรงกับงานส่วนที่อยู่ระหว่างพิพาท ยังไม่ได้ตรวจรับ หรือเงินที่หักโดยมีมูลเหตุ และต้องแจ้งจำนวนเงินและมูลเหตุแก่ฝ่าย B; เงินส่วนที่ไม่มีข้อพิพาทให้ชำระต่อไปตามกำหนด\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên A có quyền tự mình hoặc thuê đơn vị khác thực hiện một phần hoặc toàn bộ khối lượng công việc mà Bên B chậm thực hiện, không đáp ứng tiến độ hoặc không có khả năng thực hiện nhằm đảm bảo tiến độ chung của công trình:<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิดำเนินการเองหรือว่าจ้างหน่วยงานอื่นดำเนินงานปริมาณงานบางส่วนหรือทั้งหมดที่ฝ่าย B ดำเนินการล่าช้า ไม่เป็นไปตามกำหนดการ หรือไม่มีความสามารถดำเนินการ เพื่อรับรองกำหนดการโดยรวมของงานก่อสร้าง:\"></span></p><p class=\"lv0\"><span class=\"lb\">i)</span>Bên B chịu chi phí thực tế, hợp lý và có chứng từ của việc thuê đơn vị thay thế cho phần công việc mà Bên B vi phạm, gồm chênh lệch giá hợp lý và chi phí khắc phục do lỗi Bên B; không tính trùng với cùng khoản thiệt hại đã bồi thường.<span class=\"th\" data-t=\"ฝ่าย B รับผิดชอบค่าใช้จ่ายจริง ที่สมเหตุสมผล และมีเอกสารหลักฐาน ในการว่าจ้างหน่วยงานทดแทนสำหรับงานส่วนที่ฝ่าย B ผิดสัญญา ซึ่งรวมถึงส่วนต่างของราคาที่สมเหตุสมผลและค่าใช้จ่ายในการแก้ไขอันเกิดจากความผิดของฝ่าย B; ไม่คิดซ้ำกับความเสียหายรายการเดียวกันที่ได้ชดใช้แล้ว\"></span></p><p class=\"lv0\"><span class=\"lb\">ii)</span>Bên A có quyền bù trừ các khoản phải thu đã được xác định hợp lệ vào khoản tiền đến hạn trả Bên B sau khi có thông báo và chứng từ phù hợp. Phần còn thiếu Bên B hoàn trả trong <strong><span class=\"fx\" data-k=\"07\"></span></strong> ngày làm việc kể từ ngày nhận yêu cầu hợp lệ; các khoản đang tranh chấp giải quyết theo Điều 19.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิหักกลบหนี้ลูกหนี้ที่ได้รับการกำหนดโดยชอบแล้วกับเงินที่ถึงกำหนดชำระแก่ฝ่าย B หลังจากมีหนังสือแจ้งและเอกสารหลักฐานที่เหมาะสม ส่วนที่ขาด ฝ่าย B ต้องคืนภายใน 【07】 วันทำการนับแต่วันที่ได้รับการเรียกร้องโดยชอบ; รายการที่อยู่ระหว่างพิพาทให้ระงับตามข้อ 19\"></span></p><p class=\"lv0\"><span class=\"lb\">iii)</span>Khối lượng thuê thay thế và chi phí phát sinh phải được lập biên bản tại hiện trường, có tài liệu kỹ thuật, báo giá và chứng từ hợp lý. Bên B được mời tham gia xác nhận; việc Bên B không tham gia sau khi được thông báo hợp lệ không ngăn Bên A ghi nhận bằng chứng độc lập.<span class=\"th\" data-t=\"ปริมาณงานที่ว่าจ้างทดแทนและค่าใช้จ่ายที่เกิดขึ้นต้องจัดทำรายงาน ณ สถานที่ มีเอกสารทางเทคนิค ใบเสนอราคา และเอกสารหลักฐานที่สมเหตุสมผล ฝ่าย B ได้รับเชิญเข้าร่วมยืนยัน; การที่ฝ่าย B ไม่เข้าร่วมภายหลังได้รับแจ้งโดยชอบ ไม่เป็นอุปสรรคต่อฝ่าย A ในการบันทึกหลักฐานอย่างเป็นอิสระ\"></span></p><p class=\"lv0\"><span class=\"lb\">iv)</span>Bên B có quyền phản hồi, đối chiếu và khiếu nại khoản khấu trừ theo trình tự giải quyết tranh chấp tại Điều 19, nhưng phải tiếp tục thực hiện các nghĩa vụ không tranh chấp.<span class=\"th\" data-t=\"ฝ่าย B มีสิทธิชี้แจง ตรวจทานเทียบเคียง และโต้แย้งรายการที่ถูกหักตามขั้นตอนระงับข้อพิพาทในข้อ 19 แต่ต้องดำเนินหน้าที่ที่ไม่มีข้อพิพาทต่อไป\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Áp dụng các khoản phạt vi phạm, bồi thường thiệt hại và các chế tài khác theo quy định của Hợp đồng và pháp luật hiện hành.<span class=\"th\" data-t=\"ให้ใช้ค่าปรับตามสัญญา การชดใช้ค่าเสียหาย และมาตรการบังคับอื่น ๆ ตามที่กำหนดในสัญญาและกฎหมายที่มีผลใช้บังคับ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên A có quyền yêu cầu Bên B tăng cường nhân công và làm thêm giờ để đảm bảo tiến độ đã cam kết. Trong trường hợp này, Bên A không phải thanh toán thêm bất kỳ chi phí nào phát sinh do việc tăng nhân công hoặc làm thêm giờ.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิเรียกให้ฝ่าย B เพิ่มแรงงานและทำงานล่วงเวลาเพื่อให้เป็นไปตามกำหนดการที่ได้ให้คำมั่นไว้ ในกรณีนี้ ฝ่าย A ไม่ต้องชำระค่าใช้จ่ายเพิ่มเติมใด ๆ ที่เกิดขึ้นจากการเพิ่มแรงงานหรือการทำงานล่วงเวลา\"></span></p><h3 class=\"art\" data-n=\"4\">ĐIỀU 4. HÌNH THỨC VÀ GIÁ TRỊ HỢP ĐỒNG<span class=\"th\" data-t=\"ข้อ 4 รูปแบบและมูลค่าของสัญญา\"></span></h3><p class=\"sub\">4.1 Hình thức hợp đồng<span class=\"th\" data-t=\"4.1 รูปแบบของสัญญา\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>4.1. Hình thức hợp đồng: <strong><span class=\"fx\" data-k=\"ĐƠN GIÁ CỐ ĐỊNH / TRỌN GÓI / ĐƠN GIÁ ĐIỀU CHỈNH\"></span></strong>. Trường hợp đơn giá cố định, giá thanh toán được tính theo khối lượng thực tế được nghiệm thu nhân với đơn giá cố định trong BOQ; giá chỉ thay đổi theo Điều 20 và các trường hợp pháp luật bắt buộc. Không đồng thời ghi giá trọn gói và quyết toán khối lượng thực tế nếu không tách phạm vi riêng.<span class=\"th\" data-t=\"4.1 รูปแบบสัญญา: 【ĐƠN GIÁ CỐ ĐỊNH / TRỌN GÓI / ĐƠN GIÁ ĐIỀU CHỈNH】 กรณีราคาต่อหน่วยคงที่ ราคาชำระคำนวณจากปริมาณงานจริงที่ผ่านการตรวจรับคูณด้วยราคาต่อหน่วยคงที่ใน BOQ ราคาเปลี่ยนแปลงได้เฉพาะตามข้อ 20 และกรณีที่กฎหมายบังคับ ห้ามระบุราคาเหมารวมพร้อมกับการสรุปบัญชีตามปริมาณงานจริง เว้นแต่ได้แยกขอบเขตไว้ต่างหาก\"></span></p><p>Bên B xác nhận đã kiểm tra hồ sơ được cung cấp, khảo sát các điều kiện hiện trường có thể tiếp cận hợp lý và tính đủ chi phí thực hiện phạm vi công việc trước khi ký Hợp đồng. Biến động giá thông thường, thiếu nhân lực, thiết bị, vật tư và các điều kiện có thể nhận biết qua khảo sát hợp lý thuộc trách nhiệm Bên B, không là căn cứ yêu cầu tăng đơn giá hoặc gia hạn.<span class=\"th\" data-t=\"ผู้รับเหมา (ฝ่าย B) ยืนยันว่าได้ตรวจสอบเอกสารที่ได้รับมอบ สำรวจสภาพหน้างานเท่าที่สามารถเข้าถึงได้อย่างสมเหตุสมผล และได้คำนวณค่าใช้จ่ายในการดำเนินงานตามขอบเขตงานครบถ้วนแล้วก่อนลงนามในสัญญา ความผันผวนของราคาตามปกติ การขาดแคลนแรงงาน เครื่องจักร วัสดุ และสภาพการณ์ที่สามารถรับรู้ได้จากการสำรวจตามสมควร เป็นความรับผิดชอบของฝ่าย B และไม่ใช่เหตุที่จะเรียกร้องให้เพิ่มราคาต่อหน่วยหรือขยายระยะเวลา\"></span></p><p>Khi phát hiện điều kiện hiện trường khác biệt đáng kể mà không thể phát hiện bằng khảo sát hợp lý hoặc từ hồ sơ được cung cấp, Bên B phải thông báo bằng văn bản trong 02 ngày làm việc, bảo vệ hiện trường và cung cấp chứng cứ để Bên A kiểm tra trước khi xử lý, trừ tình huống khẩn cấp theo Điều 20. Việc thông báo không tự động làm phát sinh quyền điều chỉnh giá hoặc tiến độ. Mọi điều chỉnh phải xác định rõ nguyên nhân, trách nhiệm, ảnh hưởng thực tế và được người có thẩm quyền của hai Bên phê duyệt bằng phụ lục, trừ trường hợp pháp luật bắt buộc quy định khác. Bên B tiếp tục thực hiện các công việc không bị ảnh hưởng<span class=\"th\" data-t=\"เมื่อพบสภาพหน้างานที่แตกต่างอย่างมีนัยสำคัญซึ่งไม่อาจตรวจพบได้จากการสำรวจตามสมควรหรือจากเอกสารที่ได้รับมอบ ฝ่าย B ต้องแจ้งเป็นหนังสือภายใน 02 วันทำการ รักษาสภาพหน้างาน และจัดหาพยานหลักฐานเพื่อให้ฝ่าย A ตรวจสอบก่อนดำเนินการแก้ไข เว้นแต่เป็นกรณีฉุกเฉินตามข้อ 20 การแจ้งดังกล่าวไม่ก่อให้เกิดสิทธิในการปรับราคาหรือกำหนดการโดยอัตโนมัติ การปรับเปลี่ยนทุกกรณีต้องระบุสาเหตุ ความรับผิดชอบ และผลกระทบที่เกิดขึ้นจริงอย่างชัดเจน และต้องได้รับการอนุมัติจากผู้มีอำนาจของทั้งสองฝ่ายโดยทำเป็นภาคผนวก เว้นแต่กฎหมายบังคับไว้เป็นอย่างอื่น ฝ่าย B ต้องดำเนินงานส่วนที่ไม่ได้รับผลกระทบต่อไป\"></span></p><p class=\"lv1\"><span class=\"lb\">4.2</span>4.2. Giá trị hợp đồng (Chi tiết Phụ lục 01):<span class=\"th\" data-t=\"4.2 มูลค่าสัญญา (รายละเอียดตามภาคผนวก 01):\"></span></p><p>- Tổng giá trị trước thuế: <strong><span class=\"fx\" data-k=\"SỐ TIỀN\"></span></strong> VNĐ<span class=\"th\" data-t=\"- มูลค่ารวมก่อนภาษี: 【SỐ TIỀN】 ดง (VNĐ)\"></span></p><p>- Thuế GTGT (VAT) <strong><span class=\"fx\" data-k=\"THUẾ SUẤT %\"></span></strong>%: <strong><span class=\"fx\" data-k=\"SỐ TIỀN\"></span></strong> VNĐ<span class=\"th\" data-t=\"- ภาษีมูลค่าเพิ่ม (VAT) 【THUẾ SUẤT %】 %: 【SỐ TIỀN】 ดง (VNĐ)\"></span></p><p>- Tổng giá trị gồm thuế: <strong><span class=\"fx\" data-k=\"SỐ TIỀN\"></span></strong> VNĐ<span class=\"th\" data-t=\"- มูลค่ารวมรวมภาษี: 【SỐ TIỀN】 ดง (VNĐ)\"></span></p><p>(Bằng chữ: <strong><span class=\"fx\" data-k=\"SỐ TIỀN BẰNG CHỮ\"></span></strong>)<span class=\"th\" data-t=\"(ตัวอักษร: 【SỐ TIỀN BẰNG CHỮ】)\"></span></p><p class=\"sub\">4.3  Giá trị hợp đồng đã bao gồm toàn bộ chi phí để Bên B thực hiện đầy đủ công việc, gồm: chi phí nhân công thi công, chi phí máy móc thiết bị phục vụ thi công (kể cả nhiên liệu, vận hành, khấu hao, sửa chữa trong suốt thời gian thi công), chi phí lán trại, kho bãi, sinh hoạt công nhân, chi phí quản lý, bảo hộ lao động, an toàn, vệ sinh môi trường và các chi phí liên quan khác. Mọi chi phí phát sinh phục vụ cho việc thi công hoàn thành đúng thiết kế, tiến độ, chất lượng và an toàn đều do Bên B tự chịu, trừ những hạng mục được Bên A cấp phát hoặc được Bên A phê duyệt bằng văn bản. . Bên B chỉ được yêu cầu thanh toán bổ sung khi có sửa đổi được phê duyệt hợp lệ theo Điều 20 hoặc căn cứ bắt buộc của pháp luật.<span class=\"th\" data-t=\"4.3 มูลค่าสัญญารวมค่าใช้จ่ายทั้งหมดเพื่อให้ฝ่าย B ดำเนินงานครบถ้วน ได้แก่ ค่าแรงงานก่อสร้าง ค่าเครื่องจักรอุปกรณ์สำหรับการก่อสร้าง (รวมเชื้อเพลิง การเดินเครื่อง ค่าเสื่อมราคา การซ่อมแซมตลอดระยะเวลาก่อสร้าง) ค่าสำนักงานชั่วคราว คลังและลานเก็บของ ค่าที่พักคนงาน ค่าบริหารจัดการ เครื่องป้องกันความปลอดภัยส่วนบุคคล ความปลอดภัย สุขอนามัยสิ่งแวดล้อม และค่าใช้จ่ายอื่นที่เกี่ยวข้อง ค่าใช้จ่ายทั้งหมดที่เกิดขึ้นเพื่อให้การก่อสร้างแล้วเสร็จถูกต้องตามแบบ กำหนดการ คุณภาพ และความปลอดภัย ฝ่าย B เป็นผู้รับผิดชอบเอง เว้นแต่รายการที่ฝ่าย A จัดสรรให้ หรือที่ฝ่าย A อนุมัติเป็นลายลักษณ์อักษร ฝ่าย B มีสิทธิเรียกร้องการชำระเงินเพิ่มเติมได้เฉพาะเมื่อมีการแก้ไขที่ได้รับอนุมัติโดยชอบตามข้อ 20 หรือตามเหตุบังคับของกฎหมาย\"></span></p><p>4.4. Thuế GTGT tính theo pháp luật tại thời điểm lập hóa đơn; mọi thay đổi thuế suất được xử lý theo pháp luật và không được mặc nhiên coi là thay đổi đơn giá trước thuế.<span class=\"th\" data-t=\"4.4. ภาษีมูลค่าเพิ่มคำนวณตามกฎหมายณ เวลาที่ออกใบกำกับภาษี การเปลี่ยนแปลงอัตราภาษีใด ๆ ให้ดำเนินการตามกฎหมาย และจะไม่ถือโดยปริยายว่าเป็นการเปลี่ยนแปลงราคาต่อหน่วยก่อนภาษี\"></span></p><h3 class=\"art\" data-n=\"5\">ĐIỀU 5. TẠM ỨNG, THANH TOÁN HỢP ĐỒNG<span class=\"th\" data-t=\"ข้อ 5 เงินล่วงหน้าและการชำระเงินตามสัญญา\"></span></h3><p class=\"lv0 bl\"><span class=\"lb\">•</span>Đợt 1 – TẠM ỨNG: Bên A tạm ứng <strong><span class=\"fx\" data-k=\"TỶ LỆ TẠM ỨNG\"></span></strong>% của <strong><span class=\"fx\" data-k=\"GIÁ TRƯỚC VAT / GIÁ SAU VAT – CHỌN MỘT\"></span></strong>, tương ứng <strong><span class=\"fx\" data-k=\"SỐ TIỀN\"></span></strong> VNĐ trong vòng <strong><span class=\"fx\" data-k=\"03\"></span></strong> ngày làm việc kể từ ngày sau cùng của: (i) Hợp đồng có hiệu lực; (ii) Bên A nhận đủ hồ sơ tạm ứng hợp lệ; (<span class=\"th\" data-t=\"งวดที่ 1 – เงินล่วงหน้า: ฝ่าย A จ่ายเงินล่วงหน้า 【TỶ LỆ TẠM ỨNG】 % ของ 【GIÁ TRƯỚC VAT / GIÁ SAU VAT – CHỌN MỘT】 เทียบเท่า 【SỐ TIỀN】 VNĐ ภายใน 【03】 วันทำการนับจากวันที่เกิดขึ้นหลังสุดของเหตุการณ์ต่อไปนี้: (i) สัญญามีผลบังคับ; (ii) ฝ่าย A ได้รับเอกสารขอเงินล่วงหน้าที่ถูกต้องครบถ้วน; (\"></span></p><p>(iii) Bên B nộp bảo lãnh thực hiện theo Điều 21.1 và bảo lãnh hoàn trả tạm ứng hợp lệ. Hồ sơ gồm:<span class=\"th\" data-t=\"(iii) ฝ่าย B ส่งมอบหนังสือค้ำประกันการปฏิบัติตามสัญญาตามข้อ 21.1 และหนังสือค้ำประกันการคืนเงินล่วงหน้าที่ถูกต้อง เอกสารประกอบด้วย:\"></span></p><p>+ Thư đề nghị tạm ứng theo mẫu KSP có chữ ký hợp lệ, xác định số tiền, tài khoản và dự án;<span class=\"th\" data-t=\"+ หนังสือขอรับเงินล่วงหน้าตามแบบของ KSP ที่มีลายมือชื่อถูกต้อง ระบุจำนวนเงิน บัญชี และโครงการ\"></span></p><p>+ Hợp đồng, phụ lục/BOQ đã ký và giấy tờ xác nhận thẩm quyền người ký (nếu cần);<span class=\"th\" data-t=\"+ สัญญา ภาคผนวก/BOQ ที่ลงนามแล้ว และเอกสารยืนยันอำนาจของผู้ลงนาม (หากจำเป็น)\"></span></p><p>+ Bản gốc bảo lãnh hoàn trả tạm ứng do ngân hàng được Bên A chấp thuận phát hành, giá trị ít nhất 100% khoản tạm ứng; bảo lãnh không hủy ngang, có hiệu lực từ khi Bên A thực hiện giải ngân cho đến khi khoản tạm ứng được thu hồi hết và thêm <strong><span class=\"fx\" data-k=\"30\"></span></strong> ngày dự phòng; Bên B phải gia hạn trước khi bảo lãnh hết hạn nếu tạm ứng chưa thu hồi đủ. Không áp dụng cơ chế hết hạn vào ngày đến trước.<span class=\"th\" data-t=\"+ ต้นฉบับหนังสือค้ำประกันการคืนเงินล่วงหน้าที่ออกโดยธนาคารซึ่งฝ่าย A ยอมรับ มูลค่าอย่างน้อย 100% ของเงินล่วงหน้า เป็นหนังสือค้ำประกันที่เพิกถอนไม่ได้ มีผลตั้งแต่ฝ่าย A โอนเงินจนกว่าเงินล่วงหน้าจะถูกเรียกคืนครบถ้วน และเพิ่มอีก 【30】 วันเป็นระยะเผื่อ ฝ่าย B ต้องต่ออายุก่อนหนังสือค้ำประกันสิ้นอายุหากเงินล่วงหน้ายังไม่ได้รับการเรียกคืนครบ ไม่ใช้กลไกที่ให้สิ้นอายุในวันที่มาถึงก่อน\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Đợt 2 – NGHIỆM THU GIAI ĐOẠN <strong><span class=\"fx\" data-k=\"GIA CÔNG / SẢN XUẤT / CUNG CẤP\"></span></strong>: Sau khi Bên B hoàn thành <strong><span class=\"fx\" data-k=\"MỐC 2\"></span></strong> và được Bên A nghiệm thu bằng biên bản tại <strong><span class=\"fx\" data-k=\"ĐỊA ĐIỂM\"></span></strong><span class=\"th\" data-t=\"งวดที่ 2 – การตรวจรับระยะ 【GIA CÔNG / SẢN XUẤT / CUNG CẤP】: หลังจากฝ่าย B ทำ 【MỐC 2】 แล้วเสร็จ และฝ่าย A ตรวจรับโดยทำเป็นรายงาน ณ 【ĐỊA ĐIỂM】\"></span></p><p>Sau khi hàng được giao đủ, nghiệm thu đạt yêu cầu tại công trường và Bên A nhận đủ hồ sơ hợp lệ, Bên A thanh toán (90)% giá trị khối lượng riêng của đợt 2, trừ số thu hồi tạm ứng tại Phụ lục 03 và các khoản khấu trừ hợp lệ. Thời hạn thanh toán là (07) ngày làm việc kể từ khi nhận đủ hồ sơ. Hồ sơ gồm:<span class=\"th\" data-t=\"เมื่อสินค้าได้รับการส่งมอบครบถ้วน ผ่านการตรวจรับตามข้อกำหนด ณ สถานที่ก่อสร้าง และฝ่าย A ได้รับเอกสารที่ถูกต้องครบถ้วนแล้ว ฝ่าย A ชำระ (90)% ของมูลค่าปริมาณงานเฉพาะของงวดที่ 2 หักด้วยยอดเรียกคืนเงินล่วงหน้าตามภาคผนวก 03 และรายการหักที่ชอบด้วยกฎหมาย กำหนดชำระเงินคือ (07) วันทำการนับจากวันที่ได้รับเอกสารครบถ้วน เอกสารประกอบด้วย:\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Thư đề nghị thanh toán của Bên B, bảng kê giá trị khối lượng riêng Đợt 2 và số đã thanh toán;<span class=\"th\" data-t=\"- หนังสือขอรับชำระเงินของฝ่าย B ตารางสรุปมูลค่าปริมาณงานเฉพาะงวดที่ 2 และจำนวนที่ชำระแล้ว\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Hợp đồng, phụ lục/BOQ và VO được hai bên ký hợp lệ (bản sao phù hợp);<span class=\"th\" data-t=\"- สัญญา ภาคผนวก/BOQ และ VO ที่ทั้งสองฝ่ายลงนามโดยชอบ (สำเนาที่เหมาะสม)\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Biên bản nghiệm thu giai đoạn, bảng xác nhận khối lượng và giá trị có chữ ký của đại diện có thẩm quyền của hai bên;<span class=\"th\" data-t=\"- รายงานการตรวจรับเป็นระยะ ตารางยืนยันปริมาณงานและมูลค่าที่มีลายมือชื่อของผู้แทนผู้มีอำนาจของทั้งสองฝ่าย\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Hình ảnh tại nhà máy/công trường, biên bản kiểm tra chất lượng, CO/CQ và chứng chỉ thử nghiệm áp dụng cho phần việc;<span class=\"th\" data-t=\"- ภาพถ่ายที่โรงงาน/สถานที่ก่อสร้าง รายงานการตรวจสอบคุณภาพ CO/CQ และใบรับรองผลการทดสอบที่เกี่ยวข้องกับส่วนงาน;\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Hóa đơn GTGT điện tử hợp lệ tương ứng giá trị tính thuế theo pháp luật và xác nhận kỳ thanh toán;<span class=\"th\" data-t=\"- ใบกำกับภาษีมูลค่าเพิ่มอิเล็กทรอนิกส์ที่ถูกต้อง ตรงกับมูลค่าที่ต้องเสียภาษีตามกฎหมาย และการยืนยันงวดการชำระเงิน\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Đợt 3 – NGHIỆM THU LẮP ĐẶT: Sau khi Bên B hoàn thành <strong><span class=\"fx\" data-k=\"MỐC 3 / LẮP DỰNG / HOÀN THIỆN\"></span></strong><span class=\"th\" data-t=\"งวดที่ 3 – การตรวจรับการติดตั้ง: หลังจากฝ่าย B ทำ 【MỐC 3 / LẮP DỰNG / HOÀN THIỆN】 แล้วเสร็จ\"></span></p><p>và được nghiệm thu hợp lệ, Bên A thanh toán (90)% giá trị khối lượng riêng của  Đợt 3, trừ khoản thu hồi tạm ứng tại Phụ lục 03 và khoản khấu trừ hợp lệ. Khối lượng riêng Đợt 3 không bao gồm hàng hóa, cấu kiện hoặc phần gia công đã ghi nhận tại Đợt 2. Thanh toán trong (07) ngày làm việc từ ngày hoàn tất nghiệm thu và nhận đủ hồ sơ hợp lệ. Hồ sơ gồm:<span class=\"th\" data-t=\"และผ่านการตรวจรับโดยชอบ ฝ่าย A ชำระ (90)% ของมูลค่าปริมาณงานเฉพาะของงวดที่ 3 หักด้วยยอดเรียกคืนเงินล่วงหน้าตามภาคผนวก 03 และรายการหักที่ชอบด้วยกฎหมาย ปริมาณงานเฉพาะของงวดที่ 3 ไม่รวมสินค้า ชิ้นส่วน หรืองานแปรรูปที่บันทึกไว้แล้วในงวดที่ 2 ชำระเงินภายใน (07) วันทำการนับจากวันที่การตรวจรับเสร็จสิ้นและได้รับเอกสารที่ถูกต้องครบถ้วน เอกสารประกอบด้วย:\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Thư đề nghị thanh toán cùng bảng xác nhận khối lượng, giá trị riêng của Đợt 3;<span class=\"th\" data-t=\"- หนังสือขอรับชำระเงินพร้อมตารางยืนยันปริมาณงานและมูลค่าเฉพาะของงวดที่ 3\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Hợp đồng, phụ lục/BOQ, các VO đã được chấp thuận hợp lệ;<span class=\"th\" data-t=\"- สัญญา ภาคผนวก/BOQ และ VO ที่ได้รับความเห็นชอบโดยชอบ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Biên bản nghiệm thu từng công việc/giai đoạn, bảng xác nhận khối lượng thực hiện và biên bản thử nghiệm/kiểm định theo quy định;<span class=\"th\" data-t=\"- รายงานการตรวจรับงานแต่ละรายการ/ระยะ ตารางยืนยันปริมาณงานที่ดำเนินการ และรายงานการทดสอบ/ตรวจสอบตามที่กำหนด\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Hình ảnh hiện trường, báo cáo tiến độ và tài liệu kỹ thuật liên quan;<span class=\"th\" data-t=\"- ภาพถ่ายหน้างาน รายงานความคืบหน้า และเอกสารทางเทคนิคที่เกี่ยวข้อง\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Hóa đơn GTGT điện tử hợp lệ theo pháp luật;<span class=\"th\" data-t=\"- ใบกำกับภาษีมูลค่าเพิ่มอิเล็กทรอนิกส์ที่ถูกต้องตามกฎหมาย\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Hồ sơ chất lượng, nhật ký thi công, bản vẽ hoàn công tương ứng, CO/CQ (nếu có) và hồ sơ HSE bắt buộc;<span class=\"th\" data-t=\"- เอกสารด้านคุณภาพ สมุดบันทึกการก่อสร้าง แบบก่อสร้างจริง (as-built) ที่เกี่ยวข้อง CO/CQ (ถ้ามี) และเอกสาร HSE ที่จำเป็น\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Đợt 4 – QUYẾT TOÁN / THANH TOÁN CUỐI: Bên A thanh toán số tiền còn lại = GIÁ TRỊ QUYẾT TOÁN ĐƯỢC HAI BÊN XÁC NHẬN − TỔNG TIỀN ĐÃ THỰC CHUYỂN <span class=\"fx\" data-k=\"BAO GỒM TẠM ỨNG, ĐỢT 2, ĐỢT 3\"></span> − CÁC KHOẢN GIỮ LẠI HỢP LỆ − CÁC KHOẢN KHẤU TRỪ CÓ CĂN CỨ. Thanh toán trong vòng <strong><span class=\"fx\" data-k=\"15\"></span></strong> ngày làm việc tính từ thời điểm tất cả: (i) Bên B hoàn thành 100% công việc và nghiệm thu, bàn giao; (ii) quyết toán được hai bên xác nhận; (iii) Bên A nhận đầy đủ hồ sơ thanh toán hợp lệ; (iv) Bên B nộp bảo lãnh bảo hành hợp lệ nếu có thỏa thuận. Hồ sơ gồm:<span class=\"th\" data-t=\"งวดที่ 4 – การสรุปยอด/การชำระเงินงวดสุดท้าย: ฝ่าย A ชำระเงินส่วนที่เหลือ = มูลค่าสรุปยอดที่ทั้งสองฝ่ายยืนยัน − จำนวนเงินที่โอนจริงทั้งหมด 【BAO GỒM TẠM ỨNG, ĐỢT 2, ĐỢT 3】 − เงินประกันผลงานที่กักไว้โดยชอบ − รายการหักที่มีหลักฐานรองรับ ชำระภายใน 【15】 วันทำการ นับจากเวลาที่เกิดครบถ้วนทุกข้อ: (i) ฝ่าย B ทำงานแล้วเสร็จ 100% และได้รับการตรวจรับและส่งมอบ (ii) ทั้งสองฝ่ายยืนยันการสรุปยอด (iii) ฝ่าย A ได้รับเอกสารขอรับชำระเงินครบถ้วนถูกต้อง (iv) ฝ่าย B ส่งมอบหนังสือค้ำประกันการรับประกันผลงานที่ถูกต้อง หากมีข้อตกลงไว้ เอกสารประกอบด้วย:\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Thư đề nghị thanh toán cuối, bảng đối chiếu mọi khoản đã nhận, tạm ứng đã thu hồi và công nợ;<span class=\"th\" data-t=\"- หนังสือขอรับชำระเงินงวดสุดท้าย ตารางเทียบยอดเงินทุกรายการที่ได้รับ เงินล่วงหน้าที่เรียกคืนแล้ว และหนี้สินคงค้าง\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Hợp đồng, toàn bộ phụ lục, VO có chữ ký hợp lệ;<span class=\"th\" data-t=\"- สัญญา ภาคผนวกทั้งหมด และ VO ที่มีลายมือชื่อถูกต้อง\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Hóa đơn GTGT điện tử hợp lệ theo giá trị quyết toán và các hóa đơn kỳ trước;<span class=\"th\" data-t=\"- ใบกำกับภาษีมูลค่าเพิ่มอิเล็กทรอนิกส์ที่ถูกต้องตามมูลค่าสรุปยอด และใบกำกับภาษีของงวดก่อน ๆ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Biên bản nghiệm thu hoàn thành, xác nhận khối lượng, bàn giao đưa vào sử dụng; nhật ký, ảnh nghiệm thu và biên bản chạy thử/hiệu chỉnh (nếu có);<span class=\"th\" data-t=\"- รายงานการตรวจรับงานแล้วเสร็จ การยืนยันปริมาณงาน การส่งมอบเพื่อนำไปใช้งาน สมุดบันทึก ภาพถ่ายการตรวจรับ และรายงานการทดลองเดินระบบ/การปรับแต่ง (ถ้ามี)\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Hồ sơ quyết toán cuối cùng có chữ ký có thẩm quyền của cả hai bên;<span class=\"th\" data-t=\"- เอกสารสรุปยอดฉบับสุดท้ายที่มีลายมือชื่อผู้มีอำนาจของทั้งสองฝ่าย\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Hồ sơ hoàn công, CO/CQ, hồ sơ thí nghiệm, kiểm định, hồ sơ hướng dẫn vận hành, bảo trì, đào tạo, chứng từ HSE và hoàn tất tồn đọng theo Phụ lục 01/04;<span class=\"th\" data-t=\"- เอกสารแบบก่อสร้างจริง (as-built) CO/CQ เอกสารการทดสอบ การตรวจสอบ เอกสารคู่มือการใช้งาน การบำรุงรักษา การฝึกอบรม เอกสาร HSE และการแก้ไขงานค้างให้เสร็จสิ้นตามภาคผนวก 01/04\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Bảo lãnh bảo hành bản gốc (nếu áp dụng), giá trị <strong><span class=\"fx\" data-k=\"5\"></span></strong>% giá trị quyết toán, . bảo lãnh phải có hiệu lực liên tục đến hết thời hạn bảo hành được xác định theo Điều 12 và Phụ lục 04, cộng thêm 30 ngày dự phòng. Bên B phải gia hạn hoặc thay thế bảo lãnh theo Điều 21.5 khi thời hạn bảo hành được điều chỉnh hợp lệ; hoặc áp dụng tiền giữ lại <span class=\"fx\" data-k=\"%\"></span> theo phương án chỉ chọn một tại Phụ lục 06.<span class=\"th\" data-t=\"- หนังสือค้ำประกันการรับประกันผลงานฉบับจริง (ถ้ามี) มูลค่า 【5】 % ของมูลค่าที่สรุปบัญชี หนังสือค้ำประกันต้องมีผลต่อเนื่องจนสิ้นสุดระยะเวลารับประกันผลงานที่กำหนดตามข้อ 12 และภาคผนวก 04 บวกเพิ่มอีก 30 วันสำรอง ฝ่าย B ต้องขยายอายุหรือเปลี่ยนหนังสือค้ำประกันตามข้อ 21.5 เมื่อระยะเวลารับประกันผลงานได้รับการปรับโดยชอบ หรือใช้เงินประกันผลงานที่กักไว้ (Retention) 【%】 ตามทางเลือกเพียงหนึ่งเดียวในภาคผนวก 06\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Hình thức thanh toán: chuyển khoản ngân hàng bằng VNĐ theo quy định pháp luật và Điều 5.<span class=\"th\" data-t=\"รูปแบบการชำระเงิน: โอนเงินผ่านธนาคารเป็นสกุลเงินดง (VNĐ) ตามกฎหมายและข้อ 5\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A thanh toán từ tài khoản của CÔNG TY TNHH KSP VIỆT NAM hoặc tài khoản đơn vị/chi nhánh được phép thanh toán và được ghi trong hệ thống kế toán; tên bên có nghĩa vụ thanh toán vẫn phải khớp hợp đồng.<span class=\"th\" data-t=\"ฝ่าย A ชำระเงินจากบัญชีของ CÔNG TY TNHH KSP VIỆT NAM หรือบัญชีของหน่วยงาน/สาขาที่ได้รับอนุญาตให้ชำระเงินและบันทึกอยู่ในระบบบัญชี ชื่อของฝ่ายที่มีภาระต้องชำระเงินยังต้องตรงกับที่ระบุในสัญญา\"></span></p><p>Tài khoản thanh toán KSP: <strong><span class=\"fx\" data-k=\"TÊN ĐƠN VỊ / NGÂN HÀNG / SỐ TÀI KHOẢN\"></span></strong><span class=\"th\" data-t=\"บัญชีชำระเงินของ KSP: 【TÊN ĐƠN VỊ / NGÂN HÀNG / SỐ TÀI KHOẢN】\"></span></p><p>Chi nhánh/đơn vị thanh toán (nếu có): <strong><span class=\"fx\" data-k=\"TÊN / MST / TÀI KHOẢN\"></span></strong><span class=\"th\" data-t=\"สาขา/หน่วยงานผู้ชำระเงิน (ถ้ามี): 【TÊN / MST / TÀI KHOẢN】\"></span></p><p>Đồng tiền thanh toán: <strong><span class=\"fx\" data-k=\"VND\"></span></strong>; thông tin tài khoản Bên B phải được xác nhận bằng văn bản ký bởi người có thẩm quyền.<span class=\"th\" data-t=\"สกุลเงินที่ชำระ: 【VND】 ข้อมูลบัญชีของฝ่าย B ต้องได้รับการยืนยันเป็นหนังสือที่ลงนามโดยผู้มีอำนาจ\"></span></p><p>Thay đổi tài khoản Bên B chỉ có hiệu lực sau khi Bên A kiểm tra thông tin, xác nhận theo quy trình chống gian lận tài khoản.<span class=\"th\" data-t=\"การเปลี่ยนแปลงบัญชีของฝ่าย B มีผลก็ต่อเมื่อฝ่าย A ตรวจสอบข้อมูลและยืนยันตามกระบวนการป้องกันการฉ้อโกงเกี่ยวกับบัญชี\"></span></p><p>Tài khoản nhận của Bên B: <strong><span class=\"fx\" data-k=\"TÊN CHỦ TK / SỐ TK / NGÂN HÀNG\"></span></strong>.<span class=\"th\" data-t=\"บัญชีรับเงินของฝ่าย B: 【TÊN CHỦ TK / SỐ TK / NGÂN HÀNG】\"></span></p><p>Ngày thanh toán nội bộ dự kiến: ngày <strong><span class=\"fx\" data-k=\"14 / 26 / NGÀY KHÁC\"></span></strong> hằng tháng; việc sắp xếp ngày chi nội bộ không được làm quá hạn thanh toán đã cam kết ở từng Đợt 1–4, trừ khi các bên đã ghi rõ ngày đến hạn cụ thể ngay trong hợp đồng.<span class=\"th\" data-t=\"วันชำระเงินภายในที่คาดการณ์: วันที่ 【14 / 26 / NGÀY KHÁC】 ของทุกเดือน การจัดวันจ่ายเงินภายในต้องไม่ทำให้เกินกำหนดการชำระเงินที่ได้ให้คำมั่นไว้ในแต่ละงวดที่ 1–4 เว้นแต่คู่สัญญาได้ระบุวันครบกำหนดไว้เป็นการเฉพาะในสัญญาแล้ว\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trường hợp ngày đến hạn rơi vào ngày nghỉ ngân hàng, việc thực hiện thanh toán theo quy định pháp luật và thỏa thuận rõ tại <strong><span class=\"fx\" data-k=\"CƠ CHẾ NGÀY LÀM VIỆC KẾ TIẾP\"></span></strong>; Bên A thông báo và giải quyết kịp thời mọi thiếu sót của hồ sơ trong <strong><span class=\"fx\" data-k=\"03\"></span></strong> ngày làm việc từ ngày nhận.<span class=\"th\" data-t=\"ในกรณีที่วันครบกำหนดตรงกับวันหยุดของธนาคาร การชำระเงินให้เป็นไปตามกฎหมายและข้อตกลงที่ระบุชัดเจนใน 【CƠ CHẾ NGÀY LÀM VIỆC KẾ TIẾP】 ฝ่าย A แจ้งและแก้ไขข้อบกพร่องของเอกสารทั้งหมดโดยพลันภายใน 【03】 วันทำการนับจากวันที่ได้รับ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Người nhận chứng từ: <strong><span class=\"fx\" data-k=\"HỌ TÊN / EMAIL / ĐIỆN THOẠI KSP\"></span></strong><span class=\"th\" data-t=\"ผู้รับเอกสาร: 【HỌ TÊN / EMAIL / ĐIỆN THOẠI KSP】\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Địa chỉ nhận hóa đơn GTGT điện tử hợp lệ: <strong><span class=\"fx\" data-k=\"EMAIL KẾ TOÁN KSP\"></span></strong>.<span class=\"th\" data-t=\"ที่อยู่รับใบกำกับภาษีมูลค่าเพิ่มอิเล็กทรอนิกส์ที่ถูกต้อง: 【EMAIL KẾ TOÁN KSP】\"></span></p><p>5.5. QUY ĐỊNH CHUNG VỀ THANH TOÁN: Bên B phải nộp hồ sơ theo danh mục của từng đợt tại Hợp đồng; Bên A thông báo bằng văn bản những tài liệu còn thiếu cần điều chỉnh trong <strong><span class=\"fx\" data-k=\"03\"></span></strong> ngày làm việc từ khi nhận hồ sơ. Việc Bên A chưa thông báo trong thời hạn này không đồng nghĩa hồ sơ được xác nhận đầy đủ, hợp lệ hoặc được chấp thuận thanh toán. Thời hạn thanh toán chỉ tính khi hoàn tất nghiệm thu và nhận đủ hồ sơ hợp lệ của đợt tương ứng. Mỗi khối lượng hoàn thành chỉ được thanh toán một lần; giá trị thanh toán đợt 2 và đợt 3 là GIÁ TRỊ RIÊNG, không phải giá trị lũy kế. Tổng thu hồi tạm ứng không vượt khoản đã tạm ứng. Số tiền cuối cùng quyết toán phải đối chiếu chứng từ chuyển tiền thực tế.<span class=\"th\" data-t=\"5.5. ข้อกำหนดทั่วไปเกี่ยวกับการชำระเงิน: ฝ่าย B ต้องยื่นเอกสารตามรายการของแต่ละงวดในสัญญา ฝ่าย A แจ้งเป็นหนังสือถึงเอกสารที่ขาดและต้องแก้ไขภายใน 【03】 วันทำการนับจากวันที่ได้รับเอกสาร การที่ฝ่าย A ยังไม่แจ้งภายในกำหนดนี้ไม่ถือว่าเป็นการยืนยันว่าเอกสารครบถ้วน ถูกต้อง หรือได้รับความเห็นชอบให้ชำระเงิน กำหนดชำระเงินเริ่มนับเมื่อเสร็จสิ้นการตรวจรับและได้รับเอกสารที่ถูกต้องครบถ้วนของงวดที่เกี่ยวข้องแล้วเท่านั้น ปริมาณงานที่แล้วเสร็จแต่ละส่วนได้รับการชำระเพียงครั้งเดียว มูลค่าการชำระเงินงวดที่ 2 และงวดที่ 3 เป็นมูลค่าเฉพาะงวด ไม่ใช่มูลค่าสะสม ยอดเรียกคืนเงินล่วงหน้ารวมต้องไม่เกินเงินล่วงหน้าที่จ่ายไป จำนวนเงินสรุปยอดสุดท้ายต้องตรวจเทียบกับเอกสารการโอนเงินจริง\"></span></p><p>Trường hợp số tiền của đợt không đủ để khấu trừ hết khoản tạm ứng phải thu hồi, phần còn thiếu được chuyển sang đợt kế tiếp, nhưng không được vượt quá mốc phải thu hồi hết tạm ứng quy định trên. Khi đến mốc này hoặc khi Hợp đồng chấm dứt trước hạn, nếu vẫn còn số dư tạm ứng chưa thu hồi, Bên B phải hoàn trả toàn bộ số dư đó trong vòng <strong>03 ngày làm việc</strong> kể từ ngày nhận được yêu cầu bằng văn bản của Bên A.<span class=\"th\" data-t=\"กรณีจำนวนเงินของงวดไม่เพียงพอที่จะหักเงินล่วงหน้าที่ต้องเรียกคืนได้ครบ ส่วนที่ขาดให้โอนไปงวดถัดไป แต่ต้องไม่เกินกำหนดเวลาที่ต้องเรียกคืนเงินล่วงหน้าให้ครบตามที่ระบุข้างต้น เมื่อถึงกำหนดนี้ หรือเมื่อสัญญาสิ้นสุดก่อนกำหนด หากยังมียอดเงินล่วงหน้าคงเหลือที่ยังไม่ได้เรียกคืน ฝ่าย B ต้องคืนยอดคงเหลือทั้งหมดภายใน 03 วันทำการนับจากวันที่ได้รับคำเรียกร้องเป็นลายลักษณ์อักษรของฝ่าย A\"></span></p><p>5.6. Trường hợp hồ sơ có tranh chấp một phần, Bên A phải thông báo bằng văn bản nêu rõ căn cứ, số tiền và tài liệu chưa hợp lệ; phần nghĩa vụ thanh toán đã đủ điều kiện và không tranh chấp vẫn đến hạn theo Hợp đồng. Lãi chậm thanh toán (nếu phát sinh) thực hiện theo thỏa thuận hợp pháp và pháp luật hiện hành.<span class=\"th\" data-t=\"5.6. ในกรณีที่เอกสารมีข้อพิพาทเพียงบางส่วน ฝ่าย A ต้องแจ้งเป็นหนังสือโดยระบุเหตุผล จำนวนเงิน และเอกสารที่ยังไม่ถูกต้องอย่างชัดเจน ส่วนของภาระการชำระเงินที่ครบเงื่อนไขและไม่มีข้อพิพาทยังคงถึงกำหนดตามสัญญา ดอกเบี้ยจากการชำระเงินล่าช้า (หากเกิดขึ้น) ให้เป็นไปตามข้อตกลงที่ชอบด้วยกฎหมายและกฎหมายที่มีผลใช้บังคับ\"></span></p><p>5.7. KIỂM SOÁT DÒNG TIỀN VÀ ĐỐI CHIẾU ĐIỀU KIỆN THANH TOÁN: Trước khi ký, Bên A lập và phê duyệt lịch thu dự kiến từ Chủ đầu tư và lịch chi dự kiến cho Bên B tại Phụ lục 03 và ma trận Phụ lục 04, bao gồm tạm ứng, nghiệm thu, thời gian lập hồ sơ, thời hạn thanh toán, tiền giữ lại, thu hồi tạm ứng và dự phòng vốn lưu động. Thời hạn thanh toán của Hợp đồng này là thời hạn được hai Bên ghi rõ tại Điều 5/Phụ lục 06; việc Chủ đầu tư thanh toán chậm không tự động gia hạn nghĩa vụ thanh toán của Bên A hoặc tạo điều kiện “pay-if-paid”. Khi nhận thấy chênh lệch dòng tiền đáng kể, Bên A phải phê duyệt biện pháp tài trợ/điều chỉnh mốc trước khi ký, không đơn phương trì hoãn khoản thanh toán không tranh chấp.<span class=\"th\" data-t=\"5.7 การควบคุมกระแสเงินสดและการเปรียบเทียบเงื่อนไขการชำระเงิน: ก่อนการลงนาม ฝ่าย A จัดทำและอนุมัติตารางรับเงินที่คาดการณ์จากเจ้าของโครงการ และตารางจ่ายเงินที่คาดการณ์ให้ฝ่าย B ในภาคผนวก 03 และตารางเปรียบเทียบภาคผนวก 04 ซึ่งรวมถึงเงินล่วงหน้า การตรวจรับ เวลาในการจัดทำเอกสาร กำหนดการชำระเงิน เงินประกันผลงานที่กักไว้ การเรียกคืนเงินล่วงหน้า และเงินทุนหมุนเวียนสำรอง กำหนดการชำระเงินของสัญญานี้คือกำหนดที่คู่สัญญาทั้งสองฝ่ายระบุไว้อย่างชัดเจนในข้อ 5/ภาคผนวก 06 การที่เจ้าของโครงการชำระเงินล่าช้าไม่ทำให้ภาระการชำระเงินของฝ่าย A ขยายออกไปโดยอัตโนมัติ และไม่ก่อให้เกิดเงื่อนไขแบบ “pay-if-paid” เมื่อพบว่ากระแสเงินสดมีความแตกต่างอย่างมีนัยสำคัญ ฝ่าย A ต้องอนุมัติมาตรการจัดหาเงินทุน/ปรับหลักไมล์ก่อนการลงนาม และไม่ฝ่ายเดียวเลื่อนการชำระเงินจำนวนที่ไม่มีข้อพิพาท\"></span></p><p>5.8. KIỂM SOÁT GIÁ TRỊ THANH TOÁN: Các đợt nghiệm thu được lập theo hạng mục và giá trị không trùng nhau; tổng giá trị đã ứng và đã thanh toán, sau khi cộng/trừ thu hồi tạm ứng, tiền giữ lại và khấu trừ hợp lệ, phải được đối chiếu theo Phụ lục 03 ở mỗi kỳ. Đối với vật tư có giá trị lớn chưa đưa vào công trình nhưng dự kiến thanh toán, chỉ thực hiện khi đã thống nhất bằng văn bản về xác định vật tư, quyền sở hữu, bảo quản, bảo hiểm và bảo đảm phù hợp tại Điều 21/Phụ lục 01. Xuất hóa đơn và thời điểm ghi nhận thuế phải tuân thủ pháp luật thuế, không mặc nhiên phạt một tỷ lệ cố định trên toàn bộ giá trị hóa đơn do sai ngày xuất hóa đơn.<span class=\"th\" data-t=\"5.8 การควบคุมมูลค่าการชำระเงิน: การตรวจรับแต่ละงวดจัดทำตามรายการงานและมูลค่าที่ไม่ซ้ำซ้อนกัน ยอดรวมมูลค่าที่จ่ายล่วงหน้าและชำระแล้ว หลังบวก/หักการเรียกคืนเงินล่วงหน้า เงินประกันผลงานที่กักไว้ และรายการหักที่ชอบด้วยกฎหมาย ต้องได้รับการเปรียบเทียบตามภาคผนวก 03 ในทุกรอบ สำหรับวัสดุมูลค่าสูงที่ยังไม่ได้นำเข้าสู่งานก่อสร้างแต่คาดว่าจะชำระเงิน จะดำเนินการได้เฉพาะเมื่อได้ตกลงเป็นลายลักษณ์อักษรเกี่ยวกับการระบุวัสดุ กรรมสิทธิ์ การเก็บรักษา การประกันภัย และหลักประกันที่เหมาะสมตามข้อ 21/ภาคผนวก 01 การออกใบกำกับภาษีและเวลาที่บันทึกภาษีต้องเป็นไปตามกฎหมายภาษี ไม่ปรับในอัตราคงที่โดยปริยายจากมูลค่าใบกำกับภาษีทั้งหมดเพราะออกใบกำกับภาษีผิดวัน\"></span></p><h3 class=\"art\" data-n=\"6\">ĐIỀU 6. QUYỀN VÀ NGHĨA VỤ CHUNG CỦA CÁC BÊN<span class=\"th\" data-t=\"ข้อ 6 สิทธิและหน้าที่ทั่วไปของคู่สัญญา\"></span></h3><p class=\"lv1\"><span class=\"lb\">6.1</span>Quyền của Bên A<span class=\"th\" data-t=\"สิทธิของฝ่าย A\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A có quyền kiểm tra,<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิตรวจสอบ\"></span></p><p>giám sát quá trình thi công nhưng không gây cản trở bất hợp lý đối với hoạt động thi công của Bên B. Thời gian kiểm tra, nghiệm thu thông thường theo kế hoạch đã thống nhất được tính trong tiến độ thực hiện Hợp đồng. Việc kiểm tra, giám sát hoặc nghiệm thu của Bên A không làm giảm trách nhiệm của Bên B về chất lượng, khối lượng và tiến độ thi công của Bên B theo Hợp đồng.<span class=\"th\" data-t=\"และกำกับดูแลกระบวนการก่อสร้าง แต่ต้องไม่ก่อให้เกิดอุปสรรคต่อการก่อสร้างของฝ่าย B โดยไม่สมเหตุสมผล เวลาที่ใช้ในการตรวจสอบและตรวจรับตามปกติตามแผนที่ตกลงกันไว้ให้นับรวมอยู่ในกำหนดการปฏิบัติตามสัญญา การตรวจสอบ กำกับดูแล หรือตรวจรับของฝ่าย A ไม่ลดความรับผิดชอบของฝ่าย B ในด้านคุณภาพ ปริมาณงาน และกำหนดการก่อสร้างของฝ่าย B ตามสัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A có quyền yêu cầu Bên B dừng thi công và khắc phục nếu phát hiện vi phạm về chất lượng, an toàn lao động, vệ sinh môi trường hoặc phòng cháy chữa cháy.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิเรียกให้ฝ่าย B หยุดการก่อสร้างและแก้ไขหากพบการฝ่าฝืนด้านคุณภาพ ความปลอดภัยในการทำงาน สุขอนามัยและสิ่งแวดล้อม หรือการป้องกันและดับเพลิง\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A có quyền yêu cầu thay thế nhân sự của Bên B nếu không đáp ứng yêu cầu công việc (ví dụ: yếu năng lực, gây chậm tiến độ, không hợp tác…). Nếu Bên B muốn giữ lại người này, phải có văn bản giải trình và cam kết trong vòng 07 ngày hoặc thể hiện bằng biên bản họp giao ban. Trường hợp nhân sự vi phạm nội quy, an toàn (có biên bản xác nhận của Bên A và Tư vấn giám sát), Bên A có quyền yêu cầu rời khỏi công trường ngay lập tức.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิเรียกให้เปลี่ยนตัวบุคลากรของฝ่าย B หากไม่ตอบสนองต่อความต้องการของงาน (เช่น ขาดความสามารถ ทำให้ล่าช้า ไม่ให้ความร่วมมือ ฯลฯ) หากฝ่าย B ประสงค์จะคงบุคคลนั้นไว้ ต้องมีหนังสือชี้แจงและให้คำมั่นภายใน 07 วัน หรือแสดงไว้ในรายงานการประชุมประสานงาน ในกรณีที่บุคลากรฝ่าฝืนระเบียบและความปลอดภัย (โดยมีรายงานยืนยันจากฝ่าย A และที่ปรึกษาควบคุมงาน) ฝ่าย A มีสิทธิเรียกให้ออกจากหน่วยงานก่อสร้างทันที\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A có quyền từ chối thanh toán phần khối lượng không đảm bảo chất lượng hoặc không nằm trong phạm vi hợp đồng mà chưa được Bên A phê duyệt.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิปฏิเสธการชำระเงินสำหรับปริมาณงานส่วนที่คุณภาพไม่เป็นไปตามกำหนดหรืออยู่นอกขอบเขตของสัญญาที่ฝ่าย A ยังไม่ได้อนุมัติ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A có quyền yêu cầu Bên B bổ sung, hoàn chỉnh hồ sơ theo đúng quy định của hợp đồng.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิเรียกให้ฝ่าย B เพิ่มเติมและทำเอกสารให้สมบูรณ์ตามที่สัญญากำหนด\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Nếu có vướng mắc, tranh chấp hoặc phát sinh liên quan đến thanh toán, Bên A sẽ thông báo sớm và nêu rõ cơ sở, điều khoản áp dụng, số tiền liên quan để Bên B phối hợp giải quyết.<span class=\"th\" data-t=\"หากมีอุปสรรค ข้อพิพาท หรือเหตุการณ์เกิดขึ้นที่เกี่ยวข้องกับการชำระเงิน ฝ่าย A จะแจ้งให้ทราบโดยเร็วและระบุฐานที่มา ข้อกำหนดที่ใช้บังคับ และจำนวนเงินที่เกี่ยวข้องให้ชัดเจน เพื่อให้ฝ่าย B ร่วมมือแก้ไข\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trong trường hợp phát sinh nghĩa vụ tài chính của Bên B, Bên A có quyền khấu trừ số tiền liên quan từ các khoản thanh toán hiện tại hoặc sau này của Bên B.<span class=\"th\" data-t=\"ในกรณีที่เกิดภาระทางการเงินของฝ่าย B ฝ่าย A มีสิทธิหักจำนวนเงินที่เกี่ยวข้องจากเงินที่ต้องชำระให้ฝ่าย B ในปัจจุบันหรือในภายหลัง\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A có quyền xem xét, phê duyệt hoặc không chấp thuận nhân công phụ trợ mà Bên B huy động để đảm bảo chất lượng và tiến độ công việc.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิพิจารณา อนุมัติ หรือไม่ให้ความเห็นชอบแรงงานช่วยเสริมที่ฝ่าย B จัดหามา เพื่อให้มั่นใจในคุณภาพและกำหนดการของงาน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trường hợp Bên B hoặc Nhà thầu phụ của Bên B không thanh toán đầy đủ, đúng hạn tiền lương, tiền công hoặc các khoản phải trả cho người lao động, nhà thầu phụ, nhà cung cấp của mình, dẫn đến khiếu nại, ngừng việc, đình công, gây mất an ninh, trật tự hoặc ảnh hưởng đến tiến độ, chất lượng và hoạt động của Bên A hoặc công trình, Bên A có quyền, tùy theo tình hình thực tế, thực hiện thanh toán trực tiếp cho người lao động, nhà thầu phụ hoặc bên có liên quan để đảm bảo công việc và hoạt động của công trình không bị gián đoạn. Toàn bộ số tiền Bên A đã thanh toán thay và các chi phí phát sinh liên quan sẽ được xem là nghĩa vụ tài chính của Bên B và Bên A có quyền khấu trừ trực tiếp vào bất kỳ khoản thanh toán, khoản bảo lưu, tiền giữ lại hoặc các khoản tiền khác mà Bên A phải thanh toán cho Bên B. Trường hợp các khoản phải trả cho Bên B không đủ để khấu trừ, Bên B có trách nhiệm hoàn trả đầy đủ cho Bên A trong vòng 03 (ba) ngày làm việc kể từ ngày nhận được yêu cầu của Bên A.<span class=\"th\" data-t=\"ในกรณีที่ฝ่าย B หรือผู้รับเหมาช่วงของฝ่าย B ไม่ชำระค่าจ้าง ค่าแรง หรือเงินที่ต้องจ่ายแก่ลูกจ้าง ผู้รับเหมาช่วง หรือผู้ขายของตนอย่างครบถ้วนและตรงเวลา จนนำไปสู่การร้องเรียน การหยุดงาน การนัดหยุดงาน การก่อความไม่สงบเรียบร้อยและความมั่นคง หรือส่งผลกระทบต่อกำหนดการ คุณภาพ และการดำเนินงานของฝ่าย A หรือหน่วยงานก่อสร้าง ฝ่าย A มีสิทธิ ตามสถานการณ์จริง ชำระเงินโดยตรงแก่ลูกจ้าง ผู้รับเหมาช่วง หรือฝ่ายที่เกี่ยวข้อง เพื่อให้งานและการดำเนินงานของหน่วยงานก่อสร้างไม่ต้องหยุดชะงัก เงินทั้งหมดที่ฝ่าย A ชำระแทนและค่าใช้จ่ายที่เกิดขึ้นที่เกี่ยวข้องให้ถือเป็นภาระทางการเงินของฝ่าย B และฝ่าย A มีสิทธิหักโดยตรงจากเงินที่ต้องชำระ เงินสำรอง เงินประกันผลงานที่กักไว้ หรือเงินอื่นใดที่ฝ่าย A ต้องชำระให้ฝ่าย B ในกรณีที่เงินที่ต้องชำระให้ฝ่าย B ไม่เพียงพอที่จะหัก ฝ่าย B มีหน้าที่คืนเงินให้ฝ่าย A ครบถ้วนภายใน 03 (สาม) วันทำการนับจากวันที่ได้รับหนังสือเรียกร้องจากฝ่าย A\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trước khi thanh toán thay, Bên A thông báo cho Bên B và kiểm tra căn cứ nghĩa vụ, danh sách người nhận, số tiền, tình trạng chưa thanh toán và chứng từ liên quan. Việc thanh toán thay phải có chứng từ chi trả và xác nhận của người nhận, được ghi nhận để giảm trừ nghĩa vụ tương ứng, tránh thanh toán trùng. Việc Bên A thanh toán thay không làm phát sinh nghĩa vụ tiếp nhận các khoản nợ khác của Bên B.<span class=\"th\" data-t=\"ก่อนชำระเงินแทน ฝ่าย A แจ้งให้ฝ่าย B ทราบและตรวจสอบฐานแห่งภาระ รายชื่อผู้รับเงิน จำนวนเงิน สถานะที่ยังไม่ได้ชำระ และเอกสารที่เกี่ยวข้อง การชำระเงินแทนต้องมีหลักฐานการจ่ายเงินและการยืนยันของผู้รับเงิน บันทึกเพื่อลดภาระที่เกี่ยวข้อง และหลีกเลี่ยงการชำระซ้ำ การที่ฝ่าย A ชำระเงินแทนไม่ก่อให้เกิดหน้าที่รับภาระหนี้อื่นของฝ่าย B\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trường hợp Bên B chậm tiến độ, bỏ dở công việc hoặc vi phạm nghiêm trọng, Bên A được lập biên bản kiểm kê vật tư và yêu cầu Bên B bàn giao công việc, hồ sơ, vật tư đã được Bên A thanh toán thuộc quyền sở hữu Bên A để bảo vệ tiến độ; không mặc nhiên chiếm giữ hoặc sử dụng máy móc, thiết bị thuộc sở hữu riêng của Bên B.<span class=\"th\" data-t=\"ในกรณีที่ฝ่าย B ทำงานล่าช้า ละทิ้งงาน หรือฝ่าฝืนอย่างร้ายแรง ฝ่าย A มีสิทธิจัดทำรายงานตรวจนับวัสดุ และเรียกให้ฝ่าย B ส่งมอบงาน เอกสาร และวัสดุที่ฝ่าย A ชำระเงินแล้วและเป็นกรรมสิทธิ์ของฝ่าย A เพื่อรักษากำหนดการ โดยไม่ถือโดยปริยายว่ามีสิทธิยึดถือหรือใช้เครื่องจักรและอุปกรณ์ที่เป็นกรรมสิทธิ์เฉพาะของฝ่าย B\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Việc sử dụng máy móc, thiết bị thuộc sở hữu của Bên B chỉ thực hiện theo thỏa thuận riêng bằng văn bản hoặc căn cứ pháp luật hợp lệ; Bên B vẫn có quyền khiếu nại, tranh chấp theo pháp luật.<span class=\"th\" data-t=\"การใช้เครื่องจักรและอุปกรณ์ที่เป็นกรรมสิทธิ์ของฝ่าย B ให้ทำได้เฉพาะตามข้อตกลงแยกต่างหากเป็นหนังสือหรือตามฐานทางกฎหมายที่ชอบด้วยกฎหมายเท่านั้น ฝ่าย B ยังคงมีสิทธิร้องเรียนและโต้แย้งตามกฎหมาย\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Chi phí bảo quản, vận chuyển, xử lý vật tư và công việc hợp pháp khi thay nhà thầu phải được ghi biên bản, chứng minh hợp lý và phân bổ theo lỗi của từng bên.<span class=\"th\" data-t=\"ค่าใช้จ่ายในการเก็บรักษา ขนส่ง จัดการวัสดุ และงานที่ชอบด้วยกฎหมายเมื่อเปลี่ยนผู้รับเหมา ต้องบันทึกเป็นรายงาน พิสูจน์ได้ว่าสมเหตุสมผล และแบ่งสรรตามความผิดของแต่ละฝ่าย\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Các bên kiểm kê, bảo quản và hoàn trả tài sản thuộc sở hữu của Bên B trong thời hạn <span class=\"fx\" data-k=\"05\"></span> ngày làm việc sau khi kết thúc quyền sử dụng hợp pháp, trừ trường hợp có quyết định cơ quan có thẩm quyền hoặc biện pháp bảo đảm được thỏa thuận hợp lệ.<span class=\"th\" data-t=\"คู่สัญญาตรวจนับ เก็บรักษา และคืนทรัพย์สินที่เป็นกรรมสิทธิ์ของฝ่าย B ภายใน 【05】 วันทำการ หลังสิ้นสุดสิทธิการใช้ที่ชอบด้วยกฎหมาย เว้นแต่มีคำสั่งของหน่วยงานที่มีอำนาจหรือมีมาตรการประกันที่ตกลงกันโดยชอบ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trong thời gian bảo hành, nếu lỗi <span class=\"th\" data-t=\"ในระหว่างระยะเวลารับประกันผลงาน หากข้อบกพร่อง\"></span></p><p>thuộc phạm vi trách nhiệm Bên B không được khắc phục đúng hạn, Bên A được thuê đơn vị khác sửa chữa và yêu cầu hoàn trả/khấu trừ chi phí hợp lý, có chứng từ theo Điều 12 và Điều 15; trách nhiệm này áp dụng cho toàn bộ phần việc thuộc phạm vi bảo hành của Bên B và khấu trừ chi phí từ khoản bảo lưu hoặc công nợ của Bên B (nếu có).<span class=\"th\" data-t=\"ที่อยู่ในความรับผิดชอบของฝ่าย B ไม่ได้รับการแก้ไขตามกำหนด ฝ่าย A มีสิทธิจ้างหน่วยงานอื่นซ่อมแซมและเรียกให้ฝ่าย B คืน/ให้หักค่าใช้จ่ายที่สมเหตุสมผลและมีเอกสารหลักฐานตามข้อ 12 และข้อ 15 ความรับผิดชอบนี้ใช้กับงานทั้งหมดที่อยู่ในขอบเขตการรับประกันผลงานของฝ่าย B และให้หักค่าใช้จ่ายจากเงินสำรองหรือหนี้สินของฝ่าย B (ถ้ามี)\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Các quyền khác theo hợp đồng và quy định pháp luật.<span class=\"th\" data-t=\"สิทธิอื่น ๆ ตามสัญญาและบทบัญญัติของกฎหมาย\"></span></p><p class=\"lv1\"><span class=\"lb\">6.2</span> Nghĩa vụ của Bên giao thầu Bên A<span class=\"th\" data-t=\"หน้าที่ของฝ่ายผู้ว่าจ้าง ฝ่าย A\"></span></p><p>Bên A cung cấp hoặc phối hợp chủ đầu tư cung cấp hồ sơ pháp lý, thiết kế và mặt bằng thuộc trách nhiệm được phân định tại Phụ lục 01. Trách nhiệm về quyền sử dụng đất, giấy phép xây dựng và phê duyệt dự án của chủ đầu tư được thực hiện theo pháp luật; Bên A không cam kết thay cho chủ đầu tư đối với nghĩa vụ ngoài phạm vi KSP nhận thực hiện. Bên A vẫn chịu trách nhiệm về nghĩa vụ bắt buộc và nghĩa vụ đã cam kết của mình. Bên B chịu trách nhiệm về tư cách, năng lực, chứng chỉ, hồ sơ nhân sự, thiết bị, biện pháp thi công và giấy phép thuộc phạm vi công việc của Bên B; phải thông báo ngay khi phát hiện thiếu điều kiện thi công và không triển khai trái pháp luật.<span class=\"th\" data-t=\"ฝ่าย A จัดหาหรือประสานงานกับเจ้าของโครงการเพื่อจัดหาเอกสารทางกฎหมาย แบบ และพื้นที่ก่อสร้างที่อยู่ในความรับผิดชอบตามที่แบ่งไว้ในภาคผนวก 01 ความรับผิดชอบเกี่ยวกับสิทธิการใช้ที่ดิน ใบอนุญาตก่อสร้าง และการอนุมัติโครงการของเจ้าของโครงการให้เป็นไปตามกฎหมาย ฝ่าย A ไม่รับรองแทนเจ้าของโครงการสำหรับภาระนอกขอบเขตที่ KSP รับดำเนินการ ฝ่าย A ยังคงรับผิดชอบต่อภาระที่กฎหมายบังคับและภาระที่ตนได้ให้คำมั่นไว้ ฝ่าย B รับผิดชอบเกี่ยวกับคุณสมบัติ ความสามารถ ใบรับรอง เอกสารบุคลากร เครื่องจักรอุปกรณ์ วิธีการก่อสร้าง และใบอนุญาตที่อยู่ในขอบเขตงานของฝ่าย B ต้องแจ้งทันทีเมื่อพบว่าขาดเงื่อนไขในการก่อสร้าง และต้องไม่ดำเนินการอันขัดต่อกฎหมาย\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bàn giao mặt bằng đủ điều kiện cho Bên B thi công xây dựng;<span class=\"th\" data-t=\"ส่งมอบพื้นที่ก่อสร้างที่มีสภาพพร้อมให้ฝ่าย B ดำเนินการก่อสร้าง;\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Cung cấp Hồ sơ thiết kế và các tài liệu có liên quan theo thoả thuận trong Hợp đồng và quy định của Pháp luật có liên quan;<span class=\"th\" data-t=\"จัดส่งเอกสารการออกแบบและเอกสารอื่นที่เกี่ยวข้องตามที่ตกลงในสัญญาและตามบทบัญญัติของกฎหมายที่เกี่ยวข้อง;\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Cử cán bộ chỉ huy trực tiếp và cán bộ kỹ thuật thường xuyên có mặt tại công trường để giám sát chất lượng và tiến độ thi công. Việc giám sát, nghiệm thu của Bên A không làm giảm trách nhiệm của Bên B về chất lượng công trình; mọi sai sót của Bên B dẫn đến thiệt hại thì Bên B phải bồi thường toàn bộ giá trị thiệt hại đó và chịu trách nhiệm trước pháp luật;<span class=\"th\" data-t=\"แต่งตั้งผู้บัญชาการหน้างานโดยตรงและเจ้าหน้าที่เทคนิคให้อยู่ประจำที่หน้างานอย่างสม่ำเสมอ เพื่อควบคุมดูแลคุณภาพและกำหนดการก่อสร้าง การควบคุมดูแลและการตรวจรับของฝ่าย A ไม่เป็นการลดความรับผิดชอบของฝ่าย B ต่อคุณภาพของงานก่อสร้าง ความผิดพลาดใดๆ ของฝ่าย B ที่ก่อให้เกิดความเสียหาย ฝ่าย B ต้องชดใช้ค่าเสียหายนั้นเต็มจำนวน และต้องรับผิดตามกฎหมาย;\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Nghiệm thu, thanh toán và quyết toán cho Bên B theo Điều 5, Điều 10 và Điều 17 của Hợp đồng.<span class=\"th\" data-t=\"ตรวจรับ ชำระเงิน และทำการสรุปยอด (quyết toán) ให้ฝ่าย B ตามข้อ 5 ข้อ 10 และข้อ 17 ของสัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Giải quyết kịp thời các vướng mắc liên quan đến thiết kế;<span class=\"th\" data-t=\"แก้ไขปัญหาและอุปสรรคที่เกี่ยวข้องกับการออกแบบได้อย่างทันท่วงที;\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Các trách nhiệm khác nêu trong Hợp đồng này và theo quy định của Pháp luật.<span class=\"th\" data-t=\"หน้าที่รับผิดชอบอื่นตามที่ระบุในสัญญานี้และตามบทบัญญัติของกฎหมาย\"></span></p><p>Danh sách người đại diện của mỗi Bên và phạm vi thẩm quyền được xác định tại Phụ lục 01 hoặc văn bản ủy quyền hợp lệ được thông báo cho Bên còn lại. Người xác nhận kỹ thuật hoặc khối lượng chỉ có quyền xác nhận trong phạm vi được giao. Việc chấp thuận đơn giá, gia hạn, quyết toán và sửa đổi Hợp đồng chỉ có hiệu lực khi được người đại diện hợp pháp hoặc người được ủy quyền đúng phạm vi của các Bên ký xác nhận.<span class=\"th\" data-t=\"รายชื่อผู้แทนของแต่ละฝ่ายและขอบเขตอำนาจกำหนดไว้ในภาคผนวก 01 หรือหนังสือมอบอำนาจที่ชอบด้วยกฎหมายซึ่งแจ้งให้อีกฝ่ายทราบ ผู้ยืนยันด้านเทคนิคหรือปริมาณงานมีอำนาจยืนยันได้เฉพาะภายในขอบเขตที่ได้รับมอบหมายเท่านั้น การอนุมัติราคาต่อหน่วย การขยายระยะเวลา การสรุปยอด และการแก้ไขสัญญา มีผลบังคับใช้ต่อเมื่อผู้แทนโดยชอบด้วยกฎหมายหรือผู้ได้รับมอบอำนาจภายในขอบเขตของแต่ละฝ่ายลงนามยืนยันแล้วเท่านั้น\"></span></p><p class=\"lv1\"><span class=\"lb\">6.3</span>Trách nhiệm của Bên B:<span class=\"th\" data-t=\"หน้าที่รับผิดชอบของฝ่าย B:\"></span></p><p class=\"lv0\"><span class=\"lb\">a)</span>Nhân lực và tổ chức thi công<span class=\"th\" data-t=\"กำลังคนและการจัดการงานก่อสร้าง\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bố trí đủ nhân lực đúng chuyên môn như đã cam kết; thay thế nhân sự không đạt yêu cầu trong vòng 07 ngày khi có yêu cầu của Bên A.<span class=\"th\" data-t=\"จัดสรรกำลังคนให้เพียงพอและมีความเชี่ยวชาญตรงตามที่ได้ให้คำมั่นไว้ เปลี่ยนตัวบุคลากรที่ไม่ผ่านเกณฑ์ภายใน 07 วันเมื่อฝ่าย A ร้องขอ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Nhân sự phải chấp hành nghiêm nội quy công trường; nếu vi phạm, phải rời khỏi công trường ngay.<span class=\"th\" data-t=\"บุคลากรต้องปฏิบัติตามระเบียบของหน้างานอย่างเคร่งครัด หากฝ่าฝืนต้องออกจากหน้างานทันที\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Lập kế hoạch, tiến độ và biện pháp thi công, gửi Bên A trước khi triển khai.<span class=\"th\" data-t=\"จัดทำแผนงาน กำหนดการ และวิธีการก่อสร้าง และส่งให้ฝ่าย A ก่อนเริ่มดำเนินการ\"></span></p><p class=\"lv0\"><span class=\"lb\">b)</span>Tiến độ thi công và nghiệm thu<span class=\"th\" data-t=\"กำหนดการก่อสร้างและการตรวจรับ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Thi công đúng thiết kế, bản vẽ, biện pháp thi công và các yêu cầu kỹ thuật do Bên A cung cấp; đảm bảo chất lượng, an toàn lao động, phòng cháy chữa cháy, vệ sinh môi trường và tiến độ thực hiện Hợp đồng.<span class=\"th\" data-t=\"ก่อสร้างให้ถูกต้องตามแบบ แปลน วิธีการก่อสร้าง และข้อกำหนดทางเทคนิคที่ฝ่าย A ให้ไว้ รับรองคุณภาพ ความปลอดภัยในการทำงาน การป้องกันและระงับอัคคีภัย สุขอนามัยสิ่งแวดล้อม และกำหนดการปฏิบัติตามสัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Huy động đầy đủ nhân lực, máy móc, thiết bị để thực hiện công việc theo tiến độ đã cam kết; chủ động áp dụng các biện pháp cần thiết để đảm bảo tiến độ và không làm ảnh hưởng đến tiến độ chung của công trình.<span class=\"th\" data-t=\"ระดมกำลังคน เครื่องจักร และอุปกรณ์ให้ครบถ้วนเพื่อดำเนินงานตามกำหนดการที่ได้ให้คำมั่นไว้ ดำเนินมาตรการที่จำเป็นด้วยตนเองเพื่อรักษากำหนดการ และไม่ทำให้กระทบต่อกำหนดการโดยรวมของโครงการ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trường hợp tiến độ thực tế chậm so với tiến độ đã được Bên A chấp thuận, Bên B phải tự bổ sung nhân lực, máy móc, thiết bị, tăng ca, làm thêm giờ hoặc áp dụng các biện pháp cần thiết khác để bù tiến độ mà không được yêu cầu Bên A thanh toán bất kỳ chi phí phát sinh nào.<span class=\"th\" data-t=\"ในกรณีที่กำหนดการจริงล่าช้ากว่ากำหนดการที่ฝ่าย A เห็นชอบ ฝ่าย B ต้องเพิ่มกำลังคน เครื่องจักร อุปกรณ์ เพิ่มกะ ทำงานล่วงเวลา หรือใช้มาตรการอื่นที่จำเป็นด้วยตนเองเพื่อเร่งงานให้ทันกำหนดการ โดยไม่มีสิทธิเรียกร้องให้ฝ่าย A ชำระค่าใช้จ่ายส่วนเพิ่มใดๆ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Chỉ được chuyển bước thi công hoặc thực hiện công việc tiếp theo sau khi phần việc trước đó được Bên A nghiệm thu, xác nhận.<span class=\"th\" data-t=\"จะเปลี่ยนไปขั้นตอนก่อสร้างถัดไปหรือดำเนินงานส่วนต่อไปได้ก็ต่อเมื่องานส่วนก่อนหน้าได้รับการตรวจรับและยืนยันจากฝ่าย A แล้วเท่านั้น\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Lập đầy đủ hồ sơ nghiệm thu nội bộ, nhật ký thi công, hồ sơ chất lượng, hồ sơ hoàn công (nếu có) và hồ sơ thanh toán theo biểu mẫu, hướng dẫn và yêu cầu của Bên A.<span class=\"th\" data-t=\"จัดทำเอกสารการตรวจรับภายใน สมุดบันทึกการก่อสร้าง เอกสารด้านคุณภาพ เอกสารแบบก่อสร้างจริง (as-built) (ถ้ามี) และเอกสารเบิกจ่ายให้ครบถ้วน ตามแบบฟอร์ม คำแนะนำ และข้อกำหนดของฝ่าย A\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Báo cáo tiến độ thực hiện công việc theo định kỳ hoặc đột xuất theo yêu cầu của Bên A; kịp thời thông báo các nguy cơ ảnh hưởng đến tiến độ và đề xuất biện pháp khắc phục.<span class=\"th\" data-t=\"รายงานความคืบหน้าการปฏิบัติงานเป็นระยะหรือเป็นกรณีพิเศษตามที่ฝ่าย A ร้องขอ แจ้งความเสี่ยงที่อาจกระทบกำหนดการให้ทราบโดยทันที และเสนอแนวทางแก้ไข\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Đối với công việc cẩu nâng, vận chuyển đặc thù <strong><span class=\"fx\" data-k=\"MÔ TẢ / KHÔNG ÁP DỤNG\"></span></strong>, mọi chi phí đã được tính trong giá BOQ nếu thuộc phạm vi Bên B.<span class=\"th\" data-t=\"สำหรับงานยกและขนส่งที่มีลักษณะเฉพาะ 【MÔ TẢ / KHÔNG ÁP DỤNG】 ค่าใช้จ่ายทั้งหมดได้รวมอยู่ในราคา BOQ แล้ว หากเป็นขอบเขตงานของฝ่าย B\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B tổ chức vận chuyển vật tư, thiết bị đến các khu vực thi công theo Phụ lục 01 và biện pháp được duyệt; chi phí nằm trong giá nếu không có ngoại lệ được hai bên thống nhất bằng văn bản.<span class=\"th\" data-t=\"ฝ่าย B จัดการขนส่งวัสดุและอุปกรณ์ไปยังพื้นที่ก่อสร้างตามภาคผนวก 01 และวิธีการที่ได้รับอนุมัติ ค่าใช้จ่ายรวมอยู่ในราคาแล้ว เว้นแต่มีข้อยกเว้นที่ทั้งสองฝ่ายตกลงกันเป็นลายลักษณ์อักษร\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B bàn giao cho Bên A vật tư, công việc đã thanh toán và hồ sơ có liên quan; đối với máy móc thiết bị riêng của Bên B, thực hiện quyền và nghĩa vụ theo khoản 6.1 và Điều 8, không mặc nhiên trao quyền sử dụng cho Bên A.<span class=\"th\" data-t=\"ฝ่าย B ส่งมอบวัสดุ งานที่ได้ชำระเงินแล้ว และเอกสารที่เกี่ยวข้องให้ฝ่าย A ส่วนเครื่องจักรอุปกรณ์ที่เป็นของฝ่าย B เอง ให้ใช้สิทธิและปฏิบัติหน้าที่ตามข้อ 6.1 และข้อ 8 โดยไม่ถือเป็นการให้สิทธิใช้งานแก่ฝ่าย A โดยปริยาย\"></span></p><p class=\"lv0\"><span class=\"lb\">c)</span>Vật tư và thiết bị<span class=\"th\" data-t=\"วัสดุและอุปกรณ์\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Tiếp nhận, bảo quản và sử dụng đúng mục đích vật tư do Bên A cấp; thực hiện quyết toán sau khi hoàn thành.<span class=\"th\" data-t=\"รับมอบ เก็บรักษา และใช้วัสดุที่ฝ่าย A จัดให้ตรงตามวัตถุประสงค์ ทำการสรุปยอดหลังจากงานแล้วเสร็จ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Các vật tư phụ do Bên B cung cấp gồm <strong><span class=\"fx\" data-k=\"DANH MỤC VẬT TƯ PHỤ THEO BOQ / SHOP DRAWING\"></span></strong>.<span class=\"th\" data-t=\"วัสดุเสริมที่ฝ่าย B เป็นผู้จัดหา ได้แก่ 【DANH MỤC VẬT TƯ PHỤ THEO BOQ / SHOP DRAWING】\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Tự quản lý công cụ, thiết bị thuộc phần việc mình thực hiện (nếu có).<span class=\"th\" data-t=\"บริหารจัดการเครื่องมือและอุปกรณ์ที่เกี่ยวข้องกับงานส่วนที่ตนรับผิดชอบด้วยตนเอง (ถ้ามี)\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Thiết bị thi công tối thiểu của Bên B: <strong><span class=\"fx\" data-k=\"DANH SÁCH / CHỦNG LOẠI / SỐ LƯỢNG / KIỂM ĐỊNH\"></span></strong> phù hợp phương án thi công và yêu cầu an toàn tại Phụ lục 01/02.<span class=\"th\" data-t=\"อุปกรณ์ก่อสร้างขั้นต่ำของฝ่าย B: 【DANH SÁCH / CHỦNG LOẠI / SỐ LƯỢNG / KIỂM ĐỊNH】 ให้เหมาะสมกับแผนการก่อสร้างและข้อกำหนดด้านความปลอดภัยตามภาคผนวก 01/02\"></span></p><p class=\"lv0\"><span class=\"lb\">d)</span>An toàn và pháp lý<span class=\"th\" data-t=\"ความปลอดภัยและกฎหมาย\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Chịu hoàn toàn trách nhiệm về an toàn lao động cho nhân sự Bên B trong toàn bộ thời gian thi công.<span class=\"th\" data-t=\"รับผิดชอบโดยสมบูรณ์ต่อความปลอดภัยในการทำงานของบุคลากรฝ่าย B ตลอดระยะเวลาก่อสร้าง\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Tự thực hiện đăng ký tạm trú; chịu trách nhiệm về các khoản thuế, phí, nghĩa vụ tài chính liên quan đến nhân công.<span class=\"th\" data-t=\"ดำเนินการลงทะเบียนที่พักชั่วคราว (đăng ký tạm trú) ด้วยตนเอง รับผิดชอบภาษี ค่าธรรมเนียม และภาระทางการเงินที่เกี่ยวข้องกับแรงงาน\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B phải tuân thủ đăng ký tạm trú, nghĩa vụ thuế, bảo hiểm và quy định lao động đối với nhân sự của mình theo pháp luật.<span class=\"th\" data-t=\"ฝ่าย B ต้องปฏิบัติตามการลงทะเบียนที่พักชั่วคราว ภาระภาษี การประกันภัย และระเบียบด้านแรงงานสำหรับบุคลากรของตนตามกฎหมาย\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B chịu trách nhiệm trả lương và nghĩa vụ đối với lao động, nhà thầu phụ; trang phục bảo hộ và logo tại công trường áp dụng theo nội quy đã thông báo, chi phí đồng phục (nếu có) ghi tại Phụ lục 01: <strong><span class=\"fx\" data-k=\"CÓ/KHÔNG – ĐƠN GIÁ\"></span></strong>.<span class=\"th\" data-t=\"ฝ่าย B รับผิดชอบในการจ่ายค่าจ้างและปฏิบัติหน้าที่ต่อแรงงานและผู้รับเหมาช่วง ชุดป้องกันและโลโก้ที่หน้างานให้เป็นไปตามระเบียบที่ได้แจ้งไว้ ค่าใช้จ่ายชุดยูนิฟอร์ม (ถ้ามี) ระบุไว้ในภาคผนวก 01: 【CÓ/KHÔNG – ĐƠN GIÁ】\"></span></p><p class=\"lv0\"><span class=\"lb\">e)</span>Phối hợp và tuân thủ<span class=\"th\" data-t=\"การประสานงานและการปฏิบัติตาม\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Tuân thủ mọi hướng dẫn, điều phối của Bên A và Tư vấn giám sát. Không cản trở hoạt động các đơn vị khác trên công trường.<span class=\"th\" data-t=\"ปฏิบัติตามคำแนะนำและการประสานงานทั้งหมดของฝ่าย A และที่ปรึกษาควบคุมงาน ไม่ขัดขวางการดำเนินงานของหน่วยงานอื่นที่หน้างาน\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Phối hợp báo cáo nhân sự, tiến độ, rủi ro (nếu có) đúng thời hạn quy định.<span class=\"th\" data-t=\"ประสานงานในการรายงานเรื่องบุคลากร กำหนดการ และความเสี่ยง (ถ้ามี) ให้ตรงตามเวลาที่กำหนด\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B phải trả lời thông báo nghiệp vụ của Bên A trong vòng <strong><span class=\"fx\" data-k=\"02\"></span></strong> ngày làm việc; im lặng không mặc nhiên đồng nghĩa chấp thuận phát sinh khối lượng, đơn giá, sửa đổi Hợp đồng hay từ bỏ quyền khiếu nại.<span class=\"th\" data-t=\"ฝ่าย B ต้องตอบกลับหนังสือแจ้งด้านงานของฝ่าย A ภายใน 【02】 วันทำการ การนิ่งเฉยไม่ถือเป็นการยอมรับโดยปริยายต่อการเพิ่มปริมาณงาน ราคาต่อหน่วย การแก้ไขสัญญา หรือการสละสิทธิเรียกร้อง\"></span></p><p>Chi phí phát sinh, nếu có, được giải quyết theo Điều 20 và quy định pháp luật bắt buộc; các chỉ đạo kỹ thuật tại hiện trường không mặc nhiên là phê duyệt tăng giá hoặc gia hạn.<span class=\"th\" data-t=\"ค่าใช้จ่ายที่เกิดขึ้นเพิ่มเติม (ถ้ามี) ให้แก้ไขตามข้อ 20 และบทบัญญัติของกฎหมายที่เป็นข้อบังคับ คำสั่งทางเทคนิคที่หน้างานไม่ถือเป็นการอนุมัติให้เพิ่มราคาหรือขยายระยะเวลาโดยปริยาย\"></span></p><p class=\"lv0\"><span class=\"lb\">f)</span>Các quy định đặc thù <span class=\"th\" data-t=\"ข้อกำหนดเฉพาะ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Không thi công vượt phạm vi mặt bằng được bàn giao.<span class=\"th\" data-t=\"ไม่ก่อสร้างเกินขอบเขตพื้นที่ที่ได้รับมอบ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Chỉ được thi công sau khi có sự chấp thuận của cơ quan chức năng và Bên A tại khu vực đặc thù (ví dụ: khu bảo tồn, rừng).<span class=\"th\" data-t=\"จะก่อสร้างในพื้นที่เฉพาะ (เช่น เขตอนุรักษ์ ป่าไม้) ได้ก็ต่อเมื่อได้รับความเห็นชอบจากหน่วยงานที่มีอำนาจและฝ่าย A แล้วเท่านั้น\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>  Bên B cam kết tuân thủ đầy đủ các quy định của pháp luật về bảo vệ môi trường trong quá trình sản xuất, kinh doanh và cung cấp hàng hóa cho Bên A. Khi được yêu cầu, Bên B sẽ cung cấp các hồ sơ, chứng nhận hoặc cam kết liên quan đến môi trường để phục vụ công tác đánh giá nhà cung cấp của Bên A<span class=\"th\" data-t=\"ฝ่าย B ให้คำมั่นว่าจะปฏิบัติตามบทบัญญัติของกฎหมายว่าด้วยการคุ้มครองสิ่งแวดล้อมอย่างครบถ้วนในระหว่างการผลิต การประกอบธุรกิจ และการจัดหาสินค้าให้แก่ฝ่าย A เมื่อได้รับการร้องขอ ฝ่าย B จะจัดหาเอกสาร ใบรับรอง หรือหนังสือรับรองที่เกี่ยวข้องกับสิ่งแวดล้อม เพื่อประกอบการประเมินผู้จัดหาของฝ่าย A\"></span></p><h3 class=\"art\" data-n=\"7\">ĐIỀU 7. ĐIỆN, NƯỚC VÀ AN NINH CÔNG TRƯỜNG<span class=\"th\" data-t=\"ข้อ 7 ไฟฟ้า น้ำ และการรักษาความปลอดภัยหน้างาน\"></span></h3><p class=\"lv1\"><span class=\"lb\">7.1</span>Điện, nước trên công trường<span class=\"th\" data-t=\"ไฟฟ้าและน้ำที่หน้างาน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B phải tự chịu trách nhiệm trong việc cung cấp điện, nước và các dịch vụ khác cần thiết cho thi công nhân công.<span class=\"th\" data-t=\"ฝ่าย B ต้องรับผิดชอบด้วยตนเองในการจัดหาไฟฟ้า น้ำ และบริการอื่นที่จำเป็นสำหรับการก่อสร้างและแรงงาน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trường hợp nguồn điện, nước và các dịch vụ khác do Bên A (Bên giao thầu) cung cấp sẵn tại công trường, Bên B được phép sử dụng nhưng phải có trách nhiệm bảo quản, sử dụng đúng mục đích, tiết kiệm và an toàn.<span class=\"th\" data-t=\"ในกรณีที่ฝ่าย A (ฝ่ายผู้ว่าจ้าง) จัดเตรียมไฟฟ้า น้ำ และบริการอื่นไว้ที่หน้างานแล้ว ฝ่าย B มีสิทธิใช้ได้ แต่ต้องรับผิดชอบในการดูแลรักษา ใช้ให้ตรงวัตถุประสงค์ อย่างประหยัดและปลอดภัย\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B phải tự chịu mọi rủi ro và chi phí liên quan, kể cả việc cung cấp thiết bị cần thiết để sử dụng các dịch vụ này cũng như thiết bị đo lường.<span class=\"th\" data-t=\"ฝ่าย B ต้องรับความเสี่ยงและค่าใช้จ่ายที่เกี่ยวข้องทั้งหมดด้วยตนเอง รวมถึงการจัดหาอุปกรณ์ที่จำเป็นสำหรับการใช้บริการเหล่านี้ตลอดจนอุปกรณ์วัด\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Mọi chi phí sử dụng điện, nước và dịch vụ khác do Bên B sử dụng (bao gồm tổn thất, hao hụt do hư hỏng, mất mát thiết bị đo, thi công không đúng quy định) sẽ do Bên B tự thanh toán trực tiếp cho nhà cung cấp hoặc hoàn trả lại đầy đủ cho Bên A nếu Bên A đã tạm ứng hoặc thanh toán trước.<span class=\"th\" data-t=\"ค่าใช้จ่ายในการใช้ไฟฟ้า น้ำ และบริการอื่นทั้งหมดที่ฝ่าย B ใช้ (รวมถึงความสูญเสียและการสูญหายอันเกิดจากความเสียหาย การสูญหายของอุปกรณ์วัด หรือการก่อสร้างที่ไม่เป็นไปตามระเบียบ) ฝ่าย B ต้องชำระโดยตรงให้แก่ผู้ให้บริการด้วยตนเอง หรือชดใช้คืนให้ฝ่าย A อย่างครบถ้วนในกรณีที่ฝ่าย A ได้ชำระล่วงหน้าหรือทดรองจ่ายไปก่อน\"></span></p><p class=\"lv1\"><span class=\"lb\">7.2</span>An ninh công trường<span class=\"th\" data-t=\"การรักษาความปลอดภัยหน้างาน\"></span></p><p class=\"lv0\"><span class=\"lb\">a)</span>Bên B không được tự ý cho phép bất kỳ cá nhân không có nhiệm vụ vào công trường, đồng thời phải chịu hoàn toàn trách nhiệm nếu để xảy ra sai phạm hoặc mất an ninh trật tự trong khu vực thi công mà có liên quan đến nhân sự Bên B.<span class=\"th\" data-t=\"ฝ่าย B ต้องไม่อนุญาตให้บุคคลใดที่ไม่มีหน้าที่เข้าหน้างานโดยพลการ และต้องรับผิดชอบโดยสมบูรณ์หากเกิดการกระทำผิดหรือความไม่สงบเรียบร้อยในพื้นที่ก่อสร้างที่เกี่ยวข้องกับบุคลากรของฝ่าย B\"></span></p><p class=\"lv0\"><span class=\"lb\">b)</span>Những người được phép ra vào công trường bao gồm:<span class=\"th\" data-t=\"บุคคลที่ได้รับอนุญาตให้เข้า-ออกหน้างาน ได้แก่:\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Nhân lực của Bên B đã được đăng ký.<span class=\"th\" data-t=\"กำลังคนของฝ่าย B ที่ได้ลงทะเบียนแล้ว\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Nhân sự của Bên A và các bên liên quan khác do Bên A (hoặc người được ủy quyền của Bên A) thông báo bằng văn bản.<span class=\"th\" data-t=\"บุคลากรของฝ่าย A และฝ่ายอื่นที่เกี่ยวข้องตามที่ฝ่าย A (หรือผู้ได้รับมอบอำนาจจากฝ่าย A) แจ้งเป็นลายลักษณ์อักษร\"></span></p><p class=\"lv0\"><span class=\"lb\">c)</span>Bên B phải lập danh sách, đăng ký trước toàn bộ nhân sự làm việc tại công trường, chịu trách nhiệm kiểm soát người ra vào, và phối hợp với Bên A trong công tác quản lý an ninh. Mọi tài sản của Bên B và/hoặc tài sản được Bên A giao cho Bên B quản lý hoặc sử dụng, nếu xảy ra mất mát, hư hỏng trong quá trình thi công, Bên B hoàn toàn chịu trách nhiệm bồi thường theo giá trị thiệt hại thực tế.<span class=\"th\" data-t=\"ฝ่าย B ต้องจัดทำรายชื่อและลงทะเบียนบุคลากรทั้งหมดที่ทำงานที่หน้างานล่วงหน้า รับผิดชอบในการควบคุมการเข้า-ออก และประสานงานกับฝ่าย A ในการบริหารจัดการความปลอดภัย ทรัพย์สินทั้งหมดของฝ่าย B และ/หรือทรัพย์สินที่ฝ่าย A มอบให้ฝ่าย B ดูแลหรือใช้งาน หากเกิดการสูญหายหรือเสียหายในระหว่างการก่อสร้าง ฝ่าย B ต้องรับผิดชดใช้ค่าเสียหายตามมูลค่าความเสียหายที่แท้จริงทั้งหมด\"></span></p><p class=\"lv0\"><span class=\"lb\">d)</span>Tất cả nhân sự của Bên B bắt buộc phải tuân thủ nghiêm túc nội quy, quy chế và các chỉ đạo tại công trường do Bên A ban hành tại từng thời điểm.Việc vi phạm nội quy công trường của nhân sự Bên B sẽ được xem là vi phạm hợp đồng, và Bên A có quyền:<span class=\"th\" data-t=\"บุคลากรของฝ่าย B ทุกคนต้องปฏิบัติตามระเบียบ ข้อบังคับ และคำสั่งที่หน้างานซึ่งฝ่าย A ประกาศใช้ในแต่ละช่วงเวลาอย่างเคร่งครัด การที่บุคลากรของฝ่าย B ฝ่าฝืนระเบียบหน้างานถือเป็นการผิดสัญญา และฝ่าย A มีสิทธิ:\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Yêu cầu thay thế nhân sự.<span class=\"th\" data-t=\"เรียกร้องให้เปลี่ยนตัวบุคลากร\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Tạm dừng thi công.<span class=\"th\" data-t=\"ระงับการก่อสร้างชั่วคราว\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Hoặc xử lý vi phạm theo các điều khoản đã thỏa thuận trong hợp đồng.<span class=\"th\" data-t=\"หรือดำเนินการกับการฝ่าฝืนตามข้อกำหนดที่ตกลงไว้ในสัญญา\"></span></p><p>7.3. Phạm vi an toàn, các hành vi nghiêm cấm, biểu mẫu báo cáo và cơ chế nhắc nhở/khắc phục được quy định tại Phụ lục 02. Không áp dụng phụ lục HSE riêng của dự án nếu chưa được xác nhận và cung cấp cho Bên B.<span class=\"th\" data-t=\"7.3. ขอบเขตด้านความปลอดภัย การกระทำที่ต้องห้าม แบบฟอร์มรายงาน และกลไกการเตือน/การแก้ไข กำหนดไว้ในภาคผนวก 02 ไม่ใช้ภาคผนวก HSE เฉพาะของโครงการ หากยังไม่ได้รับการยืนยันและส่งมอบให้ฝ่าย B\"></span></p><p>7.4. Các thiết bị có yêu cầu nghiêm ngặt về an toàn, nhân sự vận hành, làm việc trên cao, điện và PCCC phải có hồ sơ, giấy phép, kiểm định hợp lệ. Bên A có quyền dừng công việc nguy hiểm ngay, Bên B khắc phục trong <strong><span class=\"fx\" data-k=\"GIỜ\"></span></strong> giờ và báo cáo sự cố trong <strong><span class=\"fx\" data-k=\"GIỜ\"></span></strong> giờ.<span class=\"th\" data-t=\"7.4. อุปกรณ์ที่มีข้อกำหนดด้านความปลอดภัยที่เข้มงวด บุคลากรปฏิบัติการ งานบนที่สูง ไฟฟ้า และการป้องกันอัคคีภัย (PCCC) ต้องมีเอกสาร ใบอนุญาต และการตรวจสอบรับรองที่ถูกต้อง ฝ่าย A มีสิทธิสั่งหยุดงานอันตรายได้ทันที ฝ่าย B ต้องแก้ไขภายใน 【GIỜ】 ชั่วโมง และรายงานเหตุการณ์ภายใน 【GIỜ】 ชั่วโมง\"></span></p><p>7.5. Trước khi thực hiện công việc tại nhà máy đang hoạt động, Bên B phải trình và được Bên A chấp thuận bằng văn bản kế hoạch cắt điện, khóa và cô lập nguồn năng lượng, đấu nối, công việc nóng, cẩu nâng và thời gian dừng máy tương ứng với phạm vi thi công. Khi thi công tại trại chăn nuôi, Bên B phải tuân thủ các quy định an toàn sinh học tại Phụ lục 02, thực hiện khử trùng người, phương tiện, dụng cụ, kiểm soát luồng di chuyển và bảo vệ vật nuôi. Trách nhiệm bồi thường được xác định theo Điều 15.<span class=\"th\" data-t=\"7.5. ก่อนดำเนินงานในโรงงานที่กำลังเดินเครื่องอยู่ ฝ่าย B ต้องเสนอและได้รับความเห็นชอบเป็นลายลักษณ์อักษรจากฝ่าย A ต่อแผนการตัดไฟ การล็อกและแยกแหล่งพลังงาน การเชื่อมต่อ งานที่ใช้ความร้อน (hot work) การยกเคลื่อนย้าย และระยะเวลาหยุดเครื่องจักร ให้สอดคล้องกับขอบเขตการก่อสร้าง เมื่อก่อสร้างในฟาร์มปศุสัตว์ ฝ่าย B ต้องปฏิบัติตามระเบียบด้านความปลอดภัยทางชีวภาพตามภาคผนวก 02 ดำเนินการฆ่าเชื้อบุคคล ยานพาหนะ และเครื่องมือ ควบคุมเส้นทางการเคลื่อนที่ และคุ้มครองสัตว์เลี้ยง ความรับผิดในการชดใช้ค่าเสียหายให้กำหนดตามข้อ 15\"></span></p><h3 class=\"art\" data-n=\"8\">ĐIỀU 8. TẠM DỪNG VÀ CHẤM DỨT HỢP ĐỒNG BỞI BÊN A<span class=\"th\" data-t=\"ข้อ 8 การระงับและการเลิกสัญญาโดยฝ่าย A\"></span></h3><p class=\"lv1\"><span class=\"lb\">8.1</span>Tạm dừng công việc bởi Bên A<span class=\"th\" data-t=\"การระงับงานโดยฝ่าย A\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Nếu Bên B không thực hiện đúng nghĩa vụ hợp đồng, Bên A có quyền thông báo bằng văn bản cho Bên B khắc phục trong thời gian cụ thể.<span class=\"th\" data-t=\"หากฝ่าย B ไม่ปฏิบัติตามหน้าที่ตามสัญญาอย่างถูกต้อง ฝ่าย A มีสิทธิแจ้งเป็นลายลักษณ์อักษรให้ฝ่าย B แก้ไขภายในระยะเวลาที่กำหนดไว้เป็นการเฉพาะ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Nếu Bên B không đáp ứng yêu cầu về chất lượng, an toàn lao động, môi trường, phòng cháy chữa cháy hoặc tiến độ thi công, Bên A có quyền tạm dừng công việc.<span class=\"th\" data-t=\"หากฝ่าย B ไม่ตอบสนองข้อกำหนดด้านคุณภาพ ความปลอดภัยในการทำงาน สิ่งแวดล้อม การป้องกันและระงับอัคคีภัย หรือกำหนดการก่อสร้าง ฝ่าย A มีสิทธิระงับงานชั่วคราว\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trừ tình huống nguy hiểm khẩn cấp hoặc trường hợp pháp luật yêu cầu tạm dừng ngay, Bên A thông báo bằng văn bản cho Bên B trước <span class=\"fx\" data-k=\"03\"></span> ngày hoặc thời hạn phù hợp mức độ vi phạm, nêu rõ căn cứ, phạm vi tạm dừng và điều kiện khắc phục.<span class=\"th\" data-t=\"เว้นแต่ในสถานการณ์อันตรายเร่งด่วนหรือกรณีที่กฎหมายกำหนดให้ระงับทันที ฝ่าย A จะแจ้งเป็นลายลักษณ์อักษรให้ฝ่าย B ทราบล่วงหน้า 【03】 วัน หรือภายในระยะเวลาที่เหมาะสมกับความร้ายแรงของการฝ่าฝืน โดยระบุเหตุผล ขอบเขตการระงับ และเงื่อนไขการแก้ไขอย่างชัดเจน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Thời gian tạm dừng do lỗi Bên B không được tự động gia hạn và chi phí hợp lý phát sinh do Bên B chịu; tạm dừng do lỗi Bên A hoặc Chủ đầu tư được xử lý theo  Điều 2 và Điều 3.<span class=\"th\" data-t=\"ระยะเวลาระงับงานอันเนื่องมาจากความผิดของฝ่าย B จะไม่ได้รับการขยายโดยอัตโนมัติ และค่าใช้จ่ายอันสมควรที่เกิดขึ้นเป็นภาระของฝ่าย B การระงับงานอันเนื่องมาจากความผิดของฝ่าย A หรือเจ้าของโครงการ ให้ดำเนินการตามข้อ 2 และข้อ 3\"></span></p><p class=\"lv1\"><span class=\"lb\">8.2</span>Chấm dứt hợp đồng bởi Bên A<span class=\"th\" data-t=\"การเลิกสัญญาโดยฝ่าย A\"></span></p><p>Bên A có quyền chấm dứt Hợp đồng theo Điều 85 Luật Xây dựng 2025, pháp luật liên quan và các trường hợp vi phạm trọng yếu sau, với thông báo, thời hạn khắc phục (nếu có) và bằng chứng phù hợp:<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิเลิกสัญญาตามมาตรา 85 ของกฎหมายว่าด้วยการก่อสร้าง พ.ศ. 2025 (Luật Xây dựng 2025) กฎหมายที่เกี่ยวข้อง และกรณีการผิดสัญญาในสาระสำคัญดังต่อไปนี้ โดยต้องมีการแจ้ง ระยะเวลาแก้ไข (ถ้ามี) และหลักฐานที่เหมาะสม:\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Không thi công hoặc không khắc phục vi phạm sau khi được yêu cầu.<span class=\"th\" data-t=\"ไม่ก่อสร้างหรือไม่แก้ไขการฝ่าฝืนภายหลังได้รับการร้องขอ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bỏ thi công, hoặc thể hiện không tiếp tục thực hiện hợp đồng.<span class=\"th\" data-t=\"ทิ้งงานก่อสร้าง หรือแสดงออกว่าจะไม่ปฏิบัติตามสัญญาต่อไป\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Tự ý nghỉ thi công 03 ngày liên tục hoặc 05 ngày cộng dồn trong tháng mà không có lý do chính đáng.<span class=\"th\" data-t=\"หยุดงานก่อสร้างโดยพลการติดต่อกัน 03 วัน หรือสะสม 05 วันในหนึ่งเดือน โดยไม่มีเหตุผลอันสมควร\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B mất khả năng tiếp tục thực hiện nghĩa vụ hoặc thuộc trường hợp phá sản/ngừng hoạt động theo pháp luật làm ảnh hưởng thực tế đến tiến độ; không chỉ dựa trên đánh giá chủ quan.<span class=\"th\" data-t=\"ฝ่าย B สูญเสียความสามารถในการปฏิบัติตามหน้าที่ต่อไป หรืออยู่ในกรณีล้มละลาย/หยุดดำเนินกิจการตามกฎหมายอันส่งผลกระทบต่อกำหนดการอย่างแท้จริง ทั้งนี้ ไม่ใช้เพียงการประเมินตามความเห็นส่วนตัว\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Vi phạm nghiêm trọng chất lượng, tiến độ, an toàn, gian lận hồ sơ hoặc tái phạm sau <span class=\"fx\" data-k=\"02\"></span> lần thông báo bằng văn bản và hết thời hạn khắc phục <span class=\"fx\" data-k=\"SỐ NGÀY\"></span> mà không khắc phục, trừ vi phạm không thể khắc phục hoặc rủi ro an toàn khẩn cấp.<span class=\"th\" data-t=\"ฝ่าฝืนอย่างร้ายแรงในด้านคุณภาพ กำหนดการ ความปลอดภัย ปลอมแปลงเอกสาร หรือกระทำผิดซ้ำภายหลังได้รับหนังสือแจ้งเป็นลายลักษณ์อักษร 【02】 ครั้ง และพ้นระยะเวลาแก้ไข 【SỐ NGÀY】 วันแล้วยังไม่แก้ไข เว้นแต่การฝ่าฝืนที่ไม่อาจแก้ไขได้หรือความเสี่ยงด้านความปลอดภัยเร่งด่วน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Các trường hợp khác theo pháp luật hoặc hợp đồng.<span class=\"th\" data-t=\"กรณีอื่นตามที่กฎหมายหรือสัญญากำหนด\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Thông báo chấm dứt được lập bằng văn bản trước <span class=\"fx\" data-k=\"03\"></span> ngày làm việc hoặc thời hạn khác theo pháp luật áp dụng; trong trường hợp nguy hiểm nghiêm trọng có thể dừng công việc ngay nhưng việc chấm dứt vẫn tuân thủ trình tự pháp luật.<span class=\"th\" data-t=\"หนังสือแจ้งเลิกสัญญาต้องทำเป็นลายลักษณ์อักษรล่วงหน้า 【03】 วันทำการ หรือภายในระยะเวลาอื่นตามกฎหมายที่ใช้บังคับ ในกรณีอันตรายร้ายแรงอาจหยุดงานได้ทันที แต่การเลิกสัญญายังต้องเป็นไปตามขั้นตอนของกฎหมาย\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Sau khi chấm dứt, Bên B rút người, thiết bị riêng khỏi công trường trong <span class=\"fx\" data-k=\"05\"></span> ngày làm việc, đồng thời bàn giao hồ sơ, vật tư và các công việc thuộc sở hữu Bên A. Hai bên lập biên bản kiểm kê; nếu Bên B vắng mặt sau khi được mời hợp lệ, Bên A có thể kiểm kê với bên thứ ba độc lập.<span class=\"th\" data-t=\"เมื่อสัญญาเลิกแล้ว ฝ่าย B ต้องถอนบุคลากรและอุปกรณ์ของตนเองออกจากหน้างานภายใน 【05】 วันทำการ พร้อมทั้งส่งมอบเอกสาร วัสดุ และงานที่เป็นกรรมสิทธิ์ของฝ่าย A ทั้งสองฝ่ายจัดทำรายงานการตรวจนับ หากฝ่าย B ไม่มาร่วมหลังจากได้รับเชิญโดยชอบแล้ว ฝ่าย A อาจตรวจนับร่วมกับบุคคลที่สามที่เป็นอิสระได้\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên A không được tự động lấy máy móc, thiết bị riêng của Bên B để trừ nợ nếu không có thỏa thuận bảo đảm hoặc căn cứ pháp luật; quyền bù trừ khoản tiền thực hiện theo Điều 5 và Điều 15.<span class=\"th\" data-t=\"ฝ่าย A ไม่มีสิทธิยึดเครื่องจักรและอุปกรณ์ของฝ่าย B เองโดยอัตโนมัติเพื่อหักชำระหนี้ หากไม่มีข้อตกลงเรื่องหลักประกันหรือไม่มีฐานทางกฎหมายรองรับ สิทธิในการหักกลบลบหนี้เงินให้เป็นไปตามข้อ 5 และข้อ 15\"></span></p><p class=\"lv1\"><span class=\"lb\">8.3</span>Xác định giá trị khi chấm dứt hợp đồng<span class=\"th\" data-t=\"การกำหนดมูลค่าเมื่อเลิกสัญญา\"></span></p><p>Khi chấm dứt, các bên kiểm kê và xác nhận khối lượng, chất lượng phần công việc thực tế đã hoàn thành, vật tư đã thanh toán, hồ sơ kỹ thuật, phần việc dở dang và chi phí hợp lý cần khắc phục. Bên A được lập biên bản một phía có chứng cứ khách quan nếu Bên B không hợp tác sau thông báo hợp lệ.<span class=\"th\" data-t=\"เมื่อเลิกสัญญา ทั้งสองฝ่ายตรวจนับและยืนยันปริมาณและคุณภาพของงานที่ทำเสร็จจริง วัสดุที่ชำระเงินแล้ว เอกสารทางเทคนิค งานที่ค้างอยู่ และค่าใช้จ่ายอันสมควรที่ต้องใช้ในการแก้ไข ฝ่าย A มีสิทธิจัดทำรายงานฝ่ายเดียวโดยมีพยานหลักฐานที่เป็นกลาง หากฝ่าย B ไม่ให้ความร่วมมือหลังได้รับหนังสือแจ้งโดยชอบ\"></span></p><p class=\"lv1\"><span class=\"lb\">8.4</span>Thanh toán sau khi chấm dứt hợp đồng<span class=\"th\" data-t=\"การชำระเงินภายหลังการเลิกสัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A được tạm giữ số tiền có căn cứ hợp lý liên quan trực tiếp đến khối lượng chưa nghiệm thu, số tạm ứng chưa thu hồi, chi phí hoàn thành/thay thế đang xác định, khoản phạt và bồi thường có căn cứ; phần tiền không tranh chấp phải được thanh toán đúng hạn.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิกักเงินจำนวนที่มีเหตุผลอันสมควรซึ่งเกี่ยวข้องโดยตรงกับปริมาณงานที่ยังไม่ได้ตรวจรับ เงินล่วงหน้าที่ยังไม่ได้เรียกคืน ค่าใช้จ่ายในการทำให้แล้วเสร็จ/จัดหาผู้ทำแทนที่อยู่ระหว่างการกำหนด ค่าปรับและการชดใช้ค่าเสียหายที่มีหลักฐานรองรับ ส่วนเงินที่ไม่มีข้อพิพาทต้องชำระตามกำหนด\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A được bù trừ các khoản nợ xác định được và có chứng từ theo hợp đồng, gồm tạm ứng chưa thu hồi, giá trị thanh toán vượt, chi phí khắc phục hoặc thuê thay thế hợp lý, tiền phạt trong giới hạn luật và thiệt hại thực tế chứng minh được; không được cộng trùng các khoản cho cùng thiệt hại.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิหักกลบลบหนี้ที่สามารถกำหนดได้และมีเอกสารหลักฐานตามสัญญา ได้แก่ เงินล่วงหน้าที่ยังไม่ได้เรียกคืน มูลค่าที่ชำระเกิน ค่าใช้จ่ายในการแก้ไขหรือว่าจ้างผู้ทำแทนอันสมควร ค่าปรับภายในขอบเขตที่กฎหมายอนุญาต และค่าเสียหายที่แท้จริงที่พิสูจน์ได้ ทั้งนี้ ห้ามนับซ้ำรายการสำหรับความเสียหายเดียวกัน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Sau khi hoàn tất việc đối chiếu, xác định công nợ và khấu trừ toàn bộ các khoản nêu trên, phần giá trị còn lại (nếu có) sẽ được Bên A thanh toán cho Bên B theo quy định của Hợp đồng.<span class=\"th\" data-t=\"หลังจากเสร็จสิ้นการเทียบยอด การกำหนดหนี้สิน และการหักรายการทั้งหมดข้างต้นแล้ว มูลค่าส่วนที่เหลือ (ถ้ามี) ฝ่าย A จะชำระให้ฝ่าย B ตามที่กำหนดในสัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Nếu tổng số tiền Bên B đã nhận vượt quá giá trị công việc được nghiệm thu sau khi đối chiếu hợp lệ, Bên B hoàn trả phần chênh lệch trong <span class=\"fx\" data-k=\"07\"></span> ngày làm việc từ khi nhận yêu cầu và bảng tính đầy đủ.<span class=\"th\" data-t=\"หากยอดเงินรวมที่ฝ่าย B ได้รับเกินกว่ามูลค่างานที่ได้ตรวจรับภายหลังการเทียบยอดโดยชอบ ฝ่าย B ต้องคืนส่วนต่างภายใน 【07】 วันทำการนับแต่ได้รับคำร้องขอและตารางคำนวณที่ครบถ้วน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Việc chấm dứt Hợp đồng không làm chấm dứt trách nhiệm của Bên B đối với các nghĩa vụ về chất lượng, bảo hành, bồi thường thiệt hại, nghĩa vụ tài chính và các nghĩa vụ khác phát sinh trước thời điểm chấm dứt Hợp đồng.<span class=\"th\" data-t=\"การเลิกสัญญาไม่ทำให้ความรับผิดของฝ่าย B ในหน้าที่ด้านคุณภาพ การรับประกันผลงาน การชดใช้ค่าเสียหาย ภาระทางการเงิน และหน้าที่อื่นที่เกิดขึ้นก่อนเวลาที่เลิกสัญญาสิ้นสุดลง\"></span></p><p>8.5. Hai bên thống nhất Bên A có quyền chấm dứt Hợp đồng do điều chỉnh hoặc dừng dự án bằng thông báo bằng văn bản gửi Bên B, tuân thủ thời hạn báo trước quy định tại Hợp đồng. Trường hợp chấm dứt không do lỗi hoặc hành vi vi phạm của Bên B, việc chấm dứt không tự động phát sinh phạt vi phạm đối với Bên B; quyết toán và hoàn trả tạm ứng thực hiện theo khoản này, Điều 5 và Điều 17.<span class=\"th\" data-t=\"8.5 คู่สัญญาตกลงว่าฝ่าย A มีสิทธิเลิกสัญญาเนื่องจากการปรับหรือหยุดโครงการ โดยมีหนังสือแจ้งเป็นลายลักษณ์อักษรถึงฝ่าย B โดยปฏิบัติตามระยะเวลาแจ้งล่วงหน้าที่กำหนดในสัญญา กรณีเลิกสัญญาโดยมิใช่ความผิดหรือการกระทำที่ฝ่าฝืนของฝ่าย B การเลิกสัญญาไม่ก่อให้เกิดค่าปรับตามสัญญาแก่ฝ่าย B โดยอัตโนมัติ การสรุปบัญชีและการคืนเงินล่วงหน้าให้ดำเนินการตามวรรคนี้ ข้อ 5 และข้อ 17\"></span></p><p>Đối với vật tư chưa đưa vào công trình, chỉ xem xét thanh toán vật tư thuộc phạm vi đã được Bên A phê duyệt, được đặt mua trước khi Bên B nhận thông báo chấm dứt và Bên B chứng minh không thể hủy đơn hàng, hoàn trả, bán lại hoặc sử dụng cho công việc khác dù đã áp dụng các biện pháp hợp lý. Giá trị thanh toán phải trừ các khoản được hoàn lại, giảm giá hoặc thu hồi; không tính trùng với giá trị khối lượng đã nghiệm thu. Bên B phải bàn giao vật tư, hồ sơ liên quan và chuyển quyền sở hữu hợp pháp cho Bên A khi được thanh toán.<span class=\"th\" data-t=\"สำหรับวัสดุที่ยังไม่ได้นำเข้าสู่งานก่อสร้าง จะพิจารณาชำระเงินเฉพาะวัสดุที่อยู่ในขอบเขตที่ฝ่าย A อนุมัติ ได้สั่งซื้อก่อนที่ฝ่าย B ได้รับหนังสือแจ้งเลิกสัญญา และฝ่าย B พิสูจน์ได้ว่าไม่สามารถยกเลิกคำสั่งซื้อ ส่งคืน ขายต่อ หรือนำไปใช้กับงานอื่นได้ แม้ได้ใช้มาตรการอันสมควรแล้ว มูลค่าที่ชำระต้องหักรายการที่ได้รับคืน ส่วนลด หรือที่เรียกคืนได้ และไม่นับซ้ำกับมูลค่าของปริมาณงานที่ได้ตรวจรับแล้ว ฝ่าย B ต้องส่งมอบวัสดุ เอกสารที่เกี่ยวข้อง และโอนกรรมสิทธิ์โดยชอบด้วยกฎหมายให้ฝ่าย A เมื่อได้รับการชำระเงิน\"></span></p><p>Số tiền còn phải thanh toán khi chấm dứt Hợp đồng bằng tổng giá trị công việc, vật tư và các khoản chi phí được chấp thuận thanh toán hợp lệ, trừ tổng số tiền Bên A đã thực tế thanh toán cho Bên B, bao gồm tạm ứng, và trừ các khoản giữ lại, khấu trừ hợp lệ khác. Không khấu trừ trùng khoản tạm ứng đã nằm trong tổng số tiền thực tế thanh toán. Nếu kết quả đối chiếu xác định Bên B nhận thừa tiền, Bên B phải hoàn trả theo thời hạn tương ứng quy định trong Hợp đồng.<span class=\"th\" data-t=\"จำนวนเงินที่ต้องชำระเมื่อเลิกสัญญา เท่ากับมูลค่ารวมของงาน วัสดุ และค่าใช้จ่ายที่ได้รับอนุมัติให้ชำระโดยชอบ หักด้วยจำนวนเงินรวมที่ฝ่าย A ได้ชำระจริงให้ฝ่าย B รวมถึงเงินล่วงหน้า และหักด้วยเงินที่กักไว้และรายการหักอื่นที่ชอบด้วยกฎหมาย ห้ามหักซ้ำเงินล่วงหน้าที่รวมอยู่ในยอดเงินที่ชำระจริงทั้งหมดแล้ว หากผลการเทียบยอดระบุว่าฝ่าย B ได้รับเงินเกิน ฝ่าย B ต้องคืนตามระยะเวลาที่เกี่ยวข้องซึ่งกำหนดในสัญญา\"></span></p><p>8.6. LIÊN THÔNG VỚI VIỆC TẠM DỪNG/CHẤM DỨT HỢP ĐỒNG CHỦ ĐẦU TƯ: Khi Chủ đầu tư tạm dừng, giảm phạm vi hoặc chấm dứt hợp đồng với KSP, Bên A thông báo bằng văn bản cho Bên B trong <span class=\"fx\" data-k=\"SỐ NGÀY\"></span> kể từ khi có thông tin được phép cung cấp; nêu phần việc bị ảnh hưởng, công việc phải bảo vệ/bàn giao và phương án giảm thiểu thiệt hại. Việc dừng hợp đồng chủ đầu tư không tự động làm Bên B vi phạm. Giá trị khối lượng đã nghiệm thu, vật tư đã được phê duyệt và không thể hủy/hoàn trả sau khi đã giảm thiểu hợp lý được xác định theo chứng từ, nghĩa vụ sở hữu và Điều 8.5; không thanh toán hai lần. Đối với thiệt hại do lỗi của Bên B dẫn đến chủ đầu tư chấm dứt, áp dụng Điều 9 và Điều 15 trong giới hạn có căn cứ và pháp luật. Thời hạn thông báo/chấm dứt phải lựa chọn tại Phụ lục 06 theo loại dự án, không tự động sao chép mốc 28 ngày từ hợp đồng mẫu khách hàng.<span class=\"th\" data-t=\"8.6 การเชื่อมโยงกับการหยุดชั่วคราว/การเลิกสัญญาของเจ้าของโครงการ: เมื่อเจ้าของโครงการหยุดชั่วคราว ลดขอบเขต หรือเลิกสัญญากับ KSP ฝ่าย A แจ้งฝ่าย B เป็นลายลักษณ์อักษรภายใน 【SỐ NGÀY】 นับจากวันที่มีข้อมูลที่อนุญาตให้เปิดเผยได้ โดยระบุส่วนงานที่ได้รับผลกระทบ งานที่ต้องคุ้มครอง/ส่งมอบ และแนวทางลดความเสียหาย การที่สัญญาของเจ้าของโครงการหยุดลงไม่ทำให้ฝ่าย B เป็นผู้ฝ่าฝืนโดยอัตโนมัติ มูลค่าปริมาณงานที่ตรวจรับแล้ว วัสดุที่ได้รับอนุมัติและไม่สามารถยกเลิก/คืนได้หลังจากได้ลดความเสียหายตามสมควรแล้ว ให้กำหนดตามเอกสารหลักฐาน ภาระด้านกรรมสิทธิ์ และข้อ 8.5 ห้ามชำระสองครั้ง สำหรับความเสียหายที่เกิดจากความผิดของฝ่าย B อันเป็นเหตุให้เจ้าของโครงการเลิกสัญญา ให้ใช้ข้อ 9 และข้อ 15 ภายในขอบเขตที่มีหลักฐานและกฎหมายรองรับ กำหนดเวลาแจ้ง/เลิกสัญญาต้องเลือกในภาคผนวก 06 ตามประเภทโครงการ ไม่คัดลอกกำหนด 28 วันจากสัญญาแบบฟอร์มของลูกค้าโดยอัตโนมัติ\"></span></p><h3 class=\"art\" data-n=\"9\">ĐIỀU 9. THƯỞNG HỢP ĐỒNG, PHẠT VI PHẠM HỢP ĐỒNG<span class=\"th\" data-t=\"ข้อ 9 เงินรางวัลตามสัญญา และค่าปรับตามสัญญา\"></span></h3><p>9.1. Thưởng hợp đồng (nếu có)<span class=\"th\" data-t=\"9.1. เงินรางวัลตามสัญญา (ถ้ามี)\"></span></p><p>Trường hợp Bên B hoàn thành đúng tiến độ, chất lượng, Bên A có thể xem xét ưu tiên trong cơ hội dự án tiếp theo; việc này không tạo nghĩa vụ giao thầu hoặc hứa thưởng tiền mặt, trừ khi Phụ lục 06 quy định cụ thể.<span class=\"th\" data-t=\"ในกรณีที่ฝ่าย B ทำงา
