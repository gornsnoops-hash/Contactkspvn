const DOCS={"sc": "<p class=\"ctr\"><strong>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</strong><span class=\"th\" data-t=\"สาธารณรัฐสังคมนิยมเวียดนาม\"></span></p><p class=\"ctr\"><strong>Độc lập - Tự do - Hạnh phúc</strong><span class=\"th\" data-t=\"เอกราช - เสรีภาพ - ความสุข\"></span></p><p class=\"ctr\">HỢP ĐỒNG THI CÔNG XÂY DỰNG – <em>MẪU KSP, PHIÊN BẢN KIỂM TRA PHÁP LÝ</em><span class=\"th\" data-t=\"สัญญาก่อสร้าง – แบบ KSP ฉบับตรวจสอบทางกฎหมาย\"></span></p><p class=\"ctr\">Số: <strong><span class=\"fx\" data-k=\"SỐ HỢP ĐỒNG\"></span></strong><span class=\"th\" data-t=\"เลขที่: 【SỐ HỢP ĐỒNG】\"></span></p><p class=\"ctr\">DỰ ÁN: <span class=\"fx\" data-k=\"TÊN DỰ ÁN / CHỦ ĐẦU TƯ CUỐI CÙNG\"></span><span class=\"th\" data-t=\"โครงการ: 【TÊN DỰ ÁN / CHỦ ĐẦU TƯ CUỐI CÙNG】\"></span></p><p class=\"ctr\">HẠNG MỤC: <span class=\"fx\" data-k=\"TÊN GÓI THẦU / HẠNG MỤC XÂY DỰNG\"></span><span class=\"th\" data-t=\"รายการงาน: 【TÊN GÓI THẦU / HẠNG MỤC XÂY DỰNG】\"></span></p><p class=\"ctr\"><strong>GIỮA</strong><span class=\"th\" data-t=\"ระหว่าง\"></span></p><p class=\"ctr\">CÔNG TY TNHH KSP VIỆT NAM <strong><span class=\"fx\" data-k=\"CHI NHÁNH / ĐƠN VỊ THỰC HIỆN\"></span></strong><span class=\"th\" data-t=\"บริษัท KSP เวียดนาม จำกัด (CÔNG TY TNHH KSP VIỆT NAM) 【CHI NHÁNH / ĐƠN VỊ THỰC HIỆN】\"></span></p><p class=\"ctr\"><strong> VÀ</strong><span class=\"th\" data-t=\"และ\"></span></p><p class=\"ctr\"><strong><span class=\"fx\" data-k=\"TÊN PHÁP LÝ NHÀ THẦU\"></span></strong></p><p class=\"ctr\"><strong>CỘNG HOÀ XÃ HỘI CHỦ NGHĨA VIỆT NAM</strong><span class=\"th\" data-t=\"สาธารณรัฐสังคมนิยมเวียดนาม\"></span></p><p class=\"ctr\"><strong>Độc lập - Tự do - Hạnh phúc</strong><span class=\"th\" data-t=\"เอกราช - เสรีภาพ - ความสุข\"></span></p><p class=\"ctr\">HỢP ĐỒNG THI CÔNG XÂY DỰNG<span class=\"th\" data-t=\"สัญญาก่อสร้าง\"></span></p><p class=\"ctr\">Số: <strong><span class=\"fx\" data-k=\"SỐ HỢP ĐỒNG\"></span></strong><span class=\"th\" data-t=\"เลขที่: 【SỐ HỢP ĐỒNG】\"></span></p><p class=\"ctr\">DỰ ÁN: <strong><span class=\"fx\" data-k=\"TÊN DỰ ÁN\"></span></strong><span class=\"th\" data-t=\"โครงการ: 【TÊN DỰ ÁN】\"></span></p><p class=\"ctr\">HẠNG MỤC: <strong><span class=\"fx\" data-k=\"PHẠM VI THI CÔNG XÂY DỰNG\"></span></strong><span class=\"th\" data-t=\"รายการงาน: 【PHẠM VI THI CÔNG XÂY DỰNG】\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Căn cứ Bộ luật Dân sự số 91/2015/QH13 ngày 24/11/2015 và các văn bản sửa đổi, bổ sung có liên quan;<span class=\"th\" data-t=\"อาศัยอำนาจตามประมวลกฎหมายแพ่ง ฉบับที่ 91/2015/QH13 ลงวันที่ 24/11/2015 และกฎหมายแก้ไข เพิ่มเติมที่เกี่ยวข้อง;\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Căn cứ Luật Xây dựng số 135/2025/QH15 có hiệu lực từ ngày 01/7/2026 và Nghị định số 210/2026/NĐ-CP về hợp đồng xây dựng trong phạm vi áp dụng;<span class=\"th\" data-t=\"อาศัยอำนาจตามกฎหมายว่าด้วยการก่อสร้าง ฉบับที่ 135/2025/QH15 ซึ่งมีผลใช้บังคับตั้งแต่วันที่ 01/7/2026 และพระราชกฤษฎีกา (Nghị định) ฉบับที่ 210/2026/NĐ-CP ว่าด้วยสัญญาก่อสร้างภายในขอบเขตที่ใช้บังคับ;\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Căn cứ Luật Thương mại số 36/2005/QH11 trong phạm vi điều chỉnh; quy định hiện hành về quản lý chất lượng, thi công xây dựng và bảo trì công trình;<span class=\"th\" data-t=\"อาศัยอำนาจตามกฎหมายว่าด้วยการพาณิชย์ ฉบับที่ 36/2005/QH11 ภายในขอบเขตที่กฎหมายนั้นกำกับดูแล; ระเบียบที่ใช้บังคับในปัจจุบันว่าด้วยการบริหารจัดการคุณภาพ การก่อสร้าง และการบำรุงรักษางานก่อสร้าง;\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Căn cứ hồ sơ mời thầu, bản vẽ, biện pháp thi công, yêu cầu kỹ thuật và các tiêu chuẩn được liệt kê tại Phụ lục 01; các điều kiện Back-to-Back tại Phụ lục 04;<span class=\"th\" data-t=\"อาศัยเอกสารเชิญชวนประกวดราคา แบบแปลน วิธีการก่อสร้าง ข้อกำหนดทางเทคนิค และมาตรฐานที่ระบุไว้ในภาคผนวก 01; เงื่อนไขแบบ Back-to-Back (ส่งต่อเงื่อนไขกับสัญญาหลัก) ในภาคผนวก 04;\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Căn cứ nhu cầu và khả năng của các bên.<span class=\"th\" data-t=\"อาศัยความต้องการและความสามารถของคู่สัญญา\"></span></p><p>Hôm nay, ngày <strong><span class=\"fx\" data-k=\"NGÀY\"></span></strong> tháng <strong><span class=\"fx\" data-k=\"THÁNG\"></span></strong> năm <strong><span class=\"fx\" data-k=\"NĂM\"></span></strong>, chúng tôi gồm có:<span class=\"th\" data-t=\"วันนี้ วันที่ 【NGÀY】 เดือน 【THÁNG】 ปี 【NĂM】 คู่สัญญาประกอบด้วย:\"></span></p><p>Bên A (Bên giao thầu): CÔNG TY TNHH KSP VIỆT NAM – <span class=\"fx\" data-k=\"ĐƠN VỊ/CHI NHÁNH THỰC HIỆN, NẾU CÓ\"></span><span class=\"th\" data-t=\"ฝ่าย A (ฝ่ายว่าจ้าง): บริษัท KSP เวียดนาม จำกัด (CÔNG TY TNHH KSP VIỆT NAM) – 【ĐƠN VỊ/CHI NHÁNH THỰC HIỆN, NẾU CÓ】\"></span></p><p>Đại diện: <strong><span class=\"fx\" data-k=\"HỌ TÊN NGƯỜI KÝ\"></span></strong>     Chức vụ: <strong><span class=\"fx\" data-k=\"CHỨC VỤ\"></span></strong>      Căn cứ thẩm quyền ký: <strong><span class=\"fx\" data-k=\"ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY\"></span></strong><span class=\"th\" data-t=\"ผู้แทน: 【HỌ TÊN NGƯỜI KÝ】 ตำแหน่ง: 【CHỨC VỤ】 ฐานอำนาจในการลงนาม: 【ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY】\"></span></p><p>Địa chỉ trụ sở / địa chỉ đơn vị thực hiện: <strong><span class=\"fx\" data-k=\"ĐỊA CHỈ PHÁP LÝ – KIỂM TRA ĐĂNG KÝ HIỆN HÀNH\"></span></strong><span class=\"th\" data-t=\"ที่อยู่สำนักงานใหญ่ / ที่อยู่หน่วยงานที่ดำเนินการ: 【ĐỊA CHỈ PHÁP LÝ – KIỂM TRA ĐĂNG KÝ HIỆN HÀNH】\"></span></p><p>Mã số thuế của pháp nhân: <strong><span class=\"fx\" data-k=\"MST\"></span></strong>; Mã số thuế chi nhánh (nếu áp dụng): <strong><span class=\"fx\" data-k=\"MST CHI NHÁNH\"></span></strong><span class=\"th\" data-t=\"เลขประจำตัวผู้เสียภาษีของนิติบุคคล: 【MST】; เลขประจำตัวผู้เสียภาษีของสาขา (ถ้ามี): 【MST CHI NHÁNH】\"></span></p><p>Số tài khoản thanh toán: <strong><span class=\"fx\" data-k=\"TÀI KHOẢN, NGÂN HÀNG KSP\"></span></strong><span class=\"th\" data-t=\"หมายเลขบัญชีสำหรับการชำระเงิน: 【TÀI KHOẢN, NGÂN HÀNG KSP】\"></span></p><p>Bên B (Bên nhận thầu): <span class=\"fx\" data-k=\"TÊN ĐẦY ĐỦ NHÀ THẦU\"></span><span class=\"th\" data-t=\"ฝ่าย B (ฝ่ายรับเหมา): 【TÊN ĐẦY ĐỦ NHÀ THẦU】\"></span></p><p>Đại diện: <strong><span class=\"fx\" data-k=\"HỌ TÊN\"></span></strong>     Chức vụ: <strong><span class=\"fx\" data-k=\"CHỨC VỤ\"></span></strong>      Căn cứ thẩm quyền ký: <strong><span class=\"fx\" data-k=\"THẨM QUYỀN / ỦY QUYỀN\"></span></strong><span class=\"th\" data-t=\"ผู้แทน: 【HỌ TÊN】 ตำแหน่ง: 【CHỨC VỤ】 ฐานอำนาจในการลงนาม: 【THẨM QUYỀN / ỦY QUYỀN】\"></span></p><p>Địa chỉ đăng ký: <strong><span class=\"fx\" data-k=\"ĐỊA CHỈ NHÀ THẦU\"></span></strong><span class=\"th\" data-t=\"ที่อยู่ตามที่จดทะเบียน: 【ĐỊA CHỈ NHÀ THẦU】\"></span></p><p>Mã số thuế/Mã số doanh nghiệp: <strong><span class=\"fx\" data-k=\"MST/GCN ĐKDN\"></span></strong><span class=\"th\" data-t=\"เลขประจำตัวผู้เสียภาษี/เลขทะเบียนวิสาหกิจ: 【MST/GCN ĐKDN】\"></span></p><p>Tài khoản: <strong><span class=\"fx\" data-k=\"SỐ TÀI KHOẢN / NGÂN HÀNG / CHỦ TÀI KHOẢN\"></span></strong><span class=\"th\" data-t=\"บัญชี: 【SỐ TÀI KHOẢN / NGÂN HÀNG / CHỦ TÀI KHOẢN】\"></span></p><p>Hai bên thỏa thuận ký hợp đồng với các nội dung sau:<span class=\"th\" data-t=\"คู่สัญญาทั้งสองฝ่ายตกลงทำสัญญาโดยมีข้อความดังต่อไปนี้:\"></span></p><h3 class=\"art\" data-n=\"1\">ĐIỀU 1. PHẠM VI CÔNG VIỆC<span class=\"th\" data-t=\"ข้อ 1 ขอบเขตงาน\"></span></h3><p class=\"lv1\"><span class=\"lb\">1.1</span>Bên A giao cho Bên B thực hiện <strong><span class=\"fx\" data-k=\"PHẠM VI XÂY DỰNG: NỀN MÓNG / KẾT CẤU / HẠ TẦNG / HOÀN THIỆN / HẠNG MỤC KHÁC\"></span></strong> tại Dự án <strong><span class=\"fx\" data-k=\"DỰ ÁN\"></span></strong> theo BOQ, bản vẽ, biện pháp thi công, yêu cầu kỹ thuật, tiêu chuẩn và tiến độ do Bên A phê duyệt tại các Phụ lục. Những hạng mục đặc thù (như kết cấu thép, tôn mái, điện, cơ khí) chỉ áp dụng nếu được liệt kê rõ trong Phụ lục 01. Hợp đồng này điều chỉnh công việc thi công xây dựng và vật tư phục vụ công việc xây dựng theo Phụ lục 01; không bao gồm hợp đồng mua bán, cung cấp và lắp đặt riêng máy móc/thiết bị công nghệ, trừ khi các Bên có phụ lục ghi nhận rõ phạm vi đó.<span class=\"th\" data-t=\"ฝ่าย A มอบหมายให้ฝ่าย B ดำเนินการ 【PHẠM VI XÂY DỰNG: NỀN MÓNG / KẾT CẤU / HẠ TẦNG / HOÀN THIỆN / HẠNG MỤC KHÁC】 ณ โครงการ 【DỰ ÁN】 ตาม BOQ แบบแปลน วิธีการก่อสร้าง ข้อกำหนดทางเทคนิค มาตรฐาน และกำหนดการที่ฝ่าย A อนุมัติตามภาคผนวกต่าง ๆ รายการงานเฉพาะทาง (เช่น โครงสร้างเหล็ก แผ่นหลังคา งานไฟฟ้า งานกลไก) ให้ใช้บังคับเฉพาะเมื่อมีการระบุไว้อย่างชัดเจนในภาคผนวก 01 สัญญานี้ใช้กำกับงานก่อสร้างและวัสดุสำหรับงานก่อสร้างตามภาคผนวก 01 ทั้งนี้ไม่รวมถึงสัญญาซื้อขาย จัดหา และติดตั้งเครื่องจักร/อุปกรณ์เทคโนโลยีโดยแยกต่างหาก เว้นแต่คู่สัญญามีภาคผนวกที่บันทึกขอบเขตดังกล่าวไว้อย่างชัดเจน\"></span></p><p class=\"lv1\"><span class=\"lb\">1.2</span>Phạm vi công việc của Bên B bao gồm nhưng không giới hạn các công việc cần thiết để hoàn thành đúng phạm vi, tiêu chuẩn kỹ thuật và yêu cầu nghiệm thu tại Phụ lục 01:<span class=\"th\" data-t=\"ขอบเขตงานของฝ่าย B ครอบคลุมแต่ไม่จำกัดเฉพาะงานที่จำเป็นเพื่อให้แล้วเสร็จถูกต้องตามขอบเขต มาตรฐานทางเทคนิค และข้อกำหนดการตรวจรับตามภาคผนวก 01:\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Tiếp nhận hồ sơ thiết kế, bản vẽ, yêu cầu kỹ thuật và các thông tin liên quan do Bên A cung cấp để triển khai thực hiện công việc.<span class=\"th\" data-t=\"รับแบบแปลน ข้อกำหนดทางเทคนิค และข้อมูลที่เกี่ยวข้องซึ่งฝ่าย A จัดให้ เพื่อดำเนินงาน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Tự tổ chức mua sắm, gia công, chế tạo vật tư, thiết bị, cấu kiện <strong><span class=\"fx\" data-k=\"NẾU THUỘC PHẠM VI BÊN B\"></span></strong> theo đúng hồ sơ thiết kế, yêu cầu kỹ thuật, chất lượng và tiến độ được Bên A phê duyệt.<span class=\"th\" data-t=\"จัดหา แปรรูป และผลิตวัสดุ อุปกรณ์ และชิ้นส่วนด้วยตนเอง 【NẾU THUỘC PHẠM VI BÊN B】 ให้ถูกต้องตามแบบแปลน ข้อกำหนดทางเทคนิค คุณภาพ และกำหนดการที่ฝ่าย A อนุมัติ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Cung cấp đầy đủ vật tư, nhân công, cán bộ kỹ thuật, tổ đội thi công, máy móc, thiết bị nâng hạ, phương tiện vận chuyển, dụng cụ thi công và các vật tư phụ cần thiết để thực hiện toàn bộ công việc.<span class=\"th\" data-t=\"จัดหาวัสดุ แรงงาน เจ้าหน้าที่เทคนิค ทีมงานก่อสร้าง เครื่องจักร เครื่องมือยก ยานพาหนะขนส่ง เครื่องมือก่อสร้าง และวัสดุประกอบที่จำเป็นให้ครบถ้วน เพื่อดำเนินงานทั้งหมด\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Thực hiện các công tác xây dựng, gia công cấu kiện xây dựng, thi công kết cấu, hoàn thiện và các hạng mục xây dựng khác <strong><span class=\"fx\" data-k=\"MÔ TẢ CHI TIẾT TẠI BOQ/PHỤ LỤC 01\"></span></strong> theo bản vẽ, yêu cầu kỹ thuật và biện pháp thi công được duyệt.<span class=\"th\" data-t=\"ดำเนินงานก่อสร้าง การแปรรูปชิ้นส่วนก่อสร้าง การก่อสร้างโครงสร้าง งานตกแต่งให้แล้วเสร็จ และรายการงานก่อสร้างอื่น ๆ 【MÔ TẢ CHI TIẾT TẠI BOQ/PHỤ LỤC 01】 ตามแบบแปลน ข้อกำหนดทางเทคนิค และวิธีการก่อสร้างที่ได้รับอนุมัติ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Vận chuyển, bốc xếp, tập kết, bảo quản vật tư, thiết bị, cấu kiện thuộc phạm vi Bên B đến khi nghiệm thu, bàn giao và chuyển giao rủi ro theo Hợp đồng.<span class=\"th\" data-t=\"ขนส่ง ขนถ่าย รวบรวม และเก็บรักษาวัสดุ อุปกรณ์ และชิ้นส่วนที่อยู่ในขอบเขตของฝ่าย B จนกว่าจะมีการตรวจรับ การส่งมอบ และการโอนความเสี่ยงตามสัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Thực hiện thi công các công tác xây dựng, thí nghiệm vật liệu, kiểm tra, nghiệm thu giai đoạn, nghiệm thu hoàn thành, sửa chữa tồn tại và bàn giao <strong><span class=\"fx\" data-k=\"HẠNG MỤC XÂY DỰNG CHI TIẾT\"></span></strong> tại công trường theo hồ sơ đã được phê duyệt.<span class=\"th\" data-t=\"ดำเนินงานก่อสร้าง ทดสอบวัสดุ ตรวจสอบ ตรวจรับเป็นงวด ตรวจรับเมื่อแล้วเสร็จ แก้ไขข้อบกพร่องที่ค้างอยู่ และส่งมอบ 【HẠNG MỤC XÂY DỰNG CHI TIẾT】 ณ หน่วยงานก่อสร้างตามเอกสารที่ได้รับอนุมัติ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Tự tổ chức thi công, bố trí đầy đủ nhân sự, máy móc, thiết bị và các nguồn lực cần thiết, đồng thời đảm bảo tiến độ thực hiện theo yêu cầu của Bên A.<span class=\"th\" data-t=\"จัดการก่อสร้างด้วยตนเอง จัดสรรบุคลากร เครื่องจักร อุปกรณ์ และทรัพยากรที่จำเป็นให้ครบถ้วน พร้อมทั้งรับรองกำหนดการตามที่ฝ่าย A กำหนด\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Thực hiện kiểm soát chất lượng vật tư, cấu kiện và chất lượng thi công xây dựng, kết cấu, hoàn thiện; chịu trách nhiệm đảm bảo toàn bộ công việc thuộc phạm vi Bên B phù hợp hồ sơ thiết kế, tiêu chuẩn kỹ thuật và yêu cầu của Hợp đồng.<span class=\"th\" data-t=\"ควบคุมคุณภาพของวัสดุ ชิ้นส่วน และคุณภาพงานก่อสร้าง โครงสร้าง และงานตกแต่ง; รับผิดชอบให้งานทั้งหมดในขอบเขตของฝ่าย B สอดคล้องกับแบบแปลน มาตรฐานทางเทคนิค และข้อกำหนดของสัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Thực hiện vệ sinh khu vực thi công xây dựng, thu gom, vận chuyển vật tư thừa, phế liệu và chất thải phát sinh trong phạm vi công việc của Bên B.<span class=\"th\" data-t=\"ทำความสะอาดพื้นที่ก่อสร้าง รวบรวมและขนย้ายวัสดุส่วนเกิน เศษวัสดุ และของเสียที่เกิดขึ้นภายในขอบเขตงานของฝ่าย B\"></span></p><p class=\"lv1\"><span class=\"lb\">1.3</span>Trách nhiệm đối với vật tư, cấu kiện và tài sản do Bên B cung cấp<span class=\"th\" data-t=\"ความรับผิดชอบต่อวัสดุ ชิ้นส่วน และทรัพย์สินที่ฝ่าย B จัดหา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B chịu trách nhiệm về vật tư, thiết bị, cấu kiện và tài sản thuộc phạm vi cung cấp, quản lý, sử dụng của Bên B đến khi được nghiệm thu, bàn giao, trừ mất mát do lỗi của Bên A hoặc rủi ro thuộc Bên A theo Hợp đồng.<span class=\"th\" data-t=\"ฝ่าย B รับผิดชอบต่อวัสดุ อุปกรณ์ ชิ้นส่วน และทรัพย์สินที่อยู่ในขอบเขตการจัดหา การดูแล และการใช้งานของฝ่าย B จนกว่าจะได้รับการตรวจรับและส่งมอบ เว้นแต่การสูญหายเกิดจากความผิดของฝ่าย A หรือความเสี่ยงที่เป็นของฝ่าย A ตามสัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B chịu trách nhiệm kiểm soát chất lượng từ khâu mua sắm vật tư, gia công, sản xuất, vận chuyển đến lắp đặt tại công trường.<span class=\"th\" data-t=\"ฝ่าย B รับผิดชอบการควบคุมคุณภาพตั้งแต่การจัดหาวัสดุ การแปรรูป การผลิต การขนส่ง จนถึงการติดตั้ง ณ หน่วยงานก่อสร้าง\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trường hợp xảy ra mất mát, thất thoát, hư hỏng hoặc sản phẩm/cấu kiện không phù hợp do lỗi của Bên B, Bên B phải tự chịu mọi chi phí sửa chữa, gia công lại, thay thế và bồi thường toàn bộ thiệt hại phát sinh cho Bên A.<span class=\"th\" data-t=\"ในกรณีที่เกิดการสูญหาย สูญเสีย ความเสียหาย หรือผลิตภัณฑ์/ชิ้นส่วนไม่เป็นไปตามข้อกำหนดเนื่องจากความผิดของฝ่าย B ฝ่าย B ต้องรับผิดชอบค่าใช้จ่ายในการซ่อมแซม แปรรูปใหม่ และเปลี่ยนทดแทนทั้งหมดด้วยตนเอง และชดใช้ค่าเสียหายทั้งหมดที่เกิดขึ้นแก่ฝ่าย A\"></span></p><p class=\"lv1\"><span class=\"lb\">1.4</span>Trách nhiệm về chất lượng, an toàn lao động và tổ chức thi công<span class=\"th\" data-t=\"ความรับผิดชอบด้านคุณภาพ ความปลอดภัยในการทำงาน และการจัดการก่อสร้าง\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B chịu trách nhiệm về chất lượng công tác xây dựng, thi công kết cấu, hoàn thiện, kiểm tra và thí nghiệm do mình thực hiện theo phạm vi Hợp đồng.<span class=\"th\" data-t=\"ฝ่าย B รับผิดชอบต่อคุณภาพของงานก่อสร้าง การก่อสร้างโครงสร้าง งานตกแต่ง การตรวจสอบและการทดสอบที่ตนดำเนินการตามขอบเขตของสัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B có trách nhiệm trang bị đầy đủ bảo hộ lao động, tổ chức huấn luyện an toàn lao động và thực hiện đầy đủ các biện pháp đảm bảo an toàn cho người lao động, thiết bị, máy móc và công trường trong suốt quá trình thực hiện công việc.<span class=\"th\" data-t=\"ฝ่าย B มีหน้าที่จัดหาอุปกรณ์ป้องกันส่วนบุคคลให้ครบถ้วน จัดอบรมความปลอดภัยในการทำงาน และดำเนินมาตรการรักษาความปลอดภัยแก่ผู้ปฏิบัติงาน อุปกรณ์ เครื่องจักร และหน่วยงานก่อสร้างอย่างครบถ้วนตลอดระยะเวลาการปฏิบัติงาน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B là đơn vị sử dụng lao động trực tiếp và hoàn toàn chịu trách nhiệm trước pháp luật đối với người lao động, nhân sự, máy móc, thiết bị do mình huy động.<span class=\"th\" data-t=\"ฝ่าย B เป็นนายจ้างโดยตรง และต้องรับผิดชอบต่อกฎหมายโดยสมบูรณ์ต่อผู้ปฏิบัติงาน บุคลากร เครื่องจักร และอุปกรณ์ที่ตนจัดหามา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B chịu trách nhiệm về mọi tai nạn lao động, sự cố kỹ thuật, thiệt hại về người hoặc tài sản phát sinh do lỗi của Bên B, nhân sự, nhà cung cấp hoặc đơn vị do Bên B huy động trong quá trình thực hiện công việc. Bên B có nghĩa vụ tự giải quyết và bồi thường toàn bộ thiệt hại phát sinh theo quy định của pháp luật và Hợp đồng.<span class=\"th\" data-t=\"ฝ่าย B รับผิดชอบต่ออุบัติเหตุจากการทำงาน เหตุขัดข้องทางเทคนิค ความเสียหายต่อบุคคลหรือทรัพย์สินทุกประการที่เกิดจากความผิดของฝ่าย B บุคลากร ผู้จัดหา หรือหน่วยงานที่ฝ่าย B จัดหามาในระหว่างการปฏิบัติงาน ฝ่าย B มีหน้าที่แก้ไขด้วยตนเองและชดใช้ค่าเสียหายทั้งหมดที่เกิดขึ้นตามบทบัญญัติของกฎหมายและสัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B phải tuân thủ đầy đủ các quy định về an toàn lao động, phòng cháy chữa cháy, vệ sinh môi trường, nội quy công trường và các yêu cầu quản lý thi công tại công trình.<span class=\"th\" data-t=\"ฝ่าย B ต้องปฏิบัติตามระเบียบว่าด้วยความปลอดภัยในการทำงาน การป้องกันและระงับอัคคีภัย สุขอนามัยด้านสิ่งแวดล้อม ข้อบังคับของหน่วยงานก่อสร้าง และข้อกำหนดการบริหารการก่อสร้าง ณ โครงการอย่างครบถ้วน\"></span></p><p class=\"lv1\"><span class=\"lb\">1.5</span>Bên B có trách nhiệm cung cấp đầy đủ, kịp thời các hồ sơ về vật tư, nhân sự, biện pháp thi công, bản vẽ gia công/shop drawing, hồ sơ chất lượng, hồ sơ an toàn lao động, hồ sơ máy móc thiết bị và các tài liệu liên quan khác theo yêu cầu của Bên A, Chủ đầu tư hoặc Ban quản lý công trường để phục vụ công tác đăng ký, phê duyệt, kiểm tra và quản lý thi công tại công trình.<span class=\"th\" data-t=\"ฝ่าย B มีหน้าที่จัดส่งเอกสารเกี่ยวกับวัสดุ บุคลากร วิธีการก่อสร้าง แบบแปลนการแปรรูป/shop drawing เอกสารด้านคุณภาพ เอกสารด้านความปลอดภัยในการทำงาน เอกสารเครื่องจักรอุปกรณ์ และเอกสารอื่นที่เกี่ยวข้องให้ครบถ้วนและทันเวลา ตามที่ฝ่าย A เจ้าของโครงการ หรือคณะผู้บริหารหน่วยงานก่อสร้างร้องขอ เพื่อใช้ในการลงทะเบียน อนุมัติ ตรวจสอบ และบริหารการก่อสร้าง ณ โครงการ\"></span></p><p>Trách nhiệm cung cấp vật tư chính, vật tư phụ, thiết bị, cẩu, giàn giáo, vận chuyển, bốc dỡ, kho bãi, điện, nước, thí nghiệm, giấy phép và xử lý phế thải của mỗi Bên, bao gồm chi phí và các phần loại trừ, được xác định tại Phụ lục 01. Bên B chỉ chịu trách nhiệm thiết kế đối với phần việc được giao rõ trong Hợp đồng hoặc Phụ lục 01; việc Bên A cung cấp hồ sơ thiết kế không làm phát sinh nghĩa vụ thiết kế của Bên B. <span class=\"th\" data-t=\"ความรับผิดชอบในการจัดหาวัสดุหลัก วัสดุประกอบ อุปกรณ์ เครน นั่งร้าน การขนส่ง การขนถ่าย คลังและพื้นที่เก็บของ ไฟฟ้า น้ำ การทดสอบ ใบอนุญาต และการกำจัดของเสียของแต่ละฝ่าย รวมทั้งค่าใช้จ่ายและส่วนที่ไม่รวมอยู่ ให้เป็นไปตามที่กำหนดในภาคผนวก 01 ฝ่าย B รับผิดชอบด้านการออกแบบเฉพาะงานที่ได้รับมอบหมายอย่างชัดเจนในสัญญาหรือภาคผนวก 01 เท่านั้น การที่ฝ่าย A จัดส่งเอกสารแบบแปลนให้ไม่ก่อให้เกิดหน้าที่ด้านการออกแบบแก่ฝ่าย B\"></span></p><h3 class=\"art\" data-n=\"2\">ĐIỀU 2. ĐỊA ĐIỂM VÀ THỜI GIAN THI CÔNG<span class=\"th\" data-t=\"ข้อ 2 สถานที่และระยะเวลาก่อสร้าง\"></span></h3><p>Địa điểm: <strong><span class=\"fx\" data-k=\"ĐỊA ĐIỂM CÔNG TRÌNH, KHU VỰC / NHÀ MÁY\"></span></strong><span class=\"th\" data-t=\"สถานที่: 【ĐỊA ĐIỂM CÔNG TRÌNH, KHU VỰC / NHÀ MÁY】\"></span></p><p class=\"lv1\"><span class=\"lb\">2.1</span>Thời gian thực hiện hợp đồng<span class=\"th\" data-t=\"ระยะเวลาการปฏิบัติตามสัญญา\"></span></p><p>Bên B thực hiện công tác chuẩn bị theo tiến độ được duyệt. Ngày bắt đầu thi công là ngày các điều kiện khởi công quy định tại Điều 2 được đáp ứng và được hai Bên xác nhận bằng biên bản hoặc lệnh khởi công. Thời hạn thi công được tính từ ngày bắt đầu thi công này.<span class=\"th\" data-t=\"ฝ่าย B ดำเนินการเตรียมงานตามกำหนดการที่ได้รับอนุมัติ วันเริ่มก่อสร้างคือวันที่เงื่อนไขการเริ่มงานตามที่กำหนดในข้อ 2 ครบถ้วน และคู่สัญญาทั้งสองฝ่ายยืนยันด้วยรายงานหรือคำสั่งเริ่มงาน ระยะเวลาก่อสร้างนับตั้งแต่วันเริ่มก่อสร้างนี้\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B phải hoàn thành công việc trong <span class=\"fx\" data-k=\"SỐ NGÀY\"></span> ngày <span class=\"fx\" data-k=\"LỊCH / LÀM VIỆC\"></span> kể từ khi đồng thời đáp ứng: (i) Hợp đồng có hiệu lực; (ii) Bên A bàn giao mặt bằng đủ điều kiện có biên bản; (iii) Bên B nhận tạm ứng hợp lệ (nếu có); và (iv) <span class=\"fx\" data-k=\"ĐIỀU KIỆN KHỞI CÔNG KHÁC\"></span>. Ngày bắt đầu và mốc tiến độ của từng giai đoạn ghi tại Phụ lục 03. Thời gian bao gồm các ngày nghỉ, lễ nếu chọn “ngày lịch” nhưng phải tuân thủ pháp luật lao động và nội quy nhà máy. <span class=\"th\" data-t=\"ฝ่าย B ต้องทำงานให้แล้วเสร็จภายใน 【SỐ NGÀY】 วัน 【LỊCH / LÀM VIỆC】 นับแต่เมื่อเงื่อนไขต่อไปนี้ครบถ้วนพร้อมกัน: (i) สัญญามีผลใช้บังคับ; (ii) ฝ่าย A ส่งมอบพื้นที่ก่อสร้างที่พร้อมใช้งานโดยมีรายงาน; (iii) ฝ่าย B ได้รับเงินล่วงหน้าโดยชอบ (ถ้ามี); และ (iv) 【ĐIỀU KIỆN KHỞI CÔNG KHÁC】 วันเริ่มต้นและหมุดหมายกำหนดการของแต่ละงวดระบุไว้ในภาคผนวก 03 ระยะเวลานับรวมวันหยุดและวันนักขัตฤกษ์หากเลือก “วันตามปฏิทิน” แต่ต้องปฏิบัติตามกฎหมายแรงงานและข้อบังคับของโรงงาน\"></span></p><p>Trường hợp tạm ngừng do lỗi của Bên A, yêu cầu của chủ đầu tư được Bên A xác nhận, thay đổi được phê duyệt hoặc sự kiện bất khả kháng theo Điều 16, Bên B phải thông báo trong (02) ngày làm việc từ khi biết sự kiện và gửi chứng cứ, phân tích tác động trong (05) ngày làm việc tiếp theo. Chỉ gia hạn phần thời gian ảnh hưởng thực tế đến mốc hoàn thành sau khi trừ thời gian có thể khắc phục bằng biện pháp hợp lý và phần chậm trễ do Bên B gây ra. Việc gia hạn không tự động làm phát sinh quyền được bù chi phí; chi phí chỉ được thanh toán theo Điều 20 hoặc quy định bắt buộc của pháp luật. Các nguyên nhân khác chỉ được xem xét khi có căn cứ cụ thể và được hai Bên xác nhận bằng văn bản. Trong thời gian chờ giải quyết, Bên B phải tiếp tục thực hiện các công việc không bị ảnh hưởng<span class=\"th\" data-t=\"ในกรณีที่หยุดงานชั่วคราวเนื่องจากความผิดของฝ่าย A ข้อเรียกร้องของเจ้าของโครงการที่ฝ่าย A ยืนยัน การเปลี่ยนแปลงที่ได้รับอนุมัติ หรือเหตุสุดวิสัยตามข้อ 16 ฝ่าย B ต้องแจ้งภายใน (02) วันทำการนับแต่ทราบเหตุการณ์ และส่งหลักฐานพร้อมการวิเคราะห์ผลกระทบภายใน (05) วันทำการถัดไป จะขยายเฉพาะระยะเวลาส่วนที่ส่งผลกระทบจริงต่อกำหนดแล้วเสร็จ หลังหักระยะเวลาที่สามารถแก้ไขได้ด้วยมาตรการที่สมเหตุสมผล และส่วนที่ล่าช้าเนื่องจากฝ่าย B การขยายระยะเวลาไม่ก่อให้เกิดสิทธิในการได้รับชดเชยค่าใช้จ่ายโดยอัตโนมัติ ค่าใช้จ่ายจะชำระตามข้อ 20 หรือบทบัญญัติบังคับของกฎหมายเท่านั้น เหตุอื่น ๆ จะพิจารณาเมื่อมีหลักฐานเฉพาะเจาะจงและคู่สัญญาทั้งสองฝ่ายยืนยันเป็นลายลักษณ์อักษร ในระหว่างรอการแก้ไขปัญหา ฝ่าย B ต้องดำเนินงานที่ไม่ได้รับผลกระทบต่อไป\"></span></p><h3 class=\"art\" data-n=\"3\"><strong>ĐIỀU 3. TIẾN ĐỘ THỰC HIỆN HỢP ĐỒNG</strong><span class=\"th\" data-t=\"ข้อ 3 กำหนดการปฏิบัติตามสัญญา\"></span></h3><p class=\"sub\"><strong>3.1 Lập và quản lý tiến độ</strong><span class=\"th\" data-t=\"3.1 การจัดทำและบริหารกำหนดการ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Trong vòng <strong><span class=\"fx\" data-k=\"03\"></span></strong> ngày làm việc kể từ ngày hợp đồng có hiệu lực, Bên B lập và trình Bên A phê duyệt tiến độ chi tiết phù hợp các mốc tại Phụ lục 03; thời hạn phải sớm hơn thời hạn báo cáo tương ứng theo hợp đồng chủ đầu tư đã chuyển giao (nếu có).<span class=\"th\" data-t=\"ภายใน 【03】 วันทำการนับแต่วันที่สัญญามีผลใช้บังคับ ฝ่าย B จัดทำและเสนอกำหนดการโดยละเอียดให้ฝ่าย A อนุมัติ ให้สอดคล้องกับหมุดหมายในภาคผนวก 03; กำหนดเวลาต้องเร็วกว่ากำหนดเวลารายงานที่เกี่ยวข้องตามสัญญาเจ้าของโครงการที่ส่งต่อมา (ถ้ามี)\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Tiến độ thi công chi tiết sau khi được Bên A chấp thuận là cơ sở để Bên A theo dõi, kiểm tra và đánh giá việc thực hiện Hợp đồng của Bên B. Việc Bên A xem xét hoặc chấp thuận tiến độ không làm giảm, miễn trừ hoặc chuyển giao bất kỳ trách nhiệm nào của Bên B đối với nghĩa vụ hoàn thành công việc đúng thời hạn theo Hợp đồng.<span class=\"th\" data-t=\"กำหนดการก่อสร้างโดยละเอียดที่ฝ่าย A เห็นชอบแล้ว เป็นฐานให้ฝ่าย A ติดตาม ตรวจสอบ และประเมินการปฏิบัติตามสัญญาของฝ่าย B การที่ฝ่าย A พิจารณาหรือเห็นชอบกำหนดการไม่ทำให้ความรับผิดชอบใด ๆ ของฝ่าย B ในหน้าที่ทำงานให้แล้วเสร็จตามกำหนดเวลาตามสัญญาลดลง หลุดพ้น หรือถูกโอนไป\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Trường hợp tiến độ thi công đã được phê duyệt không còn phù hợp với thực tế hoặc theo yêu cầu của Bên A, Bên B có trách nhiệm cập nhật, điều chỉnh và trình Bên A xem xét trong vòng 03 (ba) ngày kể từ ngày phát sinh yêu cầu hoặc sự kiện ảnh hưởng đến tiến độ.<span class=\"th\" data-t=\"ในกรณีที่กำหนดการก่อสร้างที่ได้รับอนุมัติไม่สอดคล้องกับสภาพความเป็นจริง หรือตามที่ฝ่าย A ร้องขอ ฝ่าย B มีหน้าที่ปรับปรุง แก้ไข และเสนอให้ฝ่าย A พิจารณาภายใน 03 (สาม) วันนับแต่วันที่เกิดข้อเรียกร้องหรือเหตุการณ์ที่ส่งผลกระทบต่อกำหนดการ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span> Mỗi bảng tiến độ thi công phải thể hiện tối thiểu các nội dung sau:<span class=\"th\" data-t=\"กำหนดการก่อสร้างแต่ละฉบับต้องแสดงเนื้อหาอย่างน้อยดังต่อไปนี้:\"></span></p><p class=\"lv0\"><span class=\"lb\">a)</span>Trình tự thực hiện các công việc, thời gian thực hiện từng hạng mục và các mốc hoàn thành chính;<span class=\"th\" data-t=\"ลำดับการดำเนินงาน ระยะเวลาดำเนินการของแต่ละรายการงาน และหมุดหมายการแล้วเสร็จหลัก;\"></span></p><p class=\"lv0\"><span class=\"lb\">b)</span>Kế hoạch huy động nhân sự, máy móc, thiết bị phục vụ thi công;<span class=\"th\" data-t=\"แผนการระดมบุคลากร เครื่องจักร และอุปกรณ์เพื่อการก่อสร้าง;\"></span></p><p class=\"lv0\"><span class=\"lb\">c)</span>Thời gian kiểm tra, nghiệm thu từng giai đoạn và nghiệm thu hoàn thành;<span class=\"th\" data-t=\"ระยะเวลาการตรวจสอบ การตรวจรับเป็นงวด และการตรวจรับเมื่อแล้วเสร็จ;\"></span></p><p class=\"lv0\"><span class=\"lb\">d)</span>Các mốc kiểm tra và nghiệm thu các giai đoạn, thử nghiệm, chạy thử và nghiệm thu hoàn thành;<span class=\"th\" data-t=\"หมุดหมายการตรวจสอบและตรวจรับในแต่ละงวด การทดสอบ การทดลองเดินระบบ และการตรวจรับเมื่อแล้วเสร็จ;\"></span></p><p class=\"lv0\"><span class=\"lb\">e)</span>Kế hoạch tăng cường nguồn lực và biện pháp khắc phục trong trường hợp có nguy cơ chậm tiến độ.<span class=\"th\" data-t=\"แผนเพิ่มทรัพยากรและมาตรการแก้ไขในกรณีที่มีความเสี่ยงล่าช้า\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B có trách nhiệm báo cáo tiến độ thực hiện công việc định kỳ hàng tuần hoặc bất kỳ thời điểm nào theo yêu cầu của Bên A.<span class=\"th\" data-t=\"ฝ่าย B มีหน้าที่รายงานความคืบหน้าของงานเป็นประจำทุกสัปดาห์ หรือเมื่อใดก็ตามที่ฝ่าย A ร้องขอ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B chỉ được điều chỉnh tiến độ chi tiết theo tuần hoặc theo tháng khi có văn bản chấp thuận trước của Bên A. Việc điều chỉnh tiến độ chi tiết không được làm ảnh hưởng đến các mốc tiến độ và thời hạn hoàn thành toàn bộ công việc theo Hợp đồng, trừ trường hợp được Bên A chấp thuận bằng văn bản.<span class=\"th\" data-t=\"ฝ่าย B จะปรับกำหนดการโดยละเอียดรายสัปดาห์หรือรายเดือนได้ต่อเมื่อได้รับความเห็นชอบเป็นลายลักษณ์อักษรจากฝ่าย A ล่วงหน้า การปรับกำหนดการโดยละเอียดต้องไม่กระทบต่อหมุดหมายกำหนดการและกำหนดแล้วเสร็จของงานทั้งหมดตามสัญญา เว้นแต่ฝ่าย A เห็นชอบเป็นลายลักษณ์อักษร\"></span></p><p class=\"sub\"><strong>3.2 Điều chỉnh thời gian thực hiện Hợp đồng</strong><span class=\"th\" data-t=\"3.2 การปรับระยะเวลาการปฏิบัติตามสัญญา\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Thời gian thực hiện Hợp đồng chỉ được xem xét điều chỉnh trong các trường hợp sau:<span class=\"th\" data-t=\"ระยะเวลาการปฏิบัติตามสัญญาจะพิจารณาปรับได้เฉพาะในกรณีดังต่อไปนี้:\"></span></p><p class=\"lv0\"><span class=\"lb\">a)</span>Xảy ra sự kiện bất khả kháng theo quy định của pháp luật mà Bên B đã áp dụng mọi biện pháp cần thiết và hợp lý để khắc phục nhưng vẫn không thể khắc phục được hậu quả;<span class=\"th\" data-t=\"เกิดเหตุสุดวิสัยตามที่กฎหมายกำหนด ซึ่งฝ่าย B ได้ใช้มาตรการที่จำเป็นและสมเหตุสมผลทั้งหมดเพื่อแก้ไขแล้ว แต่ยังไม่สามารถแก้ไขผลที่ตามมาได้;\"></span></p><p class=\"lv0\"><span class=\"lb\">b)</span>Bên A có văn bản yêu cầu thay đổi phạm vi công việc hoặc tạm dừng thực hiện công việc và việc thay đổi, tạm dừng đó ảnh hưởng trực tiếp đến tiến độ thực hiện Hợp đồng;<span class=\"th\" data-t=\"ฝ่าย A มีหนังสือขอเปลี่ยนแปลงขอบเขตงานหรือหยุดการปฏิบัติงานชั่วคราว และการเปลี่ยนแปลงหรือการหยุดนั้นส่งผลกระทบโดยตรงต่อกำหนดการปฏิบัติตามสัญญา;\"></span></p><p class=\"lv0\"><span class=\"lb\">c)</span>Bên A có văn bản yêu cầu tạm dừng thi công hoặc thay đổi thiết kế, biện pháp thi công làm ảnh hưởng trực tiếp đến tiến độ thực hiện công việc;<span class=\"th\" data-t=\"ฝ่าย A มีหนังสือขอหยุดการก่อสร้างชั่วคราวหรือเปลี่ยนแปลงแบบแปลน วิธีการก่อสร้าง ซึ่งส่งผลกระทบโดยตรงต่อกำหนดการปฏิบัติงาน;\"></span></p><p class=\"lv0\"><span class=\"lb\">d)</span>Bên A bàn giao mặt bằng không đúng thỏa thuận hoặc việc tạm dừng Hợp đồng do lỗi của Bên A và có ảnh hưởng trực tiếp đến tiến độ thực hiện công việc;<span class=\"th\" data-t=\"ฝ่าย A ส่งมอบพื้นที่ก่อสร้างไม่ตรงตามที่ตกลง หรือการหยุดสัญญาชั่วคราวเกิดจากความผิดของฝ่าย A และส่งผลกระทบโดยตรงต่อกำหนดการปฏิบัติงาน;\"></span></p><p class=\"lv0\"><span class=\"lb\">e)</span>Bên B phải thông báo trong <strong><span class=\"fx\" data-k=\"02\"></span></strong> ngày làm việc khi biết sự kiện ảnh hưởng tiến độ, nộp bằng chứng và phân tích tác động trong <strong><span class=\"fx\" data-k=\"05\"></span></strong> ngày làm việc tiếp theo. Việc thông báo chậm chỉ ảnh hưởng đến yêu cầu gia hạn trong phạm vi gây thiệt hại thực tế do thông báo chậm hoặc theo pháp luật.<span class=\"th\" data-t=\"ฝ่าย B ต้องแจ้งภายใน 【02】 วันทำการนับแต่ทราบเหตุการณ์ที่กระทบกำหนดการ ส่งหลักฐานและการวิเคราะห์ผลกระทบภายใน 【05】 วันทำการถัดไป การแจ้งล่าช้าส่งผลต่อข้อเรียกร้องขอขยายระยะเวลาเฉพาะในขอบเขตที่ก่อให้เกิดความเสียหายจริงจากการแจ้งล่าช้า หรือตามกฎหมาย\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Quá thời hạn thông báo quy định, Bên A được xem xét hậu quả của việc chậm thông báo để quyết định gia hạn dựa trên chứng cứ thực tế; không mặc nhiên coi Bên B từ bỏ mọi quyền yêu cầu nếu pháp luật quy định khác.<span class=\"th\" data-t=\"เมื่อพ้นกำหนดเวลาแจ้งที่กำหนด ฝ่าย A อาจพิจารณาผลของการแจ้งล่าช้าเพื่อตัดสินใจขยายระยะเวลาโดยอาศัยหลักฐานจริง; ไม่ถือโดยปริยายว่าฝ่าย B สละสิทธิเรียกร้องทั้งหมด หากกฎหมายบัญญัติไว้เป็นอย่างอื่น\"></span></p><p>Bên B phải tuân thủ thời hạn thông báo và cung cấp hồ sơ theo khoản này. Trường hợp thông báo quá hạn, Bên B phải giải trình lý do và cung cấp đầy đủ chứng cứ chứng minh sự kiện, thời gian ảnh hưởng thực tế đến mốc hoàn thành và các biện pháp giảm thiểu đã thực hiện. Bên A có quyền từ chối phần yêu cầu không đủ căn cứ hoặc không thể kiểm chứng do việc thông báo chậm. Việc thông báo hoặc nộp hồ sơ không tự động làm thay đổi tiến độ; mọi gia hạn phải được người có thẩm quyền của hai Bên xác nhận bằng văn bản, trừ trường hợp pháp luật bắt buộc quy định khác. Trong thời gian xem xét, Bên B phải tiếp tục thực hiện các công việc không bị ảnh hưởng<span class=\"th\" data-t=\"ฝ่าย B ต้องปฏิบัติตามกำหนดเวลาแจ้งและจัดส่งเอกสารตามวรรคนี้ ในกรณีที่แจ้งเกินกำหนด ฝ่าย B ต้องชี้แจงเหตุผลและจัดส่งหลักฐานครบถ้วนเพื่อพิสูจน์เหตุการณ์ ระยะเวลาที่ส่งผลกระทบจริงต่อกำหนดแล้วเสร็จ และมาตรการบรรเทาที่ได้ดำเนินการแล้ว ฝ่าย A มีสิทธิปฏิเสธส่วนของข้อเรียกร้องที่ไม่มีหลักฐานเพียงพอหรือไม่สามารถตรวจสอบได้เนื่องจากการแจ้งล่าช้า การแจ้งหรือการยื่นเอกสารไม่ทำให้กำหนดการเปลี่ยนแปลงโดยอัตโนมัติ การขยายระยะเวลาทุกครั้งต้องได้รับการยืนยันเป็นลายลักษณ์อักษรจากผู้มีอำนาจของคู่สัญญาทั้งสองฝ่าย เว้นแต่กฎหมายบังคับไว้เป็นอย่างอื่น ในระหว่างการพิจารณา ฝ่าย B ต้องดำเนินงานที่ไม่ได้รับผลกระทบต่อไป\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Tiến độ thực hiện Hợp đồng chỉ được điều chỉnh khi có văn bản chấp thuận của Bên A. Việc Bên B tự ý kéo dài thời gian thực hiện, tiếp tục thi công theo tiến độ riêng hoặc viện dẫn các sự kiện chưa được Bên A chấp thuận không được xem là căn cứ gia hạn tiến độ.<span class=\"th\" data-t=\"กำหนดการปฏิบัติตามสัญญาจะปรับได้ต่อเมื่อมีหนังสือเห็นชอบจากฝ่าย A การที่ฝ่าย B ขยายระยะเวลาปฏิบัติงานโดยพลการ ก่อสร้างต่อไปตามกำหนดการของตนเอง หรืออ้างเหตุการณ์ที่ฝ่าย A ยังไม่เห็นชอบ ไม่ถือเป็นเหตุขยายกำหนดการ\"></span></p><p class=\"sub\">3.3  Các trường hợp không được gia hạn tiến độ<span class=\"th\" data-t=\"3.3 กรณีที่ไม่ได้รับการขยายกำหนดการ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Các nguyên nhân thuộc trách nhiệm của Bên B, bao gồm nhưng không giới hạn: thiếu nhân công, thiếu cán bộ kỹ thuật, thiếu máy móc thiết bị, thiếu vật tư, khó khăn tài chính, sai sót trong quản lý và tổ chức thi công, năng lực huy động nguồn lực không đáp ứng yêu cầu, vi phạm an toàn lao động, vi phạm nội quy công trường, chậm trễ của nhà thầu phụ, nhà cung cấp hoặc bất kỳ bên thứ ba nào do Bên B thuê hoặc lựa chọn, không được xem là căn cứ để gia hạn hoặc điều chỉnh tiến độ.<span class=\"th\" data-t=\"เหตุที่เป็นความรับผิดชอบของฝ่าย B ซึ่งรวมถึงแต่ไม่จำกัดเฉพาะ: การขาดแคลนแรงงาน เจ้าหน้าที่เทคนิค เครื่องจักรอุปกรณ์ วัสดุ ปัญหาทางการเงิน ข้อผิดพลาดในการบริหารและจัดการก่อสร้าง ความสามารถในการระดมทรัพยากรไม่เป็นไปตามข้อกำหนด การฝ่าฝืนความปลอดภัยในการทำงาน การฝ่าฝืนข้อบังคับของหน่วยงานก่อสร้าง ความล่าช้าของผู้รับเหมาช่วง ผู้ขาย หรือบุคคลที่สามใด ๆ ที่ฝ่าย B ว่าจ้างหรือคัดเลือก ไม่ถือเป็นเหตุในการขยายหรือปรับกำหนดการ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Việc Bên A xem xét hoặc chấp thuận điều chỉnh tiến độ (nếu có) không làm miễn trừ trách nhiệm của Bên B đối với các thiệt hại, chi phí phát sinh hoặc các nghĩa vụ khác theo Hợp đồng.<span class=\"th\" data-t=\"การที่ฝ่าย A พิจารณาหรือเห็นชอบการปรับกำหนดการ (ถ้ามี) ไม่ทำให้ฝ่าย B หลุดพ้นจากความรับผิดต่อความเสียหาย ค่าใช้จ่ายที่เกิดขึ้น หรือหน้าที่อื่นตามสัญญา\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Các nội dung liên quan đến việc điều chỉnh tiến độ cần được Bên B ghi nhận đầy đủ vào Nhật ký công trình để làm cơ sở xem xét.<span class=\"th\" data-t=\"เนื้อหาที่เกี่ยวข้องกับการปรับกำหนดการ ฝ่าย B ต้องบันทึกให้ครบถ้วนในสมุดบันทึกงานก่อสร้าง (Nhật ký công trình) เพื่อเป็นฐานในการพิจารณา\"></span></p><p class=\"sub\">3.4 Xử lý trường hợp Bên B chậm tiến độ<span class=\"th\" data-t=\"3.4 การจัดการกรณีฝ่าย B ล่าช้า\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Trong trường hợp Bên B chậm tiến độ hoặc có nguy cơ không hoàn thành công việc theo tiến độ cam kết, Bên A có quyền:<span class=\"th\" data-t=\"ในกรณีที่ฝ่าย B ล่าช้าหรือมีความเสี่ยงที่จะไม่แล้วเสร็จตามกำหนดการที่ให้คำมั่น ฝ่าย A มีสิทธิ:\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Yêu cầu Bên B lập và thực hiện ngay kế hoạch khắc phục tiến độ, bao gồm việc bổ sung nhân lực, máy móc, thiết bị, tăng ca, làm thêm giờ và áp dụng các biện pháp cần thiết khác nhằm đảm bảo tiến độ thực hiện Hợp đồng. Mọi chi phí phát sinh do Bên B tự chịu.<span class=\"th\" data-t=\"เรียกให้ฝ่าย B จัดทำและดำเนินแผนแก้ไขกำหนดการทันที ซึ่งรวมถึงการเพิ่มบุคลากร เครื่องจักร อุปกรณ์ การทำงานล่วงเวลา การทำงานเพิ่มชั่วโมง และมาตรการจำเป็นอื่น ๆ เพื่อรับรองกำหนดการปฏิบัติตามสัญญา ค่าใช้จ่ายที่เกิดขึ้นทั้งหมดฝ่าย B เป็นผู้รับผิดชอบเอง\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Yêu cầu Bên B thay thế nhân sự quản lý, cán bộ kỹ thuật, tổ đội thi công hoặc các nguồn lực khác không đáp ứng yêu cầu về năng lực, chất lượng hoặc tiến độ.<span class=\"th\" data-t=\"เรียกให้ฝ่าย B เปลี่ยนตัวบุคลากรบริหาร เจ้าหน้าที่เทคนิค ทีมงานก่อสร้าง หรือทรัพยากรอื่นที่ไม่ตรงตามข้อกำหนดด้านความสามารถ คุณภาพ หรือกำหนดการ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên A chỉ được tạm giữ khoản thanh toán tương ứng trực tiếp với phần công việc đang bị tranh chấp, chưa nghiệm thu hoặc khoản khấu trừ có căn cứ, và phải thông báo số tiền, căn cứ cho Bên B; khoản không tranh chấp tiếp tục thanh toán đúng hạn.<span class=\"th\" data-t=\"ฝ่าย A กักไว้ได้เฉพาะเงินชำระที่สัมพันธ์โดยตรงกับงานส่วนที่อยู่ระหว่างพิพาท ยังไม่ได้ตรวจรับ หรือเงินที่หักโดยมีมูลเหตุ และต้องแจ้งจำนวนเงินและมูลเหตุแก่ฝ่าย B; เงินส่วนที่ไม่มีข้อพิพาทให้ชำระต่อไปตามกำหนด\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên A có quyền tự mình hoặc thuê đơn vị khác thực hiện một phần hoặc toàn bộ khối lượng công việc mà Bên B chậm thực hiện, không đáp ứng tiến độ hoặc không có khả năng thực hiện nhằm đảm bảo tiến độ chung của công trình:<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิดำเนินการเองหรือว่าจ้างหน่วยงานอื่นดำเนินงานปริมาณงานบางส่วนหรือทั้งหมดที่ฝ่าย B ดำเนินการล่าช้า ไม่เป็นไปตามกำหนดการ หรือไม่มีความสามารถดำเนินการ เพื่อรับรองกำหนดการโดยรวมของงานก่อสร้าง:\"></span></p><p class=\"lv0\"><span class=\"lb\">i)</span>Bên B chịu chi phí thực tế, hợp lý và có chứng từ của việc thuê đơn vị thay thế cho phần công việc mà Bên B vi phạm, gồm chênh lệch giá hợp lý và chi phí khắc phục do lỗi Bên B; không tính trùng với cùng khoản thiệt hại đã bồi thường.<span class=\"th\" data-t=\"ฝ่าย B รับผิดชอบค่าใช้จ่ายจริง ที่สมเหตุสมผล และมีเอกสารหลักฐาน ในการว่าจ้างหน่วยงานทดแทนสำหรับงานส่วนที่ฝ่าย B ผิดสัญญา ซึ่งรวมถึงส่วนต่างของราคาที่สมเหตุสมผลและค่าใช้จ่ายในการแก้ไขอันเกิดจากความผิดของฝ่าย B; ไม่คิดซ้ำกับความเสียหายรายการเดียวกันที่ได้ชดใช้แล้ว\"></span></p><p class=\"lv0\"><span class=\"lb\">ii)</span>Bên A có quyền bù trừ các khoản phải thu đã được xác định hợp lệ vào khoản tiền đến hạn trả Bên B sau khi có thông báo và chứng từ phù hợp. Phần còn thiếu Bên B hoàn trả trong <strong><span class=\"fx\" data-k=\"07\"></span></strong> ngày làm việc kể từ ngày nhận yêu cầu hợp lệ; các khoản đang tranh chấp giải quyết theo Điều 19.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิหักกลบหนี้ลูกหนี้ที่ได้รับการกำหนดโดยชอบแล้วกับเงินที่ถึงกำหนดชำระแก่ฝ่าย B หลังจากมีหนังสือแจ้งและเอกสารหลักฐานที่เหมาะสม ส่วนที่ขาด ฝ่าย B ต้องคืนภายใน 【07】 วันทำการนับแต่วันที่ได้รับการเรียกร้องโดยชอบ; รายการที่อยู่ระหว่างพิพาทให้ระงับตามข้อ 19\"></span></p><p class=\"lv0\"><span class=\"lb\">iii)</span>Khối lượng thuê thay thế và chi phí phát sinh phải được lập biên bản tại hiện trường, có tài liệu kỹ thuật, báo giá và chứng từ hợp lý. Bên B được mời tham gia xác nhận; việc Bên B không tham gia sau khi được thông báo hợp lệ không ngăn Bên A ghi nhận bằng chứng độc lập.<span class=\"th\" data-t=\"ปริมาณงานที่ว่าจ้างทดแทนและค่าใช้จ่ายที่เกิดขึ้นต้องจัดทำรายงาน ณ สถานที่ มีเอกสารทางเทคนิค ใบเสนอราคา และเอกสารหลักฐานที่สมเหตุสมผล ฝ่าย B ได้รับเชิญเข้าร่วมยืนยัน; การที่ฝ่าย B ไม่เข้าร่วมภายหลังได้รับแจ้งโดยชอบ ไม่เป็นอุปสรรคต่อฝ่าย A ในการบันทึกหลักฐานอย่างเป็นอิสระ\"></span></p><p class=\"lv0\"><span class=\"lb\">iv)</span>Bên B có quyền phản hồi, đối chiếu và khiếu nại khoản khấu trừ theo trình tự giải quyết tranh chấp tại Điều 19, nhưng phải tiếp tục thực hiện các nghĩa vụ không tranh chấp.<span class=\"th\" data-t=\"ฝ่าย B มีสิทธิชี้แจง ตรวจทานเทียบเคียง และโต้แย้งรายการที่ถูกหักตามขั้นตอนระงับข้อพิพาทในข้อ 19 แต่ต้องดำเนินหน้าที่ที่ไม่มีข้อพิพาทต่อไป\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Áp dụng các khoản phạt vi phạm, bồi thường thiệt hại và các chế tài khác theo quy định của Hợp đồng và pháp luật hiện hành.<span class=\"th\" data-t=\"ให้ใช้ค่าปรับตามสัญญา การชดใช้ค่าเสียหาย และมาตรการบังคับอื่น ๆ ตามที่กำหนดในสัญญาและกฎหมายที่มีผลใช้บังคับ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên A có quyền yêu cầu Bên B tăng cường nhân công và làm thêm giờ để đảm bảo tiến độ đã cam kết. Trong trường hợp này, Bên A không phải thanh toán thêm bất kỳ chi phí nào phát sinh do việc tăng nhân công hoặc làm thêm giờ.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิเรียกให้ฝ่าย B เพิ่มแรงงานและทำงานล่วงเวลาเพื่อให้เป็นไปตามกำหนดการที่ได้ให้คำมั่นไว้ ในกรณีนี้ ฝ่าย A ไม่ต้องชำระค่าใช้จ่ายเพิ่มเติมใด ๆ ที่เกิดขึ้นจากการเพิ่มแรงงานหรือการทำงานล่วงเวลา\"></span></p><h3 class=\"art\" data-n=\"4\">ĐIỀU 4. HÌNH THỨC VÀ GIÁ TRỊ HỢP ĐỒNG<span class=\"th\" data-t=\"ข้อ 4 รูปแบบและมูลค่าของสัญญา\"></span></h3><p class=\"sub\">4.1 Hình thức hợp đồng<span class=\"th\" data-t=\"4.1 รูปแบบของสัญญา\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Hình thức hợp đồng: <strong><span class=\"fx\" data-k=\"ĐƠN GIÁ CỐ ĐỊNH / TRỌN GÓI / ĐƠN GIÁ ĐIỀU CHỈNH\"></span></strong>. Trường hợp đơn giá cố định, giá thanh toán được tính theo khối lượng thực tế được nghiệm thu nhân với đơn giá cố định trong BOQ; giá chỉ thay đổi theo Điều 20 và các trường hợp pháp luật bắt buộc. Không đồng thời ghi giá trọn gói và quyết toán khối lượng thực tế nếu không tách phạm vi riêng.<span class=\"th\" data-t=\"รูปแบบของสัญญา: 【ĐƠN GIÁ CỐ ĐỊNH / TRỌN GÓI / ĐƠN GIÁ ĐIỀU CHỈNH】 ในกรณีราคาต่อหน่วยคงที่ ราคาที่ชำระคำนวณจากปริมาณงานจริงที่ได้รับการตรวจรับคูณด้วยราคาต่อหน่วยคงที่ใน BOQ โดยราคาจะเปลี่ยนแปลงได้เฉพาะตามข้อ 20 และกรณีที่กฎหมายบังคับเท่านั้น ห้ามระบุราคาเหมารวม (Lump sum) พร้อมกับการชำระตามปริมาณงานจริงในเวลาเดียวกัน เว้นแต่จะแยกขอบเขตงานไว้ต่างหาก\"></span></p><p>Bên B xác nhận đã kiểm tra hồ sơ được cung cấp, khảo sát các điều kiện hiện trường có thể tiếp cận hợp lý và tính đủ chi phí thực hiện phạm vi công việc trước khi ký Hợp đồng. Biến động giá thông thường, thiếu nhân lực, thiết bị, vật tư và các điều kiện có thể nhận biết qua khảo sát hợp lý thuộc trách nhiệm Bên B, không là căn cứ yêu cầu tăng đơn giá hoặc gia hạn.<span class=\"th\" data-t=\"ผู้รับเหมา (ฝ่าย B) ยืนยันว่าได้ตรวจสอบเอกสารที่ได้รับมอบ สำรวจสภาพหน้างานเท่าที่สามารถเข้าถึงได้อย่างสมเหตุสมผล และได้คำนวณค่าใช้จ่ายในการดำเนินงานตามขอบเขตงานครบถ้วนแล้วก่อนลงนามในสัญญา ความผันผวนของราคาตามปกติ การขาดแคลนแรงงาน เครื่องจักร วัสดุ และสภาพการณ์ที่สามารถรับรู้ได้จากการสำรวจตามสมควร เป็นความรับผิดชอบของฝ่าย B และไม่ใช่เหตุที่จะเรียกร้องให้เพิ่มราคาต่อหน่วยหรือขยายระยะเวลา\"></span></p><p>Khi phát hiện điều kiện hiện trường khác biệt đáng kể mà không thể phát hiện bằng khảo sát hợp lý hoặc từ hồ sơ được cung cấp, Bên B phải thông báo bằng văn bản trong 02 ngày làm việc, bảo vệ hiện trường và cung cấp chứng cứ để Bên A kiểm tra trước khi xử lý, trừ tình huống khẩn cấp theo Điều 20. Việc thông báo không tự động làm phát sinh quyền điều chỉnh giá hoặc tiến độ. Mọi điều chỉnh phải xác định rõ nguyên nhân, trách nhiệm, ảnh hưởng thực tế và được người có thẩm quyền của hai Bên phê duyệt bằng phụ lục, trừ trường hợp pháp luật bắt buộc quy định khác. Bên B tiếp tục thực hiện các công việc không bị ảnh hưởng<span class=\"th\" data-t=\"เมื่อพบสภาพหน้างานที่แตกต่างอย่างมีนัยสำคัญซึ่งไม่อาจตรวจพบได้จากการสำรวจตามสมควรหรือจากเอกสารที่ได้รับมอบ ฝ่าย B ต้องแจ้งเป็นหนังสือภายใน 02 วันทำการ รักษาสภาพหน้างาน และจัดหาพยานหลักฐานเพื่อให้ฝ่าย A ตรวจสอบก่อนดำเนินการแก้ไข เว้นแต่เป็นกรณีฉุกเฉินตามข้อ 20 การแจ้งดังกล่าวไม่ก่อให้เกิดสิทธิในการปรับราคาหรือกำหนดการโดยอัตโนมัติ การปรับเปลี่ยนทุกกรณีต้องระบุสาเหตุ ความรับผิดชอบ และผลกระทบที่เกิดขึ้นจริงอย่างชัดเจน และต้องได้รับการอนุมัติจากผู้มีอำนาจของทั้งสองฝ่ายโดยทำเป็นภาคผนวก เว้นแต่กฎหมายบังคับไว้เป็นอย่างอื่น ฝ่าย B ต้องดำเนินงานส่วนที่ไม่ได้รับผลกระทบต่อไป\"></span></p><p class=\"lv1\"><span class=\"lb\">4.2</span>Giá trị hợp đồng (Chi tiết Phụ lục 01):<span class=\"th\" data-t=\"มูลค่าสัญญา (รายละเอียดตามภาคผนวก 01):\"></span></p><p>- Tổng giá trị trước thuế: <strong><span class=\"fx\" data-k=\"SỐ TIỀN\"></span></strong> VNĐ<span class=\"th\" data-t=\"- มูลค่ารวมก่อนภาษี: 【SỐ TIỀN】 ดง (VNĐ)\"></span></p><p>- Thuế GTGT (VAT) <strong><span class=\"fx\" data-k=\"THUẾ SUẤT %\"></span></strong>%: <strong><span class=\"fx\" data-k=\"SỐ TIỀN\"></span></strong> VNĐ<span class=\"th\" data-t=\"- ภาษีมูลค่าเพิ่ม (VAT) 【THUẾ SUẤT %】 %: 【SỐ TIỀN】 ดง (VNĐ)\"></span></p><p>- Tổng giá trị gồm thuế: <strong><span class=\"fx\" data-k=\"SỐ TIỀN\"></span></strong> VNĐ<span class=\"th\" data-t=\"- มูลค่ารวมรวมภาษี: 【SỐ TIỀN】 ดง (VNĐ)\"></span></p><p>(Bằng chữ: <strong><span class=\"fx\" data-k=\"SỐ TIỀN BẰNG CHỮ\"></span></strong>)<span class=\"th\" data-t=\"(ตัวอักษร: 【SỐ TIỀN BẰNG CHỮ】)\"></span></p><p class=\"sub\">4.3  Giá trị hợp đồng đã bao gồm toàn bộ chi phí để Bên B thực hiện đầy đủ công việc, gồm: chi phí nhân công thi công, chi phí máy móc thiết bị phục vụ thi công (kể cả nhiên liệu, vận hành, khấu hao, sửa chữa trong suốt thời gian thi công), chi phí lán trại, kho bãi, sinh hoạt công nhân, chi phí quản lý, bảo hộ lao động, an toàn, vệ sinh môi trường và các chi phí liên quan khác. Mọi chi phí phát sinh phục vụ cho việc thi công hoàn thành đúng thiết kế, tiến độ, chất lượng và an toàn đều do Bên B tự chịu, trừ những hạng mục được Bên A cấp phát hoặc được Bên A phê duyệt bằng văn bản. Bên B chỉ được yêu cầu thanh toán bổ sung khi có sửa đổi được phê duyệt hợp lệ theo Điều 20 hoặc căn cứ bắt buộc của pháp luật.<span class=\"th\" data-t=\"4.3 มูลค่าสัญญารวมค่าใช้จ่ายทั้งหมดที่ฝ่าย B ต้องใช้ในการดำเนินงานให้ครบถ้วน ซึ่งประกอบด้วย ค่าแรงงานก่อสร้าง ค่าเครื่องจักรและอุปกรณ์สำหรับการก่อสร้าง (รวมถึงเชื้อเพลิง การเดินเครื่อง ค่าเสื่อมราคา และการซ่อมแซมตลอดระยะเวลาก่อสร้าง) ค่าโรงเรือนชั่วคราว คลังและลานเก็บของ ค่าที่พักอาศัยของคนงาน ค่าบริหารจัดการ ค่าอุปกรณ์ป้องกันภัยส่วนบุคคล ความปลอดภัย สุขอนามัยและสิ่งแวดล้อม และค่าใช้จ่ายอื่นที่เกี่ยวข้อง ค่าใช้จ่ายทุกประเภทที่เกิดขึ้นเพื่อการก่อสร้างให้แล้วเสร็จตามแบบ กำหนดการ คุณภาพ และความปลอดภัย เป็นภาระของฝ่าย B เอง เว้นแต่รายการที่ฝ่าย A เป็นผู้จัดหาให้หรือฝ่าย A อนุมัติเป็นหนังสือ ฝ่าย B มีสิทธิเรียกร้องการชำระเงินเพิ่มเติมได้เฉพาะเมื่อมีการแก้ไขเปลี่ยนแปลงที่ได้รับอนุมัติโดยชอบตามข้อ 20 หรือมีเหตุที่กฎหมายบังคับ\"></span></p><p>4.4. Thuế GTGT tính theo pháp luật tại thời điểm lập hóa đơn; mọi thay đổi thuế suất được xử lý theo pháp luật và không được mặc nhiên coi là thay đổi đơn giá trước thuế.<span class=\"th\" data-t=\"4.4. ภาษีมูลค่าเพิ่มคำนวณตามกฎหมายณ เวลาที่ออกใบกำกับภาษี การเปลี่ยนแปลงอัตราภาษีใด ๆ ให้ดำเนินการตามกฎหมาย และจะไม่ถือโดยปริยายว่าเป็นการเปลี่ยนแปลงราคาต่อหน่วยก่อนภาษี\"></span></p><h3 class=\"art\" data-n=\"5\">ĐIỀU 5. TẠM ỨNG, THANH TOÁN HỢP ĐỒNG<span class=\"th\" data-t=\"ข้อ 5 เงินล่วงหน้าและการชำระเงินตามสัญญา\"></span></h3><p class=\"lv0 bl\"><span class=\"lb\">•</span>Đợt 1 – TẠM ỨNG: Bên A tạm ứng <span class=\"fx\" data-k=\"TỶ LỆ TẠM ỨNG\"></span>% của <span class=\"fx\" data-k=\"GIÁ TRƯỚC VAT / GIÁ SAU VAT – CHỌN MỘT\"></span>, tương ứng <span class=\"fx\" data-k=\"SỐ TIỀN\"></span> VNĐ trong vòng <span class=\"fx\" data-k=\"03\"></span> ngày làm việc kể từ ngày sau cùng của: (i) Hợp đồng có hiệu lực; (ii) Bên A nhận đủ hồ sơ tạm ứng hợp lệ;<span class=\"th\" data-t=\"งวดที่ 1 – เงินล่วงหน้า: ฝ่าย A จ่ายเงินล่วงหน้า 【TỶ LỆ TẠM ỨNG】 % ของ 【GIÁ TRƯỚC VAT / GIÁ SAU VAT – CHỌN MỘT】 คิดเป็นเงิน 【SỐ TIỀN】 ดง (VNĐ) ภายใน 【03】 วันทำการ นับจากวันที่เกิดขึ้นภายหลังสุดของเหตุการณ์ต่อไปนี้: (i) สัญญามีผลใช้บังคับ (ii) ฝ่าย A ได้รับเอกสารขอรับเงินล่วงหน้าที่ถูกต้องครบถ้วน\"></span></p><p>(iii) Bên B nộp bảo lãnh thực hiện theo Điều 21.1 và bảo lãnh hoàn trả tạm ứng hợp lệ. Hồ sơ gồm:<span class=\"th\" data-t=\"(iii) ฝ่าย B ส่งมอบหนังสือค้ำประกันการปฏิบัติตามสัญญาตามข้อ 21.1 และหนังสือค้ำประกันการคืนเงินล่วงหน้าที่ถูกต้อง เอกสารประกอบด้วย:\"></span></p><p>+ Thư đề nghị tạm ứng theo mẫu KSP có chữ ký hợp lệ, xác định số tiền, tài khoản và dự án;<span class=\"th\" data-t=\"+ หนังสือขอรับเงินล่วงหน้าตามแบบของ KSP ที่มีลายมือชื่อถูกต้อง ระบุจำนวนเงิน บัญชี และโครงการ\"></span></p><p>+ Hợp đồng, phụ lục/BOQ đã ký và giấy tờ xác nhận thẩm quyền người ký (nếu cần);<span class=\"th\" data-t=\"+ สัญญา ภาคผนวก/BOQ ที่ลงนามแล้ว และเอกสารยืนยันอำนาจของผู้ลงนาม (หากจำเป็น)\"></span></p><p>+ Bản gốc bảo lãnh hoàn trả tạm ứng do ngân hàng được Bên A chấp thuận phát hành, giá trị ít nhất 100% khoản tạm ứng; bảo lãnh không hủy ngang, có hiệu lực từ khi Bên A thực hiện giải ngân cho đến khi khoản tạm ứng được thu hồi hết và thêm <span class=\"fx\" data-k=\"30\"></span> ngày dự phòng; Bên B phải gia hạn trước khi bảo lãnh hết hạn nếu tạm ứng chưa thu hồi đủ. Không áp dụng cơ chế hết hạn vào ngày đến trước. <span class=\"th\" data-t=\"+ ต้นฉบับหนังสือค้ำประกันการคืนเงินล่วงหน้าที่ออกโดยธนาคารซึ่งฝ่าย A ยอมรับ มูลค่าอย่างน้อย 100% ของเงินล่วงหน้า เป็นหนังสือค้ำประกันที่เพิกถอนไม่ได้ มีผลตั้งแต่ฝ่าย A โอนเงินจนกว่าเงินล่วงหน้าจะถูกเรียกคืนครบถ้วน และเพิ่มอีก 【30】 วันเป็นระยะเผื่อ ฝ่าย B ต้องต่ออายุก่อนหนังสือค้ำประกันสิ้นอายุหากเงินล่วงหน้ายังไม่ได้รับการเรียกคืนครบ ไม่ใช้กลไกที่ให้สิ้นอายุในวันที่มาถึงก่อน\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Đợt 2 – NGHIỆM THU KHỐI LƯỢNG XÂY DỰNG GIAI ĐOẠN 1: Sau khi Bên B hoàn thành <strong><span class=\"fx\" data-k=\"MỐC CÔNG VIỆC XÂY DỰNG 1\"></span></strong> theo BOQ, Phụ lục 03 và được Bên A nghiệm thu tại công trường.<span class=\"th\" data-t=\"งวดที่ 2 – การตรวจรับปริมาณงานก่อสร้างระยะที่ 1: เมื่อฝ่าย B ทำ 【MỐC CÔNG VIỆC XÂY DỰNG 1】 แล้วเสร็จตาม BOQ ภาคผนวก 03 และฝ่าย A ตรวจรับ ณ หน่วยงานก่อสร้างแล้ว\"></span></p><p>Bên A thanh toán (90)% giá trị khối lượng xây dựng RIÊNG của Đợt 2 được nghiệm thu hợp lệ, trừ khoản thu hồi tạm ứng tại Phụ lục 03 và các khoản khấu trừ hợp lệ. Thời hạn thanh toán là (07) ngày làm việc kể từ khi nghiệm thu và Bên A nhận đủ hồ sơ thanh toán hợp lệ. Hồ sơ gồm:<span class=\"th\" data-t=\"ฝ่าย A ชำระ (90)% ของมูลค่าปริมาณงานก่อสร้างเฉพาะของงวดที่ 2 ที่ได้รับการตรวจรับโดยชอบ หักด้วยการเรียกคืนเงินล่วงหน้าตามภาคผนวก 03 และรายการหักที่ชอบด้วยกฎหมาย กำหนดชำระภายใน (07) วันทำการ นับจากวันตรวจรับและฝ่าย A ได้รับเอกสารขอรับชำระเงินที่ถูกต้องครบถ้วน เอกสารประกอบด้วย:\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Thư đề nghị thanh toán của Bên B, bảng kê giá trị khối lượng riêng Đợt 2 và số đã thanh toán;<span class=\"th\" data-t=\"- หนังสือขอรับชำระเงินของฝ่าย B ตารางสรุปมูลค่าปริมาณงานเฉพาะงวดที่ 2 และจำนวนที่ชำระแล้ว\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Hợp đồng, phụ lục/BOQ và VO được hai bên ký hợp lệ (bản sao phù hợp);<span class=\"th\" data-t=\"- สัญญา ภาคผนวก/BOQ และ VO ที่ทั้งสองฝ่ายลงนามโดยชอบ (สำเนาที่เหมาะสม)\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Biên bản nghiệm thu giai đoạn, bảng xác nhận khối lượng và giá trị có chữ ký của đại diện có thẩm quyền của hai bên;<span class=\"th\" data-t=\"- รายงานการตรวจรับเป็นระยะ ตารางยืนยันปริมาณงานและมูลค่าที่มีลายมือชื่อของผู้แทนผู้มีอำนาจของทั้งสองฝ่าย\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Hình ảnh hiện trường, biên bản kiểm tra chất lượng công trình, kết quả thí nghiệm vật liệu và chứng chỉ áp dụng cho công việc xây dựng;<span class=\"th\" data-t=\"- ภาพถ่ายหน้างาน รายงานการตรวจสอบคุณภาพงานก่อสร้าง ผลการทดสอบวัสดุ และใบรับรองที่ใช้กับงานก่อสร้าง\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Hóa đơn GTGT điện tử hợp lệ tương ứng giá trị tính thuế theo pháp luật và xác nhận kỳ thanh toán;<span class=\"th\" data-t=\"- ใบกำกับภาษีมูลค่าเพิ่มอิเล็กทรอนิกส์ที่ถูกต้อง ตรงกับมูลค่าที่ต้องเสียภาษีตามกฎหมาย และการยืนยันงวดการชำระเงิน\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Đợt 3 – NGHIỆM THU KHỐI LƯỢNG XÂY DỰNG GIAI ĐOẠN 2: Sau khi Bên B hoàn thành <strong><span class=\"fx\" data-k=\"MỐC CÔNG VIỆC XÂY DỰNG 2 / HOÀN THIỆN\"></span></strong> theo BOQ và Phụ lục 03.<span class=\"th\" data-t=\"งวดที่ 3 – การตรวจรับปริมาณงานก่อสร้างระยะที่ 2: เมื่อฝ่าย B ทำ 【MỐC CÔNG VIỆC XÂY DỰNG 2 / HOÀN THIỆN】 แล้วเสร็จตาม BOQ และภาคผนวก 03\"></span></p><p>Sau nghiệm thu hợp lệ, Bên A thanh toán (90)% giá trị khối lượng xây dựng RIÊNG của Đợt 3, trừ khoản thu hồi tạm ứng tại Phụ lục 03 và khoản khấu trừ hợp lệ. Khối lượng của Đợt 3 không tính trùng bất kỳ công tác xây dựng đã nghiệm thu hoặc thanh toán tại Đợt 2. Thanh toán trong (07) ngày làm việc từ khi hoàn tất nghiệm thu và nhận đủ hồ sơ hợp lệ. Hồ sơ gồm:<span class=\"th\" data-t=\"หลังจากการตรวจรับโดยชอบ ฝ่าย A ชำระ (90)% ของมูลค่าปริมาณงานก่อสร้างเฉพาะของงวดที่ 3 หักด้วยการเรียกคืนเงินล่วงหน้าตามภาคผนวก 03 และรายการหักที่ชอบด้วยกฎหมาย ปริมาณงานของงวดที่ 3 ต้องไม่คำนวณซ้ำกับงานก่อสร้างใด ๆ ที่ได้ตรวจรับหรือชำระแล้วในงวดที่ 2 ชำระภายใน (07) วันทำการ นับจากเสร็จสิ้นการตรวจรับและได้รับเอกสารที่ถูกต้องครบถ้วน เอกสารประกอบด้วย:\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Thư đề nghị thanh toán cùng bảng xác nhận khối lượng, giá trị riêng của Đợt 3;<span class=\"th\" data-t=\"- หนังสือขอรับชำระเงินพร้อมตารางยืนยันปริมาณงานและมูลค่าเฉพาะของงวดที่ 3\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Hợp đồng, phụ lục/BOQ, các VO đã được chấp thuận hợp lệ;<span class=\"th\" data-t=\"- สัญญา ภาคผนวก/BOQ และ VO ที่ได้รับความเห็นชอบโดยชอบ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Biên bản nghiệm thu từng công việc/giai đoạn, bảng xác nhận khối lượng thực hiện và biên bản thử nghiệm/kiểm định theo quy định;<span class=\"th\" data-t=\"- รายงานการตรวจรับงานแต่ละรายการ/ระยะ ตารางยืนยันปริมาณงานที่ดำเนินการ และรายงานการทดสอบ/ตรวจสอบตามที่กำหนด\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Hình ảnh hiện trường, báo cáo tiến độ và tài liệu kỹ thuật liên quan;<span class=\"th\" data-t=\"- ภาพถ่ายหน้างาน รายงานความคืบหน้า และเอกสารทางเทคนิคที่เกี่ยวข้อง\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Hóa đơn GTGT điện tử hợp lệ theo pháp luật;<span class=\"th\" data-t=\"- ใบกำกับภาษีมูลค่าเพิ่มอิเล็กทรอนิกส์ที่ถูกต้องตามกฎหมาย\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Hồ sơ chất lượng, nhật ký thi công, bản vẽ hoàn công tương ứng, CO/CQ (nếu có) và hồ sơ HSE bắt buộc;<span class=\"th\" data-t=\"- เอกสารด้านคุณภาพ สมุดบันทึกการก่อสร้าง แบบก่อสร้างจริง (as-built) ที่เกี่ยวข้อง CO/CQ (ถ้ามี) และเอกสาร HSE ที่จำเป็น\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Đợt 4 – QUYẾT TOÁN / THANH TOÁN CUỐI: Bên A thanh toán số tiền còn lại = GIÁ TRỊ QUYẾT TOÁN ĐƯỢC HAI BÊN XÁC NHẬN − TỔNG TIỀN ĐÃ THỰC CHUYỂN <span class=\"fx\" data-k=\"BAO GỒM TẠM ỨNG, ĐỢT 2, ĐỢT 3\"></span> − CÁC KHOẢN GIỮ LẠI HỢP LỆ − CÁC KHOẢN KHẤU TRỪ CÓ CĂN CỨ. Thanh toán trong vòng <strong><span class=\"fx\" data-k=\"15\"></span></strong> ngày làm việc tính từ thời điểm tất cả: (i) Bên B hoàn thành 100% công việc và nghiệm thu, bàn giao; (ii) quyết toán được hai bên xác nhận; (iii) Bên A nhận đầy đủ hồ sơ thanh toán hợp lệ; (iv) Bên B nộp bảo lãnh bảo hành hợp lệ nếu có thỏa thuận. Hồ sơ gồm:<span class=\"th\" data-t=\"งวดที่ 4 – การสรุปยอด/การชำระเงินงวดสุดท้าย: ฝ่าย A ชำระเงินส่วนที่เหลือ = มูลค่าสรุปยอดที่ทั้งสองฝ่ายยืนยัน − จำนวนเงินที่โอนจริงทั้งหมด 【BAO GỒM TẠM ỨNG, ĐỢT 2, ĐỢT 3】 − เงินประกันผลงานที่กักไว้โดยชอบ − รายการหักที่มีหลักฐานรองรับ ชำระภายใน 【15】 วันทำการ นับจากเวลาที่เกิดครบถ้วนทุกข้อ: (i) ฝ่าย B ทำงานแล้วเสร็จ 100% และได้รับการตรวจรับและส่งมอบ (ii) ทั้งสองฝ่ายยืนยันการสรุปยอด (iii) ฝ่าย A ได้รับเอกสารขอรับชำระเงินครบถ้วนถูกต้อง (iv) ฝ่าย B ส่งมอบหนังสือค้ำประกันการรับประกันผลงานที่ถูกต้อง หากมีข้อตกลงไว้ เอกสารประกอบด้วย:\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Thư đề nghị thanh toán cuối, bảng đối chiếu mọi khoản đã nhận, tạm ứng đã thu hồi và công nợ;<span class=\"th\" data-t=\"- หนังสือขอรับชำระเงินงวดสุดท้าย ตารางเทียบยอดเงินทุกรายการที่ได้รับ เงินล่วงหน้าที่เรียกคืนแล้ว และหนี้สินคงค้าง\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Hợp đồng, toàn bộ phụ lục, VO có chữ ký hợp lệ;<span class=\"th\" data-t=\"- สัญญา ภาคผนวกทั้งหมด และ VO ที่มีลายมือชื่อถูกต้อง\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Hóa đơn GTGT điện tử hợp lệ theo giá trị quyết toán và các hóa đơn kỳ trước;<span class=\"th\" data-t=\"- ใบกำกับภาษีมูลค่าเพิ่มอิเล็กทรอนิกส์ที่ถูกต้องตามมูลค่าสรุปยอด และใบกำกับภาษีของงวดก่อน ๆ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Biên bản nghiệm thu hoàn thành, xác nhận khối lượng, bàn giao đưa vào sử dụng; nhật ký, ảnh nghiệm thu và biên bản chạy thử/hiệu chỉnh (nếu có);<span class=\"th\" data-t=\"- รายงานการตรวจรับงานแล้วเสร็จ การยืนยันปริมาณงาน การส่งมอบเพื่อนำไปใช้งาน สมุดบันทึก ภาพถ่ายการตรวจรับ และรายงานการทดลองเดินระบบ/การปรับแต่ง (ถ้ามี)\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Hồ sơ quyết toán cuối cùng có chữ ký có thẩm quyền của cả hai bên;<span class=\"th\" data-t=\"- เอกสารสรุปยอดฉบับสุดท้ายที่มีลายมือชื่อผู้มีอำนาจของทั้งสองฝ่าย\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Hồ sơ hoàn công, CO/CQ, hồ sơ thí nghiệm, kiểm định, hồ sơ hướng dẫn vận hành, bảo trì, đào tạo, chứng từ HSE và hoàn tất tồn đọng theo Phụ lục 01/04;<span class=\"th\" data-t=\"- เอกสารแบบก่อสร้างจริง (as-built) CO/CQ เอกสารการทดสอบ การตรวจสอบ เอกสารคู่มือการใช้งาน การบำรุงรักษา การฝึกอบรม เอกสาร HSE และการแก้ไขงานค้างให้เสร็จสิ้นตามภาคผนวก 01/04\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>- Bảo lãnh bảo hành bản gốc (nếu áp dụng), giá trị <span class=\"fx\" data-k=\"5\"></span>% giá trị quyết toán; bảo lãnh phải có hiệu lực liên tục đến hết thời hạn bảo hành được xác định theo Điều 12 và Phụ lục 04, cộng thêm 30 ngày dự phòng. Bên B phải gia hạn hoặc thay thế bảo lãnh theo Điều 21.5 khi thời hạn bảo hành được điều chỉnh hợp lệ; hoặc áp dụng tiền giữ lại <span class=\"fx\" data-k=\"%\"></span> theo phương án chỉ chọn một tại Phụ lục 06.<span class=\"th\" data-t=\"- ต้นฉบับหนังสือค้ำประกันการรับประกันผลงาน (หากใช้บังคับ) มูลค่า 【5】 % ของมูลค่าสรุปยอด หนังสือค้ำประกันต้องมีผลต่อเนื่องจนสิ้นระยะเวลารับประกันผลงานที่กำหนดตามข้อ 12 และภาคผนวก 04 บวกระยะเผื่ออีก 30 วัน ฝ่าย B ต้องต่ออายุหรือเปลี่ยนหนังสือค้ำประกันตามข้อ 21.5 เมื่อระยะเวลารับประกันผลงานได้รับการปรับเปลี่ยนโดยชอบ หรือใช้เงินประกันผลงานที่กักไว้ (Retention) 【%】 ตามทางเลือกแบบเลือกอย่างใดอย่างหนึ่งในภาคผนวก 06\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Hình thức thanh toán: chuyển khoản ngân hàng bằng VNĐ theo quy định pháp luật và Điều 5.<span class=\"th\" data-t=\"รูปแบบการชำระเงิน: โอนเงินผ่านธนาคารเป็นสกุลเงินดง (VNĐ) ตามกฎหมายและข้อ 5\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A thanh toán từ tài khoản của CÔNG TY TNHH KSP VIỆT NAM hoặc tài khoản đơn vị/chi nhánh được phép thanh toán và được ghi trong hệ thống kế toán; tên bên có nghĩa vụ thanh toán vẫn phải khớp hợp đồng.<span class=\"th\" data-t=\"ฝ่าย A ชำระเงินจากบัญชีของ CÔNG TY TNHH KSP VIỆT NAM หรือบัญชีของหน่วยงาน/สาขาที่ได้รับอนุญาตให้ชำระเงินและบันทึกอยู่ในระบบบัญชี ชื่อของฝ่ายที่มีภาระต้องชำระเงินยังต้องตรงกับที่ระบุในสัญญา\"></span></p><p>Tài khoản thanh toán KSP: <strong><span class=\"fx\" data-k=\"TÊN ĐƠN VỊ / NGÂN HÀNG / SỐ TÀI KHOẢN\"></span></strong><span class=\"th\" data-t=\"บัญชีชำระเงินของ KSP: 【TÊN ĐƠN VỊ / NGÂN HÀNG / SỐ TÀI KHOẢN】\"></span></p><p>Chi nhánh/đơn vị thanh toán (nếu có): <strong><span class=\"fx\" data-k=\"TÊN / MST / TÀI KHOẢN\"></span></strong><span class=\"th\" data-t=\"สาขา/หน่วยงานผู้ชำระเงิน (ถ้ามี): 【TÊN / MST / TÀI KHOẢN】\"></span></p><p>Đồng tiền thanh toán: <strong><span class=\"fx\" data-k=\"VND\"></span></strong>; thông tin tài khoản Bên B phải được xác nhận bằng văn bản ký bởi người có thẩm quyền.<span class=\"th\" data-t=\"สกุลเงินที่ชำระ: 【VND】 ข้อมูลบัญชีของฝ่าย B ต้องได้รับการยืนยันเป็นหนังสือที่ลงนามโดยผู้มีอำนาจ\"></span></p><p>Thay đổi tài khoản Bên B chỉ có hiệu lực sau khi Bên A kiểm tra thông tin, xác nhận theo quy trình chống gian lận tài khoản.<span class=\"th\" data-t=\"การเปลี่ยนแปลงบัญชีของฝ่าย B มีผลก็ต่อเมื่อฝ่าย A ตรวจสอบข้อมูลและยืนยันตามกระบวนการป้องกันการฉ้อโกงเกี่ยวกับบัญชี\"></span></p><p>Tài khoản nhận của Bên B: <strong><span class=\"fx\" data-k=\"TÊN CHỦ TK / SỐ TK / NGÂN HÀNG\"></span></strong>.<span class=\"th\" data-t=\"บัญชีรับเงินของฝ่าย B: 【TÊN CHỦ TK / SỐ TK / NGÂN HÀNG】\"></span></p><p>Ngày thanh toán nội bộ dự kiến: ngày <strong><span class=\"fx\" data-k=\"14 / 26 / NGÀY KHÁC\"></span></strong> hằng tháng; việc sắp xếp ngày chi nội bộ không được làm quá hạn thanh toán đã cam kết ở từng Đợt 1–4, trừ khi các bên đã ghi rõ ngày đến hạn cụ thể ngay trong hợp đồng.<span class=\"th\" data-t=\"วันชำระเงินภายในที่คาดการณ์: วันที่ 【14 / 26 / NGÀY KHÁC】 ของทุกเดือน การจัดวันจ่ายเงินภายในต้องไม่ทำให้เกินกำหนดการชำระเงินที่ได้ให้คำมั่นไว้ในแต่ละงวดที่ 1–4 เว้นแต่คู่สัญญาได้ระบุวันครบกำหนดไว้เป็นการเฉพาะในสัญญาแล้ว\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trường hợp ngày đến hạn rơi vào ngày nghỉ ngân hàng, việc thực hiện thanh toán theo quy định pháp luật và thỏa thuận rõ tại <strong><span class=\"fx\" data-k=\"CƠ CHẾ NGÀY LÀM VIỆC KẾ TIẾP\"></span></strong>; Bên A thông báo và giải quyết kịp thời mọi thiếu sót của hồ sơ trong <strong><span class=\"fx\" data-k=\"03\"></span></strong> ngày làm việc từ ngày nhận.<span class=\"th\" data-t=\"ในกรณีที่วันครบกำหนดตรงกับวันหยุดของธนาคาร การชำระเงินให้เป็นไปตามกฎหมายและข้อตกลงที่ระบุชัดเจนใน 【CƠ CHẾ NGÀY LÀM VIỆC KẾ TIẾP】 ฝ่าย A แจ้งและแก้ไขข้อบกพร่องของเอกสารทั้งหมดโดยพลันภายใน 【03】 วันทำการนับจากวันที่ได้รับ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Người nhận chứng từ: <strong><span class=\"fx\" data-k=\"HỌ TÊN / EMAIL / ĐIỆN THOẠI KSP\"></span></strong><span class=\"th\" data-t=\"ผู้รับเอกสาร: 【HỌ TÊN / EMAIL / ĐIỆN THOẠI KSP】\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Địa chỉ nhận hóa đơn GTGT điện tử hợp lệ: <strong><span class=\"fx\" data-k=\"EMAIL KẾ TOÁN KSP\"></span></strong>.<span class=\"th\" data-t=\"ที่อยู่รับใบกำกับภาษีมูลค่าเพิ่มอิเล็กทรอนิกส์ที่ถูกต้อง: 【EMAIL KẾ TOÁN KSP】\"></span></p><p>5.5. QUY ĐỊNH CHUNG VỀ THANH TOÁN: Bên B phải nộp hồ sơ theo danh mục của từng đợt tại Hợp đồng; Bên A thông báo bằng văn bản những tài liệu còn thiếu cần điều chỉnh trong <span class=\"fx\" data-k=\"03\"></span> ngày làm việc từ khi nhận hồ sơ. Việc Bên A chưa thông báo trong thời hạn này không đồng nghĩa hồ sơ được xác nhận đầy đủ, hợp lệ hoặc được chấp thuận thanh toán. Thời hạn thanh toán chỉ tính khi hoàn tất nghiệm thu và nhận đủ hồ sơ hợp lệ của đợt tương ứng. Mỗi khối lượng hoàn thành chỉ được thanh toán một lần; giá trị thanh toán đợt 2 và đợt 3 là GIÁ TRỊ RIÊNG, không phải giá trị lũy kế. Tổng thu hồi tạm ứng không vượt khoản đã tạm ứng. Số tiền cuối cùng quyết toán phải đối chiếu chứng từ chuyển tiền thực tế. <span class=\"th\" data-t=\"5.5. ข้อกำหนดทั่วไปเกี่ยวกับการชำระเงิน: ฝ่าย B ต้องยื่นเอกสารตามรายการของแต่ละงวดในสัญญา ฝ่าย A แจ้งเป็นหนังสือถึงเอกสารที่ขาดและต้องแก้ไขภายใน 【03】 วันทำการนับจากวันที่ได้รับเอกสาร การที่ฝ่าย A ยังไม่แจ้งภายในกำหนดนี้ไม่ถือว่าเป็นการยืนยันว่าเอกสารครบถ้วน ถูกต้อง หรือได้รับความเห็นชอบให้ชำระเงิน กำหนดชำระเงินเริ่มนับเมื่อเสร็จสิ้นการตรวจรับและได้รับเอกสารที่ถูกต้องครบถ้วนของงวดที่เกี่ยวข้องแล้วเท่านั้น ปริมาณงานที่แล้วเสร็จแต่ละส่วนได้รับการชำระเพียงครั้งเดียว มูลค่าการชำระเงินงวดที่ 2 และงวดที่ 3 เป็นมูลค่าเฉพาะงวด ไม่ใช่มูลค่าสะสม ยอดเรียกคืนเงินล่วงหน้ารวมต้องไม่เกินเงินล่วงหน้าที่จ่ายไป จำนวนเงินสรุปยอดสุดท้ายต้องตรวจเทียบกับเอกสารการโอนเงินจริง\"></span></p><p>Trường hợp số tiền của đợt không đủ để khấu trừ hết khoản tạm ứng phải thu hồi, phần còn thiếu được chuyển sang đợt kế tiếp, và phải được thu hồi hết chậm nhất tại mốc quy định trong Phụ lục 03. Khi đến mốc này hoặc khi Hợp đồng chấm dứt trước hạn, nếu vẫn còn số dư tạm ứng chưa thu hồi, Bên B phải hoàn trả toàn bộ số dư đó trong vòng 03 ngày làm việc kể từ ngày nhận được yêu cầu bằng văn bản của Bên A.<span class=\"th\" data-t=\"ในกรณีที่จำนวนเงินของงวดไม่เพียงพอที่จะหักชำระเงินล่วงหน้าที่ต้องเรียกคืนได้ครบ ส่วนที่ขาดให้ยกไปงวดถัดไป และต้องเรียกคืนให้ครบอย่างช้าที่สุด ณ ช่วงเวลาที่กำหนดในภาคผนวก 03 เมื่อถึงช่วงเวลานี้หรือเมื่อสัญญาสิ้นสุดก่อนกำหนด หากยังมียอดเงินล่วงหน้าคงเหลือที่ยังไม่ได้เรียกคืน ฝ่าย B ต้องคืนยอดคงเหลือทั้งหมดภายใน 03 วันทำการนับจากวันที่ได้รับหนังสือเรียกร้องจากฝ่าย A\"></span></p><p>5.6. Trường hợp hồ sơ có tranh chấp một phần, Bên A phải thông báo bằng văn bản nêu rõ căn cứ, số tiền và tài liệu chưa hợp lệ; phần nghĩa vụ thanh toán đã đủ điều kiện và không tranh chấp vẫn đến hạn theo Hợp đồng. Lãi chậm thanh toán (nếu phát sinh) thực hiện theo thỏa thuận hợp pháp và pháp luật hiện hành.<span class=\"th\" data-t=\"5.6. ในกรณีที่เอกสารมีข้อพิพาทเพียงบางส่วน ฝ่าย A ต้องแจ้งเป็นหนังสือโดยระบุเหตุผล จำนวนเงิน และเอกสารที่ยังไม่ถูกต้องอย่างชัดเจน ส่วนของภาระการชำระเงินที่ครบเงื่อนไขและไม่มีข้อพิพาทยังคงถึงกำหนดตามสัญญา ดอกเบี้ยจากการชำระเงินล่าช้า (หากเกิดขึ้น) ให้เป็นไปตามข้อตกลงที่ชอบด้วยกฎหมายและกฎหมายที่มีผลใช้บังคับ\"></span></p><h3 class=\"art\" data-n=\"6\">ĐIỀU 6. QUYỀN VÀ NGHĨA VỤ CHUNG CỦA CÁC BÊN<span class=\"th\" data-t=\"ข้อ 6 สิทธิและหน้าที่ทั่วไปของคู่สัญญา\"></span></h3><p class=\"lv1\"><span class=\"lb\">6.1</span>Quyền của Bên A<span class=\"th\" data-t=\"สิทธิของฝ่าย A\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A có quyền kiểm tra,<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิตรวจสอบ\"></span></p><p>giám sát quá trình thi công nhưng không gây cản trở bất hợp lý đối với hoạt động thi công của Bên B. Thời gian kiểm tra, nghiệm thu thông thường theo kế hoạch đã thống nhất được tính trong tiến độ thực hiện Hợp đồng. Việc kiểm tra, giám sát hoặc nghiệm thu của Bên A không làm giảm trách nhiệm của Bên B về chất lượng, khối lượng và tiến độ thi công của Bên B theo Hợp đồng.<span class=\"th\" data-t=\"และกำกับดูแลกระบวนการก่อสร้าง แต่ต้องไม่ก่อให้เกิดอุปสรรคต่อการก่อสร้างของฝ่าย B โดยไม่สมเหตุสมผล เวลาที่ใช้ในการตรวจสอบและตรวจรับตามปกติตามแผนที่ตกลงกันไว้ให้นับรวมอยู่ในกำหนดการปฏิบัติตามสัญญา การตรวจสอบ กำกับดูแล หรือตรวจรับของฝ่าย A ไม่ลดความรับผิดชอบของฝ่าย B ในด้านคุณภาพ ปริมาณงาน และกำหนดการก่อสร้างของฝ่าย B ตามสัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A có quyền yêu cầu Bên B dừng thi công và khắc phục nếu phát hiện vi phạm về chất lượng, an toàn lao động, vệ sinh môi trường hoặc phòng cháy chữa cháy.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิเรียกให้ฝ่าย B หยุดการก่อสร้างและแก้ไขหากพบการฝ่าฝืนด้านคุณภาพ ความปลอดภัยในการทำงาน สุขอนามัยและสิ่งแวดล้อม หรือการป้องกันและดับเพลิง\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A có quyền yêu cầu thay thế nhân sự của Bên B nếu không đáp ứng yêu cầu công việc (ví dụ: yếu năng lực, gây chậm tiến độ, không hợp tác…). Nếu Bên B muốn giữ lại người này, phải có văn bản giải trình và cam kết trong vòng 07 ngày hoặc thể hiện bằng biên bản họp giao ban. Trường hợp nhân sự vi phạm nội quy, an toàn (có biên bản xác nhận của Bên A và Tư vấn giám sát), Bên A có quyền yêu cầu rời khỏi công trường ngay lập tức.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิเรียกให้เปลี่ยนตัวบุคลากรของฝ่าย B หากไม่ตอบสนองต่อความต้องการของงาน (เช่น ขาดความสามารถ ทำให้ล่าช้า ไม่ให้ความร่วมมือ ฯลฯ) หากฝ่าย B ประสงค์จะคงบุคคลนั้นไว้ ต้องมีหนังสือชี้แจงและให้คำมั่นภายใน 07 วัน หรือแสดงไว้ในรายงานการประชุมประสานงาน ในกรณีที่บุคลากรฝ่าฝืนระเบียบและความปลอดภัย (โดยมีรายงานยืนยันจากฝ่าย A และที่ปรึกษาควบคุมงาน) ฝ่าย A มีสิทธิเรียกให้ออกจากหน่วยงานก่อสร้างทันที\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A có quyền từ chối thanh toán phần khối lượng không đảm bảo chất lượng hoặc không nằm trong phạm vi hợp đồng mà chưa được Bên A phê duyệt.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิปฏิเสธการชำระเงินสำหรับปริมาณงานส่วนที่คุณภาพไม่เป็นไปตามกำหนดหรืออยู่นอกขอบเขตของสัญญาที่ฝ่าย A ยังไม่ได้อนุมัติ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A có quyền yêu cầu Bên B bổ sung, hoàn chỉnh hồ sơ theo đúng quy định của hợp đồng.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิเรียกให้ฝ่าย B เพิ่มเติมและทำเอกสารให้สมบูรณ์ตามที่สัญญากำหนด\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Nếu có vướng mắc, tranh chấp hoặc phát sinh liên quan đến thanh toán, Bên A sẽ thông báo sớm và nêu rõ cơ sở, điều khoản áp dụng, số tiền liên quan để Bên B phối hợp giải quyết.<span class=\"th\" data-t=\"หากมีอุปสรรค ข้อพิพาท หรือเหตุการณ์เกิดขึ้นที่เกี่ยวข้องกับการชำระเงิน ฝ่าย A จะแจ้งให้ทราบโดยเร็วและระบุฐานที่มา ข้อกำหนดที่ใช้บังคับ และจำนวนเงินที่เกี่ยวข้องให้ชัดเจน เพื่อให้ฝ่าย B ร่วมมือแก้ไข\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trong trường hợp phát sinh nghĩa vụ tài chính của Bên B, Bên A có quyền khấu trừ số tiền liên quan từ các khoản thanh toán hiện tại hoặc sau này của Bên B.<span class=\"th\" data-t=\"ในกรณีที่เกิดภาระทางการเงินของฝ่าย B ฝ่าย A มีสิทธิหักจำนวนเงินที่เกี่ยวข้องจากเงินที่ต้องชำระให้ฝ่าย B ในปัจจุบันหรือในภายหลัง\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A có quyền xem xét, phê duyệt hoặc không chấp thuận nhân công phụ trợ mà Bên B huy động để đảm bảo chất lượng và tiến độ công việc.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิพิจารณา อนุมัติ หรือไม่ให้ความเห็นชอบแรงงานช่วยเสริมที่ฝ่าย B จัดหามา เพื่อให้มั่นใจในคุณภาพและกำหนดการของงาน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trường hợp Bên B hoặc Nhà thầu phụ của Bên B không thanh toán đầy đủ, đúng hạn tiền lương, tiền công hoặc các khoản phải trả cho người lao động, nhà thầu phụ, nhà cung cấp của mình, dẫn đến khiếu nại, ngừng việc, đình công, gây mất an ninh, trật tự hoặc ảnh hưởng đến tiến độ, chất lượng và hoạt động của Bên A hoặc công trình, Bên A có quyền, tùy theo tình hình thực tế, thực hiện thanh toán trực tiếp cho người lao động, nhà thầu phụ hoặc bên có liên quan để đảm bảo công việc và hoạt động của công trình không bị gián đoạn. Toàn bộ số tiền Bên A đã thanh toán thay và các chi phí phát sinh liên quan sẽ được xem là nghĩa vụ tài chính của Bên B và Bên A có quyền khấu trừ trực tiếp vào bất kỳ khoản thanh toán, khoản bảo lưu, tiền giữ lại hoặc các khoản tiền khác mà Bên A phải thanh toán cho Bên B. Trường hợp các khoản phải trả cho Bên B không đủ để khấu trừ, Bên B có trách nhiệm hoàn trả đầy đủ cho Bên A trong vòng 03 (ba) ngày làm việc kể từ ngày nhận được yêu cầu của Bên A.<span class=\"th\" data-t=\"ในกรณีที่ฝ่าย B หรือผู้รับเหมาช่วงของฝ่าย B ไม่ชำระค่าจ้าง ค่าแรง หรือเงินที่ต้องจ่ายแก่ลูกจ้าง ผู้รับเหมาช่วง หรือผู้ขายของตนอย่างครบถ้วนและตรงเวลา จนนำไปสู่การร้องเรียน การหยุดงาน การนัดหยุดงาน การก่อความไม่สงบเรียบร้อยและความมั่นคง หรือส่งผลกระทบต่อกำหนดการ คุณภาพ และการดำเนินงานของฝ่าย A หรือหน่วยงานก่อสร้าง ฝ่าย A มีสิทธิ ตามสถานการณ์จริง ชำระเงินโดยตรงแก่ลูกจ้าง ผู้รับเหมาช่วง หรือฝ่ายที่เกี่ยวข้อง เพื่อให้งานและการดำเนินงานของหน่วยงานก่อสร้างไม่ต้องหยุดชะงัก เงินทั้งหมดที่ฝ่าย A ชำระแทนและค่าใช้จ่ายที่เกิดขึ้นที่เกี่ยวข้องให้ถือเป็นภาระทางการเงินของฝ่าย B และฝ่าย A มีสิทธิหักโดยตรงจากเงินที่ต้องชำระ เงินสำรอง เงินประกันผลงานที่กักไว้ หรือเงินอื่นใดที่ฝ่าย A ต้องชำระให้ฝ่าย B ในกรณีที่เงินที่ต้องชำระให้ฝ่าย B ไม่เพียงพอที่จะหัก ฝ่าย B มีหน้าที่คืนเงินให้ฝ่าย A ครบถ้วนภายใน 03 (สาม) วันทำการนับจากวันที่ได้รับหนังสือเรียกร้องจากฝ่าย A\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trước khi thanh toán thay, Bên A thông báo cho Bên B và kiểm tra căn cứ nghĩa vụ, danh sách người nhận, số tiền, tình trạng chưa thanh toán và chứng từ liên quan. Việc thanh toán thay phải có chứng từ chi trả và xác nhận của người nhận, được ghi nhận để giảm trừ nghĩa vụ tương ứng, tránh thanh toán trùng. Việc Bên A thanh toán thay không làm phát sinh nghĩa vụ tiếp nhận các khoản nợ khác của Bên B.<span class=\"th\" data-t=\"ก่อนชำระเงินแทน ฝ่าย A แจ้งให้ฝ่าย B ทราบและตรวจสอบฐานแห่งภาระ รายชื่อผู้รับเงิน จำนวนเงิน สถานะที่ยังไม่ได้ชำระ และเอกสารที่เกี่ยวข้อง การชำระเงินแทนต้องมีหลักฐานการจ่ายเงินและการยืนยันของผู้รับเงิน บันทึกเพื่อลดภาระที่เกี่ยวข้อง และหลีกเลี่ยงการชำระซ้ำ การที่ฝ่าย A ชำระเงินแทนไม่ก่อให้เกิดหน้าที่รับภาระหนี้อื่นของฝ่าย B\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trường hợp Bên B chậm tiến độ, bỏ dở công việc hoặc vi phạm nghiêm trọng, Bên A được lập biên bản kiểm kê vật tư và yêu cầu Bên B bàn giao công việc, hồ sơ, vật tư đã được Bên A thanh toán thuộc quyền sở hữu Bên A để bảo vệ tiến độ; không mặc nhiên chiếm giữ hoặc sử dụng máy móc, thiết bị thuộc sở hữu riêng của Bên B.<span class=\"th\" data-t=\"ในกรณีที่ฝ่าย B ทำงานล่าช้า ละทิ้งงาน หรือฝ่าฝืนอย่างร้ายแรง ฝ่าย A มีสิทธิจัดทำรายงานตรวจนับวัสดุ และเรียกให้ฝ่าย B ส่งมอบงาน เอกสาร และวัสดุที่ฝ่าย A ชำระเงินแล้วและเป็นกรรมสิทธิ์ของฝ่าย A เพื่อรักษากำหนดการ โดยไม่ถือโดยปริยายว่ามีสิทธิยึดถือหรือใช้เครื่องจักรและอุปกรณ์ที่เป็นกรรมสิทธิ์เฉพาะของฝ่าย B\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Việc sử dụng máy móc, thiết bị thuộc sở hữu của Bên B chỉ thực hiện theo thỏa thuận riêng bằng văn bản hoặc căn cứ pháp luật hợp lệ; Bên B vẫn có quyền khiếu nại, tranh chấp theo pháp luật.<span class=\"th\" data-t=\"การใช้เครื่องจักรและอุปกรณ์ที่เป็นกรรมสิทธิ์ของฝ่าย B ให้ทำได้เฉพาะตามข้อตกลงแยกต่างหากเป็นหนังสือหรือตามฐานทางกฎหมายที่ชอบด้วยกฎหมายเท่านั้น ฝ่าย B ยังคงมีสิทธิร้องเรียนและโต้แย้งตามกฎหมาย\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Chi phí bảo quản, vận chuyển, xử lý vật tư và công việc hợp pháp khi thay nhà thầu phải được ghi biên bản, chứng minh hợp lý và phân bổ theo lỗi của từng bên.<span class=\"th\" data-t=\"ค่าใช้จ่ายในการเก็บรักษา ขนส่ง จัดการวัสดุ และงานที่ชอบด้วยกฎหมายเมื่อเปลี่ยนผู้รับเหมา ต้องบันทึกเป็นรายงาน พิสูจน์ได้ว่าสมเหตุสมผล และแบ่งสรรตามความผิดของแต่ละฝ่าย\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Các bên kiểm kê, bảo quản và hoàn trả tài sản thuộc sở hữu của Bên B trong thời hạn <span class=\"fx\" data-k=\"05\"></span> ngày làm việc sau khi kết thúc quyền sử dụng hợp pháp, trừ trường hợp có quyết định cơ quan có thẩm quyền hoặc biện pháp bảo đảm được thỏa thuận hợp lệ.<span class=\"th\" data-t=\"คู่สัญญาตรวจนับ เก็บรักษา และคืนทรัพย์สินที่เป็นกรรมสิทธิ์ของฝ่าย B ภายใน 【05】 วันทำการ หลังสิ้นสุดสิทธิการใช้ที่ชอบด้วยกฎหมาย เว้นแต่มีคำสั่งของหน่วยงานที่มีอำนาจหรือมีมาตรการประกันที่ตกลงกันโดยชอบ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trong thời gian bảo hành, nếu lỗi <span class=\"th\" data-t=\"ในระหว่างระยะเวลารับประกันผลงาน หากข้อบกพร่อง\"></span></p><p>thuộc phạm vi trách nhiệm Bên B không được khắc phục đúng hạn, Bên A được thuê đơn vị khác sửa chữa và yêu cầu hoàn trả/khấu trừ chi phí hợp lý, có chứng từ theo Điều 12 và Điều 15; trách nhiệm này áp dụng cho toàn bộ phần việc thuộc phạm vi bảo hành của Bên B và khấu trừ chi phí từ khoản bảo lưu hoặc công nợ của Bên B (nếu có).<span class=\"th\" data-t=\"ที่อยู่ในความรับผิดชอบของฝ่าย B ไม่ได้รับการแก้ไขตามกำหนด ฝ่าย A มีสิทธิจ้างหน่วยงานอื่นซ่อมแซมและเรียกให้ฝ่าย B คืน/ให้หักค่าใช้จ่ายที่สมเหตุสมผลและมีเอกสารหลักฐานตามข้อ 12 และข้อ 15 ความรับผิดชอบนี้ใช้กับงานทั้งหมดที่อยู่ในขอบเขตการรับประกันผลงานของฝ่าย B และให้หักค่าใช้จ่ายจากเงินสำรองหรือหนี้สินของฝ่าย B (ถ้ามี)\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Các quyền khác theo hợp đồng và quy định pháp luật.<span class=\"th\" data-t=\"สิทธิอื่น ๆ ตามสัญญาและบทบัญญัติของกฎหมาย\"></span></p><p class=\"lv1\"><span class=\"lb\">6.2</span> Nghĩa vụ của Bên giao thầu Bên A<span class=\"th\" data-t=\"หน้าที่ของฝ่ายผู้ว่าจ้าง ฝ่าย A\"></span></p><p>Bên A cung cấp hoặc phối hợp chủ đầu tư cung cấp hồ sơ pháp lý, thiết kế và mặt bằng thuộc trách nhiệm được phân định tại Phụ lục 01. Trách nhiệm về quyền sử dụng đất, giấy phép xây dựng và phê duyệt dự án của chủ đầu tư được thực hiện theo pháp luật; Bên A không cam kết thay cho chủ đầu tư đối với nghĩa vụ ngoài phạm vi KSP nhận thực hiện. Bên A vẫn chịu trách nhiệm về nghĩa vụ bắt buộc và nghĩa vụ đã cam kết của mình. Bên B chịu trách nhiệm về tư cách, năng lực, chứng chỉ, hồ sơ nhân sự, thiết bị, biện pháp thi công và giấy phép thuộc phạm vi công việc của Bên B; phải thông báo ngay khi phát hiện thiếu điều kiện thi công và không triển khai trái pháp luật.<span class=\"th\" data-t=\"ฝ่าย A จัดหาหรือประสานงานกับเจ้าของโครงการเพื่อจัดหาเอกสารทางกฎหมาย แบบ และพื้นที่ก่อสร้างที่อยู่ในความรับผิดชอบตามที่แบ่งไว้ในภาคผนวก 01 ความรับผิดชอบเกี่ยวกับสิทธิการใช้ที่ดิน ใบอนุญาตก่อสร้าง และการอนุมัติโครงการของเจ้าของโครงการให้เป็นไปตามกฎหมาย ฝ่าย A ไม่รับรองแทนเจ้าของโครงการสำหรับภาระนอกขอบเขตที่ KSP รับดำเนินการ ฝ่าย A ยังคงรับผิดชอบต่อภาระที่กฎหมายบังคับและภาระที่ตนได้ให้คำมั่นไว้ ฝ่าย B รับผิดชอบเกี่ยวกับคุณสมบัติ ความสามารถ ใบรับรอง เอกสารบุคลากร เครื่องจักรอุปกรณ์ วิธีการก่อสร้าง และใบอนุญาตที่อยู่ในขอบเขตงานของฝ่าย B ต้องแจ้งทันทีเมื่อพบว่าขาดเงื่อนไขในการก่อสร้าง และต้องไม่ดำเนินการอันขัดต่อกฎหมาย\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bàn giao mặt bằng đủ điều kiện cho Bên B thi công xây dựng;<span class=\"th\" data-t=\"ส่งมอบพื้นที่ก่อสร้างที่มีสภาพพร้อมให้ฝ่าย B ดำเนินการก่อสร้าง;\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Cung cấp Hồ sơ thiết kế và các tài liệu có liên quan theo thoả thuận trong Hợp đồng và quy định của Pháp luật có liên quan;<span class=\"th\" data-t=\"จัดส่งเอกสารการออกแบบและเอกสารอื่นที่เกี่ยวข้องตามที่ตกลงในสัญญาและตามบทบัญญัติของกฎหมายที่เกี่ยวข้อง;\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Cử cán bộ chỉ huy trực tiếp và cán bộ kỹ thuật thường xuyên có mặt tại công trường để giám sát chất lượng và tiến độ thi công. Việc giám sát, nghiệm thu của Bên A không làm giảm trách nhiệm của Bên B về chất lượng công trình; mọi sai sót của Bên B dẫn đến thiệt hại thì Bên B phải bồi thường toàn bộ giá trị thiệt hại đó và chịu trách nhiệm trước pháp luật;<span class=\"th\" data-t=\"แต่งตั้งผู้บัญชาการหน้างานโดยตรงและเจ้าหน้าที่เทคนิคให้อยู่ประจำที่หน้างานอย่างสม่ำเสมอ เพื่อควบคุมดูแลคุณภาพและกำหนดการก่อสร้าง การควบคุมดูแลและการตรวจรับของฝ่าย A ไม่เป็นการลดความรับผิดชอบของฝ่าย B ต่อคุณภาพของงานก่อสร้าง ความผิดพลาดใดๆ ของฝ่าย B ที่ก่อให้เกิดความเสียหาย ฝ่าย B ต้องชดใช้ค่าเสียหายนั้นเต็มจำนวน และต้องรับผิดตามกฎหมาย;\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Nghiệm thu, thanh toán và quyết toán cho Bên B theo Điều 5, Điều 10 và Điều 17 của Hợp đồng.<span class=\"th\" data-t=\"ตรวจรับ ชำระเงิน และทำการสรุปยอด (quyết toán) ให้ฝ่าย B ตามข้อ 5 ข้อ 10 และข้อ 17 ของสัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Giải quyết kịp thời các vướng mắc liên quan đến thiết kế;<span class=\"th\" data-t=\"แก้ไขปัญหาและอุปสรรคที่เกี่ยวข้องกับการออกแบบได้อย่างทันท่วงที;\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Các trách nhiệm khác nêu trong Hợp đồng này và theo quy định của Pháp luật.<span class=\"th\" data-t=\"หน้าที่รับผิดชอบอื่นตามที่ระบุในสัญญานี้และตามบทบัญญัติของกฎหมาย\"></span></p><p>Danh sách người đại diện của mỗi Bên và phạm vi thẩm quyền được xác định tại Phụ lục 01 hoặc văn bản ủy quyền hợp lệ được thông báo cho Bên còn lại. Người xác nhận kỹ thuật hoặc khối lượng chỉ có quyền xác nhận trong phạm vi được giao. Việc chấp thuận đơn giá, gia hạn, quyết toán và sửa đổi Hợp đồng chỉ có hiệu lực khi được người đại diện hợp pháp hoặc người được ủy quyền đúng phạm vi của các Bên ký xác nhận.<span class=\"th\" data-t=\"รายชื่อผู้แทนของแต่ละฝ่ายและขอบเขตอำนาจกำหนดไว้ในภาคผนวก 01 หรือหนังสือมอบอำนาจที่ชอบด้วยกฎหมายซึ่งแจ้งให้อีกฝ่ายทราบ ผู้ยืนยันด้านเทคนิคหรือปริมาณงานมีอำนาจยืนยันได้เฉพาะภายในขอบเขตที่ได้รับมอบหมายเท่านั้น การอนุมัติราคาต่อหน่วย การขยายระยะเวลา การสรุปยอด และการแก้ไขสัญญา มีผลบังคับใช้ต่อเมื่อผู้แทนโดยชอบด้วยกฎหมายหรือผู้ได้รับมอบอำนาจภายในขอบเขตของแต่ละฝ่ายลงนามยืนยันแล้วเท่านั้น\"></span></p><p class=\"lv1\"><span class=\"lb\">6.3</span>Trách nhiệm của Bên B:<span class=\"th\" data-t=\"หน้าที่รับผิดชอบของฝ่าย B:\"></span></p><p class=\"lv0\"><span class=\"lb\">a)</span>Nhân lực và tổ chức thi công<span class=\"th\" data-t=\"กำลังคนและการจัดการงานก่อสร้าง\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bố trí đủ nhân lực đúng chuyên môn như đã cam kết; thay thế nhân sự không đạt yêu cầu trong vòng 07 ngày khi có yêu cầu của Bên A.<span class=\"th\" data-t=\"จัดสรรกำลังคนให้เพียงพอและมีความเชี่ยวชาญตรงตามที่ได้ให้คำมั่นไว้ เปลี่ยนตัวบุคลากรที่ไม่ผ่านเกณฑ์ภายใน 07 วันเมื่อฝ่าย A ร้องขอ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Nhân sự phải chấp hành nghiêm nội quy công trường; nếu vi phạm, phải rời khỏi công trường ngay.<span class=\"th\" data-t=\"บุคลากรต้องปฏิบัติตามระเบียบของหน้างานอย่างเคร่งครัด หากฝ่าฝืนต้องออกจากหน้างานทันที\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Lập kế hoạch, tiến độ và biện pháp thi công, gửi Bên A trước khi triển khai.<span class=\"th\" data-t=\"จัดทำแผนงาน กำหนดการ และวิธีการก่อสร้าง และส่งให้ฝ่าย A ก่อนเริ่มดำเนินการ\"></span></p><p class=\"lv0\"><span class=\"lb\">b)</span>Tiến độ thi công và nghiệm thu<span class=\"th\" data-t=\"กำหนดการก่อสร้างและการตรวจรับ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Thi công đúng thiết kế, bản vẽ, biện pháp thi công và các yêu cầu kỹ thuật do Bên A cung cấp; đảm bảo chất lượng, an toàn lao động, phòng cháy chữa cháy, vệ sinh môi trường và tiến độ thực hiện Hợp đồng.<span class=\"th\" data-t=\"ก่อสร้างให้ถูกต้องตามแบบ แปลน วิธีการก่อสร้าง และข้อกำหนดทางเทคนิคที่ฝ่าย A ให้ไว้ รับรองคุณภาพ ความปลอดภัยในการทำงาน การป้องกันและระงับอัคคีภัย สุขอนามัยสิ่งแวดล้อม และกำหนดการปฏิบัติตามสัญญา\"></span></p><p class=\"lv1 bl\"><s
