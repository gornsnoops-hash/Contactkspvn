/span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr></table></div><h3 class=\"ann\" data-n=\"05\"><strong>PHỤ LỤC 05 – HSE VÀ AN TOÀN SINH HỌC</strong><span class=\"th\" data-t=\"ภาคผนวก 05 – HSE และความปลอดภัยทางชีวภาพ\"></span></h3><p>Quy định vào kho, nhà máy, trại; khử trùng xe; giờ nhận hàng; trang bị bảo hộ: <span class=\"fx\" data-k=\"TÀI LIỆU\"></span><span class=\"th\" data-t=\"ระเบียบการเข้าคลังสินค้า โรงงาน ฟาร์ม การฆ่าเชื้อรถ เวลารับสินค้า และอุปกรณ์ป้องกันส่วนบุคคล: 【TÀI LIỆU】\"></span></p>", "s6": "<p class=\"ctr\">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM<span class=\"th\" data-t=\"สาธารณรัฐสังคมนิยมเวียดนาม\"></span></p><p class=\"ctr\">Độc lập - Tự do - Hạnh phúc<span class=\"th\" data-t=\"เอกราช - เสรีภาพ - ความสุข\"></span></p><p class=\"ctr\"><strong>HỢP ĐỒNG MỞ MUA HÀNG HÓA VÀ DỊCH VỤ (BLANKET / OPEN CONTRACT)</strong><span class=\"th\" data-t=\"สัญญาเปิดสำหรับการซื้อสินค้าและบริการ (BLANKET / OPEN CONTRACT)\"></span></p><p class=\"ctr\">Số: <span class=\"fx\" data-k=\"SỐ HỢP ĐỒNG\"></span> | Dự án / PO: <span class=\"fx\" data-k=\"DỰ ÁN / MÃ PO / MÃ KHÁCH HÀNG\"></span><span class=\"th\" data-t=\"เลขที่: 【SỐ HỢP ĐỒNG】 | โครงการ / PO: 【DỰ ÁN / MÃ PO / MÃ KHÁCH HÀNG】\"></span></p><p>– Căn cứ Bộ luật Dân sự số 91/2015/QH13 và văn bản sửa đổi, bổ sung có hiệu lực tại thời điểm ký;<span class=\"th\" data-t=\"– โดยอาศัยประมวลกฎหมายแพ่ง ฉบับที่ 91/2015/QH13 และเอกสารแก้ไข เพิ่มเติมที่มีผลบังคับใช้ ณ เวลาลงนาม;\"></span></p><p>– Căn cứ Luật Thương mại số 36/2005/QH11 và văn bản hướng dẫn;<span class=\"th\" data-t=\"– อาศัยพระราชบัญญัติการพาณิชย์ ฉบับที่ 36/2005/QH11 และเอกสารที่ให้แนวทางปฏิบัติ;\"></span></p><p>– Căn cứ quy định chuyên ngành về chất lượng, an toàn tương ứng với hàng hóa, dịch vụ được mua;<span class=\"th\" data-t=\"– อาศัยกฎระเบียบเฉพาะสาขาว่าด้วยคุณภาพและความปลอดภัยที่เกี่ยวข้องกับสินค้าและบริการที่ซื้อ;\"></span></p><p>– Căn cứ nhu cầu mua dài hạn của Bên A và khả năng cung cấp của Bên B.<span class=\"th\" data-t=\"– อาศัยความต้องการซื้อระยะยาวของฝ่าย A และความสามารถในการจัดหาของฝ่าย B\"></span></p><p>Hôm nay, ngày <span class=\"fx\" data-k=\"NGÀY\"></span> tháng <span class=\"fx\" data-k=\"THÁNG\"></span> năm <span class=\"fx\" data-k=\"NĂM\"></span>, Các Bên gồm:<span class=\"th\" data-t=\"วันนี้ วันที่ 【NGÀY】 เดือน 【THÁNG】 พ.ศ./ค.ศ. 【NĂM】 คู่สัญญาประกอบด้วย:\"></span></p><p class=\"sub\"><strong>BÊN A – BÊN MUA (KSP): CÔNG TY TNHH KSP VIỆT NAM <span class=\"fx\" data-k=\"CHI NHÁNH / ĐƠN VỊ THỰC HIỆN, NẾU CÓ\"></span></strong><span class=\"th\" data-t=\"ฝ่าย A – ผู้ซื้อ (KSP): บริษัท KSP เวียดนาม จำกัด (CÔNG TY TNHH KSP VIỆT NAM) 【CHI NHÁNH / ĐƠN VỊ THỰC HIỆN, NẾU CÓ】\"></span></p><p>Đại diện: <span class=\"fx\" data-k=\"HỌ TÊN NGƯỜI KÝ\"></span> Chức vụ: <span class=\"fx\" data-k=\"CHỨC VỤ\"></span> Căn cứ thẩm quyền: <span class=\"fx\" data-k=\"ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY\"></span><span class=\"th\" data-t=\"ผู้แทน: 【HỌ TÊN NGƯỜI KÝ】 ตำแหน่ง: 【CHỨC VỤ】 ฐานอำนาจ: 【ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY】\"></span></p><p>Địa chỉ: <span class=\"fx\" data-k=\"ĐỊA CHỈ PHÁP LÝ KSP – KIỂM TRA ĐĂNG KÝ HIỆN HÀNH\"></span> Mã số thuế: <span class=\"fx\" data-k=\"MST KSP / CHI NHÁNH\"></span><span class=\"th\" data-t=\"ที่อยู่: 【ĐỊA CHỈ PHÁP LÝ KSP – KIỂM TRA ĐĂNG KÝ HIỆN HÀNH】 เลขประจำตัวผู้เสียภาษี: 【MST KSP / CHI NHÁNH】\"></span></p><p>Tài khoản: <span class=\"fx\" data-k=\"SỐ TÀI KHOẢN / NGÂN HÀNG KSP\"></span> Đại diện nhận thông báo: <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ\"></span> Email: <span class=\"fx\" data-k=\"EMAIL\"></span><span class=\"th\" data-t=\"บัญชี: 【SỐ TÀI KHOẢN / NGÂN HÀNG KSP】 ผู้แทนรับหนังสือแจ้ง: 【HỌ TÊN / CHỨC VỤ】 อีเมล: 【EMAIL】\"></span></p><p class=\"sub\"><strong>BÊN B – NHÀ CUNG CẤP: <span class=\"fx\" data-k=\"TÊN PHÁP LÝ NHÀ CUNG CẤP\"></span></strong><span class=\"th\" data-t=\"ฝ่าย B – ผู้ขาย/ผู้จัดหา: 【TÊN PHÁP LÝ NHÀ CUNG CẤP】\"></span></p><p>Đại diện: <span class=\"fx\" data-k=\"HỌ TÊN NGƯỜI KÝ\"></span> Chức vụ: <span class=\"fx\" data-k=\"CHỨC VỤ\"></span> Căn cứ thẩm quyền: <span class=\"fx\" data-k=\"ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY\"></span><span class=\"th\" data-t=\"ผู้แทน: 【HỌ TÊN NGƯỜI KÝ】 ตำแหน่ง: 【CHỨC VỤ】 ฐานอำนาจ: 【ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY】\"></span></p><p>Địa chỉ: <span class=\"fx\" data-k=\"ĐỊA CHỈ ĐĂNG KÝ\"></span> Mã số thuế / Mã số doanh nghiệp: <span class=\"fx\" data-k=\"MST / GCN ĐKDN\"></span><span class=\"th\" data-t=\"ที่อยู่: 【ĐỊA CHỈ ĐĂNG KÝ】 เลขประจำตัวผู้เสียภาษี / รหัสวิสาหกิจ: 【MST / GCN ĐKDN】\"></span></p><p>Tài khoản: <span class=\"fx\" data-k=\"CHỦ TÀI KHOẢN / SỐ TÀI KHOẢN / NGÂN HÀNG\"></span> Đại diện nhận thông báo: <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ\"></span> Email: <span class=\"fx\" data-k=\"EMAIL\"></span><span class=\"th\" data-t=\"บัญชี: 【CHỦ TÀI KHOẢN / SỐ TÀI KHOẢN / NGÂN HÀNG】 ผู้แทนรับหนังสือแจ้ง: 【HỌ TÊN / CHỨC VỤ】 อีเมล: 【EMAIL】\"></span></p><p>Hai Bên thỏa thuận ký kết hợp đồng mở mua hàng hóa, dịch vụ (“Hợp đồng”) với các điều khoản sau:<span class=\"th\" data-t=\"ทั้งสองฝ่ายตกลงทำสัญญาเปิดสำหรับการซื้อสินค้าและบริการ (“สัญญา”) โดยมีข้อกำหนดดังต่อไปนี้\"></span></p><h3 class=\"art\" data-n=\"1\"><strong>ĐIỀU 1. BẢN CHẤT HỢP ĐỒNG MỞ</strong><span class=\"th\" data-t=\"ข้อ 1. ลักษณะของสัญญาเปิด\"></span></h3><p class=\"lv1\"><span class=\"lb\">1.1</span>Hợp đồng mở này đặt khung điều kiện và đơn giá để Bên A mua hàng hóa, dịch vụ của Bên B theo nhu cầu trong thời hạn hiệu lực. Mỗi đơn đặt hàng (PO) do Bên A phát hành và Bên B xác nhận là một hợp đồng riêng áp dụng điều kiện của Hợp đồng mở này.<span class=\"th\" data-t=\"สัญญาเปิดฉบับนี้กำหนดกรอบเงื่อนไขและราคาต่อหน่วยสำหรับการที่ฝ่าย A ซื้อสินค้าและบริการจากฝ่าย B ตามความต้องการในระหว่างระยะเวลาที่สัญญามีผลใช้บังคับ ใบสั่งซื้อ (PO) แต่ละฉบับที่ฝ่าย A ออกและฝ่าย B ยืนยัน ถือเป็นสัญญาแยกต่างหากซึ่งใช้เงื่อนไขของสัญญาเปิดฉบับนี้\"></span></p><p class=\"lv1\"><span class=\"lb\">1.2</span>Bên A không bị ràng buộc về số lượng, giá trị mua tối thiểu hoặc mua độc quyền, trừ khi Phụ lục 04 quy định rõ; hạn mức dự kiến <span class=\"fx\" data-k=\"SỐ TIỀN\"></span> VNĐ/<span class=\"fx\" data-k=\"NĂM\"></span> chỉ để tham khảo. Bên A có quyền mua cùng loại hàng hóa, dịch vụ từ nhà cung cấp khác.<span class=\"th\" data-t=\"ฝ่าย A ไม่มีข้อผูกพันเรื่องปริมาณ มูลค่าการซื้อขั้นต่ำ หรือการซื้อแต่เพียงผู้เดียว เว้นแต่ภาคผนวก 04 จะกำหนดไว้อย่างชัดเจน วงเงินที่คาดการณ์ 【SỐ TIỀN】 VNĐ/ 【NĂM】 ใช้เพื่อการอ้างอิงเท่านั้น ฝ่าย A มีสิทธิซื้อสินค้าและบริการประเภทเดียวกันจากผู้จัดหารายอื่น\"></span></p><p class=\"lv1\"><span class=\"lb\">1.3</span>Khác với Hợp đồng nguyên tắc (Master/Framework) có cơ chế giữ giá, SLA, bảo đảm tài chính chi tiết, Hợp đồng mở này dùng cho nhu cầu mua lặp lại, giá trị vừa và thấp, rủi ro tiêu chuẩn; khi giá trị PO hoặc rủi ro vượt ngưỡng <span class=\"fx\" data-k=\"SỐ TIỀN\"></span> VNĐ phải dùng hợp đồng riêng theo loại tương ứng.<span class=\"th\" data-t=\"ต่างจากสัญญาหลักแบบกรอบ (Master/Framework) ซึ่งมีกลไกการตรึงราคา SLA และหลักประกันทางการเงินโดยละเอียด สัญญาเปิดฉบับนี้ใช้สำหรับความต้องการซื้อที่เกิดซ้ำ มูลค่าปานกลางและต่ำ และความเสี่ยงมาตรฐาน เมื่อมูลค่าของ PO หรือความเสี่ยงเกินเกณฑ์ 【SỐ TIỀN】 VNĐ ต้องใช้สัญญาแยกต่างหากตามประเภทที่เกี่ยวข้อง\"></span></p><h3 class=\"art\" data-n=\"2\"><strong>ĐIỀU 2. DANH MỤC VÀ BẢNG GIÁ</strong><span class=\"th\" data-t=\"ข้อ 2. รายการสินค้าและตารางราคา\"></span></h3><p class=\"lv1\"><span class=\"lb\">2.1</span>Hàng hóa, dịch vụ và đơn giá tại Phụ lục 01, chưa VAT, <span class=\"fx\" data-k=\"CỐ ĐỊNH / THEO BIÊN ĐỘ\"></span> trong <span class=\"fx\" data-k=\"SỐ\"></span> tháng; giá đã gồm vận chuyển đến <span class=\"fx\" data-k=\"ĐỊA ĐIỂM\"></span> trừ khi PO ghi khác.<span class=\"th\" data-t=\"สินค้า บริการ และราคาต่อหน่วยเป็นไปตามภาคผนวก 01 ไม่รวมภาษีมูลค่าเพิ่ม (VAT) ราคา 【CỐ ĐỊNH / THEO BIÊN ĐỘ】 เป็นเวลา 【SỐ】 เดือน ราคารวมค่าขนส่งไปยัง 【ĐỊA ĐIỂM】 เว้นแต่ PO จะระบุเป็นอย่างอื่น\"></span></p><p class=\"lv1\"><span class=\"lb\">2.2</span>Bên B không được tăng giá đối với PO đã xác nhận. Đề nghị điều chỉnh giá cho PO sau phải gửi bằng văn bản trước <span class=\"fx\" data-k=\"30\"></span> ngày và chỉ có hiệu lực khi hai Bên ký phụ lục giá.<span class=\"th\" data-t=\"ฝ่าย B ไม่มีสิทธิขึ้นราคาสำหรับ PO ที่ยืนยันแล้ว คำขอปรับราคาสำหรับ PO ฉบับต่อ ๆ ไปต้องส่งเป็นลายลักษณ์อักษรล่วงหน้า 【30】 วัน และมีผลใช้บังคับเมื่อทั้งสองฝ่ายลงนามในภาคผนวกราคาเท่านั้น\"></span></p><h3 class=\"art\" data-n=\"3\"><strong>ĐIỀU 3. PO VÀ XÁC NHẬN</strong><span class=\"th\" data-t=\"ข้อ 3. PO และการยืนยัน\"></span></h3><p class=\"lv1\"><span class=\"lb\">3.1</span>PO nêu hàng hóa/dịch vụ, số lượng, địa điểm, thời hạn giao, dự án / khách hàng cuối (nếu có), yêu cầu kỹ thuật và chứng từ.<span class=\"th\" data-t=\"PO ระบุสินค้า/บริการ จำนวน สถานที่ กำหนดส่งมอบ โครงการ / ลูกค้าปลายทาง (ถ้ามี) ข้อกำหนดทางเทคนิค และเอกสาร\"></span></p><p class=\"lv1\"><span class=\"lb\">3.2</span>Bên B xác nhận trong <span class=\"fx\" data-k=\"02\"></span> ngày làm việc. Bên B không xác nhận mà vẫn giao hàng theo PO thì được coi là chấp nhận PO theo điều kiện PO. Bên B chỉ được từ chối PO trong hạn mức năng lực đã cam kết tại Phụ lục 04 khi có lý do chính đáng.<span class=\"th\" data-t=\"ฝ่าย B ต้องยืนยันภายใน 【02】 วันทำการ หากฝ่าย B ไม่ยืนยันแต่ยังคงส่งมอบสินค้าตาม PO ให้ถือว่ายอมรับ PO ตามเงื่อนไขของ PO ฝ่าย B มีสิทธิปฏิเสธ PO ได้เฉพาะภายในวงเงินความสามารถที่ได้ผูกพันไว้ในภาคผนวก 04 และต้องมีเหตุผลอันสมควร\"></span></p><p class=\"lv1\"><span class=\"lb\">3.3</span>Điều kiện bán hàng chung, báo giá, hóa đơn của Bên B không thay thế điều kiện của Hợp đồng mở này.<span class=\"th\" data-t=\"เงื่อนไขการขายทั่วไป ใบเสนอราคา และใบแจ้งหนี้ของฝ่าย B ไม่อาจใช้แทนเงื่อนไขของสัญญาเปิดฉบับนี้\"></span></p><h3 class=\"art\" data-n=\"4\"><strong>ĐIỀU 4. GIAO HÀNG, KIỂM TRA VÀ NGHIỆM THU</strong><span class=\"th\" data-t=\"ข้อ 4. การส่งมอบ การตรวจสอบ และการตรวจรับ\"></span></h3><p class=\"lv1\"><span class=\"lb\">4.1</span>Bên B giao đúng PO về chủng loại, số lượng, chất lượng, thời gian, địa điểm, kèm hóa đơn, phiếu giao hàng, CO/CQ và chứng từ liên quan. Rủi ro chuyển cho Bên A khi nhận và ký biên bản giao nhận; quyền sở hữu chuyển khi nhận hàng, độc lập với việc thanh toán.<span class=\"th\" data-t=\"ฝ่าย B ต้องส่งมอบให้ตรง PO ทั้งในด้านประเภท จำนวน คุณภาพ เวลา และสถานที่ พร้อมใบแจ้งหนี้/ใบกำกับภาษี ใบส่งสินค้า CO/CQ และเอกสารที่เกี่ยวข้อง ความเสี่ยงโอนไปยังฝ่าย A เมื่อฝ่าย A รับสินค้าและลงนามในรายงานการส่งมอบ-รับมอบ กรรมสิทธิ์โอนเมื่อรับสินค้า โดยไม่ขึ้นกับการชำระเงิน\"></span></p><p class=\"lv1\"><span class=\"lb\">4.2</span>Bên A kiểm tra trong <span class=\"fx\" data-k=\"07\"></span> ngày làm việc kể từ ngày nhận; hàng không phù hợp được từ chối, Bên B thay thế hoặc sửa chữa trong <span class=\"fx\" data-k=\"05\"></span> ngày làm việc bằng chi phí của mình, hoặc hoàn tiền nếu đã thanh toán.<span class=\"th\" data-t=\"ฝ่าย A ตรวจสอบภายใน 【07】 วันทำการนับจากวันรับสินค้า สินค้าที่ไม่ตรงตามกำหนดมีสิทธิปฏิเสธได้ ฝ่าย B ต้องเปลี่ยนสินค้าหรือซ่อมแซมภายใน 【05】 วันทำการด้วยค่าใช้จ่ายของตนเอง หรือคืนเงินหากได้ชำระเงินแล้ว\"></span></p><p class=\"lv1\"><span class=\"lb\">4.3</span>Dịch vụ được nghiệm thu bằng biên bản có chữ ký đại diện Bên A; không phản hồi trong <span class=\"fx\" data-k=\"05\"></span> ngày làm việc kể từ khi nhận thông báo hoàn thành và hồ sơ hợp lệ thì dịch vụ đủ điều kiện được coi là nghiệm thu.<span class=\"th\" data-t=\"บริการได้รับการตรวจรับโดยรายงานที่มีลายมือชื่อของตัวแทนฝ่าย A หากไม่มีการตอบกลับภายใน 【05】 วันทำการนับจากวันที่ได้รับหนังสือแจ้งการแล้วเสร็จและเอกสารที่ถูกต้องครบถ้วน ให้ถือว่าบริการที่เข้าเงื่อนไขได้รับการตรวจรับแล้ว\"></span></p><h3 class=\"art\" data-n=\"5\"><strong>ĐIỀU 5. THANH TOÁN</strong><span class=\"th\" data-t=\"ข้อ 5. การชำระเงิน\"></span></h3><p class=\"lv1\"><span class=\"lb\">5.1</span>Thanh toán từng PO trong <span class=\"fx\" data-k=\"30 / 45 / 60\"></span> ngày kể từ khi Bên A nhận đủ hàng/dịch vụ được nghiệm thu và hóa đơn điện tử hợp lệ (Nghị định 123/2020/NĐ-CP), chuyển khoản VNĐ vào tài khoản đã đăng ký tại phần đầu hợp đồng. Thay đổi tài khoản phải có văn bản xác nhận của người đại diện hợp pháp của Bên B.<span class=\"th\" data-t=\"การชำระเงินสำหรับแต่ละ PO ภายใน 【30 / 45 / 60】 วัน นับแต่วันที่ฝ่าย A ได้รับสินค้า/บริการที่ผ่านการตรวจรับครบถ้วนและใบแจ้งหนี้อิเล็กทรอนิกส์ที่ถูกต้อง (Nghị định 123/2020/NĐ-CP) โดยโอนเงิน VNĐ เข้าบัญชีที่ลงทะเบียนไว้ในส่วนต้นของสัญญา การเปลี่ยนแปลงบัญชีต้องมีหนังสือยืนยันจากผู้แทนโดยชอบด้วยกฎหมายของฝ่าย B\"></span></p><p class=\"lv1\"><span class=\"lb\">5.2</span>Bên A được khấu trừ phạt, bồi thường, chi phí khắc phục đã xác định vào khoản thanh toán; phần không tranh chấp vẫn thanh toán đúng hạn.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิหักค่าปรับ ค่าชดใช้ค่าเสียหาย และค่าใช้จ่ายในการแก้ไขที่ได้ระบุจำนวนแน่นอนแล้วออกจากเงินที่ต้องชำระ ส่วนที่ไม่มีข้อพิพาทยังคงต้องชำระตามกำหนด\"></span></p><p class=\"lv1\"><span class=\"lb\">5.3</span>Tạm ứng chỉ áp dụng khi PO ghi rõ và Bên B có bảo lãnh của ngân hàng hoạt động hợp pháp tại Việt Nam cho khoản tạm ứng.<span class=\"th\" data-t=\"เงินล่วงหน้าจะใช้ได้ต่อเมื่อ PO ระบุไว้อย่างชัดเจน และฝ่าย B มีหนังสือค้ำประกันจากธนาคารที่ประกอบกิจการโดยชอบด้วยกฎหมายในประเทศเวียดนามสำหรับเงินล่วงหน้านั้น\"></span></p><h3 class=\"art\" data-n=\"6\"><strong>ĐIỀU 6. BẢO HÀNH VÀ CHẤT LƯỢNG</strong><span class=\"th\" data-t=\"ข้อ 6. การรับประกันและคุณภาพ\"></span></h3><p class=\"lv1\"><span class=\"lb\">6.1</span>Bên B bảo đảm hàng hóa mới, đúng thông số, đúng xuất xứ, không vi phạm quyền sở hữu trí tuệ, không có quyền của bên thứ ba; bảo hành <span class=\"fx\" data-k=\"12\"></span> tháng kể từ ngày nghiệm thu hoặc theo PO nếu dài hơn, và không ngắn hơn thời hạn KSP phải bảo hành cho khách hàng (nếu PO thuộc dự án, theo Điều 10).<span class=\"th\" data-t=\"ฝ่าย B รับรองว่าสินค้าเป็นของใหม่ ตรงตามข้อกำหนด ตรงตามแหล่งกำเนิด ไม่ละเมิดสิทธิในทรัพย์สินทางปัญญา และไม่มีสิทธิของบุคคลภายนอก รับประกันเป็นเวลา 【12】 เดือน นับจากวันตรวจรับ หรือตาม PO หากนานกว่า และต้องไม่สั้นกว่าระยะเวลาที่ KSP ต้องรับประกันแก่ลูกค้า (หาก PO เป็นของโครงการ ตามข้อ 10)\"></span></p><p class=\"lv1\"><span class=\"lb\">6.2</span>Trong thời hạn bảo hành, Bên B khắc phục trong <span class=\"fx\" data-k=\"07\"></span> ngày kể từ thông báo; chậm thì Bên A được thuê bên khác, chi phí do Bên B chịu. Phần sửa chữa, thay thế được bảo hành lại <span class=\"fx\" data-k=\"SỐ\"></span> tháng hoặc đến hết bảo hành ban đầu, theo thời điểm muộn hơn.<span class=\"th\" data-t=\"ในระหว่างระยะเวลารับประกัน ฝ่าย B ต้องแก้ไขภายใน 【07】 วัน นับแต่วันที่ได้รับหนังสือแจ้ง หากล่าช้า ฝ่าย A มีสิทธิจ้างบุคคลอื่นดำเนินการ โดยค่าใช้จ่ายเป็นของฝ่าย B ส่วนที่ซ่อมแซมหรือเปลี่ยนใหม่ได้รับการรับประกันใหม่เป็นเวลา 【SỐ】 เดือน หรือจนสิ้นสุดระยะเวลารับประกันเดิม แล้วแต่กำหนดเวลาใดจะสิ้นสุดภายหลัง\"></span></p><h3 class=\"art\" data-n=\"7\"><strong>ĐIỀU 7. PHẠT VI PHẠM VÀ BỒI THƯỜNG</strong><span class=\"th\" data-t=\"ข้อ 7. ค่าปรับตามสัญญาและการชดใช้ค่าเสียหาย\"></span></h3><p class=\"lv1\"><span class=\"lb\">7.1</span>Giao chậm: Bên B phạt <span class=\"fx\" data-k=\"0,1\"></span>%/ngày trên giá trị phần giao chậm, tối đa <span class=\"fx\" data-k=\"8\"></span>% giá trị phần nghĩa vụ bị vi phạm (Điều 301 Luật Thương mại 2005 nếu áp dụng; xác nhận quy định hiện hành khi ký). Chậm thanh toán: Bên A chịu lãi <span class=\"fx\" data-k=\"\"></span>%/năm trên số tiền chậm.<span class=\"th\" data-t=\"ส่งมอบล่าช้า: ฝ่าย B ต้องชำระค่าปรับ 【0,1】 %/วัน ของมูลค่าส่วนที่ส่งมอบล่าช้า สูงสุดไม่เกิน 【8】 % ของมูลค่าส่วนภาระผูกพันที่ถูกละเมิด (มาตรา 301 แห่งกฎหมายการพาณิชย์ ค.ศ. 2005 หากมีผลใช้บังคับ ให้ตรวจสอบบทบัญญัติที่มีผลใช้บังคับในปัจจุบันเมื่อลงนาม) ชำระเงินล่าช้า: ฝ่าย A ต้องรับผิดชำระดอกเบี้ย 【】 %/ปี ของจำนวนเงินที่ชำระล่าช้า\"></span></p><p class=\"lv1\"><span class=\"lb\">7.2</span>Ngoài phạt, Bên B bồi thường thiệt hại thực tế, kể cả khoản phạt, bồi thường Bên A phải trả cho khách hàng do lỗi của Bên B (nếu PO thuộc dự án) theo Điều 10, có chứng từ.<span class=\"th\" data-t=\"นอกจากค่าปรับ ฝ่าย B ต้องชดใช้ค่าเสียหายที่เกิดขึ้นจริง รวมถึงค่าปรับและค่าชดใช้ที่ฝ่าย A ต้องชำระแก่ลูกค้าอันเนื่องมาจากความผิดของฝ่าย B (หาก PO เป็นของโครงการ) ตามข้อ 10 โดยมีเอกสารหลักฐาน\"></span></p><p class=\"lv1\"><span class=\"lb\">7.3</span>Tổng trách nhiệm của Bên A không vượt quá giá trị PO liên quan; tổng trách nhiệm của Bên B không giới hạn đối với trường hợp cố ý, gian lận, vi phạm pháp luật, vi phạm bảo mật, hối lộ, thương tích, thiệt hại tài sản của bên thứ ba.<span class=\"th\" data-t=\"ความรับผิดรวมของฝ่าย A ต้องไม่เกินมูลค่าของ PO ที่เกี่ยวข้อง ความรับผิดรวมของฝ่าย B ไม่จำกัดในกรณีกระทำโดยเจตนา การฉ้อฉล การฝ่าฝืนกฎหมาย การละเมิดการรักษาความลับ การให้สินบน การบาดเจ็บ และความเสียหายต่อทรัพย์สินของบุคคลภายนอก\"></span></p><h3 class=\"art\" data-n=\"8\"><strong>ĐIỀU 8. THỜI HẠN VÀ CHẤM DỨT</strong><span class=\"th\" data-t=\"ข้อ 8. ระยะเวลาและการเลิกสัญญา\"></span></h3><p class=\"lv1\"><span class=\"lb\">8.1</span>Hợp đồng mở có hiệu lực <span class=\"fx\" data-k=\"SỐ\"></span> tháng từ <span class=\"fx\" data-k=\"NGÀY\"></span>; gia hạn bằng thỏa thuận bằng văn bản hoặc tự động <span class=\"fx\" data-k=\"SỐ\"></span> tháng nếu không bên nào thông báo trước <span class=\"fx\" data-k=\"60\"></span> ngày.<span class=\"th\" data-t=\"สัญญาเปิดมีผลใช้บังคับ 【SỐ】 เดือน นับจาก 【NGÀY】 ต่ออายุได้โดยข้อตกลงเป็นลายลักษณ์อักษร หรือต่ออายุโดยอัตโนมัติครั้งละ 【SỐ】 เดือน หากไม่มีฝ่ายใดแจ้งล่วงหน้า 【60】 วัน\"></span></p><p class=\"lv1\"><span class=\"lb\">8.2</span>Bên A có quyền chấm dứt không cần lý do với thông báo trước <span class=\"fx\" data-k=\"30\"></span> ngày; PO đã xác nhận trước ngày chấm dứt được thực hiện hoặc thanh toán chi phí hợp lý đã phát sinh, tối đa giá trị PO chưa giao. Mỗi Bên chấm dứt khi Bên kia vi phạm nghiêm trọng không khắc phục trong <span class=\"fx\" data-k=\"15\"></span> ngày kể từ thông báo.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิเลิกสัญญาโดยไม่ต้องระบุเหตุผลโดยแจ้งล่วงหน้า 【30】 วัน PO ที่ยืนยันก่อนวันเลิกสัญญาต้องได้รับการปฏิบัติหรือชำระค่าใช้จ่ายอันสมควรที่เกิดขึ้นแล้ว สูงสุดไม่เกินมูลค่า PO ส่วนที่ยังไม่ได้ส่งมอบ แต่ละฝ่ายมีสิทธิเลิกสัญญาเมื่ออีกฝ่ายหนึ่งผิดสัญญาอย่างร้ายแรงและไม่แก้ไขภายใน 【15】 วัน นับแต่วันที่ได้รับหนังสือแจ้ง\"></span></p><h3 class=\"art\" data-n=\"9\"><strong>ĐIỀU 9. BẤT KHẢ KHÁNG</strong><span class=\"th\" data-t=\"ข้อ 9. เหตุสุดวิสัย\"></span></h3><p class=\"lv1\"><span class=\"lb\">9.1</span>Bất khả kháng là sự kiện xảy ra một cách khách quan không thể lường trước và không thể khắc phục được mặc dù đã áp dụng mọi biện pháp cần thiết và khả năng cho phép (Điều 156 Bộ luật Dân sự 2015), kể cả thiên tai, dịch bệnh, chiến tranh, quyết định của cơ quan nhà nước có thẩm quyền làm cấm hoặc đình chỉ việc thực hiện hợp đồng.<span class=\"th\" data-t=\"เหตุสุดวิสัยคือเหตุการณ์ที่เกิดขึ้นโดยปรากฏชัดแจ้งตามวัตถุวิสัย ไม่อาจคาดการณ์ได้ และไม่อาจแก้ไขได้ แม้ได้ใช้มาตรการทุกอย่างที่จำเป็นและเท่าที่ความสามารถอำนวยแล้ว (มาตรา 156 ประมวลกฎหมายแพ่ง ค.ศ. 2015) รวมถึงภัยธรรมชาติ โรคระบาด สงคราม และคำสั่งของหน่วยงานของรัฐที่มีอำนาจที่ห้ามหรือระงับการปฏิบัติตามสัญญา\"></span></p><p class=\"lv1\"><span class=\"lb\">9.2</span>Bên bị ảnh hưởng phải thông báo bằng văn bản cho Bên kia trong <span class=\"fx\" data-k=\"07\"></span> ngày kể từ ngày sự kiện xảy ra, kèm chứng cứ (xác nhận của cơ quan có thẩm quyền nếu có), áp dụng mọi biện pháp hợp lý để hạn chế thiệt hại và nối lại việc thực hiện ngay khi có thể. Thông báo chậm làm Bên bị ảnh hưởng mất quyền miễn trách nhiệm đối với phần thiệt hại phát sinh do chậm thông báo.<span class=\"th\" data-t=\"ฝ่ายที่ได้รับผลกระทบต้องแจ้งเป็นลายลักษณ์อักษรให้อีกฝ่ายทราบภายใน 【07】 วัน นับจากวันที่เหตุการณ์เกิดขึ้น พร้อมพยานหลักฐาน (การรับรองจากหน่วยงานที่มีอำนาจ หากมี) ใช้มาตรการที่สมเหตุสมผลทุกอย่างเพื่อลดความเสียหาย และกลับมาปฏิบัติตามสัญญาโดยเร็วที่สุดเท่าที่ทำได้ การแจ้งล่าช้าทำให้ฝ่ายที่ได้รับผลกระทบสูญเสียสิทธิในการได้รับยกเว้นความรับผิดสำหรับความเสียหายที่เกิดจากการแจ้งล่าช้า\"></span></p><p class=\"lv1\"><span class=\"lb\">9.3</span>Không được coi là bất khả kháng: khó khăn tài chính, biến động giá, thiếu nhân công, vật tư, phương tiện; lỗi của nhà thầu phụ, nhà cung cấp, nhà vận chuyển của Bên vi phạm, trừ khi chính họ gặp sự kiện bất khả kháng đáp ứng định nghĩa trên.<span class=\"th\" data-t=\"ไม่ถือเป็นเหตุสุดวิสัย: ความยากลำบากทางการเงิน ความผันผวนของราคา การขาดแคลนแรงงาน วัสดุ และยานพาหนะ; ความผิดของผู้รับเหมาช่วง ผู้จัดหา ผู้ขนส่งของฝ่ายที่ผิดสัญญา เว้นแต่บุคคลเหล่านั้นประสบเหตุสุดวิสัยที่เข้าตามคำนิยามข้างต้น\"></span></p><p class=\"lv1\"><span class=\"lb\">9.4</span>Nếu sự kiện bất khả kháng kéo dài quá <span class=\"fx\" data-k=\"60\"></span> ngày liên tục, Các Bên thương lượng phương án tiếp tục hoặc chấm dứt. Nếu không thỏa thuận được, mỗi Bên có quyền chấm dứt phần hợp đồng bị ảnh hưởng bằng thông báo trước <span class=\"fx\" data-k=\"15\"></span> ngày; phần đã thực hiện đúng hợp đồng được thanh toán, không bên nào phải chịu phạt vi phạm.<span class=\"th\" data-t=\"หากเหตุสุดวิสัยดำเนินต่อเนื่องเกิน 【60】 วัน ทั้งสองฝ่ายต้องเจรจาแนวทางดำเนินการต่อหรือเลิกสัญญา หากตกลงกันไม่ได้ แต่ละฝ่ายมีสิทธิเลิกสัญญาในส่วนที่ได้รับผลกระทบโดยแจ้งล่วงหน้า 【15】 วัน; ส่วนที่ได้ดำเนินการถูกต้องตามสัญญาแล้วจะได้รับการชำระเงิน และไม่ฝ่ายใดต้องรับผิดค่าปรับตามสัญญา\"></span></p><h3 class=\"art\" data-n=\"10\"><strong>ĐIỀU 10. ĐỐI CHIẾU VỚI HỢP ĐỒNG KHÁCH HÀNG CỦA KSP (BACK-TO-BACK)</strong><span class=\"th\" data-t=\"ข้อ 10. การเทียบเคียงกับสัญญาลูกค้าของ KSP (BACK-TO-BACK)\"></span></h3><p class=\"lv1\"><span class=\"lb\">10.1</span>Với PO thuộc dự án / hợp đồng bán của KSP, PO nêu số hợp đồng, khách hàng cuối (nếu KSP cho phép tiết lộ), thời hạn giao, bảo hành, yêu cầu kỹ thuật, chứng từ, HSE. Bên B xác nhận PO thì đồng ý các yêu cầu đó là điều kiện thực hiện.<span class=\"th\" data-t=\"สำหรับ PO ที่เป็นของโครงการ / สัญญาขายของ KSP PO ระบุเลขที่สัญญา ลูกค้าปลายทาง (หาก KSP อนุญาตให้เปิดเผย) กำหนดส่งมอบ การรับประกัน ข้อกำหนดทางเทคนิค เอกสาร และ HSE เมื่อฝ่าย B ยืนยัน PO ถือว่าฝ่าย B ตกลงตามข้อกำหนดดังกล่าวเป็นเงื่อนไขในการปฏิบัติงาน\"></span></p><p class=\"lv1\"><span class=\"lb\">10.2</span>Thời hạn bảo hành và thời điểm bắt đầu bảo hành của Bên B phải bao phủ thời hạn KSP cam kết với khách hàng; nếu có chênh lệch, hai Bên thỏa thuận biện pháp bảo đảm bằng văn bản (kéo dài bảo hành, bảo lãnh, giữ lại).<span class=\"th\" data-t=\"ระยะเวลารับประกันและวันเริ่มต้นการรับประกันของฝ่าย B ต้องครอบคลุมระยะเวลาที่ KSP ผูกพันไว้กับลูกค้า หากมีความแตกต่าง ทั้งสองฝ่ายตกลงมาตรการประกันเป็นลายลักษณ์อักษร (ขยายระยะเวลารับประกัน หนังสือค้ำประกัน เงินประกันผลงานที่กักไว้ (Retention))\"></span></p><p class=\"lv1\"><span class=\"lb\">10.3</span>Yêu cầu của khách hàng đối với phần hàng hóa, dịch vụ của Bên B được chuyển cho Bên B thực hiện trong thời hạn tương ứng; Bên B không có quyền yêu cầu thanh toán thêm khi yêu cầu nằm trong phạm vi hợp đồng.<span class=\"th\" data-t=\"ข้อกำหนดของลูกค้าที่เกี่ยวกับส่วนของสินค้าและบริการของฝ่าย B จะถูกส่งต่อให้ฝ่าย B ปฏิบัติภายในกำหนดเวลาที่สอดคล้องกัน ฝ่าย B ไม่มีสิทธิเรียกร้องค่าตอบแทนเพิ่มเติมเมื่อข้อกำหนดนั้นอยู่ในขอบเขตของสัญญา\"></span></p><h3 class=\"art\" data-n=\"11\"><strong>ĐIỀU 11. BẢO MẬT, SỞ HỮU TRÍ TUỆ VÀ BẢO VỆ DỮ LIỆU CÁ NHÂN</strong><span class=\"th\" data-t=\"ข้อ 11 การรักษาความลับ ทรัพย์สินทางปัญญา และการคุ้มครองข้อมูลส่วนบุคคล\"></span></h3><p class=\"lv1\"><span class=\"lb\">11.1</span>Mỗi Bên giữ bí mật thông tin kỹ thuật, giá, tài liệu và thông tin kinh doanh của Bên kia nhận được liên quan đến hợp đồng; chỉ sử dụng cho mục đích thực hiện hợp đồng và chỉ tiết lộ cho nhân sự, tư vấn, ngân hàng, bảo hiểm cần biết hoặc khi cơ quan nhà nước có thẩm quyền yêu cầu theo luật.<span class=\"th\" data-t=\"แต่ละฝ่ายต้องรักษาความลับของข้อมูลทางเทคนิค ราคา เอกสาร และข้อมูลทางธุรกิจของอีกฝ่ายที่ได้รับเกี่ยวกับสัญญา ใช้เพื่อวัตถุประสงค์ในการปฏิบัติตามสัญญาเท่านั้น และเปิดเผยเฉพาะแก่บุคลากร ที่ปรึกษา ธนาคาร บริษัทประกันภัยที่จำเป็นต้องรู้ หรือเมื่อหน่วยงานของรัฐที่มีอำนาจเรียกร้องตามกฎหมาย\"></span></p><p class=\"lv1\"><span class=\"lb\">11.2</span>Nghĩa vụ bảo mật kéo dài <span class=\"fx\" data-k=\"03\"></span> năm sau khi hợp đồng chấm dứt hoặc hết hiệu lực. Quyền sở hữu trí tuệ đối với tài liệu, bản vẽ, phần mềm của mỗi Bên không chuyển giao, trừ phạm vi được cấp phép sử dụng để thực hiện và sử dụng sản phẩm của hợp đồng.<span class=\"th\" data-t=\"ภาระผูกพันในการรักษาความลับมีผลต่อเนื่อง 【03】 ปี หลังสัญญาเลิกหรือสิ้นผลบังคับ สิทธิในทรัพย์สินทางปัญญาในเอกสาร แบบ และซอฟต์แวร์ของแต่ละฝ่ายไม่โอนให้กัน เว้นแต่ขอบเขตที่ได้รับอนุญาตให้ใช้เพื่อปฏิบัติตามสัญญาและใช้ผลิตภัณฑ์ของสัญญา\"></span></p><p class=\"lv1\"><span class=\"lb\">11.3</span>Khi xử lý dữ liệu cá nhân của người lao động, đại diện, đầu mối của Bên kia, mỗi Bên tuân thủ pháp luật về bảo vệ dữ liệu cá nhân (Nghị định 13/2023/NĐ-CP và văn bản thay thế, sửa đổi nếu có), chỉ xử lý trong phạm vi cần thiết cho hợp đồng.<span class=\"th\" data-t=\"เมื่อประมวลผลข้อมูลส่วนบุคคลของลูกจ้าง ผู้แทน และผู้ประสานงานของอีกฝ่าย แต่ละฝ่ายต้องปฏิบัติตามกฎหมายว่าด้วยการคุ้มครองข้อมูลส่วนบุคคล (พระราชกฤษฎีกา ฉบับที่ 13/2023/NĐ-CP และเอกสารที่ใช้แทนหรือแก้ไขเพิ่มเติม หากมี) และประมวลผลเฉพาะในขอบเขตที่จำเป็นสำหรับสัญญา\"></span></p><h3 class=\"art\" data-n=\"12\"><strong>ĐIỀU 12. TUÂN THỦ PHÁP LUẬT, CHỐNG HỐI LỘ VÀ XUNG ĐỘT LỢI ÍCH</strong><span class=\"th\" data-t=\"ข้อ 12 การปฏิบัติตามกฎหมาย การต่อต้านการให้สินบน และความขัดแย้งทางผลประโยชน์\"></span></h3><p class=\"lv1\"><span class=\"lb\">12.1</span>Các Bên tuân thủ pháp luật Việt Nam về thuế, hóa đơn, lao động, môi trường, an toàn, cạnh tranh và phòng chống tham nhũng, hối lộ.<span class=\"th\" data-t=\"ทั้งสองฝ่ายปฏิบัติตามกฎหมายเวียดนามว่าด้วยภาษี ใบกำกับภาษี แรงงาน สิ่งแวดล้อม ความปลอดภัย การแข่งขัน และการป้องกันและต่อต้านการทุจริตและการให้สินบน\"></span></p><p class=\"lv1\"><span class=\"lb\">12.2</span>Không bên nào được đưa, đề nghị, nhận tiền, quà tặng hoặc lợi ích bất chính cho hoặc từ nhân sự của Bên kia, khách hàng hoặc bên thứ ba để có lợi thế trong hợp đồng; vi phạm là vi phạm nghiêm trọng, Bên bị vi phạm có quyền chấm dứt hợp đồng ngay bằng văn bản.<span class=\"th\" data-t=\"ห้ามฝ่ายใดให้ เสนอ หรือรับเงิน ของขวัญ หรือผลประโยชน์ที่มิชอบ แก่หรือจากบุคลากรของอีกฝ่าย ลูกค้า หรือบุคคลที่สาม เพื่อให้ได้เปรียบในสัญญา; การฝ่าฝืนถือเป็นการผิดสัญญาอย่างร้ายแรง ฝ่ายที่ถูกละเมิดมีสิทธิเลิกสัญญาทันทีโดยหนังสือเป็นลายลักษณ์อักษร\"></span></p><p class=\"lv1\"><span class=\"lb\">12.3</span>Mỗi Bên thông báo ngay cho Bên kia khi có xung đột lợi ích thực tế hoặc tiềm ẩn liên quan đến người tham gia ký kết, đánh giá, nghiệm thu hợp đồng.<span class=\"th\" data-t=\"แต่ละฝ่ายต้องแจ้งให้อีกฝ่ายทราบทันทีเมื่อมีความขัดแย้งทางผลประโยชน์ที่เกิดขึ้นจริงหรืออาจเกิดขึ้น เกี่ยวกับผู้ที่เข้าร่วมการลงนาม การประเมิน และการตรวจรับสัญญา\"></span></p><h3 class=\"art\" data-n=\"13\"><strong>ĐIỀU 13. LUẬT ÁP DỤNG VÀ GIẢI QUYẾT TRANH CHẤP</strong><span class=\"th\" data-t=\"ข้อ 13 กฎหมายที่ใช้บังคับและการระงับข้อพิพาท\"></span></h3><p class=\"lv1\"><span class=\"lb\">13.1</span>Hợp đồng chịu sự điều chỉnh của pháp luật Việt Nam.<span class=\"th\" data-t=\"สัญญานี้อยู่ภายใต้บังคับของกฎหมายเวียดนาม\"></span></p><p class=\"lv1\"><span class=\"lb\">13.2</span>Tranh chấp được giải quyết trước hết bằng thương lượng, hòa giải thiện chí trong <span class=\"fx\" data-k=\"30\"></span> ngày kể từ ngày một Bên gửi thông báo tranh chấp bằng văn bản nêu rõ nội dung, căn cứ và yêu cầu.<span class=\"th\" data-t=\"ข้อพิพาทให้ระงับเป็นลำดับแรกโดยการเจรจาและไกล่เกลี่ยด้วยความสุจริตภายใน 【30】 วัน นับจากวันที่ฝ่ายหนึ่งส่งหนังสือแจ้งข้อพิพาทเป็นลายลักษณ์อักษรระบุเนื้อหา ฐาน และข้อเรียกร้องอย่างชัดเจน\"></span></p><p class=\"lv1\"><span class=\"lb\">13.3</span>Nếu không giải quyết được, tranh chấp được đưa ra (chỉ chọn một): <span class=\"fx\" data-k=\"TÒA ÁN NHÂN DÂN CÓ THẨM QUYỀN TẠI (TỈNH/THÀNH PHỐ) / TRUNG TÂM TRỌNG TÀI QUỐC TẾ VIỆT NAM (VIAC), LUẬT TỐ TỤNG VIAC, 01 TRỌNG TÀI VIÊN, TRỤ SỞ TRỌNG TÀI TẠI (ĐỊA ĐIỂM), NGÔN NGỮ TIẾNG VIỆT\"></span>. Nếu chọn trọng tài, thỏa thuận này là thỏa thuận trọng tài độc lập, phán quyết là chung thẩm.<span class=\"th\" data-t=\"หากระงับไม่ได้ ให้นำข้อพิพาทเสนอต่อ (เลือกเพียงอย่างเดียว): 【TÒA ÁN NHÂN DÂN CÓ THẨM QUYỀN TẠI (TỈNH/THÀNH PHỐ) / TRUNG TÂM TRỌNG TÀI QUỐC TẾ VIỆT NAM (VIAC), LUẬT TỐ TỤNG VIAC, 01 TRỌNG TÀI VIÊN, TRỤ SỞ TRỌNG TÀI TẠI (ĐỊA ĐIỂM), NGÔN NGỮ TIẾNG VIỆT】 หากเลือกอนุญาโตตุลาการ ข้อตกลงนี้เป็นข้อตกลงอนุญาโตตุลาการที่เป็นอิสระ และคำชี้ขาดเป็นที่สุด\"></span></p><p class=\"lv1\"><span class=\"lb\">13.4</span>Trong thời gian giải quyết tranh chấp, Các Bên tiếp tục thực hiện các phần nghĩa vụ không bị tranh chấp.<span class=\"th\" data-t=\"ในระหว่างการระงับข้อพิพาท ทั้งสองฝ่ายต้องปฏิบัติตามภาระผูกพันในส่วนที่ไม่มีข้อพิพาทต่อไป\"></span></p><p class=\"lv1\"><span class=\"lb\">13.5</span>Hợp đồng lập bằng tiếng Việt. Bản dịch sang tiếng Anh hoặc tiếng Thái (nếu có) chỉ để tham khảo; khi có khác biệt, bản tiếng Việt có giá trị áp dụng.<span class=\"th\" data-t=\"สัญญาจัดทำเป็นภาษาเวียดนาม ฉบับแปลเป็นภาษาอังกฤษหรือภาษาไทย (หากมี) ใช้เพื่อการอ้างอิงเท่านั้น หากมีความแตกต่าง ให้ถือฉบับภาษาเวียดนามเป็นฉบับที่ใช้บังคับ\"></span></p><h3 class=\"art\" data-n=\"14\"><strong>ĐIỀU 14. ĐIỀU KHOẢN CHUNG VÀ HIỆU LỰC</strong><span class=\"th\" data-t=\"ข้อ 14 ข้อกำหนดทั่วไปและการมีผลบังคับ\"></span></h3><p class=\"lv1\"><span class=\"lb\">14.1</span>Thông báo phải bằng văn bản, gửi tới địa chỉ, email của đại diện nhận thông báo nêu ở phần đầu Hợp đồng (hoặc địa chỉ được thông báo thay đổi bằng văn bản). Thông báo gửi bằng email có hiệu lực khi hệ thống không báo lỗi và đã gửi bản gốc trong <span class=\"fx\" data-k=\"05\"></span> ngày làm việc nếu Bên nhận yêu cầu.<span class=\"th\" data-t=\"การแจ้งต้องเป็นลายลักษณ์อักษร ส่งไปยังที่อยู่และอีเมลของผู้แทนผู้รับแจ้งที่ระบุไว้ในส่วนต้นของสัญญา (หรือที่อยู่ที่แจ้งเปลี่ยนแปลงเป็นลายลักษณ์อักษร) การแจ้งทางอีเมลมีผลเมื่อระบบไม่แจ้งข้อผิดพลาด และได้ส่งฉบับจริงภายใน 【05】 วันทำการ หากฝ่ายผู้รับร้องขอ\"></span></p><p class=\"lv1\"><span class=\"lb\">14.2</span>Không bên nào được chuyển nhượng quyền, nghĩa vụ theo hợp đồng cho bên thứ ba khi chưa có chấp thuận bằng văn bản của Bên kia, trừ quyền nhận tiền được chuyển nhượng theo quy định pháp luật và thông báo cho Bên có nghĩa vụ.<span class=\"th\" data-t=\"ห้ามฝ่ายใดโอนสิทธิและภาระผูกพันตามสัญญาให้บุคคลที่สามโดยยังไม่ได้รับความยินยอมเป็นลายลักษณ์อักษรจากอีกฝ่าย เว้นแต่สิทธิในการรับเงินที่โอนได้ตามกฎหมายและแจ้งให้ฝ่ายที่มีหน้าที่ทราบ\"></span></p><p class=\"lv1\"><span class=\"lb\">14.3</span>Mọi sửa đổi, bổ sung chỉ có hiệu lực khi lập thành văn bản có chữ ký của người có thẩm quyền của cả hai Bên. Phụ lục là một phần không tách rời; khi có mâu thuẫn, thứ tự ưu tiên: (i) Phụ lục điều kiện đặc biệt được hai Bên ký, (ii) nội dung Hợp đồng, (iii) các Phụ lục còn lại.<span class=\"th\" data-t=\"การแก้ไขเพิ่มเติมทั้งหมดมีผลต่อเมื่อจัดทำเป็นลายลักษณ์อักษรและมีลายมือชื่อของผู้มีอำนาจของทั้งสองฝ่าย ภาคผนวกเป็นส่วนหนึ่งของสัญญาที่แยกจากกันไม่ได้ เมื่อมีความขัดแย้งให้ใช้ลำดับความสำคัญดังนี้: (i) ภาคผนวกเงื่อนไขพิเศษที่ทั้งสองฝ่ายลงนาม (ii) เนื้อหาของสัญญา (iii) ภาคผนวกอื่น ๆ\"></span></p><p class=\"lv1\"><span class=\"lb\">14.4</span>Nếu một điều khoản bị tuyên vô hiệu hoặc không thể thi hành, các điều khoản còn lại vẫn có hiệu lực; Các Bên thương lượng điều khoản thay thế gần nhất với ý chí ban đầu.<span class=\"th\" data-t=\"หากข้อกำหนดใดถูกวินิจฉัยว่าเป็นโมฆะหรือไม่อาจบังคับใช้ได้ ข้อกำหนดที่เหลือยังคงมีผลบังคับ; ทั้งสองฝ่ายต้องเจรจาข้อกำหนดทดแทนที่ใกล้เคียงกับเจตนารมณ์เดิมมากที่สุด\"></span></p><p class=\"lv1\"><span class=\"lb\">14.5</span>Hợp đồng có hiệu lực từ ngày <span class=\"fx\" data-k=\"NGÀY KÝ / ĐIỀU KIỆN CÓ HIỆU LỰC\"></span>, lập thành <span class=\"fx\" data-k=\"04\"></span> bản có giá trị như nhau, mỗi Bên giữ <span class=\"fx\" data-k=\"02\"></span> bản.<span class=\"th\" data-t=\"สัญญามีผลตั้งแต่วันที่ 【NGÀY KÝ / ĐIỀU KIỆN CÓ HIỆU LỰC】 จัดทำเป็น 【04】 ฉบับ มีค่าเท่ากัน โดยแต่ละฝ่ายเก็บไว้ 【02】 ฉบับ\"></span></p><div class=\"tw2\"><table class=\"ct\"><tr><th>ĐẠI DIỆN BÊN A<span class=\"th\" data-t=\"ผู้แทนฝ่าย A\"></span></th><th>ĐẠI DIỆN BÊN B<span class=\"th\" data-t=\"ผู้แทนฝ่าย B\"></span></th></tr><tr><td>(Ký, ghi rõ họ tên, chức danh, đóng dấu nếu có) <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ / NGÀY\"></span><span class=\"th\" data-t=\"(ลงนาม ระบุชื่อ-นามสกุล ตำแหน่ง และประทับตราหากมี) 【HỌ TÊN / CHỨC VỤ / NGÀY】\"></span></td><td>(Ký, ghi rõ họ tên, chức danh, đóng dấu nếu có) <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ / NGÀY\"></span><span class=\"th\" data-t=\"(ลงนาม ระบุชื่อ-นามสกุล ตำแหน่ง และประทับตราหากมี) 【HỌ TÊN / CHỨC VỤ / NGÀY】\"></span></td></tr></table></div><h3 class=\"ann\" data-n=\"01\"><strong>PHỤ LỤC 01 – BẢNG GIÁ HÀNG HÓA, DỊCH VỤ</strong><span class=\"th\" data-t=\"ภาคผนวก 01 – ตารางราคาสินค้าและบริการ\"></span></h3><div class=\"tw2\"><table class=\"ct\"><tr><th>STT<span class=\"th\" data-t=\"ลำดับ\"></span></th><th>Hàng hóa / dịch vụ<span class=\"th\" data-t=\"สินค้า / บริการ\"></span></th><th>Quy cách / tiêu chuẩn<span class=\"th\" data-t=\"ข้อกำหนดจำเพาะ / มาตรฐาน\"></span></th><th>Đơn vị<span class=\"th\" data-t=\"หน่วย\"></span></th><th>Đơn giá (VNĐ)<span class=\"th\" data-t=\"ราคาต่อหน่วย (VNĐ)\"></span></th><th>Hiệu lực giá đến<span class=\"th\" data-t=\"ราคามีผลถึง\"></span></th><th>Thời gian giao tối đa<span class=\"th\" data-t=\"ระยะเวลาส่งมอบสูงสุด\"></span></th></tr><tr><td>1</td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>2</td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr></table></div><h3 class=\"ann\" data-n=\"02\"><strong>PHỤ LỤC 02 – MẪU PO VÀ BIÊN BẢN GIAO NHẬN< function gate(msg,sub){$('gate').hidden=!msg;$('app').hidden=!!msg;if(msg)$('gate').innerHTML='<h3 style="margin:0 0 8px;font-size:18px">KSP Contract System</h3><p>'+msg+'</p><p style="font-size:12px;color:var(--mu)">'+(sub||'')+'</p>'}
function localDb(){const K='ksp_db',ld=()=>{try{return JSON.parse(localStorage.getItem(K)||'{}')}catch(e){return{}}},sv=o=>{try{localStorage.setItem(K,JSON.stringify(o))}catch(e){}},Ls=[];
const snap=(path,d)=>({id:path.split('/').pop(),exists:d!==undefined,data:()=>d});
return{doc:path=>({get:async()=>snap(path,ld()[path]),set:async v=>{const o=ld();o[path]=v;sv(o);Ls.forEach(f=>f())},update:async v=>{const o=ld();o[path]=Object.assign({},o[path],v);sv(o);Ls.forEach(f=>f())},acquire:async()=>({acquired:true})}),
collection:c=>({onSnapshot:fn=>{const run=()=>{const o=ld();fn({docs:Object.keys(o).filter(k=>k.startsWith(c+'/')).map(k=>({id:k.split('/').pop(),data:()=>o[k]}))})};Ls.push(run);run()}})}}
