ารให้ระบุชัดเจนถึงที่มาของข้อกำหนดฝั่งลูกค้า ภาระผูกพันของฝ่าย B ที่ควบคุมได้ ส่วนต่างที่ยังไม่ได้ถ่ายทอด และผู้อนุมัติ/ผู้รับความเสี่ยง ตัวเลข อัตราส่วน และกำหนดเวลาจะมีผลก็ต่อเมื่อได้ระบุไว้อย่างชัดเจน มีการให้สำเนา/ข้อความอ้างอิงที่ได้รับสิทธิในการเผยแพร่ และทั้งสองฝ่ายยืนยันไว้ในภาคผนวก 04/06 ไม่ถ่ายโอนสัญญากับเจ้าของโครงการทั้งหมดโดยอัตโนมัติ\"></span></p><h3 class=\"art\" data-n=\"23\">ĐIỀU 23. BẢO MẬT, LIÊM CHÍNH, THÔNG BÁO VÀ HIỆU LỰC TỪNG PHẦN<span class=\"th\" data-t=\"ข้อ 23 การรักษาความลับ ความซื่อสัตย์สุจริต การแจ้งความ และผลบังคับเป็นส่วน ๆ\"></span></h3><p>23.1. Các Bên giữ bí mật bản vẽ, giá, công nghệ, thông tin khách hàng và tài liệu hợp đồng; không tiết lộ cho bên thứ ba ngoài phạm vi cần thiết để thực hiện công việc hoặc theo pháp luật. Bên B và nhà thầu phụ tuân thủ quy định chống hối lộ, lợi ích xung đột, lao động và bảo vệ dữ liệu theo pháp luật Việt Nam.<span class=\"th\" data-t=\"23.1 คู่สัญญาต้องรักษาความลับของแบบแปลน ราคา เทคโนโลยี ข้อมูลลูกค้า และเอกสารสัญญา และต้องไม่เปิดเผยแก่บุคคลที่สามนอกเหนือขอบเขตที่จำเป็นต่อการปฏิบัติงานหรือตามที่กฎหมายกำหนด ฝ่าย B และผู้รับเหมาช่วงต้องปฏิบัติตามข้อกำหนดว่าด้วยการต่อต้านการให้สินบน ผลประโยชน์ทับซ้อน แรงงาน และการคุ้มครองข้อมูลตามกฎหมายเวียดนาม\"></span></p><p>23.2. Việc một điều khoản không có hiệu lực không làm vô hiệu các phần còn lại nếu pháp luật cho phép. Các thông báo chính thức phải theo Điều 18; số lượng bản, hiệu lực hợp đồng và người ký theo Điều 19.<span class=\"th\" data-t=\"23.2 การที่ข้อกำหนดใดไม่มีผลบังคับไม่ทำให้ส่วนที่เหลือเสียไป หากกฎหมายอนุญาต การแจ้งอย่างเป็นทางการต้องเป็นไปตามข้อ 18 จำนวนฉบับ ผลบังคับของสัญญา และผู้ลงนามเป็นไปตามข้อ 19\"></span></p><p>23.3. Bên B cấp cho KSP quyền sử dụng và cho phép chủ đầu tư, đơn vị vận hành, bảo trì hoặc nhà thầu thay thế sử dụng hồ sơ do Bên B lập để vận hành, bảo trì, sửa chữa và hoàn thành phần việc của dự án. Chi phí quyền sử dụng này đã bao gồm trong giá Hợp đồng. Bên B bảo đảm có quyền cấp phép đối với hồ sơ do mình cung cấp và chịu trách nhiệm về vi phạm quyền sở hữu trí tuệ do mình gây ra. Các giới hạn sử dụng tài liệu của bên thứ ba chỉ áp dụng khi đã được kê khai và hai Bên chấp thuận tại Phụ lục 01.<br/><span class=\"th\" data-t=\"23.3 ฝ่าย B ให้สิทธิการใช้แก่ KSP และอนุญาตให้เจ้าของโครงการ ผู้ดำเนินการ ผู้บำรุงรักษา หรือผู้รับเหมารายใหม่ ใช้เอกสารที่ฝ่าย B จัดทำขึ้น เพื่อการดำเนินงาน บำรุงรักษา ซ่อมแซม และทำงานส่วนที่เหลือของโครงการให้แล้วเสร็จ ค่าตอบแทนสำหรับสิทธิการใช้นี้รวมอยู่ในราคาสัญญาแล้ว ฝ่าย B รับรองว่ามีสิทธิอนุญาตให้ใช้เอกสารที่ตนจัดส่ง และรับผิดชอบต่อการละเมิดทรัพย์สินทางปัญญาที่ตนก่อขึ้น ข้อจำกัดการใช้เอกสารของบุคคลที่สามให้ใช้บังคับเฉพาะเมื่อได้แจ้งรายการและคู่สัญญาทั้งสองฝ่ายยอมรับไว้ในภาคผนวก 01\"></span></p><div class=\"tw2\"><table class=\"ct\"><tr><th><strong>ĐẠI DIỆN BÊN B</strong><span class=\"th\" data-t=\"ผู้แทนฝ่าย B\"></span></th><th><strong>ĐẠI DIỆN BÊN A</strong><span class=\"th\" data-t=\"ผู้แทนฝ่าย A\"></span></th></tr></table></div><h3 class=\"ann\" data-n=\"01\">PHỤ LỤC 01 – PHẠM VI, BOQ, BẢN VẼ VÀ YÊU CẦU KỸ THUẬT (ĐIỀN CHO TỪNG DỰ ÁN)<span class=\"th\" data-t=\"ภาคผนวก 01 – ขอบเขตงาน BOQ แบบแปลน และข้อกำหนดทางเทคนิค (กรอกสำหรับแต่ละโครงการ)\"></span></h3><p>Tên dự án: <strong><span class=\"fx\" data-k=\"DỰ ÁN\"></span></strong> – Gói thầu: <strong><span class=\"fx\" data-k=\"HẠNG MỤC\"></span></strong> – Tài liệu kỹ thuật tham chiếu: <strong><span class=\"fx\" data-k=\"MÃ BẢN VẼ / NGÀY / PHIÊN BẢN\"></span></strong> – Nội dung loại trừ: <strong><span class=\"fx\" data-k=\"CÁC PHẦN KHÔNG BAO GỒM\"></span></strong>.<span class=\"th\" data-t=\"ชื่อโครงการ: 【DỰ ÁN】 – แพ็คเกจงาน: 【HẠNG MỤC】 – เอกสารทางเทคนิคอ้างอิง: 【MÃ BẢN VẼ / NGÀY / PHIÊN BẢN】 – เนื้อหาที่ไม่รวม: 【CÁC PHẦN KHÔNG BAO GỒM】\"></span></p><div class=\"tw2\"><table class=\"ct\"><tr><th><strong>STT</strong><span class=\"th\" data-t=\"ลำดับ\"></span></th><th><strong>Nội dung công việc / vật tư / thiết bị</strong><span class=\"th\" data-t=\"รายการงาน / วัสดุ / อุปกรณ์\"></span></th><th><strong>ĐVT</strong><span class=\"th\" data-t=\"หน่วย\"></span></th><th><strong>Khối lượng</strong><span class=\"th\" data-t=\"ปริมาณ\"></span></th><th><strong>Đơn giá trước VAT</strong><span class=\"th\" data-t=\"ราคาต่อหน่วยก่อนภาษีมูลค่าเพิ่ม (VAT)\"></span></th><th><strong>Thành tiền</strong><span class=\"th\" data-t=\"จำนวนเงิน\"></span></th><th><strong>Yêu cầu kỹ thuật</strong><span class=\"th\" data-t=\"ข้อกำหนดทางเทคนิค\"></span></th></tr><tr><td>1</td><td><span class=\"fx\" data-k=\"NỘI DUNG\"></span></td><td><span class=\"fx\" data-k=\"ĐVT\"></span></td><td><span class=\"fx\" data-k=\"SL\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"BẢN VẼ / QC\"></span></td></tr><tr><td>2</td><td><span class=\"fx\" data-k=\"NỘI DUNG\"></span></td><td><span class=\"fx\" data-k=\"ĐVT\"></span></td><td><span class=\"fx\" data-k=\"SL\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"BẢN VẼ / QC\"></span></td></tr><tr><td>3</td><td><span class=\"fx\" data-k=\"NỘI DUNG\"></span></td><td><span class=\"fx\" data-k=\"ĐVT\"></span></td><td><span class=\"fx\" data-k=\"SL\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"BẢN VẼ / QC\"></span></td></tr><tr><td>4</td><td><span class=\"fx\" data-k=\"NỘI DUNG\"></span></td><td><span class=\"fx\" data-k=\"ĐVT\"></span></td><td><span class=\"fx\" data-k=\"SL\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" data-k=\"BẢN VẼ / QC\"></span></td></tr><tr><td>5</td><td><span class=\"fx\" data-k=\"NỘI DUNG\"></span></td><td><span class=\"fx\" data-k=\"ĐVT\"></span></td><td><span class=\"fx\" data-k=\"SL\"></span></td><td><span class=\"fx\" data-k=\"VND\"></span></td><td><span class=\"fx\" ỤNG; GHI CƠ SỞ / %\"></span></td></tr><tr><td>Thời hạn khắc phục vi phạm<span class=\"th\" data-t=\"กำหนดเวลาแก้ไขการฝ่าฝืน\"></span></td><td><span class=\"fx\" data-k=\"GIỜ / NGÀY\"></span></td></tr><tr><td>Bảo lãnh thực hiện<span class=\"th\" data-t=\"หนังสือค้ำประกันการปฏิบัติตามสัญญา\"></span></td><td>Theo Điều 21.1: (05)% giá Hợp đồng trước VAT; hiệu lực đến hoàn tất nghiệm thu, bàn giao, khắc phục tồn đọng và nộp bảo đảm bảo hành + (30) ngày; ngoại lệ (nếu có): <span class=\"fx\" data-k=\"KHÔNG / NỘI DUNG ĐƯỢC DUYỆT\"></span><span class=\"th\" data-t=\"ตามข้อ 21.1: (05)% ของราคาสัญญาก่อนภาษีมูลค่าเพิ่ม (VAT) มีผลจนกว่าจะเสร็จสิ้นการตรวจรับ การส่งมอบ การแก้ไขงานค้าง และการยื่นหลักประกันการรับประกันผลงาน + (30) วัน ข้อยกเว้น (ถ้ามี): 【KHÔNG / NỘI DUNG ĐƯỢC DUYỆT】\"></span></td></tr><tr><td>Bảo lãnh tạm ứng<span class=\"th\" data-t=\"หนังสือค้ำประกันเงินล่วงหน้า\"></span></td><td><span class=\"fx\" data-k=\"100% TẠM ỨNG / HIỆU LỰC ĐẾN THU HỒI HẾT + ĐỆM\"></span></td></tr><tr><td>Bảo lãnh bảo hành hoặc tiền giữ lại<span class=\"th\" data-t=\"หนังสือค้ำประกันการรับประกันผลงาน หรือเงินประกันผลงานที่กักไว้ (Retention)\"></span></td><td><span class=\"fx\" data-k=\"CHỌN MỘT / % / NGÀY HẾT HIỆU LỰC\"></span></td></tr><tr><td>Thời hạn bảo hành<span class=\"th\" data-t=\"ระยะเวลารับประกันผลงาน\"></span></td><td><span class=\"fx\" data-k=\"SỐ THÁNG\"></span> thời điểm bắt đầu, ngày kết thúc theo Điều 12.1/Phụ lục 04; thời gian chờ tối đa <span class=\"fx\" data-k=\"SỐ THÁNG CHỜ\"></span>; bảo hành lại phần sửa/thay: <span class=\"fx\" data-k=\"SỐ THÁNG\"></span><span class=\"th\" data-t=\"【SỐ THÁNG】 จุดเริ่มต้น วันสิ้นสุดตามข้อ 12.1/ภาคผนวก 04 ระยะเวลารอสูงสุด 【SỐ THÁNG CHỜ】 การรับประกันซ้ำสำหรับส่วนที่ซ่อม/เปลี่ยน: 【SỐ THÁNG】\"></span></td></tr><tr><td>Thời hạn thanh toán / đợt 1-4<span class=\"th\" data-t=\"กำหนดการชำระเงิน / งวดที่ 1-4\"></span></td><td></td></tr><tr><td>Cơ quan giải quyết tranh chấp<span class=\"th\" data-t=\"หน่วยงานระงับข้อพิพาท\"></span></td><td><span class=\"fx\" data-k=\"TÒA ÁN CÓ THẨM QUYỀN / TRỌNG TÀI\"></span></td></tr><tr><td>Điều kiện thu tiền khách hàng / chuẩn bị vốn<span class=\"th\" data-t=\"เงื่อนไขการรับเงินจากลูกค้า / การเตรียมเงินทุน\"></span></td><td><span class=\"fx\" data-k=\"NGÀY SAU NGHIỆM THU / MỐC / CHỦ ĐẦU TƯ\"></span></td></tr><tr><td>Chênh lệch thu - chi ròng / nguồn vốn<span class=\"th\" data-t=\"ส่วนต่างรายรับ-รายจ่ายสุทธิ / แหล่งเงินทุน\"></span></td><td><span class=\"fx\" data-k=\"VND ĐỈNH ĐIỂM / KẾ HOẠCH TÀI TRỢ / NGƯỜI PHÊ DUYỆT\"></span></td></tr><tr><td>Điều kiện chấm dứt vì dừng dự án<span class=\"th\" data-t=\"เงื่อนไขการเลิกสัญญาเนื่องจากการหยุดโครงการ\"></span></td><td><span class=\"fx\" data-k=\"SỐ NGÀY BÁO TRƯỚC / CƠ CHẾ QUYẾT TOÁN\"></span></td></tr><tr><td>Yêu cầu bảo hành Back-to-Back<span class=\"th\" data-t=\"ข้อกำหนดการรับประกันแบบ Back-to-Back\"></span></td><td><span class=\"fx\" data-k=\"THÁNG / BẮT ĐẦU / KẾT THÚC / CHỜ TỐI ĐA\"></span></td></tr><tr><td>SLA khắc phục khuyết tật theo loại công việc<span class=\"th\" data-t=\"SLA การแก้ไขข้อบกพร่องตามประเภทงาน\"></span></td><td><span class=\"fx\" data-k=\"SỰ CỐ KHẨN / PHẢN HỒI / ĐẾN HIỆN TRƯỜNG / KHẮC PHỤC\"></span></td></tr><tr><td>Kết luận kiểm tra pháp lý đối với chế tài<span class=\"th\" data-t=\"ข้อสรุปการตรวจสอบทางกฎหมายเกี่ยวกับมาตรการลงโทษ\"></span></td><td><span class=\"fx\" data-k=\"NGUỒN VỐN / LUẬT ÁP DỤNG / NGƯỜI KÝ DUYỆT\"></span></td></tr></table></div><p>Ghi chú phê duyệt: Không sử dụng một tỷ lệ phạt cố định cho mọi dự án. Phòng Pháp chế phải kiểm tra luật áp dụng, nguồn vốn, giá trị phần nghĩa vụ bị vi phạm và tính hợp lý của phương pháp định giá trước khi ký.<span class=\"th\" data-t=\"หมายเหตุการอนุมัติ: ห้ามใช้อัตราค่าปรับคงที่อัตราเดียวสำหรับทุกโครงการ ฝ่ายกฎหมายต้องตรวจสอบกฎหมายที่ใช้บังคับ แหล่งเงินทุน มูลค่าของส่วนภาระผูกพันที่ถูกฝ่าฝืน และความสมเหตุสมผลของวิธีการกำหนดราคา ก่อนการลงนาม\"></span></p><p>DANH MỤC VẤN ĐỀ PHẢI XÁC NHẬN TRƯỚC KHI KÝ<span class=\"th\" data-t=\"รายการประเด็นที่ต้องยืนยันก่อนลงนาม\"></span></p><p>1. Điều 1: Chọn rõ phạm vi cung cấp/thi công/lắp đặt, công việc bao gồm/loại trừ; kiểm tra sự phù hợp giữa tên hợp đồng ở bìa và phần nội dung.<span class=\"th\" data-t=\"1. ข้อ 1: เลือกขอบเขตการจัดหา/ก่อสร้าง/ติดตั้งให้ชัดเจน งานที่รวมอยู่/ที่ยกเว้น ตรวจสอบความสอดคล้องระหว่างชื่อสัญญาบนหน้าปกกับเนื้อหา\"></span></p><p>2. Điều 5 và Phụ lục 03: Xác định cơ sở thanh toán riêng của từng đợt, địa điểm và tiêu chí nghiệm thu; lập bảng kiểm soát tổng thanh toán, tạm ứng, thu hồi và phần giữ lại để không chi vượt thực tế.<span class=\"th\" data-t=\"2. ข้อ 5 และภาคผนวก 03: กำหนดเกณฑ์การชำระเงินแยกของแต่ละงวด สถานที่ และเกณฑ์การตรวจรับ จัดทำตารางควบคุมยอดรวมการชำระเงิน เงินล่วงหน้า การเรียกคืน และเงินประกันผลงานที่กักไว้ เพื่อมิให้จ่ายเกินจริง\"></span></p><p>3. Điều 5, 8: Thống nhất thời hạn hoàn trả tạm ứng chưa thu hồi (03 ngày) và thời hạn hoàn trả khoản nhận thừa sau quyết toán (07 ngày); xác định trường hợp áp dụng từng mốc.<span class=\"th\" data-t=\"3. ข้อ 5, 8: ตกลงกำหนดเวลาคืนเงินล่วงหน้าที่ยังไม่ได้เรียกคืน (03 วัน) และกำหนดเวลาคืนเงินที่ได้รับเกินภายหลังการสรุปบัญชี (07 วัน) กำหนดกรณีที่ใช้บังคับของแต่ละกำหนดเวลา\"></span></p><p>4. Điều 8: Chọn thời hạn thông báo chấm dứt hợp đồng do vi phạm và chấm dứt vì dừng dự án; xác nhận căn cứ, thời hạn báo trước, quyền lợi vật tư đặt mua và thời hạn quyết toán theo luật áp dụng.<span class=\"th\" data-t=\"4. ข้อ 8: เลือกกำหนดเวลาแจ้งการเลิกสัญญาเนื่องจากการฝ่าฝืน และการเลิกสัญญาเนื่องจากการหยุดโครงการ ยืนยันเหตุ ระยะเวลาแจ้งล่วงหน้า สิทธิเกี่ยวกับวัสดุที่สั่งซื้อ และกำหนดเวลาสรุปบัญชีตามกฎหมายที่ใช้บังคับ\"></span></p><p>5. Điều 9 / Phụ lục 06: Phê duyệt mức phạt từng hành vi và trần phạt theo hợp đồng/nguồn vốn, giá trị phần nghĩa vụ bị vi phạm; tránh phạt trùng một hành vi. Kiểm tra các con số ví dụ như 0,10%/ngày.<span class=\"th\" data-t=\"5. ข้อ 9 / ภาคผนวก 06: อนุมัติอัตราค่าปรับสำหรับแต่ละการกระทำและเพดานค่าปรับตามสัญญา/แหล่งเงินทุน มูลค่าของส่วนภาระผูกพันที่ถูกฝ่าฝืน หลีกเลี่ยงการปรับซ้ำสำหรับการกระทำเดียว ตรวจสอบตัวเลขตัวอย่าง เช่น 0,10%/วัน\"></span></p><p>6. Điều 12 và Điều 21: Ấn định thời điểm bắt đầu/kết thúc bảo hành, thời gian chờ tối đa, phạm vi bảo hành, thời hạn và mẫu bảo lãnh bảo hành tương ứng; xem xét luật bắt buộc.<span class=\"th\" data-t=\"6. ข้อ 12 และข้อ 21: กำหนดจุดเริ่มต้น/สิ้นสุดของการรับประกันผลงาน ระยะเวลารอสูงสุด ขอบเขตการรับประกัน ระยะเวลาและแบบหนังสือค้ำประกันการรับประกันผลงานที่สอดคล้องกัน พิจารณากฎหมายบังคับ\"></span></p><p>7. Điều 21 / Phụ lục 06: Quyết định bảo lãnh thực hiện 5% (áp dụng/ngoại lệ) theo phân loại giao dịch, khả năng của nhà thầu, nguồn vốn; có văn bản được hai bên ký.<span class=\"th\" data-t=\"7. ข้อ 21 / ภาคผนวก 06: ตัดสินใจเรื่องหนังสือค้ำประกันการปฏิบัติตามสัญญา 5% (ใช้บังคับ/ข้อยกเว้น) ตามการจำแนกประเภทธุรกรรม ความสามารถของผู้รับเหมา แหล่งเงินทุน มีเอกสารเป็นลายลักษณ์อักษรที่คู่สัญญาทั้งสองฝ่ายลงนาม\"></span></p><p>8. Điều 15 và Điều 22: Làm rõ nghĩa vụ bồi thường theo lỗi, quan hệ nhân quả, chứng cứ, giới hạn trách nhiệm nếu áp dụng và phần công việc Bên B có thể kiểm soát.<span class=\"th\" data-t=\"8. ข้อ 15 และข้อ 22: ทำให้ชัดเจนเรื่องภาระการชดใช้ค่าเสียหายตามความผิด ความสัมพันธ์เชิงเหตุและผล พยานหลักฐาน เพดานความรับผิด (ถ้ามี) และส่วนงานที่ฝ่าย B ควบคุมได้\"></span></p><p>9. Điều 20: Thống nhất quy trình VO và chi phí khẩn cấp; tránh lệnh miệng tạo tăng giá ngoài thẩm quyền.<span class=\"th\" data-t=\"9. ข้อ 20: ตกลงขั้นตอน VO และค่าใช้จ่ายฉุกเฉิน หลีกเลี่ยงคำสั่งด้วยวาจาที่ก่อให้เกิดการเพิ่มราคานอกอำนาจ\"></span></p><p>10. Điều 22 / Phụ lục 04: Mỗi dự án lập Back-to-Back Matrix được ký, gồm thanh toán, tiến độ, phạt, nghiệm thu, bảo hành, bảo lãnh, VO và chấm dứt; kiểm tra điều khoản hợp đồng khách hàng có thể chia sẻ.<span class=\"th\" data-t=\"10. ข้อ 22 / ภาคผนวก 04: แต่ละโครงการต้องจัดทำตาราง Back-to-Back ที่ลงนามแล้ว ครอบคลุมการชำระเงิน กำหนดการ ค่าปรับ การตรวจรับ การรับประกันผลงาน หนังสือค้ำประกัน VO และการเลิกสัญญา ตรวจสอบข้อกำหนดในสัญญาลูกค้าที่สามารถเปิดเผยได้\"></span></p><p>11. Điều 7.5 và Phụ lục 02: Hoàn thiện yêu cầu an toàn sinh học cho trang trại, dừng máy, LOTO, làm việc nóng và yêu cầu HSE thực tế của nhà máy.<span class=\"th\" data-t=\"11. ข้อ 7.5 และภาคผนวก 02: ปรับปรุงข้อกำหนดความปลอดภัยทางชีวภาพสำหรับฟาร์ม การหยุดเครื่องจักร LOTO งานที่ใช้ความร้อน และข้อกำหนด HSE จริงของโรงงาน\"></span></p><p>12. Trước khi ký: Xóa mọi lựa chọn không áp dụng, điền đủ các ô <span class=\"fx\" data-k=\"...\"></span>, kiểm tra số điều/phụ lục và người ký có thẩm quyền.<span class=\"th\" data-t=\"12. ก่อนลงนาม: ลบตัวเลือกที่ไม่ใช้ทั้งหมด กรอกช่อง 【...】 ให้ครบ ตรวจสอบหมายเลขข้อ/ภาคผนวก และผู้ลงนามที่มีอำนาจ\"></span></p><p><strong>BẢN DỰ THẢO TÍCH HỢP Ý KIẾN ĐỘI MUA HÀNG; CHƯA QUA THẨM ĐỊNH VÀ PHÊ DUYỆT CUỐI CÙNG CỦA CÔNG TY LUẬT VIỆT NAM.</strong><span class=\"th\" data-t=\"ร่างฉบับนี้รวมความเห็นของทีมจัดซื้อแล้ว ยังไม่ผ่านการตรวจสอบและการอนุมัติขั้นสุดท้ายจากสำนักงานกฎหมายเวียดนามของบริษัท\"></span></p><p><em>LƯU Ý: Ba mẫu HĐ khách hàng năm 2024 (dịch vụ, cung cấp &amp; lắp đặt, xây dựng) được sử dụng để nhận diện rủi ro, KHÔNG tự động là điều kiện bắt buộc của mọi dự án KSP. Dự thảo cần luật sư Việt Nam soát xét từng điều khoản trước khi sử dụng.</em><span class=\"th\" data-t=\"หมายเหตุ: แบบสัญญาลูกค้าปี 2024 จำนวนสามฉบับ (บริการ จัดหาและติดตั้ง ก่อสร้าง) ใช้เพื่อระบุความเสี่ยง และไม่ถือเป็นเงื่อนไขบังคับของทุกโครงการ KSP โดยอัตโนมัติ ร่างสัญญาต้องให้ทนายความเวียดนามตรวจสอบทีละข้อก่อนนำไปใช้\"></span></p>", "sg": "<p class=\"ctr\"><strong>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</strong><span class=\"th\" data-t=\"สาธารณรัฐสังคมนิยมเวียดนาม\"></span></p><p class=\"ctr\"><strong>Độc lập - Tự do - Hạnh phúc</strong><span class=\"th\" data-t=\"เอกราช - เสรีภาพ - ความสุข\"></span></p><p class=\"ctr\"><strong>HỢP ĐỒNG MUA BÁN HÀNG HÓA</strong><span class=\"th\" data-t=\"สัญญาซื้อขายสินค้า\"></span></p><p class=\"ctr\">Số: <strong><span class=\"fx\" data-k=\"SỐ HỢP ĐỒNG\"></span></strong>     |     Mã dự án / PO: <strong><span class=\"fx\" data-k=\"MÃ DỰ ÁN / PO\"></span></strong><span class=\"th\" data-t=\"เลขที่: 【SỐ HỢP ĐỒNG】 | รหัสโครงการ / PO: 【MÃ DỰ ÁN / PO】\"></span></p><p>– Căn cứ Bộ luật Dân sự số 91/2015/QH13 và văn bản sửa đổi, bổ sung có hiệu lực tại thời điểm ký;<span class=\"th\" data-t=\"– โดยอาศัยประมวลกฎหมายแพ่ง ฉบับที่ 91/2015/QH13 และเอกสารแก้ไข เพิ่มเติมที่มีผลบังคับใช้ ณ เวลาลงนาม;\"></span></p><p>– Căn cứ Luật Thương mại số 36/2005/QH11 và văn bản sửa đổi, bổ sung trong phạm vi áp dụng;<span class=\"th\" data-t=\"– โดยอาศัยกฎหมายพาณิชย์ ฉบับที่ 36/2005/QH11 และเอกสารแก้ไข เพิ่มเติมภายในขอบเขตที่ใช้บังคับ;\"></span></p><p>– Căn cứ Luật Chất lượng sản phẩm, hàng hóa số 05/2007/QH12, được sửa đổi, bổ sung bởi Luật số 78/2025/QH15 và quy định liên quan (nếu áp dụng cho hàng hóa);<span class=\"th\" data-t=\"– โดยอาศัยกฎหมายว่าด้วยคุณภาพผลิตภัณฑ์และสินค้า ฉบับที่ 05/2007/QH12 ซึ่งแก้ไข เพิ่มเติมโดยกฎหมายฉบับที่ 78/2025/QH15 และข้อกำหนดที่เกี่ยวข้อง (หากใช้บังคับกับสินค้า);\"></span></p><p>– Căn cứ Hợp đồng/Đơn đặt hàng của khách hàng cuối cùng <strong><span class=\"fx\" data-k=\"SỐ HĐ/PO KHÁCH HÀNG\"></span></strong> và Bảng đối chiếu Back-to-Back tại Phụ lục 04 trong phạm vi có liên quan;<span class=\"th\" data-t=\"– โดยอาศัยสัญญา/ใบสั่งซื้อของลูกค้าปลายทาง 【SỐ HĐ/PO KHÁCH HÀNG】 และตารางเทียบเคียง Back-to-Back ในภาคผนวก 04 ภายในขอบเขตที่เกี่ยวข้อง;\"></span></p><p>– Căn cứ nhu cầu và khả năng của Các Bên.<span class=\"th\" data-t=\"– โดยอาศัยความต้องการและความสามารถของคู่สัญญาทั้งสองฝ่าย\"></span></p><p>Hôm nay, ngày <strong><span class=\"fx\" data-k=\"NGÀY\"></span></strong> tháng <strong><span class=\"fx\" data-k=\"THÁNG\"></span></strong> năm <strong><span class=\"fx\" data-k=\"NĂM\"></span></strong>, Các Bên gồm:<span class=\"th\" data-t=\"วันนี้ วันที่ 【NGÀY】 เดือน 【THÁNG】 พ.ศ./ค.ศ. 【NĂM】 คู่สัญญาประกอบด้วย:\"></span></p><p><strong>BÊN A – BÊN MUA: CÔNG TY TNHH KSP VIỆT NAM <span class=\"fx\" data-k=\"CHI NHÁNH / ĐƠN VỊ THỰC HIỆN NẾU CÓ\"></span></strong><span class=\"th\" data-t=\"ฝ่าย A – ผู้ซื้อ: บริษัท KSP เวียดนาม จำกัด (CÔNG TY TNHH KSP VIỆT NAM) 【CHI NHÁNH / ĐƠN VỊ THỰC HIỆN NẾU CÓ】\"></span></p><p>Đại diện: <strong><span class=\"fx\" data-k=\"HỌ TÊN NGƯỜI KÝ\"></span></strong>  Chức vụ: <strong><span class=\"fx\" data-k=\"CHỨC VỤ\"></span></strong>  Căn cứ thẩm quyền: <strong><span class=\"fx\" data-k=\"ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN\"></span></strong><span class=\"th\" data-t=\"ผู้แทน: 【HỌ TÊN NGƯỜI KÝ】 ตำแหน่ง: 【CHỨC VỤ】 อำนาจที่อาศัย: 【ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN】\"></span></p><p>Địa chỉ pháp lý: <strong><span class=\"fx\" data-k=\"ĐỊA CHỈ ĐĂNG KÝ HIỆN HÀNH\"></span></strong>    Mã số thuế: <strong><span class=\"fx\" data-k=\"MST KSP / CHI NHÁNH\"></span></strong><span class=\"th\" data-t=\"ที่อยู่ตามกฎหมาย: 【ĐỊA CHỈ ĐĂNG KÝ HIỆN HÀNH】 เลขประจำตัวผู้เสียภาษี: 【MST KSP / CHI NHÁNH】\"></span></p><p>Tài khoản ngân hàng: <strong><span class=\"fx\" data-k=\"SỐ TÀI KHOẢN / NGÂN HÀNG KSP\"></span></strong><span class=\"th\" data-t=\"บัญชีธนาคาร: 【SỐ TÀI KHOẢN / NGÂN HÀNG KSP】\"></span></p><p>Đại diện nhận thông báo: <strong><span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ\"></span></strong>     Email: <strong><span class=\"fx\" data-k=\"EMAIL\"></span></strong><span class=\"th\" data-t=\"ผู้แทนรับหนังสือแจ้ง: 【HỌ TÊN / CHỨC VỤ】 อีเมล: 【EMAIL】\"></span></p><p><strong>BÊN B – BÊN BÁN / NHÀ CUNG CẤP: <span class=\"fx\" data-k=\"TÊN PHÁP LÝ NHÀ CUNG CẤP\"></span></strong><span class=\"th\" data-t=\"ฝ่าย B – ผู้ขาย / ผู้จัดหา: 【TÊN PHÁP LÝ NHÀ CUNG CẤP】\"></span></p><p>Đại diện: <strong><span class=\"fx\" data-k=\"HỌ TÊN NGƯỜI KÝ\"></span></strong>  Chức vụ: <strong><span class=\"fx\" data-k=\"CHỨC VỤ\"></span></strong>  Căn cứ thẩm quyền: <strong><span class=\"fx\" data-k=\"ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN\"></span></strong><span class=\"th\" data-t=\"ผู้แทน: 【HỌ TÊN NGƯỜI KÝ】 ตำแหน่ง: 【CHỨC VỤ】 อำนาจที่อาศัย: 【ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN】\"></span></p><p>Địa chỉ: <strong><span class=\"fx\" data-k=\"ĐỊA CHỈ ĐĂNG KÝ\"></span></strong>    Mã số thuế/Mã số doanh nghiệp: <strong><span class=\"fx\" data-k=\"MST / GCN ĐKDN\"></span></strong><span class=\"th\" data-t=\"ที่อยู่: 【ĐỊA CHỈ ĐĂNG KÝ】 เลขประจำตัวผู้เสียภาษี/เลขทะเบียนวิสาหกิจ: 【MST / GCN ĐKDN】\"></span></p><p>Tài khoản nhận thanh toán: <strong><span class=\"fx\" data-k=\"CHỦ TÀI KHOẢN / SỐ TÀI KHOẢN / NGÂN HÀNG\"></span></strong><span class=\"th\" data-t=\"บัญชีรับชำระเงิน: 【CHỦ TÀI KHOẢN / SỐ TÀI KHOẢN / NGÂN HÀNG】\"></span></p><p>Đại diện xử lý đơn hàng/khiếu nại: <strong><span class=\"fx\" data-k=\"HỌ TÊN\"></span></strong>    Email: <strong><span class=\"fx\" data-k=\"EMAIL\"></span></strong><span class=\"th\" data-t=\"ผู้แทนจัดการคำสั่งซื้อ/ข้อร้องเรียน: 【HỌ TÊN】 อีเมล: 【EMAIL】\"></span></p><p>Hai Bên thỏa thuận ký Hợp đồng mua bán hàng hóa (“Hợp đồng”) với các điều khoản sau:<span class=\"th\" data-t=\"คู่สัญญาทั้งสองฝ่ายตกลงทำสัญญาซื้อขายสินค้า (“สัญญา”) โดยมีข้อกำหนดดังต่อไปนี้\"></span></p><h3 class=\"art\" data-n=\"1\"><strong>ĐIỀU 1. ĐỊNH NGHĨA, HỒ SƠ HỢP ĐỒNG VÀ THỨ TỰ ƯU TIÊN</strong><span class=\"th\" data-t=\"ข้อ 1. คำนิยาม เอกสารสัญญา และลำดับความสำคัญ\"></span></h3><p class=\"sub\">1.1    “Hàng hóa” là vật tư, sản phẩm, phụ tùng, cấu kiện, thiết bị mua theo Phụ lục 01 và từng Đơn đặt hàng (“PO”) hợp lệ của Bên A; không bao gồm dịch vụ lắp đặt, chạy thử, xây dựng hay bảo trì tại công trường, trừ trường hợp có phụ lục riêng ghi rõ các công việc này.<span class=\"th\" data-t=\"1.1 “สินค้า” (“Hàng hóa”) คือวัสดุ ผลิตภัณฑ์ อะไหล่ ชิ้นส่วน และอุปกรณ์ที่ซื้อตามภาคผนวก 01 และใบสั่งซื้อ (“PO”) ที่ถูกต้องแต่ละฉบับของฝ่าย A ไม่รวมบริการติดตั้ง ทดสอบเดินเครื่อง ก่อสร้าง หรือบำรุงรักษา ณ สถานที่ก่อสร้าง เว้นแต่มีภาคผนวกแยกต่างหากระบุงานเหล่านี้ไว้อย่างชัดเจน\"></span></p><p class=\"sub\">1.2    “PO hợp lệ” là đơn đặt hàng do Bên A phát hành theo phân quyền, ghi mã hàng, quy cách, lượng, giá, địa điểm, mốc giao, chứng từ, mã dự án và điều kiện đặc thù; có sự chấp thuận của Bên B theo Điều 4. Báo giá, PO, bản vẽ/thông số được chấp thuận, biên bản giao nhận, phụ lục và bảng Back-to-Back có ký xác nhận là bộ phận của Hợp đồng.<span class=\"th\" data-t=\"1.2 “PO ที่ถูกต้อง” คือใบสั่งซื้อที่ฝ่าย A ออกตามการมอบอำนาจ ระบุรหัสสินค้า ข้อกำหนด ปริมาณ ราคา สถานที่ กำหนดการส่งมอบ เอกสาร รหัสโครงการ และเงื่อนไขเฉพาะ และได้รับการยอมรับจากฝ่าย B ตามข้อ 4 ใบเสนอราคา PO แบบแปลน/ข้อกำหนดที่ได้รับการอนุมัติ รายงานการส่งมอบ-รับมอบ ภาคผนวก และตาราง Back-to-Back ที่มีการลงนามยืนยัน เป็นส่วนหนึ่งของสัญญา\"></span></p><p class=\"sub\">1.3    Thứ tự ưu tiên khi mâu thuẫn: (i) phụ lục sửa đổi riêng được hai Bên ký sau cùng, nếu ghi rõ điều khoản sửa đổi; (ii) điều khoản của Hợp đồng này; (iii) PO đã được Bên B xác nhận chỉ đối với nội dung thương mại cụ thể; (iv) các phụ lục 01–06; (v) yêu cầu kỹ thuật/đề xuất được chấp thuận; (vi) báo giá. Điều kiện bán hàng tiêu chuẩn của Bên B chỉ có hiệu lực khi được hai Bên chấp thuận rõ bằng văn bản và ghi tại Phụ lục 06.<span class=\"th\" data-t=\"1.3 ลำดับความสำคัญเมื่อเกิดความขัดแย้ง: (i) ภาคผนวกแก้ไขเฉพาะที่ทั้งสองฝ่ายลงนามครั้งหลังสุด หากระบุข้อกำหนดที่แก้ไขไว้อย่างชัดเจน; (ii) ข้อกำหนดของสัญญาฉบับนี้; (iii) PO ที่ฝ่าย B ยืนยันแล้ว เฉพาะเนื้อหาเชิงพาณิชย์ที่เฉพาะเจาะจง; (iv) ภาคผนวก 01–06; (v) ข้อกำหนดทางเทคนิค/ข้อเสนอที่ได้รับการอนุมัติ; (vi) ใบเสนอราคา เงื่อนไขการขายมาตรฐานของฝ่าย B มีผลก็ต่อเมื่อทั้งสองฝ่ายยอมรับเป็นลายลักษณ์อักษรอย่างชัดเจนและบันทึกไว้ในภาคผนวก 06\"></span></p><p class=\"sub\">1.4    Tài liệu tiếng Việt được ưu tiên khi có bản dịch, trừ khi Các Bên lựa chọn khác bằng văn bản. Không có quy định nào trong Hợp đồng khách hàng tự động áp dụng cho Bên B nếu không được xác định cụ thể tại Phụ lục 04 và thuộc phạm vi trách nhiệm của Bên B.<span class=\"th\" data-t=\"1.4 เอกสารภาษาเวียดนามมีความสำคัญเหนือกว่าเมื่อมีฉบับแปล เว้นแต่คู่สัญญาเลือกเป็นอย่างอื่นเป็นลายลักษณ์อักษร ข้อกำหนดใด ๆ ในสัญญาลูกค้าจะไม่ใช้บังคับกับฝ่าย B โดยอัตโนมัติ หากไม่ได้ระบุไว้โดยเฉพาะในภาคผนวก 04 และอยู่ในขอบเขตความรับผิดชอบของฝ่าย B\"></span></p><h3 class=\"art\" data-n=\"2\"><strong>ĐIỀU 2. ĐỐI TƯỢNG, QUY CÁCH VÀ PHẠM VI CUNG CẤP</strong><span class=\"th\" data-t=\"ข้อ 2. วัตถุประสงค์ ข้อกำหนด และขอบเขตการจัดหา\"></span></h3><p class=\"sub\">2.1    Bên B bán và Bên A mua Hàng hóa mới 100%, nguyên đai/đúng xuất xứ (trừ khi ghi khác), với mã, hãng, model, tiêu chuẩn, lượng, xuất xứ, kiểm định/chứng nhận, CO/CQ, tài liệu kỹ thuật và điều kiện bảo quản như Phụ lục 01, PO và Phụ lục 02.<span class=\"th\" data-t=\"2.1 ฝ่าย B ขายและฝ่าย A ซื้อสินค้าใหม่ 100% บรรจุภัณฑ์เดิม/ตรงตามแหล่งกำเนิด (เว้นแต่ระบุเป็นอย่างอื่น) โดยมีรหัส ยี่ห้อ รุ่น มาตรฐาน ปริมาณ แหล่งกำเนิด การตรวจสอบ/การรับรอง CO/CQ เอกสารทางเทคนิค และเงื่อนไขการเก็บรักษาตามภาคผนวก 01 PO และภาคผนวก 02\"></span></p><p class=\"sub\">2.2    Không tự ý thay đổi hãng, model, xuất xứ, nguyên liệu, nhà sản xuất, quy trình sản xuất hoặc giao hàng thay thế. Bất kỳ sản phẩm tương đương phải được Bên A chấp thuận trước bằng văn bản, không làm giảm tính năng, tiêu chuẩn, thời hạn sử dụng hoặc bảo hành.<span class=\"th\" data-t=\"2.2 ห้ามเปลี่ยนแปลงยี่ห้อ รุ่น แหล่งกำเนิด วัตถุดิบ ผู้ผลิต กระบวนการผลิต หรือส่งมอบสินค้าทดแทนโดยพลการ ผลิตภัณฑ์เทียบเท่าใด ๆ ต้องได้รับความเห็นชอบจากฝ่าย A เป็นลายลักษณ์อักษรล่วงหน้า และต้องไม่ลดทอนคุณสมบัติ มาตรฐาน อายุการใช้งาน หรือการรับประกัน\"></span></p><p class=\"sub\">2.3    Bên B chịu trách nhiệm về sự đầy đủ của thông số, độ chính xác của mô tả và sự phù hợp với mục đích sử dụng mà Bên A đã thông báo bằng văn bản và Bên B xác nhận. Hàng hóa thuộc dự án Feed–Farm–Food phải đáp ứng yêu cầu an toàn sinh học, thực phẩm, tiếp xúc thức ăn hoặc môi trường đặc thù khi được ghi tại PO/Phụ lục 01.<span class=\"th\" data-t=\"2.3 ฝ่าย B รับผิดชอบต่อความครบถ้วนของข้อกำหนด ความถูกต้องของคำอธิบาย และความเหมาะสมกับวัตถุประสงค์การใช้งานที่ฝ่าย A ได้แจ้งเป็นลายลักษณ์อักษรและฝ่าย B ได้ยืนยัน สินค้าของโครงการ Feed–Farm–Food ต้องเป็นไปตามข้อกำหนดด้านความปลอดภัยทางชีวภาพ อาหาร การสัมผัสอาหารสัตว์ หรือสภาพแวดล้อมเฉพาะ เมื่อระบุไว้ใน PO/ภาคผนวก 01\"></span></p><h3 class=\"art\" data-n=\"3\"><strong>ĐIỀU 3. GIÁ MUA, THUẾ VÀ CHI PHÍ</strong><span class=\"th\" data-t=\"ข้อ 3. ราคาซื้อ ภาษี และค่าใช้จ่าย\"></span></h3><p class=\"sub\">3.1    Tổng giá trị dự kiến của Hợp đồng/PO: <strong><span class=\"fx\" data-k=\"SỐ TIỀN\"></span></strong> VND (chưa VAT); VAT theo thuế suất hợp pháp tại thời điểm lập hóa đơn; tổng thanh toán dự kiến: <strong><span class=\"fx\" data-k=\"SỐ TIỀN\"></span></strong> VND. Giá chi tiết, cơ sở thuế và tổng tiền tại Phụ lục 01/PO được các Bên xác nhận. Nếu chọn Hợp đồng áp dụng cho nhiều PO thì tổng giá trị chỉ là dự kiến, không phải cam kết mức mua tối thiểu.<span class=\"th\" data-t=\"3.1 มูลค่ารวมโดยประมาณของสัญญา/PO: 【SỐ TIỀN】 VND (ไม่รวมภาษีมูลค่าเพิ่ม (VAT)); VAT ตามอัตราภาษีที่ถูกต้องตามกฎหมาย ณ เวลาออกใบกำกับภาษี; ยอดชำระรวมโดยประมาณ: 【SỐ TIỀN】 VND ราคารายละเอียด ฐานภาษี และยอดรวมในภาคผนวก 01/PO ซึ่งคู่สัญญายืนยันแล้ว หากเลือกให้สัญญาใช้กับหลาย PO มูลค่ารวมเป็นเพียงมูลค่าโดยประมาณ ไม่ใช่การรับรองปริมาณการซื้อขั้นต่ำ\"></span></p><p class=\"sub\">3.2    Đơn giá <strong><span class=\"fx\" data-k=\"CỐ ĐỊNH / THEO BẢNG GIÁ ĐÃ PHÊ DUYỆT ĐẾN NGÀY …\"></span></strong> bao gồm bao bì, ghi nhãn, kiểm tra, chi phí liên quan đến giao hàng và dỡ hàng tại địa điểm đã thỏa thuận, chứng từ và các nghĩa vụ khác nêu tại PO; chỉ loại trừ khi liệt kê rõ ở Phụ lục 01.<span class=\"th\" data-t=\"3.2 ราคาต่อหน่วย 【CỐ ĐỊNH / THEO BẢNG GIÁ ĐÃ PHÊ DUYỆT ĐẾN NGÀY …】 รวมค่าบรรจุภัณฑ์ การติดฉลาก การตรวจสอบ ค่าใช้จ่ายที่เกี่ยวข้องกับการส่งมอบและการขนถ่ายสินค้า ณ สถานที่ที่ตกลงกัน เอกสาร และภาระผูกพันอื่นตามที่ระบุใน PO โดยจะยกเว้นได้เฉพาะรายการที่ระบุไว้อย่างชัดเจนในภาคผนวก 01\"></span></p><p class=\"sub\">3.3    Việc điều chỉnh giá chỉ có hiệu lực khi Bên A chấp thuận bằng văn bản trước khi Bên B thực hiện phần thay đổi. Biến động nguyên vật liệu thông thường, tỷ giá, chi phí logistics hoặc thay đổi nội bộ của Bên B không tự động cho phép điều chỉnh giá. Thuế bắt buộc thay đổi được xử lý theo pháp luật; không mặc nhiên thay đổi đơn giá trước thuế.<span class=\"th\" data-t=\"3.3 การปรับราคามีผลก็ต่อเมื่อฝ่าย A เห็นชอบเป็นลายลักษณ์อักษรก่อนที่ฝ่าย B จะดำเนินการในส่วนที่เปลี่ยนแปลง ความผันผวนของวัตถุดิบตามปกติ อัตราแลกเปลี่ยน ค่าโลจิสติกส์ หรือการเปลี่ยนแปลงภายในของฝ่าย B ไม่ถือเป็นเหตุให้ปรับราคาได้โดยอัตโนมัติ ภาษีที่เปลี่ยนแปลงตามที่กฎหมายบังคับให้ดำเนินการตามกฎหมาย ไม่เปลี่ยนแปลงราคาต่อหน่วยก่อนภาษีโดยปริยาย\"></span></p><h3 class=\"art\" data-n=\"4\"><strong>ĐIỀU 4. ĐẶT HÀNG, XÁC NHẬN PO VÀ DỰ BÁO</strong><span class=\"th\" data-t=\"ข้อ 4. การสั่งซื้อ การยืนยัน PO และการพยากรณ์\"></span></h3><p class=\"sub\">4.1    Bên A chỉ bị ràng buộc với số lượng, giá trị Hàng hóa thể hiện trong PO được phát hành hợp lệ; dự báo, yêu cầu báo giá, kế hoạch dự kiến hoặc trao đổi qua điện thoại không tự tạo nghĩa vụ đặt mua, trừ khi được Bên A chấp thuận rõ.<span class=\"th\" data-t=\"4.1 ฝ่าย A ผูกพันเฉพาะปริมาณและมูลค่าสินค้าที่ปรากฏใน PO ที่ออกโดยชอบเท่านั้น การพยากรณ์ การขอใบเสนอราคา แผนการโดยประมาณ หรือการสนทนาทางโทรศัพท์ไม่ก่อให้เกิดภาระผูกพันในการสั่งซื้อ เว้นแต่ฝ่าย A เห็นชอบอย่างชัดเจน\"></span></p><p class=\"sub\">4.2    Bên B xác nhận PO trong vòng <strong><span class=\"fx\" data-k=\"02\"></span></strong> ngày làm việc, nêu rõ thời hạn giao, tình trạng tồn kho/sản xuất và khả năng cung ứng. Trường hợp PO có điểm khác Hợp đồng, chỉ nội dung thay đổi được hai Bên thỏa thuận rõ bằng văn bản mới có hiệu lực; im lặng không mặc nhiên là chấp thuận.<span class=\"th\" data-t=\"4.2 ฝ่าย B ยืนยัน PO ภายใน 【02】 วันทำการ โดยระบุกำหนดส่งมอบ สถานะสินค้าคงคลัง/การผลิต และความสามารถในการจัดหาอย่างชัดเจน ในกรณีที่ PO มีจุดแตกต่างจากสัญญา เฉพาะเนื้อหาที่เปลี่ยนแปลงซึ่งทั้งสองฝ่ายตกลงกันอย่างชัดเจนเป็นลายลักษณ์อักษรเท่านั้นจึงจะมีผล การนิ่งเฉยไม่ถือเป็นการยอมรับโดยปริยาย\"></span></p><p class=\"sub\">4.3    Khi phát hiện nguy cơ giao thiếu hoặc trễ, Bên B phải thông báo ngay, đồng thời đề xuất biện pháp thay thế, lô giao tách và kế hoạch khắc phục; Bên A có quyền không chấp nhận phương án làm ảnh hưởng dự án hoặc nghĩa vụ khách hàng.<span class=\"th\" data-t=\"4.3 เมื่อพบความเสี่ยงที่จะส่งมอบไม่ครบหรือล่าช้า ฝ่าย B ต้องแจ้งทันที พร้อมเสนอมาตรการทดแทน การแบ่งส่งสินค้า และแผนการแก้ไข ฝ่าย A มีสิทธิไม่ยอมรับแนวทางที่ส่งผลกระทบต่อโครงการหรือภาระผูกพันต่อลูกค้า\"></span></p><h3 class=\"art\" data-n=\"5\"><strong>ĐIỀU 5. TẠM ỨNG, BẢO ĐẢM THANH TOÁN VÀ ĐIỀU KIỆN THANH TOÁN</strong><span class=\"th\" data-t=\"ข้อ 5. เงินล่วงหน้า การค้ำประกันการชำระเงิน และเงื่อนไขการชำระเงิน\"></span></h3><p class=\"sub\">5.1    Phương án thanh toán được chọn ở Phụ lục 03: <strong><span class=\"fx\" data-k=\"A – SAU NGHIỆM THU / B – TẠM ỨNG CÓ BẢO LÃNH / C – NGOẠI LỆ NHÀ CUNG CẤP ĐẶC BIỆT\"></span></strong>. Không áp dụng đồng thời phương án mâu thuẫn; mọi ngoại lệ phải có phê duyệt theo Phụ lục 06 trước khi ký.<span class=\"th\" data-t=\"5.1 วิธีการชำระเงินที่เลือกในภาคผนวก 03: 【A – SAU NGHIỆM THU / B – TẠM ỨNG CÓ BẢO LÃNH / C – NGOẠI LỆ NHÀ CUNG CẤP ĐẶC BIỆT】 ไม่ใช้วิธีที่ขัดแย้งกันพร้อมกัน ข้อยกเว้นทุกกรณีต้องได้รับอนุมัติตามภาคผนวก 06 ก่อนลงนาม\"></span></p><p class=\"sub\">5.2    Phương án A (ưu tiên): Bên A thanh toán <strong><span class=\"fx\" data-k=\"100\"></span></strong>% giá trị phần Hàng hóa thực giao và được nghiệm thu phù hợp trong vòng <strong><span class=\"fx\" data-k=\"30\"></span></strong> ngày kể từ ngày nhận đầy đủ Hàng hóa, hóa đơn GTGT hợp lệ ghi đúng số PO và bộ chứng từ thanh toán theo Điều 5.5; thời hạn chỉ bắt đầu khi cả điều kiện giao hàng, nghiệm thu và chứng từ đã đầy đủ.<span class=\"th\" data-t=\"5.2 วิธี A (ให้ความสำคัญอันดับแรก): ฝ่าย A ชำระ 【100】 % ของมูลค่าสินค้าส่วนที่ส่งมอบจริงและผ่านการตรวจรับโดยชอบ ภายใน 【30】 วัน นับจากวันที่ได้รับสินค้าครบถ้วน ใบกำกับภาษีมูลค่าเพิ่ม (GTGT) ที่ถูกต้องซึ่งระบุเลข PO ถูกต้อง และชุดเอกสารประกอบการชำระเงินตามข้อ 5.5 ระยะเวลาจะเริ่มนับก็ต่อเมื่อเงื่อนไขการส่งมอบ การตรวจรับ และเอกสารครบถ้วนทั้งหมดแล้ว\"></span></p><p class=\"sub\">5.3    Phương án B (có tạm ứng): Bên A tạm ứng <strong><span class=\"fx\" data-k=\"...\"></span></strong>% giá trị <strong><span class=\"fx\" data-k=\"TRƯỚC/SAU VAT\"></span></strong> sau khi Hợp đồng/PO có hiệu lực và đã nhận bản gốc bảo lãnh hoàn trả tạm ứng từ ngân hàng được chấp thuận, trị giá không thấp hơn khoản tạm ứng chưa thu hồi, có hiệu lực đến khi thu hồi đủ và thời gian yêu cầu thanh toán bảo lãnh. Tỷ lệ thu hồi trong các đợt thanh toán ghi tại Phụ lục 03; cấm thu hồi trùng.<span class=\"th\" data-t=\"5.3 วิธี B (มีเงินล่วงหน้า): ฝ่าย A จ่ายเงินล่วงหน้า 【...】 % ของมูลค่า 【TRƯỚC/SAU VAT】 หลังจากสัญญา/PO มีผลบังคับ และได้รับต้นฉบับหนังสือค้ำประกันการคืนเงินล่วงหน้าจากธนาคารที่ได้รับการยอมรับ โดยมีมูลค่าไม่ต่ำกว่าเงินล่วงหน้าที่ยังไม่ได้เรียกคืน มีผลบังคับจนกว่าจะเรียกคืนครบ และมีระยะเวลาเรียกร้องการชำระเงินตามหนังสือค้ำประกัน อัตราการเรียกคืนในแต่ละงวดการชำระเงินระบุไว้ในภาคผนวก 03 ห้ามเรียกคืนซ้ำซ้อน\"></span></p><p class=\"sub\">5.4    Phương án C (ngoại lệ, ví dụ hàng OEM / thiết bị có quyền đàm phán cao): nếu cần thanh toán trước giao hàng, chỉ áp dụng sau khi phê duyệt Phụ lục 06 với ít nhất một công cụ giảm thiểu rủi ro: bảo lãnh ngân hàng, thư tín dụng phù hợp, escrow, bảo hiểm tín dụng, bằng chứng sản xuất/sở hữu hàng hóa đã phân định và quyền kiểm tra trước giao hàng. Trường hợp không thể có bảo đảm thì phải nêu rõ số tiền rủi ro chưa được bảo đảm, mức thẩm quyền chấp thuận và kế hoạch phòng ngừa.<span class=\"th\" data-t=\"5.4 ทางเลือก C (กรณียกเว้น เช่น สินค้า OEM / อุปกรณ์ที่มีอำนาจต่อรองสูง): หากจำเป็นต้องชำระเงินก่อนการส่งมอบสินค้า ให้ใช้ได้เฉพาะภายหลังได้รับอนุมัติตามภาคผนวก 06 โดยมีมาตรการลดความเสี่ยงอย่างน้อยหนึ่งอย่าง ได้แก่ หนังสือค้ำประกันของธนาคาร เลตเตอร์ออฟเครดิตที่เหมาะสม escrow ประกันสินเชื่อ หลักฐานการผลิต/กรรมสิทธิ์ในสินค้าที่แยกไว้ชัดเจน และสิทธิในการตรวจสอบก่อนการส่งมอบ ในกรณีที่ไม่สามารถมีหลักประกันได้ ต้องระบุอย่างชัดเจนถึงจำนวนเงินความเสี่ยงที่ยังไม่มีหลักประกัน ระดับอำนาจผู้อนุมัติ และแผนการป้องกัน\"></span></p><p class=\"sub\">5.5    Hồ sơ thanh toán tối thiểu: (i) PO/Hợp đồng và phụ lục; (ii) hóa đơn GTGT hợp pháp, đúng PO; (iii) phiếu giao hàng/chứng từ vận chuyển; (iv) biên bản giao nhận và nghiệm thu (khi áp dụng); (v) CO, CQ, chứng thư kiểm tra/kiểm định, chứng nhận xuất xứ hoặc tài liệu nhập khẩu khi được yêu cầu; (vi) bảo lãnh và biên bản thu hồi tạm ứng nếu có. KSP thông báo hợp lý về hồ sơ thiếu hoặc lỗi để Bên B sửa theo pháp luật.<span class=\"th\" data-t=\"5.5 เอกสารประกอบการชำระเงินขั้นต่ำ: (i) PO/สัญญาและภาคผนวก; (ii) ใบกำกับภาษีมูลค่าเพิ่ม (GTGT) ที่ถูกต้องตามกฎหมายและตรงกับ PO; (iii) ใบส่งสินค้า/เอกสารการขนส่ง; (iv) รายงานการส่งมอบและการตรวจรับ (เมื่อมีการบังคับใช้); (v) CO, CQ ใบรับรองการตรวจสอบ/ตรวจวัด ใบรับรองถิ่นกำเนิดสินค้า หรือเอกสารนำเข้า เมื่อมีการร้องขอ; (vi) หนังสือค้ำประกันและรายงานการเรียกคืนเงินล่วงหน้า (หากมี) KSP จะแจ้งให้ทราบตามสมควรเกี่ยวกับเอกสารที่ขาดหรือมีข้อผิดพลาด เพื่อให้ฝ่าย B แก้ไขตามกฎหมาย\"></span></p><p class=\"sub\">5.6    Bên A được tạm giữ khoản thanh toán tương ứng với hàng hóa không phù hợp, khoản đang tranh chấp có căn cứ hoặc khoản khấu trừ hợp lệ, kèm thông báo chi tiết; phần không tranh chấp vẫn thanh toán đúng hạn. Việc bù trừ thực hiện theo chứng cứ và quy định pháp luật; không được tự động khấu trừ khoản bị tranh chấp chưa xác lập hợp lệ.<span class=\"th\" data-t=\"5.6 ฝ่าย A มีสิทธิระงับการชำระเงินจำนวนที่สอดคล้องกับสินค้าที่ไม่เป็นไปตามข้อกำหนด จำนวนเงินที่พิพาทโดยมีเหตุผลรองรับ หรือจำนวนเงินที่หักได้โดยชอบ พร้อมการแจ้งโดยละเอียด ส่วนที่ไม่มีข้อพิพาทยังคงต้องชำระตามกำหนด การหักกลบลบหนี้ให้ดำเนินการตามพยานหลักฐานและบทบัญญัติของกฎหมาย ห้ามหักจำนวนเงินที่พิพาทโดยอัตโนมัติในกรณีที่ยังไม่ได้ก่อตั้งสิทธิโดยชอบ\"></span></p><p class=\"sub\">5.7    Hợp đồng/PO chỉ định thời hạn thanh toán với Bên B không tự động phụ thuộc việc khách hàng cuối cùng thanh toán cho Bên A. Bộ phận mua hàng và tài chính phải thực hiện so khớp dòng tiền nhận từ khách hàng với lịch trả Bên B tại Phụ lục 03, xác định khoảng thiếu vốn và biện pháp tài trợ trước khi ký.<span class=\"th\" data-t=\"5.7 กำหนดเวลาชำระเงินที่ระบุในสัญญา/PO ให้แก่ฝ่าย B ไม่ขึ้นอยู่กับการที่ลูกค้าปลายทางชำระเงินให้แก่ฝ่าย A โดยอัตโนมัติ ฝ่ายจัดซื้อและฝ่ายการเงินต้องดำเนินการเปรียบเทียบกระแสเงินสดที่ได้รับจากลูกค้ากับตารางการชำระเงินให้ฝ่าย B ตามภาคผนวก 03 ระบุส่วนที่ขาดเงินทุนและมาตรการจัดหาเงินทุน ก่อนการลงนาม\"></span></p><h3 class=\"art\" data-n=\"6\"><strong>ĐIỀU 6. GIAO HÀNG, ĐÓNG GÓI, VẬN CHUYỂN VÀ CHUYỂN GIAO RỦI RO</strong><span class=\"th\" data-t=\"ข้อ 6. การส่งมอบสินค้า การบรรจุหีบห่อ การขนส่ง และการโอนความเสี่ยง\"></span></h3><p class=\"sub\">6.1    Bên B giao đúng chủng loại, lượng, thời gian và địa điểm <strong><span class=\"fx\" data-k=\"KHO KSP / NHÀ MÁY KHÁCH HÀNG / CÔNG TRƯỜNG / ĐỊA ĐIỂM KHÁC\"></span></strong> nêu trên PO/Phụ lục 02. Bên B thông báo kế hoạch giao trước <strong><span class=\"fx\" data-k=\"...\"></span></strong> ngày và cập nhật thay đổi ngay khi phát sinh. Giao nhiều đợt chỉ được khi Bên A chấp thuận.<span class=\"th\" data-t=\"6.1 ฝ่าย B ต้องส่งมอบสินค้าให้ตรงตามประเภท จำนวน เวลา และสถานที่ 【KHO KSP / NHÀ MÁY KHÁCH HÀNG / CÔNG TRƯỜNG / ĐỊA ĐIỂM KHÁC】 ตามที่ระบุใน PO/ภาคผนวก 02 ฝ่าย B ต้องแจ้งแผนการส่งมอบล่วงหน้า 【...】 วัน และแจ้งการเปลี่ยนแปลงทันทีที่เกิดขึ้น การส่งมอบหลายงวดทำได้เฉพาะเมื่อฝ่าย A อนุมัติ\"></span></p><p class=\"sub\">6.2    Bên B chịu đóng gói, bảo quản, bốc xếp, chằng buộc và vận chuyển tới điểm giao đã chọn theo phân bổ chi phí tại Phụ lục 02. Với hàng xuất nhập khẩu, ghi rõ điều kiện Incoterms® 2020 <strong><span class=\"fx\" data-k=\"ĐIỀU KIỆN/ĐỊA ĐIỂM\"></span></strong>, bên làm thủ tục hải quan, loại chứng từ và nghĩa vụ thuế; không tự áp dụng Incoterms nếu hợp đồng không chỉ định.<span class=\"th\" data-t=\"6.2 ฝ่าย B เป็นผู้รับผิดชอบการบรรจุหีบห่อ การเก็บรักษา การขนขึ้นลง การผูกรัดสินค้า และการขนส่งไปยังจุดส่งมอบที่เลือก ตามการแบ่งค่าใช้จ่ายในภาคผนวก 02 สำหรับสินค้านำเข้า/ส่งออก ให้ระบุเงื่อนไข Incoterms® 2020 【ĐIỀU KIỆN/ĐỊA ĐIỂM】 ฝ่ายที่ดำเนินพิธีการศุลกากร ประเภทเอกสาร และภาระหน้าที่ด้านภาษีให้ชัดเจน ห้ามนำ Incoterms มาใช้เองหากสัญญาไม่ได้กำหนดไว้\"></span></p><p class=\"sub\">6.3    Chuyển giao rủi ro mất mát/hư hỏng khi hàng được giao tới địa điểm và hoàn tất nghĩa vụ giao nhận được ghi rõ tại Phụ lục 02; việc ký phiếu giao hàng chỉ xác nhận số kiện/bao bì và không mặc nhiên là chấp thuận chất lượng. Quyền sở hữu chuyển cho Bên A tại <strong><span class=\"fx\" data-k=\"THỜI ĐIỂM GIAO / THANH TOÁN / NGHIỆM THU\"></span></strong> theo điều kiện đã được lựa chọn và pháp luật áp dụng. Hàng hóa mà Bên A đã thanh toán trước phải được phân định, bảo quản và có cơ chế bảo vệ quyền của Bên A theo hồ sơ đã phê duyệt.<span class=\"th\" data-t=\"6.3 การโอนความเสี่ยงในการสูญหาย/เสียหายเกิดขึ้นเมื่อสินค้าถูกส่งมอบถึงสถานที่และการปฏิบัติหน้าที่ในการส่งมอบรับมอบเสร็จสิ้นตามที่ระบุในภาคผนวก 02 การลงนามในใบส่งสินค้าเป็นเพียงการยืนยันจำนวนหีบห่อ/บรรจุภัณฑ์ และไม่ถือโดยปริยายว่าเป็นการยอมรับคุณภาพ กรรมสิทธิ์โอนให้ฝ่าย A ณ 【THỜI ĐIỂM GIAO / THANH TOÁN / NGHIỆM THU】 ตามเงื่อนไขที่เลือกและกฎหมายที่ใช้บังคับ สินค้าที่ฝ่าย A ได้ชำระเงินล่วงหน้าแล้วต้องถูกแยกไว้ต่างหาก เก็บรักษา และมีกลไกคุ้มครองสิทธิของฝ่าย A ตามเอกสารที่ได้รับอนุมัติ\"></span></p><p class=\"sub\">6.4    Bên B phải phối hợp giao hàng tới nhiều chi nhánh/địa điểm khác nhau của Bên A chỉ theo PO tương ứng; địa điểm mới hoặc chi phí phát sinh phải được thỏa thuận bằng văn bản, không suy diễn nghĩa vụ tự động đối với mọi chi nhánh CPV.<span class=\"th\" data-t=\"6.4 ฝ่าย B ต้องประสานงานการส่งมอบสินค้าไปยังสาขา/สถานที่ต่าง ๆ ของฝ่าย A เฉพาะตาม PO ที่เกี่ยวข้องเท่านั้น สถานที่ใหม่หรือค่าใช้จ่ายที่เกิดขึ้นเพิ่มเติมต้องตกลงเป็นลายลักษณ์อักษร ไม่ตีความว่าเป็นภาระหน้าที่โดยอัตโนมัติต่อทุกสาขาของ CPV\"></span></p><h3 class=\"art\" data-n=\"7\"><strong>ĐIỀU 7. KIỂM TRA, NGHIỆM THU, TỪ CHỐI VÀ XỬ LÝ HÀNG KHÔNG PHÙ HỢP</strong><span class=\"th\" data-t=\"ข้อ 7. การตรวจสอบ การตรวจรับ การปฏิเสธ และการจัดการสินค้าที่ไม่เป็นไปตามข้อกำหนด\"></span></h3><p class=\"sub\">7.1    KSP kiểm tra bao bì, số lượng và dấu hiệu lỗi hiển nhiên trong <strong><span class=\"fx\" data-k=\"03\"></span></strong> ngày làm việc kể từ khi nhận thực tế; thông báo lỗi rõ ràng trong <strong><span class=\"fx\" data-k=\"01\"></span></strong> ngày làm việc sau khi phát hiện. Mốc này không làm mất quyền khiếu nại đối với lỗi ẩn, sai sót kỹ thuật, vi phạm bảo đảm hoặc lỗi phát hiện trong thời hạn bảo hành theo pháp luật và Hợp đồng.<span class=\"th\" data-t=\"7.1 KSP ตรวจสอบบรรจุภัณฑ์ จำนวน และสัญญาณของความบกพร่องที่เห็นได้ชัดภายใน 【03】 วันทำการนับแต่วันที่ได้รับสินค้าจริง และแจ้งข้อบกพร่องอย่างชัดเจนภายใน 【01】 วันทำการนับแต่วันที่พบ กำหนดเวลานี้ไม่ทำให้สิทธิในการเรียกร้องต่อข้อบกพร่องแฝง ข้อผิดพลาดทางเทคนิค การฝ่าฝืนการรับรอง หรือข้อบกพร่องที่พบภายในระยะเวลารับประกันตามกฎหมายและสัญญาสูญเสียไป\"></span></p><p class=\"sub\">7.2    Nếu hàng sai chủng loại, không đủ số lượng, sai kỹ thuật, chứng từ thiếu, sản phẩm lỗi, hàng giả hoặc không đạt yêu cầu an toàn, Bên A có quyền lựa chọn và thông báo: (i) từ chối nhận toàn bộ/phần vi phạm; (ii) yêu cầu giao bổ sung hoặc thay thế trong <strong><span class=\"fx\" data-k=\"07/10\"></span></strong> ngày; (iii) yêu cầu khắc phục/giảm giá được hai Bên thống nhất; (iv) hoàn trả tiền cho phần vi phạm và yêu cầu bồi thường theo Điều 13.<span class=\"th\" data-t=\"7.2 หากสินค้าผิดประเภท จำนวนไม่ครบ ผิดข้อกำหนดทางเทคนิค เอกสารไม่ครบ ผลิตภัณฑ์บกพร่อง เป็นสินค้าปลอม หรือไม่เป็นไปตามข้อกำหนดด้านความปลอดภัย ฝ่าย A มีสิทธิเลือกและแจ้งว่า: (i) ปฏิเสธการรับสินค้าทั้งหมด/ส่วนที่ไม่เป็นไปตามข้อกำหนด; (ii) เรียกให้ส่งมอบเพิ่มเติมหรือทดแทนภายใน 【07/10】 วัน; (iii) เรียกให้แก้ไข/ลดราคาตามที่ทั้งสองฝ่ายตกลงกัน; (iv) เรียกเงินคืนสำหรับส่วนที่ไม่เป็นไปตามข้อกำหนดและเรียกให้ชดใช้ค่าเสียหายตามข้อ 13\"></span></p><p class=\"sub\">7.3    Chi phí kiểm tra lại, thu hồi, vận chuyển hai chiều, đổi/trả, tháo dỡ hợp lý trong phạm vi do lỗi Bên B và bảo quản hàng lỗi thuộc Bên B theo mức thực tế chứng minh được. Khi kiểm tra đầu vào không phát hiện lỗi ẩn, việc nghiệm thu không miễn trừ nghĩa vụ bảo hành hoặc trách nhiệm về lỗi do Bên B.<span class=\"th\" data-t=\"7.3 ค่าใช้จ่ายในการตรวจสอบซ้ำ การเรียกคืน การขนส่งสองทาง การเปลี่ยน/คืนสินค้า การรื้อถอนตามสมควรในขอบเขตที่เกิดจากความผิดของฝ่าย B และการเก็บรักษาสินค้าที่บกพร่อง เป็นภาระของฝ่าย B ตามจำนวนจริงที่พิสูจน์ได้ กรณีที่การตรวจสอบเบื้องต้นไม่พบข้อบกพร่องแฝง การตรวจรับไม่ได้ทำให้ฝ่าย B หลุดพ้นจากหน้าที่ในการรับประกันหรือความรับผิดต่อข้อบกพร่องที่เกิดจากฝ่าย B\"></span></p><p class=\"sub\">7.4    Các tiêu chí kiểm tra, mẫu duyệt, chứng nhận, thời gian thử nghiệm tại nhà máy (FAT) hoặc tại nơi sử dụng (SAT, nếu có) và biên bản giao nhận được ghi tại Phụ lục 02/05. Đối với thiết bị cần lắp đặt và chạy thử độc lập, các Bên phải ký hợp đồng lắp đặt riêng hoặc phụ lục mô tả rõ trách nhiệm, không mặc nhiên phát sinh nghĩa vụ thi công trong mẫu mua bán này.<span class=\"th\" data-t=\"7.4 เกณฑ์การตรวจสอบ ตัวอย่างที่อนุมัติ ใบรับรอง ระยะเวลาการทดสอบที่โรงงาน (FAT) หรือ ณ สถานที่ใช้งาน (SAT) (หากมี) และรายงานการส่งมอบรับมอบ ให้ระบุไว้ในภาคผนวก 02/05 สำหรับอุปกรณ์ที่ต้องติดตั้งและทดลองเดินเครื่องแยกต่างหาก คู่สัญญาต้องลงนามในสัญญาติดตั้งต่างหากหรือภาคผนวกที่ระบุความรับผิดชอบอย่างชัดเจน ภาระหน้าที่ในการก่อสร้างไม่เกิดขึ้นโดยปริยายในแบบสัญญาซื้อขายนี้\"></span></p><h3 class=\"art\" data-n=\"8\"><strong>ĐIỀU 8. BẢO ĐẢM CHẤT LƯỢNG VÀ TRUY XUẤT NGUỒN GỐC</strong><span class=\"th\" data-t=\"ข้อ 8. การรับประกันคุณภาพและการตรวจสอบย้อนกลับแหล่งที่มา\"></span></h3><p class=\"sub\">8.1    Bên B bảo đảm hàng đúng xuất xứ, nhà sản xuất, tiêu chuẩn đã công bố, sở hữu hợp pháp, không vi phạm quyền bên thứ ba, mới và không có khuyết tật thiết kế, nguyên liệu, chế tạo tại thời điểm giao; có khả năng truy xuất lô sản xuất/serial khi áp dụng.<span class=\"th\" data-t=\"8.1 ฝ่าย B รับประกันว่าสินค้ามีถิ่นกำเนิด ผู้ผลิต และมาตรฐานตรงตามที่ประกาศไว้ มีกรรมสิทธิ์โดยชอบด้วยกฎหมาย ไม่ละเมิดสิทธิของบุคคลที่สาม เป็นสินค้าใหม่ และไม่มีข้อบกพร่องด้านการออกแบบ วัตถุดิบ การผลิต ณ เวลาส่งมอบ และสามารถตรวจสอบย้อนกลับล็อตการผลิต/หมายเลขซีเรียลได้เมื่อมีการบังคับใช้\"></span></p><p class=\"sub\">8.2    Bên B phải cung cấp đầy đủ CO/CQ, chứng nhận hợp quy, tài liệu an toàn, hướng dẫn sử dụng, thông số kỹ thuật, kết quả kiểm định, chứng từ xuất nhập khẩu và chứng từ khác theo Phụ lục 02/PO, phù hợp Luật Chất lượng sản phẩm, hàng hóa hiện hành. Khi phát hiện rủi ro an toàn, Bên B phải thông báo ngay và phối hợp cách ly/thu hồi theo quy định pháp luật.<span class=\"th\" data-t=\"8.2 ฝ่าย B ต้องจัดหา CO/CQ ใบรับรองความสอดคล้องตามข้อบังคับ เอกสารด้านความปลอดภัย คู่มือการใช้งาน ข้อมูลจำเพาะทางเทคนิค ผลการตรวจสอบ เอกสารนำเข้า-ส่งออก และเอกสารอื่น ๆ ให้ครบถ้วนตามภาคผนวก 02/PO ให้สอดคล้องกับกฎหมายว่าด้วยคุณภาพผลิตภัณฑ์และสินค้าที่ใช้บังคับในปัจจุบัน เมื่อพบความเสี่ยงด้านความปลอดภัย ฝ่าย B ต้องแจ้งทันทีและประสานงานในการแยก/เรียกคืนสินค้าตามบทบัญญัติของกฎหมาย\"></span></p><p class=\"sub\">8.3    Trường hợp sản phẩm có hạn sử dụng, Bên B chỉ giao hàng đáp ứng tỷ lệ thời hạn sử dụng còn lại <strong><span class=\"fx\" data-k=\"...%\"></span></strong> hoặc yêu cầu cụ thể của PO và khách hàng cuối cùng (nếu được chuyển giao tại Phụ lục 04).<span class=\"th\" data-t=\"8.3 ในกรณีที่ผลิตภัณฑ์มีวันหมดอายุ ฝ่าย B จะส่งมอบเฉพาะสินค้าที่มีสัดส่วนอายุการใช้งานคงเหลือตามที่กำหนด 【...%】 หรือตามข้อกำหนดเฉพาะของ PO และลูกค้าปลายทาง (หากมีการถ่ายทอดไว้ในภาคผนวก 04)\"></span></p><h3 class=\"art\" data-n=\"9\"><strong>ĐIỀU 9. BẢO HÀNH, KHẮC PHỤC KHIẾM KHUYẾT VÀ HÀNG THAY THẾ</strong><span class=\"th\" data-t=\"ข้อ 9. การรับประกัน การแก้ไขข้อบกพร่อง และสินค้าทดแทน\"></span></h3><p class=\"sub\">9.1    Thời hạn bảo hành <strong><span class=\"fx\" data-k=\"12\"></span></strong> tháng kể từ ngày Bên A nghiệm thu hàng đạt yêu cầu hoặc <strong><span class=\"fx\" data-k=\"...\"></span></strong> tháng kể từ ngày khách hàng cuối cùng nghiệm thu nếu đã thỏa thuận Back-to-Back tại Phụ lục 04; trường hợp có mốc tối đa tính từ ngày xuất xưởng/giao hàng phải ghi rõ và đánh giá khoảng trống với nghĩa vụ của KSP đối với khách hàng.<span class=\"th\" data-t=\"9.1 ระยะเวลารับประกัน 【12】 เดือน นับจากวันที่ฝ่าย A ตรวจรับสินค้าว่าเป็นไปตามข้อกำหนด หรือ 【...】 เดือน นับจากวันที่ลูกค้าปลายทางตรวจรับ หากได้ตกลงแบบ Back-to-Back ไว้ในภาคผนวก 04 ในกรณีที่มีกำหนดระยะเวลาสูงสุดนับจากวันออกจากโรงงาน/ส่งมอบ ต้องระบุให้ชัดเจนและประเมินช่องว่างเมื่อเทียบกับภาระหน้าที่ของ KSP ต่อลูกค้า\"></span></p><p class=\"sub\">9.2    Bên B phản hồi yêu cầu bảo hành trong vòng <strong><span class=\"fx\" data-k=\"24/48\"></span></strong> giờ; gửi phương án trong <strong><span class=\"fx\" data-k=\"...\"></span></strong> ngày; sửa chữa hoặc thay thế không tính phí trong <strong><span class=\"fx\" data-k=\"...\"></span></strong> ngày, tùy mức độ khẩn cấp và tác động đến hoạt động của khách hàng. Thời gian ngừng hoạt động ảnh hưởng do hàng lỗi được đánh giá riêng theo chứng cứ và trách nhiệm.<span class=\"th\" data-t=\"9.2 ฝ่าย B ต้องตอบสนองต่อคำขอรับประกันภายใน 【24/48】 ชั่วโมง ส่งแนวทางแก้ไขภายใน 【...】 วัน ซ่อมแซมหรือเปลี่ยนทดแทนโดยไม่คิดค่าใช้จ่ายภายใน 【...】 วัน ตามระดับความเร่งด่วนและผลกระทบต่อการดำเนินงานของลูกค้า ระยะเวลาหยุดดำเนินงานที่ได้รับผลกระทบจากสินค้าบกพร่องจะได้รับการประเมินแยกต่างหากตามพยานหลักฐานและความรับผิด\"></span></p><p class=\"sub\">9.3    Bên B chịu chi phí hợp lý đối với vận chuyển, tháo dỡ/lắp lại cần thiết do lỗi sản phẩm, phụ tùng, kiểm thử và bảo hành thuộc trách nhiệm Bên B. Nếu Bên B không khắc phục trong thời hạn hợp lý sau khi được thông báo, Bên A có thể thực hiện biện pháp khẩn cấp hoặc mua thay thế từ bên thứ ba và yêu cầu hoàn trả chi phí thực tế có chứng từ mà không yêu cầu bồi thường trùng lặp.<span class=\"th\" data-t=\"9.3 ฝ่าย B รับผิดชอบค่าใช้จ่ายตามสมควรสำหรับการขนส่ง การรื้อถอน/ติดตั้งกลับที่จำเป็นอันเนื่องจากข้อบกพร่องของผลิตภัณฑ์ อะไหล่ การทดสอบ และการรับประกันที่อยู่ในความรับผิดชอบของฝ่าย B หากฝ่าย B ไม่แก้ไขภายในระยะเวลาอันสมควรหลังได้รับแจ้ง ฝ่าย A อาจดำเนินมาตรการเร่งด่วนหรือจัดซื้อสินค้าทดแทนจากบุคคลที่สาม และเรียกให้ชดใช้ค่าใช้จ่ายจริงที่มีเอกสารประกอบ โดยไม่เรียกค่าเสียหายซ้ำซ้อน\"></span></p><p class=\"sub\">9.4    Phụ tùng thay thế được bảo hành lại cho phần sửa chữa/thay thế trong thời hạn <strong><span class=\"fx\" data-k=\"...\"></span></strong> hoặc phần thời hạn bảo hành còn lại, tùy cơ chế được hai Bên phê duyệt. Không loại trừ quyền của Bên A đối với lỗi ẩn, thu hồi sản phẩm và trách nhiệm bắt buộc theo pháp luật.<span class=\"th\" data-t=\"9.4 อะไหล่ทดแทนได้รับการรับประกันใหม่สำหรับส่วนที่ซ่อมแซม/เปลี่ยนทดแทนภายในระยะเวลา 【...】 หรือระยะเวลารับประกันส่วนที่เหลือ แล้วแต่กลไกที่ทั้งสองฝ่ายอนุมัติ ไม่ตัดสิทธิของฝ่าย A ในกรณีข้อบกพร่องแฝง การเรียกคืนผลิตภัณฑ์ และความรับผิดตามที่กฎหมายบังคับ\"></span></p><h3 class=\"art\" data-n=\"10\"><strong>ĐIỀU 10. NGHĨA VỤ, NĂNG LỰC VÀ CAM KẾT CỦA BÊN BÁN</strong><span class=\"th\" data-t=\"ข้อ 10. ภาระหน้าที่ ศักยภาพ และคำมั่นของผู้ขาย\"></span></h3><p class=\"sub\">10.1    Bên B có tư cách, năng lực pháp lý, giấy phép/điều kiện kinh doanh cần thiết, đủ nhân lực và khả năng cung ứng; chịu trách nhiệm về nhà sản xuất/nhà thầu phụ/đơn vị vận chuyển do mình lựa chọn trong phạm vi nghĩa vụ đã nhận.<span class=\"th\" data-t=\"10.1 ฝ่าย B มีสถานะ ความสามารถทางกฎหมาย ใบอนุญาต/เงื่อนไขการประกอบธุรกิจที่จำเป็น บุคลากรเพียงพอ และความสามารถในการจัดหาสินค้า และรับผิดชอบต่อผู้ผลิต/ผู้รับเหมาช่วง/ผู้ขนส่งที่ตนเลือกในขอบเขตภาระหน้าที่ที่ได้รับ\"></span></p><p class=\"sub\">10.2    Bên B phải cung cấp thông tin chính xác và không giao hàng cấm, hàng không có nguồn gốc hợp pháp, không phù hợp tiêu chuẩn hoặc hàng xâm phạm quyền sở hữu trí tuệ. Khi có thay đổi ảnh hưởng đến việc cung ứng, Bên B phải thông báo và xin chấp thuận của Bên A trước.<span class=\"th\" data-t=\"10.2 ฝ่าย B ต้องให้ข้อมูลที่ถูกต้อง และห้ามส่งมอบสินค้าต้องห้าม สินค้าที่ไม่มีแหล่งที่มาโดยชอบด้วยกฎหมาย สินค้าที่ไม่สอดคล้องกับมาตรฐาน หรือสินค้าที่ละเมิดทรัพย์สินทางปัญญา เมื่อมีการเปลี่ยนแปลงที่ส่งผลกระทบต่อการจัดหาสินค้า ฝ่าย B ต้องแจ้งและขออนุมัติจากฝ่าย A ล่วงหน้า\"></span></p><p class=\"sub\">10.3    Trong trường hợp có tài liệu khách hàng do Bên A cung cấp, Bên B sử dụng chỉ trong phạm vi thực hiện PO; mọi yêu cầu đặc thù về thử nghiệm, quy cách và kiểm tra phải được nêu tại Phụ lục 01/04 và xác nhận trước khi sản xuất.<span class=\"th\" data-t=\"10.3 ในกรณีที่มีเอกสารของลูกค้าซึ่งฝ่าย A เป็นผู้จัดให้ ฝ่าย B ใช้เฉพาะในขอบเขตการปฏิบัติตาม PO เท่านั้น ข้อกำหนดเฉพาะทุกประการเกี่ยวกับการทดสอบ ข้อกำหนดทางเทคนิค และการตรวจสอบ ต้องระบุไว้ในภาคผนวก 01/04 และได้รับการยืนยันก่อนการผลิต\"></span></p><h3 class=\"art\" data-n=\"11\"><strong>ĐIỀU 11. BẢO ĐẢM THỰC HIỆN VÀ BẢO LÃNH NGÂN HÀNG</strong><span class=\"th\" data-t=\"ข้อ 11. หลักประกันการปฏิบัติตามสัญญาและหนังสือค้ำประกันของธนาคาร\"></span></h3><p class=\"sub\">11.1    Bảo lãnh hoàn trả tạm ứng áp dụng khi có tạm ứng: giá trị tối thiểu bằng khoản tạm ứng chưa được thu hồi, do ngân hàng <strong><span class=\"fx\" data-k=\"ĐƯỢC KSP CHẤP THUẬN\"></span></strong> phát hành; điều kiện đòi tiền, thời hạn hiệu lực, thời hạn khiếu nại và quyền gia hạn phải được KSP kiểm tra trước khi chuyển tiền.<span class=\"th\" data-t=\"11.1 หนังสือค้ำประกันการคืนเงินล่วงหน้าใช้บังคับเมื่อมีการจ่ายเงินล่วงหน้า: มูลค่าขั้นต่ำเท่ากับเงินล่วงหน้าที่ยังไม่ได้เรียกคืน ออกโดยธนาคาร 【ĐƯỢC KSP CHẤP THUẬN】 เงื่อนไขการเรียกร้องเงิน ระยะเวลามีผลบังคับ ระยะเวลาการยื่นข้อเรียกร้อง และสิทธิในการขยายระยะเวลา ต้องได้รับการตรวจสอบโดย KSP ก่อนการโอนเงิน\"></span></p><p class=\"sub\">11.2    Bảo lãnh thực hiện hợp đồng <strong><span class=\"fx\" data-k=\"CÓ / KHÔNG\"></span></strong> áp dụng; tỷ lệ <strong><span class=\"fx\" data-k=\"...\"></span></strong>% trên giá trị <strong><span class=\"fx\" data-k=\"PO / HỢP ĐỒNG\"></span></strong>; thời hạn phải bao phủ việc giao, nghiệm thu và thời gian yêu cầu thực hiện bảo lãnh. Bảo lãnh bảo hành hoặc tiền giữ lại <strong><span class=\"fx\" data-k=\"CÓ / KHÔNG\"></span></strong> áp dụng theo Điều 9 và Phụ lục 03, không trùng lặp không cần thiết.<span class=\"th\" data-t=\"11.2 หนังสือค้ำประกันการปฏิบัติตามสัญญา 【CÓ / KHÔNG】 ใช้บังคับ; อัตรา 【...】 % ของมูลค่า 【PO / HỢP ĐỒNG】; ระยะเวลาต้องครอบคลุมการส่งมอบ การตรวจรับ และระยะเวลาที่ต้องใช้ในการเรียกร้องตามหนังสือค้ำประกัน หนังสือค้ำประกันการรับประกันผลงานหรือเงินประกันผลงานที่กักไว้ 【CÓ / KHÔNG】 ใช้บังคับตามข้อ 9 และภาคผนวก 03 โดยไม่ซ้ำซ้อนโดยไม่จำเป็น\"></span></p><p class=\"sub\">11.3    Nếu Bên B không thể cung cấp bảo lãnh theo yêu cầu, KSP có thể lựa chọn biện pháp thay thế được phê duyệt tại Phụ lục 06; không được ghi nhận “đã có bảo đảm” nếu chỉ dựa trên cam kết của Bên B hoặc hóa đơn dự kiến.<span class=\"th\" data-t=\"11.3 หากฝ่าย B ไม่สามารถจัดหาหนังสือค้ำประกันตามที่กำหนดได้ KSP อาจเลือกมาตรการทดแทนที่ได้รับอนุมัติในภาคผนวก 06 ห้ามบันทึกว่า “มีหลักประกันแล้ว” หากอาศัยเพียงคำมั่นของฝ่าย B หรือใบแจ้งหนี้ที่คาดว่าจะออก\"></span></p><h3 class=\"art\" data-n=\"12\"><strong>ĐIỀU 12. CHẬM GIAO, GIAO THIẾU VÀ PHẠT VI PHẠM</strong><span class=\"th\" data-t=\"ข้อ 12. การส่งมอบล่าช้า การส่งมอบไม่ครบ และค่าปรับตามสัญญา\"></span></h3><p class=\"sub\">12.1    Trường hợp Bên B giao chậm do lỗi của mình, mức phạt dự kiến <strong><span class=\"fx\" data-k=\"0,5\"></span></strong>%/ngày trên giá trị phần nghĩa vụ giao hàng bị vi phạm (không mặc nhiên áp dụng trên toàn bộ Hợp đồng) tính từ hạn giao đến ngày hoàn thành hợp lệ; tổng các khoản phạt theo Luật Thương mại không vượt giới hạn pháp luật áp dụng, thông thường 8% giá trị phần nghĩa vụ bị vi phạm. Tỷ lệ thực tế và định nghĩa “giá trị phần vi phạm” phải ghi rõ tại Phụ lục 06 và được Law Firm kiểm tra.<span class=\"th\" data-t=\"12.1 กรณีฝ่าย B ส่งมอบล่าช้าด้วยความผิดของตนเอง อัตราค่าปรับที่คาดไว้ 【0,5】 %/วัน ของมูลค่าส่วนภาระหน้าที่ในการส่งมอบที่ถูกละเมิด (ไม่ใช้บังคับกับสัญญาทั้งฉบับโดยปริยาย) คำนวณตั้งแต่กำหนดส่งมอบจนถึงวันที่ดำเนินการแล้วเสร็จโดยชอบ ค่าปรับรวมตามกฎหมายการพาณิชย์ต้องไม่เกินขีดจำกัดของกฎหมายที่ใช้บังคับ โดยทั่วไปคือ 8% ของมูลค่าส่วนภาระหน้าที่ที่ถูกละเมิด อัตราที่ใช้จริงและนิยามของ “มูลค่าส่วนที่ถูกละเมิด” ต้องระบุให้ชัดเจนในภาคผนวก 06 และได้รับการตรวจสอบโดย Law Firm\"></span></p><p class=\"sub\">12.2    Với hàng giao thiếu, lỗi hoặc sai quy cách, Bên A được yêu cầu khắc phục theo Điều 7; nếu vi phạm và chậm khắc phục thì áp dụng mức phạt đã được thỏa thuận hợp pháp, tránh tính phạt trùng cho cùng một hành vi trên cùng nghĩa vụ. Không áp dụng phạt tự động khi việc chậm do lỗi Bên A hoặc trường hợp miễn trách nhiệm theo pháp luật.<span class=\"th\" data-t=\"12.2 สำหรับสินค้าที่ส่งมอบไม่ครบ บกพร่อง หรือผิดข้อกำหนด ฝ่าย A มีสิทธิเรียกให้แก้ไขตามข้อ 7 หากมีการละเมิดและแก้ไขล่าช้า ให้ใช้อัตราค่าปรับที่ตกลงกันโดยชอบด้วยกฎหมาย โดยหลีกเลี่ยงการคิดค่าปรับซ้ำสำหรับการกระทำเดียวกันในภาระหน้าที่เดียวกัน ไม่ใช้ค่าปรับโดยอัตโนมัติเมื่อความล่าช้าเกิดจากความผิดของฝ่าย A หรือกรณีได้รับการยกเว้นความรับผิดตามกฎหมาย\"></span></p><p class=\"sub\">12.3    Phạt vi phạm được tách biệt với bồi thường thiệt hại; việc đòi bồi thường cần xác định hành vi vi phạm, tổn thất thực tế, mối quan hệ nhân quả, nghĩa vụ hạn chế thiệt hại và bằng chứng theo luật. Bên A có quyền khiếu nại theo thủ tục Điều 20.<span class=\"th\" data-t=\"12.3 ค่าปรับตามสัญญาแยกต่างหากจากการชดใช้ค่าเสียหาย การเรียกร้องค่าเสียหายต้องระบุการกระทำที่เป็นการละเมิด ความสูญเสียที่เกิดขึ้นจริง ความสัมพันธ์เชิงเหตุและผล หน้าที่ในการบรรเทาความเสียหาย และพยานหลักฐานตามกฎหมาย ฝ่าย A มีสิทธิร้องเรียนตามขั้นตอนในข้อ 20\"></span></p><h3 class=\"art\" data-n=\"13\"><strong>ĐIỀU 13. BỒI THƯỜNG THIỆT HẠI VÀ GIỚI HẠN TRÁCH NHIỆM</strong><span class=\"th\" data-t=\"ข้อ 13. การชดใช้ค่าเสียหายและข้อจำกัดความรับผิด\"></span></h3><p class=\"sub\">13.1    Bên vi phạm bồi thường thiệt hại thực tế, trực tiếp, hợp lý và lợi nhuận trực tiếp bị mất nếu được pháp luật cho phép, đã được chứng minh và phát sinh do hành vi vi phạm. Bao gồm chi phí hợp lý để ngăn chặn/hạn chế thiệt hại, thu hồi, kiểm định, vận chuyển, mua hàng thay thế và chi phí thực tế liên quan đến khiếu nại khách hàng mà Bên B gây ra trong phạm vi trách nhiệm của mình.<span class=\"th\" data-t=\"13.1 ฝ่ายที่ละเมิดต้องชดใช้ค่าเสียหายที่เกิดขึ้นจริง โดยตรง และสมเหตุสมผล รวมทั้งกำไรโดยตรงที่สูญเสียไปหากกฎหมายอนุญาต ซึ่งได้พิสูจน์แล้วและเกิดจากการกระทำที่เป็นการละเมิด ครอบคลุมค่าใช้จ่ายตามสมควรเพื่อป้องกัน/จำกัดความเสียหาย การเรียกคืน การตรวจสอบ การขนส่ง การจัดซื้อสินค้าทดแทน และค่าใช้จ่ายจริงที่เกี่ยวข้องกับการร้องเรียนของลูกค้าที่ฝ่าย B เป็นผู้ก่อขึ้นในขอบเขตความรับผิดของตน\"></span></p><p class=\"sub\">13.2    Không tự động quy trách nhiệm cho Bên B đối với mọi khoản phạt của khách hàng cuối cùng, trừ khi (i) nghĩa vụ liên quan đã được chuyển giao rõ trong Phụ lục 04 và Bên B chấp thuận; (ii) có lỗi/vi phạm thuộc phạm vi Bên B; (iii) có mối liên hệ nhân quả và chứng cứ hợp lệ; và (iv) việc yêu cầu phù hợp pháp luật. KSP có trách nhiệm kiểm soát và hạn chế thiệt hại.<span class=\"th\" data-t=\"13.2 ไม่ถือโดยอัตโนมัติว่าฝ่าย B ต้องรับผิดต่อค่าปรับทุกรายการของลูกค้าปลายทาง เว้นแต่ (i) ภาระหน้าที่ที่เกี่ยวข้องได้ถูกถ่ายทอดอย่างชัดเจนในภาคผนวก 04 และฝ่าย B ยอมรับ; (ii) มีความผิด/การละเมิดที่อยู่ในขอบเขตของฝ่าย B; (iii) มีความสัมพันธ์เชิงเหตุและผลและพยานหลักฐานที่ถูกต้อง; และ (iv) การเรียกร้องสอดคล้องกับกฎหมาย KSP มีหน้าที่ควบคุมและจำกัดความเสียหาย\"></span></p><p class=\"sub\">13.3    Giới hạn trách nhiệm của Bên B, nếu được chấp nhận: <strong><span class=\"fx\" data-k=\"KHÔNG ÁP DỤNG / ...% GIÁ TRỊ PO LIÊN QUAN\"></span></strong>, phải xác định rõ các trường hợp ngoại lệ theo pháp luật và thỏa thuận hợp lệ; không tự chấp thuận điều khoản giới hạn trách nhiệm 100% hoặc loại trừ mọi thiệt hại gián tiếp trong mẫu nhà cung cấp mà chưa đánh giá rủi ro và phê duyệt theo Phụ lục 06.<span class=\"th\" data-t=\"13.3 ข้อจำกัดความรับผิดของฝ่าย B หากได้รับการยอมรับ: 【KHÔNG ÁP DỤNG /...% GIÁ TRỊ PO LIÊN QUAN】 ต้องระบุกรณียกเว้นตามกฎหมายและข้อตกลงที่ชอบด้วยกฎหมายให้ชัดเจน ห้ามยอมรับข้อกำหนดจำกัดความรับผิด 100% หรือการยกเว้นความเสียหายทางอ้อมทั้งหมดในแบบสัญญาของผู้ขายโดยลำพัง หากยังไม่ได้ประเมินความเสี่ยงและได้รับอนุมัติตามภาคผนวก 06\"></span></p><h3 class=\"art\" data-n=\"14\"><strong>ĐIỀU 14. THAY ĐỔI PO, THAY ĐỔI QUY CÁCH VÀ ĐIỀU CHỈNH GIÁ</strong><span class=\"th\" data-t=\"ข้อ 14. การเปลี่ยนแปลง PO การเปลี่ยนแปลงข้อกำหนดทางเทคนิค และการปรับราคา\"></span></h3><p class=\"sub\">14.1    Bất kỳ thay đổi lượng, quy cách, địa điểm, lịch giao hoặc mẫu duyệt phải có yêu cầu sửa đổi bằng văn bản trước khi thực hiện; Bên B trình ảnh hưởng giá, tồn kho, chi phí không thể thu hồi và tiến độ, có chứng cứ; chỉ thực hiện khi đại diện có thẩm quyền hai Bên chấp thuận.<span class=\"th\" data-t=\"14.1 การเปลี่ยนแปลงใด ๆ เกี่ยวกับจำนวน ข้อกำหนดทางเทคนิค สถานที่ กำหนดการส่งมอบ หรือตัวอย่างที่อนุมัติ ต้องมีคำขอแก้ไขเป็นลายลักษณ์อักษรก่อนดำเนินการ ฝ่าย B ต้องเสนอผลกระทบต่อราคา สินค้าคงคลัง ค่าใช้จ่ายที่ไม่สามารถเรียกคืนได้ และกำหนดการ พร้อมพยานหลักฐาน และจะดำเนินการได้ต่อเมื่อผู้แทนที่มีอำนาจของทั้งสองฝ่ายอนุมัติ\"></span></p><p class=\"sub\">14.2    Nếu khách hàng cuối cùng thay đổi yêu cầu, Bên A và Bên B đánh giá ngay những phần ảnh hưởng tương ứng; không mặc nhiên chuyển toàn bộ chi phí của Bên A hoặc khách hàng cho Bên B. Các thay đổi không ảnh hưởng phần hàng khác không cho phép dừng cung ứng toàn bộ.<span class=\"th\" data-t=\"14.2 หากลูกค้าปลายทางเปลี่ยนแปลงข้อกำหนด ฝ่าย A และฝ่าย B ต้องประเมินส่วนที่ได้รับผลกระทบตามสัดส่วนโดยทันที ไม่ถือโดยปริยายว่าโอนค่าใช้จ่ายทั้งหมดของฝ่าย A หรือของลูกค้าให้ฝ่าย B การเปลี่ยนแปลงที่ไม่กระทบต่อส่วนของสินค้าอื่นไม่ทำให้สามารถหยุดการจัดหาทั้งหมดได้\"></span></p><h3 class=\"art\" data-n=\"15\"><strong>ĐIỀU 15. TẠM NGỪNG, VI PHẠM CƠ BẢN VÀ CHẤM DỨT HỢP ĐỒNG</strong><span class=\"th\" data-t=\"ข้อ 15. การระงับชั่วคราว การละเมิดสาระสำคัญ และการเลิกสัญญา\"></span></h3><p class=\"sub\">15.1    Một Bên có thể yêu cầu Bên kia khắc phục vi phạm trong <strong><span class=\"fx\" data-k=\"07/15\"></span></strong> ngày kể từ khi nhận thông báo hợp lệ. Đối với vi phạm không thể khắc phục, hàng giả, nguy cơ an toàn nghiêm trọng hoặc hành vi bị pháp luật cấm, áp dụng quyền chấm dứt/tạm ngừng theo căn cứ pháp luật và Hợp đồng mà không bắt buộc chờ hết thời hạn không phù hợp.<span class=\"th\" data-t=\"15.1 คู่สัญญาฝ่ายหนึ่งอาจเรียกให้อีกฝ่ายแก้ไขการละเมิดภายใน 【07/15】 วัน นับแต่ได้รับการแจ้งโดยชอบ สำหรับการละเมิดที่ไม่อาจแก้ไขได้ สินค้าปลอม ความเสี่ยงด้านความปลอดภัยอย่างร้ายแรง หรือการกระทำที่กฎหมายห้าม ให้ใช้สิทธิเลิก/ระงับชั่วคราวตามเหตุที่กฎหมายและสัญญากำหนด โดยไม่จำเป็นต้องรอให้พ้นกำหนดเวลาที่ไม่เหมาะสม\"></span></p><p class=\"sub\">15.2    Bên A có thể chấm dứt PO hoặc phần chưa thực hiện do Bên B giao chậm nghiêm trọng, không khắc phục hàng lỗi, mất năng lực cung ứng, vi phạm tuân thủ pháp luật hoặc các trường hợp được thỏa thuận; Bên B hoàn trả tiền tương ứng phần chưa cung cấp và khoản tạm ứng còn chưa thu hồi trong <strong><span class=\"fx\" data-k=\"07\"></span></strong> ngày làm việc từ khi xác định nghĩa vụ hoàn trả, không ảnh hưởng quyền yêu cầu bồi thường hợp lệ.<span class=\"th\" data-t=\"15.2 ฝ่าย A อาจเลิก PO หรือส่วนที่ยังไม่ได้ปฏิบัติ เนื่องจากฝ่าย B ส่งมอบล่าช้าอย่างร้ายแรง ไม่แก้ไขสินค้าบกพร่อง สูญเสียความสามารถในการจัดหาสินค้า ละเมิดการปฏิบัติตามกฎหมาย หรือกรณีอื่นที่ตกลงกัน ฝ่าย B ต้องคืนเงินตามส่วนที่ยังไม่ได้ส่งมอบและเงินล่วงหน้าที่ยังไม่ได้เรียกคืนภายใน 【07】 วันทำการ นับแต่วันที่กำหนดภาระหน้าที่ในการคืนเงิน โดยไม่กระทบสิทธิในการเรียกร้องค่าเสียหายโดยชอบ\"></span></p><p class=\"sub\">15.3    Chấm dứt không do lỗi Bên B (ví dụ dự án khách hàng dừng) phải có quy trình báo trước <strong><span class=\"fx\" data-k=\"...\"></span></strong> ngày; Các Bên xác định hàng đã giao/nghiệm thu, hàng đang sản xuất được Bên A duyệt, chi phí thực tế không thể hủy hợp lý và biện pháp giảm thiểu, tái bán hoặc sử dụng lại. Khoản phải trả thêm không áp dụng theo bảng phí cố định 30%/60%/90%/100% của nhà cung cấp, trừ khi được phê duyệt tại Phụ lục 06 kèm ước tính rủi ro và cơ chế chuyển/thu hồi tài sản tương ứng.<span class=\"th\" data-t=\"15.3 การเลิกสัญญาที่ไม่ใช่ความผิดของฝ่าย B (เช่น โครงการของลูกค้าหยุดชะงัก) ต้องมีขั้นตอนการบอกกล่าวล่วงหน้า 【...】 วัน; คู่สัญญาต้องกำหนดสินค้าที่ส่งมอบ/ตรวจรับแล้ว สินค้าที่อยู่ระหว่างการผลิตซึ่งฝ่าย A อนุมัติ ค่าใช้จ่ายจริงที่ไม่สามารถยกเลิกได้ตามสมควร และมาตรการบรรเทา การขายต่อ หรือการนำกลับมาใช้ใหม่ จำนวนเงินที่ต้องชำระเพิ่มเติมไม่ใช้ตามตารางค่าธรรมเนียมคงที่ 30%/60%/90%/100% ของผู้ขาย เว้นแต่ได้รับอนุมัติในภาคผนวก 06 พร้อมการประมาณการความเสี่ยงและกลไกการโอน/เรียกคืนทรัพย์สินที่สอดคล้องกัน\"></span></p><p class=\"sub\">15.4    Khi kết thúc hoặc hủy PO, lập biên bản đối chiếu tiền hàng đã nhận, khoản tạm ứng còn lại, hàng dở dang thuộc quyền của Bên nào, phí hủy được phê duyệt, chi phí khắc phục và nghĩa vụ bảo hành còn hiệu lực; không quy chồng phí hủy và bồi thường cho cùng tổn thất.<span class=\"th\" data-t=\"15.4 เมื่อสิ้นสุดหรือยกเลิก PO ให้จัดทำรายงานการกระทบยอดเกี่ยวกับค่าสินค้าที่ได้รับ เงินล่วงหน้าคงเหลือ สินค้าระหว่างผลิตที่เป็นสิทธิของฝ่ายใด ค่าธรรมเนียมการยกเลิกที่ได้รับอนุมัติ ค่าใช้จ่ายในการแก้ไข และภาระหน้าที่ในการรับประกันที่ยังมีผลบังคับ ไม่คิดค่าธรรมเนียมการยกเลิกและค่าชดใช้ซ้อนกันสำหรับความสูญเสียเดียวกัน\"></span></p><h3 class=\"art\" data-n=\"16\"><strong>ĐIỀU 16. BẤT KHẢ KHÁNG VÀ GIÁN ĐOẠN CHUỖI CUNG ỨNG</strong><span class=\"th\" data-t=\"ข้อ 16. เหตุสุดวิสัยและการหยุดชะงักของห่วงโซ่อุปทาน\"></span></h3><p class=\"sub\">16.1    Sự kiện bất khả kháng được xác định theo pháp luật Việt Nam; Bên chịu ảnh hưởng phải thông báo trong <strong><span class=\"fx\" data-k=\"02\"></span></strong> ngày làm việc sau khi có thể, cung cấp chứng cứ, biện pháp giảm thiểu và dự kiến khôi phục trong <strong><span class=\"fx\" data-k=\"05\"></span></strong> ngày làm việc. Chỉ phần nghĩa vụ bị ảnh hưởng trực tiếp được xem xét miễn/trì hoãn theo pháp luật.<span class=\"th\" data-t=\"16.1 เหตุสุดวิสัยให้กำหนดตามกฎหมายเวียดนาม ฝ่ายที่ได้รับผลกระทบต้องแจ้งภายใน 【02】 วันทำการหลังจากที่สามารถทำได้ ให้พยานหลักฐาน มาตรการบรรเทา และการคาดการณ์การกลับสู่ภาวะปกติภายใน 【05】 วันทำการ พิจารณายกเว้น/เลื่อนเฉพาะส่วนภาระหน้าที่ที่ได้รับผลกระทบโดยตรงตามกฎหมาย\"></span></p><p class=\"sub\">16.2    Biến động giá, thiếu nguồn cung thông thường, giao hàng chậm từ nhà cung cấp phụ hoặc khó khăn dòng tiền không đương nhiên là bất khả kháng. Nếu sự kiện tiếp diễn quá <strong><span class=\"fx\" data-k=\"30/60\"></span></strong> ngày hoặc khiến mục đích PO không thể thực hiện, quyền chấm dứt/đối chiếu được xem xét theo Điều 15 và pháp luật.<span class=\"th\" data-t=\"16.2 ความผันผวนของราคา การขาดแคลนวัตถุดิบตามปกติ การส่งมอบล่าช้าจากผู้ขายรายย่อย หรือปัญหากระแสเงินสด ไม่ถือเป็นเหตุสุดวิสัยโดยอัตโนมัติ หากเหตุการณ์ดำเนินต่อไปเกิน 【30/60】 วัน หรือทำให้วัตถุประสงค์ของ PO ไม่อาจบรรลุได้ สิทธิในการเลิก/กระทบยอดจะได้รับการพิจารณาตามข้อ 15 และกฎหมาย\"></span></p><h3 class=\"art\" data-n=\"17\"><strong>ĐIỀU 17. BẢO MẬT, QUYỀN SỞ HỮU TRÍ TUỆ VÀ TÀI LIỆU</strong><span class=\"th\" data-t=\"ข้อ 17. การรักษาความลับ ทรัพย์สินทางปัญญา และเอกสาร\"></span></h3><p class=\"sub\">17.1    Bên B bảo mật giá, bản vẽ, thiết kế, quy trình, thông tin khách hàng, dự báo và dữ liệu của KSP; chỉ dùng để thực hiện Hợp đồng và không công bố nếu chưa được chấp thuận hoặc pháp luật bắt buộc. Nghĩa vụ bảo mật còn hiệu lực sau khi kết thúc trong <strong><span class=\"fx\" data-k=\"...\"></span></strong> năm hoặc thời hạn khác theo luật.<span class=\"th\" data-t=\"17.1 ฝ่าย B ต้องรักษาความลับของราคา แบบแปลน การออกแบบ กระบวนการ ข้อมูลลูกค้า การคาดการณ์ และข้อมูลของ KSP ใช้เพื่อการปฏิบัติตามสัญญาเท่านั้น และไม่เปิดเผยหากยังไม่ได้รับอนุมัติหรือกฎหมายไม่ได้บังคับ หน้าที่รักษาความลับยังคงมีผลหลังสิ้นสุดสัญญาเป็นเวลา 【...】 ปี หรือระยะเวลาอื่นตามกฎหมาย\"></span></p><p class=\"sub\">17.2    Bên B bảo đảm việc cung cấp, sử dụng, bán lại Hàng hóa không xâm phạm quyền sở hữu trí tuệ của bên thứ ba trong phạm vi Bên B chịu trách nhiệm; nếu có khiếu nại có cơ sở, Bên B phối hợp xử lý, cung cấp quyền sử dụng hợp pháp hoặc hàng thay thế, và chịu chi phí/thiệt hại theo Điều 13.<span class=\"th\" data-t=\"17.2 ฝ่าย B รับประกันว่าการจัดหา การใช้ และการขายต่อสินค้าไม่ละเมิดทรัพย์สินทางปัญญาของบุคคลที่สามในขอบเขตที่ฝ่าย B รับผิดชอบ หากมีการร้องเรียนที่มีมูล ฝ่าย B ต้องประสานงานในการจัดการ จัดหาสิทธิการใช้งานโดยชอบหรือสินค้าทดแทน และรับผิดชอบค่าใช้จ่าย/ความเสียหายตามข้อ 13\"></span></p><p class=\"sub\">17.3    Bản vẽ, khuôn, dụng cụ, tài liệu hoặc vật liệu do KSP cung cấp hay thanh toán để sở hữu phải được ghi nhận riêng về quyền sở hữu, tình trạng và nghĩa vụ hoàn trả tại Phụ lục 01/05; không tự suy diễn chuyển giao toàn bộ sở hữu trí tuệ của nhà sản xuất.<span class=\"th\" data-t=\"17.3 แบบแปลน แม่พิมพ์ เครื่องมือ เอกสาร หรือวัสดุที่ KSP จัดหาให้หรือชำระเงินเพื่อให้ได้กรรมสิทธิ์ ต้องบันทึกแยกต่างหากเกี่ยวกับสิทธิความเป็นเจ้าของ สภาพ และหน้าที่ในการส่งคืนในภาคผนวก 01/05 ห้ามตีความเองว่าเป็นการโอนทรัพย์สินทางปัญญาทั้งหมดของผู้ผลิต\"></span></p><h3 class=\"art\" data-n=\"18\"><strong>ĐIỀU 18. AN TOÀN, MÔI TRƯỜNG, TRUY XUẤT VÀ TUÂN THỦ ĐỊA ĐIỂM</strong><span class=\"th\" data-t=\"ข้อ 18. ความปลอดภัย สิ่งแวดล้อม การตรวจสอบย้อนกลับ และการปฏิบัติตามข้อกำหนดของสถานที่\"></span></h3><p class=\"sub\">18.1    Khi Bên B hoặc đơn vị vận chuyển vào nhà máy/trang trại/kho của Bên A hoặc khách hàng cuối cùng, Bên B phải tuân thủ nội quy an toàn, PCCC, vệ sinh môi trường, an toàn sinh học, yêu cầu đăng ký người và xe được thông báo trước. Vi phạm gây thiệt hại thực tế được xử lý theo Điều 13.<span class=\"th\" data-t=\"18.1 เมื่อฝ่าย B หรือผู้ขนส่งเข้าไปในโรงงาน/ฟาร์ม/คลังสินค้าของฝ่าย A หรือลูกค้าปลายทาง ฝ่าย B ต้องปฏิบัติตามระเบียบความปลอดภัย การป้องกันและระงับอัคคีภัย (PCCC) สุขอนามัยสิ่งแวดล้อม ความปลอดภัยทางชีวภาพ และข้อกำหนดการลงทะเบียนบุคคลและยานพาหนะที่แจ้งล่วงหน้า การละเมิดที่ก่อให้เกิดความเสียหายจริงให้จัดการตามข้อ 13\"></span></p><p class=\"sub\">18.2    Hàng phải được đóng gói, dán nhãn, đánh số lô và có hồ sơ truy xuất theo pháp luật và yêu cầu PO. Với hàng nguy hiểm hoặc hóa chất, phải cung cấp chứng từ vận chuyển, SDS và giấy phép hợp lệ; không giao khi Bên A chưa chấp thuận điều kiện đặc thù.<span class=\"th\" data-t=\"18.2 สินค้าต้องได้รับการบรรจุ ติดฉลาก ระบุหมายเลขล็อต และมีเอกสารการตรวจสอบย้อนกลับตามกฎหมายและข้อกำหนดของ PO สำหรับสินค้าอันตรายหรือสารเคมี ต้องจัดหาเอกสารการขนส่ง SDS และใบอนุญาตที่ถูกต้อง ห้ามส่งมอบเมื่อฝ่าย A ยังไม่อนุมัติเงื่อนไขเฉพาะ\"></span></p><h3 class=\"art\" data-n=\"19\"><strong>ĐIỀU 19. TUÂN THỦ PHÁP LUẬT, CHỐNG HỐI LỘ VÀ XUNG ĐỘT LỢI ÍCH</strong><span class=\"th\" data-t=\"ข้อ 19. การปฏิบัติตามกฎหมาย การต่อต้านการให้สินบน และความขัดแย้งทางผลประโยชน์\"></span></h3><p class=\"sub\">19.1    Các Bên tuân thủ pháp luật Việt Nam về thương mại, thuế, chất lượng, chống tham nhũng, cạnh tranh và các quy định có liên quan; không hứa hẹn, cho hoặc nhận lợi ích bất chính, không làm giả hồ sơ giao hàng, chứng từ chất lượng, xuất xứ hoặc hồ sơ thanh toán.<span class=\"th\" data-t=\"19.1 คู่สัญญาปฏิบัติตามกฎหมายเวียดนามว่าด้วยการพาณิชย์ ภาษี คุณภาพ การต่อต้านการทุจริต การแข่งขัน และบทบัญญัติที่เกี่ยวข้อง ไม่สัญญา ให้ หรือรับผลประโยชน์ที่มิชอบ ไม่ปลอมแปลงเอกสารการส่งมอบ เอกสารด้านคุณภาพ ถิ่นกำเนิด หรือเอกสารการชำระเงิน\"></span></p><p class=\"sub\">19.2    Nếu có vi phạm nghiêm trọng, Bên không vi phạm có quyền yêu cầu giải trình, đình chỉ/đơn phương chấm dứt trong phạm vi pháp luật và đòi bồi thường chứng minh được. Mọi khoản phạt tiền riêng cho vi phạm tuân thủ phải được Law Firm kiểm tra tính hợp pháp, không mặc nhiên chép mức phạt cố định trong hợp đồng của khách hàng cuối cùng.<span class=\"th\" data-t=\"19.2 หากมีการละเมิดอย่างร้ายแรง ฝ่ายที่ไม่ได้ละเมิดมีสิทธิเรียกให้ชี้แจง ระงับ/บอกเลิกฝ่ายเดียวในขอบเขตที่กฎหมายกำหนด และเรียกค่าเสียหายที่พิสูจน์ได้ ค่าปรับเป็นเงินแยกต่างหากสำหรับการละเมิดด้านการปฏิบัติตามกฎหมายทุกรายการต้องได้รับการตรวจสอบความชอบด้วยกฎหมายโดย Law Firm ห้ามคัดลอกอัตราค่าปรับคงที่ในสัญญาของลูกค้าปลายทางโดยปริยาย\"></span></p><h3 class=\"art\" data-n=\"20\"><strong>ĐIỀU 20. THÔNG BÁO, KHIẾU NẠI VÀ QUY TRÌNH XỬ LÝ TRANH CHẤP</strong><span class=\"th\" data-t=\"ข้อ 20 การแจ้ง การร้องเรียน และขั้นตอนการระงับข้อพิพาท\"></span></h3><p class=\"sub\">20.1    Thông báo theo Hợp đồng phải bằng tiếng Việt, lập thành văn bản và gửi tới email/địa chỉ người phụ trách được ghi tại phần đầu Hợp đồng/Phụ lục 05. Thời điểm nhận thông báo được xác định theo chứng cứ gửi nhận hợp lệ và quy định pháp luật về giao dịch điện tử.<span class=\"th\" data-t=\"20.1 การแจ้งตามสัญญาต้องทำเป็นภาษาเวียดนาม เป็นลายลักษณ์อักษร และส่งไปยังอีเมล/ที่อยู่ของผู้รับผิดชอบที่ระบุไว้ในส่วนต้นของสัญญา/ภาคผนวก 05 เวลาที่ถือว่าได้รับการแจ้งให้กำหนดตามหลักฐานการส่งและรับที่ชอบด้วยกฎหมาย และตามบทบัญญัติของกฎหมายว่าด้วยธุรกรรมอิเล็กทรอนิกส์\"></span></p><p class=\"sub\">20.2    Bên khiếu nại nêu rõ PO, sự kiện, số lượng, chứng cứ, đề nghị xử lý và thời hạn phản hồi hợp lý; Bên nhận khiếu nại phản hồi trong <strong><span class=\"fx\" data-k=\"03\"></span></strong> ngày làm việc hoặc thời gian khẩn cấp khác trong Phụ lục 02. Trong thời gian giải quyết khiếu nại, Các Bên tiếp tục thực hiện phần nghĩa vụ không tranh chấp khi khả thi.<span class=\"th\" data-t=\"20.2 ฝ่ายที่ร้องเรียนต้องระบุให้ชัดเจนซึ่ง PO เหตุการณ์ จำนวน หลักฐาน ข้อเสนอให้ดำเนินการแก้ไข และกำหนดเวลาตอบกลับที่สมเหตุสมผล ฝ่ายที่ได้รับการร้องเรียนต้องตอบกลับภายใน 【03】 วันทำการ หรือภายในระยะเวลาเร่งด่วนอื่นตามที่กำหนดในภาคผนวก 02 ในระหว่างการแก้ไขข้อร้องเรียน คู่สัญญาทั้งสองฝ่ายยังคงปฏิบัติตามภาระผูกพันในส่วนที่ไม่มีข้อพิพาทต่อไปเท่าที่สามารถทำได้\"></span></p><h3 class=\"art\" data-n=\"21\"><strong>ĐIỀU 21. LUẬT ÁP DỤNG VÀ GIẢI QUYẾT TRANH CHẤP</strong><span class=\"th\" data-t=\"ข้อ 21 กฎหมายที่ใช้บังคับและการระงับข้อพิพาท\"></span></h3><p class=\"sub\">21.1    Hợp đồng được điều chỉnh bởi pháp luật Việt Nam. Hai Bên ưu tiên thương lượng trong vòng <strong><span class=\"fx\" data-k=\"30\"></span></strong> ngày kể từ thông báo tranh chấp trước khi đưa vụ việc tới cơ quan giải quyết tranh chấp đã lựa chọn.<span class=\"th\" data-t=\"21.1 สัญญานี้อยู่ภายใต้บังคับของกฎหมายเวียดนาม คู่สัญญาทั้งสองฝ่ายให้ความสำคัญกับการเจรจาภายในระยะเวลา 【30】 วันนับแต่วันที่มีการแจ้งข้อพิพาท ก่อนนำเรื่องไปยังหน่วยงานระงับข้อพิพาทที่ได้เลือกไว้\"></span></p><p class=\"sub\">21.2    Phương thức giải quyết tranh chấp (chọn một): <strong><span class=\"fx\" data-k=\"TRỌNG TÀI VIAC theo Quy tắc VIAC, địa điểm ... / TÒA ÁN VIỆT NAM CÓ THẨM QUYỀN\"></span></strong>. Nếu chọn trọng tài, Các Bên ghi rõ trung tâm, số trọng tài viên, địa điểm và ngôn ngữ. Không để đồng thời các điều khoản trọng tài, tòa án trái nhau.<span class=\"th\" data-t=\"21.2 วิธีการระงับข้อพิพาท (เลือกหนึ่งวิธี): 【TRỌNG TÀI VIAC theo Quy tắc VIAC, địa điểm... / TÒA ÁN VIỆT NAM CÓ THẨM QUYỀN】 หากเลือกอนุญาโตตุลาการ คู่สัญญาต้องระบุให้ชัดเจนซึ่งศูนย์อนุญาโตตุลาการ จำนวนอนุญาโตตุลาการ สถานที่ และภาษา ห้ามมีข้อกำหนดเรื่องอนุญาโตตุลาการและศาลที่ขัดแย้งกันอยู่พร้อมกัน\"></span></p><h3 class=\"art\" data-n=\"22\"><strong>ĐIỀU 22. BACK-TO-BACK VỚI HỢP ĐỒNG KHÁCH HÀNG CỦA KSP</strong><span class=\"th\" data-t=\"ข้อ 22 แบบ Back-to-Back กับสัญญาลูกค้าของ KSP\"></span></h3><p class=\"sub\">22.1    Đối với hàng được Bên A cung cấp cho khách hàng cuối cùng, hai Bên lập và ký Bảng đối chiếu Back-to-Back tại Phụ lục 04 theo từng dự án/PO: hàng hóa–chất lượng–chứng từ, địa điểm/mốc giao, kiểm tra, bảo hành, phạt, trách nhiệm, thu hồi, thay đổi và chấm dứt. Bên B chỉ tiếp nhận những nghĩa vụ được ghi rõ, có thể thực hiện được và thuộc phạm vi Hàng hóa do mình cung cấp.<span class=\"th\" data-t=\"22.1 สำหรับสินค้าที่ฝ่าย A จัดหาให้แก่ลูกค้าปลายทาง คู่สัญญาทั้งสองฝ่ายจัดทำและลงนามตารางเปรียบเทียบแบบ Back-to-Back ในภาคผนวก 04 ตามแต่ละโครงการ/PO ได้แก่ สินค้า–คุณภาพ–เอกสาร สถานที่/กำหนดการส่งมอบ การตรวจสอบ การรับประกัน ค่าปรับ ความรับผิด การเรียกคืน การเปลี่ยนแปลง และการยุติสัญญา ฝ่าย B รับโอนเฉพาะภาระผูกพันที่ระบุไว้อย่างชัดเจน สามารถปฏิบัติได้ และอยู่ในขอบเขตของสินค้าที่ตนเป็นผู้จัดหา\"></span></p><p class=\"sub\">22.2    Thời điểm KSP nhận tiền khách hàng được dùng để đánh giá dòng tiền, không làm thay đổi nghĩa vụ thanh toán cho Bên B trừ khi Các Bên có thỏa thuận hợp lệ và được pháp luật cho phép. Khi nghĩa vụ khách hàng khắt khe hơn nghĩa vụ nhà cung cấp, Phụ lục 04 phải ghi rõ người chịu rủi ro còn lại, phương án kiểm soát và phê duyệt nội bộ trước khi ký.<span class=\"th\" data-t=\"22.2 เวลาที่ KSP ได้รับเงินจากลูกค้าใช้เพื่อประเมินกระแสเงินสดเท่านั้น และไม่ทำให้ภาระผูกพันในการชำระเงินให้แก่ฝ่าย B เปลี่ยนแปลงไป เว้นแต่คู่สัญญาทั้งสองฝ่ายจะมีข้อตกลงที่ชอบด้วยกฎหมายและกฎหมายอนุญาต เมื่อภาระผูกพันต่อลูกค้าเข้มงวดกว่าภาระผูกพันของผู้ขาย ภาคผนวก 04 ต้องระบุให้ชัดเจนถึงผู้รับความเสี่ยงส่วนที่เหลือ มาตรการควบคุม และการอนุมัติภายในก่อนลงนาม\"></span></p><p class=\"sub\">22.3    Bên A cung cấp cho Bên B các trích đoạn yêu cầu kỹ thuật/điều kiện khách hàng cần thiết mà không vi phạm bảo mật; không tự chuyển giao toàn bộ Hợp đồng khách hàng, khoản phạt khách hàng, quyền đơn phương thay đổi hoặc hậu quả do lỗi Bên A. Các khoản chi phí và phạt chuyển tiếp phải đáp ứng Điều 12–13 và pháp luật hiện hành.<span class=\"th\" data-t=\"22.3 ฝ่าย A ส่งมอบให้ฝ่าย B ซึ่งข้อความที่คัดมาจากข้อกำหนดทางเทคนิค/เงื่อนไขของลูกค้าเท่าที่จำเป็น โดยไม่ละเมิดความลับ ทั้งนี้ จะไม่โอนทั้งหมดของสัญญาลูกค้า ค่าปรับที่ลูกค้าเรียกเก็บ สิทธิในการเปลี่ยนแปลงฝ่ายเดียว หรือผลที่เกิดจากความผิดของฝ่าย A ไปยังฝ่าย B ค่าใช้จ่ายและค่าปรับที่ส่งต่อต้องเป็นไปตามข้อ 12–13 และกฎหมายที่มีผลบังคับใช้\"></span></p><h3 class=\"art\" data-n=\"23\"><strong>ĐIỀU 23. HIỆU LỰC, PHỤ LỤC VÀ CHỮ KÝ</strong><span class=\"th\" data-t=\"ข้อ 23 ผลใช้บังคับ ภาคผนวก และการลงนาม\"></span></h3><p class=\"sub\">23.1    Hợp đồng có hiệu lực từ <strong><span class=\"fx\" data-k=\"NGÀY\"></span></strong> đến <strong><span class=\"fx\" data-k=\"NGÀY\"></span></strong> hoặc đến khi hoàn tất nghĩa vụ còn hiệu lực. Với Hợp đồng áp dụng cho nhiều PO, các PO được xác nhận trước ngày hết hạn vẫn chịu các điều khoản liên quan cho đến khi hoàn thành, trừ khi có thỏa thuận khác.<span class=\"th\" data-t=\"23.1 สัญญามีผลใช้บังคับตั้งแต่ 【NGÀY】 ถึง 【NGÀY】 หรือจนกว่าภาระผูกพันที่ยังมีผลจะเสร็จสิ้น สำหรับสัญญาที่ใช้กับหลาย PO ให้ PO ที่ได้รับการยืนยันก่อนวันสิ้นสุดอายุยังคงอยู่ภายใต้ข้อกำหนดที่เกี่ยวข้องจนกว่าจะแล้วเสร็จ เว้นแต่มีข้อตกลงเป็นอย่างอื่น\"></span></p><p class=\"sub\">23.2    Hợp đồng bao gồm 23 Điều và các Phụ lục 01–06 (khi được hai Bên ký/ghi nhận áp dụng). Các điều khoản bảo hành, bảo mật, giải quyết tranh chấp, khiếu nại và bồi thường vẫn có hiệu lực sau khi kết thúc trong phạm vi pháp luật và thời hạn nghĩa vụ.<span class=\"th\" data-t=\"23.2 สัญญานี้ประกอบด้วย 23 ข้อ และภาคผนวก 01–06 (เมื่อคู่สัญญาทั้งสองฝ่ายลงนาม/บันทึกว่านำมาใช้) ข้อกำหนดเกี่ยวกับการรับประกัน การรักษาความลับ การระงับข้อพิพาท การร้องเรียน และการชดใช้ค่าเสียหาย ยังคงมีผลบังคับภายหลังสัญญาสิ้นสุดภายในขอบเขตของกฎหมายและระยะเวลาของภาระผูกพัน\"></span></p><p class=\"sub\">23.3    Các ô <strong><span class=\"fx\" data-k=\"...\"></span></strong> cần được điền, các phương án không áp dụng phải xóa hoặc ghi “Không áp dụng” trước khi ký. Mọi sửa đổi phải được người có thẩm quyền phê duyệt bằng văn bản/ký điện tử hợp lệ. Hợp đồng lập bằng tiếng Việt thành <strong><span class=\"fx\" data-k=\"...\"></span></strong> bản hoặc bản điện tử có giá trị tương đương theo pháp luật.<span class=\"th\" data-t=\"23.3 ช่อง 【...】 ต้องได้รับการกรอก ส่วนทางเลือกที่ไม่นำมาใช้ต้องลบออกหรือระบุว่า “ไม่ใช้บังคับ” ก่อนลงนาม การแก้ไขเปลี่ยนแปลงทุกรายการต้องได้รับการอนุมัติจากผู้มีอำนาจเป็นลายลักษณ์อักษร/ลายมือชื่ออิเล็กทรอนิกส์ที่ชอบด้วยกฎหมาย สัญญาจัดทำเป็นภาษาเวียดนามจำนวน 【...】 ฉบับ หรือฉบับอิเล็กทรอนิกส์ซึ่งมีค่าเทียบเท่าตามกฎหมาย\"></span></p><div class=\"tw2\"><table class=\"ct\"><tr><th><strong>ĐẠI DIỆN BÊN A – KSP VIỆT NAM</strong><span class=\"th\" data-t=\"ผู้แทนฝ่าย A – KSP เวียดนาม\"></span></th><th><strong>ĐẠI DIỆN BÊN B – NHÀ CUNG CẤP</strong><span class=\"th\" data-t=\"ผู้แทนฝ่าย B – ผู้ขาย/ผู้จัดหา\"></span></th></tr><tr><td>Họ tên: <strong><span class=\"fx\" data-k=\"...\"></span></strong><br/>Chức vụ: <strong><span class=\"fx\" data-k=\"...\"></span></strong><br/>Ký, ghi rõ họ tên, đóng dấu (nếu áp dụng)<span class=\"th\" data-t=\"ชื่อ-นามสกุล: 【...】 ตำแหน่ง: 【...】 ลงนาม ระบุชื่อ-นามสกุลให้ชัดเจน และประทับตรา (ถ้ามี)\"></span></td><td>Họ tên: <strong><span class=\"fx\" data-k=\"...\"></span></strong><br/>Chức vụ: <strong><span class=\"fx\" data-k=\"...\"></span></strong><br/>Ký, ghi rõ họ tên, đóng dấu (nếu áp dụng)<span class=\"th\" data-t=\"ชื่อ-นามสกุล: 【...】 ตำแหน่ง: 【...】 ลงนาม ระบุชื่อ-นามสกุลให้ชัดเจน และประทับตรา (ถ้ามี)\"></span></td></tr></table></div><h3 class=\"ann\" data-n=\"01\"><strong>PHỤ LỤC 01 – DANH MỤC HÀNG HÓA, BOQ VÀ THÔNG SỐ KỸ THUẬT</strong><span class=\"th\" data-t=\"ภาคผนวก 01 – รายการสินค้า BOQ และข้อมูลจำเพาะทางเทคนิค\"></span></h3><p>Kèm Hợp đồng số: <strong><span class=\"fx\" data-k=\"SỐ HỢP ĐỒNG\"></span></strong>     PO: <strong><span class=\"fx\" data-k=\"SỐ PO\"></span></strong>     Dự án: <strong><span class=\"fx\" data-k=\"MÃ DỰ ÁN\"></span></strong><span class=\"th\" data-t=\"แนบท้ายสัญญาเลขที่: 【SỐ HỢP ĐỒNG】 PO: 【SỐ PO】 โครงการ: 【MÃ DỰ ÁN】\"></span></p><div class=\"tw2\"><table class=\"ct\"><tr><th><strong>STT</strong><span class=\"th\" data-t=\"ลำดับ\"></span></th><th><strong>Mã / Tên hàng</strong><span class=\"th\" data-t=\"รหัส / ชื่อสินค้า\"></span></th><th><strong>Hãng – Model – Xuất xứ</strong><span class=\"th\" data-t=\"ยี่ห้อ – รุ่น – แหล่งกำเนิด\"></span></th><th><strong>ĐVT</strong><span class=\"th\" data-t=\"หน่วย\"></span></th><th><strong>SL</strong><span class=\"th\" data-t=\"จำนวน\"></span></th><th><strong>Đơn giá chưa VAT</strong><span class=\"th\" data-t=\"ราคาต่อหน่วยไม่รวมภาษีมูลค่าเพิ่ม (VAT)\"></span></th><th><strong>Thành tiền</strong><span class=\"th\" data-t=\"จำนวนเงิน\"></span></th></tr><tr><td>01</td><td><strong><span class=\"fx\" data-k=\"MÃ VẬT TƯ / TÊN\"></span></strong></td><td><strong><span class=\"fx\" data-k=\"HÃNG / MODEL / CO\"></span></strong></td><td><strong><span class=\"fx\" data-k=\"...\"></span></strong></td><td><strong><span class=\"fx\" data-k=\"...\"></span></strong></td><td><strong><span class=\"fx\" data-k=\"...\"></span></strong></td><td><strong><span class=\"fx\" data-k=\"...\"></span></strong></td></tr><tr><td>02</td><td><strong><span class=\"fx\" data-k=\"MÃ VẬT TƯ / TÊN\"></span></strong></td><td><strong><span class=\"fx\" data-k=\"HÃNG / MODEL / CO\"></span></strong></td><td><strong><span class=\"fx\" data-k=\"...\"></span></strong></td><td><strong><span class=\"fx\" data-k=\"...\"><
