ตรา 【】 % ต่อปี คำนวณจากจำนวนเงินที่ชำระล่าช้า โดยไม่เกินอัตราที่กฎหมายอนุญาต นับจากวันที่เลยกำหนดจนถึงวันที่ชำระเงินจริง นอกจากนี้ ฝ่าย B มีสิทธิใช้ข้อ 15.3\"></span></p><h3 class=\"art\" data-n=\"5\"><strong>ĐIỀU 5. TIẾN ĐỘ, MẶT BẰNG VÀ GIA HẠN</strong><span class=\"th\" data-t=\"ข้อ 5. กำหนดการ พื้นที่ก่อสร้าง และการขยายระยะเวลา\"></span></h3><p class=\"lv1\"><span class=\"lb\">5.1</span>Bên B hoàn thành công trình trong <span class=\"fx\" data-k=\"SỐ\"></span> ngày <span class=\"fx\" data-k=\"LỊCH / LÀM VIỆC\"></span> kể từ <span class=\"fx\" data-k=\"NGÀY BẮT ĐẦU: LÀ NGÀY CUỐI CÙNG CỦA CÁC ĐIỀU KIỆN SAU – HỢP ĐỒNG CÓ HIỆU LỰC, NHẬN TẠM ỨNG VÀ BẢO LÃNH, BÀN GIAO MẶT BẰNG, CÓ GIẤY PHÉP XÂY DỰNG NẾU PHẢI CÓ\"></span>. Mốc chính: Phụ lục 02.<span class=\"th\" data-t=\"ฝ่าย B ต้องดำเนินงานก่อสร้างให้แล้วเสร็จภายใน 【SỐ】 วัน 【LỊCH / LÀM VIỆC】 นับจาก 【NGÀY BẮT ĐẦU: LÀ NGÀY CUỐI CÙNG CỦA CÁC ĐIỀU KIỆN SAU – HỢP ĐỒNG CÓ HIỆU LỰC, NHẬN TẠM ỨNG VÀ BẢO LÃNH, BÀN GIAO MẶT BẰNG, CÓ GIẤY PHÉP XÂY DỰNG NẾU PHẢI CÓ】 ทั้งนี้ ความคืบหน้าหลักสำคัญ (Milestone) เป็นไปตามภาคผนวก 02\"></span></p><p class=\"lv1\"><span class=\"lb\">5.2</span>Bên B lập tiến độ chi tiết trong <span class=\"fx\" data-k=\"07\"></span> ngày kể từ ngày bắt đầu; Bên A phản hồi trong <span class=\"fx\" data-k=\"05\"></span> ngày làm việc, quá hạn coi là chấp thuận. Báo cáo tiến độ hàng tuần.<span class=\"th\" data-t=\"ฝ่าย B ต้องจัดทำกำหนดการโดยละเอียดภายใน 【07】 วัน นับจากวันเริ่มต้น ฝ่าย A ต้องตอบกลับภายใน 【05】 วันทำการ หากเลยกำหนดให้ถือว่าให้ความเห็นชอบ และต้องรายงานความคืบหน้ารายสัปดาห์\"></span></p><p class=\"lv1\"><span class=\"lb\">5.3</span>Thời gian thực hiện được gia hạn tương ứng khi: Bên A bàn giao mặt bằng, hồ sơ, giấy phép, thanh toán chậm; Bên A yêu cầu thay đổi hoặc tạm dừng; điều kiện địa chất, mặt bằng khác thực tế mô tả; sự kiện bất khả kháng; chậm trễ của cơ quan nhà nước không do lỗi Bên B. Bên B phải thông báo trong <span class=\"fx\" data-k=\"07\"></span> ngày kể từ khi biết sự kiện và nộp tính toán ảnh hưởng.<span class=\"th\" data-t=\"ระยะเวลาดำเนินการจะได้รับการขยายออกไปตามสมควรเมื่อมีกรณีดังต่อไปนี้: ฝ่าย A ส่งมอบพื้นที่ก่อสร้าง เอกสาร ใบอนุญาต หรือชำระเงินล่าช้า; ฝ่าย A ขอให้เปลี่ยนแปลงหรือหยุดงานชั่วคราว; สภาพทางธรณีวิทยาหรือพื้นที่ก่อสร้างแตกต่างจากที่ระบุไว้จริง; เหตุสุดวิสัย; ความล่าช้าของหน่วยงานของรัฐที่ไม่ใช่ความผิดของฝ่าย B ทั้งนี้ ฝ่าย B ต้องแจ้งภายใน 【07】 วัน นับจากวันที่ทราบเหตุการณ์ และยื่นการคำนวณผลกระทบ\"></span></p><h3 class=\"art\" data-n=\"6\"><strong>ĐIỀU 6. QUYỀN VÀ NGHĨA VỤ CỦA BÊN A (CHỦ ĐẦU TƯ)</strong><span class=\"th\" data-t=\"ข้อ 6. สิทธิและหน้าที่ของฝ่าย A (เจ้าของโครงการ)\"></span></h3><p class=\"lv1\"><span class=\"lb\">6.1</span>Bàn giao mặt bằng thi công sạch, đúng hạn, cung cấp điểm đấu nối điện, nước <span class=\"fx\" data-k=\"MIỄN PHÍ / CÓ PHÍ\"></span>, cung cấp hồ sơ pháp lý, thiết kế, thông tin cần thiết và xin các giấy phép thuộc trách nhiệm chủ đầu tư.<span class=\"th\" data-t=\"ส่งมอบพื้นที่ก่อสร้างที่สะอาดตรงตามกำหนด จัดให้มีจุดเชื่อมต่อไฟฟ้าและน้ำประปา 【MIỄN PHÍ / CÓ PHÍ】 จัดหาเอกสารทางกฎหมาย แบบ ข้อมูลที่จำเป็น และขอใบอนุญาตต่าง ๆ ที่อยู่ในความรับผิดชอบของเจ้าของโครงการ\"></span></p><p class=\"lv1\"><span class=\"lb\">6.2</span>Chỉ định người đại diện có thẩm quyền tại công trường; phản hồi, phê duyệt, nghiệm thu trong thời hạn tại Hợp đồng; không can thiệp trực tiếp vào nhân sự của Bên B.<span class=\"th\" data-t=\"แต่งตั้งผู้แทนที่มีอำนาจ ณ สถานที่ก่อสร้าง ตอบกลับ อนุมัติ และตรวจรับภายในระยะเวลาที่กำหนดในสัญญา และไม่แทรกแซงบุคลากรของฝ่าย B โดยตรง\"></span></p><p class=\"lv1\"><span class=\"lb\">6.3</span>Thanh toán đầy đủ, đúng hạn; nhận bàn giao công trình khi đủ điều kiện theo Điều 9 và 10.<span class=\"th\" data-t=\"ชำระเงินครบถ้วนและตรงกำหนด; รับมอบงานก่อสร้างเมื่อครบเงื่อนไขตามข้อ 9 และข้อ 10\"></span></p><p class=\"lv1\"><span class=\"lb\">6.4</span>Bên A có quyền kiểm tra, giám sát chất lượng, tiến độ, an toàn; việc giám sát không làm giảm trách nhiệm của Bên B và không được gây cản trở bất hợp lý.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิตรวจสอบและควบคุมดูแลคุณภาพ กำหนดการ และความปลอดภัย การควบคุมดูแลดังกล่าวไม่ทำให้ความรับผิดชอบของฝ่าย B ลดลง และต้องไม่ก่อให้เกิดอุปสรรคโดยไม่สมเหตุสมผล\"></span></p><h3 class=\"art\" data-n=\"7\"><strong>ĐIỀU 7. QUYỀN VÀ NGHĨA VỤ CỦA BÊN B (NHÀ THẦU)</strong><span class=\"th\" data-t=\"ข้อ 7. สิทธิและหน้าที่ของฝ่าย B (ผู้รับเหมา)\"></span></h3><p class=\"lv1\"><span class=\"lb\">7.1</span>Thi công đúng thiết kế, tiêu chuẩn, quy chuẩn kỹ thuật, bảo đảm chất lượng, an toàn, tiến độ; chịu trách nhiệm về biện pháp thi công của mình.<span class=\"th\" data-t=\"ก่อสร้างให้ถูกต้องตามแบบ มาตรฐาน และข้อกำหนดทางเทคนิค รับประกันคุณภาพ ความปลอดภัย และกำหนดการ และรับผิดชอบต่อวิธีการก่อสร้างของตน\"></span></p><p class=\"lv1\"><span class=\"lb\">7.2</span>Bố trí nhân sự, thiết bị đủ năng lực; nhà thầu phụ do Bên B huy động phải đáp ứng điều kiện năng lực theo pháp luật; Bên B chịu trách nhiệm trước Bên A về công việc của nhà thầu phụ. Bên B không chuyển giao toàn bộ hợp đồng cho nhà thầu phụ. Với nhà thầu phụ chính do Bên A yêu cầu hoặc chỉ định, Bên A chịu trách nhiệm về lựa chọn.<span class=\"th\" data-t=\"จัดเตรียมบุคลากรและอุปกรณ์ที่มีขีดความสามารถเพียงพอ; ผู้รับเหมาช่วงที่ฝ่าย B จัดหามาต้องมีคุณสมบัติด้านขีดความสามารถตามที่กฎหมายกำหนด และฝ่าย B ต้องรับผิดต่อฝ่าย A สำหรับงานของผู้รับเหมาช่วง ฝ่าย B ต้องไม่โอนสัญญาทั้งหมดให้ผู้รับเหมาช่วง สำหรับผู้รับเหมาช่วงหลักที่ฝ่าย A ร้องขอหรือกำหนด ฝ่าย A เป็นผู้รับผิดชอบในการคัดเลือก\"></span></p><p class=\"lv1\"><span class=\"lb\">7.3</span>Mua bảo hiểm theo quy định pháp luật (bảo hiểm trách nhiệm nghề nghiệp, bảo hiểm tai nạn lao động cho người lao động của mình) và bảo hiểm công trình trong thời gian thi công nếu Phụ lục 06 quy định; chi phí <span class=\"fx\" data-k=\"BÊN B / BÊN A\"></span> chịu.<span class=\"th\" data-t=\"ทำประกันภัยตามที่กฎหมายกำหนด (ประกันภัยความรับผิดทางวิชาชีพ ประกันภัยอุบัติเหตุแรงงานสำหรับลูกจ้างของตน) และประกันภัยงานก่อสร้างในระหว่างการก่อสร้างหากภาคผนวก 06 กำหนดไว้ โดยค่าใช้จ่าย 【BÊN B / BÊN A】 เป็นผู้รับผิดชอบ\"></span></p><p class=\"lv1\"><span class=\"lb\">7.4</span>Lưu giữ nhật ký thi công, hồ sơ chất lượng, hồ sơ hoàn công; yêu cầu Bên A phối hợp kịp thời khi cần.<span class=\"th\" data-t=\"เก็บรักษาบันทึกการก่อสร้าง เอกสารด้านคุณภาพ และเอกสารแบบก่อสร้างจริง (As-built); ขอให้ฝ่าย A ให้ความร่วมมืออย่างทันท่วงทีเมื่อจำเป็น\"></span></p><h3 class=\"art\" data-n=\"8\"><strong>ĐIỀU 8. VẬT TƯ, THIẾT BỊ VÀ THAY THẾ TƯƠNG ĐƯƠNG</strong><span class=\"th\" data-t=\"ข้อ 8. วัสดุ อุปกรณ์ และการทดแทนที่เทียบเท่า\"></span></h3><p class=\"lv1\"><span class=\"lb\">8.1</span>Vật tư, thiết bị phải đúng chủng loại, xuất xứ, tiêu chuẩn tại Phụ lục 01 và có chứng nhận chất lượng (CO/CQ, kết quả thí nghiệm) theo quy định.<span class=\"th\" data-t=\"วัสดุและอุปกรณ์ต้องตรงตามประเภท แหล่งกำเนิด และมาตรฐานที่ระบุในภาคผนวก 01 และมีใบรับรองคุณภาพ (CO/CQ ผลการทดสอบ) ตามที่กำหนด\"></span></p><p class=\"lv1\"><span class=\"lb\">8.2</span>Bên B được đề xuất vật tư tương đương hoặc tốt hơn khi vật tư chỉ định không còn cung cấp được hoặc làm chậm tiến độ; chỉ thực hiện khi Bên A phê duyệt bằng văn bản trong <span class=\"fx\" data-k=\"05\"></span> ngày làm việc; không phê duyệt không hợp lý thì thời gian chậm do Bên A.<span class=\"th\" data-t=\"ฝ่าย B มีสิทธิเสนอวัสดุที่เทียบเท่าหรือดีกว่า เมื่อวัสดุที่กำหนดไม่สามารถจัดหาได้อีกต่อไปหรือทำให้กำหนดการล่าช้า; จะดำเนินการได้ต่อเมื่อฝ่าย A อนุมัติเป็นลายลักษณ์อักษรภายใน 【05】 วันทำการ; หากไม่อนุมัติโดยไม่สมเหตุสมผล เวลาที่ล่าช้าถือเป็นความรับผิดของฝ่าย A\"></span></p><p class=\"lv1\"><span class=\"lb\">8.3</span>Vật tư, thiết bị đã được Bên A thanh toán thuộc quyền sở hữu của Bên A; rủi ro chuyển cho Bên A khi nghiệm thu và bàn giao, trừ phần mất mát, hư hỏng do lỗi của Bên A.<span class=\"th\" data-t=\"วัสดุและอุปกรณ์ที่ฝ่าย A ชำระเงินแล้วเป็นกรรมสิทธิ์ของฝ่าย A; ความเสี่ยงโอนไปยังฝ่าย A เมื่อตรวจรับและส่งมอบ เว้นแต่ส่วนที่สูญหายหรือเสียหายเพราะความผิดของฝ่าย A\"></span></p><h3 class=\"art\" data-n=\"9\"><strong>ĐIỀU 9. CHẤT LƯỢNG, KIỂM TRA VÀ NGHIỆM THU</strong><span class=\"th\" data-t=\"ข้อ 9. คุณภาพ การตรวจสอบ และการตรวจรับ\"></span></h3><p class=\"lv1\"><span class=\"lb\">9.1</span>Bên B tự kiểm tra, thử nghiệm; thông báo nghiệm thu trước <span class=\"fx\" data-k=\"03\"></span> ngày làm việc. Bên A (và tư vấn giám sát) nghiệm thu trong <span class=\"fx\" data-k=\"05\"></span> ngày làm việc kể từ khi nhận thông báo và hồ sơ hợp lệ.<span class=\"th\" data-t=\"ฝ่าย B ต้องตรวจสอบและทดสอบด้วยตนเอง; แจ้งการตรวจรับล่วงหน้า 【03】 วันทำการ ฝ่าย A (และที่ปรึกษาควบคุมงาน) ต้องตรวจรับภายใน 【05】 วันทำการ นับจากวันที่ได้รับการแจ้งและเอกสารที่ถูกต้อง\"></span></p><p class=\"lv1\"><span class=\"lb\">9.2</span>Nếu Bên A không tham gia hoặc không phản hồi bằng văn bản trong thời hạn, Bên B được lập biên bản có người làm chứng; công việc đủ điều kiện và đã được đưa vào sử dụng được coi là đã được nghiệm thu, không ảnh hưởng quyền kiểm tra khiếm khuyết trong thời gian bảo hành.<span class=\"th\" data-t=\"หากฝ่าย A ไม่เข้าร่วมหรือไม่ตอบกลับเป็นลายลักษณ์อักษรภายในกำหนด ฝ่าย B มีสิทธิจัดทำรายงานโดยมีพยานรับรอง; งานที่ครบเงื่อนไขและได้นำไปใช้งานแล้วให้ถือว่าได้รับการตรวจรับแล้ว ทั้งนี้ไม่กระทบสิทธิในการตรวจสอบข้อบกพร่องในระหว่างระยะเวลาการรับประกันผลงาน\"></span></p><p class=\"lv1\"><span class=\"lb\">9.3</span>Hồ sơ nghiệm thu gồm biên bản nghiệm thu, hồ sơ chất lượng vật tư, kết quả thí nghiệm, bản vẽ hoàn công, hướng dẫn vận hành, theo quy định về quản lý chất lượng công trình xây dựng.<span class=\"th\" data-t=\"เอกสารการตรวจรับประกอบด้วย รายงานการตรวจรับ เอกสารด้านคุณภาพของวัสดุ ผลการทดสอบ แบบก่อสร้างจริง (As-built) และคู่มือการใช้งาน ตามกฎหมายว่าด้วยการบริหารจัดการคุณภาพงานก่อสร้าง\"></span></p><p class=\"lv1\"><span class=\"lb\">9.4</span>Công việc không đạt phải được Bên B khắc phục trong thời hạn hợp lý do hai Bên thống nhất, không muộn hơn <span class=\"fx\" data-k=\"SỐ\"></span> ngày; chi phí khắc phục do Bên B chịu nếu lỗi do Bên B.<span class=\"th\" data-t=\"งานที่ไม่ผ่านเกณฑ์ ฝ่าย B ต้องแก้ไขภายในระยะเวลาอันสมควรที่ทั้งสองฝ่ายตกลงกัน แต่ไม่เกิน 【SỐ】 วัน; ค่าใช้จ่ายในการแก้ไขเป็นความรับผิดของฝ่าย B หากความผิดพลาดเกิดจากฝ่าย B\"></span></p><h3 class=\"art\" data-n=\"10\"><strong>ĐIỀU 10. CHẠY THỬ, ĐÀO TẠO VÀ BÀN GIAO</strong><span class=\"th\" data-t=\"ข้อ 10. การทดสอบเดินเครื่อง การฝึกอบรม และการส่งมอบ\"></span></h3><p class=\"lv1\"><span class=\"lb\">10.1</span>Bên B tổ chức chạy thử không tải và có tải theo quy trình tại Phụ lục 01; Bên A cung cấp nguyên liệu, năng lượng, nhân sự vận hành theo kế hoạch chạy thử đã thống nhất.<span class=\"th\" data-t=\"ฝ่าย B จัดให้มีการทดสอบเดินเครื่องแบบไม่มีโหลดและมีโหลดตามขั้นตอนในภาคผนวก 01; ฝ่าย A จัดหาวัตถุดิบ พลังงาน และบุคลากรปฏิบัติการตามแผนการทดสอบเดินเครื่องที่ตกลงกัน\"></span></p><p class=\"lv1\"><span class=\"lb\">10.2</span>Kết quả chạy thử đạt thông số cam kết (<span class=\"fx\" data-k=\"CÔNG SUẤT / CHỈ TIÊU\"></span>) được ghi nhận bằng biên bản. Nếu chậm chạy thử do lỗi Bên A, Bên B được gia hạn và không bị xem là chậm hoàn thành.<span class=\"th\" data-t=\"ผลการทดสอบเดินเครื่องที่ได้ตามค่าพารามิเตอร์ที่รับรองไว้ (【CÔNG SUẤT / CHỈ TIÊU】) ให้บันทึกไว้ในรายงาน หากการทดสอบเดินเครื่องล่าช้าเพราะความผิดของฝ่าย A ฝ่าย B ได้รับการขยายระยะเวลาและไม่ถือว่าส่งมอบล่าช้า\"></span></p><p class=\"lv1\"><span class=\"lb\">10.3</span>Bàn giao khi hoàn thành nghiệm thu, hồ sơ hoàn công và đào tạo vận hành <span class=\"fx\" data-k=\"SỐ\"></span> giờ cho nhân sự của Bên A. Bên A nhận bàn giao trong <span class=\"fx\" data-k=\"05\"></span> ngày làm việc; từ thời điểm bàn giao, Bên A chịu trách nhiệm bảo quản, bảo vệ công trình.<span class=\"th\" data-t=\"ส่งมอบเมื่อการตรวจรับแล้วเสร็จ มีเอกสารแบบก่อสร้างจริง (As-built) และได้ฝึกอบรมการใช้งานจำนวน 【SỐ】 ชั่วโมงแก่บุคลากรของฝ่าย A ฝ่าย A ต้องรับมอบภายใน 【05】 วันทำการ; นับจากเวลาส่งมอบ ฝ่าย A รับผิดชอบในการดูแลรักษาและป้องกันงานก่อสร้าง\"></span></p><h3 class=\"art\" data-n=\"11\"><strong>ĐIỀU 11. THAY ĐỔI, PHÁT SINH VÀ ĐIỀU CHỈNH</strong><span class=\"th\" data-t=\"ข้อ 11. การเปลี่ยนแปลง งานเพิ่มเติม และการปรับแก้\"></span></h3><p class=\"lv1\"><span class=\"lb\">11.1</span>Mọi thay đổi phạm vi, khối lượng, thiết kế, tiến độ được thực hiện bằng Phiếu thay đổi (Phụ lục 05) có chữ ký người có thẩm quyền của Bên A và Bên B, nêu rõ giá, tiến độ và ảnh hưởng.<span class=\"th\" data-t=\"การเปลี่ยนแปลงขอบเขต ปริมาณ แบบ และกำหนดการทุกรายการ ให้ดำเนินการโดยใบสั่งเปลี่ยนแปลง (ภาคผนวก 05) ที่มีลายมือชื่อของผู้มีอำนาจของฝ่าย A และฝ่าย B โดยระบุราคา กำหนดการ และผลกระทบอย่างชัดเจน\"></span></p><p class=\"lv1\"><span class=\"lb\">11.2</span>Bên B gửi đề xuất giá, tiến độ trong <span class=\"fx\" data-k=\"07\"></span> ngày kể từ khi nhận yêu cầu hoặc phát hiện sự kiện; Bên A phản hồi trong <span class=\"fx\" data-k=\"07\"></span> ngày làm việc. Nếu Bên A yêu cầu thực hiện ngay vì lý do an toàn hoặc tiến độ, Bên B thực hiện và hai Bên chốt giá sau, không thấp hơn đơn giá hợp đồng cho công việc tương tự.<span class=\"th\" data-t=\"ฝ่าย B ส่งข้อเสนอราคาและกำหนดการภายใน 【07】 วัน นับจากวันที่ได้รับคำขอหรือพบเหตุการณ์ ฝ่าย A ตอบกลับภายใน 【07】 วันทำการ หากฝ่าย A ขอให้ดำเนินการทันทีด้วยเหตุผลด้านความปลอดภัยหรือกำหนดการ ฝ่าย B ต้องดำเนินการและทั้งสองฝ่ายตกลงราคากันภายหลัง โดยต้องไม่ต่ำกว่าราคาต่อหน่วยตามสัญญาสำหรับงานที่คล้ายคลึงกัน\"></span></p><p class=\"lv1\"><span class=\"lb\">11.3</span>Công việc phát sinh chưa được Bên A phê duyệt bằng văn bản không đủ cơ sở thanh toán, trừ trường hợp khẩn cấp để bảo vệ người, tài sản và có biên bản xác nhận.<span class=\"th\" data-t=\"งานเพิ่มเติมที่ฝ่าย A ยังไม่ได้อนุมัติเป็นลายลักษณ์อักษรถือว่าไม่มีเหตุเพียงพอในการชำระเงิน เว้นแต่กรณีฉุกเฉินเพื่อปกป้องชีวิตและทรัพย์สิน และมีรายงานยืนยัน\"></span></p><h3 class=\"art\" data-n=\"12\"><strong>ĐIỀU 12. BẢO HÀNH</strong><span class=\"th\" data-t=\"ข้อ 12. การรับประกันผลงาน\"></span></h3><p class=\"lv1\"><span class=\"lb\">12.1</span>Thời hạn bảo hành: <span class=\"fx\" data-k=\"SỐ\"></span> tháng kể từ ngày nghiệm thu hoàn thành, bàn giao; không ngắn hơn thời hạn tối thiểu theo quy định pháp luật về bảo hành công trình xây dựng đối với loại và cấp công trình của Dự án (kiểm tra quy định hiện hành khi ký). Thiết bị có bảo hành của nhà sản xuất: theo chính sách nhà sản xuất nhưng không quá thời hạn tại Phụ lục 06.<span class=\"th\" data-t=\"ระยะเวลารับประกันผลงาน: 【SỐ】 เดือน นับจากวันที่ตรวจรับแล้วเสร็จและส่งมอบ; ต้องไม่สั้นกว่าระยะเวลาขั้นต่ำตามกฎหมายว่าด้วยการรับประกันงานก่อสร้างสำหรับประเภทและระดับของงานก่อสร้างของโครงการ (ให้ตรวจสอบกฎหมายที่มีผลบังคับใช้ในขณะลงนาม) อุปกรณ์ที่มีการรับประกันจากผู้ผลิต: เป็นไปตามนโยบายของผู้ผลิต แต่ไม่เกินระยะเวลาที่ระบุในภาคผนวก 06\"></span></p><p class=\"lv1\"><span class=\"lb\">12.2</span>Trong thời hạn bảo hành, Bên B khắc phục khiếm khuyết thuộc trách nhiệm của mình trong <span class=\"fx\" data-k=\"SỐ\"></span> ngày kể từ khi nhận thông báo hợp lệ (sự cố khẩn cấp: phản hồi trong <span class=\"fx\" data-k=\"24\"></span> giờ). Phần được sửa chữa, thay thế được bảo hành tiếp <span class=\"fx\" data-k=\"SỐ\"></span> tháng.<span class=\"th\" data-t=\"ในระหว่างระยะเวลารับประกันผลงาน ฝ่าย B ต้องแก้ไขข้อบกพร่องที่อยู่ในความรับผิดชอบของตนภายใน 【SỐ】 วัน นับจากวันที่ได้รับแจ้งโดยชอบ (กรณีเหตุฉุกเฉิน: ตอบกลับภายใน 【24】 ชั่วโมง) ส่วนที่ซ่อมแซมหรือเปลี่ยนใหม่ได้รับการรับประกันต่ออีก 【SỐ】 เดือน\"></span></p><p class=\"lv1\"><span class=\"lb\">12.3</span>Bên B không chịu trách nhiệm đối với hư hỏng do vận hành, bảo trì sai hướng dẫn; hao mòn thông thường; thay đổi, sửa chữa bởi bên không được Bên B ủy quyền; sự kiện bất khả kháng; vật tư, thiết kế do Bên A cung cấp hoặc chỉ định bắt buộc.<span class=\"th\" data-t=\"ฝ่าย B ไม่รับผิดต่อความเสียหายที่เกิดจากการใช้งานหรือบำรุงรักษาที่ไม่ถูกต้องตามคู่มือ; การเสื่อมสภาพตามปกติ; การเปลี่ยนแปลงหรือซ่อมแซมโดยบุคคลที่ฝ่าย B ไม่ได้มอบอำนาจ; เหตุสุดวิสัย; วัสดุหรือแบบที่ฝ่าย A จัดหาให้หรือกำหนดให้ใช้โดยบังคับ\"></span></p><p class=\"lv1\"><span class=\"lb\">12.4</span>Nếu Bên B không khắc phục đúng hạn sau thông báo hợp lệ, Bên A được thuê đơn vị khác và yêu cầu hoàn trả chi phí hợp lý, có chứng từ, tối đa bằng giá trị bảo lãnh bảo hành / tiền giữ lại.<span class=\"th\" data-t=\"หากฝ่าย B ไม่แก้ไขตามกำหนดภายหลังได้รับแจ้งโดยชอบ ฝ่าย A มีสิทธิว่าจ้างผู้อื่นและเรียกให้ชดใช้ค่าใช้จ่ายที่สมเหตุสมผลและมีเอกสารหลักฐาน ไม่เกินมูลค่าของหนังสือค้ำประกันการรับประกันผลงาน / เงินประกันผลงานที่กักไว้ (Retention)\"></span></p><h3 class=\"art\" data-n=\"13\"><strong>ĐIỀU 13. BẢO LÃNH VÀ BẢO HIỂM</strong><span class=\"th\" data-t=\"ข้อ 13. หนังสือค้ำประกันและการประกันภัย\"></span></h3><p class=\"lv1\"><span class=\"lb\">13.1</span>Bảo lãnh tạm ứng theo Điều 4.1. Bảo lãnh thực hiện hợp đồng (nếu Bên A yêu cầu): <span class=\"fx\" data-k=\"TỶ LỆ\"></span>% giá trị hợp đồng, hiệu lực đến khi nghiệm thu hoàn thành, giảm tương ứng theo giá trị hoàn thành.<span class=\"th\" data-t=\"หนังสือค้ำประกันเงินล่วงหน้าตามข้อ 4.1 หนังสือค้ำประกันการปฏิบัติตามสัญญา (หากฝ่าย A ร้องขอ): 【TỶ LỆ】 % ของมูลค่าสัญญา มีผลจนถึงการตรวจรับแล้วเสร็จ และลดลงตามสัดส่วนมูลค่างานที่แล้วเสร็จ\"></span></p><p class=\"lv1\"><span class=\"lb\">13.2</span>Bảo lãnh bảo hành (thay thế tiền giữ lại): <span class=\"fx\" data-k=\"TỶ LỆ\"></span>% giá trị quyết toán, hiệu lực suốt thời hạn bảo hành và <span class=\"fx\" data-k=\"30\"></span> ngày sau đó; bên thụ hưởng chỉ được yêu cầu thanh toán khi có thông báo vi phạm bằng văn bản và hết thời hạn khắc phục.<span class=\"th\" data-t=\"หนังสือค้ำประกันการรับประกันผลงาน (ใช้แทนเงินประกันผลงานที่กักไว้ (Retention)): 【TỶ LỆ】 % ของมูลค่าการตัดยอดงาน มีผลตลอดระยะเวลารับประกันผลงานและต่อไปอีก 【30】 วัน ผู้รับผลประโยชน์จะเรียกร้องให้ชำระเงินได้ก็ต่อเมื่อมีหนังสือแจ้งการผิดสัญญาเป็นลายลักษณ์อักษรและพ้นระยะเวลาแก้ไขแล้ว\"></span></p><p class=\"lv1\"><span class=\"lb\">13.3</span>Bảo lãnh do ngân hàng hoặc tổ chức tín dụng hoạt động hợp pháp tại Việt Nam phát hành, không hủy ngang; Bên A hoàn trả bản gốc trong <span class=\"fx\" data-k=\"07\"></span> ngày kể từ ngày hết nghĩa vụ bảo đảm.<span class=\"th\" data-t=\"หนังสือค้ำประกันต้องออกโดยธนาคารหรือสถาบันสินเชื่อที่ดำเนินกิจการโดยชอบด้วยกฎหมายในเวียดนาม เป็นแบบเพิกถอนไม่ได้; ฝ่าย A ต้องคืนฉบับจริงภายใน 【07】 วัน นับจากวันที่สิ้นสุดภาระผูกพันที่ค้ำประกัน\"></span></p><h3 class=\"art\" data-n=\"14\"><strong>ĐIỀU 14. PHẠT VI PHẠM, BỒI THƯỜNG VÀ GIỚI HẠN TRÁCH NHIỆM</strong><span class=\"th\" data-t=\"ข้อ 14. ค่าปรับตามสัญญา การชดใช้ค่าเสียหาย และข้อจำกัดความรับผิด\"></span></h3><p class=\"lv1\"><span class=\"lb\">14.1</span>Chậm hoàn thành do lỗi Bên B: phạt <span class=\"fx\" data-k=\"0,05–0,10\"></span>%/ngày trên giá trị phần công việc bị chậm; chậm thanh toán đúng hạn của Bên A: phạt tương tự trên số tiền chậm (không cộng dồn với lãi chậm trả tại 4.5 nếu cùng một khoản và cùng thời gian, trừ khi Phụ lục 06 quy định khác).<span class=\"th\" data-t=\"ส่งมอบงานล่าช้าเพราะความผิดของฝ่าย B: ค่าปรับ 【0,05–0,10】 % ต่อวัน คิดจากมูลค่างานส่วนที่ล่าช้า; ฝ่าย A ชำระเงินล่าช้าเกินกำหนด: ค่าปรับในลักษณะเดียวกันคิดจากจำนวนเงินที่ชำระล่าช้า (ไม่เรียกซ้อนกับดอกเบี้ยชำระล่าช้าตามข้อ 4.5 หากเป็นเงินก้อนเดียวกันและช่วงเวลาเดียวกัน เว้นแต่ภาคผนวก 06 กำหนดไว้เป็นอย่างอื่น)\"></span></p><p class=\"lv1\"><span class=\"lb\">14.2</span>Tổng mức phạt vi phạm đối với mỗi Bên không vượt quá <span class=\"fx\" data-k=\"8\"></span>% giá trị phần nghĩa vụ bị vi phạm hoặc mức trần cao nhất theo luật áp dụng cho hợp đồng này tại thời điểm ký (hai Bên và tư vấn pháp lý phải xác nhận căn cứ pháp luật khi chọn tỷ lệ).<span class=\"th\" data-t=\"ค่าปรับตามสัญญารวมของแต่ละฝ่ายต้องไม่เกิน 【8】 % ของมูลค่าส่วนภาระผูกพันที่ถูกละเมิด หรือเพดานสูงสุดตามกฎหมายที่ใช้บังคับกับสัญญานี้ ณ เวลาลงนาม (ทั้งสองฝ่ายและที่ปรึกษากฎหมายต้องยืนยันฐานทางกฎหมายเมื่อเลือกอัตรา)\"></span></p><p class=\"lv1\"><span class=\"lb\">14.3</span>Bồi thường thiệt hại thực tế, trực tiếp, chứng minh được và có thể lường trước. Không bồi thường thiệt hại gián tiếp, mất lợi nhuận, mất cơ hội kinh doanh, gián đoạn sản xuất, trừ vi phạm do cố ý.<span class=\"th\" data-t=\"การชดใช้ค่าเสียหายที่เกิดขึ้นจริง โดยตรง พิสูจน์ได้ และสามารถคาดการณ์ได้ ไม่ชดใช้ความเสียหายทางอ้อม การสูญเสียกำไร การสูญเสียโอกาสทางธุรกิจ การหยุดชะงักของการผลิต เว้นแต่การละเมิดโดยเจตนา\"></span></p><p class=\"lv1\"><span class=\"lb\">14.4</span>Tổng trách nhiệm của Bên B (gồm phạt và bồi thường) tối đa <span class=\"fx\" data-k=\"100\"></span>% giá trị hợp đồng chưa VAT, trừ trường hợp cố ý, gian lận hoặc vi phạm pháp luật bắt buộc không được hạn chế. Bên bị vi phạm có nghĩa vụ hạn chế thiệt hại.<span class=\"th\" data-t=\"ความรับผิดรวมของฝ่าย B (รวมค่าปรับและการชดใช้ค่าเสียหาย) สูงสุด 【100】 % ของมูลค่าสัญญาที่ไม่รวมภาษีมูลค่าเพิ่ม (VAT) เว้นแต่กรณีเจตนา ทุจริต หรือการฝ่าฝืนกฎหมายบังคับที่ไม่อาจจำกัดความรับผิดได้ ฝ่ายที่ถูกละเมิดมีหน้าที่บรรเทาความเสียหาย\"></span></p><h3 class=\"art\" data-n=\"15\"><strong>ĐIỀU 15. TẠM DỪNG VÀ CHẤM DỨT HỢP ĐỒNG</strong><span class=\"th\" data-t=\"ข้อ 15. การหยุดงานชั่วคราวและการเลิกสัญญา\"></span></h3><p class=\"lv1\"><span class=\"lb\">15.1</span>Mỗi Bên có quyền chấm dứt hợp đồng nếu Bên kia vi phạm nghiêm trọng và không khắc phục trong <span class=\"fx\" data-k=\"15\"></span> ngày kể từ thông báo bằng văn bản. Vi phạm nghiêm trọng của Bên B gồm bỏ dở công việc quá <span class=\"fx\" data-k=\"14\"></span> ngày không có lý do chính đáng; của Bên A gồm chậm thanh toán phần không tranh chấp quá <span class=\"fx\" data-k=\"30\"></span> ngày sau thông báo.<span class=\"th\" data-t=\"แต่ละฝ่ายมีสิทธิเลิกสัญญาหากอีกฝ่ายผิดสัญญาอย่างร้ายแรงและไม่แก้ไขภายใน 【15】 วัน นับจากวันที่ได้รับหนังสือแจ้งเป็นลายลักษณ์อักษร การผิดสัญญาอย่างร้ายแรงของฝ่าย B รวมถึงการละทิ้งงานเกิน 【14】 วันโดยไม่มีเหตุอันสมควร; ของฝ่าย A รวมถึงการชำระเงินล่าช้าในส่วนที่ไม่มีข้อพิพาทเกิน 【30】 วัน ภายหลังได้รับหนังสือแจ้ง\"></span></p><p class=\"lv1\"><span class=\"lb\">15.2</span>Bên A có quyền tạm dừng thi công theo thông báo trước <span class=\"fx\" data-k=\"07\"></span> ngày; thời gian tạm dừng không do lỗi Bên B được gia hạn tiến độ và Bên A bồi thường chi phí hợp lý, có chứng từ (huy động, bảo quản, chờ việc).<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิหยุดงานก่อสร้างชั่วคราวโดยแจ้งล่วงหน้า 【07】 วัน; ระยะเวลาหยุดงานชั่วคราวที่ไม่ใช่ความผิดของฝ่าย B ได้รับการขยายกำหนดการ และฝ่าย A ต้องชดใช้ค่าใช้จ่ายที่สมเหตุสมผลและมีเอกสารหลักฐาน (การเคลื่อนย้ายทรัพยากร การเก็บรักษา การรอคอยงาน)\"></span></p><p class=\"lv1\"><span class=\"lb\">15.3</span>Bên B có quyền tạm ngừng thi công khi Bên A chậm thanh toán phần không tranh chấp quá <span class=\"fx\" data-k=\"14\"></span> ngày sau khi nhận thông báo bằng văn bản; không bị phạt chậm tiến độ trong thời gian tạm ngừng.<span class=\"th\" data-t=\"ฝ่าย B มีสิทธิหยุดงานก่อสร้างชั่วคราวเมื่อฝ่าย A ชำระเงินล่าช้าในส่วนที่ไม่มีข้อพิพาทเกิน 【14】 วัน ภายหลังได้รับหนังสือแจ้งเป็นลายลักษณ์อักษร; ไม่ถูกปรับกรณีงานล่าช้าในระหว่างช่วงที่หยุดงาน\"></span></p><p class=\"lv1\"><span class=\"lb\">15.4</span>Khi chấm dứt: lập biên bản kiểm kê khối lượng đã thực hiện; Bên A thanh toán giá trị công việc đã nghiệm thu (và vật tư đã mua theo hợp đồng không thể sử dụng cho dự án khác), trừ tạm ứng chưa thu hồi; Bên B bàn giao hồ sơ, bảo vệ công trình dở dang và rời công trường trong <span class=\"fx\" data-k=\"07\"></span> ngày.<span class=\"th\" data-t=\"เมื่อมีการเลิกสัญญา: ให้จัดทำรายงานตรวจนับปริมาณงานที่ดำเนินการแล้ว; ฝ่าย A ชำระมูลค่างานที่ตรวจรับแล้ว (และวัสดุที่ซื้อตามสัญญาซึ่งไม่สามารถนำไปใช้กับโครงการอื่นได้) หักเงินล่วงหน้าที่ยังไม่ได้เรียกคืน; ฝ่าย B ส่งมอบเอกสาร ป้องกันรักษางานก่อสร้างที่ยังไม่เสร็จ และออกจากสถานที่ก่อสร้างภายใน 【07】 วัน\"></span></p><h3 class=\"art\" data-n=\"16\"><strong>ĐIỀU 16. BẤT KHẢ KHÁNG</strong><span class=\"th\" data-t=\"ข้อ 16. เหตุสุดวิสัย\"></span></h3><p class=\"lv1\"><span class=\"lb\">16.1</span>Bất khả kháng là sự kiện xảy ra một cách khách quan không thể lường trước và không thể khắc phục được mặc dù đã áp dụng mọi biện pháp cần thiết và khả năng cho phép (Điều 156 Bộ luật Dân sự 2015), kể cả thiên tai, dịch bệnh, chiến tranh, quyết định của cơ quan nhà nước có thẩm quyền làm cấm hoặc đình chỉ việc thực hiện hợp đồng.<span class=\"th\" data-t=\"เหตุสุดวิสัยคือเหตุการณ์ที่เกิดขึ้นโดยปรากฏชัดแจ้งตามวัตถุวิสัย ไม่อาจคาดการณ์ได้ และไม่อาจแก้ไขได้ แม้ได้ใช้มาตรการทุกอย่างที่จำเป็นและเท่าที่ความสามารถอำนวยแล้ว (มาตรา 156 ประมวลกฎหมายแพ่ง ค.ศ. 2015) รวมถึงภัยธรรมชาติ โรคระบาด สงคราม และคำสั่งของหน่วยงานของรัฐที่มีอำนาจที่ห้ามหรือระงับการปฏิบัติตามสัญญา\"></span></p><p class=\"lv1\"><span class=\"lb\">16.2</span>Bên bị ảnh hưởng phải thông báo bằng văn bản cho Bên kia trong <span class=\"fx\" data-k=\"07\"></span> ngày kể từ ngày sự kiện xảy ra, kèm chứng cứ (xác nhận của cơ quan có thẩm quyền nếu có), áp dụng mọi biện pháp hợp lý để hạn chế thiệt hại và nối lại việc thực hiện ngay khi có thể. Thông báo chậm làm Bên bị ảnh hưởng mất quyền miễn trách nhiệm đối với phần thiệt hại phát sinh do chậm thông báo.<span class=\"th\" data-t=\"ฝ่ายที่ได้รับผลกระทบต้องแจ้งเป็นลายลักษณ์อักษรให้อีกฝ่ายทราบภายใน 【07】 วัน นับจากวันที่เหตุการณ์เกิดขึ้น พร้อมพยานหลักฐาน (การรับรองจากหน่วยงานที่มีอำนาจ หากมี) ใช้มาตรการที่สมเหตุสมผลทุกอย่างเพื่อลดความเสียหาย และกลับมาปฏิบัติตามสัญญาโดยเร็วที่สุดเท่าที่ทำได้ การแจ้งล่าช้าทำให้ฝ่ายที่ได้รับผลกระทบสูญเสียสิทธิในการได้รับยกเว้นความรับผิดสำหรับความเสียหายที่เกิดจากการแจ้งล่าช้า\"></span></p><p class=\"lv1\"><span class=\"lb\">16.3</span>Không được coi là bất khả kháng: khó khăn tài chính, biến động giá, thiếu nhân công, vật tư, phương tiện; lỗi của nhà thầu phụ, nhà cung cấp, nhà vận chuyển của Bên vi phạm, trừ khi chính họ gặp sự kiện bất khả kháng đáp ứng định nghĩa trên.<span class=\"th\" data-t=\"ไม่ถือเป็นเหตุสุดวิสัย: ความยากลำบากทางการเงิน ความผันผวนของราคา การขาดแคลนแรงงาน วัสดุ และยานพาหนะ; ความผิดของผู้รับเหมาช่วง ผู้จัดหา ผู้ขนส่งของฝ่ายที่ผิดสัญญา เว้นแต่บุคคลเหล่านั้นประสบเหตุสุดวิสัยที่เข้าตามคำนิยามข้างต้น\"></span></p><p class=\"lv1\"><span class=\"lb\">16.4</span>Nếu sự kiện bất khả kháng kéo dài quá <span class=\"fx\" data-k=\"60\"></span> ngày liên tục, Các Bên thương lượng phương án tiếp tục hoặc chấm dứt. Nếu không thỏa thuận được, mỗi Bên có quyền chấm dứt phần hợp đồng bị ảnh hưởng bằng thông báo trước <span class=\"fx\" data-k=\"15\"></span> ngày; phần đã thực hiện đúng hợp đồng được thanh toán, không bên nào phải chịu phạt vi phạm.<span class=\"th\" data-t=\"หากเหตุสุดวิสัยดำเนินต่อเนื่องเกิน 【60】 วัน ทั้งสองฝ่ายต้องเจรจาแนวทางดำเนินการต่อหรือเลิกสัญญา หากตกลงกันไม่ได้ แต่ละฝ่ายมีสิทธิเลิกสัญญาในส่วนที่ได้รับผลกระทบโดยแจ้งล่วงหน้า 【15】 วัน; ส่วนที่ได้ดำเนินการถูกต้องตามสัญญาแล้วจะได้รับการชำระเงิน และไม่ฝ่ายใดต้องรับผิดค่าปรับตามสัญญา\"></span></p><h3 class=\"art\" data-n=\"17\"><strong>ĐIỀU 17. AN TOÀN LAO ĐỘNG, PHÒNG CHÁY CHỮA CHÁY VÀ MÔI TRƯỜNG</strong><span class=\"th\" data-t=\"ข้อ 17. ความปลอดภัยในการทำงาน การป้องกันและระงับอัคคีภัย และสิ่งแวดล้อม\"></span></h3><p class=\"lv1\"><span class=\"lb\">17.1</span>Bên B tuân thủ pháp luật về an toàn, vệ sinh lao động, phòng cháy chữa cháy, bảo vệ môi trường và quy định HSE tại Phụ lục 03 và nội quy công trường do Bên A thông báo trước bằng văn bản.<span class=\"th\" data-t=\"ฝ่าย B ต้องปฏิบัติตามกฎหมายว่าด้วยความปลอดภัยและสุขอนามัยในการทำงาน การป้องกันและระงับอัคคีภัย การคุ้มครองสิ่งแวดล้อม และข้อกำหนด HSE ในภาคผนวก 03 รวมถึงระเบียบสถานที่ก่อสร้างที่ฝ่าย A แจ้งล่วงหน้าเป็นลายลักษณ์อักษร\"></span></p><p class=\"lv1\"><span class=\"lb\">17.2</span>Bên B chịu trách nhiệm đối với người lao động của mình và của nhà thầu phụ do Bên B huy động; Bên A chịu trách nhiệm về an toàn của khu vực, hệ thống, công trình hiện hữu do Bên A quản lý, trừ khi hai Bên thỏa thuận khác. Tai nạn nghiêm trọng phải báo ngay cho Bên A và cơ quan có thẩm quyền theo luật.<span class=\"th\" data-t=\"ฝ่าย B รับผิดชอบต่อลูกจ้างของตนและของผู้รับเหมาช่วงที่ฝ่าย B จัดหามา; ฝ่าย A รับผิดชอบด้านความปลอดภัยของพื้นที่ ระบบ และงานก่อสร้างเดิมที่ฝ่าย A บริหารจัดการ เว้นแต่ทั้งสองฝ่ายตกลงเป็นอย่างอื่น อุบัติเหตุร้ายแรงต้องแจ้งให้ฝ่าย A และหน่วยงานที่มีอำนาจทราบทันทีตามกฎหมาย\"></span></p><h3 class=\"art\" data-n=\"18\"><strong>ĐIỀU 18. QUYẾT TOÁN VÀ THANH LÝ HỢP ĐỒNG</strong><span class=\"th\" data-t=\"ข้อ 18. การตัดยอดงานและการชำระสะสางสัญญา\"></span></h3><p class=\"lv1\"><span class=\"lb\">18.1</span>Bên B nộp hồ sơ quyết toán trong <span class=\"fx\" data-k=\"30\"></span> ngày kể từ nghiệm thu hoàn thành; Bên A phản hồi trong <span class=\"fx\" data-k=\"30\"></span> ngày kể từ ngày nhận hồ sơ hợp lệ, quá hạn không phản hồi thì phần giá trị không tranh chấp được thanh toán.<span class=\"th\" data-t=\"ฝ่าย B ส่งเอกสารตัดยอดงานภายใน 【30】 วัน นับจากการตรวจรับแล้วเสร็จ ฝ่าย A ตอบกลับภายใน 【30】 วัน นับจากวันที่ได้รับเอกสารที่ถูกต้อง หากเลยกำหนดโดยไม่ตอบกลับ มูลค่าในส่วนที่ไม่มีข้อพิพาทจะได้รับการชำระ\"></span></p><p class=\"lv1\"><span class=\"lb\">18.2</span>Hợp đồng được thanh lý khi hoàn thành nghĩa vụ thanh toán và bảo hành (hoặc bảo lãnh thay thế). Nghĩa vụ bảo hành, bảo mật, bồi thường còn hiệu lực sau thanh lý.<span class=\"th\" data-t=\"สัญญาจะได้รับการชำระสะสางเมื่อปฏิบัติภาระผูกพันด้านการชำระเงินและการรับประกันผลงานครบถ้วน (หรือมีหนังสือค้ำประกันทดแทน) ภาระผูกพันด้านการรับประกันผลงาน การรักษาความลับ และการชดใช้ค่าเสียหาย ยังคงมีผลภายหลังการชำระสะสางสัญญา\"></span></p><h3 class=\"art\" data-n=\"19\"><strong>ĐIỀU 19. BẢO MẬT, SỞ HỮU TRÍ TUỆ VÀ BẢO VỆ DỮ LIỆU CÁ NHÂN</strong><span class=\"th\" data-t=\"ข้อ 19. การรักษาความลับ ทรัพย์สินทางปัญญา และการคุ้มครองข้อมูลส่วนบุคคล\"></span></h3><p class=\"lv1\"><span class=\"lb\">19.1</span>Mỗi Bên giữ bí mật thông tin kỹ thuật, giá, tài liệu và thông tin kinh doanh của Bên kia nhận được liên quan đến hợp đồng; chỉ sử dụng cho mục đích thực hiện hợp đồng và chỉ tiết lộ cho nhân sự, tư vấn, ngân hàng, bảo hiểm cần biết hoặc khi cơ quan nhà nước có thẩm quyền yêu cầu theo luật.<span class=\"th\" data-t=\"แต่ละฝ่ายต้องรักษาความลับของข้อมูลทางเทคนิค ราคา เอกสาร และข้อมูลทางธุรกิจของอีกฝ่ายที่ได้รับเกี่ยวกับสัญญา ใช้เพื่อวัตถุประสงค์ในการปฏิบัติตามสัญญาเท่านั้น และเปิดเผยเฉพาะแก่บุคลากร ที่ปรึกษา ธนาคาร บริษัทประกันภัยที่จำเป็นต้องรู้ หรือเมื่อหน่วยงานของรัฐที่มีอำนาจเรียกร้องตามกฎหมาย\"></span></p><p class=\"lv1\"><span class=\"lb\">19.2</span>Nghĩa vụ bảo mật kéo dài <span class=\"fx\" data-k=\"03\"></span> năm sau khi hợp đồng chấm dứt hoặc hết hiệu lực. Quyền sở hữu trí tuệ đối với tài liệu, bản vẽ, phần mềm của mỗi Bên không chuyển giao, trừ phạm vi được cấp phép sử dụng để thực hiện và sử dụng sản phẩm của hợp đồng.<span class=\"th\" data-t=\"ภาระผูกพันในการรักษาความลับมีผลต่อเนื่อง 【03】 ปี หลังสัญญาเลิกหรือสิ้นผลบังคับ สิทธิในทรัพย์สินทางปัญญาในเอกสาร แบบ และซอฟต์แวร์ของแต่ละฝ่ายไม่โอนให้กัน เว้นแต่ขอบเขตที่ได้รับอนุญาตให้ใช้เพื่อปฏิบัติตามสัญญาและใช้ผลิตภัณฑ์ของสัญญา\"></span></p><p class=\"lv1\"><span class=\"lb\">19.3</span>Khi xử lý dữ liệu cá nhân của người lao động, đại diện, đầu mối của Bên kia, mỗi Bên tuân thủ pháp luật về bảo vệ dữ liệu cá nhân (Nghị định 13/2023/NĐ-CP và văn bản thay thế, sửa đổi nếu có), chỉ xử lý trong phạm vi cần thiết cho hợp đồng.<span class=\"th\" data-t=\"เมื่อประมวลผลข้อมูลส่วนบุคคลของลูกจ้าง ผู้แทน และผู้ประสานงานของอีกฝ่าย แต่ละฝ่ายต้องปฏิบัติตามกฎหมายว่าด้วยการคุ้มครองข้อมูลส่วนบุคคล (พระราชกฤษฎีกา ฉบับที่ 13/2023/NĐ-CP และเอกสารที่ใช้แทนหรือแก้ไขเพิ่มเติม หากมี) และประมวลผลเฉพาะในขอบเขตที่จำเป็นสำหรับสัญญา\"></span></p><h3 class=\"art\" data-n=\"20\"><strong>ĐIỀU 20. TUÂN THỦ PHÁP LUẬT, CHỐNG HỐI LỘ VÀ XUNG ĐỘT LỢI ÍCH</strong><span class=\"th\" data-t=\"ข้อ 20. การปฏิบัติตามกฎหมาย การต่อต้านการให้สินบน และความขัดแย้งทางผลประโยชน์\"></span></h3><p class=\"lv1\"><span class=\"lb\">20.1</span>Các Bên tuân thủ pháp luật Việt Nam về thuế, hóa đơn, lao động, môi trường, an toàn, cạnh tranh và phòng chống tham nhũng, hối lộ.<span class=\"th\" data-t=\"ทั้งสองฝ่ายปฏิบัติตามกฎหมายเวียดนามว่าด้วยภาษี ใบกำกับภาษี แรงงาน สิ่งแวดล้อม ความปลอดภัย การแข่งขัน และการป้องกันและต่อต้านการทุจริตและการให้สินบน\"></span></p><p class=\"lv1\"><span class=\"lb\">20.2</span>Không bên nào được đưa, đề nghị, nhận tiền, quà tặng hoặc lợi ích bất chính cho hoặc từ nhân sự của Bên kia, khách hàng hoặc bên thứ ba để có lợi thế trong hợp đồng; vi phạm là vi phạm nghiêm trọng, Bên bị vi phạm có quyền chấm dứt hợp đồng ngay bằng văn bản.<span class=\"th\" data-t=\"ห้ามฝ่ายใดให้ เสนอ หรือรับเงิน ของขวัญ หรือผลประโยชน์ที่มิชอบ แก่หรือจากบุคลากรของอีกฝ่าย ลูกค้า หรือบุคคลที่สาม เพื่อให้ได้เปรียบในสัญญา; การฝ่าฝืนถือเป็นการผิดสัญญาอย่างร้ายแรง ฝ่ายที่ถูกละเมิดมีสิทธิเลิกสัญญาทันทีโดยหนังสือเป็นลายลักษณ์อักษร\"></span></p><p class=\"lv1\"><span class=\"lb\">20.3</span>Mỗi Bên thông báo ngay cho Bên kia khi có xung đột lợi ích thực tế hoặc tiềm ẩn liên quan đến người tham gia ký kết, đánh giá, nghiệm thu hợp đồng.<span class=\"th\" data-t=\"แต่ละฝ่ายต้องแจ้งให้อีกฝ่ายทราบทันทีเมื่อมีความขัดแย้งทางผลประโยชน์ที่เกิดขึ้นจริงหรืออาจเกิดขึ้น เกี่ยวกับผู้ที่เข้าร่วมการลงนาม การประเมิน และการตรวจรับสัญญา\"></span></p><h3 class=\"art\" data-n=\"21\"><strong>ĐIỀU 21. QUAN HỆ VỚI NHÀ THẦU PHỤ, NHÀ CUNG CẤP CỦA BÊN B</strong><span class=\"th\" data-t=\"ข้อ 21. ความสัมพันธ์กับผู้รับเหมาช่วงและผู้จัดหาของฝ่าย B\"></span></h3><p class=\"lv1\"><span class=\"lb\">21.1</span>Bên B tự chịu trách nhiệm về việc ký, thực hiện và thanh toán các hợp đồng với nhà thầu phụ, nhà cung cấp; Bên A không phát sinh nghĩa vụ trực tiếp với họ, trừ khi hai Bên có thỏa thuận ba bên bằng văn bản.<span class=\"th\" data-t=\"ฝ่าย B รับผิดชอบเองในการลงนาม ปฏิบัติตาม และชำระเงินตามสัญญากับผู้รับเหมาช่วงและผู้จัดหา; ฝ่าย A ไม่มีภาระผูกพันโดยตรงต่อบุคคลเหล่านั้น เว้นแต่ทั้งสองฝ่ายมีข้อตกลงสามฝ่ายเป็นลายลักษณ์อักษร\"></span></p><p class=\"lv1\"><span class=\"lb\">21.2</span>Bên B có quyền thông báo cho nhà thầu phụ, nhà cung cấp các điều khoản của Hợp đồng này cần thiết để họ thực hiện đúng yêu cầu, không bao gồm thông tin giá nếu Bên A yêu cầu bảo mật.<span class=\"th\" data-t=\"ฝ่าย B มีสิทธิแจ้งข้อกำหนดของสัญญานี้ที่จำเป็นแก่ผู้รับเหมาช่วงและผู้จัดหาเพื่อให้ปฏิบัติตามข้อกำหนดได้ถูกต้อง โดยไม่รวมข้อมูลราคา หากฝ่าย A ร้องขอให้เป็นความลับ\"></span></p><h3 class=\"art\" data-n=\"22\"><strong>ĐIỀU 22. LUẬT ÁP DỤNG VÀ GIẢI QUYẾT TRANH CHẤP</strong><span class=\"th\" data-t=\"ข้อ 22. กฎหมายที่ใช้บังคับและการระงับข้อพิพาท\"></span></h3><p class=\"lv1\"><span class=\"lb\">22.1</span>Hợp đồng chịu sự điều chỉnh của pháp luật Việt Nam.<span class=\"th\" data-t=\"สัญญานี้อยู่ภายใต้บังคับของกฎหมายเวียดนาม\"></span></p><p class=\"lv1\"><span class=\"lb\">22.2</span>Tranh chấp được giải quyết trước hết bằng thương lượng, hòa giải thiện chí trong <span class=\"fx\" data-k=\"30\"></span> ngày kể từ ngày một Bên gửi thông báo tranh chấp bằng văn bản nêu rõ nội dung, căn cứ và yêu cầu.<span class=\"th\" data-t=\"ข้อพิพาทให้ระงับเป็นลำดับแรกโดยการเจรจาและไกล่เกลี่ยด้วยความสุจริตภายใน 【30】 วัน นับจากวันที่ฝ่ายหนึ่งส่งหนังสือแจ้งข้อพิพาทเป็นลายลักษณ์อักษรระบุเนื้อหา ฐาน และข้อเรียกร้องอย่างชัดเจน\"></span></p><p class=\"lv1\"><span class=\"lb\">22.3</span>Nếu không giải quyết được, tranh chấp được đưa ra (chỉ chọn một): <span class=\"fx\" data-k=\"TÒA ÁN NHÂN DÂN CÓ THẨM QUYỀN TẠI (TỈNH/THÀNH PHỐ) / TRUNG TÂM TRỌNG TÀI QUỐC TẾ VIỆT NAM (VIAC), LUẬT TỐ TỤNG VIAC, 01 TRỌNG TÀI VIÊN, TRỤ SỞ TRỌNG TÀI TẠI (ĐỊA ĐIỂM), NGÔN NGỮ TIẾNG VIỆT\"></span>. Nếu chọn trọng tài, thỏa thuận này là thỏa thuận trọng tài độc lập, phán quyết là chung thẩm.<span class=\"th\" data-t=\"หากระงับไม่ได้ ให้นำข้อพิพาทเสนอต่อ (เลือกเพียงอย่างเดียว): 【TÒA ÁN NHÂN DÂN CÓ THẨM QUYỀN TẠI (TỈNH/THÀNH PHỐ) / TRUNG TÂM TRỌNG TÀI QUỐC TẾ VIỆT NAM (VIAC), LUẬT TỐ TỤNG VIAC, 01 TRỌNG TÀI VIÊN, TRỤ SỞ TRỌNG TÀI TẠI (ĐỊA ĐIỂM), NGÔN NGỮ TIẾNG VIỆT】 หากเลือกอนุญาโตตุลาการ ข้อตกลงนี้เป็นข้อตกลงอนุญาโตตุลาการที่เป็นอิสระ และคำชี้ขาดเป็นที่สุด\"></span></p><p class=\"lv1\"><span class=\"lb\">22.4</span>Trong thời gian giải quyết tranh chấp, Các Bên tiếp tục thực hiện các phần nghĩa vụ không bị tranh chấp.<span class=\"th\" data-t=\"ในระหว่างการระงับข้อพิพาท ทั้งสองฝ่ายต้องปฏิบัติตามภาระผูกพันในส่วนที่ไม่มีข้อพิพาทต่อไป\"></span></p><p class=\"lv1\"><span class=\"lb\">22.5</span>Hợp đồng lập bằng tiếng Việt. Bản dịch sang tiếng Anh hoặc tiếng Thái (nếu có) chỉ để tham khảo; khi có khác biệt, bản tiếng Việt có giá trị áp dụng.<span class=\"th\" data-t=\"สัญญาจัดทำเป็นภาษาเวียดนาม ฉบับแปลเป็นภาษาอังกฤษหรือภาษาไทย (หากมี) ใช้เพื่อการอ้างอิงเท่านั้น หากมีความแตกต่าง ให้ถือฉบับภาษาเวียดนามเป็นฉบับที่ใช้บังคับ\"></span></p><h3 class=\"art\" data-n=\"23\"><strong>ĐIỀU 23. ĐIỀU KHOẢN CHUNG VÀ HIỆU LỰC</strong><span class=\"th\" data-t=\"ข้อ 23. ข้อกำหนดทั่วไปและการมีผลบังคับ\"></span></h3><p class=\"lv1\"><span class=\"lb\">23.1</span>Thông báo phải bằng văn bản, gửi tới địa chỉ, email của đại diện nhận thông báo nêu ở phần đầu Hợp đồng (hoặc địa chỉ được thông báo thay đổi bằng văn bản). Thông báo gửi bằng email có hiệu lực khi hệ thống không báo lỗi và đã gửi bản gốc trong <span class=\"fx\" data-k=\"05\"></span> ngày làm việc nếu Bên nhận yêu cầu.<span class=\"th\" data-t=\"การแจ้งต้องเป็นลายลักษณ์อักษร ส่งไปยังที่อยู่และอีเมลของผู้แทนผู้รับแจ้งที่ระบุไว้ในส่วนต้นของสัญญา (หรือที่อยู่ที่แจ้งเปลี่ยนแปลงเป็นลายลักษณ์อักษร) การแจ้งทางอีเมลมีผลเมื่อระบบไม่แจ้งข้อผิดพลาด และได้ส่งฉบับจริงภายใน 【05】 วันทำการ หากฝ่ายผู้รับร้องขอ\"></span></p><p class=\"lv1\"><span class=\"lb\">23.2</span>Không bên nào được chuyển nhượng quyền, nghĩa vụ theo hợp đồng cho bên thứ ba khi chưa có chấp thuận bằng văn bản của Bên kia, trừ quyền nhận tiền được chuyển nhượng theo quy định pháp luật và thông báo cho Bên có nghĩa vụ.<span class=\"th\" data-t=\"ห้ามฝ่ายใดโอนสิทธิและภาระผูกพันตามสัญญาให้บุคคลที่สามโดยยังไม่ได้รับความยินยอมเป็นลายลักษณ์อักษรจากอีกฝ่าย เว้นแต่สิทธิในการรับเงินที่โอนได้ตามกฎหมายและแจ้งให้ฝ่ายที่มีหน้าที่ทราบ\"></span></p><p class=\"lv1\"><span class=\"lb\">23.3</span>Mọi sửa đổi, bổ sung chỉ có hiệu lực khi lập thành văn bản có chữ ký của người có thẩm quyền của cả hai Bên. Phụ lục là một phần không tách rời; khi có mâu thuẫn, thứ tự ưu tiên: (i) Phụ lục điều kiện đặc biệt được hai Bên ký, (ii) nội dung Hợp đồng, (iii) các Phụ lục còn lại.<span class=\"th\" data-t=\"การแก้ไขเพิ่มเติมทั้งหมดมีผลต่อเมื่อจัดทำเป็นลายลักษณ์อักษรและมีลายมือชื่อของผู้มีอำนาจของทั้งสองฝ่าย ภาคผนวกเป็นส่วนหนึ่งของสัญญาที่แยกจากกันไม่ได้ เมื่อมีความขัดแย้งให้ใช้ลำดับความสำคัญดังนี้: (i) ภาคผนวกเงื่อนไขพิเศษที่ทั้งสองฝ่ายลงนาม (ii) เนื้อหาของสัญญา (iii) ภาคผนวกอื่น ๆ\"></span></p><p class=\"lv1\"><span class=\"lb\">23.4</span>Nếu một điều khoản bị tuyên vô hiệu hoặc không thể thi hành, các điều khoản còn lại vẫn có hiệu lực; Các Bên thương lượng điều khoản thay thế gần nhất với ý chí ban đầu.<span class=\"th\" data-t=\"หากข้อกำหนดใดถูกวินิจฉัยว่าเป็นโมฆะหรือไม่อาจบังคับใช้ได้ ข้อกำหนดที่เหลือยังคงมีผลบังคับ; ทั้งสองฝ่ายต้องเจรจาข้อกำหนดทดแทนที่ใกล้เคียงกับเจตนารมณ์เดิมมากที่สุด\"></span></p><p class=\"lv1\"><span class=\"lb\">23.5</span>Hợp đồng có hiệu lực từ ngày <span class=\"fx\" data-k=\"NGÀY KÝ / ĐIỀU KIỆN CÓ HIỆU LỰC\"></span>, lập thành <span class=\"fx\" data-k=\"04\"></span> bản có giá trị như nhau, mỗi Bên giữ <span class=\"fx\" data-k=\"02\"></span> bản.<span class=\"th\" data-t=\"สัญญามีผลตั้งแต่วันที่ 【NGÀY KÝ / ĐIỀU KIỆN CÓ HIỆU LỰC】 จัดทำเป็น 【04】 ฉบับ มีค่าเท่ากัน โดยแต่ละฝ่ายเก็บไว้ 【02】 ฉบับ\"></span></p><p class=\"lv1\"><span class=\"lb\">23.6</span>Bên A xác nhận có đủ vốn và đủ thẩm quyền để ký và thực hiện hợp đồng; Bên B xác nhận đủ điều kiện năng lực hoạt động xây dựng theo quy định.<span class=\"th\" data-t=\"ฝ่าย A ยืนยันว่ามีเงินทุนและอำนาจเพียงพอในการลงนามและปฏิบัติตามสัญญา; ฝ่าย B ยืนยันว่ามีคุณสมบัติด้านขีดความสามารถในการประกอบกิจกรรมก่อสร้างครบถ้วนตามที่กฎหมายกำหนด\"></span></p><div class=\"tw2\"><table class=\"ct\"><tr><th>ĐẠI DIỆN BÊN A<span class=\"th\" data-t=\"ผู้แทนฝ่าย A\"></span></th><th>ĐẠI DIỆN BÊN B<span class=\"th\" data-t=\"ผู้แทนฝ่าย B\"></span></th></tr><tr><td>(Ký, ghi rõ họ tên, chức danh, đóng dấu nếu có) <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ / NGÀY\"></span><span class=\"th\" data-t=\"(ลงนาม ระบุชื่อ-นามสกุล ตำแหน่ง และประทับตราหากมี) 【HỌ TÊN / CHỨC VỤ / NGÀY】\"></span></td><td>(Ký, ghi rõ họ tên, chức danh, đóng dấu nếu có) <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ / NGÀY\"></span><span class=\"th\" data-t=\"(ลงนาม ระบุชื่อ-นามสกุล ตำแหน่ง และประทับตราหากมี) 【HỌ TÊN / CHỨC VỤ / NGÀY】\"></span></td></tr></table></div><h3 class=\"ann\" data-n=\"01\"><strong>PHỤ LỤC 01 – PHẠM VI, BOQ, BẢN VẼ VÀ YÊU CẦU KỸ THUẬT (ĐIỀN CHO TỪNG DỰ ÁN)</strong><span class=\"th\" data-t=\"ภาคผนวก 01 – ขอบเขตงาน BOQ แบบแปลน และข้อกำหนดทางเทคนิค (กรอกสำหรับแต่ละโครงการ)\"></span></h3><div class=\"tw2\"><table class=\"ct\"><tr><th>STT<span class=\"th\" data-t=\"ลำดับ\"></span></th><th>Hạng mục / công việc<span class=\"th\" data-t=\"รายการ / งาน\"></span></th><th>Đơn vị<span class=\"th\" data-t=\"หน่วย\"></span></th><th>Khối lượng<span class=\"th\" data-t=\"ปริมาณ\"></span></th><th>Đơn giá (VNĐ)<span class=\"th\" data-t=\"ราคาต่อหน่วย (VNĐ)\"></span></th><th>Thành tiền (VNĐ)<span class=\"th\" data-t=\"จำนวนเงิน (VNĐ)\"></span></th><th>Ghi chú / tiêu chuẩn<span class=\"th\" data-t=\"หมายเหตุ / มาตรฐาน\"></span></th></tr><tr><td>1</td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>2</td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr></table></div><p>Hạng mục do Bên A thực hiện hoặc cung cấp (ngoài giá): <span class=\"fx\" data-k=\"DANH MỤC\"></span><span class=\"th\" data-t=\"รายการที่ฝ่าย A เป็นผู้ดำเนินการหรือจัดหา (นอกเหนือจากราคา): 【DANH MỤC】\"></span></p><p>Điều kiện, thông số chạy thử và chỉ tiêu cam kết: <span class=\"fx\" data-k=\"THÔNG SỐ\"></span><span class=\"th\" data-t=\"เงื่อนไข พารามิเตอร์การทดสอบเดินเครื่อง และตัวชี้วัดที่รับรอง: 【THÔNG SỐ】\"></span></p><h3 class=\"ann\" data-n=\"02\"><strong>PHỤ LỤC 02 – TIẾN ĐỘ VÀ ĐIỀU KIỆN THANH TOÁN</strong><span class=\"th\" data-t=\"ภาคผนวก 02 – กำหนดการและเงื่อนไขการชำระเงิน\"></span></h3><div class=\"tw2\"><table class=\"ct\"><tr><th>Đợt / mốc<span class=\"th\" data-t=\"งวด / ขั้นความคืบหน้า\"></span></th><th>Điều kiện nghiệm thu<span class=\"th\" data-t=\"เงื่อนไขการตรวจรับ\"></span></th><th>% giá trị<span class=\"th\" data-t=\"% ของมูลค่า\"></span></th><th>Giá trị (VNĐ)<span class=\"th\" data-t=\"มูลค่า (VNĐ)\"></span></th><th>Ngày dự kiến<span class=\"th\" data-t=\"วันที่คาดการณ์\"></span></th></tr><tr><td>Tạm ứng<span class=\"th\" data-t=\"เงินล่วงหน้า\"></span></td><td>Ký hợp đồng, bảo lãnh tạm ứng<span class=\"th\" data-t=\"การลงนามสัญญา หนังสือค้ำประกันเงินล่วงหน้า\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td><span class=\"fx\" data-k=\"MỐC 1\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td><span class=\"fx\" data-k=\"MỐC 2\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Quyết toán, bảo hành<span class=\"th\" data-t=\"การเคลียร์ยอดสุดท้าย (Quyết toán) การรับประกันผลงาน\"></span></td><td>Nghiệm thu hoàn thành, hồ sơ hoàn công<span class=\"th\" data-t=\"การตรวจรับงานแล้วเสร็จ เอกสารแบบก่อสร้างจริง (As-built)\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr></table></div><h3 class=\"ann\" data-n=\"03\"><strong>PHỤ LỤC 03 – QUY ĐỊNH HSE VÀ AN TOÀN CÔNG TRƯỜNG</strong><span class=\"th\" data-t=\"ภาคผนวก 03 – ข้อกำหนด HSE และความปลอดภัยในหน่วยงานก่อสร้าง\"></span></h3><p>Nội quy HSE của Bên A: <span class=\"fx\" data-k=\"TÀI LIỆU ĐÍNH KÈM / SỐ TRANG\"></span><span class=\"th\" data-t=\"ระเบียบ HSE ของฝ่าย A: 【TÀI LIỆU ĐÍNH KÈM / SỐ TRANG】\"></span></p><p>Yêu cầu cụ thể: giấy phép làm việc (làm việc trên cao, không gian hạn chế, điện, nóng), huấn luyện an toàn trước khi vào công trường, PPE, báo cáo sự cố trong 24 giờ, kiểm soát nhà thầu phụ: <span class=\"fx\" data-k=\"BỔ SUNG\"></span><span class=\"th\" data-t=\"ข้อกำหนดเฉพาะ: ใบอนุญาตทำงาน (งานบนที่สูง พื้นที่อับอากาศ งานไฟฟ้า งานที่ใช้ความร้อน) การฝึกอบรมความปลอดภัยก่อนเข้าหน่วยงานก่อสร้าง PPE การรายงานอุบัติเหตุภายใน 24 ชั่วโมง การควบคุมผู้รับเหมาช่วง: 【BỔ SUNG】\"></span></p><h3 class=\"ann\" data-n=\"04\"><strong>PHỤ LỤC 04 – BẢNG ĐỐI CHIẾU NỘI BỘ BACK-TO-BACK (KHÔNG GỬI KHÁCH HÀNG)</strong><span class=\"th\" data-t=\"ภาคผนวก 04 – ตารางเทียบภายในแบบ Back-to-Back (ไม่ส่งให้ลูกค้า)\"></span></h3><p>Tài liệu nội bộ KSP – xóa phụ lục này trước khi gửi cho đối tác. Mục đích: bảo đảm hợp đồng mua (Supplier) khớp với hợp đồng bán (Owner) về giá, tiến độ, chất lượng, bảo hành, phạt và bảo lãnh.<span class=\"th\" data-t=\"เอกสารภายในของ KSP – ให้ลบภาคผนวกนี้ก่อนส่งให้คู่ค้า วัตถุประสงค์: เพื่อให้แน่ใจว่าสัญญาซื้อ (Supplier) สอดคล้องกับสัญญาขาย (Owner) ในเรื่องราคา กำหนดการ คุณภาพ การรับประกันผลงาน ค่าปรับ และหนังสือค้ำประกัน\"></span></p><div class=\"tw2\"><table class=\"ct\"><tr><th>Hạng mục<span class=\"th\" data-t=\"รายการ\"></span></th><th>Hợp đồng bán (Owner)<span class=\"th\" data-t=\"สัญญาขาย (Owner)\"></span></th><th>Hợp đồng mua (Supplier) số <span class=\"fx\" data-k=\"SỐ\"></span><span class=\"th\" data-t=\"สัญญาซื้อ (Supplier) เลขที่ 【SỐ】\"></span></th><th>Chênh lệch / rủi ro KSP<span class=\"th\" data-t=\"ความแตกต่าง / ความเสี่ยงของ KSP\"></span></th><th>Biện pháp / người duyệt<span class=\"th\" data-t=\"มาตรการ / ผู้อนุมัติ\"></span></th></tr><tr><td>Giá trị / giá<span class=\"th\" data-t=\"มูลค่า / ราคา\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Tiến độ / ngày hoàn thành<span class=\"th\" data-t=\"กำหนดการ / วันที่แล้วเสร็จ\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Thời hạn thanh toán<span class=\"th\" data-t=\"กำหนดเวลาชำระเงิน\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Tạm ứng / bảo lãnh<span class=\"th\" data-t=\"เงินล่วงหน้า / หนังสือค้ำประกัน\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Phạt chậm / mức trần<span class=\"th\" data-t=\"ค่าปรับกรณีล่าช้า / เพดานสูงสุด\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Bảo hành (thời hạn, ngày bắt đầu, giữ lại)<span class=\"th\" data-t=\"การรับประกันผลงาน (ระยะเวลา วันเริ่มต้น เงินประกันผลงานที่กักไว้)\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Giới hạn trách nhiệm<span class=\"th\" data-t=\"ขีดจำกัดความรับผิด\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td></tr><tr><td>Quyền chấm dứt< class=\"ann\" data-n=\"06\"><strong>PHỤ LỤC 06 – ĐIỀU KIỆN ĐẶC BIỆT VÀ NGOẠI LỆ ĐÀM PHÁN (PHẢI CÓ NGƯỜI PHÊ DUYỆT NỘI BỘ KSP)</strong><span class=\"th\" data-t=\"ภาคผนวก 06 – เงื่อนไขพิเศษและข้อยกเว้นจากการเจรจา (ต้องมีผู้อนุมัติภายในของ KSP)\"></span></h3><div class=\"tw2\"><table class=\"ct\"><tr><th>Điều khoản<span class=\"th\" data-t=\"ข้อกำหนด\"></span></th><th>Nội dung ngoại lệ so với mẫu chuẩn<span class=\"th\" data-t=\"เนื้อหาข้อยกเว้นเมื่อเทียบกับแบบมาตรฐาน\"></span></th><th>Rủi ro còn lại cho KSP<span class=\"th\" data-t=\"ความเสี่ยงที่เหลืออยู่สำหรับ KSP\"></span></th><th>Người phê duyệt<span class=\"th\" data-t=\"ผู้อนุมัติ\"></span></th></tr><tr><td><span class=\"fx\" data-k=\"ĐIỀU\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"\"></span></td><td><span class=\"fx\" data-k=\"HỌ TÊN / NGÀY\"></span></td></tr></table></div><p>Danh mục kiểm tra trước khi ký: (1) Xác nhận loại giá, thuế suất VAT, tỷ lệ phạt và mức trần với tư vấn pháp lý theo luật áp dụng tại ngày ký; (2) Hợp đồng mua (Supplier) đã được đối chiếu tại Phụ lục 04; (3) Thời hạn bảo hành không ngắn hơn quy định; (4) Bảo lãnh tạm ứng, bảo lãnh bảo hành đã được thống nhất; (5) Chọn tòa án hoặc trọng tài thống nhất; (6) Xóa mọi lựa chọn không áp dụng, điền đủ các ô nhập liệu.<span class=\"th\" data-t=\"รายการตรวจสอบก่อนลงนาม: (1) ยืนยันประเภทราคา อัตราภาษีมูลค่าเพิ่ม (VAT) อัตราค่าปรับ และเพดานค่าปรับ กับที่ปรึกษากฎหมายตามกฎหมายที่ใช้บังคับ ณ วันลงนาม; (2) สัญญาซื้อ (Supplier) ได้รับการเทียบกับภาคผนวก 04 แล้ว; (3) ระยะเวลาการรับประกันผลงานไม่สั้นกว่าที่กำหนด; (4) หนังสือค้ำประกันเงินล่วงหน้าและหนังสือค้ำประกันการรับประกันผลงานได้รับการตกลงแล้ว; (5) เลือกศาลหรืออนุญาโตตุลาการให้เป็นหนึ่งเดียวกัน; (6) ลบตัวเลือกที่ไม่ใช้ทั้งหมด และกรอกช่องข้อมูลให้ครบ\"></span></p>", "o2": "<p class=\"ctr\">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM<span class=\"th\" data-t=\"สาธารณรัฐสังคมนิยมเวียดนาม\"></span></p><p class=\"ctr\">Độc lập - Tự do - Hạnh phúc<span class=\"th\" data-t=\"เอกราช - เสรีภาพ - ความสุข\"></span></p><p class=\"ctr\"><strong>HỢP ĐỒNG DỊCH VỤ SỬA CHỮA VÀ BẢO TRÌ</strong><span class=\"th\" data-t=\"สัญญาบริการซ่อมแซมและบำรุงรักษา\"></span></p><p class=\"ctr\">Số: <span class=\"fx\" data-k=\"SỐ HỢP ĐỒNG\"></span> | Dự án / PO: <span class=\"fx\" data-k=\"DỰ ÁN / MÃ PO / MÃ KHÁCH HÀNG\"></span><span class=\"th\" data-t=\"เลขที่: 【SỐ HỢP ĐỒNG】 | โครงการ / PO: 【DỰ ÁN / MÃ PO / MÃ KHÁCH HÀNG】\"></span></p><p>– Căn cứ Bộ luật Dân sự số 91/2015/QH13 và văn bản sửa đổi, bổ sung có hiệu lực tại thời điểm ký;<span class=\"th\" data-t=\"– โดยอาศัยประมวลกฎหมายแพ่ง ฉบับที่ 91/2015/QH13 และเอกสารแก้ไข เพิ่มเติมที่มีผลบังคับใช้ ณ เวลาลงนาม;\"></span></p><p>– Căn cứ Luật Thương mại số 36/2005/QH11 (Mục dịch vụ, mua bán hàng hóa) trong phạm vi áp dụng;<span class=\"th\" data-t=\"– อาศัยพระราชบัญญัติการพาณิชย์ ฉบับที่ 36/2005/QH11 (หมวดว่าด้วยการบริการและการซื้อขายสินค้า) ภายในขอบเขตที่ใช้บังคับ;\"></span></p><p>– Căn cứ quy định pháp luật hiện hành về bảo trì công trình xây dựng, an toàn vệ sinh lao động và an toàn thiết bị (nếu áp dụng cho thiết bị thuộc phạm vi dịch vụ);<span class=\"th\" data-t=\"– อาศัยบทบัญญัติของกฎหมายที่ใช้บังคับในปัจจุบันว่าด้วยการบำรุงรักษางานก่อสร้าง ความปลอดภัยและสุขอนามัยในการทำงาน และความปลอดภัยของอุปกรณ์ (หากใช้บังคับกับอุปกรณ์ที่อยู่ในขอบเขตบริการ);\"></span></p><p>– Căn cứ nhu cầu và khả năng của Các Bên.<span class=\"th\" data-t=\"– โดยอาศัยความต้องการและความสามารถของคู่สัญญาทั้งสองฝ่าย\"></span></p><p>Hôm nay, ngày <span class=\"fx\" data-k=\"NGÀY\"></span> tháng <span class=\"fx\" data-k=\"THÁNG\"></span> năm <span class=\"fx\" data-k=\"NĂM\"></span>, Các Bên gồm:<span class=\"th\" data-t=\"วันนี้ วันที่ 【NGÀY】 เดือน 【THÁNG】 พ.ศ./ค.ศ. 【NĂM】 คู่สัญญาประกอบด้วย:\"></span></p><p class=\"sub\"><strong>BÊN A – KHÁCH HÀNG (BÊN SỬ DỤNG DỊCH VỤ): <span class=\"fx\" data-k=\"TÊN PHÁP LÝ KHÁCH HÀNG\"></span></strong><span class=\"th\" data-t=\"ฝ่าย A – ลูกค้า (ผู้ใช้บริการ): 【TÊN PHÁP LÝ KHÁCH HÀNG】\"></span></p><p>Đại diện: <span class=\"fx\" data-k=\"HỌ TÊN NGƯỜI KÝ\"></span> Chức vụ: <span class=\"fx\" data-k=\"CHỨC VỤ\"></span> Căn cứ thẩm quyền: <span class=\"fx\" data-k=\"ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY\"></span><span class=\"th\" data-t=\"ผู้แทน: 【HỌ TÊN NGƯỜI KÝ】 ตำแหน่ง: 【CHỨC VỤ】 ฐานอำนาจ: 【ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY】\"></span></p><p>Địa chỉ: <span class=\"fx\" data-k=\"ĐỊA CHỈ ĐĂNG KÝ\"></span> Mã số thuế / Mã số doanh nghiệp: <span class=\"fx\" data-k=\"MST / GCN ĐKDN\"></span><span class=\"th\" data-t=\"ที่อยู่: 【ĐỊA CHỈ ĐĂNG KÝ】 เลขประจำตัวผู้เสียภาษี / รหัสวิสาหกิจ: 【MST / GCN ĐKDN】\"></span></p><p>Tài khoản: <span class=\"fx\" data-k=\"CHỦ TÀI KHOẢN / SỐ TÀI KHOẢN / NGÂN HÀNG\"></span> Đại diện nhận thông báo: <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ\"></span> Email: <span class=\"fx\" data-k=\"EMAIL\"></span><span class=\"th\" data-t=\"บัญชี: 【CHỦ TÀI KHOẢN / SỐ TÀI KHOẢN / NGÂN HÀNG】 ผู้แทนรับหนังสือแจ้ง: 【HỌ TÊN / CHỨC VỤ】 อีเมล: 【EMAIL】\"></span></p><p class=\"sub\"><strong>BÊN B – NHÀ CUNG CẤP DỊCH VỤ: CÔNG TY TNHH KSP VIỆT NAM <span class=\"fx\" data-k=\"CHI NHÁNH / ĐƠN VỊ THỰC HIỆN, NẾU CÓ\"></span></strong><span class=\"th\" data-t=\"ฝ่าย B – ผู้ให้บริการ: บริษัท KSP เวียดนาม จำกัด (CÔNG TY TNHH KSP VIỆT NAM) 【CHI NHÁNH / ĐƠN VỊ THỰC HIỆN, NẾU CÓ】\"></span></p><p>Đại diện: <span class=\"fx\" data-k=\"HỌ TÊN NGƯỜI KÝ\"></span> Chức vụ: <span class=\"fx\" data-k=\"CHỨC VỤ\"></span> Căn cứ thẩm quyền: <span class=\"fx\" data-k=\"ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY\"></span><span class=\"th\" data-t=\"ผู้แทน: 【HỌ TÊN NGƯỜI KÝ】 ตำแหน่ง: 【CHỨC VỤ】 ฐานอำนาจ: 【ĐẠI DIỆN PHÁP LUẬT / GIẤY ỦY QUYỀN SỐ, NGÀY】\"></span></p><p>Địa chỉ: <span class=\"fx\" data-k=\"ĐỊA CHỈ PHÁP LÝ KSP – KIỂM TRA ĐĂNG KÝ HIỆN HÀNH\"></span> Mã số thuế: <span class=\"fx\" data-k=\"MST KSP / CHI NHÁNH\"></span><span class=\"th\" data-t=\"ที่อยู่: 【ĐỊA CHỈ PHÁP LÝ KSP – KIỂM TRA ĐĂNG KÝ HIỆN HÀNH】 เลขประจำตัวผู้เสียภาษี: 【MST KSP / CHI NHÁNH】\"></span></p><p>Tài khoản: <span class=\"fx\" data-k=\"SỐ TÀI KHOẢN / NGÂN HÀNG KSP\"></span> Đại diện nhận thông báo: <span class=\"fx\" data-k=\"HỌ TÊN / CHỨC VỤ\"></span> Email: <span class=\"fx\" data-k=\"EMAIL\"></span><span class=\"th\" data-t=\"บัญชี: 【SỐ TÀI KHOẢN / NGÂN HÀNG KSP】 ผู้แทนรับหนังสือแจ้ง: 【HỌ TÊN / CHỨC VỤ】 อีเมล: 【EMAIL】\"></span></p><p>Hai Bên thỏa thuận ký kết hợp đồng dịch vụ sửa chữa và bảo trì (“Hợp đồng”) với các điều khoản sau:<span class=\"th\" data-t=\"คู่สัญญาทั้งสองฝ่ายตกลงทำสัญญาบริการซ่อมแซมและบำรุงรักษา (“สัญญา”) โดยมีข้อกำหนดดังต่อไปนี้:\"></span></p><h3 class=\"art\" data-n=\"1\"><strong>ĐIỀU 1. ĐỊNH NGHĨA VÀ HỒ SƠ HỢP ĐỒNG</strong><span class=\"th\" data-t=\"ข้อ 1. คำนิยามและเอกสารสัญญา\"></span></h3><p class=\"lv1\"><span class=\"lb\">1.1</span>Loại dịch vụ: <span class=\"fx\" data-k=\"SỬA CHỮA THEO YÊU CẦU / BẢO TRÌ ĐỊNH KỲ / SỬA CHỮA VÀ BẢO TRÌ KẾT HỢP\"></span>. Địa điểm: <span class=\"fx\" data-k=\"NHÀ MÁY / TRẠI / CÔNG TRÌNH CỦA BÊN A\"></span>.<span class=\"th\" data-t=\"ประเภทบริการ: 【SỬA CHỮA THEO YÊU CẦU / BẢO TRÌ ĐỊNH KỲ / SỬA CHỮA VÀ BẢO TRÌ KẾT HỢP】 สถานที่: 【NHÀ MÁY / TRẠI / CÔNG TRÌNH CỦA BÊN A】\"></span></p><p class=\"lv1\"><span class=\"lb\">1.2</span>Hồ sơ hợp đồng: Hợp đồng; Phụ lục 01 (Danh mục thiết bị và phạm vi); Phụ lục 02 (SLA và bảng phí); Phụ lục 03 (HSE); Phụ lục 04 (Mẫu biên bản dịch vụ); Phụ lục 05 (nội bộ KSP); thứ tự ưu tiên theo Điều 20.<span class=\"th\" data-t=\"เอกสารสัญญา: สัญญา; ภาคผนวก 01 (รายการอุปกรณ์และขอบเขต); ภาคผนวก 02 (SLA และตารางค่าบริการ); ภาคผนวก 03 (HSE); ภาคผนวก 04 (แบบรายงานบริการ); ภาคผนวก 05 (ภายในของ KSP); ลำดับความสำคัญเป็นไปตามข้อ 20\"></span></p><h3 class=\"art\" data-n=\"2\"><strong>ĐIỀU 2. PHẠM VI DỊCH VỤ</strong><span class=\"th\" data-t=\"ข้อ 2. ขอบเขตบริการ\"></span></h3><p class=\"lv1\"><span class=\"lb\">2.1</span>Bên B cung cấp dịch vụ cho thiết bị, hệ thống nêu tại Phụ lục 01: (a) bảo trì định kỳ theo chu kỳ <span class=\"fx\" data-k=\"\"></span>; (b) sửa chữa khi có sự cố theo yêu cầu của Bên A; (c) cung cấp, thay thế phụ tùng, vật tư; (d) lập báo cáo dịch vụ và khuyến nghị.<span class=\"th\" data-t=\"ฝ่าย B ให้บริการสำหรับอุปกรณ์และระบบที่ระบุในภาคผนวก 01: (a) การบำรุงรักษาตามระยะตามรอบ 【】; (b) การซ่อมแซมเมื่อเกิดเหตุขัดข้องตามที่ฝ่าย A ร้องขอ; (c) การจัดหาและเปลี่ยนอะไหล่ วัสดุ; (d) การจัดทำรายงานบริการและข้อเสนอแนะ\"></span></p><p class=\"lv1\"><span class=\"lb\">2.2</span>Dịch vụ không bao gồm: nâng cấp, thay đổi thiết kế, di dời thiết bị, sửa chữa do vận hành sai, vandalism, thiên tai, sự cố điện, nước, khí cấp từ bên ngoài, thiết bị không có trong Phụ lục 01 hoặc không còn phụ tùng cung cấp; các công việc này chỉ thực hiện theo Điều 13 (ngoài phạm vi).<span class=\"th\" data-t=\"บริการไม่รวมถึง: การปรับปรุงยกระดับ การเปลี่ยนแปลงการออกแบบ การย้ายอุปกรณ์ การซ่อมแซมอันเนื่องจากการใช้งานผิดวิธี การจงใจทำลายทรัพย์สิน (vandalism) ภัยธรรมชาติ ปัญหาไฟฟ้า น้ำ ลมที่จ่ายจากภายนอก อุปกรณ์ที่ไม่อยู่ในภาคผนวก 01 หรืออุปกรณ์ที่ไม่มีอะไหล่จำหน่ายอีกต่อไป; งานเหล่านี้จะดำเนินการได้เฉพาะตามข้อ 13 (นอกขอบเขต) เท่านั้น\"></span></p><h3 class=\"art\" data-n=\"3\"><strong>ĐIỀU 3. MỨC ĐỘ DỊCH VỤ (SLA)</strong><span class=\"th\" data-t=\"ข้อ 3. ระดับการให้บริการ (SLA)\"></span></h3><p class=\"lv1\"><span class=\"lb\">3.1</span>Thời hạn phản hồi và có mặt tại hiện trường theo mức độ khẩn cấp như Phụ lục 02: Khẩn cấp (dừng sản xuất): phản hồi <span class=\"fx\" data-k=\"\"></span> giờ, có mặt <span class=\"fx\" data-k=\"\"></span> giờ; Cao: <span class=\"fx\" data-k=\"\"></span>/<span class=\"fx\" data-k=\"\"></span>; Thường: <span class=\"fx\" data-k=\"\"></span>/<span class=\"fx\" data-k=\"\"></span> ngày làm việc. Thời hạn tính từ khi Bên B nhận thông báo đầy đủ thông tin qua kênh <span class=\"fx\" data-k=\"HOTLINE / EMAIL / PHẦN MỀM\"></span>.<span class=\"th\" data-t=\"กำหนดเวลาตอบสนองและเข้าถึงสถานที่ปฏิบัติงานตามระดับความเร่งด่วนตามภาคผนวก 02: เร่งด่วน (หยุดการผลิต): ตอบสนองภายใน 【】 ชั่วโมง เข้าถึงสถานที่ภายใน 【】 ชั่วโมง; สูง: 【】 / 【】; ปกติ: 【】 / 【】 วันทำการ กำหนดเวลานับตั้งแต่ฝ่าย B ได้รับแจ้งข้อมูลครบถ้วนผ่านช่องทาง 【HOTLINE / EMAIL / PHẦN MỀM】\"></span></p><p class=\"lv1\"><span class=\"lb\">3.2</span>SLA không áp dụng khi Bên A chậm cho phép tiếp cận, chưa bảo đảm điều kiện an toàn, chậm cung cấp thông tin, hoặc sự kiện bất khả kháng. Không đạt SLA do lỗi Bên B: Bên A được giảm phí theo Phụ lục 02, là biện pháp bồi thường duy nhất đối với việc chậm phản hồi, trừ vi phạm nghiêm trọng.<span class=\"th\" data-t=\"SLA ไม่ใช้บังคับเมื่อฝ่าย A ล่าช้าในการอนุญาตให้เข้าถึง ยังไม่จัดเตรียมเงื่อนไขความปลอดภัยให้พร้อม ล่าช้าในการให้ข้อมูล หรือเกิดเหตุสุดวิสัย กรณีไม่บรรลุ SLA เพราะความผิดของฝ่าย B: ฝ่าย A ได้รับการลดค่าบริการตามภาคผนวก 02 ซึ่งเป็นมาตรการชดเชยเพียงอย่างเดียวสำหรับการตอบสนองล่าช้า เว้นแต่เป็นการละเมิดสัญญาอย่างร้ายแรง\"></span></p><h3 class=\"art\" data-n=\"4\"><strong>ĐIỀU 4. PHÍ DỊCH VỤ VÀ GIÁ</strong><span class=\"th\" data-t=\"ข้อ 4. ค่าบริการและราคา\"></span></h3><p class=\"lv1\"><span class=\"lb\">4.1</span>Phí cố định bảo trì: <span class=\"fx\" data-k=\"SỐ TIỀN\"></span> VNĐ/<span class=\"fx\" data-k=\"THÁNG / QUÝ / NĂM\"></span> (chưa VAT). Sửa chữa theo yêu cầu: <span class=\"fx\" data-k=\"GIÁ THEO GIỜ CÔNG / CÔNG KHOÁN\"></span>; phí đi lại, lưu trú: <span class=\"fx\" data-k=\"\"></span>; phụ tùng, vật tư: theo bảng giá Phụ lục 02 hoặc báo giá được Bên A chấp thuận.<span class=\"th\" data-t=\"ค่าบำรุงรักษาคงที่: 【SỐ TIỀN】 VNĐ/ 【THÁNG / QUÝ / NĂM】 (ยังไม่รวมภาษีมูลค่าเพิ่ม (VAT)) การซ่อมแซมตามคำขอ: 【GIÁ THEO GIỜ CÔNG / CÔNG KHOÁN】; ค่าเดินทางและที่พัก: 【】; อะไหล่และวัสดุ: ตามตารางราคาในภาคผนวก 02 หรือใบเสนอราคาที่ฝ่าย A อนุมัติ\"></span></p><p class=\"lv1\"><span class=\"lb\">4.2</span>Công việc ước tính trên <span class=\"fx\" data-k=\"SỐ TIỀN\"></span> VNĐ phải có báo giá được Bên A xác nhận bằng văn bản (kể cả email) trước khi thực hiện, trừ khẩn cấp để bảo vệ người và tài sản.<span class=\"th\" data-t=\"งานที่ประมาณการเกิน 【SỐ TIỀN】 VNĐ ต้องมีใบเสนอราคาที่ฝ่าย A ยืนยันเป็นลายลักษณ์อักษร (รวมถึงอีเมล) ก่อนดำเนินการ เว้นแต่กรณีเร่งด่วนเพื่อปกป้องชีวิตบุคคลและทรัพย์สิน\"></span></p><p class=\"lv1\"><span class=\"lb\">4.3</span>Điều chỉnh phí hằng năm: <span class=\"fx\" data-k=\"CPI / TỶ LỆ\"></span>%, thông báo trước <span class=\"fx\" data-k=\"60\"></span> ngày trước ngày điều chỉnh. VAT theo quy định tại ngày xuất hóa đơn.<span class=\"th\" data-t=\"การปรับค่าบริการประจำปี: 【CPI / TỶ LỆ】 % โดยแจ้งล่วงหน้า 【60】 วันก่อนวันที่ปรับ ภาษีมูลค่าเพิ่ม (VAT) เป็นไปตามกฎหมายที่ใช้บังคับ ณ วันออกใบแจ้งหนี้\"></span></p><h3 class=\"art\" data-n=\"5\"><strong>ĐIỀU 5. THANH TOÁN</strong><span class=\"th\" data-t=\"ข้อ 5. การชำระเงิน\"></span></h3><p class=\"lv1\"><span class=\"lb\">5.1</span>Phí cố định xuất hóa đơn <span class=\"fx\" data-k=\"TRƯỚC / SAU\"></span> mỗi kỳ; phí sửa chữa và phụ tùng xuất hóa đơn sau khi hai Bên ký biên bản dịch vụ (Phụ lục 04).<span class=\"th\" data-t=\"ค่าบริการคงที่ออกใบแจ้งหนี้ 【TRƯỚC / SAU】 แต่ละรอบ; ค่าซ่อมแซมและอะไหล่ออกใบแจ้งหนี้หลังจากคู่สัญญาทั้งสองฝ่ายลงนามในรายงานบริการ (ภาคผนวก 04)\"></span></p><p class=\"lv1\"><span class=\"lb\">5.2</span>Thanh toán trong <span class=\"fx\" data-k=\"15 / 30\"></span> ngày kể từ ngày nhận hóa đơn điện tử hợp lệ (Nghị định 123/2020/NĐ-CP) kèm biên bản dịch vụ, bằng chuyển khoản VNĐ. Phần không tranh chấp vẫn phải thanh toán đúng hạn.<span class=\"th\" data-t=\"ชำระภายใน 【15 / 30】 วันนับแต่วันที่ได้รับใบแจ้งหนี้อิเล็กทรอนิกส์ที่ถูกต้อง (ตามพระราชกฤษฎีกา 123/2020/NĐ-CP) พร้อมรายงานบริการ โดยโอนเงินเป็น VNĐ ส่วนที่ไม่มีข้อพิพาทยังคงต้องชำระตรงเวลา\"></span></p><p class=\"lv1\"><span class=\"lb\">5.3</span>Chậm thanh toán: lãi <span class=\"fx\" data-k=\"\"></span>%/năm trên số tiền chậm, không vượt mức pháp luật cho phép; chậm quá <span class=\"fx\" data-k=\"30\"></span> ngày sau thông báo, Bên B được tạm ngừng dịch vụ mà không phải chịu trách nhiệm về hậu quả do việc tạm ngừng.<span class=\"th\" data-t=\"ชำระเงินล่าช้า: ดอกเบี้ย 【】 %/ปี ของจำนวนเงินที่ล่าช้า ทั้งนี้ไม่เกินอัตราที่กฎหมายอนุญาต; หากล่าช้าเกิน 【30】 วันหลังได้รับแจ้ง ฝ่าย B มีสิทธิระงับบริการชั่วคราวโดยไม่ต้องรับผิดชอบต่อผลที่เกิดจากการระงับดังกล่าว\"></span></p><h3 class=\"art\" data-n=\"6\"><strong>ĐIỀU 6. NGHĨA VỤ CỦA BÊN A</strong><span class=\"th\" data-t=\"ข้อ 6. หน้าที่ของฝ่าย A\"></span></h3><p class=\"lv1\"><span class=\"lb\">6.1</span>Cho phép Bên B và nhân sự tiếp cận thiết bị, khu vực làm việc; bảo đảm điều kiện làm việc an toàn, cung cấp điện, nước, khí, lối đi, giàn giáo, thiết bị nâng (nếu thuộc trách nhiệm Bên A); dừng và cách ly thiết bị khi Bên B yêu cầu để sửa chữa.<span class=\"th\" data-t=\"อนุญาตให้ฝ่าย B และบุคลากรเข้าถึงอุปกรณ์และพื้นที่ปฏิบัติงาน; จัดให้มีสภาพการทำงานที่ปลอดภัย จัดหาไฟฟ้า น้ำ ลม ทางเข้าออก นั่งร้าน อุปกรณ์ยก (หากเป็นความรับผิดชอบของฝ่าย A); หยุดและแยกอุปกรณ์ออกเมื่อฝ่าย B ร้องขอเพื่อการซ่อมแซม\"></span></p><p class=\"lv1\"><span class=\"lb\">6.2</span>Vận hành thiết bị theo hướng dẫn của nhà sản xuất; cung cấp lịch sử vận hành, bản vẽ, thông tin sự cố; không để người không có thẩm quyền sửa chữa, thay đổi thiết bị trong thời gian có hợp đồng, trừ khi thông báo bằng văn bản.<span class=\"th\" data-t=\"ใช้งานอุปกรณ์ตามคำแนะนำของผู้ผลิต; จัดหาประวัติการใช้งาน แบบแปลน ข้อมูลเหตุขัดข้อง; ไม่ปล่อยให้บุคคลที่ไม่มีอำนาจซ่อมแซมหรือเปลี่ยนแปลงอุปกรณ์ในช่วงระยะเวลาสัญญา เว้นแต่ได้แจ้งเป็นลายลักษณ์อักษร\"></span></p><p class=\"lv1\"><span class=\"lb\">6.3</span>Chỉ định đầu mối ký biên bản dịch vụ; ký hoặc phản hồi bằng văn bản trong <span class=\"fx\" data-k=\"03\"></span> ngày làm việc.<span class=\"th\" data-t=\"แต่งตั้งผู้ประสานงานเพื่อลงนามรายงานบริการ; ลงนามหรือตอบกลับเป็นลายลักษณ์อักษรภายใน 【03】 วันทำการ\"></span></p><h3 class=\"art\" data-n=\"7\"><strong>ĐIỀU 7. NGHĨA VỤ CỦA BÊN B</strong><span class=\"th\" data-t=\"ข้อ 7. หน้าที่ของฝ่าย B\"></span></h3><p class=\"lv1\"><span class=\"lb\">7.1</span>Thực hiện dịch vụ bằng nhân sự có năng lực, chứng chỉ phù hợp (an toàn điện, làm việc trên cao, thiết bị áp lực… nếu áp dụng); tuân thủ HSE của Bên A.<span class=\"th\" data-t=\"ปฏิบัติงานบริการโดยบุคลากรที่มีความสามารถและมีใบรับรองที่เหมาะสม (ความปลอดภัยทางไฟฟ้า งานบนที่สูง อุปกรณ์แรงดัน… หากใช้บังคับ); ปฏิบัติตาม HSE ของฝ่าย A\"></span></p><p class=\"lv1\"><span class=\"lb\">7.2</span>Lập biên bản dịch vụ sau mỗi lần thực hiện nêu rõ tình trạng thiết bị, công việc đã làm, phụ tùng thay, khuyến nghị; lưu hồ sơ lịch sử bảo trì.<span class=\"th\" data-t=\"จัดทำรายงานบริการหลังการปฏิบัติงานแต่ละครั้ง โดยระบุสภาพอุปกรณ์ งานที่ได้ทำ อะไหล่ที่เปลี่ยน และข้อเสนอแนะอย่างชัดเจน; เก็บรักษาประวัติการบำรุงรักษา\"></span></p><p class=\"lv1\"><span class=\"lb\">7.3</span>Thông báo cho Bên A khi phát hiện rủi ro an toàn hoặc khiếm khuyết có thể nhận biết hợp lý; nếu Bên A không khắc phục sau khuyến nghị bằng văn bản thì Bên B không chịu trách nhiệm cho hậu quả phát sinh từ khiếm khuyết đó.<span class=\"th\" data-t=\"แจ้งให้ฝ่าย A ทราบเมื่อพบความเสี่ยงด้านความปลอดภัยหรือข้อบกพร่องที่อาจรับรู้ได้โดยสมควร; หากฝ่าย A ไม่แก้ไขหลังได้รับข้อเสนอแนะเป็นลายลักษณ์อักษร ฝ่าย B ไม่ต้องรับผิดชอบต่อผลที่เกิดขึ้นจากข้อบกพร่องนั้น\"></span></p><h3 class=\"art\" data-n=\"8\"><strong>ĐIỀU 8. PHỤ TÙNG VÀ VẬT TƯ THAY THẾ</strong><span class=\"th\" data-t=\"ข้อ 8. อะไหล่และวัสดุทดแทน\"></span></h3><p class=\"lv1\"><span class=\"lb\">8.1</span>Phụ tùng thay thế là hàng mới, chính hãng hoặc tương đương đã thông báo cho Bên A; phụ tùng bị thay ra thuộc <span class=\"fx\" data-k=\"BÊN A / BÊN B\"></span> (hàng nguy hại xử lý theo quy định môi trường).<span class=\"th\" data-t=\"อะไหล่ทดแทนเป็นของใหม่ แท้จากผู้ผลิต หรือเทียบเท่าที่ได้แจ้งให้ฝ่าย A ทราบแล้ว; อะไหล่ที่ถูกเปลี่ยนออกเป็นของ 【BÊN A / BÊN B】 (ของเสียอันตรายต้องจัดการตามข้อกำหนดด้านสิ่งแวดล้อม)\"></span></p><p class=\"lv1\"><span class=\"lb\">8.2</span>Quyền sở hữu phụ tùng chuyển cho Bên A khi thanh toán đầy đủ; rủi ro chuyển khi lắp đặt xong. Bảo hành phụ tùng <span class=\"fx\" data-k=\"SỐ\"></span> tháng từ ngày thay hoặc theo nhà sản xuất nếu ngắn hơn.<span class=\"th\" data-t=\"กรรมสิทธิ์ในอะไหล่โอนให้ฝ่าย A เมื่อชำระเงินครบถ้วน; ความเสี่ยงโอนเมื่อติดตั้งเสร็จ การรับประกันอะไหล่ 【SỐ】 เดือนนับจากวันเปลี่ยน หรือตามผู้ผลิตหากสั้นกว่า\"></span></p><h3 class=\"art\" data-n=\"9\"><strong>ĐIỀU 9. NGHIỆM THU DỊCH VỤ</strong><span class=\"th\" data-t=\"ข้อ 9. การตรวจรับบริการ\"></span></h3><p class=\"lv1\"><span class=\"lb\">9.1</span>Sau mỗi lần dịch vụ, Bên B trình biên bản; Bên A xác nhận hoặc nêu rõ lý do từ chối bằng văn bản trong <span class=\"fx\" data-k=\"03\"></span> ngày làm việc. Quá hạn không phản hồi và thiết bị đã vận hành bình thường thì dịch vụ được coi là đã nghiệm thu.<span class=\"th\" data-t=\"หลังการให้บริการแต่ละครั้ง ฝ่าย B ส่งรายงาน; ฝ่าย A ยืนยัน หรือระบุเหตุผลในการปฏิเสธเป็นลายลักษณ์อักษรภายใน 【03】 วันทำการ หากพ้นกำหนดโดยไม่ตอบกลับและอุปกรณ์ทำงานได้ตามปกติ ให้ถือว่าบริการได้รับการตรวจรับแล้ว\"></span></p><p class=\"lv1\"><span class=\"lb\">9.2</span>Nếu dịch vụ không đạt, Bên B thực hiện lại bằng chi phí của mình trong thời hạn hợp lý, không tính phí lần này.<span class=\"th\" data-t=\"หากบริการไม่ผ่านเกณฑ์ ฝ่าย B ดำเนินการใหม่โดยค่าใช้จ่ายของตนเองภายในระยะเวลาอันสมควร โดยไม่คิดค่าบริการสำหรับครั้งนี้\"></span></p><h3 class=\"art\" data-n=\"10\"><strong>ĐIỀU 10. BẢO HÀNH DỊCH VỤ</strong><span class=\"th\" data-t=\"ข้อ 10. การรับประกันบริการ\"></span></h3><p class=\"lv1\"><span class=\"lb\">10.1</span>Bên B bảo hành chất lượng công việc sửa chữa, bảo trì trong <span class=\"fx\" data-k=\"90\"></span> ngày kể từ ngày nghiệm thu: thực hiện lại công việc không đạt chất lượng do lỗi Bên B, miễn phí nhân công và phụ tùng do Bên B cung cấp.<span class=\"th\" data-t=\"ฝ่าย B รับประกันคุณภาพงานซ่อมแซมและบำรุงรักษาเป็นเวลา 【90】 วันนับจากวันตรวจรับ: ดำเนินงานที่ไม่ได้คุณภาพเนื่องจากความผิดของฝ่าย B ใหม่ โดยไม่คิดค่าแรงและอะไหล่ที่ฝ่าย B จัดหา\"></span></p><p class=\"lv1\"><span class=\"lb\">10.2</span>Không áp dụng bảo hành khi hỏng hóc do nguyên nhân khác với công việc đã thực hiện, vận hành sai, thay đổi bởi bên thứ ba, hoặc phụ tùng do Bên A cung cấp.<span class=\"th\" data-t=\"ไม่ใช้บังคับการรับประกันเมื่อความเสียหายเกิดจากสาเหตุอื่นนอกเหนือจากงานที่ได้ดำเนินการ การใช้งานผิดวิธี การเปลี่ยนแปลงโดยบุคคลที่สาม หรืออะไหล่ที่ฝ่าย A จัดหา\"></span></p><h3 class=\"art\" data-n=\"11\"><strong>ĐIỀU 11. TRÁCH NHIỆM, PHẠT VÀ GIỚI HẠN</strong><span class=\"th\" data-t=\"ข้อ 11. ความรับผิด ค่าปรับ และข้อจำกัด\"></span></h3><p class=\"lv1\"><span class=\"lb\">11.1</span>Chậm thực hiện dịch vụ theo thỏa thuận do lỗi Bên B: phạt <span class=\"fx\" data-k=\"0,05\"></span>%/ngày trên giá trị phần dịch vụ chậm, tối đa <span class=\"fx\" data-k=\"8\"></span>% (theo Điều 301 Luật Thương mại 2005 nếu áp dụng; xác nhận quy định hiện hành khi ký). Chậm thanh toán: Bên A chịu lãi theo Điều 5.3.<span class=\"th\" data-t=\"ล่าช้าในการให้บริการตามที่ตกลงเนื่องจากความผิดของฝ่าย B: ค่าปรับ 【0,05】 %/วัน ของมูลค่าส่วนบริการที่ล่าช้า สูงสุดไม่เกิน 【8】 % (ตามข้อ 301 แห่งพระราชบัญญัติการพาณิชย์ 2005 หากใช้บังคับ; ให้ยืนยันบทบัญญัติที่ใช้บังคับในปัจจุบันเมื่อลงนาม) ชำระเงินล่าช้า: ฝ่าย A รับผิดดอกเบี้ยตามข้อ 5.3\"></span></p><p class=\"lv1\"><span class=\"lb\">11.2</span>Bồi thường thiệt hại trực tiếp, thực tế do lỗi Bên B gây ra cho tài sản và người thuộc phạm vi làm việc, với tổng mức tối đa bằng <span class=\"fx\" data-k=\"100\"></span>% phí dịch vụ đã thanh toán hoặc phải thanh toán trong <span class=\"fx\" data-k=\"12\"></span> tháng liền trước sự kiện, hoặc giới hạn bảo hiểm trách nhiệm của Bên B nếu cao hơn.<span class=\"th\" data-t=\"ชดใช้ค่าเสียหายโดยตรงที่เกิดขึ้นจริงอันเกิดจากความผิดของฝ่าย B ต่อทรัพย์สินและบุคคลภายในขอบเขตพื้นที่ปฏิบัติงาน โดยมีวงเงินรวมสูงสุดเท่ากับ 【100】 % ของค่าบริการที่ได้ชำระแล้วหรือที่ต้องชำระภายใน 【12】 เดือนติดต่อกันก่อนเกิดเหตุการณ์ หรือวงเงินจำกัดของประกันภัยความรับผิดของฝ่าย B หากสูงกว่า\"></span></p><p class=\"lv1\"><span class=\"lb\">11.3</span>Không bồi thường thiệt hại gián tiếp, mất sản lượng, mất lợi nhuận, gián đoạn sản xuất, thiệt hại về vật nuôi, nguyên liệu, thành phẩm, trừ khi do cố ý hoặc vi phạm pháp luật bắt buộc không cho phép loại trừ.<span class=\"th\" data-t=\"ไม่ชดใช้ค่าเสียหายทางอ้อม การสูญเสียผลผลิต การสูญเสียกำไร การหยุดชะงักของการผลิต ความเสียหายต่อปศุสัตว์ วัตถุดิบ ผลิตภัณฑ์สำเร็จรูป เว้นแต่เกิดจากการกระทำโดยจงใจหรือการฝ่าฝืนกฎหมายบังคับที่ไม่อนุญาตให้ยกเว้น\"></span></p><h3 class=\"art\" data-n=\"12\"><strong>ĐIỀU 12. AN TOÀN VÀ MÔI TRƯỜNG TẠI HIỆN TRƯỜNG</strong><span class=\"th\" data-t=\"ข้อ 12. ความปลอดภัยและสิ่งแวดล้อมในพื้นที่ปฏิบัติงาน\"></span></h3><p class=\"lv1\"><span class=\"lb\">12.1</span>Hai Bên áp dụng quy trình cách ly, khóa nguồn, gắn thẻ (LOTO) và giấy phép làm việc theo Phụ lục 03 trước khi Bên B thao tác. Bên A xác nhận thiết bị đã được cách ly an toàn.<span class=\"th\" data-t=\"คู่สัญญาทั้งสองฝ่ายใช้ขั้นตอนการแยกระบบ ล็อกแหล่งพลังงาน ติดป้ายแขวน (LOTO) และใบอนุญาตทำงานตามภาคผนวก 03 ก่อนที่ฝ่าย B จะดำเนินการ ฝ่าย A ยืนยันว่าอุปกรณ์ได้รับการแยกอย่างปลอดภัยแล้ว\"></span></p><p class=\"lv1\"><span class=\"lb\">12.2</span>Bên B chịu trách nhiệm về an toàn của người lao động của mình; Bên A chịu trách nhiệm về an toàn quy trình, hóa chất, vật nuôi, thực phẩm, khu vực sản xuất do Bên A quản lý.<span class=\"th\" data-t=\"ฝ่าย B รับผิดชอบต่อความปลอดภัยของลูกจ้างของตน; ฝ่าย A รับผิดชอบต่อความปลอดภัยของกระบวนการ สารเคมี ปศุสัตว์ อาหาร และพื้นที่การผลิตที่ฝ่าย A บริหารจัดการ\"></span></p><h3 class=\"art\" data-n=\"13\"><strong>ĐIỀU 13. THAY ĐỔI PHẠM VI VÀ DỊCH VỤ NGOÀI PHẠM VI</strong><span class=\"th\" data-t=\"ข้อ 13. การเปลี่ยนแปลงขอบเขตและบริการนอกขอบเขต\"></span></h3><p class=\"lv1\"><span class=\"lb\">13.1</span>Yêu cầu ngoài phạm vi phải được Bên B báo giá, Bên A phê duyệt bằng văn bản (kể cả email của đầu mối được ủy quyền) trước khi thực hiện.<span class=\"th\" data-t=\"คำขอนอกขอบเขตต้องได้รับใบเสนอราคาจากฝ่าย B และฝ่าย A อนุมัติเป็นลายลักษณ์อักษร (รวมถึงอีเมลของผู้ประสานงานที่ได้รับมอบอำนาจ) ก่อนดำเนินการ\"></span></p><p class=\"lv1\"><span class=\"lb\">13.2</span>Danh mục thiết bị có thể thêm/bớt bằng phụ lục điều chỉnh có chữ ký hai Bên; phí điều chỉnh tương ứng.<span class=\"th\" data-t=\"รายการอุปกรณ์อาจเพิ่ม/ลดได้โดยภาคผนวกแก้ไขที่คู่สัญญาทั้งสองฝ่ายลงนาม; ค่าบริการปรับตามสัดส่วน\"></span></p><h3 class=\"art\" data-n=\"14\"><strong>ĐIỀU 14. THỜI HẠN VÀ CHẤM DỨT</strong><span class=\"th\" data-t=\"ข้อ 14. ระยะเวลาและการเลิกสัญญา\"></span></h3><p class=\"lv1\"><span class=\"lb\">14.1</span>Hợp đồng có hiệu lực <span class=\"fx\" data-k=\"SỐ\"></span> tháng kể từ <span class=\"fx\" data-k=\"NGÀY\"></span>, tự gia hạn <span class=\"fx\" data-k=\"SỐ\"></span> tháng nếu không bên nào thông báo không gia hạn trước <span class=\"fx\" data-k=\"60\"></span> ngày.<span class=\"th\" data-t=\"สัญญามีผลใช้บังคับ 【SỐ】 เดือนนับจาก 【NGÀY】 ต่ออายุอัตโนมัติครั้งละ 【SỐ】 เดือน หากไม่มีฝ่ายใดแจ้งไม่ต่ออายุล่วงหน้า 【60】 วัน\"></span></p><p class=\"lv1\"><span class=\"lb\">14.2</span>Mỗi Bên có quyền chấm dứt khi Bên kia vi phạm nghiêm trọng không khắc phục trong <span class=\"fx\" data-k=\"15\"></span> ngày kể từ thông báo; hoặc chấm dứt không cần lý do với thông báo trước <span class=\"fx\" data-k=\"60\"></span> ngày. Khi chấm dứt Bên A thanh toán phần dịch vụ đã thực hiện và phụ tùng đã đặt hàng không thể hoàn trả.<span class=\"th\" data-t=\"คู่สัญญาแต่ละฝ่ายมีสิทธิเลิกสัญญาเมื่ออีกฝ่ายละเมิดสัญญาอย่างร้ายแรงและไม่แก้ไขภายใน 【15】 วันนับจากวันที่ได้รับแจ้ง; หรือเลิกสัญญาโดยไม่ต้องมีเหตุผลโดยแจ้งล่วงหน้า 【60】 วัน เมื่อเลิกสัญญา ฝ่าย A ชำระค่าบริการส่วนที่ได้ดำเนินการแล้วและอะไหล่ที่สั่งซื้อไว้ซึ่งไม่สามารถคืนได้\"></span></p><h3 class=\"art\" data-n=\"15\"><strong>ĐIỀU 15. BẤT KHẢ KHÁNG</strong><span class=\"th\" data-t=\"ข้อ 15. เหตุสุดวิสัย\"></span></h3><p class=\"lv1\"><span class=\"lb\">15.1</span>Bất khả kháng là sự kiện xảy ra một cách khách quan không thể lường trước và không thể khắc phục được mặc dù đã áp dụng mọi biện pháp cần thiết và khả năng cho phép (Điều 156 Bộ luật Dân sự 2015), kể cả thiên tai, dịch bệnh, chiến tranh, quyết định của cơ quan nhà nước có thẩm quyền làm cấm hoặc đình chỉ việc thực hiện hợp đồng.<span class=\"th\" data-t=\"เหตุสุดวิสัยคือเหตุการณ์ที่เกิดขึ้นโดยปรากฏชัดแจ้งตามวัตถุวิสัย ไม่อาจคาดการณ์ได้ และไม่อาจแก้ไขได้ แม้ได้ใช้มาตรการทุกอย่างที่จำเป็นและเท่าที่ความสามารถอำนวยแล้ว (มาตรา 156 ประมวลกฎหมายแพ่ง ค.ศ. 2015) รวมถึงภัยธรรมชาติ โรคระบาด สงคราม และคำสั่งของหน่วยงานของรัฐที่มีอำนาจที่ห้ามหรือระงับการปฏิบัติตามสัญญา\"></span></p><p class=\"lv1\"><span class=\"lb\">15.2</span>Bên bị ảnh hưởng phải thông báo bằng văn bản cho Bên kia trong <span class=\"fx\" data-k=\"07\"></span> ngày kể từ ngày sự kiện xảy ra, kèm chứng cứ (xác nhận của cơ quan có thẩm quyền nếu có), áp dụng mọi biện pháp hợp lý để hạn chế thiệt hại và nối lại việc thực hiện ngay khi có thể. Thông báo chậm làm Bên bị ảnh hưởng mất quyền miễn trách nhiệm đối với phần thiệt hại phát sinh do chậm thông báo.<span class=\"th\" data-t=\"ฝ่ายที่ได้รับผลกระทบต้องแจ้งเป็นลายลักษณ์อักษรให้อีกฝ่ายทราบภายใน 【07】 วัน นับจากวันที่เหตุการณ์เกิดขึ้น พร้อมพยานหลักฐาน (การรับรองจากหน่วยงานที่มีอำนาจ หากมี) ใช้มาตรการที่สมเหตุสมผลทุกอย่างเพื่อลดความเสียหาย และกลับมาปฏิบัติตามสัญญาโดยเร็วที่สุดเท่าที่ทำได้ การแจ้งล่าช้าทำให้ฝ่ายที่ได้รับผลกระทบสูญเสียสิทธิในการได้รับยกเว้นความรับผิดสำหรับความเสียหายที่เกิดจากการแจ้งล่าช้า\"></span></p><p class=\"lv1\"><span class=\"lb\">15.3</span>Không được coi là bất khả kháng: khó khăn tài chính, biến động giá, thiếu nhân công, vật tư, phương tiện; lỗi của nhà thầu phụ, nhà cung cấp, nhà vận chuyển của Bên vi phạm, trừ khi chính họ gặp sự kiện bất khả kháng đáp ứng định nghĩa trên.<span class=\"th\" data-t=\"ไม่ถือเป็นเหตุสุดวิสัย: ความยากลำบากทางการเงิน ความผันผวนของราคา การขาดแคลนแรงงาน วัสดุ และยานพาหนะ; ความผิดของผู้รับเหมาช่วง ผู้จัดหา ผู้ขนส่งของฝ่ายที่ผิดสัญญา เว้นแต่บุคคลเหล่านั้นประสบเหตุสุดวิสัยที่เข้าตามคำนิยามข้างต้น\"></span></p><p class=\"lv1\"><span class=\"lb\">15.4</span>Nếu sự kiện bất khả kháng kéo dài quá <span class=\"fx\" data-k=\"60\"></span> ngày liên tục, Các Bên thương lượng phương án tiếp tục hoặc chấm dứt. Nếu không thỏa thuận được, mỗi Bên có quyền chấm dứt phần hợp đồng bị ảnh hưởng bằng thông báo trước <span class=\"fx\" data-k=\"15\"></span> ngày; phần đã thực hiện đúng hợp đồng được thanh toán, không bên nào phải chịu phạt vi phạm.<span class=\"th\" data-t=\"หากเหตุสุดวิสัยดำเนินต่อเนื่องเกิน 【60】 วัน ทั้งสองฝ่ายต้องเจรจาแนวทางดำเนินการต่อหรือเลิกสัญญา หากตกลงกันไม่ได้ แต่ละฝ่ายมีสิทธิเลิกสัญญาในส่วนที่ได้รับผลกระทบโดยแจ้งล่วงหน้า 【15】 วัน; ส่วนที่ได้ดำเนินการถูกต้องตามสัญญาแล้วจะได้รับการชำระเงิน และไม่ฝ่ายใดต้องรับผิดค่าปรับตามสัญญา\"></span></p><h3 class=\"art\" data-n=\"16\"><strong>ĐIỀU 16. BẢO MẬT, SỞ HỮU TRÍ TUỆ VÀ BẢO VỆ DỮ LIỆU CÁ NHÂN</strong><span class=\"th\" data-t=\"ข้อ 16. การรักษาความลับ ทรัพย์สินทางปัญญา และการคุ้มครองข้อมูลส่วนบุคคล\"></span></h3><p class=\"lv1\"><span class=\"lb\">16.1</span>Mỗi Bên giữ bí mật thông tin kỹ thuật, giá, tài liệu và thông tin kinh doanh của Bên kia nhận được liên quan đến hợp đồng; chỉ sử dụng cho mục đích thực hiện hợp đồng và chỉ tiết lộ cho nhân sự, tư vấn, ngân hàng, bảo hiểm cần biết hoặc khi cơ quan nhà nước có thẩm quyền yêu cầu theo luật.<span class=\"th\" data-t=\"แต่ละฝ่ายต้องรักษาความลับของข้อมูลทางเทคนิค ราคา เอกสาร และข้อมูลทางธุรกิจของอีกฝ่ายที่ได้รับเกี่ยวกับสัญญา ใช้เพื่อวัตถุประสงค์ในการปฏิบัติตามสัญญาเท่านั้น และเปิดเผยเฉพาะแก่บุคลากร ที่ปรึกษา ธนาคาร บริษัทประกันภัยที่จำเป็นต้องรู้ หรือเมื่อหน่วยงานของรัฐที่มีอำนาจเรียกร้องตามกฎหมาย\"></span></p><p class=\"lv1\"><span class=\"lb\">16.2</span>Nghĩa vụ bảo mật kéo dài <span class=\"fx\" data-k=\"03\"></span> năm sau khi hợp đồng chấm dứt hoặc hết hiệu lực. Quyền sở hữu trí tuệ đối với tài liệu, bản vẽ, phần mềm của mỗi Bên không chuyển giao, trừ phạm vi được cấp phép sử dụng để thực hiện và sử dụng sản phẩm của hợp đồng.<span class=\"th\" data-t=\"ภาระผูกพันในการรักษาความลับมีผลต่อเนื่อง 【03】 ปี หลังสัญญาเลิกหรือสิ้นผลบังคับ สิทธิในทรัพย์สินทางปัญญาในเอกสาร แบบ และซอฟต์แวร์ของแต่ละฝ่ายไม่โอนให้กัน เว้นแต่ขอบเขตที่ได้รับอนุญาตให้ใช้เพื่อปฏิบัติตามสัญญาและใช้ผลิตภัณฑ์ของสัญญา\"></span></p><p class=\"lv1\"><span class=\"lb\">16.3</span>Khi xử lý dữ liệu cá nhân của người lao động, đại diện, đầu mối của Bên kia, mỗi Bên tuân thủ pháp luật về bảo vệ dữ liệu cá nhân (Nghị định 13/2023/NĐ-CP và văn bản thay thế, sửa đổi nếu có), chỉ xử lý trong phạm vi cần thiết cho hợp đồng.<span class=\"th\" data-t=\"เมื่อประมวลผลข้อมูลส่วนบุคคลของลูกจ้าง ผู้แทน และผู้ประสานงานของอีกฝ่าย แต่ละฝ่ายต้องปฏิบัติตามกฎหมายว่าด้วยการคุ้มครองข้อมูลส่วนบุคคล (พระราชกฤษฎีกา ฉบับที่ 13/2023/NĐ-CP และเอกสารที่ใช้แทนหรือแก้ไขเพิ่มเติม หากมี) และประมวลผลเฉพาะในขอบเขตที่จำเป็นสำหรับสัญญา\"></span></p><h3 class=\"art\" data-n=\"17\"><strong>ĐIỀU 17. TUÂN THỦ PHÁP LUẬT, CHỐNG HỐI LỘ VÀ XUNG ĐỘT LỢI ÍCH</strong><span class=\"th\" data-t=\"ข้อ 17. การปฏิบัติตามกฎหมาย การต่อต้านการให้สินบน และความขัดแย้งทางผลประโยชน์\"></span></h3><p class=\"lv1\"><span class=\"lb\">17.1</span>Các Bên tuân thủ pháp luật Việt Nam về thuế, hóa đơn, lao động, môi trường, an toàn, cạnh tranh và phòng chống tham nhũng, hối lộ.<span class=\"th\" data-t=\"ทั้งสองฝ่ายปฏิบัติตามกฎหมายเวียดนามว่าด้วยภาษี ใบกำกับภาษี แรงงาน สิ่งแวดล้อม ความปลอดภัย การแข่งขัน และการป้องกันและต่อต้านการทุจริตและการให้สินบน\"></span></p><p class=\"lv1\"><span class=\"lb\">17.2</span>Không bên nào được đưa, đề nghị, nhận tiền, quà tặng hoặc lợi ích bất chính cho hoặc từ nhân sự của Bên kia, khách hàng hoặc bên thứ ba để có lợi thế trong hợp đồng; vi phạm là vi phạm nghiêm trọng, Bên bị vi phạm có quyền chấm dứt hợp đồng ngay bằng văn bản.<span class=\"th\" data-t=\"ห้ามฝ่ายใดให้ เสนอ หรือรับเงิน ของขวัญ หรือผลประโยชน์ที่มิชอบ แก่หรือจากบุคลากรของอีกฝ่าย ลูกค้า หรือบุคคลที่สาม เพื่อให้ได้เปรียบในสัญญา; การฝ่าฝืนถือเป็นการผิดสัญญาอย่างร้ายแรง ฝ่ายที่ถูกละเมิดมีสิทธิเลิกสัญญาทันทีโดยหนังสือเป็นลายลักษณ์อักษร\"></span></p><p class=\"lv1\"><span class=\"lb\">17.3</span>Mỗi Bên thông báo ngay cho Bên kia khi có xung đột lợi ích thực tế hoặc tiềm ẩn liên quan đến người tham gia ký kế
