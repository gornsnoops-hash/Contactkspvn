นเสร็จตรงตามกำหนดการและคุณภาพ ฝ่าย A อาจพิจารณาให้สิทธิพิจารณาก่อนในโอกาสโครงการถัดไป ทั้งนี้ ไม่ก่อให้เกิดหน้าที่ในการมอบงานหรือคำมั่นให้รางวัลเป็นเงินสด เว้นแต่ภาคผนวก 06 จะกำหนดไว้เป็นการเฉพาะ\"></span></p><p>9.2. Nguyên tắc phạt vi phạm Hợp đồng<span class=\"th\" data-t=\"9.2. หลักการค่าปรับตามสัญญา\"></span></p><p class=\"lv0\"><span class=\"lb\">a)</span>9.2.1. Chậm nộp kế hoạch tiến độ bắt buộc: Nếu Bên B không gửi tiến độ theo Điều 3 trong thời hạn <strong><span class=\"fx\" data-k=\"03\"></span></strong> ngày làm việc kể từ thông báo nhắc nhở, Bên B chịu phạt <strong><span class=\"fx\" data-k=\"TỶ LỆ %\"></span></strong>% giá trị PHẦN NGHĨA VỤ CUNG CẤP HỒ SƠ BỊ VI PHẠM theo cách xác định tại Phụ lục 06; không mặc nhiên áp dụng tỷ lệ trên toàn bộ Giá Hợp đồng. Nếu kéo dài quá <strong><span class=\"fx\" data-k=\"15\"></span></strong> ngày và cấu thành vi phạm trọng yếu, Bên A có quyền xử lý theo Điều 8.<span class=\"th\" data-t=\"9.2.1. ส่งแผนกำหนดการที่บังคับล่าช้า: หากฝ่าย B ไม่ส่งกำหนดการตามข้อ 3 ภายใน 【03】 วันทำการนับแต่ได้รับหนังสือเตือน ฝ่าย B ต้องชำระค่าปรับ 【TỶ LỆ %】 % ของมูลค่า PHẦN NGHĨA VỤ CUNG CẤP HỒ SƠ BỊ VI PHẠM (ส่วนของหน้าที่ในการจัดส่งเอกสารที่ถูกฝ่าฝืน) ตามวิธีการกำหนดในภาคผนวก 06 ไม่ใช้อัตราดังกล่าวกับราคาสัญญาทั้งหมดโดยปริยาย หากล่าช้าเกิน 【15】 วันและเข้าลักษณะเป็นการผิดสัญญาในสาระสำคัญ ฝ่าย A มีสิทธิดำเนินการตามข้อ 8\"></span></p><p class=\"lv0\"><span class=\"lb\">b)</span>9.2.2. Chậm tiến độ giai đoạn/hoàn thành: Bên B chịu phạt <strong><span class=\"fx\" data-k=\"0,10\"></span></strong>%/ngày tính trên GIÁ TRỊ PHẦN CÔNG VIỆC BỊ CHẬM được xác định trong BOQ/Phụ lục 03 và thời gian chậm do lỗi Bên B đã được xác nhận. Tổng khoản phạt đối với việc chậm của cùng phần nghĩa vụ không vượt quá GIỚI HẠN CỘNG DỒN tại khoản 9.2.8. Nếu Bên B khắc phục hoàn toàn chậm tiến độ giai đoạn trước mốc hoàn thành chung và không gây thiệt hại, khoản phạt giai đoạn được xem xét điều chỉnh theo Phụ lục 06.<span class=\"th\" data-t=\"9.2.2 ล่าช้าตามกำหนดการระยะ/การแล้วเสร็จ: ฝ่าย B ต้องชำระค่าปรับ 【0,10】 %/วัน คำนวณจากมูลค่าส่วนงานที่ล่าช้าซึ่งกำหนดไว้ใน BOQ/ภาคผนวก 03 และระยะเวลาล่าช้าที่เกิดจากความผิดของฝ่าย B ซึ่งได้รับการยืนยันแล้ว ยอดค่าปรับรวมสำหรับความล่าช้าของส่วนภาระผูกพันเดียวกันต้องไม่เกินเพดานสะสมตามวรรค 9.2.8 หากฝ่าย B แก้ไขความล่าช้าตามกำหนดการระยะได้ครบถ้วนก่อนถึงหลักไมล์แล้วเสร็จโดยรวม และไม่ก่อให้เกิดความเสียหาย ค่าปรับระยะนั้นจะได้รับการพิจารณาปรับตามภาคผนวก 06\"></span></p><p class=\"lv0\"><span class=\"lb\">c)</span>9.2.3. Không hoàn thành/không thực hiện công việc: Nếu Bên B không hoàn thành phần nghĩa vụ theo mốc chính sau thông báo và thời hạn khắc phục <strong><span class=\"fx\" data-k=\"SỐ NGÀY\"></span></strong>, Bên A có thể yêu cầu tiếp tục thực hiện, thuê đơn vị khác hoàn thành phần việc vi phạm hoặc chấm dứt theo Điều 8. Tiền phạt cho phần nghĩa vụ này là <strong><span class=\"fx\" data-k=\"TỶ LỆ %\"></span></strong>% giá trị phần nghĩa vụ bị vi phạm và được cộng vào tổng phạt theo 9.2.8; phần chênh lệch giá thuê thay thế hợp lý và thực tế được yêu cầu bồi thường theo Điều 15 với chứng từ chứng minh.<span class=\"th\" data-t=\"9.2.3. การไม่ทำงานให้แล้วเสร็จ/ไม่ปฏิบัติงาน: หากฝ่าย B ไม่ปฏิบัติภาระผูกพันส่วนที่ถึงกำหนดตามงวดงานหลักให้แล้วเสร็จ ภายหลังได้รับแจ้งและพ้นระยะเวลาแก้ไข 【SỐ NGÀY】 ฝ่าย A อาจเรียกให้ปฏิบัติต่อไป จ้างหน่วยงานอื่นทำงานส่วนที่ผิดสัญญาให้แล้วเสร็จ หรือเลิกสัญญาตามข้อ 8 ค่าปรับสำหรับภาระผูกพันส่วนนี้เท่ากับ 【TỶ LỆ %】 % ของมูลค่าภาระผูกพันส่วนที่ถูกละเมิด และให้นำไปรวมในค่าปรับรวมตามข้อ 9.2.8 ส่วนต่างของค่าจ้างทดแทนที่สมเหตุสมผลและเกิดขึ้นจริงสามารถเรียกให้ชดใช้ค่าเสียหายตามข้อ 15 โดยมีเอกสารหลักฐานพิสูจน์\"></span></p><p class=\"lv0\"><span class=\"lb\">d)</span>9.2.4. Sai chất lượng/kỹ thuật: Bên B phải bằng chi phí của mình sửa chữa, tháo dỡ, gia công, lắp đặt lại, thay thế hoặc thử nghiệm lại phần việc không đạt yêu cầu theo Điều 10. Nếu không khắc phục trong <strong><span class=\"fx\" data-k=\"SỐ NGÀY\"></span></strong> hoặc có vi phạm trọng yếu, Bên A được thuê thay thế theo Điều 8. Phạt vi phạm <strong><span class=\"fx\" data-k=\"TỶ LỆ %\"></span></strong>% giá trị phần nghĩa vụ chất lượng bị vi phạm, cộng dồn trong giới hạn 9.2.8; chi phí sửa chữa và thiệt hại thực tế được giải quyết riêng không tính trùng.<span class=\"th\" data-t=\"9.2.4. ข้อบกพร่องด้านคุณภาพ/เทคนิค: ฝ่าย B ต้องซ่อมแซม รื้อถอน ผลิต ติดตั้งใหม่ เปลี่ยนทดแทน หรือทดสอบใหม่ซึ่งงานที่ไม่ได้ตามข้อกำหนดตามข้อ 10 ด้วยค่าใช้จ่ายของตนเอง หากไม่แก้ไขภายใน 【SỐ NGÀY】 หรือมีการผิดสัญญาอย่างมีนัยสำคัญ ฝ่าย A มีสิทธิจ้างผู้อื่นทดแทนตามข้อ 8 ค่าปรับ 【TỶ LỆ %】 % ของมูลค่าภาระผูกพันด้านคุณภาพส่วนที่ถูกละเมิด สะสมได้ภายในขีดจำกัดตามข้อ 9.2.8 ค่าใช้จ่ายในการซ่อมแซมและค่าเสียหายที่เกิดขึ้นจริงให้พิจารณาแยกต่างหากโดยไม่คิดซ้ำซ้อน\"></span></p><p class=\"lv0\"><span class=\"lb\">e)</span>9.2.5. Tự ý ngừng thi công/bỏ dở/từ chối thực hiện/chấm dứt trái pháp luật: Phạt <strong><span class=\"fx\" data-k=\"TỶ LỆ %\"></span></strong>% giá trị PHẦN NGHĨA VỤ CHƯA THỰC HIỆN BỊ VI PHẠM, tính chung giới hạn 9.2.8; đồng thời Bên B hoàn trả tạm ứng chưa khấu trừ, bàn giao phần việc, vật tư đã thanh toán và bồi thường thiệt hại thực tế theo Điều 15. Không tính hai lần tiền phạt cho cùng hành vi ngừng thi công và chậm tiến độ trên cùng phần nghĩa vụ.<span class=\"th\" data-t=\"9.2.5. การหยุดก่อสร้างโดยพลการ/ละทิ้งงาน/ปฏิเสธการปฏิบัติ/เลิกสัญญาโดยผิดกฎหมาย: ค่าปรับ 【TỶ LỆ %】 % ของมูลค่าภาระผูกพันส่วนที่ยังไม่ได้ปฏิบัติซึ่งถูกละเมิด คิดรวมอยู่ในขีดจำกัดตามข้อ 9.2.8 พร้อมกันนี้ ฝ่าย B ต้องคืนเงินล่วงหน้าที่ยังไม่ได้หักชำระ ส่งมอบงาน วัสดุที่ได้ชำระเงินแล้ว และชดใช้ค่าเสียหายที่เกิดขึ้นจริงตามข้อ 15 ไม่คิดค่าปรับสองครั้งสำหรับการกระทำหยุดก่อสร้างและความล่าช้าของกำหนดการในภาระผูกพันส่วนเดียวกัน\"></span></p><p class=\"lv0\"><span class=\"lb\">f)</span>9.2.6. Cấu kiện/vật tư không đạt: Bên B sửa chữa hoặc thay thế và chịu mọi chi phí hợp lý. Phạt (nếu áp dụng) <strong><span class=\"fx\" data-k=\"TỶ LỆ %\"></span></strong>% giá trị cấu kiện/vật tư bị vi phạm trong giới hạn 9.2.8; không áp dụng mức tối thiểu cố định trên mỗi cấu kiện nếu làm vượt mức phạt theo luật.<span class=\"th\" data-t=\"9.2.6. ชิ้นส่วน/วัสดุที่ไม่ได้มาตรฐาน: ฝ่าย B ต้องซ่อมแซมหรือเปลี่ยนทดแทน และรับผิดชอบค่าใช้จ่ายที่สมเหตุสมผลทั้งหมด ค่าปรับ (หากมีการใช้บังคับ) 【TỶ LỆ %】 % ของมูลค่าชิ้นส่วน/วัสดุที่ถูกละเมิด ภายในขีดจำกัดตามข้อ 9.2.8 ไม่ใช้บังคับอัตราขั้นต่ำคงที่ต่อชิ้นส่วน หากทำให้เกินอัตราค่าปรับตามกฎหมาย\"></span></p><p class=\"lv0\"><span class=\"lb\">g)</span>9.2.7. Vi phạm HSE, PCCC, bảo mật, sử dụng nhà thầu phụ không được chấp thuận hoặc không bàn giao hồ sơ: Bên A lập biên bản, yêu cầu khắc phục và được dừng công việc nguy hiểm; các hành vi có căn cứ định giá phần nghĩa vụ bị vi phạm thì phạt theo <strong><span class=\"fx\" data-k=\"TỶ LỆ %\"></span></strong>% giá trị phần nghĩa vụ đó, nằm trong giới hạn 9.2.8. Không tự động quy định “tiền phạt hành chính” mà chỉ cơ quan nhà nước có thẩm quyền mới được áp dụng.<span class=\"th\" data-t=\"9.2.7. การละเมิดด้าน HSE การป้องกันและดับเพลิง การรักษาความลับ การใช้ผู้รับเหมาช่วงที่ไม่ได้รับความเห็นชอบ หรือการไม่ส่งมอบเอกสาร: ฝ่าย A จัดทำรายงาน เรียกให้แก้ไข และมีสิทธิหยุดงานที่เป็นอันตราย สำหรับการกระทำที่สามารถกำหนดมูลค่าภาระผูกพันส่วนที่ถูกละเมิดได้ ให้ปรับ 【TỶ LỆ %】 % ของมูลค่าภาระผูกพันส่วนนั้น ภายในขีดจำกัดตามข้อ 9.2.8 ไม่กำหนดโดยอัตโนมัติว่าเป็น “ค่าปรับทางปกครอง” ซึ่งมีเพียงหน่วยงานของรัฐที่มีอำนาจเท่านั้นที่ใช้บังคับได้\"></span></p><p class=\"lv0\"><span class=\"lb\">h)</span>9.2.8. GIỚI HẠN PHẠT CỘNG DỒN: Tổng mức phạt đối với MỘT HOẶC NHIỀU VI PHẠM không vượt quá mức luật bắt buộc áp dụng đối với phần nghĩa vụ bị vi phạm (đối với các quan hệ thuộc Điều 301 Luật Thương mại: không quá 8% giá trị phần nghĩa vụ bị vi phạm; đối với hợp đồng xây dựng thuộc dự án đầu tư công/PPP theo Điều 86 Luật Xây dựng 2025: không quá 12% giá trị phần hợp đồng bị vi phạm). Nếu có nhiều vi phạm cùng tác động đến một phần nghĩa vụ, không tính phạt trùng lặp trên cùng phần giá trị; Phụ lục 06 phải ghi rõ cách xác định phần nghĩa vụ và giới hạn.<span class=\"th\" data-t=\"9.2.8. ขีดจำกัดค่าปรับสะสม: ค่าปรับรวมสำหรับการละเมิดหนึ่งครั้งหรือหลายครั้งต้องไม่เกินอัตราที่กฎหมายบังคับใช้กับภาระผูกพันส่วนที่ถูกละเมิด (สำหรับความสัมพันธ์ตามมาตรา 301 แห่งกฎหมายการพาณิชย์: ไม่เกิน 8% ของมูลค่าภาระผูกพันส่วนที่ถูกละเมิด สำหรับสัญญาก่อสร้างของโครงการลงทุนภาครัฐ/PPP ตามมาตรา 86 แห่งกฎหมายการก่อสร้าง ค.ศ. 2025: ไม่เกิน 12% ของมูลค่าส่วนของสัญญาที่ถูกละเมิด) หากมีการละเมิดหลายครั้งที่กระทบต่อภาระผูกพันส่วนเดียวกัน ไม่คิดค่าปรับซ้ำซ้อนบนมูลค่าส่วนเดียวกัน ภาคผนวก 06 ต้องระบุวิธีกำหนดภาระผูกพันส่วนนั้นและขีดจำกัดอย่างชัดเจน\"></span></p><p class=\"lv0\"><span class=\"lb\">i)</span>9.2.9. Đối với các hành vi không lượng hóa được phần nghĩa vụ vi phạm, các Bên phải ghi rõ phương pháp định giá tại Phụ lục 06 trước khi ký; nếu không có cơ sở xác định hợp pháp, Bên A áp dụng yêu cầu khắc phục, bồi thường có chứng minh và quyền chấm dứt theo Hợp đồng thay vì tự ấn định tiền phạt.<span class=\"th\" data-t=\"9.2.9. สำหรับการกระทำที่ไม่สามารถกำหนดมูลค่าภาระผูกพันส่วนที่ถูกละเมิดเป็นตัวเลขได้ คู่สัญญาต้องระบุวิธีการประเมินมูลค่าไว้ในภาคผนวก 06 ก่อนลงนาม หากไม่มีเกณฑ์กำหนดที่ชอบด้วยกฎหมาย ฝ่าย A ใช้การเรียกให้แก้ไข การชดใช้ค่าเสียหายที่พิสูจน์ได้ และสิทธิเลิกสัญญาตามสัญญา แทนการกำหนดจำนวนค่าปรับเองโดยพลการ\"></span></p><p class=\"lv0\"><span class=\"lb\">j)</span>9.2.10. Thủ tục áp dụng phạt: Bên A thông báo mô tả hành vi, điều khoản vi phạm, căn cứ xác định giá trị phần nghĩa vụ, số ngày chậm, mức phạt và tài liệu chứng minh; Bên B phản hồi trong <strong><span class=\"fx\" data-k=\"05\"></span></strong> ngày làm việc. Việc khấu trừ chỉ thực hiện đối với khoản đến hạn, đủ căn cứ, theo Điều 5 và quyền tranh chấp của Bên B.<span class=\"th\" data-t=\"9.2.10. ขั้นตอนการใช้ค่าปรับ: ฝ่าย A แจ้งโดยระบุรายละเอียดการกระทำ ข้อสัญญาที่ถูกละเมิด หลักเกณฑ์กำหนดมูลค่าภาระผูกพันส่วนนั้น จำนวนวันที่ล่าช้า อัตราค่าปรับ และเอกสารหลักฐาน ฝ่าย B ตอบกลับภายใน 【05】 วันทำการ การหักชำระให้ทำได้เฉพาะจำนวนที่ถึงกำหนด มีหลักฐานเพียงพอ ตามข้อ 5 และภายใต้สิทธิโต้แย้งของฝ่าย B\"></span></p><p class=\"lv0\"><span class=\"lb\">k)</span>9.2.11. Khi Bên B khắc phục toàn bộ tiến độ trước ngày hoàn thành chung và không gây thiệt hại, Bên A có quyền xem xét miễn/giảm phạt giai đoạn bằng văn bản; không mặc nhiên xóa phạt đã phát sinh.<span class=\"th\" data-t=\"9.2.11. เมื่อฝ่าย B แก้ไขกำหนดการทั้งหมดได้ก่อนวันแล้วเสร็จโดยรวมและไม่ก่อให้เกิดความเสียหาย ฝ่าย A มีสิทธิพิจารณายกเว้น/ลดค่าปรับรายช่วงเป็นลายลักษณ์อักษร ทั้งนี้ ไม่ถือเป็นการยกเลิกค่าปรับที่เกิดขึ้นแล้วโดยปริยาย\"></span></p><p class=\"lv0\"><span class=\"lb\">l)</span>9.2.12. Phạt vi phạm không thay thế nghĩa vụ sửa lỗi, tiếp tục thực hiện, hoàn trả tạm ứng, bảo hành hoặc bồi thường thiệt hại thực tế khi luật và Hợp đồng cho phép. Các quyền này thuộc Bên bị vi phạm; không nhầm lẫn nghĩa vụ của Bên A và Bên B.<span class=\"th\" data-t=\"9.2.12. ค่าปรับตามสัญญาไม่ทดแทนภาระผูกพันในการแก้ไขข้อบกพร่อง การปฏิบัติต่อไป การคืนเงินล่วงหน้า การรับประกันผลงาน หรือการชดใช้ค่าเสียหายที่เกิดขึ้นจริง เมื่อกฎหมายและสัญญาอนุญาต สิทธิเหล่านี้เป็นของฝ่ายที่ถูกละเมิด ห้ามสับสนระหว่างภาระผูกพันของฝ่าย A และฝ่าย B\"></span></p><p>9.3. ĐỐI CHIẾU CHẾ TÀI VỚI HỢP ĐỒNG CHỦ ĐẦU TƯ: Chế tài ở hợp đồng khách hàng (ví dụ: đơn giá phạt theo ngày, theo tuần hoặc trần tỷ lệ khác nhau) chỉ là dữ liệu tham khảo để Bên A đánh giá rủi ro. Mức phạt áp dụng cho Bên B phải được ghi riêng tại Phụ lục 06, xác định đúng loại hợp đồng, nguồn vốn, phần nghĩa vụ bị vi phạm và giới hạn pháp luật. Không mặc nhiên chuyển toàn bộ tỷ lệ phạt trên tổng Giá hợp đồng khách hàng sang Bên B; không tính hai lần cho cùng một hành vi trên cùng phần nghĩa vụ. Trường hợp Bên A bị yêu cầu bồi thường từ Chủ đầu tư, khoản yêu cầu đối với Bên B được xem xét riêng theo Điều 15 và Điều 22, dựa trên nghĩa vụ đã chuyển giao, lỗi/hành vi, quan hệ nhân quả, hồ sơ thiệt hại thực tế và biện pháp giảm thiểu.<span class=\"th\" data-t=\"9.3 การเปรียบเทียบมาตรการลงโทษกับสัญญาของเจ้าของโครงการ: มาตรการลงโทษในสัญญาลูกค้า (เช่น อัตราค่าปรับรายวัน รายสัปดาห์ หรือเพดานอัตราร้อยละที่แตกต่างกัน) เป็นเพียงข้อมูลอ้างอิงเพื่อให้ฝ่าย A ประเมินความเสี่ยงเท่านั้น อัตราค่าปรับที่ใช้กับฝ่าย B ต้องระบุแยกไว้ในภาคผนวก 06 โดยกำหนดประเภทสัญญา แหล่งเงินทุน ส่วนภาระผูกพันที่ถูกฝ่าฝืน และข้อจำกัดตามกฎหมายให้ถูกต้อง ห้ามโอนอัตราค่าปรับทั้งหมดบนมูลค่าสัญญาลูกค้ารวมไปยังฝ่าย B โดยปริยาย ห้ามคิดสองครั้งสำหรับการกระทำเดียวกันบนส่วนภาระผูกพันเดียวกัน กรณีฝ่าย A ถูกเรียกร้องค่าชดใช้จากเจ้าของโครงการ ข้อเรียกร้องต่อฝ่าย B จะได้รับการพิจารณาแยกต่างหากตามข้อ 15 และข้อ 22 โดยอิงจากภาระผูกพันที่ส่งต่อ ความผิด/การกระทำ ความสัมพันธ์เชิงเหตุและผล เอกสารความเสียหายที่เกิดขึ้นจริง และมาตรการลดความเสียหาย\"></span></p><h3 class=\"art\" data-n=\"10\"><strong>ĐIỀU 10. NGHIỆM THU GIAI ĐOẠN, NGHIỆM THU QUYẾT TOÁN CÔNG TRÌNH</strong><span class=\"th\" data-t=\"ข้อ 10 การตรวจรับตามงวดงาน และการตรวจรับเพื่อชำระเงินขั้นสุดท้ายของงานก่อสร้าง\"></span></h3><p class=\"sub\">10.1 Thông báo nghiệm thu<span class=\"th\" data-t=\"10.1 การแจ้งการตรวจรับ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Sau khi hoàn thành từng giai đoạn công việc hoặc toàn bộ công trình, Bên B phải chủ động thông báo bằng văn bản cho Bên A ít nhất 02 ngày trước ngày đề xuất nghiệm thu để Bên A xem xét, bố trí lịch nghiệm thu phù hợp.<span class=\"th\" data-t=\"เมื่องานแต่ละงวดหรืองานก่อสร้างทั้งหมดแล้วเสร็จ ฝ่าย B ต้องแจ้งเป็นลายลักษณ์อักษรให้ฝ่าย A ทราบล่วงหน้าโดยเชิงรุกอย่างน้อย 02 วันก่อนวันที่เสนอให้ตรวจรับ เพื่อให้ฝ่าย A พิจารณาและจัดกำหนดการตรวจรับที่เหมาะสม\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A có trách nhiệm bố trí cán bộ nghiệm thu theo điều kiện thực tế thi công, tuy nhiên chỉ tổ chức nghiệm thu khi Bên B đã hoàn thiện đầy đủ hồ sơ, tài liệu, khối lượng đúng thực tế thi công và đạt yêu cầu kỹ thuật.<span class=\"th\" data-t=\"ฝ่าย A มีหน้าที่จัดเจ้าหน้าที่ตรวจรับตามสภาพการก่อสร้างจริง อย่างไรก็ตาม จะจัดการตรวจรับเฉพาะเมื่อฝ่าย B จัดทำเอกสาร หลักฐาน และปริมาณงานตามการก่อสร้างจริงครบถ้วนและได้ตามข้อกำหนดทางเทคนิคแล้วเท่านั้น\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B có trách nhiệm chuẩn bị các dụng cụ, thiết bị cần thiết để phục vụ kiểm tra trong quá trình nghiệm thu, nếu có yêu cầu từ Bên A. Các dụng cụ này phải còn hạn kiểm định và đảm bảo độ chính xác.<span class=\"th\" data-t=\"ฝ่าย B มีหน้าที่จัดเตรียมเครื่องมือ อุปกรณ์ที่จำเป็นเพื่อใช้ในการตรวจสอบระหว่างการตรวจรับ หากฝ่าย A มีคำขอ เครื่องมือเหล่านี้ต้องยังอยู่ในอายุการสอบเทียบและมีความแม่นยำ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B chỉ được tiếp tục thi công phần nhân công tiếp theo sau khi đã được Bên A nghiệm thu xác nhận đạt yêu cầu.Nếu Bên B tự ý làm tiếp khi chưa có nghiệm thu, Bên A có quyền yêu cầu tháo dỡ, không thanh toán và yêu cầu làm lại, mọi chi phí phát sinh do Bên B chịu.<span class=\"th\" data-t=\"ฝ่าย B จะดำเนินงานแรงงานในส่วนถัดไปต่อได้ก็ต่อเมื่อฝ่าย A ได้ตรวจรับและยืนยันว่าผ่านตามข้อกำหนดแล้วเท่านั้น หากฝ่าย B ดำเนินงานต่อโดยพลการทั้งที่ยังไม่มีการตรวจรับ ฝ่าย A มีสิทธิเรียกให้รื้อถอน ไม่ชำระเงิน และเรียกให้ทำใหม่ โดยค่าใช้จ่ายที่เกิดขึ้นทั้งหมดเป็นภาระของฝ่าย B\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Toàn bộ hồ sơ, biên bản nghiệm thu phải do Bên B tự lập, đầy đủ chữ ký của người đại diện theo yêu cầu và mẫu Bên A duyệt. Biên bản thiếu thông tin, không đúng mẫu hoặc không đúng thực tế thi công có thể bị Bên A từ chối nghiệm thu và yêu cầu lập lại.<span class=\"th\" data-t=\"เอกสารและรายงานการตรวจรับทั้งหมดต้องจัดทำโดยฝ่าย B เอง มีลายมือชื่อผู้แทนครบถ้วนตามที่กำหนดและตามแบบที่ฝ่าย A อนุมัติ รายงานที่ขาดข้อมูล ไม่ตรงแบบ หรือไม่ตรงกับการก่อสร้างจริง ฝ่าย A อาจปฏิเสธการตรวจรับและเรียกให้จัดทำใหม่\"></span></p><p class=\"sub\">10.2 Các bước nghiệm thu <span class=\"th\" data-t=\"10.2 ขั้นตอนการตรวจรับ\"></span></p><p class=\"lv0\"><span class=\"lb\">a)</span>Nghiệm thu chuyển bước <span class=\"th\" data-t=\"การตรวจรับเพื่อเปลี่ยนขั้นตอนงาน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Thành phần: Đại diện Bên A và Bên B.<span class=\"th\" data-t=\"องค์ประกอบ: ผู้แทนฝ่าย A และฝ่าย B\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A kiểm tra thực tế phần công việc  đã hoàn thành trước khi cho phép làm tiếp phần sau.<span class=\"th\" data-t=\"ฝ่าย A ตรวจสอบงานส่วนที่แล้วเสร็จตามสภาพจริงก่อนอนุญาตให้ทำงานส่วนถัดไปต่อ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Nếu chưa đạt yêu cầu mà Bên B vẫn tự làm tiếp, Bên A có quyền không chấp nhận kết quả và không thanh toán phần công việc  này.<span class=\"th\" data-t=\"หากยังไม่ได้ตามข้อกำหนดแต่ฝ่าย B ยังทำต่อโดยพลการ ฝ่าย A มีสิทธิไม่ยอมรับผลงานและไม่ชำระเงินสำหรับงานส่วนนี้\"></span></p><p>b)  Nghiệm thu khối lượng công việc, vật tư và thiết bị theo giai đoạn (phục vụ thanh toán) <span class=\"th\" data-t=\"b) การตรวจรับปริมาณงาน วัสดุ และอุปกรณ์ตามงวดงาน (เพื่อประกอบการชำระเงิน)\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Thành phần nghiệm thu: Đại diện Bên A và Bên B.<span class=\"th\" data-t=\"องค์ประกอบการตรวจรับ: ผู้แทนฝ่าย A และฝ่าย B\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B có trách nhiệm lập đầy đủ hồ sơ khối lượng thực tế đã thực hiện theo đúng nội dung và quy cách, gửi Bên A kiểm tra mẫu trước khi sử dụng chính thức, đảm bảo phù hợp với quy định tại  Điều 5, Điều 10 và các phụ lục liên quan của Hợp đồng.<span class=\"th\" data-t=\"ฝ่าย B มีหน้าที่จัดทำเอกสารปริมาณงานที่ปฏิบัติจริงให้ครบถ้วนตรงตามเนื้อหาและรูปแบบ ส่งให้ฝ่าย A ตรวจสอบตัวอย่างก่อนใช้จริง เพื่อให้สอดคล้องกับที่กำหนดในข้อ 5 ข้อ 10 และภาคผนวกที่เกี่ยวข้องของสัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Hồ sơ nghiệm thu bắt buộc phải có đầy đủ chữ ký xác nhận của đại diện kỹ thuật công trình do Bên A chỉ định. Biên bản chưa đủ chữ ký, hoặc lập sai, thiếu nội dung theo yêu cầu của  Điều 5, Điều 10 và các phụ lục liên quan, sẽ bị từ chối nghiệm thu.<span class=\"th\" data-t=\"เอกสารการตรวจรับต้องมีลายมือชื่อรับรองครบถ้วนของผู้แทนด้านเทคนิคของโครงการที่ฝ่าย A กำหนด รายงานที่ลายมือชื่อไม่ครบ หรือจัดทำผิด หรือขาดเนื้อหาตามที่ข้อ 5 ข้อ 10 และภาคผนวกที่เกี่ยวข้องกำหนด จะถูกปฏิเสธการตรวจรับ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A có toàn quyền kiểm tra, đo kiểm thực tế tại hiện trường để xác nhận khối lượng công việc  đã hoàn thành, làm cơ sở nghiệm thu và thanh toán.<span class=\"th\" data-t=\"ฝ่าย A มีอำนาจเต็มในการตรวจสอบและวัดตรวจจริง ณ สถานที่ก่อสร้างเพื่อยืนยันปริมาณงานที่แล้วเสร็จ เป็นหลักในการตรวจรับและชำระเงิน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Sau khi hoàn thiện đầy đủ hồ sơ và được đại diện công trình ký xác nhận, Bên B có trách nhiệm gửi toàn bộ hồ sơ gốc về văn phòng của Bên A đúng thời hạn quy định, chậm trễ do lỗi của Bên B và chậm nộp hồ sơ do lỗi Bên B không phải căn cứ để gia hạn tiến độ hoặc quy trách nhiệm chậm thanh toán cho Bên A <span class=\"th\" data-t=\"เมื่อจัดทำเอกสารครบถ้วนและผู้แทนโครงการลงนามรับรองแล้ว ฝ่าย B มีหน้าที่ส่งเอกสารต้นฉบับทั้งหมดไปยังสำนักงานของฝ่าย A ภายในกำหนดเวลา ความล่าช้าอันเกิดจากความผิดของฝ่าย B และการส่งเอกสารล่าช้าอันเกิดจากความผิดของฝ่าย B ไม่เป็นเหตุขยายกำหนดการหรือเป็นเหตุให้ฝ่าย A ต้องรับผิดในการชำระเงินล่าช้า\"></span></p><p>10.3. Việc nghiệm thu được thực hiện theo Hợp đồng, hồ sơ kỹ thuật được phê duyệt và tiêu chuẩn áp dụng cho từng hạng mục, bao gồm các tiêu chí phù hợp như khối lượng, kích thước, dung sai, công suất, tải thử, độ kín, thời gian chạy thử, điều kiện thử và hồ sơ liên quan. Trong vòng 03 ngày làm việc kể từ khi nhận được yêu cầu nghiệm thu kèm đầy đủ hồ sơ hợp lệ của Bên B, Bên A phải kiểm tra và phản hồi bằng văn bản về việc tổ chức nghiệm thu hoặc yêu cầu bổ sung, khắc phục, nêu rõ lý do. Việc Bên A chưa phản hồi không được coi là chấp thuận nghiệm thu. Kết quả nghiệm thu phải được lập thành biên bản có chữ ký của đại diện có thẩm quyền của hai bên<span class=\"th\" data-t=\"10.3. การตรวจรับให้ดำเนินการตามสัญญา เอกสารทางเทคนิคที่ได้รับอนุมัติ และมาตรฐานที่ใช้บังคับสำหรับแต่ละรายการงาน ซึ่งรวมถึงเกณฑ์ที่เหมาะสม เช่น ปริมาณงาน ขนาด ค่าความคลาดเคลื่อน กำลังการผลิต/ความจุ การทดสอบรับน้ำหนัก ความแน่นหนา/ปราศจากการรั่ว ระยะเวลาทดสอบเดินเครื่อง เงื่อนไขการทดสอบ และเอกสารที่เกี่ยวข้อง ภายใน 03 วันทำการนับแต่ได้รับคำขอตรวจรับพร้อมเอกสารที่ถูกต้องครบถ้วนของฝ่าย B ฝ่าย A ต้องตรวจสอบและตอบกลับเป็นลายลักษณ์อักษรเกี่ยวกับการจัดการตรวจรับ หรือขอให้เพิ่มเติม/แก้ไข โดยระบุเหตุผลอย่างชัดเจน การที่ฝ่าย A ยังไม่ตอบกลับไม่ถือว่าเป็นการยอมรับการตรวจรับ ผลการตรวจรับต้องจัดทำเป็นรายงานที่มีลายมือชื่อของผู้แทนผู้มีอำนาจของทั้งสองฝ่าย\"></span></p><p><br/>10.4. Khi nghiệm thu, hai bên lập danh mục các tồn đọng, xác định mức độ ảnh hưởng đến an toàn, chất lượng, chức năng sử dụng, trách nhiệm và thời hạn khắc phục. Công trình hoặc hạng mục chỉ được bàn giao đưa vào sử dụng khi đáp ứng các điều kiện theo Hợp đồng và pháp luật áp dụng. Chỉ những tồn đọng nhỏ không ảnh hưởng đến an toàn, chất lượng và khả năng vận hành, sử dụng mới được xem xét để lại khi bàn giao và phải được Bên A chấp thuận bằng văn bản. Hai bên phải xác nhận thời hạn khắc phục và khoản tiền giữ lại tương ứng trước khi bàn giao. Việc thanh toán, kiểm tra, nghiệm thu hoặc đưa vào sử dụng không miễn trừ trách nhiệm của Bên B đối với các lỗi tiềm ẩn thuộc phạm vi trách nhiệm của mình.<span class=\"th\" data-t=\"10.4. เมื่อทำการตรวจรับ ทั้งสองฝ่ายจัดทำรายการงานค้างแก้ไข กำหนดระดับผลกระทบต่อความปลอดภัย คุณภาพ ประโยชน์ใช้สอย ความรับผิดชอบ และกำหนดเวลาแก้ไข โครงการหรือรายการงานจะส่งมอบเพื่อนำไปใช้งานได้ต่อเมื่อเป็นไปตามเงื่อนไขของสัญญาและกฎหมายที่ใช้บังคับ เฉพาะงานค้างเล็กน้อยที่ไม่กระทบต่อความปลอดภัย คุณภาพ และความสามารถในการใช้งานเท่านั้นที่จะได้รับการพิจารณาให้คงไว้เมื่อส่งมอบ และต้องได้รับความยินยอมเป็นลายลักษณ์อักษรจากฝ่าย A ทั้งสองฝ่ายต้องยืนยันกำหนดเวลาแก้ไขและจำนวนเงินประกันผลงานที่กักไว้ที่สอดคล้องก่อนการส่งมอบ การชำระเงิน การตรวจสอบ การตรวจรับ หรือการนำไปใช้งาน ไม่ปลดเปลื้องความรับผิดของฝ่าย B ต่อข้อบกพร่องแฝงที่อยู่ในขอบเขตความรับผิดของตน\"></span></p><p>10.5. ĐỐI CHIẾU NGHIỆM THU TỪ CHỦ ĐẦU TƯ: Bên A thống nhất với Bên B tiêu chí nghiệm thu, mẫu biên bản, người ký, thời gian thử nghiệm và danh mục hồ sơ tại Phụ lục 01, 03, 04 trước khi triển khai. Việc nghiệm thu giữa KSP và Bên B là quan hệ độc lập; yêu cầu của chủ đầu tư chỉ ràng buộc Bên B nếu đã chuyển giao rõ. Nếu chủ đầu tư từ chối nghiệm thu vì lỗi thuộc phần việc Bên B, Bên B phải khắc phục theo Điều 10/12; nếu do công việc của bên khác hoặc nguyên nhân không thuộc Bên B, hai Bên xác định trách nhiệm và biện pháp khắc phục riêng, không tự động hoãn toàn bộ thanh toán phần không tranh chấp.<span class=\"th\" data-t=\"10.5. การเทียบเคียงการตรวจรับจากเจ้าของโครงการ: ฝ่าย A ตกลงกับฝ่าย B เกี่ยวกับเกณฑ์การตรวจรับ แบบรายงาน ผู้ลงนาม ระยะเวลาทดสอบ และรายการเอกสารตามภาคผนวก 01, 03, 04 ก่อนเริ่มดำเนินการ การตรวจรับระหว่าง KSP และฝ่าย B เป็นความสัมพันธ์ที่เป็นอิสระต่างหาก ข้อกำหนดของเจ้าของโครงการผูกพันฝ่าย B ก็ต่อเมื่อได้ถ่ายทอดให้ทราบอย่างชัดเจนแล้ว หากเจ้าของโครงการปฏิเสธการตรวจรับเพราะข้อบกพร่องที่เป็นของงานในส่วนฝ่าย B ฝ่าย B ต้องแก้ไขตามข้อ 10/12 หากเกิดจากงานของฝ่ายอื่นหรือสาเหตุที่ไม่ใช่ความรับผิดของฝ่าย B ทั้งสองฝ่ายจะกำหนดความรับผิดและมาตรการแก้ไขแยกต่างหาก และจะไม่ระงับการชำระเงินทั้งหมดในส่วนที่ไม่มีข้อพิพาทโดยอัตโนมัติ\"></span></p><h3 class=\"art\" data-n=\"11\">ĐIỀU 11. YÊU CẦU VỀ VẬT TƯ, VẬT LIỆU ĐẦU VÀO VÀ MÁY MÓC THI CÔNG<span class=\"th\" data-t=\"ข้อ 11 ข้อกำหนดเกี่ยวกับวัสดุ วัตถุดิบนำเข้า และเครื่องจักรก่อสร้าง\"></span></h3><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trường hợp Bên B được Bên A giao nhiệm vụ cung ứng vật tư, vật liệu, Bên B phải chịu hoàn toàn trách nhiệm cung cấp đúng chủng loại, chất lượng theo đúng yêu cầu kỹ thuật và đúng cam kết của Bên A với Chủ đầu tư.<span class=\"th\" data-t=\"ในกรณีที่ฝ่าย B ได้รับมอบหมายจากฝ่าย A ให้จัดหาวัสดุ วัตถุดิบ ฝ่าย B ต้องรับผิดชอบโดยสมบูรณ์ในการจัดหาให้ถูกต้องตามประเภท คุณภาพตามข้อกำหนดทางเทคนิค และตามที่ฝ่าย A ได้ให้คำมั่นไว้กับเจ้าของโครงการ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B có trách nhiệm cung cấp đầy đủ hồ sơ chất lượng, biên bản thí nghiệm, mẫu vật tư, vật liệu đầu vào theo đúng yêu cầu và biểu mẫu của Bên A, kể cả khi vật tư do Bên A cấp, nếu có yêu cầu kiểm tra, phối hợp.<span class=\"th\" data-t=\"ฝ่าย B มีหน้าที่จัดหาเอกสารคุณภาพ รายงานการทดสอบ ตัวอย่างวัสดุ วัตถุดิบนำเข้าให้ครบถ้วนตามข้อกำหนดและแบบฟอร์มของฝ่าย A รวมถึงกรณีที่วัสดุฝ่าย A เป็นผู้จัดหา หากมีคำขอให้ตรวจสอบ/ประสานงาน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trước khi đưa bất kỳ vật tư, vật liệu nào vào sử dụng, Bên B phải tuân thủ trình tự, thủ tục nghiệm thu theo hướng dẫn của Bên A. Chỉ khi có văn bản nghiệm thu đạt yêu cầu của Bên A, Bên B mới được phép đưa vào thi công.<span class=\"th\" data-t=\"ก่อนนำวัสดุ วัตถุดิบใดๆ ไปใช้งาน ฝ่าย B ต้องปฏิบัติตามลำดับขั้นตอนและวิธีการตรวจรับตามคำแนะนำของฝ่าย A ต่อเมื่อมีหนังสือตรวจรับว่าได้ตามข้อกำหนดจากฝ่าย A แล้ว ฝ่าย B จึงจะได้รับอนุญาตให้นำไปก่อสร้าง\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Chi phí thí nghiệm mẫu vật tư, vật liệu đầu vào do Bên B chịu, áp dụng cho tất cả các loại vật tư, vật liệu do Bên B cung cấp.<span class=\"th\" data-t=\"ค่าใช้จ่ายในการทดสอบตัวอย่างวัสดุ วัตถุดิบนำเข้าเป็นภาระของฝ่าย B ใช้กับวัสดุ วัตถุดิบทุกประเภทที่ฝ่าย B จัดหา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Phòng thí nghiệm được sử dụng để thí nghiệm vật tư, vật liệu phải do Bên A chỉ định hoặc chấp thuận bằng văn bản.<span class=\"th\" data-t=\"ห้องปฏิบัติการที่ใช้ทดสอบวัสดุ วัตถุดิบต้องเป็นแห่งที่ฝ่าย A กำหนดหรือให้ความเห็นชอบเป็นลายลักษณ์อักษร\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Thành phần nghiệm thu vật tư, vật liệu đầu vào gồm đại diện Bên A và Bên B, biên bản nghiệm thu phải có đầy đủ chữ ký của Bên A mới có giá trị.<span class=\"th\" data-t=\"องค์ประกอบการตรวจรับวัสดุ วัตถุดิบนำเข้า ประกอบด้วยผู้แทนฝ่าย A และฝ่าย B รายงานการตรวจรับต้องมีลายมือชื่อของฝ่าย A ครบถ้วนจึงจะมีผล\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A có quyền kiểm tra vật tư, máy móc, thiết bị của Bên B tại nơi sản xuất, nơi khai thác hoặc tại công trường bất kỳ thời điểm nào mà không cần báo trước. Bên B có trách nhiệm tạo mọi điều kiện để Bên A thực hiện việc này.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิตรวจสอบวัสดุ เครื่องจักร อุปกรณ์ของฝ่าย B ณ แหล่งผลิต แหล่งขุดหา หรือที่สถานที่ก่อสร้างได้ทุกเวลาโดยไม่ต้องแจ้งล่วงหน้า ฝ่าย B มีหน้าที่อำนวยความสะดวกทุกประการให้ฝ่าย A ดำเนินการดังกล่าว\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B phải bố trí nhân sự, thiết bị, phương tiện phục vụ cho việc kiểm tra theo yêu cầu của Bên A. Mọi chi phí phát sinh do việc không bố trí hoặc chậm trễ sẽ do Bên B chịu.<span class=\"th\" data-t=\"ฝ่าย B ต้องจัดบุคลากร อุปกรณ์ ยานพาหนะเพื่อรองรับการตรวจสอบตามที่ฝ่าย A ร้องขอ ค่าใช้จ่ายทั้งหมดที่เกิดขึ้นจากการไม่จัดหรือจัดล่าช้าเป็นภาระของฝ่าย B\"></span></p><p>Hồ sơ chất lượng phải hợp lệ, nhất quán và truy xuất được nguồn gốc, chủng loại, lô hàng và vật tư thực tế giao cho dự án. CO/CQ, chứng chỉ thử nghiệm có thể đứng tên nhà sản xuất, nhà nhập khẩu hoặc đơn vị phát hành có thẩm quyền phù hợp. Bên B cung cấp tài liệu liên kết với lô hàng cung cấp cho KSP; Bên A không từ chối hồ sơ chỉ vì chứng từ không đứng tên Bên B nếu đã có đủ căn cứ chứng minh nguồn gốc và sự phù hợp của lô hàng. Bên A có quyền yêu cầu bổ sung, xác minh hoặc từ chối hồ sơ, vật tư, vật liệu nếu không đáp ứng yêu cầu của Hợp đồng hoặc không đủ căn cứ đối chiếu với hàng thực tế. Bên B chịu chi phí khắc phục, thay thế và các chi phí phát sinh do lỗi của mình<span class=\"th\" data-t=\"เอกสารคุณภาพต้องถูกต้อง สอดคล้อง และสามารถตรวจสอบย้อนกลับถึงแหล่งกำเนิด ประเภท ล็อตสินค้า และวัสดุที่ส่งมอบจริงให้โครงการ CO/CQ และใบรับรองการทดสอบอาจออกในนามผู้ผลิต ผู้นำเข้า หรือหน่วยงานผู้ออกที่มีอำนาจตามความเหมาะสม ฝ่าย B จัดหาเอกสารที่เชื่อมโยงกับล็อตสินค้าที่จัดส่งให้ KSP ฝ่าย A จะไม่ปฏิเสธเอกสารเพียงเพราะเอกสารไม่ได้ออกในนามฝ่าย B หากมีหลักฐานเพียงพอพิสูจน์แหล่งกำเนิดและความสอดคล้องของล็อตสินค้า ฝ่าย A มีสิทธิเรียกให้เพิ่มเติม ตรวจสอบยืนยัน หรือปฏิเสธเอกสาร วัสดุ วัตถุดิบ หากไม่เป็นไปตามข้อกำหนดของสัญญาหรือไม่มีหลักฐานเพียงพอในการเทียบกับสินค้าจริง ฝ่าย B รับผิดชอบค่าใช้จ่ายในการแก้ไข เปลี่ยนทดแทน และค่าใช้จ่ายอื่นที่เกิดขึ้นจากความผิดของตน\"></span></p><p>11.10. Bên B phải gửi hồ sơ CO/CQ, nhật ký, kết quả thí nghiệm và biên bản nghiệm thu phù hợp để KSP đáp ứng nghĩa vụ với Chủ đầu tư theo Phụ lục 04; việc chủ đầu tư từ chối nghiệm thu do lỗi Bên B là căn cứ yêu cầu sửa chữa nhưng phải có hồ sơ, tiêu chí kỹ thuật cụ thể.<span class=\"th\" data-t=\"11.10. ฝ่าย B ต้องส่งเอกสาร CO/CQ สมุดบันทึกงาน ผลการทดสอบ และรายงานการตรวจรับที่เหมาะสม เพื่อให้ KSP ปฏิบัติตามภาระผูกพันต่อเจ้าของโครงการตามภาคผนวก 04 การที่เจ้าของโครงการปฏิเสธการตรวจรับเนื่องจากความผิดของฝ่าย B เป็นเหตุให้เรียกให้แก้ไขได้ แต่ต้องมีเอกสารและเกณฑ์ทางเทคนิคที่เฉพาะเจาะจง\"></span></p><h3 class=\"art\" data-n=\"12\">ĐIỀU 12. BẢO HÀNH CÔNG TRÌNH<span class=\"th\" data-t=\"ข้อ 12 การรับประกันผลงานก่อสร้าง\"></span></h3><p>12.1. Bên B bảo hành phần việc của mình trong <span class=\"fx\" data-k=\"SỐ THÁNG BẢO HÀNH\"></span> tháng kể từ ngày nghiệm thu, bàn giao hợp lệ. Đối với phần nghĩa vụ bảo hành tương ứng với hợp đồng chủ đầu tư đã được cung cấp và ký tại Phụ lục 04, thời điểm bắt đầu, thời hạn và ngày kết thúc bảo hành được xác định cụ thể để bảo đảm KSP có quyền yêu cầu Bên B khắc phục trong suốt thời gian KSP chịu trách nhiệm về phần việc đó. Trường hợp chưa đến mốc bắt đầu theo chủ đầu tư, Bên B tiếp tục bảo quản và sửa sai sót thuộc trách nhiệm mình từ khi bàn giao cho KSP; thời gian chờ tối đa <span class=\"fx\" data-k=\"SỐ THÁNG CHỜ\"></span> tháng kể từ ngày bàn giao cho KSP, trừ chậm trễ do Bên B gây ra hoặc thỏa thuận khác bằng văn bản. Hết thời gian chờ không do lỗi Bên B, thời hạn bảo hành bắt đầu; việc kéo dài để đồng bộ với chủ đầu tư phải được hai Bên thống nhất trước khi hết hạn. Phần sửa chữa/thay thế được bảo hành lại trong <span class=\"fx\" data-k=\"SỐ THÁNG\"></span> tháng từ nghiệm thu sửa chữa hoặc đến hết thời hạn bảo hành ban đầu, tùy thời điểm nào muộn hơn, phù hợp pháp luật. Bảo lãnh hoặc tiền giữ lại phải bao phủ thời gian bảo hành đã thỏa thuận và thời gian dự phòng theo Điều 5.<span class=\"th\" data-t=\"12.1. ฝ่าย B รับประกันผลงานในส่วนของตนเป็นเวลา 【SỐ THÁNG BẢO HÀNH】 เดือน นับจากวันที่ตรวจรับและส่งมอบโดยชอบ สำหรับภาระผูกพันการรับประกันในส่วนที่สอดคล้องกับสัญญากับเจ้าของโครงการที่ได้รับมอบและลงนามไว้ในภาคผนวก 04 ให้กำหนดวันเริ่มต้น ระยะเวลา และวันสิ้นสุดของการรับประกันอย่างเฉพาะเจาะจง เพื่อให้มั่นใจว่า KSP มีสิทธิเรียกให้ฝ่าย B แก้ไขได้ตลอดระยะเวลาที่ KSP ต้องรับผิดชอบงานในส่วนนั้น ในกรณีที่ยังไม่ถึงวันเริ่มต้นตามที่กำหนดกับเจ้าของโครงการ ฝ่าย B ยังคงต้องดูแลรักษาและแก้ไขข้อบกพร่องที่อยู่ในความรับผิดชอบของตนนับแต่ส่งมอบให้ KSP โดยมีระยะเวลารอสูงสุด 【SỐ THÁNG CHỜ】 เดือน นับจากวันส่งมอบให้ KSP เว้นแต่ความล่าช้าที่เกิดจากฝ่าย B หรือมีข้อตกลงอื่นเป็นลายลักษณ์อักษร เมื่อพ้นระยะเวลารอโดยมิใช่ความผิดของฝ่าย B ระยะเวลารับประกันจึงเริ่มต้น การขยายระยะเวลาเพื่อให้สอดคล้องกับเจ้าของโครงการต้องได้รับความเห็นชอบจากทั้งสองฝ่ายก่อนครบกำหนด ส่วนที่ซ่อมแซม/เปลี่ยนใหม่ได้รับการรับประกันใหม่เป็นเวลา 【SỐ THÁNG】 เดือน นับจากการตรวจรับงานซ่อมแซม หรือจนครบระยะเวลารับประกันเดิม แล้วแต่กรณีใดจะสิ้นสุดช้ากว่า ทั้งนี้ตามที่กฎหมายกำหนด หนังสือค้ำประกันหรือเงินประกันผลงานที่กักไว้ต้องครอบคลุมระยะเวลารับประกันที่ตกลงกันและระยะเวลาสำรองตามข้อ 5\"></span></p><p>12.2. Bên B bảo hành bằng chi phí của mình đối với sai sót thuộc trách nhiệm Bên B trong toàn bộ phần công việc, vật tư, thiết bị do Bên B cung cấp, gia công, thi công hoặc lắp đặt, gồm chi phí kiểm tra, tháo dỡ, vận chuyển, thay thế, lắp lại và thử nghiệm cần thiết. Với vật tư KSP cấp, Bên B chịu trách nhiệm về bảo quản, thi công và cảnh báo sai sót có thể nhận biết hợp lý; lỗi nội tại không do Bên B gây ra được phân định theo chứng cứ và Hợp đồng. Bảo hành của nhà sản xuất không thay thế nghĩa vụ bảo hành của Bên B đối với KSP.<span class=\"th\" data-t=\"12.2. ฝ่าย B รับประกันด้วยค่าใช้จ่ายของตนเองสำหรับข้อบกพร่องที่เป็นความรับผิดของฝ่าย B ในงาน วัสดุ และอุปกรณ์ทั้งหมดที่ฝ่าย B จัดหา ผลิต ก่อสร้าง หรือติดตั้ง รวมถึงค่าตรวจสอบ ค่ารื้อถอน ค่าขนส่ง ค่าเปลี่ยนทดแทน ค่าติดตั้งใหม่ และค่าทดสอบที่จำเป็น สำหรับวัสดุที่ KSP เป็นผู้จัดหาให้ ฝ่าย B รับผิดชอบการเก็บรักษา การดำเนินงาน และการแจ้งเตือนข้อบกพร่องที่สามารถสังเกตเห็นได้โดยสมเหตุสมผล ส่วนข้อบกพร่องในตัววัสดุเองที่ฝ่าย B มิได้เป็นผู้ก่อให้เกิดให้พิจารณาแยกตามพยานหลักฐานและสัญญา การรับประกันของผู้ผลิตไม่ใช่การทดแทนภาระผูกพันการรับประกันของฝ่าย B ต่อ KSP\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>12.3. Trong thời gian bảo hành, Bên B phản hồi sự cố khẩn cấp trong <strong><span class=\"fx\" data-k=\"GIỜ\"></span></strong> giờ, lỗi thông thường trong <strong><span class=\"fx\" data-k=\"NGÀY\"></span></strong> ngày và phải có biện pháp khắc phục được Bên A chấp thuận. Nếu không thực hiện đúng hạn sau thông báo hợp lệ, Bên A được thuê đơn vị khác sửa chữa với chi phí hợp lý, có chứng từ và bù trừ theo Điều 5/15. Việc bảo lãnh bảo hành thực hiện theo Phụ lục 06.<span class=\"th\" data-t=\"12.3. ในระหว่างระยะเวลารับประกัน ฝ่าย B ต้องตอบสนองต่อเหตุฉุกเฉินภายใน 【GIỜ】 ชั่วโมง ข้อบกพร่องทั่วไปภายใน 【NGÀY】 วัน และต้องมีมาตรการแก้ไขที่ฝ่าย A เห็นชอบ หากไม่ดำเนินการภายในกำหนดหลังจากได้รับแจ้งโดยชอบ ฝ่าย A มีสิทธิว่าจ้างหน่วยงานอื่นมาซ่อมแซมด้วยค่าใช้จ่ายที่สมเหตุสมผล มีเอกสารหลักฐาน และหักกลบลบหนี้ตามข้อ 5/15 การค้ำประกันการรับประกันให้เป็นไปตามภาคผนวก 06\"></span></p><p>12.4. Bên B phải có mặt, thực hiện biện pháp xử lý tạm thời và hoàn thành sửa chữa trong thời hạn tương ứng với mức độ sự cố quy định tại Phụ lục 06. Khi có nguy cơ khẩn cấp đối với người hoặc tài sản, Bên A được thực hiện ngay biện pháp cần thiết, thông báo cho Bên B sớm nhất có thể và lưu chứng cứ; chi phí được phân bổ theo trách nhiệm của mỗi Bên và thiệt hại thực tế. Tiền giữ lại bảo hành được giải tỏa trong (15) ngày làm việc kể từ khi hết thời hạn bảo hành, Bên B hoàn tất khắc phục và hai Bên đối chiếu các khoản khấu trừ hợp lệ. Bảo lãnh bảo hành được giải tỏa theo điều kiện đã thỏa thuận.<span class=\"th\" data-t=\"12.4. ฝ่าย B ต้องเข้าปฏิบัติงาน ดำเนินมาตรการแก้ไขชั่วคราว และซ่อมแซมให้แล้วเสร็จภายในระยะเวลาที่สอดคล้องกับระดับความรุนแรงของเหตุตามที่กำหนดในภาคผนวก 06 เมื่อมีความเสี่ยงฉุกเฉินต่อบุคคลหรือทรัพย์สิน ฝ่าย A มีสิทธิดำเนินมาตรการที่จำเป็นได้ทันที แจ้งให้ฝ่าย B ทราบโดยเร็วที่สุดเท่าที่จะทำได้ และเก็บรักษาพยานหลักฐาน โดยค่าใช้จ่ายจะแบ่งตามความรับผิดของแต่ละฝ่ายและความเสียหายที่เกิดขึ้นจริง เงินประกันผลงานที่กักไว้เพื่อการรับประกันจะได้รับการปลดภายใน (15) วันทำการ นับจากสิ้นสุดระยะเวลารับประกัน ฝ่าย B แก้ไขข้อบกพร่องเสร็จสิ้น และทั้งสองฝ่ายได้เทียบยอดรายการหักที่ชอบแล้ว หนังสือค้ำประกันการรับประกันจะได้รับการปลดตามเงื่อนไขที่ตกลงกัน\"></span></p><p>12.5. KHỚP THỜI HẠN BẢO HÀNH: Phụ lục 04 xác định rõ (i) thời điểm Bên B bàn giao KSP; (ii) thời điểm Chủ đầu tư nghiệm thu; (iii) thời hạn bảo hành mà KSP chịu với Chủ đầu tư; (iv) ngày bắt đầu/kết thúc bảo hành giữa KSP và Bên B; (v) thời gian chờ tối đa hợp lý khi chủ đầu tư nghiệm thu chậm không do lỗi Bên B; (vi) thời hạn phản hồi, có mặt, sửa lỗi, và thời gian bảo hành lại phần sửa chữa. Không tự động áp dụng thời hạn 12 tháng, bảo lãnh 10% hoặc phản hồi trong 24 giờ của hợp đồng mẫu khách hàng cho mọi gói thầu; chỉ lựa chọn khi phù hợp nghĩa vụ KSP, loại công việc và pháp luật. Bảo lãnh/tiền giữ lại phải có hiệu lực phủ đủ thời hạn nghĩa vụ đã thỏa thuận và thời gian yêu cầu thanh toán theo Điều 21.<span class=\"th\" data-t=\"12.5. การจัดระยะเวลารับประกันให้สอดคล้องกัน: ภาคผนวก 04 กำหนดอย่างชัดเจน (i) เวลาที่ฝ่าย B ส่งมอบให้ KSP; (ii) เวลาที่เจ้าของโครงการตรวจรับ; (iii) ระยะเวลารับประกันที่ KSP มีต่อเจ้าของโครงการ; (iv) วันเริ่มต้น/สิ้นสุดการรับประกันระหว่าง KSP กับฝ่าย B; (v) ระยะเวลารอสูงสุดที่สมเหตุสมผลเมื่อเจ้าของโครงการตรวจรับล่าช้าโดยมิใช่ความผิดของฝ่าย B; (vi) ระยะเวลาในการตอบสนอง เข้าปฏิบัติงาน แก้ไขข้อบกพร่อง และระยะเวลารับประกันใหม่ของส่วนที่ซ่อมแซม ไม่นำระยะเวลา 12 เดือน หนังสือค้ำประกัน 10% หรือการตอบสนองภายใน 24 ชั่วโมงตามสัญญามาตรฐานของลูกค้ามาใช้โดยอัตโนมัติกับทุกชุดงานประมูล โดยเลือกใช้เฉพาะเมื่อเหมาะสมกับภาระผูกพันของ KSP ประเภทงาน และกฎหมาย หนังสือค้ำประกัน/เงินประกันผลงานที่กักไว้ต้องมีผลบังคับครอบคลุมระยะเวลาของภาระผูกพันที่ตกลงกันและระยะเวลาในการเรียกร้องการชำระเงินตามข้อ 21\"></span></p><h3 class=\"art\" data-n=\"13\">ĐIỀU 13. TRÁCH NHIỆM CỦA BÊN B ĐỐI VỚI NHÀ THẦU PHỤ VÀ NHÂN SỰ THUÊ NGOÀI<span class=\"th\" data-t=\"ข้อ 13 ความรับผิดของฝ่าย B ต่อผู้รับเหมาช่วงและบุคลากรที่จ้างจากภายนอก\"></span></h3><p class=\"lv0 bl\"><span class=\"lb\">•</span>Trường hợp Bên B sử dụng nhà thầu phụ để thực hiện bất kỳ phần công việc nào mà Bên B không đủ năng lực hoặc không có chức năng thực hiện, Bên B bắt buộc phải báo cáo và chỉ được triển khai sau khi được Bên A phê duyệt bằng văn bản.<span class=\"th\" data-t=\"ในกรณีที่ฝ่าย B ใช้ผู้รับเหมาช่วงในการดำเนินงานส่วนใดที่ฝ่าย B ไม่มีความสามารถเพียงพอหรือไม่มีหน้าที่ดำเนินการ ฝ่าย B ต้องรายงานและจะดำเนินการได้ก็ต่อเมื่อได้รับการอนุมัติเป็นลายลักษณ์อักษรจากฝ่าย A แล้วเท่านั้น\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B không được giao thầu phụ toàn bộ Hợp đồng; mức giới hạn giao thầu phụ <strong><span class=\"fx\" data-k=\"% / PHẠM VI\"></span></strong> phải được lựa chọn theo thực tế, năng lực và yêu cầu chủ đầu tư và phải được Bên A chấp thuận trước bằng văn bản. Vi phạm trọng yếu về nhà thầu phụ được xử lý theo Điều 8 và 9.<span class=\"th\" data-t=\"ฝ่าย B ต้องไม่ให้ผู้รับเหมาช่วงรับงานตามสัญญาทั้งหมด ขีดจำกัดการจ้างช่วง 【% / PHẠM VI】 ต้องเลือกให้สอดคล้องกับสภาพจริง ความสามารถ และข้อกำหนดของเจ้าของโครงการ และต้องได้รับความเห็นชอบล่วงหน้าเป็นลายลักษณ์อักษรจากฝ่าย A การละเมิดอย่างมีนัยสำคัญเกี่ยวกับผู้รับเหมาช่วงให้ดำเนินการตามข้อ 8 และ 9\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B hoàn toàn chịu trách nhiệm về toàn bộ hành vi, lỗi kỹ thuật, sai sót hoặc vi phạm của các nhà thầu phụ, cá nhân, tổ chức do mình thuê, bao gồm cả các tổn thất, vi phạm hợp đồng, vi phạm pháp luật và ảnh hưởng tiêu cực đến công trình, môi trường hoặc cộng đồng dân cư xung quanh.<span class=\"th\" data-t=\"ฝ่าย B ต้องรับผิดชอบโดยสมบูรณ์ต่อการกระทำ ข้อบกพร่องทางเทคนิค ข้อผิดพลาด หรือการละเมิดของผู้รับเหมาช่วง บุคคล และองค์กรที่ตนว่าจ้างทั้งหมด รวมถึงความสูญเสีย การผิดสัญญา การฝ่าฝืนกฎหมาย และผลกระทบเชิงลบต่อโครงการ สิ่งแวดล้อม หรือชุมชนโดยรอบ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B phải chịu hoàn toàn trách nhiệm về an toàn lao động, bảo hiểm, điều kiện làm việc của các tổ chức, cá nhân do mình thuê, kể cả trong trường hợp phát sinh tai nạn, rủi ro hoặc sự cố tại công trường.<span class=\"th\" data-t=\"ฝ่าย B ต้องรับผิดชอบโดยสมบูรณ์ในเรื่องความปลอดภัยในการทำงาน การประกันภัย และสภาพการทำงานของบุคคลและองค์กรที่ตนว่าจ้าง รวมถึงกรณีเกิดอุบัติเหตุ ความเสี่ยง หรือเหตุขัดข้องที่สถานที่ก่อสร้าง\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B chịu trách nhiệm theo pháp luật đối với hành vi trái pháp luật của nhà thầu phụ và nhân sự của mình thuộc phạm vi kiểm soát; Điều này không miễn trừ trách nhiệm pháp lý bắt buộc của Bên A nếu Bên A có lỗi hoặc pháp luật quy định.<span class=\"th\" data-t=\"ฝ่าย B รับผิดตามกฎหมายต่อการกระทำที่ผิดกฎหมายของผู้รับเหมาช่วงและบุคลากรของตนที่อยู่ในขอบเขตที่ตนควบคุม ข้อนี้ไม่ปลดเปลื้องความรับผิดทางกฎหมายที่เป็นข้อบังคับของฝ่าย A หากฝ่าย A มีความผิดหรือกฎหมายกำหนด\"></span></p><h3 class=\"art\" data-n=\"14\">ĐIỀU 14. AN TOÀN LAO ĐỘNG, PHÒNG CHỐNG CHÁY NỔ, VỆ SINH MÔI TRƯỜNG<span class=\"th\" data-t=\"ข้อ 14 ความปลอดภัยในการทำงาน การป้องกันอัคคีภัยและการระเบิด สุขอนามัยสิ่งแวดล้อม\"></span></h3><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B có trách nhiệm thu gom, dọn dẹp toàn bộ rác thải phát sinh trong quá trình thi công hàng ngày và tập kết đúng nơi quy định. Việc vận chuyển phế thải ra khỏi công trường phải được thực hiện định kỳ mỗi tháng hoặc theo yêu cầu của Bên A.<span class=\"th\" data-t=\"ฝ่าย B มีหน้าที่เก็บรวบรวมและทำความสะอาดขยะทั้งหมดที่เกิดขึ้นในระหว่างการก่อสร้างทุกวัน และนำไปรวบรวมไว้ ณ จุดที่กำหนด การขนย้ายเศษวัสดุเหลือทิ้งออกจากสถานที่ก่อสร้างต้องดำเนินการเป็นระยะทุกเดือนหรือตามที่ฝ่าย A ร้องขอ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Nếu Bên B không đảm bảo vệ sinh hiện trường, Bên A có quyền thuê đơn vị khác dọn dẹp thay và toàn bộ chi phí sẽ do Bên B chịu.<span class=\"th\" data-t=\"หากฝ่าย B ไม่รักษาความสะอาดของสถานที่ก่อสร้าง ฝ่าย A มีสิทธิจ้างหน่วยงานอื่นมาทำความสะอาดแทน และค่าใช้จ่ายทั้งหมดเป็นภาระของฝ่าย B\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B tự trang bị đầy đủ phương tiện, thiết bị, dụng cụ bảo hộ lao động, an toàn thi công và chịu hoàn toàn trách nhiệm về an toàn lao động, phòng chống cháy nổ và bảo vệ môi trường trong suốt quá trình thi công.<span class=\"th\" data-t=\"ฝ่าย B จัดหาพาหนะ อุปกรณ์ เครื่องมือ และอุปกรณ์ป้องกันอันตรายส่วนบุคคลสำหรับแรงงาน รวมถึงอุปกรณ์ความปลอดภัยในการก่อสร้างให้ครบถ้วนด้วยตนเอง และรับผิดชอบแต่เพียงฝ่ายเดียวต่อความปลอดภัยในการทำงาน การป้องกันอัคคีภัยและการระเบิด และการคุ้มครองสิ่งแวดล้อมตลอดระยะเวลาการก่อสร้าง\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Tai nạn lao động, tổn thất tài sản hoặc sự cố an toàn do lỗi của Bên B hoặc nhân sự Bên B được xử lý theo pháp luật, bảo hiểm và Điều 15. Không loại trừ trách nhiệm pháp luật bắt buộc của Bên A trong mọi trường hợp.<span class=\"th\" data-t=\"อุบัติเหตุจากการทำงาน ความสูญเสียทรัพย์สิน หรือเหตุการณ์ด้านความปลอดภัยที่เกิดจากความผิดของฝ่าย B หรือบุคลากรของฝ่าย B ให้ดำเนินการตามกฎหมาย การประกันภัย และข้อ 15 ทั้งนี้ ไม่เป็นการยกเว้นความรับผิดตามกฎหมายที่เป็นข้อบังคับของฝ่าย A ไม่ว่ากรณีใด ๆ\"></span></p><p>14.5. Việc áp dụng hình thức xử phạt hợp đồng về HSE (nếu có) phải được mô tả rõ phần nghĩa vụ bị vi phạm và tuân thủ giới hạn phạt tại Điều 9; phạt hành chính của cơ quan nhà nước không phải là phạt hợp đồng và không được gộp nhầm khi tính chế tài.<span class=\"th\" data-t=\"14.5. การใช้มาตรการลงโทษตามสัญญาเกี่ยวกับ HSE (ถ้ามี) ต้องระบุอย่างชัดเจนถึงภาระหน้าที่ที่ถูกละเมิด และต้องเป็นไปตามเพดานค่าปรับตามข้อ 9 ค่าปรับทางปกครองของหน่วยงานของรัฐไม่ใช่ค่าปรับตามสัญญา และต้องไม่นำมารวมโดยผิดพลาดในการคำนวณมาตรการลงโทษ\"></span></p><h3 class=\"art\" data-n=\"15\">ĐIỀU 15. BỒI THƯỜNG THIỆT HẠI<span class=\"th\" data-t=\"ข้อ 15 การชดใช้ค่าเสียหาย\"></span></h3><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B phải chịu hoàn toàn trách nhiệm và bồi thường mọi thiệt hại, tổn thất và chi phí phát sinh đối với Bên A trong các trường hợp sau :<span class=\"th\" data-t=\"ฝ่าย B ต้องรับผิดชอบแต่เพียงฝ่ายเดียวและชดใช้ความเสียหาย ความสูญเสีย และค่าใช้จ่ายทั้งหมดที่เกิดขึ้นแก่ฝ่าย A ในกรณีดังต่อไปนี้\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Tổn hại về sức khỏe, tính mạng, tai nạn lao động hoặc bệnh nghề nghiệp của bất kỳ cá nhân nào, xảy ra trong hoặc liên quan đến quá trình thi công, hoàn thành công trình, sửa chữa sai sót, nếu nguyên nhân xuất phát từ lỗi, hành vi, thiết bị, hoặc nhân sự của Bên B.<span class=\"th\" data-t=\"ความเสียหายต่อสุขภาพ ชีวิต อุบัติเหตุจากการทำงาน หรือโรคจากการประกอบอาชีพของบุคคลใด ๆ ที่เกิดขึ้นในระหว่างหรือเกี่ยวเนื่องกับการก่อสร้าง การทำให้งานก่อสร้างแล้วเสร็จ การแก้ไขข้อบกพร่อง หากสาเหตุมาจากความผิด การกระทำ อุปกรณ์ หรือบุคลากรของฝ่าย B\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Mất mát, hư hỏng tài sản (không bao gồm phần công trình) của Bên A hoặc bên thứ ba trong hoặc ngoài phạm vi công trường, do lỗi hoặc bất cẩn của Bên B<span class=\"th\" data-t=\"การสูญหาย ความเสียหายของทรัพย์สิน (ไม่รวมส่วนของงานก่อสร้าง) ของฝ่าย A หรือบุคคลที่สาม ทั้งภายในหรือภายนอกขอบเขตของสถานที่ก่อสร้าง อันเกิดจากความผิดหรือความประมาทของฝ่าย B\"></span></p><p class=\"lv2 bl\"><span class=\"lb\">•</span>Mỗi Bên chịu trách nhiệm đối với thiệt hại do lỗi hoặc vi phạm của mình theo quy định pháp luật; không miễn trừ toàn bộ trách nhiệm của Bên A chỉ vì Bên A không cố ý hoặc không có sơ suất nghiêm trọng.<span class=\"th\" data-t=\"แต่ละฝ่ายต้องรับผิดต่อความเสียหายที่เกิดจากความผิดหรือการละเมิดของตนตามบทบัญญัติของกฎหมาย ฝ่าย A ไม่ได้รับการยกเว้นความรับผิดทั้งหมดเพียงเพราะฝ่าย A ไม่ได้กระทำโดยเจตนาหรือไม่ได้ประมาทเลินเล่ออย่างร้ายแรง\"></span></p><p>15.4. Bồi thường thiệt hại được yêu cầu trên cơ sở thiệt hại thực tế, trực tiếp, có căn cứ chứng minh, quan hệ nhân quả và nghĩa vụ hạn chế tổn thất. Phần chênh lệch hợp lý khi thuê nhà thầu thay thế, chi phí khắc phục và trách nhiệm được chủ đầu tư yêu cầu hợp lệ do lỗi Bên B được xem xét theo Phụ lục 04; không chuyển giao tự động mọi chế tài của chủ đầu tư cho Bên B.<span class=\"th\" data-t=\"15.4. การชดใช้ค่าเสียหายเรียกร้องได้บนพื้นฐานของความเสียหายที่เกิดขึ้นจริงและโดยตรง มีหลักฐานพิสูจน์ได้ มีความสัมพันธ์เชิงเหตุและผล และมีหน้าที่บรรเทาความเสียหาย ส่วนต่างที่สมเหตุสมผลจากการว่าจ้างผู้รับเหมารายใหม่ ค่าใช้จ่ายในการแก้ไข และความรับผิดที่เจ้าของโครงการเรียกร้องโดยชอบอันเกิดจากความผิดของฝ่าย B จะได้รับการพิจารณาตามภาคผนวก 04 ทั้งนี้ไม่ถ่ายโอนมาตรการลงโทษทุกประการของเจ้าของโครงการให้ฝ่าย B โดยอัตโนมัติ\"></span></p><p>15.5. THIỆT HẠI PHÁT SINH TỪ YÊU CẦU CHỦ ĐẦU TƯ: KSP chỉ yêu cầu Bên B hoàn trả chi phí/thiệt hại liên quan đến khiếu nại, khấu trừ hoặc yêu cầu từ Chủ đầu tư trong phạm vi nghĩa vụ đã chuyển giao tại Phụ lục 04 mà Bên B vi phạm và có quan hệ nhân quả. Bên A phải cung cấp tài liệu phù hợp chứng minh căn cứ, giá trị, biện pháp giảm thiểu, tình trạng giải quyết khiếu nại và không yêu cầu trùng với khoản phạt/chi phí đã thu hồi. Bên B được phối hợp giải trình và khắc phục; việc khách hàng tuyên bố một con số thiệt hại không tự động là khoản nợ cuối cùng của Bên B. Quy định này không loại trừ trách nhiệm bắt buộc theo pháp luật.<span class=\"th\" data-t=\"15.5. ความเสียหายที่เกิดจากข้อเรียกร้องของเจ้าของโครงการ: KSP จะเรียกให้ฝ่าย B ชดใช้ค่าใช้จ่าย/ความเสียหายที่เกี่ยวข้องกับข้อร้องเรียน การหักเงิน หรือข้อเรียกร้องจากเจ้าของโครงการ เฉพาะภายในขอบเขตของภาระผูกพันที่ถ่ายทอดไว้ในภาคผนวก 04 ซึ่งฝ่าย B ฝ่าฝืนและมีความสัมพันธ์เชิงเหตุและผล ฝ่าย A ต้องจัดหาเอกสารที่เหมาะสมเพื่อพิสูจน์ที่มา มูลค่า มาตรการบรรเทา สถานะการแก้ไขข้อร้องเรียน และจะไม่เรียกร้องซ้ำซ้อนกับค่าปรับ/ค่าใช้จ่ายที่ได้รับคืนแล้ว ฝ่าย B มีสิทธิร่วมชี้แจงและแก้ไข การที่ลูกค้าแจ้งตัวเลขความเสียหายใดไม่ถือเป็นหนี้สุดท้ายของฝ่าย B โดยอัตโนมัติ ข้อกำหนดนี้ไม่ตัดความรับผิดที่เป็นข้อบังคับตามกฎหมาย\"></span></p><h3 class=\"art\" data-n=\"16\">ĐIỀU 16. TRƯỜNG HỢP BẤT KHẢ KHÁNG<span class=\"th\" data-t=\"ข้อ 16 เหตุสุดวิสัย\"></span></h3><p class=\"lv2 bl\"><span class=\"lb\">•</span>Bất khả kháng là sự kiện khách quan, không thể lường trước và không thể khắc phục dù đã áp dụng mọi biện pháp cần thiết trong khả năng cho phép theo pháp luật Việt Nam. Thiếu vốn, tăng giá thông thường hoặc thiếu nhân công do quản lý không đương nhiên là bất khả kháng.<span class=\"th\" data-t=\"เหตุสุดวิสัยคือเหตุการณ์ที่เกิดขึ้นโดยปรากฏชัดตามวัตถุวิสัย ไม่อาจคาดหมายล่วงหน้าได้ และไม่อาจแก้ไขได้แม้จะได้ใช้มาตรการที่จำเป็นทั้งปวงตามความสามารถที่กฎหมายเวียดนามอนุญาตแล้ว การขาดเงินทุน ราคาที่เพิ่มขึ้นตามปกติ หรือการขาดแคลนแรงงานอันเกิดจากการบริหารจัดการ ไม่ถือเป็นเหตุสุดวิสัยโดยอัตโนมัติ\"></span></p><p class=\"lv2 bl\"><span class=\"lb\">•</span>Bên bị ảnh hưởng thông báo bằng văn bản trong <strong><span class=\"fx\" data-k=\"SỐ NGÀY\"></span></strong> ngày từ khi có thể thông báo, cung cấp bằng chứng hợp lý và thực hiện biện pháp giảm thiểu thiệt hại. Giấy xác nhận cơ quan có thẩm quyền được nộp nếu pháp luật yêu cầu hoặc có thể thu thập hợp lý.<span class=\"th\" data-t=\"ฝ่ายที่ได้รับผลกระทบต้องแจ้งเป็นหนังสือภายใน 【SỐ NGÀY】 วัน นับแต่เมื่อสามารถแจ้งได้ ให้หลักฐานที่สมเหตุสมผล และดำเนินมาตรการบรรเทาความเสียหาย ใบรับรองของหน่วยงานที่มีอำนาจให้ยื่นหากกฎหมายกำหนดหรือสามารถรวบรวมได้อย่างสมเหตุสมผล\"></span></p><p class=\"lv2 bl\"><span class=\"lb\">•</span>Trong phạm vi ảnh hưởng thực tế của sự kiện bất khả kháng, Bên bị ảnh hưởng có thể được miễn trách nhiệm theo pháp luật, nhưng vẫn phải thực hiện phần nghĩa vụ không bị ảnh hưởng, giảm thiểu thiệt hại và thông báo tiến độ mới. Nếu sự kiện kéo dài quá <strong><span class=\"fx\" data-k=\"SỐ NGÀY\"></span></strong> ngày, các Bên thương lượng tiếp tục, sửa đổi hoặc chấm dứt hợp đồng theo Điều 8 và pháp luật.<span class=\"th\" data-t=\"ภายในขอบเขตผลกระทบที่เกิดขึ้นจริงของเหตุสุดวิสัย ฝ่ายที่ได้รับผลกระทบอาจได้รับการยกเว้นความรับผิดตามกฎหมาย แต่ยังคงต้องปฏิบัติตามภาระหน้าที่ส่วนที่ไม่ได้รับผลกระทบ บรรเทาความเสียหาย และแจ้งกำหนดการใหม่ หากเหตุการณ์ยืดเยื้อเกินกว่า 【SỐ NGÀY】 วัน คู่สัญญาจะเจรจากันเพื่อดำเนินการต่อ แก้ไขเพิ่มเติม หรือยุติสัญญาตามข้อ 8 และกฎหมาย\"></span></p><p>Trường hợp phát sinh tranh chấp giữa các bên do sự kiện bất khả kháng xảy ra hoặc kéo dài thì tranh chấp sẽ được giải quyết theo quy định của pháp luật.<span class=\"th\" data-t=\"ในกรณีที่เกิดข้อพิพาทระหว่างคู่สัญญาอันเนื่องมาจากการเกิดขึ้นหรือการยืดเยื้อของเหตุสุดวิสัย ข้อพิพาทดังกล่าวจะได้รับการระงับตามบทบัญญัติของกฎหมาย\"></span></p><p>16.5. Các Bên lập biên bản ảnh hưởng đến tiến độ và bảo đảm an toàn công trường. Không Bên nào được miễn trách nhiệm đối với nghĩa vụ không bị ảnh hưởng bởi sự kiện bất khả kháng.<span class=\"th\" data-t=\"16.5. คู่สัญญาจัดทำรายงานผลกระทบต่อกำหนดการและรับรองความปลอดภัยของหน้างาน ไม่มีฝ่ายใดได้รับการยกเว้นความรับผิดสำหรับภาระหน้าที่ที่ไม่ได้รับผลกระทบจากเหตุสุดวิสัย\"></span></p><h3 class=\"art\" data-n=\"17\">ĐIỀU 17. QUYẾT TOÁN CÔNG TRÌNH VÀ THANH LÝ HỢP ĐỒNG<span class=\"th\" data-t=\"ข้อ 17 การสรุปยอดงานก่อสร้างและการชำระสะสางสัญญา\"></span></h3><p class=\"sub\">17.1 Điều kiện quyết toán: Việc quyết toán chỉ được thực hiện khi Bên B hoàn thành toàn bộ công việc theo hợp đồng và được Bên A nghiệm thu chấp thuận bằng biên bản.<span class=\"th\" data-t=\"17.1 เงื่อนไขการสรุปยอด: การสรุปยอดจะดำเนินการได้ก็ต่อเมื่อฝ่าย B ทำงานทั้งหมดตามสัญญาแล้วเสร็จ และฝ่าย A ได้ตรวจรับและให้ความเห็นชอบเป็นรายงาน\"></span></p><p class=\"lv1\"><span class=\"lb\">17.2</span> Nội dung quyết toán:<span class=\"th\" data-t=\"เนื้อหาการสรุปยอด:\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Khối lượng công việc đã thực hiện theo hợp đồng;<span class=\"th\" data-t=\"ปริมาณงานที่ได้ดำเนินการตามสัญญา;\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Khối lượng phát sinh tăng/giảm (nếu có) được quyết toán theo văn bản phê duyệt hợp lệ của các Bên và Điều 20 của Hợp đồng, bao gồm cơ chế xử lý công việc khẩn cấp tại khoản 20.3 <span class=\"th\" data-t=\"ปริมาณงานที่เกิดเพิ่มขึ้น/ลดลง (ถ้ามี) ให้สรุปยอดตามเอกสารอนุมัติที่ชอบของคู่สัญญาและข้อ 20 ของสัญญา รวมถึงกลไกการจัดการงานเร่งด่วนตามข้อย่อย 20.3\"></span></p><p>17.3. Thanh lý hợp đồng được thực hiện trong vòng <strong><span class=\"fx\" data-k=\"30\"></span></strong> ngày làm việc kể từ khi hồ sơ quyết toán hợp lệ, các khoản không tranh chấp được xác nhận và xuất đủ hóa đơn đúng quy định, trừ trường hợp pháp luật quy định khác. Nghĩa vụ bảo hành, bồi thường và giải quyết tranh chấp phát sinh trước ngày thanh lý vẫn tồn tại theo thỏa thuận và pháp luật.<span class=\"th\" data-t=\"17.3. การชำระสะสางสัญญาให้ดำเนินการภายใน 【30】 วันทำการ นับแต่เมื่อเอกสารสรุปยอดถูกต้องครบถ้วน รายการที่ไม่มีข้อพิพาทได้รับการยืนยัน และออกใบแจ้งหนี้/ใบกำกับภาษีครบถ้วนตามที่กำหนด เว้นแต่กฎหมายกำหนดไว้เป็นอย่างอื่น ภาระหน้าที่ในการรับประกัน การชดใช้ค่าเสียหาย และการระงับข้อพิพาทที่เกิดขึ้นก่อนวันชำระสะสางยังคงมีผลตามข้อตกลงและกฎหมาย\"></span></p><p>17.4. Nghĩa vụ bảo hành, bồi thường thiệt hại, hoàn trả tạm ứng còn thiếu, bảo mật và giải quyết tranh chấp tiếp tục có hiệu lực sau thanh lý/chấm dứt trong phạm vi theo Hợp đồng và pháp luật.<span class=\"th\" data-t=\"17.4. ภาระหน้าที่ในการรับประกันผลงาน การชดใช้ค่าเสียหาย การคืนเงินล่วงหน้าส่วนที่ขาด การรักษาความลับ และการระงับข้อพิพาท ยังคงมีผลบังคับต่อไปภายหลังการชำระสะสาง/การยุติสัญญา ภายในขอบเขตตามสัญญาและกฎหมาย\"></span></p><p>17.5. Trường hợp chấm dứt trước khi hoàn thành toàn bộ công việc, điều kiện hoàn thành toàn bộ tại khoản 17.1 không áp dụng cho quyết toán phần việc đã thực hiện hợp lệ. Bên B nộp hồ sơ trong (15) ngày làm việc từ ngày kiểm kê; Bên A phản hồi trong (10) ngày làm việc. Hai Bên đối chiếu khối lượng đạt yêu cầu, vật tư, tạm ứng và các khoản khấu trừ theo Điều 8; khoản không tranh chấp thanh toán trong (15) ngày làm việc từ khi đủ hồ sơ, không buộc chờ giải quyết toàn bộ tranh chấp.<span class=\"th\" data-t=\"17.5. ในกรณีที่มีการยุติสัญญาก่อนที่งานทั้งหมดจะแล้วเสร็จ เงื่อนไขการแล้วเสร็จทั้งหมดตามข้อย่อย 17.1 ไม่ใช้บังคับกับการสรุปยอดงานส่วนที่ได้ดำเนินการโดยชอบ ฝ่าย B ยื่นเอกสารภายใน (15) วันทำการนับจากวันตรวจนับ ฝ่าย A ตอบกลับภายใน (10) วันทำการ คู่สัญญาทั้งสองฝ่ายตรวจสอบเทียบปริมาณงานที่ได้มาตรฐาน วัสดุ เงินล่วงหน้า และรายการหักตามข้อ 8 รายการที่ไม่มีข้อพิพาทให้ชำระภายใน (15) วันทำการนับแต่เมื่อเอกสารครบถ้วน โดยไม่ต้องรอให้ข้อพิพาททั้งหมดได้รับการระงับ\"></span></p><h3 class=\"art\" data-n=\"18\">ĐIỀU 18. THÀNH PHẦN HỢP ĐỒNG<span class=\"th\" data-t=\"ข้อ 18 องค์ประกอบของสัญญา\"></span></h3><p>Hồ sơ Hợp đồng và thứ tự ưu tiên khi có mâu thuẫn: (1) Văn bản sửa đổi/phụ lục sửa đổi và Phiếu yêu cầu thay đổi/Variation Order (VO) theo Phụ lục 05 được các Bên ký hợp lệ, đúng thẩm quyền; văn bản ký sau được ưu tiên đối với nội dung được sửa đổi; (2) Văn bản Hợp đồng này; (3) Phụ lục 06 – Thông số thương mại/Chế tài; (4) Phụ lục 04 – Ma trận Back-to-Back được hai bên ký xác nhận; (5) Phụ lục 01 – BOQ/SOW/Bản vẽ được duyệt; (6) Phụ lục 03 – Tiến độ và nghiệm thu; (7) Phụ lục 02 – HSE và các tài liệu khác liệt kê rõ số hiệu, ngày, phiên bản. Không tự động dẫn chiếu toàn bộ hợp đồng chủ đầu tư chưa công bố.<span class=\"th\" data-t=\"เอกสารสัญญาและลำดับความสำคัญในกรณีขัดแย้งกัน: (1) เอกสารแก้ไข/ภาคผนวกแก้ไข และแบบฟอร์มขอเปลี่ยนแปลง/Variation Order (VO) ตามภาคผนวก 05 ที่คู่สัญญาลงนามโดยชอบและถูกต้องตามอำนาจ เอกสารที่ลงนามภายหลังมีความสำคัญเหนือกว่าสำหรับเนื้อหาที่ได้รับการแก้ไข; (2) ตัวสัญญาฉบับนี้; (3) ภาคผนวก 06 – พารามิเตอร์ทางการค้า/มาตรการลงโทษ; (4) ภาคผนวก 04 – เมทริกซ์ Back-to-Back ที่คู่สัญญาทั้งสองฝ่ายลงนามยืนยัน; (5) ภาคผนวก 01 – BOQ/SOW/แบบก่อสร้างที่ได้รับอนุมัติ; (6) ภาคผนวก 03 – กำหนดการและการตรวจรับ; (7) ภาคผนวก 02 – HSE และเอกสารอื่น ๆ ที่ระบุชัดเจนถึงเลขที่ วันที่ และฉบับ ไม่มีการอ้างอิงโดยอัตโนมัติถึงสัญญาของเจ้าของโครงการทั้งฉบับที่ยังไม่ได้เปิดเผย\"></span></p><p>Điều kiện riêng tại phụ lục được hai Bên ký hợp lệ và xác định rõ điều, khoản bị sửa đổi hoặc thay thế có giá trị ưu tiên áp dụng đối với nội dung đó. Tài liệu kỹ thuật mới chỉ thay thế phiên bản cũ khi được phê duyệt đúng thẩm quyền; mọi thay đổi chi phí hoặc tiến độ được xử lý theo Điều 20. Trường hợp có khác biệt với quy định bắt buộc của pháp luật, quy định bắt buộc của pháp luật được ưu tiên áp dụng.<span class=\"th\" data-t=\"เงื่อนไขเฉพาะในภาคผนวกที่คู่สัญญาทั้งสองฝ่ายลงนามโดยชอบและระบุชัดเจนถึงข้อและข้อย่อยที่ถูกแก้ไขหรือแทนที่ มีผลบังคับใช้เหนือกว่าสำหรับเนื้อหานั้น เอกสารทางเทคนิคฉบับใหม่จะแทนที่ฉบับเดิมได้ก็ต่อเมื่อได้รับอนุมัติโดยถูกต้องตามอำนาจ การเปลี่ยนแปลงค่าใช้จ่ายหรือกำหนดการทั้งหมดให้ดำเนินการตามข้อ 20 ในกรณีที่มีความแตกต่างจากบทบัญญัติที่เป็นข้อบังคับของกฎหมาย ให้บทบัญญัติที่เป็นข้อบังคับของกฎหมายมีผลบังคับใช้เหนือกว่า\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Văn bản hợp đồng, phụ lục sửa đổi được ký sau và Phụ lục 01 đến 06 được liệt kê rõ là bộ phận không tách rời;<span class=\"th\" data-t=\"ตัวสัญญา ภาคผนวกแก้ไขที่ลงนามภายหลัง และภาคผนวก 01 ถึง 06 ซึ่งระบุชัดเจนว่าเป็นส่วนหนึ่งที่แยกจากกันไม่ได้;\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Các bản vẽ, tiêu chuẩn, hồ sơ thầu và tài liệu khác có số hiệu, ngày, phiên bản được ghi trong Danh mục tài liệu Hợp đồng tại Phụ lục 01.<span class=\"th\" data-t=\"แบบก่อสร้าง มาตรฐาน เอกสารประกวดราคา และเอกสารอื่น ๆ ที่มีเลขที่ วันที่ ฉบับ ตามที่ระบุไว้ในรายการเอกสารสัญญาในภาคผนวก 01\"></span></p><p>Thông tin gửi hồ sơ <span class=\"th\" data-t=\"ข้อมูลการจัดส่งเอกสาร\"></span></p><p><strong>Nếu gửi cho Công Ty:</strong><span class=\"th\" data-t=\"กรณีส่งถึงบริษัท:\"></span></p><p>Người nhận : Hồng Như<span class=\"th\" data-t=\"ผู้รับ: Hồng Như\"></span></p><p>Công ty : TNHH KSP Việt Nam<span class=\"th\" data-t=\"บริษัท: TNHH KSP Việt Nam\"></span></p><p>Địa chỉ  : Lô M-3A-CN, Khu Công Nghiệp Mỹ Phước 2, Phường Bến Cát, Thành Phố Hồ Chí Minh, Việt Nam<span class=\"th\" data-t=\"ที่อยู่: Lô M-3A-CN, Khu Công Nghiệp Mỹ Phước 2, Phường Bến Cát, Thành Phố Hồ Chí Minh, เวียดนาม\"></span></p><p>Điện thoại : 0987896857<span class=\"th\" data-t=\"โทรศัพท์: 0987896857\"></span></p><p>Email  : Phannhu@ksp.com.vn <span class=\"th\" data-t=\"อีเมล: Phannhu@ksp.com.vn\"></span></p><p><strong>Nếu gửi cho Nhà Thầu</strong>:<span class=\"th\" data-t=\"กรณีส่งถึงผู้รับเหมา:\"></span></p><p>Người nhận: <strong><span class=\"fx\" data-k=\"HỌ TÊN ĐẦU MỐI NHÀ THẦU\"></span></strong><span class=\"th\" data-t=\"ผู้รับ: 【HỌ TÊN ĐẦU MỐI NHÀ THẦU】\"></span></p><p>Công ty: <strong><span class=\"fx\" data-k=\"TÊN NHÀ THẦU\"></span></strong><span class=\"th\" data-t=\"บริษัท: 【TÊN NHÀ THẦU】\"></span></p><p>Địa chỉ: <strong><span class=\"fx\" data-k=\"ĐỊA CHỈ LIÊN HỆ\"></span></strong><span class=\"th\" data-t=\"ที่อยู่: 【ĐỊA CHỈ LIÊN HỆ】\"></span></p><p>Điện thoại / Email: <strong><span class=\"fx\" data-k=\"SỐ ĐIỆN THOẠI / EMAIL\"></span></strong><span class=\"th\" data-t=\"โทรศัพท์ / อีเมล: 【SỐ ĐIỆN THOẠI / EMAIL】\"></span></p><p>18.4. Thông tin liên hệ có thể thay đổi bằng văn bản có xác nhận; thông báo chấm dứt, khiếu nại hoặc yêu cầu phạt phải được gửi đến địa chỉ/email được chỉ định để bảo đảm chứng cứ nhận.<span class=\"th\" data-t=\"18.4. ข้อมูลการติดต่ออาจเปลี่ยนแปลงได้โดยเป็นหนังสือที่มีการยืนยัน หนังสือบอกเลิก ข้อร้องเรียน หรือคำเรียกร้องค่าปรับ ต้องส่งไปยังที่อยู่/อีเมลที่กำหนดไว้ เพื่อให้มีหลักฐานการรับ\"></span></p><h3 class=\"art\" data-n=\"19\">ĐIỀU 19. ĐIỀU KHOẢN CHUNG<span class=\"th\" data-t=\"ข้อ 19 ข้อกำหนดทั่วไป\"></span></h3><p class=\"lv1 bl\"><span class=\"lb\">•</span>Hai bên cam kết tuân thủ đầy đủ và nghiêm túc tất cả các điều khoản trong Hợp đồng này. Mọi sửa đổi, bổ sung chỉ có giá trị khi được lập thành văn bản có chữ ký xác nhận của cả hai bên, và được xem là một phần không thể tách rời của Hợp đồng.<span class=\"th\" data-t=\"คู่สัญญาทั้งสองฝ่ายให้คำมั่นที่จะปฏิบัติตามข้อกำหนดทั้งหมดในสัญญาฉบับนี้อย่างครบถ้วนและเคร่งครัด การแก้ไขเพิ่มเติมใด ๆ จะมีผลก็ต่อเมื่อจัดทำเป็นหนังสือที่มีลายมือชื่อยืนยันของคู่สัญญาทั้งสองฝ่าย และถือเป็นส่วนหนึ่งที่แยกจากกันไม่ได้ของสัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Những nội dung không được quy định trong Hợp đồng này sẽ được áp dụng theo quy định pháp luật hiện hành của Việt Nam.<span class=\"th\" data-t=\"เนื้อหาที่มิได้กำหนดไว้ในสัญญาฉบับนี้ ให้บังคับตามบทบัญญัติของกฎหมายเวียดนามที่ใช้บังคับอยู่\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Mọi tranh chấp phát sinh từ Hợp đồng được ưu tiên giải quyết bằng thương lượng trong <strong><span class=\"fx\" data-k=\"15\"></span></strong> ngày làm việc; nếu không giải quyết được, tranh chấp được giải quyết tại <strong><span class=\"fx\" data-k=\"TÒA ÁN VIỆT NAM CÓ THẨM QUYỀN / TRỌNG TÀI VIAC (LỰA CHỌN VÀ CHỈ GHI MỘT)\"></span></strong> theo pháp luật áp dụng. Bản án/quyết định trọng tài có hiệu lực theo trình tự pháp luật; chi phí tố tụng theo quyết định có thẩm quyền và thỏa thuận hợp pháp của Các Bên.<span class=\"th\" data-t=\"ข้อพิพาทใด ๆ ที่เกิดจากสัญญาให้ระงับโดยการเจรจาเป็นลำดับแรกภายใน 【15】 วันทำการ หากไม่สามารถระงับได้ ให้ระงับข้อพิพาทที่ 【TÒA ÁN VIỆT NAM CÓ THẨM QUYỀN / TRỌNG TÀI VIAC (LỰA CHỌN VÀ CHỈ GHI MỘT)】 ตามกฎหมายที่ใช้บังคับ คำพิพากษา/คำชี้ขาดของอนุญาโตตุลาการมีผลบังคับตามขั้นตอนของกฎหมาย ค่าใช้จ่ายในการดำเนินคดีเป็นไปตามคำวินิจฉัยของผู้มีอำนาจและข้อตกลงที่ชอบด้วยกฎหมายของคู่สัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Hợp đồng lập thành <strong><span class=\"fx\" data-k=\"SỐ BẢN GỐC\"></span></strong> bản có giá trị pháp lý như nhau, Bên A giữ <strong><span class=\"fx\" data-k=\"SỐ BẢN\"></span></strong> bản và Bên B giữ <strong><span class=\"fx\" data-k=\"SỐ BẢN\"></span></strong> bản.<span class=\"th\" data-t=\"สัญญาจัดทำขึ้นจำนวน 【SỐ BẢN GỐC】 ฉบับ มีค่าบังคับทางกฎหมายเท่ากัน ฝ่าย A เก็บไว้ 【SỐ BẢN】 ฉบับ และฝ่าย B เก็บไว้ 【SỐ BẢN】 ฉบับ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Hợp đồng có hiệu lực kể từ <strong><span class=\"fx\" data-k=\"NGÀY KÝ / ĐIỀU KIỆN CÓ HIỆU LỰC\"></span></strong> với chữ ký của người đại diện hợp pháp hoặc được ủy quyền của mỗi Bên; việc sử dụng con dấu/chữ ký số áp dụng theo pháp luật hiện hành.<span class=\"th\" data-t=\"สัญญามีผลบังคับตั้งแต่ 【NGÀY KÝ / ĐIỀU KIỆN CÓ HIỆU LỰC】 โดยมีลายมือชื่อของผู้แทนโดยชอบด้วยกฎหมายหรือผู้ได้รับมอบอำนาจของแต่ละฝ่าย การใช้ตราประทับ/ลายมือชื่อดิจิทัลให้เป็นไปตามกฎหมายที่ใช้บังคับอยู่\"></span></p><h3 class=\"art\" data-n=\"20\">ĐIỀU 20. THAY ĐỔI, PHÁT SINH KHỐI LƯỢNG VÀ ĐIỀU CHỈNH GIÁ<span class=\"th\" data-t=\"ข้อ 20 การเปลี่ยนแปลง ปริมาณงานที่เกิดเพิ่ม และการปรับราคา\"></span></h3><p>20.1. Mọi thay đổi phạm vi, bản vẽ, chất lượng, đơn giá hoặc tiến độ phải được lập bằng Phiếu yêu cầu thay đổi (VO) tại Phụ lục 05, có nội dung công việc phát sinh/tăng giảm, đơn giá áp dụng, ảnh hưởng chi phí/thời gian và chữ ký phê duyệt hợp lệ trước khi thực hiện; trường hợp khẩn cấp để bảo vệ an toàn, lập biên bản ngay sau khi xử lý.<span class=\"th\" data-t=\"20.1. การเปลี่ยนแปลงใด ๆ เกี่ยวกับขอบเขต แบบก่อสร้าง คุณภาพ ราคาต่อหน่วย หรือกำหนดการ ต้องจัดทำโดยแบบฟอร์มขอเปลี่ยนแปลง (VO) ตามภาคผนวก 05 ซึ่งมีเนื้อหางานที่เกิดเพิ่ม/เพิ่มลด ราคาต่อหน่วยที่ใช้ ผลกระทบต่อค่าใช้จ่าย/เวลา และลายมือชื่ออนุมัติที่ชอบก่อนดำเนินการ ในกรณีฉุกเฉินเพื่อคุ้มครองความปลอดภัย ให้จัดทำรายงานทันทีภายหลังการจัดการ\"></span></p><p>20.2. Bên B gửi đề xuất giá và tiến độ trong <strong><span class=\"fx\" data-k=\"03\"></span></strong> ngày làm việc từ khi nhận yêu cầu. Bên A phản hồi trong <strong><span class=\"fx\" data-k=\"05\"></span></strong> ngày làm việc hoặc thời hạn tại Phụ lục 04. Đơn giá theo BOQ nếu tương đương; công việc mới phải có đơn giá mới được phê duyệt. Việc chủ đầu tư chấp thuận VO không có nghĩa Bên A mặc nhiên chấp thuận đơn giá Bên B nếu chưa ký VO với Bên B.<span class=\"th\" data-t=\"20.2. ฝ่าย B ส่งข้อเสนอราคาและกำหนดการภายใน 【03】 วันทำการนับแต่ได้รับคำขอ ฝ่าย A ตอบกลับภายใน 【05】 วันทำการ หรือภายในกำหนดเวลาตามภาคผนวก 04 ราคาต่อหน่วยให้เป็นไปตาม BOQ หากเทียบเท่ากัน งานใหม่ต้องมีราคาต่อหน่วยใหม่ที่ได้รับอนุมัติ การที่เจ้าของโครงการยอมรับ VO ไม่ได้หมายความว่าฝ่าย A ยอมรับราคาต่อหน่วยของฝ่าย B โดยปริยาย หากยังไม่ได้ลงนาม VO กับฝ่าย B\"></span></p><p>20.3. VO xác định phạm vi, giá trị tăng/giảm và ảnh hưởng tiến độ; không thanh toán trùng chi phí đã bao gồm trong giá Hợp đồng. Bên B tự chịu chi phí bù tiến độ do lỗi mình. Yêu cầu đẩy nhanh vượt tiến độ cam kết không do lỗi Bên B chỉ phát sinh chi phí khi có thỏa thuận được phê duyệt trước, trừ trường hợp bắt buộc theo pháp luật. Trong tình huống nguy hiểm khẩn cấp, Bên B phải thực hiện ngay biện pháp tối thiểu cần thiết để bảo vệ người, tài sản; thông báo ngay bằng phương tiện nhanh nhất cho đầu mối Bên A và xác nhận bằng văn bản trong (24) giờ kể từ khi có thể thông báo; lập ảnh, nhật ký, khối lượng và chứng từ chi phí. Bên B không được lợi dụng tình huống khẩn cấp để mở rộng phạm vi không cần thiết. Chi phí do lỗi, vi phạm hoặc biện pháp thi công không phù hợp của Bên B do Bên B chịu. Các chi phí còn lại chỉ được xem xét theo trách nhiệm từng Bên, tính cần thiết, mức giá hợp lý, chứng cứ và nghĩa vụ giảm thiểu; Bên A được kiểm tra, đối chiếu trước thanh toán. Không có VO trước xử lý không phải căn cứ duy nhất từ chối chi phí khẩn cấp hợp lệ, nhưng không tạo quyền mặc nhiên yêu cầu KSP thanh toán toàn bộ chi phí.<span class=\"th\" data-t=\"20.3. VO กำหนดขอบเขต มูลค่าที่เพิ่ม/ลด และผลกระทบต่อกำหนดการ ห้ามชำระซ้ำซ้อนสำหรับค่าใช้จ่ายที่รวมอยู่ในราคาสัญญาแล้ว ฝ่าย B รับผิดชอบค่าใช้จ่ายในการเร่งรัดกำหนดการที่เกิดจากความผิดของตนเอง คำขอให้เร่งรัดเกินกว่ากำหนดการที่ผูกพันไว้ซึ่งมิได้เกิดจากความผิดของฝ่าย B จะก่อให้เกิดค่าใช้จ่ายก็ต่อเมื่อมีข้อตกลงที่ได้รับอนุมัติล่วงหน้า เว้นแต่เป็นกรณีที่กฎหมายบังคับ ในสถานการณ์อันตรายเร่งด่วน ฝ่าย B ต้องดำเนินมาตรการขั้นต่ำที่จำเป็นทันทีเพื่อคุ้มครองบุคคลและทรัพย์สิน แจ้งผู้ประสานงานของฝ่าย A ทันทีด้วยช่องทางที่รวดเร็วที่สุด และยืนยันเป็นหนังสือภายใน (24) ชั่วโมงนับแต่เมื่อสามารถแจ้งได้ จัดทำภาพถ่าย บันทึกประจำวัน ปริมาณงาน และเอกสารหลักฐานค่าใช้จ่าย ฝ่าย B ต้องไม่ฉวยโอกาสจากสถานการณ์ฉุกเฉินเพื่อขยายขอบเขตงานโดยไม่จำเป็น ค่าใช้จ่ายที่เกิดจากความผิด การละเมิด หรือวิธีการก่อสร้างที่ไม่เหมาะสมของฝ่าย B ให้ฝ่าย B เป็นผู้รับผิดชอบ ค่าใช้จ่ายส่วนที่เหลือจะได้รับการพิจารณาตามความรับผิดชอบของแต่ละฝ่าย ความจำเป็น ระดับราคาที่สมเหตุสมผล หลักฐาน และหน้าที่บรรเทาความเสียหายเท่านั้น ฝ่าย A มีสิทธิตรวจสอบและเทียบยอดก่อนการชำระเงิน การไม่มี VO ล่วงหน้าก่อนการจัดการไม่ใช่เหตุผลเดียวที่จะปฏิเสธค่าใช้จ่ายฉุกเฉินที่ชอบ แต่ไม่ก่อให้เกิดสิทธิโดยปริยายที่จะเรียกให้ KSP ชำระค่าใช้จ่ายทั้งหมด\"></span></p><p>20.4. TRÌNH TỰ NHẬN VÀ CHUYỂN TIẾP VO TỪ CHỦ ĐẦU TƯ: Khi Chủ đầu tư yêu cầu thay đổi, Bên A xác nhận bằng văn bản phạm vi yêu cầu được chuyển giao, thời hạn thông báo, cơ sở định giá/điều chỉnh tiến độ và người phê duyệt đối với phần việc của Bên B. Bên B thông báo giá và tác động tiến độ trong <span class=\"fx\" data-k=\"SỐ NGÀY\"></span> ngày làm việc, kèm bảng chào và chứng từ; chỉ thực hiện công việc bổ sung sau khi được người có thẩm quyền phê duyệt, trừ trường hợp khẩn cấp theo Điều 20. Không mặc nhiên sử dụng giá trị VO khách hàng để tính tiền phải trả Bên B; mỗi hợp đồng có khối lượng, đơn giá và trách nhiệm độc lập.<span class=\"th\" data-t=\"20.4. ลำดับขั้นตอนการรับและส่งต่อคำสั่งเปลี่ยนแปลงงาน (VO) จากเจ้าของโครงการ: เมื่อเจ้าของโครงการขอเปลี่ยนแปลง ฝ่าย A ยืนยันเป็นลายลักษณ์อักษรถึงขอบเขตของข้อเรียกร้องที่ถ่ายทอด กำหนดเวลาการแจ้ง หลักเกณฑ์การกำหนดราคา/ปรับกำหนดการ และผู้อนุมัติสำหรับงานในส่วนของฝ่าย B ฝ่าย B แจ้งราคาและผลกระทบต่อกำหนดการภายใน 【SỐ NGÀY】 วันทำการ พร้อมใบเสนอราคาและเอกสารหลักฐาน และจะดำเนินงานเพิ่มเติมได้ก็ต่อเมื่อได้รับอนุมัติจากผู้มีอำนาจแล้ว เว้นแต่กรณีฉุกเฉินตามข้อ 20 ไม่ใช้มูลค่า VO ของลูกค้าเป็นฐานในการคำนวณเงินที่ต้องชำระให้ฝ่าย B โดยปริยาย แต่ละสัญญามีปริมาณงาน ราคาต่อหน่วย และความรับผิดเป็นอิสระจากกัน\"></span></p><h3 class=\"art\" data-n=\"21\">ĐIỀU 21. BẢO LÃNH THỰC HIỆN, BẢO HIỂM VÀ TÀI SẢN<span class=\"th\" data-t=\"ข้อ 21 หนังสือค้ำประกันการปฏิบัติตามสัญญา การประกันภัย และทรัพย์สิน\"></span></h3><p>21.1. Bên B phải nộp bảo lãnh thực hiện hợp đồng trị giá (05)% giá Hợp đồng trước VAT trong (07) ngày làm việc từ ngày Hợp đồng có hiệu lực và trước khi nhận tạm ứng hoặc huy động thi công, tùy mốc nào đến trước. Bảo lãnh không hủy ngang do ngân hàng được Bên A chấp thuận phát hành; mẫu bảo lãnh phải quy định rõ nghĩa vụ được bảo đảm, hồ sơ yêu cầu thanh toán, thời hạn và phương thức gửi yêu cầu. Không đặt điều kiện phải có bản án/quyết định trọng tài hoặc sự chấp thuận của Bên B mới được yêu cầu thanh toán đối với nghĩa vụ đã được bảo lãnh. Hiệu lực kéo dài đến khi hoàn tất nghiệm thu, bàn giao, khắc phục tồn đọng và nộp bảo đảm bảo hành hợp lệ, cộng (30) ngày dự phòng; ghi ngày hết hạn cụ thể và gia hạn theo khoản 21.5 khi cần. Bảo lãnh này độc lập với bảo lãnh tạm ứng và bảo đảm bảo hành. Mọi ngoại lệ chỉ có hiệu lực khi ghi rõ tại Phụ lục 06 được hai Bên ký, phù hợp pháp luật.<span class=\"th\" data-t=\"21.1. ฝ่าย B ต้องวางหนังสือค้ำประกันการปฏิบัติตามสัญญามูลค่า (05)% ของราคาสัญญาก่อนภาษีมูลค่าเพิ่ม (VAT) ภายใน (07) วันทำการนับจากวันที่สัญญามีผลบังคับ และก่อนการรับเงินล่วงหน้าหรือการระดมกำลังเข้าก่อสร้าง แล้วแต่กรณีใดจะถึงก่อน หนังสือค้ำประกันต้องเป็นแบบเพิกถอนไม่ได้ ออกโดยธนาคารที่ฝ่าย A ยอมรับ แบบหนังสือค้ำประกันต้องระบุชัดเจนถึงภาระหน้าที่ที่ค้ำประกัน เอกสารประกอบการเรียกให้ชำระเงิน ระยะเวลา และวิธีการส่งคำเรียกร้อง ห้ามกำหนดเงื่อนไขให้ต้องมีคำพิพากษา/คำชี้ขาดของอนุญาโตตุลาการ หรือความยินยอมของฝ่าย B จึงจะเรียกให้ชำระเงินได้ สำหรับภาระหน้าที่ที่ได้รับการค้ำประกันแล้ว ให้มีผลต่อเนื่องจนกว่าการตรวจรับ การส่งมอบ การแก้ไขรายการค้างแก้ และการวางหลักประกันการรับประกันผลงานที่ถูกต้องจะแล้วเสร็จ บวกระยะเวลาสำรองอีก (30) วัน ระบุวันหมดอายุที่ชัดเจนและต่ออายุตามข้อย่อย 21.5 เมื่อจำเป็น หนังสือค้ำประกันนี้เป็นอิสระจากหนังสือค้ำประกันเงินล่วงหน้าและหลักประกันการรับประกันผลงาน ข้อยกเว้นใด ๆ จะมีผลก็ต่อเมื่อระบุชัดเจนในภาคผนวก 06 ที่คู่สัญญาทั้งสองฝ่ายลงนาม และสอดคล้องกับกฎหมาย\"></span></p><p>21.2. Bên B phải duy trì bảo hiểm bắt buộc theo pháp luật và các loại bổ sung được chọn: <strong><span class=\"fx\" data-k=\"BẢO HIỂM CÔNG TRÌNH / LẮP ĐẶT, TRÁCH NHIỆM BÊN THỨ BA, NGƯỜI LAO ĐỘNG, THIẾT BỊ\"></span></strong>, hạn mức <strong><span class=\"fx\" data-k=\"SỐ TIỀN\"></span></strong>, đến ngày <strong><span class=\"fx\" data-k=\"NGÀY\"></span></strong>. Xuất trình chứng từ hợp lệ trước khi bắt đầu công việc; mỗi bên chịu trách nhiệm trong phạm vi lỗi và nghĩa vụ pháp luật của mình.<span class=\"th\" data-t=\"21.2. ฝ่าย B ต้องรักษาการประกันภัยภาคบังคับตามกฎหมายและประเภทเพิ่มเติมที่ได้เลือกไว้ คือ 【BẢO HIỂM CÔNG TRÌNH / LẮP ĐẶT, TRÁCH NHIỆM BÊN THỨ BA, NGƯỜI LAO ĐỘNG, THIẾT BỊ】 วงเงินความคุ้มครอง 【SỐ TIỀN】 ถึงวันที่ 【NGÀY】 ต้องแสดงเอกสารหลักฐานที่ถูกต้องก่อนเริ่มงาน แต่ละฝ่ายรับผิดภายในขอบเขตความผิดและภาระผูกพันตามกฎหมายของตน\"></span></p><p>21.3. Vật tư KSP cấp phải được giao nhận bằng biên bản về số lượng, tình trạng và giá trị đối chiếu. Định mức hao hụt, trách nhiệm bảo quản, kiểm kê, hoàn trả vật tư dư và quyền sở hữu phế liệu được thực hiện theo Phụ lục 01. Bên B không tự ý bán, chuyển giao hoặc sử dụng ngoài dự án; mất mát, hư hỏng do lỗi Bên B được bồi hoàn theo giá trị thiệt hại thực tế.<br/>21.4. Vật tư/thiết bị do Bên B cung cấp: thời điểm chuyển quyền sở hữu, chuyển rủi ro và điều kiện bảo quản được ghi tại Phụ lục 01. Với vật tư cụ thể đã được KSP thanh toán, hai Bên xác nhận quyền sở hữu tương ứng bằng danh mục/biên bản, nhận diện riêng tại xưởng/kho và cam kết không cầm cố, bán hoặc định đoạt trái quyền KSP. Quyền sở hữu chuyển giao không tự động chấm dứt trách nhiệm bảo quản của Bên B trước bàn giao theo thỏa thuận. Khoản tạm ứng đơn thuần không tự động xác lập quyền sở hữu đối với vật tư chưa xác định.<br/>21.5. Bên B nộp gia hạn/thay thế bảo lãnh trước ngày hết hiệu lực ít nhất (15) ngày khi nghĩa vụ được bảo đảm còn tồn tại. Nếu không thực hiện, Bên A được yêu cầu khắc phục và sử dụng quyền yêu cầu thanh toán trong thời hạn, phạm vi, chứng từ và điều kiện của thư bảo lãnh; không tự động coi toàn bộ giá trị bảo lãnh là khoản phạt. Bên mua bảo hiểm, đối tượng được bảo hiểm, hạn mức, mức miễn thường, thời gian bảo hiểm và thủ tục xử lý tổn thất được xác định tại Phụ lục 06 và hợp đồng bảo hiểm tương ứng. Mỗi Bên thực hiện nghĩa vụ mua bảo hiểm bắt buộc thuộc trách nhiệm của mình theo pháp luật.<span class=\"th\" data-t=\"21.3. วัสดุที่ KSP จัดหาให้ต้องมีการส่งมอบและรับมอบด้วยรายงานระบุจำนวน สภาพ และมูลค่าเพื่อเทียบยอด อัตราสูญเสียที่ยอมรับได้ ความรับผิดชอบในการเก็บรักษา การตรวจนับ การคืนวัสดุคงเหลือ และกรรมสิทธิ์ในเศษวัสดุ ให้เป็นไปตามภาคผนวก 01 ฝ่าย B ต้องไม่ขาย โอน หรือนำไปใช้นอกโครงการตามอำเภอใจ การสูญหายหรือเสียหายที่เกิดจากความผิดของฝ่าย B ให้ชดใช้ตามมูลค่าความเสียหายที่เกิดขึ้นจริง 21.4. วัสดุ/อุปกรณ์ที่ฝ่าย B เป็นผู้จัดหา: เวลาโอนกรรมสิทธิ์ การโอนความเสี่ยง และเงื่อนไขการเก็บรักษา ให้ระบุไว้ในภาคผนวก 01 สำหรับวัสดุเฉพาะรายการที่ KSP ชำระเงินแล้ว คู่สัญญาทั้งสองฝ่ายยืนยันกรรมสิทธิ์ที่สอดคล้องกันโดยรายการ/รายงาน ระบุแยกต่างหากที่โรงงาน/คลังสินค้า และให้คำมั่นว่าจะไม่จำนำ ขาย หรือจำหน่ายจ่ายโอนโดยขัดต่อสิทธิของ KSP การโอนกรรมสิทธิ์ไม่ทำให้ความรับผิดชอบในการเก็บรักษาของฝ่าย B ก่อนการส่งมอบตามข้อตกลงสิ้นสุดลงโดยอัตโนมัติ เงินล่วงหน้าเพียงอย่างเดียวไม่ก่อให้เกิดกรรมสิทธิ์โดยอัตโนมัติในวัสดุที่ยังไม่ได้ระบุเฉพาะเจาะจง 21.5. ฝ่าย B ส่งหนังสือค้ำประกันฉบับต่ออายุ/ฉบับทดแทนก่อนวันสิ้นผลอย่างน้อย (15) วัน เมื่อภาระหน้าที่ที่ค้ำประกันยังคงมีอยู่ หากไม่ปฏิบัติ ฝ่าย A มีสิทธิเรียกให้แก้ไข และใช้สิทธิเรียกให้ชำระเงินภายในระยะเวลา ขอบเขต เอกสาร และเงื่อนไขของหนังสือค้ำประกัน ไม่ถือโดยอัตโนมัติว่ามูลค่าทั้งหมดของหนังสือค้ำประกันเป็นค่าปรับ ผู้ซื้อประกันภัย ผู้เอาประกันภัย วงเงินความคุ้มครอง ค่าเสียหายส่วนแรก ระยะเวลาประกันภัย และขั้นตอนการจัดการความสูญเสีย ให้กำหนดไว้ในภาคผนวก 06 และกรมธรรม์ประกันภัยที่เกี่ยวข้อง แต่ละฝ่ายปฏิบัติตามหน้าที่ในการซื้อประกันภัยภาคบังคับที่อยู่ในความรับผิดชอบของตนตามกฎหมาย\"></span></p><p>21.6. MA TRẬN BẢO ĐẢM THEO TỪNG DỰ ÁN: Trước khi ký, Bên A xác định độc lập ba loại bảo đảm (hoàn trả tạm ứng, thực hiện hợp đồng, bảo hành/tiền giữ lại), giá trị, ngày nộp, ngày hết hạn, kỳ đòi tiền, điều kiện gia hạn và ngân hàng phát hành tại Phụ lục 06. Tỷ lệ 10% trong hợp đồng mẫu khách hàng không mặc nhiên là tỷ lệ bắt buộc đối với Bên B; lựa chọn dựa trên tổn thất có thể phát sinh, phạm vi Bên B và yêu cầu pháp luật. Trường hợp hạn bảo đảm phía Bên B ngắn hơn rủi ro KSP với Chủ đầu tư, phải tăng kỳ hạn/đổi hình thức bảo đảm hoặc trình phê duyệt ghi rõ phần rủi ro KSP giữ lại.<span class=\"th\" data-t=\"21.6. เมทริกซ์การค้ำประกันรายโครงการ: ก่อนลงนาม ฝ่าย A กำหนดอย่างเป็นอิสระซึ่งหลักประกันสามประเภท (การคืนเงินล่วงหน้า การปฏิบัติตามสัญญา การรับประกันผลงาน/เงินประกันผลงานที่กักไว้) มูลค่า วันที่ยื่น วันหมดอายุ ระยะเวลาเรียกเก็บเงิน เงื่อนไขการขยายอายุ และธนาคารผู้ออกในภาคผนวก 06 อัตรา 10% ในสัญญามาตรฐานของลูกค้าไม่ถือเป็นอัตราบังคับสำหรับฝ่าย B โดยปริยาย การเลือกขึ้นอยู่กับความเสียหายที่อาจเกิดขึ้น ขอบเขตงานของฝ่าย B และข้อกำหนดทางกฎหมาย ในกรณีที่อายุหลักประกันด้านฝ่าย B สั้นกว่าความเสี่ยงของ KSP ต่อเจ้าของโครงการ ต้องขยายระยะเวลา/เปลี่ยนรูปแบบหลักประกัน หรือเสนอขออนุมัติโดยระบุชัดเจนถึงส่วนความเสี่ยงที่ KSP รับไว้เอง\"></span></p><h3 class=\"art\" data-n=\"22\">ĐIỀU 22. NGUYÊN TẮC BACK-TO-BACK VỚI HỢP ĐỒNG CHỦ ĐẦU TƯ<span class=\"th\" data-t=\"ข้อ 22 หลักการ Back-to-Back กับสัญญาของเจ้าของโครงการ\"></span></h3><p>22.1. Hợp đồng giữa Bên A và Bên B độc lập với hợp đồng giữa KSP và Chủ đầu tư.<span class=\"th\" data-t=\"22.1. สัญญาระหว่างฝ่าย A และฝ่าย B เป็นอิสระจากสัญญาระหว่าง KSP และเจ้าของโครงการ\"></span></p><p>Các yêu cầu của chủ đầu tư áp dụng cho phần việc Bên B được liệt kê rõ tại Phụ lục 04, kèm điều khoản tham chiếu, phiên bản và tài liệu được cung cấp cho Bên B. Phụ lục 04 phải được hai Bên hoàn thiện và ký cùng Hợp đồng khi có nghĩa vụ chuyển giao; nếu không áp dụng, phải ghi rõ lý do và phạm vi không áp dụng. Nghĩa vụ chuyển giao bao gồm tiến độ có thời gian dự phòng cho KSP, tiêu chí chất lượng/chạy thử, hồ sơ, nghiệm thu, HSE, bảo hành và trách nhiệm tương ứng do lỗi Bên B. Việc chuyển giao không miễn trừ nghĩa vụ đã quy định trực tiếp trong Hợp đồng và không tự động chuyển toàn bộ rủi ro của KSP sang Bên B. Không loại trừ hoặc hạn chế trách nhiệm của Bên B đối với phần công việc và nghĩa vụ đã nhận theo Hợp đồng. Trường hợp Bên B vi phạm nghĩa vụ làm phát sinh chi phí hoặc thiệt hại cho Bên A, Bên B phải chịu trách nhiệm đối với các chi phí hợp lý, thiệt hại thực tế, trực tiếp có đầy đủ căn cứ chứng minh và có quan hệ nhân quả với hành vi vi phạm của Bên B, theo Hợp đồng và pháp luật áp dụng.<span class=\"th\" data-t=\"ข้อกำหนดของเจ้าของโครงการที่ใช้บังคับกับงานส่วนของฝ่าย B ให้ระบุไว้อย่างชัดเจนในภาคผนวก 04 พร้อมข้อกำหนดอ้างอิง ฉบับ และเอกสารที่ส่งมอบให้ฝ่าย B ภาคผนวก 04 ต้องได้รับการจัดทำให้สมบูรณ์และลงนามโดยคู่สัญญาทั้งสองฝ่ายพร้อมกับสัญญา เมื่อมีภาระหน้าที่ที่ส่งต่อ หากไม่ใช้บังคับ ต้องระบุเหตุผลและขอบเขตที่ไม่ใช้บังคับอย่างชัดเจน ภาระหน้าที่ที่ส่งต่อรวมถึงกำหนดการที่มีระยะเวลาสำรองให้ KSP เกณฑ์คุณภาพ/การทดสอบเดินเครื่อง เอกสาร การตรวจรับ HSE การรับประกันผลงาน และความรับผิดที่สอดคล้องกันอันเกิดจากความผิดของฝ่าย B การส่งต่อไม่เป็นการยกเว้นภาระหน้าที่ที่กำหนดโดยตรงในสัญญา และไม่ถ่ายโอนความเสี่ยงทั้งหมดของ KSP มายังฝ่าย B โดยอัตโนมัติ ไม่มีการยกเว้นหรือจำกัดความรับผิดของฝ่าย B ต่องานและภาระหน้าที่ที่ได้รับตามสัญญา ในกรณีที่ฝ่าย B ละเมิดภาระหน้าที่จนก่อให้เกิดค่าใช้จ่ายหรือความเสียหายแก่ฝ่าย A ฝ่าย B ต้องรับผิดต่อค่าใช้จ่ายที่สมเหตุสมผล ความเสียหายที่เกิดขึ้นจริงโดยตรงซึ่งมีหลักฐานพิสูจน์อย่างครบถ้วนและมีความสัมพันธ์เชิงเหตุและผลกับการละเมิดของฝ่าย B ตามสัญญาและกฎหมายที่ใช้บังคับ\"></span></p><p>Các mốc tiến độ, thời gian dự phòng, yêu cầu kỹ thuật, hồ sơ, nghiệm thu và bảo hành chuyển giao cho Bên B phải được hai bên xác định cụ thể bằng văn bản khi ký Hợp đồng. Trường hợp có nội dung mâu thuẫn giữa các tài liệu, hai bên phải làm rõ và thống nhất bằng văn bản trước khi thực hiện phần công việc liên quan.<span class=\"th\" data-t=\"หลักเกณฑ์กำหนดการ ระยะเวลาสำรอง ข้อกำหนดทางเทคนิค เอกสาร การตรวจรับ และการรับประกันผลงานที่ส่งต่อให้ฝ่าย B ต้องได้รับการกำหนดอย่างเฉพาะเจาะจงเป็นหนังสือโดยคู่สัญญาทั้งสองฝ่ายเมื่อลงนามสัญญา ในกรณีที่เนื้อหาในเอกสารต่าง ๆ ขัดแย้งกัน คู่สัญญาทั้งสองฝ่ายต้องทำให้ชัดเจนและตกลงเป็นหนังสือก่อนดำเนินงานส่วนที่เกี่ยวข้อง\"></span></p><p>22.2. Nếu Bên A bị Chủ đầu tư phạt hoặc yêu cầu bồi thường do hành vi của Bên B, KSP phải chứng minh hành vi vi phạm tương ứng, mối liên hệ nhân quả, căn cứ nghĩa vụ đã được chuyển giao, số tiền có căn cứ và nghĩa vụ giảm thiểu; các khoản được xem xét theo Điều 9 và 15, không đòi bồi thường trùng với khoản đã thu hồi.<span class=\"th\" data-t=\"22.2. หากฝ่าย A ถูกเจ้าของโครงการปรับหรือเรียกร้องการชดใช้ค่าเสียหายอันเนื่องจากการกระทำของฝ่าย B KSP ต้องพิสูจน์การละเมิดที่สอดคล้องกัน ความสัมพันธ์เชิงเหตุและผล หลักแห่งภาระหน้าที่ที่ได้ส่งต่อ จำนวนเงินที่มีหลักฐาน และหน้าที่บรรเทาความเสียหาย รายการเหล่านี้จะได้รับการพิจารณาตามข้อ 9 และ 15 ห้ามเรียกร้องการชดใช้ซ้ำกับจำนวนที่ได้เรียกคืนแล้ว\"></span></p><p>22.3. Bên B phải phối hợp cung cấp hồ sơ, chứng cứ và thực hiện các biện pháp khắc phục để Bên A giải quyết yêu cầu của chủ đầu tư liên quan đến công việc của Bên B. Thay đổi yêu cầu của chủ đầu tư sau khi ký hợp đồng phải được Bên A thông báo kịp thời và xử lý theo Điều 20; phần công việc thuộc nghĩa vụ và cam kết của Bên B không được coi là phát sinh chỉ vì có yêu cầu nhắc lại.<span class=\"th\" data-t=\"22.3. ฝ่าย B ต้องให้ความร่วมมือในการจัดหาเอกสาร หลักฐาน และดำเนินมาตรการแก้ไข เพื่อให้ฝ่าย A ระงับคำเรียกร้องของเจ้าของโครงการที่เกี่ยวข้องกับงานของฝ่าย B ฝ่าย A ต้องแจ้งการเปลี่ยนแปลงข้อกำหนดของเจ้าของโครงการภายหลังลงนามสัญญาอย่างทันท่วงทีและดำเนินการตามข้อ 20 งานส่วนที่อยู่ในภาระหน้าที่และคำมั่นของฝ่าย B ไม่ถือเป็นงานเกิดเพิ่มเพียงเพราะมีการเรียกร้องย้ำอีกครั้ง\"></span></p><p>Thay đổi thực sự ngoài phạm vi hợp đồng chỉ ràng buộc Bên B sau khi được người có thẩm quyền của Bên A chấp thuận bằng văn bản về phạm vi công việc, chi phí và tiến độ, hoặc thuộc trường hợp khẩn cấp bắt buộc theo Hợp đồng và pháp luật.<span class=\"th\" data-t=\"การเปลี่ยนแปลงที่อยู่นอกขอบเขตสัญญาโดยแท้จริงจะผูกพันฝ่าย B ก็ต่อเมื่อผู้มีอำนาจของฝ่าย A ให้ความเห็นชอบเป็นหนังสือเกี่ยวกับขอบเขตงาน ค่าใช้จ่าย และกำหนดการ หรือเป็นกรณีฉุกเฉินที่สัญญาและกฎหมายบังคับ\"></span></p><p>Không tự động chuyển cho Bên B các khoản phạt hoặc thiệt hại không do lỗi hoặc hành vi vi phạm Hợp đồng của Bên B gây ra. Bên B vẫn phải chịu các chi phí khắc phục và bồi thường thiệt hại thực tế, trực tiếp phát sinh do lỗi hoặc hành vi vi phạm Hợp đồng của mình, tương ứng với mức độ trách nhiệm của Bên B. Việc phối hợp xử lý yêu cầu của chủ đầu tư không miễn trừ trách nhiệm này của Bên B.<span class=\"th\" data-t=\"ไม่โอนค่าปรับหรือความเสียหายที่ไม่ได้เกิดจากความผิดหรือการกระทำที่ฝ่าฝืนสัญญาของฝ่าย B ไปยังฝ่าย B โดยอัตโนมัติ ฝ่าย B ยังคงต้องรับผิดชอบค่าใช้จ่ายในการแก้ไขและการชดใช้ค่าเสียหายที่เกิดขึ้นจริงและโดยตรงจากความผิดหรือการกระทำที่ฝ่าฝืนสัญญาของตน ตามสัดส่วนของระดับความรับผิดของฝ่าย B การประสานงานเพื่อดำเนินการตามข้อเรียกร้องของเจ้าของโครงการไม่ทำให้ฝ่าย B หลุดพ้นจากความรับผิดนี้\"></span></p><p>22.4. KIỂM SOÁT KHOẢNG TRỐNG BACK-TO-BACK: Trước khi ký, Bên A hoàn thiện Phụ lục 04, tối thiểu gồm phạm vi/BOQ, tiến độ và buffer, mốc nghiệm thu, lịch thu tiền khách hàng và lịch chi tiền Bên B, tạm ứng/thu hồi, phạt/bồi thường, bảo lãnh, bảo hành, VO, tạm dừng/chấm dứt và quyền sử dụng tài liệu. Với mỗi mục, ghi rõ nguồn điều khoản phía khách hàng, nghĩa vụ Bên B có thể kiểm soát, chênh lệch chưa chuyển giao và người phê duyệt/chủ thể chịu rủi ro. Số liệu, tỷ lệ và thời hạn chỉ có hiệu lực khi được ghi rõ, cung cấp bản/đoạn trích có quyền chia sẻ và hai Bên xác nhận tại Phụ lục 04/06; không chuyển giao tự động toàn bộ Hợp đồng chủ đầu tư.<span class=\"th\" data-t=\"22.4. การควบคุมช่องว่างแบบ Back-to-Back: ก่อนลงนาม ฝ่าย A จัดทำภาคผนวก 04 ให้สมบูรณ์ โดยอย่างน้อยต้องประกอบด้วย ขอบเขต/BOQ กำหนดการและระยะเผื่อเวลา (buffer) หมุดหมายการตรวจรับ ตารางการรับเงินจากลูกค้าและตารางการจ่ายเงินให้ฝ่าย B เงินล่วงหน้า/การเรียกคืน ค่าปรับ/การชดใช้ค่าเสียหาย หนังสือค้ำประกัน การรับประกันผลงาน VO การหยุดงานชั่วคราว/การเลิกสัญญา และสิทธิการใช้เอกสาร ในแต่ละรายก
