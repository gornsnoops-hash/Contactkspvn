pan class=\"lb\">•</span>Huy động đầy đủ nhân lực, máy móc, thiết bị để thực hiện công việc theo tiến độ đã cam kết; chủ động áp dụng các biện pháp cần thiết để đảm bảo tiến độ và không làm ảnh hưởng đến tiến độ chung của công trình.<span class=\"th\" data-t=\"ระดมกำลังคน เครื่องจักร และอุปกรณ์ให้ครบถ้วนเพื่อดำเนินงานตามกำหนดการที่ได้ให้คำมั่นไว้ ดำเนินมาตรการที่จำเป็นด้วยตนเองเพื่อรักษากำหนดการ และไม่ทำให้กระทบต่อกำหนดการโดยรวมของโครงการ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trường hợp tiến độ thực tế chậm so với tiến độ đã được Bên A chấp thuận, Bên B phải tự bổ sung nhân lực, máy móc, thiết bị, tăng ca, làm thêm giờ hoặc áp dụng các biện pháp cần thiết khác để bù tiến độ mà không được yêu cầu Bên A thanh toán bất kỳ chi phí phát sinh nào.<span class=\"th\" data-t=\"ในกรณีที่กำหนดการจริงล่าช้ากว่ากำหนดการที่ฝ่าย A เห็นชอบ ฝ่าย B ต้องเพิ่มกำลังคน เครื่องจักร อุปกรณ์ เพิ่มกะ ทำงานล่วงเวลา หรือใช้มาตรการอื่นที่จำเป็นด้วยตนเองเพื่อเร่งงานให้ทันกำหนดการ โดยไม่มีสิทธิเรียกร้องให้ฝ่าย A ชำระค่าใช้จ่ายส่วนเพิ่มใดๆ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Chỉ được chuyển bước thi công hoặc thực hiện công việc tiếp theo sau khi phần việc trước đó được Bên A nghiệm thu, xác nhận.<span class=\"th\" data-t=\"จะเปลี่ยนไปขั้นตอนก่อสร้างถัดไปหรือดำเนินงานส่วนต่อไปได้ก็ต่อเมื่องานส่วนก่อนหน้าได้รับการตรวจรับและยืนยันจากฝ่าย A แล้วเท่านั้น\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Lập đầy đủ hồ sơ nghiệm thu nội bộ, nhật ký thi công, hồ sơ chất lượng, hồ sơ hoàn công (nếu có) và hồ sơ thanh toán theo biểu mẫu, hướng dẫn và yêu cầu của Bên A.<span class=\"th\" data-t=\"จัดทำเอกสารการตรวจรับภายใน สมุดบันทึกการก่อสร้าง เอกสารด้านคุณภาพ เอกสารแบบก่อสร้างจริง (as-built) (ถ้ามี) และเอกสารเบิกจ่ายให้ครบถ้วน ตามแบบฟอร์ม คำแนะนำ และข้อกำหนดของฝ่าย A\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Báo cáo tiến độ thực hiện công việc theo định kỳ hoặc đột xuất theo yêu cầu của Bên A; kịp thời thông báo các nguy cơ ảnh hưởng đến tiến độ và đề xuất biện pháp khắc phục.<span class=\"th\" data-t=\"รายงานความคืบหน้าการปฏิบัติงานเป็นระยะหรือเป็นกรณีพิเศษตามที่ฝ่าย A ร้องขอ แจ้งความเสี่ยงที่อาจกระทบกำหนดการให้ทราบโดยทันที และเสนอแนวทางแก้ไข\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Đối với công việc cẩu nâng, vận chuyển đặc thù <strong><span class=\"fx\" data-k=\"MÔ TẢ / KHÔNG ÁP DỤNG\"></span></strong>, mọi chi phí đã được tính trong giá BOQ nếu thuộc phạm vi Bên B.<span class=\"th\" data-t=\"สำหรับงานยกและขนส่งที่มีลักษณะเฉพาะ 【MÔ TẢ / KHÔNG ÁP DỤNG】 ค่าใช้จ่ายทั้งหมดได้รวมอยู่ในราคา BOQ แล้ว หากเป็นขอบเขตงานของฝ่าย B\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B tổ chức vận chuyển vật tư, thiết bị đến các khu vực thi công theo Phụ lục 01 và biện pháp được duyệt; chi phí nằm trong giá nếu không có ngoại lệ được hai bên thống nhất bằng văn bản.<span class=\"th\" data-t=\"ฝ่าย B จัดการขนส่งวัสดุและอุปกรณ์ไปยังพื้นที่ก่อสร้างตามภาคผนวก 01 และวิธีการที่ได้รับอนุมัติ ค่าใช้จ่ายรวมอยู่ในราคาแล้ว เว้นแต่มีข้อยกเว้นที่ทั้งสองฝ่ายตกลงกันเป็นลายลักษณ์อักษร\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B bàn giao cho Bên A vật tư, công việc đã thanh toán và hồ sơ có liên quan; đối với máy móc thiết bị riêng của Bên B, thực hiện quyền và nghĩa vụ theo khoản 6.1 và Điều 8, không mặc nhiên trao quyền sử dụng cho Bên A.<span class=\"th\" data-t=\"ฝ่าย B ส่งมอบวัสดุ งานที่ได้ชำระเงินแล้ว และเอกสารที่เกี่ยวข้องให้ฝ่าย A ส่วนเครื่องจักรอุปกรณ์ที่เป็นของฝ่าย B เอง ให้ใช้สิทธิและปฏิบัติหน้าที่ตามข้อ 6.1 และข้อ 8 โดยไม่ถือเป็นการให้สิทธิใช้งานแก่ฝ่าย A โดยปริยาย\"></span></p><p class=\"lv0\"><span class=\"lb\">c)</span>Vật tư và thiết bị<span class=\"th\" data-t=\"วัสดุและอุปกรณ์\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Tiếp nhận, bảo quản và sử dụng đúng mục đích vật tư do Bên A cấp; thực hiện quyết toán sau khi hoàn thành.<span class=\"th\" data-t=\"รับมอบ เก็บรักษา และใช้วัสดุที่ฝ่าย A จัดให้ตรงตามวัตถุประสงค์ ทำการสรุปยอดหลังจากงานแล้วเสร็จ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Các vật tư phụ do Bên B cung cấp gồm <strong><span class=\"fx\" data-k=\"DANH MỤC VẬT TƯ PHỤ THEO BOQ / SHOP DRAWING\"></span></strong>.<span class=\"th\" data-t=\"วัสดุเสริมที่ฝ่าย B เป็นผู้จัดหา ได้แก่ 【DANH MỤC VẬT TƯ PHỤ THEO BOQ / SHOP DRAWING】\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Tự quản lý công cụ, thiết bị thuộc phần việc mình thực hiện (nếu có).<span class=\"th\" data-t=\"บริหารจัดการเครื่องมือและอุปกรณ์ที่เกี่ยวข้องกับงานส่วนที่ตนรับผิดชอบด้วยตนเอง (ถ้ามี)\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Thiết bị thi công tối thiểu của Bên B: <strong><span class=\"fx\" data-k=\"DANH SÁCH / CHỦNG LOẠI / SỐ LƯỢNG / KIỂM ĐỊNH\"></span></strong> phù hợp phương án thi công và yêu cầu an toàn tại Phụ lục 01/02.<span class=\"th\" data-t=\"อุปกรณ์ก่อสร้างขั้นต่ำของฝ่าย B: 【DANH SÁCH / CHỦNG LOẠI / SỐ LƯỢNG / KIỂM ĐỊNH】 ให้เหมาะสมกับแผนการก่อสร้างและข้อกำหนดด้านความปลอดภัยตามภาคผนวก 01/02\"></span></p><p class=\"lv0\"><span class=\"lb\">d)</span>An toàn và pháp lý<span class=\"th\" data-t=\"ความปลอดภัยและกฎหมาย\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Chịu hoàn toàn trách nhiệm về an toàn lao động cho nhân sự Bên B trong toàn bộ thời gian thi công.<span class=\"th\" data-t=\"รับผิดชอบโดยสมบูรณ์ต่อความปลอดภัยในการทำงานของบุคลากรฝ่าย B ตลอดระยะเวลาก่อสร้าง\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Tự thực hiện đăng ký tạm trú; chịu trách nhiệm về các khoản thuế, phí, nghĩa vụ tài chính liên quan đến nhân công.<span class=\"th\" data-t=\"ดำเนินการลงทะเบียนที่พักชั่วคราว (đăng ký tạm trú) ด้วยตนเอง รับผิดชอบภาษี ค่าธรรมเนียม และภาระทางการเงินที่เกี่ยวข้องกับแรงงาน\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B phải tuân thủ đăng ký tạm trú, nghĩa vụ thuế, bảo hiểm và quy định lao động đối với nhân sự của mình theo pháp luật.<span class=\"th\" data-t=\"ฝ่าย B ต้องปฏิบัติตามการลงทะเบียนที่พักชั่วคราว ภาระภาษี การประกันภัย และระเบียบด้านแรงงานสำหรับบุคลากรของตนตามกฎหมาย\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B chịu trách nhiệm trả lương và nghĩa vụ đối với lao động, nhà thầu phụ; trang phục bảo hộ và logo tại công trường áp dụng theo nội quy đã thông báo, chi phí đồng phục (nếu có) ghi tại Phụ lục 01: <strong><span class=\"fx\" data-k=\"CÓ/KHÔNG – ĐƠN GIÁ\"></span></strong>.<span class=\"th\" data-t=\"ฝ่าย B รับผิดชอบในการจ่ายค่าจ้างและปฏิบัติหน้าที่ต่อแรงงานและผู้รับเหมาช่วง ชุดป้องกันและโลโก้ที่หน้างานให้เป็นไปตามระเบียบที่ได้แจ้งไว้ ค่าใช้จ่ายชุดยูนิฟอร์ม (ถ้ามี) ระบุไว้ในภาคผนวก 01: 【CÓ/KHÔNG – ĐƠN GIÁ】\"></span></p><p class=\"lv0\"><span class=\"lb\">e)</span>Phối hợp và tuân thủ<span class=\"th\" data-t=\"การประสานงานและการปฏิบัติตาม\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Tuân thủ mọi hướng dẫn, điều phối của Bên A và Tư vấn giám sát. Không cản trở hoạt động các đơn vị khác trên công trường.<span class=\"th\" data-t=\"ปฏิบัติตามคำแนะนำและการประสานงานทั้งหมดของฝ่าย A และที่ปรึกษาควบคุมงาน ไม่ขัดขวางการดำเนินงานของหน่วยงานอื่นที่หน้างาน\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Phối hợp báo cáo nhân sự, tiến độ, rủi ro (nếu có) đúng thời hạn quy định.<span class=\"th\" data-t=\"ประสานงานในการรายงานเรื่องบุคลากร กำหนดการ และความเสี่ยง (ถ้ามี) ให้ตรงตามเวลาที่กำหนด\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B phải trả lời thông báo nghiệp vụ của Bên A trong vòng <strong><span class=\"fx\" data-k=\"02\"></span></strong> ngày làm việc; im lặng không mặc nhiên đồng nghĩa chấp thuận phát sinh khối lượng, đơn giá, sửa đổi Hợp đồng hay từ bỏ quyền khiếu nại.<span class=\"th\" data-t=\"ฝ่าย B ต้องตอบกลับหนังสือแจ้งด้านงานของฝ่าย A ภายใน 【02】 วันทำการ การนิ่งเฉยไม่ถือเป็นการยอมรับโดยปริยายต่อการเพิ่มปริมาณงาน ราคาต่อหน่วย การแก้ไขสัญญา หรือการสละสิทธิเรียกร้อง\"></span></p><p>Chi phí phát sinh, nếu có, được giải quyết theo Điều 20 và quy định pháp luật bắt buộc; các chỉ đạo kỹ thuật tại hiện trường không mặc nhiên là phê duyệt tăng giá hoặc gia hạn.<span class=\"th\" data-t=\"ค่าใช้จ่ายที่เกิดขึ้นเพิ่มเติม (ถ้ามี) ให้แก้ไขตามข้อ 20 และบทบัญญัติของกฎหมายที่เป็นข้อบังคับ คำสั่งทางเทคนิคที่หน้างานไม่ถือเป็นการอนุมัติให้เพิ่มราคาหรือขยายระยะเวลาโดยปริยาย\"></span></p><p class=\"lv0\"><span class=\"lb\">f)</span>Các quy định đặc thù <span class=\"th\" data-t=\"ข้อกำหนดเฉพาะ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Không thi công vượt phạm vi mặt bằng được bàn giao.<span class=\"th\" data-t=\"ไม่ก่อสร้างเกินขอบเขตพื้นที่ที่ได้รับมอบ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Chỉ được thi công sau khi có sự chấp thuận của cơ quan chức năng và Bên A tại khu vực đặc thù (ví dụ: khu bảo tồn, rừng).<span class=\"th\" data-t=\"จะก่อสร้างในพื้นที่เฉพาะ (เช่น เขตอนุรักษ์ ป่าไม้) ได้ก็ต่อเมื่อได้รับความเห็นชอบจากหน่วยงานที่มีอำนาจและฝ่าย A แล้วเท่านั้น\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>  Bên B cam kết tuân thủ đầy đủ các quy định của pháp luật về bảo vệ môi trường trong quá trình sản xuất, kinh doanh và cung cấp hàng hóa cho Bên A. Khi được yêu cầu, Bên B sẽ cung cấp các hồ sơ, chứng nhận hoặc cam kết liên quan đến môi trường để phục vụ công tác đánh giá nhà cung cấp của Bên A<span class=\"th\" data-t=\"ฝ่าย B ให้คำมั่นว่าจะปฏิบัติตามบทบัญญัติของกฎหมายว่าด้วยการคุ้มครองสิ่งแวดล้อมอย่างครบถ้วนในระหว่างการผลิต การประกอบธุรกิจ และการจัดหาสินค้าให้แก่ฝ่าย A เมื่อได้รับการร้องขอ ฝ่าย B จะจัดหาเอกสาร ใบรับรอง หรือหนังสือรับรองที่เกี่ยวข้องกับสิ่งแวดล้อม เพื่อประกอบการประเมินผู้จัดหาของฝ่าย A\"></span></p><h3 class=\"art\" data-n=\"7\">ĐIỀU 7. ĐIỆN, NƯỚC VÀ AN NINH CÔNG TRƯỜNG<span class=\"th\" data-t=\"ข้อ 7 ไฟฟ้า น้ำ และการรักษาความปลอดภัยหน้างาน\"></span></h3><p class=\"lv1\"><span class=\"lb\">7.1</span>Điện, nước trên công trường<span class=\"th\" data-t=\"ไฟฟ้าและน้ำที่หน้างาน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B phải tự chịu trách nhiệm trong việc cung cấp điện, nước và các dịch vụ khác cần thiết cho thi công nhân công.<span class=\"th\" data-t=\"ฝ่าย B ต้องรับผิดชอบด้วยตนเองในการจัดหาไฟฟ้า น้ำ และบริการอื่นที่จำเป็นสำหรับการก่อสร้างและแรงงาน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trường hợp nguồn điện, nước và các dịch vụ khác do Bên A (Bên giao thầu) cung cấp sẵn tại công trường, Bên B được phép sử dụng nhưng phải có trách nhiệm bảo quản, sử dụng đúng mục đích, tiết kiệm và an toàn.<span class=\"th\" data-t=\"ในกรณีที่ฝ่าย A (ฝ่ายผู้ว่าจ้าง) จัดเตรียมไฟฟ้า น้ำ และบริการอื่นไว้ที่หน้างานแล้ว ฝ่าย B มีสิทธิใช้ได้ แต่ต้องรับผิดชอบในการดูแลรักษา ใช้ให้ตรงวัตถุประสงค์ อย่างประหยัดและปลอดภัย\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B phải tự chịu mọi rủi ro và chi phí liên quan, kể cả việc cung cấp thiết bị cần thiết để sử dụng các dịch vụ này cũng như thiết bị đo lường.<span class=\"th\" data-t=\"ฝ่าย B ต้องรับความเสี่ยงและค่าใช้จ่ายที่เกี่ยวข้องทั้งหมดด้วยตนเอง รวมถึงการจัดหาอุปกรณ์ที่จำเป็นสำหรับการใช้บริการเหล่านี้ตลอดจนอุปกรณ์วัด\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Mọi chi phí sử dụng điện, nước và dịch vụ khác do Bên B sử dụng (bao gồm tổn thất, hao hụt do hư hỏng, mất mát thiết bị đo, thi công không đúng quy định) sẽ do Bên B tự thanh toán trực tiếp cho nhà cung cấp hoặc hoàn trả lại đầy đủ cho Bên A nếu Bên A đã tạm ứng hoặc thanh toán trước.<span class=\"th\" data-t=\"ค่าใช้จ่ายในการใช้ไฟฟ้า น้ำ และบริการอื่นทั้งหมดที่ฝ่าย B ใช้ (รวมถึงความสูญเสียและการสูญหายอันเกิดจากความเสียหาย การสูญหายของอุปกรณ์วัด หรือการก่อสร้างที่ไม่เป็นไปตามระเบียบ) ฝ่าย B ต้องชำระโดยตรงให้แก่ผู้ให้บริการด้วยตนเอง หรือชดใช้คืนให้ฝ่าย A อย่างครบถ้วนในกรณีที่ฝ่าย A ได้ชำระล่วงหน้าหรือทดรองจ่ายไปก่อน\"></span></p><p class=\"lv1\"><span class=\"lb\">7.2</span>An ninh công trường<span class=\"th\" data-t=\"การรักษาความปลอดภัยหน้างาน\"></span></p><p class=\"lv0\"><span class=\"lb\">a)</span>Bên B không được tự ý cho phép bất kỳ cá nhân không có nhiệm vụ vào công trường, đồng thời phải chịu hoàn toàn trách nhiệm nếu để xảy ra sai phạm hoặc mất an ninh trật tự trong khu vực thi công mà có liên quan đến nhân sự Bên B.<span class=\"th\" data-t=\"ฝ่าย B ต้องไม่อนุญาตให้บุคคลใดที่ไม่มีหน้าที่เข้าหน้างานโดยพลการ และต้องรับผิดชอบโดยสมบูรณ์หากเกิดการกระทำผิดหรือความไม่สงบเรียบร้อยในพื้นที่ก่อสร้างที่เกี่ยวข้องกับบุคลากรของฝ่าย B\"></span></p><p class=\"lv0\"><span class=\"lb\">b)</span>Những người được phép ra vào công trường bao gồm:<span class=\"th\" data-t=\"บุคคลที่ได้รับอนุญาตให้เข้า-ออกหน้างาน ได้แก่:\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Nhân lực của Bên B đã được đăng ký.<span class=\"th\" data-t=\"กำลังคนของฝ่าย B ที่ได้ลงทะเบียนแล้ว\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Nhân sự của Bên A và các bên liên quan khác do Bên A (hoặc người được ủy quyền của Bên A) thông báo bằng văn bản.<span class=\"th\" data-t=\"บุคลากรของฝ่าย A และฝ่ายอื่นที่เกี่ยวข้องตามที่ฝ่าย A (หรือผู้ได้รับมอบอำนาจจากฝ่าย A) แจ้งเป็นลายลักษณ์อักษร\"></span></p><p class=\"lv0\"><span class=\"lb\">c)</span>Bên B phải lập danh sách, đăng ký trước toàn bộ nhân sự làm việc tại công trường, chịu trách nhiệm kiểm soát người ra vào, và phối hợp với Bên A trong công tác quản lý an ninh. Mọi tài sản của Bên B và/hoặc tài sản được Bên A giao cho Bên B quản lý hoặc sử dụng, nếu xảy ra mất mát, hư hỏng trong quá trình thi công, Bên B hoàn toàn chịu trách nhiệm bồi thường theo giá trị thiệt hại thực tế.<span class=\"th\" data-t=\"ฝ่าย B ต้องจัดทำรายชื่อและลงทะเบียนบุคลากรทั้งหมดที่ทำงานที่หน้างานล่วงหน้า รับผิดชอบในการควบคุมการเข้า-ออก และประสานงานกับฝ่าย A ในการบริหารจัดการความปลอดภัย ทรัพย์สินทั้งหมดของฝ่าย B และ/หรือทรัพย์สินที่ฝ่าย A มอบให้ฝ่าย B ดูแลหรือใช้งาน หากเกิดการสูญหายหรือเสียหายในระหว่างการก่อสร้าง ฝ่าย B ต้องรับผิดชดใช้ค่าเสียหายตามมูลค่าความเสียหายที่แท้จริงทั้งหมด\"></span></p><p class=\"lv0\"><span class=\"lb\">d)</span>Tất cả nhân sự của Bên B bắt buộc phải tuân thủ nghiêm túc nội quy, quy chế và các chỉ đạo tại công trường do Bên A ban hành tại từng thời điểm.Việc vi phạm nội quy công trường của nhân sự Bên B sẽ được xem là vi phạm hợp đồng, và Bên A có quyền:<span class=\"th\" data-t=\"บุคลากรของฝ่าย B ทุกคนต้องปฏิบัติตามระเบียบ ข้อบังคับ และคำสั่งที่หน้างานซึ่งฝ่าย A ประกาศใช้ในแต่ละช่วงเวลาอย่างเคร่งครัด การที่บุคลากรของฝ่าย B ฝ่าฝืนระเบียบหน้างานถือเป็นการผิดสัญญา และฝ่าย A มีสิทธิ:\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Yêu cầu thay thế nhân sự.<span class=\"th\" data-t=\"เรียกร้องให้เปลี่ยนตัวบุคลากร\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Tạm dừng thi công.<span class=\"th\" data-t=\"ระงับการก่อสร้างชั่วคราว\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Hoặc xử lý vi phạm theo các điều khoản đã thỏa thuận trong hợp đồng.<span class=\"th\" data-t=\"หรือดำเนินการกับการฝ่าฝืนตามข้อกำหนดที่ตกลงไว้ในสัญญา\"></span></p><p>7.3. Phạm vi an toàn, các hành vi nghiêm cấm, biểu mẫu báo cáo và cơ chế nhắc nhở/khắc phục được quy định tại Phụ lục 02. Không áp dụng phụ lục HSE riêng của dự án nếu chưa được xác nhận và cung cấp cho Bên B.<span class=\"th\" data-t=\"7.3. ขอบเขตด้านความปลอดภัย การกระทำที่ต้องห้าม แบบฟอร์มรายงาน และกลไกการเตือน/การแก้ไข กำหนดไว้ในภาคผนวก 02 ไม่ใช้ภาคผนวก HSE เฉพาะของโครงการ หากยังไม่ได้รับการยืนยันและส่งมอบให้ฝ่าย B\"></span></p><p>7.4. Các thiết bị có yêu cầu nghiêm ngặt về an toàn, nhân sự vận hành, làm việc trên cao, điện và PCCC phải có hồ sơ, giấy phép, kiểm định hợp lệ. Bên A có quyền dừng công việc nguy hiểm ngay, Bên B khắc phục trong <strong><span class=\"fx\" data-k=\"GIỜ\"></span></strong> giờ và báo cáo sự cố trong <strong><span class=\"fx\" data-k=\"GIỜ\"></span></strong> giờ.<span class=\"th\" data-t=\"7.4. อุปกรณ์ที่มีข้อกำหนดด้านความปลอดภัยที่เข้มงวด บุคลากรปฏิบัติการ งานบนที่สูง ไฟฟ้า และการป้องกันอัคคีภัย (PCCC) ต้องมีเอกสาร ใบอนุญาต และการตรวจสอบรับรองที่ถูกต้อง ฝ่าย A มีสิทธิสั่งหยุดงานอันตรายได้ทันที ฝ่าย B ต้องแก้ไขภายใน 【GIỜ】 ชั่วโมง และรายงานเหตุการณ์ภายใน 【GIỜ】 ชั่วโมง\"></span></p><p>7.5. Trước khi thực hiện công việc tại nhà máy đang hoạt động, Bên B phải trình và được Bên A chấp thuận bằng văn bản kế hoạch cắt điện, khóa và cô lập nguồn năng lượng, đấu nối, công việc nóng, cẩu nâng và thời gian dừng máy tương ứng với phạm vi thi công. Khi thi công tại trại chăn nuôi, Bên B phải tuân thủ các quy định an toàn sinh học tại Phụ lục 02, thực hiện khử trùng người, phương tiện, dụng cụ, kiểm soát luồng di chuyển và bảo vệ vật nuôi. Trách nhiệm bồi thường được xác định theo Điều 15.<span class=\"th\" data-t=\"7.5. ก่อนดำเนินงานในโรงงานที่กำลังเดินเครื่องอยู่ ฝ่าย B ต้องเสนอและได้รับความเห็นชอบเป็นลายลักษณ์อักษรจากฝ่าย A ต่อแผนการตัดไฟ การล็อกและแยกแหล่งพลังงาน การเชื่อมต่อ งานที่ใช้ความร้อน (hot work) การยกเคลื่อนย้าย และระยะเวลาหยุดเครื่องจักร ให้สอดคล้องกับขอบเขตการก่อสร้าง เมื่อก่อสร้างในฟาร์มปศุสัตว์ ฝ่าย B ต้องปฏิบัติตามระเบียบด้านความปลอดภัยทางชีวภาพตามภาคผนวก 02 ดำเนินการฆ่าเชื้อบุคคล ยานพาหนะ และเครื่องมือ ควบคุมเส้นทางการเคลื่อนที่ และคุ้มครองสัตว์เลี้ยง ความรับผิดในการชดใช้ค่าเสียหายให้กำหนดตามข้อ 15\"></span></p><h3 class=\"art\" data-n=\"8\">ĐIỀU 8. TẠM DỪNG VÀ CHẤM DỨT HỢP ĐỒNG BỞI BÊN A<span class=\"th\" data-t=\"ข้อ 8 การระงับและการเลิกสัญญาโดยฝ่าย A\"></span></h3><p class=\"lv1\"><span class=\"lb\">8.1</span>Tạm dừng công việc bởi Bên A<span class=\"th\" data-t=\"การระงับงานโดยฝ่าย A\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Nếu Bên B không thực hiện đúng nghĩa vụ hợp đồng, Bên A có quyền thông báo bằng văn bản cho Bên B khắc phục trong thời gian cụ thể.<span class=\"th\" data-t=\"หากฝ่าย B ไม่ปฏิบัติตามหน้าที่ตามสัญญาอย่างถูกต้อง ฝ่าย A มีสิทธิแจ้งเป็นลายลักษณ์อักษรให้ฝ่าย B แก้ไขภายในระยะเวลาที่กำหนดไว้เป็นการเฉพาะ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Nếu Bên B không đáp ứng yêu cầu về chất lượng, an toàn lao động, môi trường, phòng cháy chữa cháy hoặc tiến độ thi công, Bên A có quyền tạm dừng công việc.<span class=\"th\" data-t=\"หากฝ่าย B ไม่ตอบสนองข้อกำหนดด้านคุณภาพ ความปลอดภัยในการทำงาน สิ่งแวดล้อม การป้องกันและระงับอัคคีภัย หรือกำหนดการก่อสร้าง ฝ่าย A มีสิทธิระงับงานชั่วคราว\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trừ tình huống nguy hiểm khẩn cấp hoặc trường hợp pháp luật yêu cầu tạm dừng ngay, Bên A thông báo bằng văn bản cho Bên B trước <span class=\"fx\" data-k=\"03\"></span> ngày hoặc thời hạn phù hợp mức độ vi phạm, nêu rõ căn cứ, phạm vi tạm dừng và điều kiện khắc phục.<span class=\"th\" data-t=\"เว้นแต่ในสถานการณ์อันตรายเร่งด่วนหรือกรณีที่กฎหมายกำหนดให้ระงับทันที ฝ่าย A จะแจ้งเป็นลายลักษณ์อักษรให้ฝ่าย B ทราบล่วงหน้า 【03】 วัน หรือภายในระยะเวลาที่เหมาะสมกับความร้ายแรงของการฝ่าฝืน โดยระบุเหตุผล ขอบเขตการระงับ และเงื่อนไขการแก้ไขอย่างชัดเจน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Thời gian tạm dừng do lỗi Bên B không được tự động gia hạn và chi phí hợp lý phát sinh do Bên B chịu; tạm dừng do lỗi Bên A hoặc Chủ đầu tư được xử lý theo  Điều 2 và Điều 3.<span class=\"th\" data-t=\"ระยะเวลาระงับงานอันเนื่องมาจากความผิดของฝ่าย B จะไม่ได้รับการขยายโดยอัตโนมัติ และค่าใช้จ่ายอันสมควรที่เกิดขึ้นเป็นภาระของฝ่าย B การระงับงานอันเนื่องมาจากความผิดของฝ่าย A หรือเจ้าของโครงการ ให้ดำเนินการตามข้อ 2 และข้อ 3\"></span></p><p class=\"lv1\"><span class=\"lb\">8.2</span>Chấm dứt hợp đồng bởi Bên A<span class=\"th\" data-t=\"การเลิกสัญญาโดยฝ่าย A\"></span></p><p>Bên A có quyền chấm dứt Hợp đồng theo Điều 85 Luật Xây dựng 2025, pháp luật liên quan và các trường hợp vi phạm trọng yếu sau, với thông báo, thời hạn khắc phục (nếu có) và bằng chứng phù hợp:<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิเลิกสัญญาตามมาตรา 85 ของกฎหมายว่าด้วยการก่อสร้าง พ.ศ. 2025 (Luật Xây dựng 2025) กฎหมายที่เกี่ยวข้อง และกรณีการผิดสัญญาในสาระสำคัญดังต่อไปนี้ โดยต้องมีการแจ้ง ระยะเวลาแก้ไข (ถ้ามี) และหลักฐานที่เหมาะสม:\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Không thi công hoặc không khắc phục vi phạm sau khi được yêu cầu.<span class=\"th\" data-t=\"ไม่ก่อสร้างหรือไม่แก้ไขการฝ่าฝืนภายหลังได้รับการร้องขอ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bỏ thi công, hoặc thể hiện không tiếp tục thực hiện hợp đồng.<span class=\"th\" data-t=\"ทิ้งงานก่อสร้าง หรือแสดงออกว่าจะไม่ปฏิบัติตามสัญญาต่อไป\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Tự ý nghỉ thi công 03 ngày liên tục hoặc 05 ngày cộng dồn trong tháng mà không có lý do chính đáng.<span class=\"th\" data-t=\"หยุดงานก่อสร้างโดยพลการติดต่อกัน 03 วัน หรือสะสม 05 วันในหนึ่งเดือน โดยไม่มีเหตุผลอันสมควร\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B mất khả năng tiếp tục thực hiện nghĩa vụ hoặc thuộc trường hợp phá sản/ngừng hoạt động theo pháp luật làm ảnh hưởng thực tế đến tiến độ; không chỉ dựa trên đánh giá chủ quan.<span class=\"th\" data-t=\"ฝ่าย B สูญเสียความสามารถในการปฏิบัติตามหน้าที่ต่อไป หรืออยู่ในกรณีล้มละลาย/หยุดดำเนินกิจการตามกฎหมายอันส่งผลกระทบต่อกำหนดการอย่างแท้จริง ทั้งนี้ ไม่ใช้เพียงการประเมินตามความเห็นส่วนตัว\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Vi phạm nghiêm trọng chất lượng, tiến độ, an toàn, gian lận hồ sơ hoặc tái phạm sau <span class=\"fx\" data-k=\"02\"></span> lần thông báo bằng văn bản và hết thời hạn khắc phục <span class=\"fx\" data-k=\"SỐ NGÀY\"></span> mà không khắc phục, trừ vi phạm không thể khắc phục hoặc rủi ro an toàn khẩn cấp.<span class=\"th\" data-t=\"ฝ่าฝืนอย่างร้ายแรงในด้านคุณภาพ กำหนดการ ความปลอดภัย ปลอมแปลงเอกสาร หรือกระทำผิดซ้ำภายหลังได้รับหนังสือแจ้งเป็นลายลักษณ์อักษร 【02】 ครั้ง และพ้นระยะเวลาแก้ไข 【SỐ NGÀY】 วันแล้วยังไม่แก้ไข เว้นแต่การฝ่าฝืนที่ไม่อาจแก้ไขได้หรือความเสี่ยงด้านความปลอดภัยเร่งด่วน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Các trường hợp khác theo pháp luật hoặc hợp đồng.<span class=\"th\" data-t=\"กรณีอื่นตามที่กฎหมายหรือสัญญากำหนด\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Thông báo chấm dứt được lập bằng văn bản trước <span class=\"fx\" data-k=\"03\"></span> ngày làm việc hoặc thời hạn khác theo pháp luật áp dụng; trong trường hợp nguy hiểm nghiêm trọng có thể dừng công việc ngay nhưng việc chấm dứt vẫn tuân thủ trình tự pháp luật.<span class=\"th\" data-t=\"หนังสือแจ้งเลิกสัญญาต้องทำเป็นลายลักษณ์อักษรล่วงหน้า 【03】 วันทำการ หรือภายในระยะเวลาอื่นตามกฎหมายที่ใช้บังคับ ในกรณีอันตรายร้ายแรงอาจหยุดงานได้ทันที แต่การเลิกสัญญายังต้องเป็นไปตามขั้นตอนของกฎหมาย\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Sau khi chấm dứt, Bên B rút người, thiết bị riêng khỏi công trường trong <span class=\"fx\" data-k=\"05\"></span> ngày làm việc, đồng thời bàn giao hồ sơ, vật tư và các công việc thuộc sở hữu Bên A. Hai bên lập biên bản kiểm kê; nếu Bên B vắng mặt sau khi được mời hợp lệ, Bên A có thể kiểm kê với bên thứ ba độc lập.<span class=\"th\" data-t=\"เมื่อสัญญาเลิกแล้ว ฝ่าย B ต้องถอนบุคลากรและอุปกรณ์ของตนเองออกจากหน้างานภายใน 【05】 วันทำการ พร้อมทั้งส่งมอบเอกสาร วัสดุ และงานที่เป็นกรรมสิทธิ์ของฝ่าย A ทั้งสองฝ่ายจัดทำรายงานการตรวจนับ หากฝ่าย B ไม่มาร่วมหลังจากได้รับเชิญโดยชอบแล้ว ฝ่าย A อาจตรวจนับร่วมกับบุคคลที่สามที่เป็นอิสระได้\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên A không được tự động lấy máy móc, thiết bị riêng của Bên B để trừ nợ nếu không có thỏa thuận bảo đảm hoặc căn cứ pháp luật; quyền bù trừ khoản tiền thực hiện theo Điều 5 và Điều 15.<span class=\"th\" data-t=\"ฝ่าย A ไม่มีสิทธิยึดเครื่องจักรและอุปกรณ์ของฝ่าย B เองโดยอัตโนมัติเพื่อหักชำระหนี้ หากไม่มีข้อตกลงเรื่องหลักประกันหรือไม่มีฐานทางกฎหมายรองรับ สิทธิในการหักกลบลบหนี้เงินให้เป็นไปตามข้อ 5 และข้อ 15\"></span></p><p class=\"lv1\"><span class=\"lb\">8.3</span>Xác định giá trị khi chấm dứt hợp đồng<span class=\"th\" data-t=\"การกำหนดมูลค่าเมื่อเลิกสัญญา\"></span></p><p>Khi chấm dứt, các bên kiểm kê và xác nhận khối lượng, chất lượng phần công việc thực tế đã hoàn thành, vật tư đã thanh toán, hồ sơ kỹ thuật, phần việc dở dang và chi phí hợp lý cần khắc phục. Bên A được lập biên bản một phía có chứng cứ khách quan nếu Bên B không hợp tác sau thông báo hợp lệ.<span class=\"th\" data-t=\"เมื่อเลิกสัญญา ทั้งสองฝ่ายตรวจนับและยืนยันปริมาณและคุณภาพของงานที่ทำเสร็จจริง วัสดุที่ชำระเงินแล้ว เอกสารทางเทคนิค งานที่ค้างอยู่ และค่าใช้จ่ายอันสมควรที่ต้องใช้ในการแก้ไข ฝ่าย A มีสิทธิจัดทำรายงานฝ่ายเดียวโดยมีพยานหลักฐานที่เป็นกลาง หากฝ่าย B ไม่ให้ความร่วมมือหลังได้รับหนังสือแจ้งโดยชอบ\"></span></p><p class=\"lv1\"><span class=\"lb\">8.4</span>Thanh toán sau khi chấm dứt hợp đồng<span class=\"th\" data-t=\"การชำระเงินภายหลังการเลิกสัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A được tạm giữ số tiền có căn cứ hợp lý liên quan trực tiếp đến khối lượng chưa nghiệm thu, số tạm ứng chưa thu hồi, chi phí hoàn thành/thay thế đang xác định, khoản phạt và bồi thường có căn cứ; phần tiền không tranh chấp phải được thanh toán đúng hạn.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิกักเงินจำนวนที่มีเหตุผลอันสมควรซึ่งเกี่ยวข้องโดยตรงกับปริมาณงานที่ยังไม่ได้ตรวจรับ เงินล่วงหน้าที่ยังไม่ได้เรียกคืน ค่าใช้จ่ายในการทำให้แล้วเสร็จ/จัดหาผู้ทำแทนที่อยู่ระหว่างการกำหนด ค่าปรับและการชดใช้ค่าเสียหายที่มีหลักฐานรองรับ ส่วนเงินที่ไม่มีข้อพิพาทต้องชำระตามกำหนด\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A được bù trừ các khoản nợ xác định được và có chứng từ theo hợp đồng, gồm tạm ứng chưa thu hồi, giá trị thanh toán vượt, chi phí khắc phục hoặc thuê thay thế hợp lý, tiền phạt trong giới hạn luật và thiệt hại thực tế chứng minh được; không được cộng trùng các khoản cho cùng thiệt hại.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิหักกลบลบหนี้ที่สามารถกำหนดได้และมีเอกสารหลักฐานตามสัญญา ได้แก่ เงินล่วงหน้าที่ยังไม่ได้เรียกคืน มูลค่าที่ชำระเกิน ค่าใช้จ่ายในการแก้ไขหรือว่าจ้างผู้ทำแทนอันสมควร ค่าปรับภายในขอบเขตที่กฎหมายอนุญาต และค่าเสียหายที่แท้จริงที่พิสูจน์ได้ ทั้งนี้ ห้ามนับซ้ำรายการสำหรับความเสียหายเดียวกัน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Sau khi hoàn tất việc đối chiếu, xác định công nợ và khấu trừ toàn bộ các khoản nêu trên, phần giá trị còn lại (nếu có) sẽ được Bên A thanh toán cho Bên B theo quy định của Hợp đồng.<span class=\"th\" data-t=\"หลังจากเสร็จสิ้นการเทียบยอด การกำหนดหนี้สิน และการหักรายการทั้งหมดข้างต้นแล้ว มูลค่าส่วนที่เหลือ (ถ้ามี) ฝ่าย A จะชำระให้ฝ่าย B ตามที่กำหนดในสัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Nếu tổng số tiền Bên B đã nhận vượt quá giá trị công việc được nghiệm thu sau khi đối chiếu hợp lệ, Bên B hoàn trả phần chênh lệch trong <span class=\"fx\" data-k=\"07\"></span> ngày làm việc từ khi nhận yêu cầu và bảng tính đầy đủ.<span class=\"th\" data-t=\"หากยอดเงินรวมที่ฝ่าย B ได้รับเกินกว่ามูลค่างานที่ได้ตรวจรับภายหลังการเทียบยอดโดยชอบ ฝ่าย B ต้องคืนส่วนต่างภายใน 【07】 วันทำการนับแต่ได้รับคำร้องขอและตารางคำนวณที่ครบถ้วน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Việc chấm dứt Hợp đồng không làm chấm dứt trách nhiệm của Bên B đối với các nghĩa vụ về chất lượng, bảo hành, bồi thường thiệt hại, nghĩa vụ tài chính và các nghĩa vụ khác phát sinh trước thời điểm chấm dứt Hợp đồng.<span class=\"th\" data-t=\"การเลิกสัญญาไม่ทำให้ความรับผิดของฝ่าย B ในหน้าที่ด้านคุณภาพ การรับประกันผลงาน การชดใช้ค่าเสียหาย ภาระทางการเงิน และหน้าที่อื่นที่เกิดขึ้นก่อนเวลาที่เลิกสัญญาสิ้นสุดลง\"></span></p><p>8.5. Hai bên thống nhất Bên A có quyền chấm dứt Hợp đồng do điều chỉnh hoặc dừng dự án bằng thông báo bằng văn bản gửi Bên B, tuân thủ thời hạn báo trước quy định tại Hợp đồng. Trường hợp chấm dứt không do lỗi hoặc hành vi vi phạm của Bên B, việc chấm dứt không tự động phát sinh phạt vi phạm đối với Bên B; quyết toán và hoàn trả tạm ứng thực hiện theo khoản này, Điều 5 và Điều 17. Thời hạn báo trước riêng cho chấm dứt do điều chỉnh/dừng dự án là <span class=\"fx\" data-k=\"SỐ NGÀY BÁO TRƯỚC ĐƯỢC HAI BÊN THỐNG NHẤT\"></span> ngày, phù hợp pháp luật áp dụng. Bên B phải ngừng đặt mua mới, giảm thiểu tổn thất và kê khai chi phí không thể tránh được. Không mặc nhiên thanh toán lợi nhuận dự kiến của phần công việc chưa thực hiện; khoản chi trả khác chỉ theo thỏa thuận cụ thể hợp pháp hoặc quy định bắt buộc. Quyết toán thực hiện theo Điều 17.5.<span class=\"th\" data-t=\"8.5. ทั้งสองฝ่ายตกลงว่าฝ่าย A มีสิทธิเลิกสัญญาเนื่องจากการปรับเปลี่ยนหรือหยุดโครงการ โดยมีหนังสือแจ้งเป็นลายลักษณ์อักษรถึงฝ่าย B ตามระยะเวลาบอกกล่าวล่วงหน้าที่กำหนดในสัญญา ในกรณีที่การเลิกสัญญาไม่ได้เกิดจากความผิดหรือการกระทำฝ่าฝืนของฝ่าย B การเลิกสัญญาจะไม่ก่อให้เกิดค่าปรับ (ตามสัญญา) แก่ฝ่าย B โดยอัตโนมัติ การสรุปยอดและการคืนเงินล่วงหน้าให้ดำเนินการตามวรรคนี้ ข้อ 5 และข้อ 17 ระยะเวลาบอกกล่าวล่วงหน้าเฉพาะสำหรับการเลิกสัญญาเนื่องจากการปรับเปลี่ยน/หยุดโครงการ คือ 【SỐ NGÀY BÁO TRƯỚC ĐƯỢC HAI BÊN THỐNG NHẤT】 วัน ทั้งนี้ ให้สอดคล้องกับกฎหมายที่ใช้บังคับ ฝ่าย B ต้องหยุดสั่งซื้อใหม่ ลดความสูญเสียให้น้อยที่สุด และแจ้งรายการค่าใช้จ่ายที่หลีกเลี่ยงไม่ได้ ไม่ถือเป็นการชำระกำไรที่คาดหวังสำหรับงานส่วนที่ยังไม่ได้ดำเนินการโดยปริยาย การจ่ายเงินอื่นให้เป็นไปตามข้อตกลงเฉพาะที่ชอบด้วยกฎหมายหรือบทบัญญัติที่เป็นข้อบังคับเท่านั้น การสรุปยอดให้ดำเนินการตามข้อ 17.5\"></span></p><p>Đối với vật tư chưa đưa vào công trình, chỉ xem xét thanh toán vật tư thuộc phạm vi đã được Bên A phê duyệt, được đặt mua trước khi Bên B nhận thông báo chấm dứt và Bên B chứng minh không thể hủy đơn hàng, hoàn trả, bán lại hoặc sử dụng cho công việc khác dù đã áp dụng các biện pháp hợp lý. Giá trị thanh toán phải trừ các khoản được hoàn lại, giảm giá hoặc thu hồi; không tính trùng với giá trị khối lượng đã nghiệm thu. Bên B phải bàn giao vật tư, hồ sơ liên quan và chuyển quyền sở hữu hợp pháp cho Bên A khi được thanh toán.<span class=\"th\" data-t=\"สำหรับวัสดุที่ยังไม่ได้นำเข้าสู่งานก่อสร้าง จะพิจารณาชำระเงินเฉพาะวัสดุที่อยู่ในขอบเขตที่ฝ่าย A อนุมัติ ได้สั่งซื้อก่อนที่ฝ่าย B ได้รับหนังสือแจ้งเลิกสัญญา และฝ่าย B พิสูจน์ได้ว่าไม่สามารถยกเลิกคำสั่งซื้อ ส่งคืน ขายต่อ หรือนำไปใช้กับงานอื่นได้ แม้ได้ใช้มาตรการอันสมควรแล้ว มูลค่าที่ชำระต้องหักรายการที่ได้รับคืน ส่วนลด หรือที่เรียกคืนได้ และไม่นับซ้ำกับมูลค่าของปริมาณงานที่ได้ตรวจรับแล้ว ฝ่าย B ต้องส่งมอบวัสดุ เอกสารที่เกี่ยวข้อง และโอนกรรมสิทธิ์โดยชอบด้วยกฎหมายให้ฝ่าย A เมื่อได้รับการชำระเงิน\"></span></p><p>Số tiền còn phải thanh toán khi chấm dứt Hợp đồng bằng tổng giá trị công việc, vật tư và các khoản chi phí được chấp thuận thanh toán hợp lệ, trừ tổng số tiền Bên A đã thực tế thanh toán cho Bên B, bao gồm tạm ứng, và trừ các khoản giữ lại, khấu trừ hợp lệ khác. Không khấu trừ trùng khoản tạm ứng đã nằm trong tổng số tiền thực tế thanh toán. Nếu kết quả đối chiếu xác định Bên B nhận thừa tiền, Bên B phải hoàn trả theo thời hạn tương ứng quy định trong Hợp đồng.<span class=\"th\" data-t=\"จำนวนเงินที่ต้องชำระเมื่อเลิกสัญญา เท่ากับมูลค่ารวมของงาน วัสดุ และค่าใช้จ่ายที่ได้รับอนุมัติให้ชำระโดยชอบ หักด้วยจำนวนเงินรวมที่ฝ่าย A ได้ชำระจริงให้ฝ่าย B รวมถึงเงินล่วงหน้า และหักด้วยเงินที่กักไว้และรายการหักอื่นที่ชอบด้วยกฎหมาย ห้ามหักซ้ำเงินล่วงหน้าที่รวมอยู่ในยอดเงินที่ชำระจริงทั้งหมดแล้ว หากผลการเทียบยอดระบุว่าฝ่าย B ได้รับเงินเกิน ฝ่าย B ต้องคืนตามระยะเวลาที่เกี่ยวข้องซึ่งกำหนดในสัญญา\"></span></p><h3 class=\"art\" data-n=\"9\">ĐIỀU 9. THƯỞNG HỢP ĐỒNG, PHẠT VI PHẠM HỢP ĐỒNG<span class=\"th\" data-t=\"ข้อ 9 เงินรางวัลตามสัญญา และค่าปรับตามสัญญา\"></span></h3><p>9.1. Thưởng hợp đồng (nếu có)<span class=\"th\" data-t=\"9.1. เงินรางวัลตามสัญญา (ถ้ามี)\"></span></p><p>Trường hợp Bên B hoàn thành đúng tiến độ, chất lượng, Bên A có thể xem xét ưu tiên trong cơ hội dự án tiếp theo; việc này không tạo nghĩa vụ giao thầu hoặc hứa thưởng tiền mặt, trừ khi Phụ lục 06 quy định cụ thể.<span class=\"th\" data-t=\"ในกรณีที่ฝ่าย B ทำงานเสร็จตรงตามกำหนดการและคุณภาพ ฝ่าย A อาจพิจารณาให้สิทธิพิจารณาก่อนในโอกาสโครงการถัดไป ทั้งนี้ ไม่ก่อให้เกิดหน้าที่ในการมอบงานหรือคำมั่นให้รางวัลเป็นเงินสด เว้นแต่ภาคผนวก 06 จะกำหนดไว้เป็นการเฉพาะ\"></span></p><p>9.2. Nguyên tắc phạt vi phạm Hợp đồng<span class=\"th\" data-t=\"9.2. หลักการค่าปรับตามสัญญา\"></span></p><p class=\"lv0\"><span class=\"lb\">a)</span>9.2.1. Chậm nộp kế hoạch tiến độ bắt buộc: Nếu Bên B không gửi tiến độ theo Điều 3 trong thời hạn <strong><span class=\"fx\" data-k=\"03\"></span></strong> ngày làm việc kể từ thông báo nhắc nhở, Bên B chịu phạt <strong><span class=\"fx\" data-k=\"TỶ LỆ %\"></span></strong>% giá trị PHẦN NGHĨA VỤ CUNG CẤP HỒ SƠ BỊ VI PHẠM theo cách xác định tại Phụ lục 06; không mặc nhiên áp dụng tỷ lệ trên toàn bộ Giá Hợp đồng. Nếu kéo dài quá <strong><span class=\"fx\" data-k=\"15\"></span></strong> ngày và cấu thành vi phạm trọng yếu, Bên A có quyền xử lý theo Điều 8.<span class=\"th\" data-t=\"9.2.1. ส่งแผนกำหนดการที่บังคับล่าช้า: หากฝ่าย B ไม่ส่งกำหนดการตามข้อ 3 ภายใน 【03】 วันทำการนับแต่ได้รับหนังสือเตือน ฝ่าย B ต้องชำระค่าปรับ 【TỶ LỆ %】 % ของมูลค่า PHẦN NGHĨA VỤ CUNG CẤP HỒ SƠ BỊ VI PHẠM (ส่วนของหน้าที่ในการจัดส่งเอกสารที่ถูกฝ่าฝืน) ตามวิธีการกำหนดในภาคผนวก 06 ไม่ใช้อัตราดังกล่าวกับราคาสัญญาทั้งหมดโดยปริยาย หากล่าช้าเกิน 【15】 วันและเข้าลักษณะเป็นการผิดสัญญาในสาระสำคัญ ฝ่าย A มีสิทธิดำเนินการตามข้อ 8\"></span></p><p class=\"lv0\"><span class=\"lb\">b)</span>9.2.2. Chậm tiến độ giai đoạn/hoàn thành: Bên B chịu phạt <span class=\"fx\" data-k=\"0,10\"></span>%/ngày tính trên GIÁ TRỊ PHẦN CÔNG VIỆC BỊ CHẬM được xác định trong BOQ/Phụ lục 03 và thời gian chậm do lỗi Bên B được xác định bằng hồ sơ tiến độ, nhật ký, thông báo và chứng cứ khách quan; không phụ thuộc riêng vào việc Bên B ký thừa nhận. Tổng khoản phạt đối với việc chậm của cùng phần nghĩa vụ không vượt quá GIỚI HẠN CỘNG DỒN tại khoản 9.2.8. Nếu Bên B khắc phục hoàn toàn chậm tiến độ giai đoạn trước mốc hoàn thành chung và không gây thiệt hại, khoản phạt giai đoạn được xem xét điều chỉnh theo Phụ lục 06.<span class=\"th\" data-t=\"9.2.2. ความล่าช้าของกำหนดการงวดงาน/การแล้วเสร็จ: ฝ่าย B ต้องชำระค่าปรับ 【0,10】 %/วัน คำนวณจาก GIÁ TRỊ PHẦN CÔNG VIỆC BỊ CHẬM (มูลค่าของงานส่วนที่ล่าช้า) ซึ่งกำหนดใน BOQ/ภาคผนวก 03 และระยะเวลาที่ล่าช้าอันเกิดจากความผิดของฝ่าย B ให้กำหนดจากเอกสารกำหนดการ สมุดบันทึก หนังสือแจ้ง และพยานหลักฐานที่เป็นกลาง โดยไม่ขึ้นอยู่กับการที่ฝ่าย B ลงนามรับทราบเพียงอย่างเดียว ค่าปรับรวมสำหรับความล่าช้าของหน้าที่ส่วนเดียวกันต้องไม่เกิน GIỚI HẠN CỘNG DỒN (เพดานสะสม) ตามข้อ 9.2.8 หากฝ่าย B แก้ไขความล่าช้าของกำหนดการงวดงานได้ทั้งหมดก่อนถึงหลักการแล้วเสร็จโดยรวมและไม่ก่อให้เกิดความเสียหาย ค่าปรับของงวดงานจะได้รับการพิจารณาปรับลดตามภาคผนวก 06\"></span></p><p class=\"lv0\"><span class=\"lb\">c)</span>9.2.3. Không hoàn thành/không thực hiện công việc: Nếu Bên B không hoàn thành phần nghĩa vụ theo mốc chính sau thông báo và thời hạn khắc phục <strong><span class=\"fx\" data-k=\"SỐ NGÀY\"></span></strong>, Bên A có thể yêu cầu tiếp tục thực hiện, thuê đơn vị khác hoàn thành phần việc vi phạm hoặc chấm dứt theo Điều 8. Tiền phạt cho phần nghĩa vụ này là <strong><span class=\"fx\" data-k=\"TỶ LỆ %\"></span></strong>% giá trị phần nghĩa vụ bị vi phạm và được cộng vào tổng phạt theo 9.2.8; phần chênh lệch giá thuê thay thế hợp lý và thực tế được yêu cầu bồi thường theo Điều 15 với chứng từ chứng minh.<span class=\"th\" data-t=\"9.2.3. การไม่ทำงานให้แล้วเสร็จ/ไม่ปฏิบัติงาน: หากฝ่าย B ไม่ปฏิบัติภาระผูกพันส่วนที่ถึงกำหนดตามงวดงานหลักให้แล้วเสร็จ ภายหลังได้รับแจ้งและพ้นระยะเวลาแก้ไข 【SỐ NGÀY】 ฝ่าย A อาจเรียกให้ปฏิบัติต่อไป จ้างหน่วยงานอื่นทำงานส่วนที่ผิดสัญญาให้แล้วเสร็จ หรือเลิกสัญญาตามข้อ 8 ค่าปรับสำหรับภาระผูกพันส่วนนี้เท่ากับ 【TỶ LỆ %】 % ของมูลค่าภาระผูกพันส่วนที่ถูกละเมิด และให้นำไปรวมในค่าปรับรวมตามข้อ 9.2.8 ส่วนต่างของค่าจ้างทดแทนที่สมเหตุสมผลและเกิดขึ้นจริงสามารถเรียกให้ชดใช้ค่าเสียหายตามข้อ 15 โดยมีเอกสารหลักฐานพิสูจน์\"></span></p><p class=\"lv0\"><span class=\"lb\">d)</span>9.2.4. Sai chất lượng/kỹ thuật: Bên B phải bằng chi phí của mình sửa chữa, tháo dỡ, gia công, lắp đặt lại, thay thế hoặc thử nghiệm lại phần việc không đạt yêu cầu theo Điều 10. Nếu không khắc phục trong <strong><span class=\"fx\" data-k=\"SỐ NGÀY\"></span></strong> hoặc có vi phạm trọng yếu, Bên A được thuê thay thế theo Điều 8. Phạt vi phạm <strong><span class=\"fx\" data-k=\"TỶ LỆ %\"></span></strong>% giá trị phần nghĩa vụ chất lượng bị vi phạm, cộng dồn trong giới hạn 9.2.8; chi phí sửa chữa và thiệt hại thực tế được giải quyết riêng không tính trùng.<span class=\"th\" data-t=\"9.2.4. ข้อบกพร่องด้านคุณภาพ/เทคนิค: ฝ่าย B ต้องซ่อมแซม รื้อถอน ผลิต ติดตั้งใหม่ เปลี่ยนทดแทน หรือทดสอบใหม่ซึ่งงานที่ไม่ได้ตามข้อกำหนดตามข้อ 10 ด้วยค่าใช้จ่ายของตนเอง หากไม่แก้ไขภายใน 【SỐ NGÀY】 หรือมีการผิดสัญญาอย่างมีนัยสำคัญ ฝ่าย A มีสิทธิจ้างผู้อื่นทดแทนตามข้อ 8 ค่าปรับ 【TỶ LỆ %】 % ของมูลค่าภาระผูกพันด้านคุณภาพส่วนที่ถูกละเมิด สะสมได้ภายในขีดจำกัดตามข้อ 9.2.8 ค่าใช้จ่ายในการซ่อมแซมและค่าเสียหายที่เกิดขึ้นจริงให้พิจารณาแยกต่างหากโดยไม่คิดซ้ำซ้อน\"></span></p><p class=\"lv0\"><span class=\"lb\">e)</span>9.2.5. Tự ý ngừng thi công/bỏ dở/từ chối thực hiện/chấm dứt trái pháp luật: Phạt <strong><span class=\"fx\" data-k=\"TỶ LỆ %\"></span></strong>% giá trị PHẦN NGHĨA VỤ CHƯA THỰC HIỆN BỊ VI PHẠM, tính chung giới hạn 9.2.8; đồng thời Bên B hoàn trả tạm ứng chưa khấu trừ, bàn giao phần việc, vật tư đã thanh toán và bồi thường thiệt hại thực tế theo Điều 15. Không tính hai lần tiền phạt cho cùng hành vi ngừng thi công và chậm tiến độ trên cùng phần nghĩa vụ.<span class=\"th\" data-t=\"9.2.5. การหยุดก่อสร้างโดยพลการ/ละทิ้งงาน/ปฏิเสธการปฏิบัติ/เลิกสัญญาโดยผิดกฎหมาย: ค่าปรับ 【TỶ LỆ %】 % ของมูลค่าภาระผูกพันส่วนที่ยังไม่ได้ปฏิบัติซึ่งถูกละเมิด คิดรวมอยู่ในขีดจำกัดตามข้อ 9.2.8 พร้อมกันนี้ ฝ่าย B ต้องคืนเงินล่วงหน้าที่ยังไม่ได้หักชำระ ส่งมอบงาน วัสดุที่ได้ชำระเงินแล้ว และชดใช้ค่าเสียหายที่เกิดขึ้นจริงตามข้อ 15 ไม่คิดค่าปรับสองครั้งสำหรับการกระทำหยุดก่อสร้างและความล่าช้าของกำหนดการในภาระผูกพันส่วนเดียวกัน\"></span></p><p class=\"lv0\"><span class=\"lb\">f)</span>9.2.6. Cấu kiện/vật tư không đạt: Bên B sửa chữa hoặc thay thế và chịu mọi chi phí hợp lý. Phạt (nếu áp dụng) <strong><span class=\"fx\" data-k=\"TỶ LỆ %\"></span></strong>% giá trị cấu kiện/vật tư bị vi phạm trong giới hạn 9.2.8; không áp dụng mức tối thiểu cố định trên mỗi cấu kiện nếu làm vượt mức phạt theo luật.<span class=\"th\" data-t=\"9.2.6. ชิ้นส่วน/วัสดุที่ไม่ได้มาตรฐาน: ฝ่าย B ต้องซ่อมแซมหรือเปลี่ยนทดแทน และรับผิดชอบค่าใช้จ่ายที่สมเหตุสมผลทั้งหมด ค่าปรับ (หากมีการใช้บังคับ) 【TỶ LỆ %】 % ของมูลค่าชิ้นส่วน/วัสดุที่ถูกละเมิด ภายในขีดจำกัดตามข้อ 9.2.8 ไม่ใช้บังคับอัตราขั้นต่ำคงที่ต่อชิ้นส่วน หากทำให้เกินอัตราค่าปรับตามกฎหมาย\"></span></p><p class=\"lv0\"><span class=\"lb\">g)</span>9.2.7. Vi phạm HSE, PCCC, bảo mật, sử dụng nhà thầu phụ không được chấp thuận hoặc không bàn giao hồ sơ: Bên A lập biên bản, yêu cầu khắc phục và được dừng công việc nguy hiểm; các hành vi có căn cứ định giá phần nghĩa vụ bị vi phạm thì phạt theo <strong><span class=\"fx\" data-k=\"TỶ LỆ %\"></span></strong>% giá trị phần nghĩa vụ đó, nằm trong giới hạn 9.2.8. Không tự động quy định “tiền phạt hành chính” mà chỉ cơ quan nhà nước có thẩm quyền mới được áp dụng.<span class=\"th\" data-t=\"9.2.7. การละเมิดด้าน HSE การป้องกันและดับเพลิง การรักษาความลับ การใช้ผู้รับเหมาช่วงที่ไม่ได้รับความเห็นชอบ หรือการไม่ส่งมอบเอกสาร: ฝ่าย A จัดทำรายงาน เรียกให้แก้ไข และมีสิทธิหยุดงานที่เป็นอันตราย สำหรับการกระทำที่สามารถกำหนดมูลค่าภาระผูกพันส่วนที่ถูกละเมิดได้ ให้ปรับ 【TỶ LỆ %】 % ของมูลค่าภาระผูกพันส่วนนั้น ภายในขีดจำกัดตามข้อ 9.2.8 ไม่กำหนดโดยอัตโนมัติว่าเป็น “ค่าปรับทางปกครอง” ซึ่งมีเพียงหน่วยงานของรัฐที่มีอำนาจเท่านั้นที่ใช้บังคับได้\"></span></p><p class=\"lv0\"><span class=\"lb\">h)</span>9.2.8. GIỚI HẠN PHẠT CỘNG DỒN: Tổng mức phạt đối với MỘT HOẶC NHIỀU VI PHẠM không vượt quá mức luật bắt buộc áp dụng đối với phần nghĩa vụ bị vi phạm (đối với các quan hệ thuộc Điều 301 Luật Thương mại: không quá 8% giá trị phần nghĩa vụ bị vi phạm; đối với hợp đồng xây dựng thuộc dự án đầu tư công/PPP theo Điều 86 Luật Xây dựng 2025: không quá 12% giá trị phần hợp đồng bị vi phạm). Nếu có nhiều vi phạm cùng tác động đến một phần nghĩa vụ, không tính phạt trùng lặp trên cùng phần giá trị; Phụ lục 06 phải ghi rõ cách xác định phần nghĩa vụ và giới hạn.<span class=\"th\" data-t=\"9.2.8. ขีดจำกัดค่าปรับสะสม: ค่าปรับรวมสำหรับการละเมิดหนึ่งครั้งหรือหลายครั้งต้องไม่เกินอัตราที่กฎหมายบังคับใช้กับภาระผูกพันส่วนที่ถูกละเมิด (สำหรับความสัมพันธ์ตามมาตรา 301 แห่งกฎหมายการพาณิชย์: ไม่เกิน 8% ของมูลค่าภาระผูกพันส่วนที่ถูกละเมิด สำหรับสัญญาก่อสร้างของโครงการลงทุนภาครัฐ/PPP ตามมาตรา 86 แห่งกฎหมายการก่อสร้าง ค.ศ. 2025: ไม่เกิน 12% ของมูลค่าส่วนของสัญญาที่ถูกละเมิด) หากมีการละเมิดหลายครั้งที่กระทบต่อภาระผูกพันส่วนเดียวกัน ไม่คิดค่าปรับซ้ำซ้อนบนมูลค่าส่วนเดียวกัน ภาคผนวก 06 ต้องระบุวิธีกำหนดภาระผูกพันส่วนนั้นและขีดจำกัดอย่างชัดเจน\"></span></p><p class=\"lv0\"><span class=\"lb\">i)</span>9.2.9. Đối với các hành vi không lượng hóa được phần nghĩa vụ vi phạm, các Bên phải ghi rõ phương pháp định giá tại Phụ lục 06 trước khi ký; nếu không có cơ sở xác định hợp pháp, Bên A áp dụng yêu cầu khắc phục, bồi thường có chứng minh và quyền chấm dứt theo Hợp đồng thay vì tự ấn định tiền phạt.<span class=\"th\" data-t=\"9.2.9. สำหรับการกระทำที่ไม่สามารถกำหนดมูลค่าภาระผูกพันส่วนที่ถูกละเมิดเป็นตัวเลขได้ คู่สัญญาต้องระบุวิธีการประเมินมูลค่าไว้ในภาคผนวก 06 ก่อนลงนาม หากไม่มีเกณฑ์กำหนดที่ชอบด้วยกฎหมาย ฝ่าย A ใช้การเรียกให้แก้ไข การชดใช้ค่าเสียหายที่พิสูจน์ได้ และสิทธิเลิกสัญญาตามสัญญา แทนการกำหนดจำนวนค่าปรับเองโดยพลการ\"></span></p><p class=\"lv0\"><span class=\"lb\">j)</span>9.2.10. Thủ tục áp dụng phạt: Bên A thông báo mô tả hành vi, điều khoản vi phạm, căn cứ xác định giá trị phần nghĩa vụ, số ngày chậm, mức phạt và tài liệu chứng minh; Bên B phản hồi trong <strong><span class=\"fx\" data-k=\"05\"></span></strong> ngày làm việc. Việc khấu trừ chỉ thực hiện đối với khoản đến hạn, đủ căn cứ, theo Điều 5 và quyền tranh chấp của Bên B.<span class=\"th\" data-t=\"9.2.10. ขั้นตอนการใช้ค่าปรับ: ฝ่าย A แจ้งโดยระบุรายละเอียดการกระทำ ข้อสัญญาที่ถูกละเมิด หลักเกณฑ์กำหนดมูลค่าภาระผูกพันส่วนนั้น จำนวนวันที่ล่าช้า อัตราค่าปรับ และเอกสารหลักฐาน ฝ่าย B ตอบกลับภายใน 【05】 วันทำการ การหักชำระให้ทำได้เฉพาะจำนวนที่ถึงกำหนด มีหลักฐานเพียงพอ ตามข้อ 5 และภายใต้สิทธิโต้แย้งของฝ่าย B\"></span></p><p class=\"lv0\"><span class=\"lb\">k)</span>9.2.11. Khi Bên B khắc phục toàn bộ tiến độ trước ngày hoàn thành chung và không gây thiệt hại, Bên A có quyền xem xét miễn/giảm phạt giai đoạn bằng văn bản; không mặc nhiên xóa phạt đã phát sinh.<span class=\"th\" data-t=\"9.2.11. เมื่อฝ่าย B แก้ไขกำหนดการทั้งหมดได้ก่อนวันแล้วเสร็จโดยรวมและไม่ก่อให้เกิดความเสียหาย ฝ่าย A มีสิทธิพิจารณายกเว้น/ลดค่าปรับรายช่วงเป็นลายลักษณ์อักษร ทั้งนี้ ไม่ถือเป็นการยกเลิกค่าปรับที่เกิดขึ้นแล้วโดยปริยาย\"></span></p><p class=\"lv0\"><span class=\"lb\">l)</span>9.2.12. Phạt vi phạm không thay thế nghĩa vụ sửa lỗi, tiếp tục thực hiện, hoàn trả tạm ứng, bảo hành hoặc bồi thường thiệt hại thực tế khi luật và Hợp đồng cho phép. Các quyền này thuộc Bên bị vi phạm; không nhầm lẫn nghĩa vụ của Bên A và Bên B.<span class=\"th\" data-t=\"9.2.12. ค่าปรับตามสัญญาไม่ทดแทนภาระผูกพันในการแก้ไขข้อบกพร่อง การปฏิบัติต่อไป การคืนเงินล่วงหน้า การรับประกันผลงาน หรือการชดใช้ค่าเสียหายที่เกิดขึ้นจริง เมื่อกฎหมายและสัญญาอนุญาต สิทธิเหล่านี้เป็นของฝ่ายที่ถูกละเมิด ห้ามสับสนระหว่างภาระผูกพันของฝ่าย A และฝ่าย B\"></span></p><h3 class=\"art\" data-n=\"10\"><strong>ĐIỀU 10. NGHIỆM THU GIAI ĐOẠN, NGHIỆM THU QUYẾT TOÁN CÔNG TRÌNH</strong><span class=\"th\" data-t=\"ข้อ 10 การตรวจรับตามงวดงาน และการตรวจรับเพื่อชำระเงินขั้นสุดท้ายของงานก่อสร้าง\"></span></h3><p class=\"sub\">10.1 Thông báo nghiệm thu<span class=\"th\" data-t=\"10.1 การแจ้งการตรวจรับ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Sau khi hoàn thành từng giai đoạn công việc hoặc toàn bộ công trình, Bên B phải chủ động thông báo bằng văn bản cho Bên A ít nhất 02 ngày trước ngày đề xuất nghiệm thu để Bên A xem xét, bố trí lịch nghiệm thu phù hợp.<span class=\"th\" data-t=\"เมื่องานแต่ละงวดหรืองานก่อสร้างทั้งหมดแล้วเสร็จ ฝ่าย B ต้องแจ้งเป็นลายลักษณ์อักษรให้ฝ่าย A ทราบล่วงหน้าโดยเชิงรุกอย่างน้อย 02 วันก่อนวันที่เสนอให้ตรวจรับ เพื่อให้ฝ่าย A พิจารณาและจัดกำหนดการตรวจรับที่เหมาะสม\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A có trách nhiệm bố trí cán bộ nghiệm thu theo điều kiện thực tế thi công, tuy nhiên chỉ tổ chức nghiệm thu khi Bên B đã hoàn thiện đầy đủ hồ sơ, tài liệu, khối lượng đúng thực tế thi công và đạt yêu cầu kỹ thuật.<span class=\"th\" data-t=\"ฝ่าย A มีหน้าที่จัดเจ้าหน้าที่ตรวจรับตามสภาพการก่อสร้างจริง อย่างไรก็ตาม จะจัดการตรวจรับเฉพาะเมื่อฝ่าย B จัดทำเอกสาร หลักฐาน และปริมาณงานตามการก่อสร้างจริงครบถ้วนและได้ตามข้อกำหนดทางเทคนิคแล้วเท่านั้น\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B có trách nhiệm chuẩn bị các dụng cụ, thiết bị cần thiết để phục vụ kiểm tra trong quá trình nghiệm thu, nếu có yêu cầu từ Bên A. Các dụng cụ này phải còn hạn kiểm định và đảm bảo độ chính xác.<span class=\"th\" data-t=\"ฝ่าย B มีหน้าที่จัดเตรียมเครื่องมือ อุปกรณ์ที่จำเป็นเพื่อใช้ในการตรวจสอบระหว่างการตรวจรับ หากฝ่าย A มีคำขอ เครื่องมือเหล่านี้ต้องยังอยู่ในอายุการสอบเทียบและมีความแม่นยำ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B chỉ được tiếp tục thi công bước công việc tiếp theo thuộc diện phải nghiệm thu chuyển bước sau khi đã được Bên A nghiệm thu xác nhận đạt yêu cầu. Nếu Bên B tự ý làm tiếp khi chưa có nghiệm thu, Bên A có quyền yêu cầu tháo dỡ, không thanh toán và yêu cầu làm lại, mọi chi phí phát sinh do Bên B chịu.<span class=\"th\" data-t=\"ฝ่าย B จะดำเนินการก่อสร้างขั้นตอนงานถัดไปที่ต้องผ่านการตรวจรับเพื่อเปลี่ยนขั้นตอนได้ ต่อเมื่อฝ่าย A ตรวจรับและยืนยันว่าได้ตามข้อกำหนดแล้วเท่านั้น หากฝ่าย B ทำต่อโดยพลการทั้งที่ยังไม่มีการตรวจรับ ฝ่าย A มีสิทธิเรียกให้รื้อถอน ไม่ชำระเงิน และเรียกให้ทำใหม่ โดยค่าใช้จ่ายที่เกิดขึ้นทั้งหมดเป็นภาระของฝ่าย B\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Toàn bộ hồ sơ, biên bản nghiệm thu phải do Bên B tự lập, đầy đủ chữ ký của người đại diện theo yêu cầu và mẫu Bên A duyệt. Biên bản thiếu thông tin, không đúng mẫu hoặc không đúng thực tế thi công có thể bị Bên A từ chối nghiệm thu và yêu cầu lập lại.<span class=\"th\" data-t=\"เอกสารและรายงานการตรวจรับทั้งหมดต้องจัดทำโดยฝ่าย B เอง มีลายมือชื่อผู้แทนครบถ้วนตามที่กำหนดและตามแบบที่ฝ่าย A อนุมัติ รายงานที่ขาดข้อมูล ไม่ตรงแบบ หรือไม่ตรงกับการก่อสร้างจริง ฝ่าย A อาจปฏิเสธการตรวจรับและเรียกให้จัดทำใหม่\"></span></p><p class=\"sub\">10.2 Các bước nghiệm thu <span class=\"th\" data-t=\"10.2 ขั้นตอนการตรวจรับ\"></span></p><p class=\"lv0\"><span class=\"lb\">a)</span>Nghiệm thu chuyển bước <span class=\"th\" data-t=\"การตรวจรับเพื่อเปลี่ยนขั้นตอนงาน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Thành phần: Đại diện Bên A và Bên B.<span class=\"th\" data-t=\"องค์ประกอบ: ผู้แทนฝ่าย A และฝ่าย B\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A kiểm tra thực tế phần công việc đã hoàn thành trước khi cho phép làm tiếp phần sau.<span class=\"th\" data-t=\"ฝ่าย A ตรวจสอบงานส่วนที่แล้วเสร็จตามสภาพจริงก่อนอนุญาตให้ทำงานส่วนถัดไปต่อ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Nếu chưa đạt yêu cầu mà Bên B vẫn tự làm tiếp, Bên A có quyền không chấp nhận kết quả và không thanh toán phần công việc  này.<span class=\"th\" data-t=\"หากยังไม่ได้ตามข้อกำหนดแต่ฝ่าย B ยังทำต่อโดยพลการ ฝ่าย A มีสิทธิไม่ยอมรับผลงานและไม่ชำระเงินสำหรับงานส่วนนี้\"></span></p><p>b)  Nghiệm thu khối lượng công việc, vật tư và thiết bị theo giai đoạn (phục vụ thanh toán) <span class=\"th\" data-t=\"b) การตรวจรับปริมาณงาน วัสดุ และอุปกรณ์ตามงวดงาน (เพื่อประกอบการชำระเงิน)\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Thành phần nghiệm thu: Đại diện Bên A và Bên B.<span class=\"th\" data-t=\"องค์ประกอบการตรวจรับ: ผู้แทนฝ่าย A และฝ่าย B\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B có trách nhiệm lập đầy đủ hồ sơ khối lượng thực tế đã thực hiện theo đúng nội dung và quy cách, gửi Bên A kiểm tra mẫu trước khi sử dụng chính thức, đảm bảo phù hợp với quy định tại  Điều 5, Điều 10 và các phụ lục liên quan của Hợp đồng.<span class=\"th\" data-t=\"ฝ่าย B มีหน้าที่จัดทำเอกสารปริมาณงานที่ปฏิบัติจริงให้ครบถ้วนตรงตามเนื้อหาและรูปแบบ ส่งให้ฝ่าย A ตรวจสอบตัวอย่างก่อนใช้จริง เพื่อให้สอดคล้องกับที่กำหนดในข้อ 5 ข้อ 10 และภาคผนวกที่เกี่ยวข้องของสัญญา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Hồ sơ nghiệm thu bắt buộc phải có đầy đủ chữ ký xác nhận của đại diện kỹ thuật công trình do Bên A chỉ định. Biên bản chưa đủ chữ ký, hoặc lập sai, thiếu nội dung theo yêu cầu của  Điều 5, Điều 10 và các phụ lục liên quan, sẽ bị từ chối nghiệm thu.<span class=\"th\" data-t=\"เอกสารการตรวจรับต้องมีลายมือชื่อรับรองครบถ้วนของผู้แทนด้านเทคนิคของโครงการที่ฝ่าย A กำหนด รายงานที่ลายมือชื่อไม่ครบ หรือจัดทำผิด หรือขาดเนื้อหาตามที่ข้อ 5 ข้อ 10 และภาคผนวกที่เกี่ยวข้องกำหนด จะถูกปฏิเสธการตรวจรับ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A có toàn quyền kiểm tra, đo kiểm thực tế tại hiện trường để xác nhận khối lượng công việc đã hoàn thành, làm cơ sở nghiệm thu và thanh toán.<span class=\"th\" data-t=\"ฝ่าย A มีอำนาจเต็มในการตรวจสอบและวัดตรวจจริง ณ สถานที่ก่อสร้างเพื่อยืนยันปริมาณงานที่แล้วเสร็จ เป็นหลักในการตรวจรับและชำระเงิน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Sau khi hoàn thiện đầy đủ hồ sơ và được đại diện công trình ký xác nhận, Bên B có trách nhiệm gửi toàn bộ hồ sơ gốc về văn phòng của Bên A đúng thời hạn quy định, chậm trễ do lỗi của Bên B và chậm nộp hồ sơ do lỗi Bên B không phải căn cứ để gia hạn tiến độ hoặc quy trách nhiệm chậm thanh toán cho Bên A <span class=\"th\" data-t=\"เมื่อจัดทำเอกสารครบถ้วนและผู้แทนโครงการลงนามรับรองแล้ว ฝ่าย B มีหน้าที่ส่งเอกสารต้นฉบับทั้งหมดไปยังสำนักงานของฝ่าย A ภายในกำหนดเวลา ความล่าช้าอันเกิดจากความผิดของฝ่าย B และการส่งเอกสารล่าช้าอันเกิดจากความผิดของฝ่าย B ไม่เป็นเหตุขยายกำหนดการหรือเป็นเหตุให้ฝ่าย A ต้องรับผิดในการชำระเงินล่าช้า\"></span></p><p>10.3. Việc nghiệm thu được thực hiện theo Hợp đồng, hồ sơ kỹ thuật được phê duyệt và tiêu chuẩn áp dụng cho từng hạng mục, bao gồm các tiêu chí phù hợp như khối lượng, kích thước, dung sai, công suất, tải thử, độ kín, thời gian chạy thử, điều kiện thử và hồ sơ liên quan. Trong vòng 03 ngày làm việc kể từ khi nhận được yêu cầu nghiệm thu kèm đầy đủ hồ sơ hợp lệ của Bên B, Bên A phải kiểm tra và phản hồi bằng văn bản về việc tổ chức nghiệm thu hoặc yêu cầu bổ sung, khắc phục, nêu rõ lý do. Việc Bên A chưa phản hồi không được coi là chấp thuận nghiệm thu. Kết quả nghiệm thu phải được lập thành biên bản có chữ ký của đại diện có thẩm quyền của hai bên<span class=\"th\" data-t=\"10.3. การตรวจรับให้ดำเนินการตามสัญญา เอกสารทางเทคนิคที่ได้รับอนุมัติ และมาตรฐานที่ใช้บังคับสำหรับแต่ละรายการงาน ซึ่งรวมถึงเกณฑ์ที่เหมาะสม เช่น ปริมาณงาน ขนาด ค่าความคลาดเคลื่อน กำลังการผลิต/ความจุ การทดสอบรับน้ำหนัก ความแน่นหนา/ปราศจากการรั่ว ระยะเวลาทดสอบเดินเครื่อง เงื่อนไขการทดสอบ และเอกสารที่เกี่ยวข้อง ภายใน 03 วันทำการนับแต่ได้รับคำขอตรวจรับพร้อมเอกสารที่ถูกต้องครบถ้วนของฝ่าย B ฝ่าย A ต้องตรวจสอบและตอบกลับเป็นลายลักษณ์อักษรเกี่ยวกับการจัดการตรวจรับ หรือขอให้เพิ่มเติม/แก้ไข โดยระบุเหตุผลอย่างชัดเจน การที่ฝ่าย A ยังไม่ตอบกลับไม่ถือว่าเป็นการยอมรับการตรวจรับ ผลการตรวจรับต้องจัดทำเป็นรายงานที่มีลายมือชื่อของผู้แทนผู้มีอำนาจของทั้งสองฝ่าย\"></span></p><p><br/>10.4. Khi nghiệm thu, hai bên lập danh mục các tồn đọng, xác định mức độ ảnh hưởng đến an toàn, chất lượng, chức năng sử dụng, trách nhiệm và thời hạn khắc phục. Công trình hoặc hạng mục chỉ được bàn giao đưa vào sử dụng khi đáp ứng các điều kiện theo Hợp đồng và pháp luật áp dụng. Chỉ những tồn đọng nhỏ không ảnh hưởng đến an toàn, chất lượng và khả năng vận hành, sử dụng mới được xem xét để lại khi bàn giao và phải được Bên A chấp thuận bằng văn bản. Hai bên phải xác nhận thời hạn khắc phục và khoản tiền giữ lại tương ứng trước khi bàn giao. Việc thanh toán, kiểm tra, nghiệm thu hoặc đưa vào sử dụng không miễn trừ trách nhiệm của Bên B đối với các lỗi tiềm ẩn thuộc phạm vi trách nhiệm của mình.<span class=\"th\" data-t=\"10.4. เมื่อทำการตรวจรับ ทั้งสองฝ่ายจัดทำรายการงานค้างแก้ไข กำหนดระดับผลกระทบต่อความปลอดภัย คุณภาพ ประโยชน์ใช้สอย ความรับผิดชอบ และกำหนดเวลาแก้ไข โครงการหรือรายการงานจะส่งมอบเพื่อนำไปใช้งานได้ต่อเมื่อเป็นไปตามเงื่อนไขของสัญญาและกฎหมายที่ใช้บังคับ เฉพาะงานค้างเล็กน้อยที่ไม่กระทบต่อความปลอดภัย คุณภาพ และความสามารถในการใช้งานเท่านั้นที่จะได้รับการพิจารณาให้คงไว้เมื่อส่งมอบ และต้องได้รับความยินยอมเป็นลายลักษณ์อักษรจากฝ่าย A ทั้งสองฝ่ายต้องยืนยันกำหนดเวลาแก้ไขและจำนวนเงินประกันผลงานที่กักไว้ที่สอดคล้องก่อนการส่งมอบ การชำระเงิน การตรวจสอบ การตรวจรับ หรือการนำไปใช้งาน ไม่ปลดเปลื้องความรับผิดของฝ่าย B ต่อข้อบกพร่องแฝงที่อยู่ในขอบเขตความรับผิดของตน\"></span></p><h3 class=\"art\" data-n=\"11\">ĐIỀU 11. YÊU CẦU VỀ VẬT TƯ, VẬT LIỆU ĐẦU VÀO VÀ MÁY MÓC THI CÔNG<span class=\"th\" data-t=\"ข้อ 11 ข้อกำหนดเกี่ยวกับวัสดุ วัตถุดิบนำเข้า และเครื่องจักรก่อสร้าง\"></span></h3><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trường hợp Bên B được Bên A giao nhiệm vụ cung ứng vật tư, vật liệu, Bên B phải chịu hoàn toàn trách nhiệm cung cấp đúng chủng loại, chất lượng theo đúng yêu cầu kỹ thuật và đúng cam kết của Bên A với Chủ đầu tư.<span class=\"th\" data-t=\"ในกรณีที่ฝ่าย B ได้รับมอบหมายจากฝ่าย A ให้จัดหาวัสดุ วัตถุดิบ ฝ่าย B ต้องรับผิดชอบโดยสมบูรณ์ในการจัดหาให้ถูกต้องตามประเภท คุณภาพตามข้อกำหนดทางเทคนิค และตามที่ฝ่าย A ได้ให้คำมั่นไว้กับเจ้าของโครงการ\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B có trách nhiệm cung cấp đầy đủ hồ sơ chất lượng, biên bản thí nghiệm, mẫu vật tư, vật liệu đầu vào theo đúng yêu cầu và biểu mẫu của Bên A, kể cả khi vật tư do Bên A cấp, nếu có yêu cầu kiểm tra, phối hợp.<span class=\"th\" data-t=\"ฝ่าย B มีหน้าที่จัดหาเอกสารคุณภาพ รายงานการทดสอบ ตัวอย่างวัสดุ วัตถุดิบนำเข้าให้ครบถ้วนตามข้อกำหนดและแบบฟอร์มของฝ่าย A รวมถึงกรณีที่วัสดุฝ่าย A เป็นผู้จัดหา หากมีคำขอให้ตรวจสอบ/ประสานงาน\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trước khi đưa bất kỳ vật tư, vật liệu nào vào sử dụng, Bên B phải tuân thủ trình tự, thủ tục nghiệm thu theo hướng dẫn của Bên A. Chỉ khi có văn bản nghiệm thu đạt yêu cầu của Bên A, Bên B mới được phép đưa vào thi công.<span class=\"th\" data-t=\"ก่อนนำวัสดุ วัตถุดิบใดๆ ไปใช้งาน ฝ่าย B ต้องปฏิบัติตามลำดับขั้นตอนและวิธีการตรวจรับตามคำแนะนำของฝ่าย A ต่อเมื่อมีหนังสือตรวจรับว่าได้ตามข้อกำหนดจากฝ่าย A แล้ว ฝ่าย B จึงจะได้รับอนุญาตให้นำไปก่อสร้าง\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Chi phí thí nghiệm mẫu vật tư, vật liệu đầu vào do Bên B chịu, áp dụng cho tất cả các loại vật tư, vật liệu do Bên B cung cấp.<span class=\"th\" data-t=\"ค่าใช้จ่ายในการทดสอบตัวอย่างวัสดุ วัตถุดิบนำเข้าเป็นภาระของฝ่าย B ใช้กับวัสดุ วัตถุดิบทุกประเภทที่ฝ่าย B จัดหา\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Phòng thí nghiệm được sử dụng để thí nghiệm vật tư, vật liệu phải do Bên A chỉ định hoặc chấp thuận bằng văn bản.<span class=\"th\" data-t=\"ห้องปฏิบัติการที่ใช้ทดสอบวัสดุ วัตถุดิบต้องเป็นแห่งที่ฝ่าย A กำหนดหรือให้ความเห็นชอบเป็นลายลักษณ์อักษร\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Thành phần nghiệm thu vật tư, vật liệu đầu vào gồm đại diện Bên A và Bên B, biên bản nghiệm thu phải có đầy đủ chữ ký của Bên A mới có giá trị.<span class=\"th\" data-t=\"องค์ประกอบการตรวจรับวัสดุ วัตถุดิบนำเข้า ประกอบด้วยผู้แทนฝ่าย A และฝ่าย B รายงานการตรวจรับต้องมีลายมือชื่อของฝ่าย A ครบถ้วนจึงจะมีผล\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên A có quyền kiểm tra vật tư, máy móc, thiết bị của Bên B tại nơi sản xuất, nơi khai thác hoặc tại công trường bất kỳ thời điểm nào mà không cần báo trước. Bên B có trách nhiệm tạo mọi điều kiện để Bên A thực hiện việc này.<span class=\"th\" data-t=\"ฝ่าย A มีสิทธิตรวจสอบวัสดุ เครื่องจักร อุปกรณ์ของฝ่าย B ณ แหล่งผลิต แหล่งขุดหา หรือที่สถานที่ก่อสร้างได้ทุกเวลาโดยไม่ต้องแจ้งล่วงหน้า ฝ่าย B มีหน้าที่อำนวยความสะดวกทุกประการให้ฝ่าย A ดำเนินการดังกล่าว\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Bên B phải bố trí nhân sự, thiết bị, phương tiện phục vụ cho việc kiểm tra theo yêu cầu của Bên A. Mọi chi phí phát sinh do việc không bố trí hoặc chậm trễ sẽ do Bên B chịu.<span class=\"th\" data-t=\"ฝ่าย B ต้องจัดบุคลากร อุปกรณ์ ยานพาหนะเพื่อรองรับการตรวจสอบตามที่ฝ่าย A ร้องขอ ค่าใช้จ่ายทั้งหมดที่เกิดขึ้นจากการไม่จัดหรือจัดล่าช้าเป็นภาระของฝ่าย B\"></span></p><p>Hồ sơ chất lượng phải hợp lệ, nhất quán và truy xuất được nguồn gốc, chủng loại, lô hàng và vật tư thực tế giao cho dự án. CO/CQ, chứng chỉ thử nghiệm có thể đứng tên nhà sản xuất, nhà nhập khẩu hoặc đơn vị phát hành có thẩm quyền phù hợp. Bên B cung cấp tài liệu liên kết với lô hàng cung cấp cho KSP; Bên A không từ chối hồ sơ chỉ vì chứng từ không đứng tên Bên B nếu đã có đủ căn cứ chứng minh nguồn gốc và sự phù hợp của lô hàng. Bên A có quyền yêu cầu bổ sung, xác minh hoặc từ chối hồ sơ, vật tư, vật liệu nếu không đáp ứng yêu cầu của Hợp đồng hoặc không đủ căn cứ đối chiếu với hàng thực tế. Bên B chịu chi phí khắc phục, thay thế và các chi phí phát sinh do lỗi của mình<span class=\"th\" data-t=\"เอกสารคุณภาพต้องถูกต้อง สอดคล้อง และสามารถตรวจสอบย้อนกลับถึงแหล่งกำเนิด ประเภท ล็อตสินค้า และวัสดุที่ส่งมอบจริงให้โครงการ CO/CQ และใบรับรองการทดสอบอาจออกในนามผู้ผลิต ผู้นำเข้า หรือหน่วยงานผู้ออกที่มีอำนาจตามความเหมาะสม ฝ่าย B จัดหาเอกสารที่เชื่อมโยงกับล็อตสินค้าที่จัดส่งให้ KSP ฝ่าย A จะไม่ปฏิเสธเอกสารเพียงเพราะเอกสารไม่ได้ออกในนามฝ่าย B หากมีหลักฐานเพียงพอพิสูจน์แหล่งกำเนิดและความสอดคล้องของล็อตสินค้า ฝ่าย A มีสิทธิเรียกให้เพิ่มเติม ตรวจสอบยืนยัน หรือปฏิเสธเอกสาร วัสดุ วัตถุดิบ หากไม่เป็นไปตามข้อกำหนดของสัญญาหรือไม่มีหลักฐานเพียงพอในการเทียบกับสินค้าจริง ฝ่าย B รับผิดชอบค่าใช้จ่ายในการแก้ไข เปลี่ยนทดแทน และค่าใช้จ่ายอื่นที่เกิดขึ้นจากความผิดของตน\"></span></p><p>11.10. Bên B phải gửi hồ sơ CO/CQ, nhật ký, kết quả thí nghiệm và biên bản nghiệm thu phù hợp để KSP đáp ứng nghĩa vụ với Chủ đầu tư theo Phụ lục 04; việc chủ đầu tư từ chối nghiệm thu do lỗi Bên B là căn cứ yêu cầu sửa chữa nhưng phải có hồ sơ, tiêu chí kỹ thuật cụ thể.<span class=\"th\" data-t=\"11.10. ฝ่าย B ต้องส่งเอกสาร CO/CQ สมุดบันทึกงาน ผลการทดสอบ และรายงานการตรวจรับที่เหมาะสม เพื่อให้ KSP ปฏิบัติตามภาระผูกพันต่อเจ้าของโครงการตามภาคผนวก 04 การที่เจ้าของโครงการปฏิเสธการตรวจรับเนื่องจากความผิดของฝ่าย B เป็นเหตุให้เรียกให้แก้ไขได้ แต่ต้องมีเอกสารและเกณฑ์ทางเทคนิคที่เฉพาะเจาะจง\"></span></p><h3 class=\"art\" data-n=\"12\">ĐIỀU 12. BẢO HÀNH CÔNG TRÌNH<span class=\"th\" data-t=\"ข้อ 12 การรับประกันผลงานก่อสร้าง\"></span></h3><p>-  Bên B bảo hành phần việc của mình trong <span class=\"fx\" data-k=\"SỐ THÁNG BẢO HÀNH\"></span> tháng kể từ ngày nghiệm thu, bàn giao hợp lệ. Đối với phần nghĩa vụ bảo hành tương ứng với hợp đồng chủ đầu tư đã được cung cấp và ký tại Phụ lục 04, thời điểm bắt đầu, thời hạn và ngày kết thúc bảo hành được xác định cụ thể để bảo đảm KSP có quyền yêu cầu Bên B khắc phục trong suốt thời gian KSP chịu trách nhiệm về phần việc đó. Trường hợp chưa đến mốc bắt đầu theo chủ đầu tư, Bên B tiếp tục bảo quản và sửa sai sót thuộc trách nhiệm mình từ khi bàn giao cho KSP; thời gian chờ tối đa <span class=\"fx\" data-k=\"SỐ THÁNG CHỜ\"></span> tháng kể từ ngày bàn giao cho KSP, trừ chậm trễ do Bên B gây ra hoặc thỏa thuận khác bằng văn bản. Hết thời gian chờ không do lỗi Bên B, thời hạn bảo hành bắt đầu; việc kéo dài để đồng bộ với chủ đầu tư phải được hai Bên thống nhất trước khi hết hạn. Phần sửa chữa/thay thế được bảo hành lại trong <span class=\"fx\" data-k=\"SỐ THÁNG\"></span> tháng từ nghiệm thu sửa chữa hoặc đến hết thời hạn bảo hành ban đầu, tùy thời điểm nào muộn hơn, phù hợp pháp luật. Bảo lãnh hoặc tiền giữ lại phải bao phủ thời gian bảo hành đã thỏa thuận và thời gian dự phòng theo Điều 5. Trước khi ký, Phụ lục 04 và 06 phải ghi ngày/mốc bắt đầu, số tháng chờ tối đa và cơ chế bao phủ chênh lệch với thời hạn KSP cam kết cho Chủ đầu tư. Nếu áp dụng giới hạn chờ, các Bên phải chốt ngay thời hạn bảo hành hoặc giai đoạn bảo đảm bổ sung tương ứng; không để việc bảo hành phần việc của Bên B hết trước nghĩa vụ đã chuyển giao cho Bên B chỉ vì chưa ký thỏa thuận gia hạn. Không mặc nhiên chuyển cho Bên B nghĩa vụ ngoài phạm vi đã ký.<span class=\"th\" data-t=\"- ฝ่าย B รับประกันผลงานส่วนของตนเป็นเวลา 【SỐ THÁNG BẢO HÀNH】 เดือน นับจากวันตรวจรับและส่งมอบโดยชอบ สำหรับภาระผูกพันด้านการรับประกันส่วนที่สอดคล้องกับสัญญากับเจ้าของโครงการที่ได้ให้ไว้และลงนามในภาคผนวก 04 ให้กำหนดวันเริ่มต้น ระยะเวลา และวันสิ้นสุดของการรับประกันอย่างเฉพาะเจาะจง เพื่อให้มั่นใจว่า KSP มีสิทธิเรียกให้ฝ่าย B แก้ไขตลอดระยะเวลาที่ KSP ต้องรับผิดชอบต่องานส่วนนั้น ในกรณียังไม่ถึงวันเริ่มต้นตามเจ้าของโครงการ ฝ่าย B ยังคงดูแลรักษาและแก้ไขข้อบกพร่องที่อยู่ในความรับผิดชอบของตนนับจากส่งมอบให้ KSP ระยะเวลารอสูงสุด 【SỐ THÁNG CHỜ】 เดือน นับจากวันส่งมอบให้ KSP เว้นแต่ความล่าช้าที่ฝ่าย B เป็นผู้ก่อหรือตกลงเป็นอย่างอื่นเป็นลายลักษณ์อักษร เมื่อพ้นระยะเวลารอโดยมิใช่ความผิดของฝ่าย B ระยะเวลารับประกันเริ่มต้นขึ้น การขยายระยะเวลาเพื่อให้สอดคล้องกับเจ้าของโครงการต้องได้รับความตกลงจากทั้งสองฝ่ายก่อนครบกำหนด งานส่วนที่ซ่อมแซม/เปลี่ยนทดแทนได้รับการรับประกันใหม่เป็นเวลา 【SỐ THÁNG】 เดือน นับจากการตรวจรับงานซ่อมแซม หรือจนครบระยะเวลารับประกันเดิม แล้วแต่กำหนดใดจะสิ้นสุดช้ากว่า ทั้งนี้ ให้สอดคล้องกับกฎหมาย หนังสือค้ำประกันหรือเงินประกันผลงานที่กักไว้ต้องครอบคลุมระยะเวลารับประกันที่ตกลงและระยะเวลาสำรองตามข้อ 5 ก่อนลงนาม ภาคผนวก 04 และ 06 ต้องระบุวัน/จุดเริ่มต้น จำนวนเดือนรอสูงสุด และกลไกครอบคลุมส่วนต่างกับระยะเวลาที่ KSP ให้คำมั่นต่อเจ้าของโครงการ หากใช้ขีดจำกัดระยะเวลารอ คู่สัญญาต้องกำหนดระยะเวลารับประกันหรือช่วงระยะเวลาประกันเพิ่มเติมที่สอดคล้องกันทันที ห้ามปล่อยให้การรับประกันงานส่วนของฝ่าย B สิ้นสุดก่อนภาระผูกพันที่ได้ส่งต่อให้ฝ่าย B เพียงเพราะยังไม่ได้ลงนามในข้อตกลงขยายระยะเวลา ไม่ถือโดยปริยายว่าโอนให้ฝ่าย B รับภาระผูกพันนอกขอบเขตที่ได้ลงนามไว้\"></span></p><p>Bên B bảo hành bằng chi phí của mình đối với sai sót thuộc trách nhiệm Bên B trong toàn bộ phần công việc, vật tư, thiết bị do Bên B cung cấp, gia công, thi công hoặc lắp đặt, gồm chi phí kiểm tra, tháo dỡ, vận chuyển, thay thế, lắp lại và thử nghiệm cần thiết. Với vật tư KSP cấp, Bên B chịu trách nhiệm về bảo quản, thi công và cảnh báo sai sót có thể nhận biết hợp lý; lỗi nội tại không do Bên B gây ra được phân định theo chứng cứ và Hợp đồng. Bảo hành của nhà sản xuất không thay thế nghĩa vụ bảo hành của Bên B đối với KSP.<span class=\"th\" data-t=\"ฝ่าย B รับประกันด้วยค่าใช้จ่ายของตนเองสำหรับข้อบกพร่องที่อยู่ในความรับผิดชอบของฝ่าย B ในงาน วัสดุ อุปกรณ์ทั้งหมดที่ฝ่าย B จัดหา ผลิต ก่อสร้าง หรือติดตั้ง รวมถึงค่าใช้จ่ายในการตรวจสอบ รื้อถอน ขนส่ง เปลี่ยนทดแทน ติดตั้งใหม่ และทดสอบที่จำเป็น สำหรับวัสดุที่ KSP เป็นผู้จัดหา ฝ่าย B รับผิดชอบการดูแลรักษา การก่อสร้าง และการแจ้งเตือนข้อบกพร่องที่สามารถสังเกตได้โดยสมเหตุสมผล ข้อบกพร่องภายในที่มิได้เกิดจากฝ่าย B ให้แบ่งแยกตามพยานหลักฐานและสัญญา การรับประกันของผู้ผลิตไม่ทดแทนภาระผูกพันในการรับประกันของฝ่าย B ต่อ KSP\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Trong thời gian bảo hành, Bên B phản hồi sự cố khẩn cấp trong <span class=\"fx\" data-k=\"GIỜ\"></span> giờ, lỗi thông thường trong <span class=\"fx\" data-k=\"NGÀY\"></span> ngày và phải có biện pháp khắc phục được Bên A chấp thuận. Nếu không thực hiện đúng hạn sau thông báo hợp lệ, Bên A được thuê đơn vị khác sửa chữa với chi phí hợp lý, có chứng từ và bù trừ theo Điều 5/15. Việc bảo lãnh bảo hành thực hiện theo Phụ lục 06. Thời hạn phản hồi, có mặt, xử lý tạm thời và hoàn thành sửa chữa phải được ghi riêng tại Phụ lục 06; phản hồi bằng văn bản không được coi là đã hoàn thành nghĩa vụ sửa chữa.<span class=\"th\" data-t=\"ในระหว่างระยะเวลารับประกัน ฝ่าย B ตอบสนองต่อเหตุขัดข้องเร่งด่วนภายใน 【GIỜ】 ชั่วโมง ข้อบกพร่องทั่วไปภายใน 【NGÀY】 วัน และต้องมีมาตรการแก้ไขที่ฝ่าย A เห็นชอบ หากไม่ปฏิบัติตามกำหนดภายหลังได้รับแจ้งโดยชอบ ฝ่าย A มีสิทธิจ้างหน่วยงานอื่นซ่อมแซมด้วยค่าใช้จ่ายที่สมเหตุสมผล มีเอกสารหลักฐาน และหักกลบลบหนี้ตามข้อ 5/15 การค้ำประกันการรับประกันให้เป็นไปตามภาคผนวก 06 ระยะเวลาตอบสนอง การเข้าถึงสถานที่ การแก้ไขชั่วคราว และการซ่อมแซมให้แล้วเสร็จ ต้องระบุแยกต่างหากในภาคผนวก 06 การตอบกลับเป็นลายลักษณ์อักษรไม่ถือว่าได้ปฏิบัติภาระผูกพันในการซ่อมแซมครบถ้วนแล้ว\"></span></p><p>- Bên B phải có mặt, thực hiện biện pháp xử lý tạm thời và hoàn thành sửa chữa trong thời hạn tương ứng với mức độ sự cố quy định tại Phụ lục 06. Khi có nguy cơ khẩn cấp đối với người hoặc tài sản, Bên A được thực hiện ngay biện pháp cần thiết, thông báo cho Bên B sớm nhất có thể và lưu chứng cứ; chi phí được phân bổ theo trách nhiệm của mỗi Bên và thiệt hại thực tế. Tiền giữ lại bảo hành được giải tỏa trong (15) ngày làm việc kể từ khi hết thời hạn bảo hành, Bên B hoàn tất khắc phục và hai Bên đối chiếu các khoản khấu trừ hợp lệ. Bảo lãnh bảo hành được giải tỏa theo điều kiện đã thỏa thuận.<span class=\"th\" data-t=\"- ฝ่าย B ต้องเข้าถึงสถานที่ ดำเนินมาตรการแก้ไขชั่วคราว และซ่อมแซมให้แล้วเสร็จภายในระยะเวลาที่สอดคล้องกับระดับความรุนแรงของเหตุขัดข้องตามที่กำหนดในภาคผนวก 06 เมื่อมีอันตรายเร่งด่วนต่อบุคคลหรือทรัพย์สิน ฝ่าย A มีสิทธิดำเนินมาตรการที่จำเป็นได้ทันที แจ้งให้ฝ่าย B ทราบโดยเร็วที่สุดเท่าที่จะทำได้ และเก็บรักษาพยานหลักฐาน ค่าใช้จ่ายให้แบ่งตามความรับผิดชอบของแต่ละฝ่ายและความเสียหายที่เกิดขึ้นจริง เงินประกันผลงานที่กักไว้เพื่อการรับประกันจะได้รับการปล่อยคืนภายใน (15) วันทำการ นับจากสิ้นสุดระยะเวลารับประกัน ฝ่าย B แก้ไขเสร็จสิ้น และทั้งสองฝ่ายกระทบยอดรายการหักชำระที่ชอบแล้ว หนังสือค้ำประกันการรับประกันจะได้รับการปล่อยตามเงื่อนไขที่ตกลงกัน\"></span></p><h3 class=\"art\" data-n=\"13\">ĐIỀU 13. TRÁCH NHIỆM CỦA BÊN B ĐỐI VỚI NHÀ THẦU PHỤ VÀ NHÂN SỰ THUÊ NGOÀI<span class=\"th\" data-t=\"ข้อ 13 ความรับผิดของฝ่าย B ต่อผู้รับเหมาช่วงและบุคลากรที่จ้างจากภายนอก\"></span></h3><p class=\"lv0 bl\"><span class=\"lb\">•</span>Trường hợp Bên B sử dụng nhà thầu phụ để thực hiện bất kỳ phần công việc nào, Bên B bắt buộc phải báo cáo và chỉ được triển khai sau khi được Bên A phê duyệt bằng văn bản. Việc chấp thuận nhà thầu phụ không hợp thức hóa việc Bên B không đáp ứng điều kiện năng lực bắt buộc và không miễn trừ trách nhiệm của Bên B.<span class=\"th\" data-t=\"ในกรณีที่ฝ่าย B ใช้ผู้รับเหมาช่วงดำเนินงานส่วนใดๆ ฝ่าย B ต้องรายงานและจะเริ่มดำเนินการได้ภายหลังได้รับอนุมัติเป็นลายลักษณ์อักษรจากฝ่าย A เท่านั้น การให้ความเห็นชอบผู้รับเหมาช่วงไม่ทำให้การที่ฝ่าย B ไม่มีคุณสมบัติด้านความสามารถตามที่บังคับกลายเป็นชอบด้วยกฎหมาย และไม่ปลดเปลื้องความรับผิดของฝ่าย B\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B không được giao thầu phụ toàn bộ Hợp đồng; mức giới hạn giao thầu phụ <strong><span class=\"fx\" data-k=\"% / PHẠM VI\"></span></strong> phải được lựa chọn theo thực tế, năng lực và yêu cầu chủ đầu tư và phải được Bên A chấp thuận trước bằng văn bản. Vi phạm trọng yếu về nhà thầu phụ được xử lý theo Điều 8 và 9.<span class=\"th\" data-t=\"ฝ่าย B ต้องไม่ให้ผู้รับเหมาช่วงรับงานตามสัญญาทั้งหมด ขีดจำกัดการจ้างช่วง 【% / PHẠM VI】 ต้องเลือกให้สอดคล้องกับสภาพจริง ความสามารถ และข้อกำหนดของเจ้าของโครงการ และต้องได้รับความเห็นชอบล่วงหน้าเป็นลายลักษณ์อักษรจากฝ่าย A การละเมิดอย่างมีนัยสำคัญเกี่ยวกับผู้รับเหมาช่วงให้ดำเนินการตามข้อ 8 และ 9\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B hoàn toàn chịu trách nhiệm về toàn bộ hành vi, lỗi kỹ thuật, sai sót hoặc vi phạm của các nhà thầu phụ, cá nhân, tổ chức do mình thuê, bao gồm cả các tổn thất, vi phạm hợp đồng, vi phạm pháp luật và ảnh hưởng tiêu cực đến công trình, môi trường hoặc cộng đồng dân cư xung quanh.<span class=\"th\" data-t=\"ฝ่าย B ต้องรับผิดชอบโดยสมบูรณ์ต่อการกระทำ ข้อบกพร่องทางเทคนิค ข้อผิดพลาด หรือการละเมิดของผู้รับเหมาช่วง บุคคล และองค์กรที่ตนว่าจ้างทั้งหมด รวมถึงความสูญเสีย การผิดสัญญา การฝ่าฝืนกฎหมาย และผลกระทบเชิงลบต่อโครงการ สิ่งแวดล้อม หรือชุมชนโดยรอบ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B phải chịu hoàn toàn trách nhiệm về an toàn lao động, bảo hiểm, điều kiện làm việc của các tổ chức, cá nhân do mình thuê, kể cả trong trường hợp phát sinh tai nạn, rủi ro hoặc sự cố tại công trường.<span class=\"th\" data-t=\"ฝ่าย B ต้องรับผิดชอบโดยสมบูรณ์ในเรื่องความปลอดภัยในการทำงาน การประกันภัย และสภาพการทำงานของบุคคลและองค์กรที่ตนว่าจ้าง รวมถึงกรณีเกิดอุบัติเหตุ ความเสี่ยง หรือเหตุขัดข้องที่สถานที่ก่อสร้าง\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B chịu trách nhiệm theo pháp luật đối với hành vi trái pháp luật của nhà thầu phụ và nhân sự của mình thuộc phạm vi kiểm soát; Điều này không miễn trừ trách nhiệm pháp lý bắt buộc của Bên A nếu Bên A có lỗi hoặc pháp luật quy định.<span class=\"th\" data-t=\"ฝ่าย B รับผิดตามกฎหมายต่อการกระทำที่ผิดกฎหมายของผู้รับเหมาช่วงและบุคลากรของตนที่อยู่ในขอบเขตที่ตนควบคุม ข้อนี้ไม่ปลดเปลื้องความรับผิดทางกฎหมายที่เป็นข้อบังคับของฝ่าย A หากฝ่าย A มีความผิดหรือกฎหมายกำหนด\"></span></p><h3 class=\"art\" data-n=\"14\">ĐIỀU 14. AN TOÀN LAO ĐỘNG, PHÒNG CHỐNG CHÁY NỔ, VỆ SINH MÔI TRƯỜNG<span class=\"th\" data-t=\"ข้อ 14 ความปลอดภัยในการทำงาน การป้องกันอัคคีภัยและการระเบิด สุขอนามัยสิ่งแวดล้อม\"></span></h3><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B có trách nhiệm thu gom, dọn dẹp toàn bộ rác thải phát sinh trong quá trình thi công hàng ngày và tập kết đúng nơi quy định. Việc vận chuyển phế thải ra khỏi công trường phải được thực hiện định kỳ mỗi tháng hoặc theo yêu cầu của Bên A.<span class=\"th\" data-t=\"ฝ่าย B มีหน้าที่เก็บรวบรวมและทำความสะอาดขยะทั้งหมดที่เกิดขึ้นในระหว่างการก่อสร้างทุกวัน และนำไปรวบรวมไว้ ณ จุดที่กำหนด การขนย้ายเศษวัสดุเหลือทิ้งออกจากสถานที่ก่อสร้างต้องดำเนินการเป็นระยะทุกเดือนหรือตามที่ฝ่าย A ร้องขอ\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Nếu Bên B không đảm bảo vệ sinh hiện trường, Bên A có quyền thuê đơn vị khác dọn dẹp thay và toàn bộ chi phí sẽ do Bên B chịu.<span class=\"th\" data-t=\"หากฝ่าย B ไม่รักษาความสะอาดของสถานที่ก่อสร้าง ฝ่าย A มีสิทธิจ้างหน่วยงานอื่นมาทำความสะอาดแทน และค่าใช้จ่ายทั้งหมดเป็นภาระของฝ่าย B\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B tự trang bị đầy đủ phương tiện, thiết bị, dụng cụ bảo hộ lao động, an toàn thi công và chịu hoàn toàn trách nhiệm về an toàn lao động, phòng chống cháy nổ và bảo vệ môi trường trong suốt quá trình thi công.<span class=\"th\" data-t=\"ฝ่าย B จัดหาพาหนะ อุปกรณ์ เครื่องมือ และอุปกรณ์ป้องกันอันตรายส่วนบุคคลสำหรับแรงงาน รวมถึงอุปกรณ์ความปลอดภัยในการก่อสร้างให้ครบถ้วนด้วยตนเอง และรับผิดชอบแต่เพียงฝ่ายเดียวต่อความปลอดภัยในการทำงาน การป้องกันอัคคีภัยและการระเบิด และการคุ้มครองสิ่งแวดล้อมตลอดระยะเวลาการก่อสร้าง\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Tai nạn lao động, tổn thất tài sản hoặc sự cố an toàn do lỗi của Bên B hoặc nhân sự Bên B được xử lý theo pháp luật, bảo hiểm và Điều 15. Không loại trừ trách nhiệm pháp luật bắt buộc của Bên A trong mọi trường hợp.<span class=\"th\" data-t=\"อุบัติเหตุจากการทำงาน ความสูญเสียทรัพย์สิน หรือเหตุการณ์ด้านความปลอดภัยที่เกิดจากความผิดของฝ่าย B หรือบุคลากรของฝ่าย B ให้ดำเนินการตามกฎหมาย การประกันภัย และข้อ 15 ทั้งนี้ ไม่เป็นการยกเว้นความรับผิดตามกฎหมายที่เป็นข้อบังคับของฝ่าย A ไม่ว่ากรณีใด ๆ\"></span></p><p>14.5. Việc áp dụng hình thức xử phạt hợp đồng về HSE (nếu có) phải được mô tả rõ phần nghĩa vụ bị vi phạm và tuân thủ giới hạn phạt tại Điều 9; phạt hành chính của cơ quan nhà nước không phải là phạt hợp đồng và không được gộp nhầm khi tính chế tài.<span class=\"th\" data-t=\"14.5. การใช้มาตรการลงโทษตามสัญญาเกี่ยวกับ HSE (ถ้ามี) ต้องระบุอย่างชัดเจนถึงภาระหน้าที่ที่ถูกละเมิด และต้องเป็นไปตามเพดานค่าปรับตามข้อ 9 ค่าปรับทางปกครองของหน่วยงานของรัฐไม่ใช่ค่าปรับตามสัญญา และต้องไม่นำมารวมโดยผิดพลาดในการคำนวณมาตรการลงโทษ\"></span></p><h3 class=\"art\" data-n=\"15\">ĐIỀU 15. BỒI THƯỜNG THIỆT HẠI<span class=\"th\" data-t=\"ข้อ 15 การชดใช้ค่าเสียหาย\"></span></h3><p class=\"lv0 bl\"><span class=\"lb\">•</span>Bên B phải chịu hoàn toàn trách nhiệm và bồi thường mọi thiệt hại, tổn thất và chi phí phát sinh đối với Bên A trong các trường hợp sau :<span class=\"th\" data-t=\"ฝ่าย B ต้องรับผิดชอบแต่เพียงฝ่ายเดียวและชดใช้ความเสียหาย ความสูญเสีย และค่าใช้จ่ายทั้งหมดที่เกิดขึ้นแก่ฝ่าย A ในกรณีดังต่อไปนี้\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Tổn hại về sức khỏe, tính mạng, tai nạn lao động hoặc bệnh nghề nghiệp của bất kỳ cá nhân nào, xảy ra trong hoặc liên quan đến quá trình thi công, hoàn thành công trình, sửa chữa sai sót, nếu nguyên nhân xuất phát từ lỗi, hành vi, thiết bị, hoặc nhân sự của Bên B.<span class=\"th\" data-t=\"ความเสียหายต่อสุขภาพ ชีวิต อุบัติเหตุจากการทำงาน หรือโรคจากการประกอบอาชีพของบุคคลใด ๆ ที่เกิดขึ้นในระหว่างหรือเกี่ยวเนื่องกับการก่อสร้าง การทำให้งานก่อสร้างแล้วเสร็จ การแก้ไขข้อบกพร่อง หากสาเหตุมาจากความผิด การกระทำ อุปกรณ์ หรือบุคลากรของฝ่าย B\"></span></p><p class=\"lv0 bl\"><span class=\"lb\">•</span>Mất mát, hư hỏng tài sản (bao gồm cả phần công trình đang thi công và công trình hiện hữu, trong phạm vi thiệt hại do lỗi hoặc vi phạm của Bên B gây ra) của Bên A hoặc bên thứ ba trong hoặc ngoài phạm vi công trường, do lỗi hoặc bất cẩn của Bên B<span class=\"th\" data-t=\"การสูญหายหรือความเสียหายของทรัพย์สิน (รวมถึงส่วนของงานก่อสร้างที่อยู่ระหว่างดำเนินการและงานก่อสร้างที่มีอยู่เดิม ภายในขอบเขตความเสียหายที่เกิดจากความผิดหรือการละเมิดของฝ่าย B) ของฝ่าย A หรือบุคคลที่สามทั้งภายในและภายนอกพื้นที่หน้างาน อันเกิดจากความผิดหรือความประมาทเลินเล่อของฝ่าย B\"></span></p><p class=\"lv2 bl\"><span class=\"lb\">•</span>Mỗi Bên chịu trách nhiệm đối với thiệt hại do lỗi hoặc vi phạm của mình theo quy định pháp luật; không miễn trừ toàn bộ trách nhiệm của Bên A chỉ vì Bên A không cố ý hoặc không có sơ suất nghiêm trọng.<span class=\"th\" data-t=\"แต่ละฝ่ายต้องรับผิดต่อความเสียหายที่เกิดจากความผิดหรือการละเมิดของตนตามบทบัญญัติของกฎหมาย ฝ่าย A ไม่ได้รับการยกเว้นความรับผิดทั้งหมดเพียงเพราะฝ่าย A ไม่ได้กระทำโดยเจตนาหรือไม่ได้ประมาทเลินเล่ออย่างร้ายแรง\"></span></p><p>15.4. Bồi thường thiệt hại được yêu cầu trên cơ sở thiệt hại thực tế, trực tiếp, có căn cứ chứng minh, quan hệ nhân quả và nghĩa vụ hạn chế tổn thất. Phần chênh lệch hợp lý khi thuê nhà thầu thay thế, chi phí khắc phục và trách nhiệm được chủ đầu tư yêu cầu hợp lệ do lỗi Bên B được xem xét theo Phụ lục 04; không chuyển giao tự động mọi chế tài của chủ đầu tư cho Bên B. Trong phạm vi pháp luật cho phép, thiệt hại được xem xét còn gồm khoản lợi trực tiếp đáng lẽ được hưởng nhưng bị mất do vi phạm, nếu chứng minh được; không mặc nhiên loại trừ chỉ vì được gọi là mất lợi nhuận. Chi phí giám định, tháo dỡ, vận chuyển, thi công lại và ngăn ngừa tổn thất được bồi hoàn khi cần thiết, hợp lý, có chứng cứ và thuộc trách nhiệm Bên B. Giới hạn phạt tại Điều 9 không phải giới hạn bồi thường; bảo lãnh và tiền giữ lại không phải mức trần trách nhiệm của Bên B. Không thu hồi hai lần cho cùng thiệt hại, kể cả khoản đã được bảo hiểm bồi trả.<span class=\"th\" data-t=\"15.4. การเรียกร้องการชดใช้ค่าเสียหายให้กระทำบนพื้นฐานของความเสียหายที่เกิดขึ้นจริง โดยตรง มีหลักฐานพิสูจน์ได้ มีความสัมพันธ์เชิงเหตุและผล และมีหน้าที่บรรเทาความเสียหาย ส่วนต่างที่สมเหตุสมผลจากการว่าจ้างผู้รับเหมารายใหม่มาทดแทน ค่าใช้จ่ายในการแก้ไข และความรับผิดที่เจ้าของโครงการเรียกร้องโดยชอบอันเกิดจากความผิดของฝ่าย B จะได้รับการพิจารณาตามภาคผนวก 04 ทั้งนี้ มาตรการลงโทษทั้งหมดของเจ้าของโครงการจะไม่ถูกโอนมายังฝ่าย B โดยอัตโนมัติ ภายในขอบเขตที่กฎหมายอนุญาต ความเสียหายที่นำมาพิจารณายังรวมถึงผลประโยชน์โดยตรงที่ควรจะได้รับแต่สูญเสียไปเนื่องจากการละเมิด หากพิสูจน์ได้ และจะไม่ถูกยกเว้นโดยปริยายเพียงเพราะถูกเรียกว่าการสูญเสียกำไร ค่าใช้จ่ายในการตรวจสอบพิสูจน์ การรื้อถอน การขนส่ง การก่อสร้างใหม่ และการป้องกันความสูญเสีย จะได้รับการชดใช้เมื่อมีความจำเป็น สมเหตุสมผล มีหลักฐาน และอยู่ในความรับผิดชอบของฝ่าย B เพดานค่าปรับตามข้อ 9 ไม่ใช่เพดานการชดใช้ค่าเสียหาย หนังสือค้ำประกันและเงินประกันผลงานที่กักไว้ไม่ใช่เพดานความรับผิดของฝ่าย B ห้ามเรียกคืนซ้ำสองครั้งสำหรับความเสียหายเดียวกัน รวมถึงจำนวนที่บริษัทประกันภัยได้ชดใช้แล้ว\"></span></p><h3 class=\"art\" data-n=\"16\">ĐIỀU 16. TRƯỜNG HỢP BẤT KHẢ KHÁNG<span class=\"th\" data-t=\"ข้อ 16 เหตุสุดวิสัย\"></span></h3><p class=\"lv2 bl\"><span class=\"lb\">•</span>Bất khả kháng là sự kiện khách quan, không thể lường trước và không thể khắc phục dù đã áp dụng mọi biện pháp cần thiết trong khả năng cho phép theo pháp luật Việt Nam. Thiếu vốn, tăng giá thông thường hoặc thiếu nhân công do quản lý không đương nhiên là bất khả kháng.<span class=\"th\" data-t=\"เหตุสุดวิสัยคือเหตุการณ์ที่เกิดขึ้นโดยปรากฏชัดตามวัตถุวิสัย ไม่อาจคาดหมายล่วงหน้าได้ และไม่อาจแก้ไขได้แม้จะได้ใช้มาตรการที่จำเป็นทั้งปวงตามความสามารถที่กฎหมายเวียดนามอนุญาตแล้ว การขาดเงินทุน ราคาที่เพิ่มขึ้นตามปกติ หรือการขาดแคลนแรงงานอันเกิดจากการบริหารจัดการ ไม่ถือเป็นเหตุสุดวิสัยโดยอัตโนมัติ\"></span></p><p class=\"lv2 bl\"><span class=\"lb\">•</span>Bên bị ảnh hưởng thông báo bằng văn bản trong <strong><span class=\"fx\" data-k=\"SỐ NGÀY\"></span></strong> ngày từ khi có thể thông báo, cung cấp bằng chứng hợp lý và thực hiện biện pháp giảm thiểu thiệt hại. Giấy xác nhận cơ quan có thẩm quyền được nộp nếu pháp luật yêu cầu hoặc có thể thu thập hợp lý.<span class=\"th\" data-t=\"ฝ่ายที่ได้รับผลกระทบต้องแจ้งเป็นหนังสือภายใน 【SỐ NGÀY】 วัน นับแต่เมื่อสามารถแจ้งได้ ให้หลักฐานที่สมเหตุสมผล และดำเนินมาตรการบรรเทาความเสียหาย ใบรับรองของหน่วยงานที่มีอำนาจให้ยื่นหากกฎหมายกำหนดหรือสามารถรวบรวมได้อย่างสมเหตุสมผล\"></span></p><p class=\"lv2 bl\"><span class=\"lb\">•</span>Trong phạm vi ảnh hưởng thực tế của sự kiện bất khả kháng, Bên bị ảnh hưởng có thể được miễn trách nhiệm theo pháp luật, nhưng vẫn phải thực hiện phần nghĩa vụ không bị ảnh hưởng, giảm thiểu thiệt hại và thông báo tiến độ mới. Nếu sự kiện kéo dài quá <strong><span class=\"fx\" data-k=\"SỐ NGÀY\"></span></strong> ngày, các Bên thương lượng tiếp tục, sửa đổi hoặc chấm dứt hợp đồng theo Điều 8 và pháp luật.<span class=\"th\" data-t=\"ภายในขอบเขตผลกระทบที่เกิดขึ้นจริงของเหตุสุดวิสัย ฝ่ายที่ได้รับผลกระทบอาจได้รับการยกเว้นความรับผิดตามกฎหมาย แต่ยังคงต้องปฏิบัติตามภาระหน้าที่ส่วนที่ไม่ได้รับผลกระทบ บรรเทาความเสียหาย และแจ้งกำหนดการใหม่ หากเหตุการณ์ยืดเยื้อเกินกว่า 【SỐ NGÀY】 วัน คู่สัญญาจะเจรจากันเพื่อดำเนินการต่อ แก้ไขเพิ่มเติม หรือยุติสัญญาตามข้อ 8 และกฎหมาย\"></span></p><p>Trường hợp phát sinh tranh chấp giữa các bên do sự kiện bất khả kháng xảy ra hoặc kéo dài thì tranh chấp sẽ được giải quyết theo quy định của pháp luật.<span class=\"th\" data-t=\"ในกรณีที่เกิดข้อพิพาทระหว่างคู่สัญญาอันเนื่องมาจากการเกิดขึ้นหรือการยืดเยื้อของเหตุสุดวิสัย ข้อพิพาทดังกล่าวจะได้รับการระงับตามบทบัญญัติของกฎหมาย\"></span></p><p>16.5. Các Bên lập biên bản ảnh hưởng đến tiến độ và bảo đảm an toàn công trường. Không Bên nào được miễn trách nhiệm đối với nghĩa vụ không bị ảnh hưởng bởi sự kiện bất khả kháng.<span class=\"th\" data-t=\"16.5. คู่สัญญาจัดทำรายงานผลกระทบต่อกำหนดการและรับรองความปลอดภัยของหน้างาน ไม่มีฝ่ายใดได้รับการยกเว้นความรับผิดสำหรับภาระหน้าที่ที่ไม่ได้รับผลกระทบจากเหตุสุดวิสัย\"></span></p><h3 class=\"art\" data-n=\"17\">ĐIỀU 17. QUYẾT TOÁN CÔNG TRÌNH VÀ THANH LÝ HỢP ĐỒNG<span class=\"th\" data-t=\"ข้อ 17 การสรุปยอดงานก่อสร้างและการชำระสะสางสัญญา\"></span></h3><p class=\"sub\">17.1 Điều kiện quyết toán: Việc quyết toán chỉ được thực hiện khi Bên B hoàn thành toàn bộ công việc theo hợp đồng và được Bên A nghiệm thu chấp thuận bằng biên bản.<span class=\"th\" data-t=\"17.1 เงื่อนไขการสรุปยอด: การสรุปยอดจะดำเนินการได้ก็ต่อเมื่อฝ่าย B ทำงานทั้งหมดตามสัญญาแล้วเสร็จ และฝ่าย A ได้ตรวจรับและให้ความเห็นชอบเป็นรายงาน\"></span></p><p class=\"lv1\"><span class=\"lb\">17.2</span> Nội dung quyết toán:<span class=\"th\" data-t=\"เนื้อหาการสรุปยอด:\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Khối lượng công việc đã thực hiện theo hợp đồng;<span class=\"th\" data-t=\"ปริมาณงานที่ได้ดำเนินการตามสัญญา;\"></span></p><p class=\"lv1 bl\"><span class=\"lb\">•</span>Khối lượng phát sinh tăng/giảm (nếu có) được quyết toán theo văn bản phê duyệt hợp lệ của các Bên và Điều 20 của Hợp đồng, bao gồm cơ chế xử lý công việc khẩn cấp tại khoản 20.3 <span class=\"th\" data-t=\"ปริมาณงานที่เกิดเพิ่มขึ้น/ลดลง (ถ้ามี) ให้สรุปยอดตามเอกสารอนุมัติที่ชอบของคู่สัญญาและข้อ 20 ของสัญญา รวมถึงกลไกการจัดการงานเร่งด่วนตามข้อย่อย 20.3\"></span></p><p>17.3. Thanh lý hợp đồng được thực hiện trong vòng <strong><span class=\"fx\" data-k=\"30\"></span></strong> ngày làm việc kể từ khi hồ sơ quyết toán hợp lệ, các khoản không tranh chấp được xác nhận và xuất đủ hóa đơn đúng quy định, trừ trường hợp pháp luật quy định khác. Nghĩa vụ bảo hành, bồi thường và giải quyết tranh chấp phát sinh trước ngày thanh lý vẫn tồn tại theo thỏa thuận và pháp luật.<span class=\"th\" data-t=\"17.3. การชำระสะสางสัญญาให้ดำเนินการภายใน 【30】 วันทำการ นับแต่เมื่อเอกสารสรุปยอดถูกต้องครบถ้วน รายการที่ไม่มีข้อพิพาทได้รับการยืนยัน และออกใบแจ้งหนี้/ใบกำกับภาษีครบถ้วนตามที่กำหนด เว้นแต่กฎหมายกำหนดไว้เป็นอย่างอื่น ภาระหน้าที่ในการรับประกัน การชดใช้ค่าเสียหาย และการระงับข้อพิพาทที่เกิดขึ้นก่อนวันชำระสะสางยังคงมีผลตามข้อตกลงและกฎหมาย\"></span></p><p>17.4. Nghĩa vụ bảo hành, bồi thường thiệt hại, hoàn trả tạm ứng còn thiếu, bảo mật và giải quyết tranh chấp tiếp tục có hiệu lực sau thanh lý/chấm dứt trong phạm vi theo Hợp đồng và pháp luật.<span class=\"th\" data-t=\"17.4. ภาระหน้าที่ในการรับประกันผลงาน การ
